讓人分不清楚。 例如：一還一，二還二，愛搞清楚，莫湖鰍合䱻。","example":""},{"word":"服侍阿公樣","pinyin":"fug sii aˊ gungˊ iong","def":"如侍奉爺爺一般周到殷勤。","example":""},{"word":"暈餔娘","pinyin":"funˇ buˊ ngiongˇ","def":"很想娶老婆。 例如：厥哥半年來暈餔娘，屋下罕得看著人。","example":""},{"word":"覂人飯碗","pinyin":"fungˋ nginˇ fan vonˋ","def":"讓人失去工作或賴以維生的工具。 例如：一儕人个行踏愛有準則，定著毋好做該覂人飯碗个情事。","example":""},{"word":"風神碌碌","pinyin":"fungˊ siinˇ lugˋ lugˋ","def":"威風凜凜，意氣揚揚的樣子。 例如：佢毋會挶派頭，公司開恁大間也毋會風神碌碌，異難得。","example":""},{"word":"紅噹噹仔","pinyin":"fungˇ dang dang eˋ","def":"鮮豔的紅，有紅過頭意味，偏負面。 例如：該嘴脣膏到紅噹噹仔，顛倒無較靚。","example":""},{"word":"嫁出男，賣出女","pinyin":"ga cudˋ namˇ，mai cudˋ ngˋ","def":"指彼此之間已無瓜葛，不再有牽連的關係。","example":""},{"word":"假砸","pinyin":"gaˋ zabˋ","def":"裝健壯。 例如：麼个天時？你著短袖仔，假砸！寒著就知哩！","example":""},{"word":"家神透外鬼","pinyin":"gaˊ siinˇ teu ngoi guiˋ","def":"喻吃裡扒外。","example":""},{"word":"呷呷滾","pinyin":"gab gab gunˋ","def":"很喜歡說且話多不停。 例如：佢呷呷滾麼个就講，完全無準則。","example":""},{"word":"合鬼毋相同","pinyin":"gabˋ guiˋ mˇ xiongˊ tungˇ","def":"個性怪異，與人不易相處。 例如：佢該人正經係合鬼毋相同，你莫插佢。","example":""},{"word":"喈喈滾","pinyin":"gaiˇ gaiˇ gunˋ","def":"怨聲連連。 例如：歸隻牛毋見就無講，一支毛挷忒斯喈喈滾。","example":""},{"word":"敢生敢死","pinyin":"gamˋ sangˊ gamˋ xiˋ","def":"為人行事大膽、不顧生死。 例如：佢个人敢生敢死，又合當會謀，賺異多身家。","example":""},{"word":"監你賠","pinyin":"gamˊ nˇ poiˇ","def":"要求你賠償。 例如：你莫儘採搞人个東西，係講搣壞忒，人斯會監你賠。","example":""},{"word":"教料（教招）","pinyin":"gau liau (gau zeuˊ)","def":"教養、管教。「無教招」指父母管教不夠嚴，孩子不知管教之意；「早死爺娘，無人教招」指人沒有教養。","example":""},{"word":"攪潭精","pinyin":"gauˋ tamˇ jinˊ","def":"指搬弄是非，搞破壞的人。 例如：該隻攪潭精當會燒壞話，舞到歸莊人冤家泌背。","example":""},{"word":"交陪","pinyin":"gauˊ boiˇ","def":"交往、來往。 例如：你這恁多朋友毋係賭徼就係啉酒，不准你同佢兜交陪！","example":""},{"word":"交手亂串","pinyin":"gauˊ suˋ lon con","def":"形容做一件事情，眾人的意見彼此糾葛。常與「七手八腳」連用。 例如：做事，有時人多還較慘，七手八腳，交手亂串。","example":""},{"word":"教書先生个手帕","pinyin":"gauˊ suˊ xinˊ sangˊ ge suˋ pa","def":"包書，與包輸諧音，意謂輸定了。","example":""},{"word":"面舐舐","pinyin":"mien seˊ seˊ","def":"不知羞恥的樣子。","example":""},{"word":"拘禮","pinyin":"giˊ liˊ","def":"被禮數所拘限。 例如：大家恁熟事，毋使拘禮。","example":""},{"word":"唊嘴","pinyin":"giab zoi","def":"以嘴巴開合不止，指稱多話說個不停的樣子。「唊嘴嫲」表話多的女人。 例如：佢當唊嘴，見堵著人就講無停。","example":""},{"word":"遽板（緊板）","pinyin":"giagˋ banˋ (ginˋ banˋ)","def":"做事手腳伶俐，不會拖泥帶水。 例如：毋使愁，佢當遽板，這件事佢兩下半就做得好。","example":""},{"word":"撿人食","pinyin":"giamˋ nginˇ siid","def":"指供養他人或給人食物吃。 例如：佢除忒同隔壁老人家拚掃屋下，還愛撿人食，實在還有愛心哦！","example":""},{"word":"頸偏偏仔（頸橫橫仔）","pinyin":"giangˋ pienˊ pienˊ eˋ (giangˋ vangˇ vangˇ eˋ)","def":"桀驁不服的樣子。 例如：講佢兩句定定，佢就毋歡喜，頸偏偏仔愛相打樣。","example":""},{"word":"驚燒怕冷","pinyin":"giangˊ seuˊ pa langˊ","def":"指一個人做事沒有魄力，這也怕那也怕，謂做事畏縮不果斷。 例如：你正學出師毋好驚燒怕冷，正會做得成。","example":""},{"word":"驚驚躡躡","pinyin":"giangˊ giangˊ ngiabˋ ngiabˋ","def":"行為舉止躲躲閃閃的樣子。 例如：佢毋知做麼个虧心事，正會恁樣驚驚躡躡。","example":""},{"word":"驚驚忸忸","pinyin":"giangˊ giangˊ nug nug","def":"畏畏縮縮的樣子。 例如：自從該擺比賽得獎過後，佢就變到當有自信，做事毋會過驚驚忸忸。","example":""},{"word":"雞胲仙","pinyin":"gieˊ goiˊ xienˊ","def":"喻吹牛大王。 例如：雞胲仙講个話聽過就好，毋使忒認真啦！","example":""},{"word":"雞栖下絡食","pinyin":"gieˊ ji haˊ logˋ siid","def":"喻不知奮發上進，只懂在家爭利，撿現成的；亦說人毫無格局，只會在小地方與人爭奪。","example":""},{"word":"決截","pinyin":"giedˋ jiedˋ","def":"形容做事果斷，動作乾脆不拖拉。 例如：堵著要緊个時節，佢做事當決截。","example":""},{"word":"結舌締碓","pinyin":"giedˋ sad di doi","def":"說話結結巴巴的樣子。 例如：阿明講話毋清楚、結舌締碓，又好講話。","example":""},{"word":"奸鬼仔","pinyin":"gienˊ guiˋ eˇ","def":"推諉、不負責任的人。 例如：愛負責任个事，自家毋做喊人去做，正經係一個奸鬼仔。","example":""},{"word":"奸宰","pinyin":"gienˊ zaiˋ","def":"原是指奸詐的宰相，今形容奸詐，或泛指奸詐的人。 例如：該隻人正經異奸宰，尋佢𢯭手，係無好空，佢正無愛揈你。","example":""},{"word":"噭眵嫲","pinyin":"gieu ziiˊ maˇ","def":"指愛哭的女孩。 例如：毋好動啊著就噭，會分人笑講係噭眵嫲。","example":""},{"word":"狗呷烏蠅","pinyin":"gieuˋ gab vuˊ inˇ","def":"本意為狗張開嘴要咬蒼蠅，喻無實效的動作。 例如：歸朝晨聽佢講戇話，就像狗呷烏蠅个樣仔。","example":""},{"word":"狗掀門簾","pinyin":"gieuˋ ienˊ munˇ liamˇ","def":"比喻人只靠一張嘴，光說不練的人。 例如：該隻人就像狗掀門簾，全食一張嘴，信用毋得。","example":""},{"word":"狗挷犁（狗拖犁）","pinyin":"gieuˋ bangˊ laiˇ (gieuˋ toˊ laiˇ)","def":"喻非其能力所及，無法勝任。 例如：喊細人仔做恁重个事，就像狗挷犁樣仔，仰會做得。","example":""},{"word":"狗打屁","pinyin":"gieuˋ daˋ pi","def":"放狗屁，喻無用之話語。 例如：聽佢在該狗打屁，厥話聽毋得啦。","example":""},{"word":"嬌尸撥撥","pinyin":"gieuˊ siiˊ bad bad","def":"很會撒嬌。 例如：恁大人吔，還嬌尸撥撥，還見笑。","example":""},{"word":"腳底打脈","pinyin":"giogˋ daiˋ daˋ magˋ","def":"腳底量脈搏，「尋毋著症頭」，表示做事抓不到重點。 例如：尋拳頭師傅起屋正經係腳底打脈，完全毋使望。","example":""},{"word":"腳撐撐仔","pinyin":"giogˋ cang cang eˋ","def":"一般泛指漠不關心，站在那裡直挺挺不肯動，喻人心生叛逆，不聽從規勸，不肯順從。 例如：阿貴今年國中二年生吔，厥叔喊佢兜一下凳頭，就腳撐撐仔，全毋肯行前。","example":""},{"word":"腳縮縮仔","pinyin":"giogˋ sugˋ sugˋ eˋ","def":"因為某事而不願前去面對，有退縮不前的意味。 例如：外背無落霜雪，毋會幾冷，莫腳縮縮仔毋敢出門。","example":""},{"word":"挶派頭","pinyin":"giug pai teuˇ","def":"裝成紳士或淑女的模樣，有負面意象。","example":""},{"word":"挶屎轟天","pinyin":"giug siiˋ pang tienˊ","def":"驕傲得很。 例如：你啊！係過恁仔挶屎轟天，你看麼人愛插你。","example":""},{"word":"挶身分","pinyin":"giug siinˊ fun","def":"為顯示身分而裝腔作勢。 例如：佢盡會挶身分，驚人毋知佢有錢樣仔。","example":""},{"word":"過房","pinyin":"go fongˇ","def":"將兒子過繼給兄弟。 例如：佢無降倈仔，厥哥个倈仔過房一個分佢頂香火。","example":""},{"word":"過手","pinyin":"go suˋ","def":"經手；得手。 例如：數个事情總下阿美過手个，係有問題尋佢問。 例如：吂過手个東西，毋使恁暢。","example":""},{"word":"過嘴","pinyin":"go zoi","def":"傳話、加油添醋，另有被人批評之意。 例如：你知就好，毋好過嘴知無？ 例如：你自家做好來，莫分人過嘴。","example":""},{"word":"過橋丟楄","pinyin":"go kieuˇ diuˊ bienˋ","def":"喻忘恩負義。 例如：無採大家為著佢个事情跳上跌落，事情過忒，佢嗄過橋丟楄，毋識人哩。","example":""},{"word":"過詐","pinyin":"go za","def":"通過、渡過；得手、達到目的。 例如：菜脯晒到差毋多，過晒加一日就過詐哩。 例如：佢分詐騙電話騙過詐，了忒幾下十萬。","example":""},{"word":"膏著人","pinyin":"goˇ doˋ nginˇ","def":"與人有染。","example":""},{"word":"膏嗟","pinyin":"goˇ jiaˇ","def":"柔性遊說他人接受。 例如：佢當挶屎，愛人膏嗟佢，佢正愛去。","example":""},{"word":"該暢","pinyin":"goiˊ tiong","def":"活該。 例如：喊你莫搞你還緊搞，玩具搣壞忒，這下斯該暢哩！","example":""},{"word":"觀音跌落井（觀音娘跌落井）","pinyin":"gonˊ imˊ diedˋ log jiangˋ (gonˊ imˊ ngiongˇ diedˋ log jiangˋ)","def":"「罅佛」，諧音「罅咈」，表示做得很辛苦或表示很勉強。","example":""},{"word":"說到會企","pinyin":"sodˋ do voi kiˊ","def":"超過應有的讚美，有點過度的誇讚。 例如：佢當會煮食，歸莊人就說到會企。","example":""},{"word":"講花蓼","pinyin":"gongˋ faˊ liauˊ","def":"說謊話。 例如：頭擺吾姆家教盡嚴，細人仔講花蓼，會分佢扭嘴角。","example":""},{"word":"講毋會分醒","pinyin":"gongˋ mˇ voi funˊ xiangˋ","def":"再三勸說，仍執迷不悟。","example":""},{"word":"講戇話","pinyin":"gongˋ ngong fa","def":"只講不盡情理的話。 例如：講戇話个，喊𠊎一百個銀摎佢換十個銀，係你，你敢愛？","example":""},{"word":"講頭知尾","pinyin":"gongˋ teuˇ diˊ miˊ","def":"聞一知十，觸類旁通。 例如：該隻細人仔一踢三通、講頭知尾。","example":""},{"word":"講天缺","pinyin":"gongˋ tienˊ kiedˋ","def":"說誇大、不切實際的事。 例如：聽佢講天缺，毋當去看書。","example":""},{"word":"講脧話","pinyin":"gongˋ zoiˊ fa","def":"指所說的話很不盡情理，屬較不雅用語。 例如：講脧話，𠊎會同佢結婚？又毋係發癲正得。","example":""},{"word":"講番話","pinyin":"gongˋ fanˊ fa","def":"說人家聽不懂的話。","example":""},{"word":"講猴話","pinyin":"gongˋ heuˇ fa","def":"講俏皮話，開玩笑。","example":""},{"word":"姑換嫂","pinyin":"guˊ von soˋ","def":"丈夫的姊妹與自己的兄弟聯姻。","example":""},{"word":"砉精","pinyin":"guag jinˊ","def":"形容人精明到極點，也可指植物的果實飽滿，欲增加程度亦可說「砉瀝精」。 例如：莫看佢討个餔娘戇戇，降个倈仔斯砉精。 例如：今年年冬當好，翻耕禾粒粒砉精。","example":""},{"word":"怪怨","pinyin":"guai ien","def":"埋怨、責怪。 例如：考試考毋好愛檢討自家，莫怪怨先生出个題目忒難。","example":""},{"word":"乖莊","pinyin":"guaiˊ zongˊ","def":"溫順乖巧。 例如：厥妹仔乖莊又知人我，逐儕看著全說到企起來。","example":""},{"word":"慣嘴","pinyin":"guan zoi","def":"同樣的話說多了變成習慣，也可表同樣的東西，吃多了變習慣。 例如：地豆恁好食，食著會慣嘴。 例如：釅茶恁多種，𠊎還係食烏龍茶較慣嘴。","example":""},{"word":"耿性耿性","pinyin":"guenˋ xin guenˋ xin","def":"形容人個性耿直。 例如：阿文哥為人耿性耿性，較倚恃得。","example":""},{"word":"公郎","pinyin":"gungˊ longˇ","def":"尊稱他人的兒子。","example":""},{"word":"哈哈霸霸（哈哈砰砰）","pinyin":"haˇ haˇ ba ba (haˇ haˇ bong bong)【haˋ haˋ bong bong】","def":"指人花樣多，多用於誇大其辭，無中生有；另形容耳聾者與人交談時經常鷄同鴨講、大聲說話的樣子。 例如：該人講話哈哈霸霸，你愛細義兜。","example":""},{"word":"合裁","pinyin":"hab caiˇ","def":"共同裁決事情。 例如：該條農路分水打忒咧，大家來合裁一下愛仰般整。","example":""},{"word":"咍咍呻","pinyin":"hai hai cenˊ","def":"因疲累而唉聲連連。 例如：你搣麼个搣到恁悿，搣到咍咍呻？","example":""},{"word":"懈懈怠怠","pinyin":"hai hai tai tai/haiˋ haiˋ taiˋ taiˋ","def":"喻做事怠惰拖延。 例如：人係試著艱苦，就愛煞煞去分先生看，毋好懈懈怠怠。","example":""},{"word":"憨痴","pinyin":"hamˊ ceˊ","def":"憨貌，形容人講話或做事不知分寸。 例如：仰會恁憨痴，做毋得講个乜同人扡扡出來。","example":""},{"word":"憨搭","pinyin":"hamˊ dabˋ","def":"指不加理智分析，亂管閒事，亦可說「憨憨搭搭」。 例如：正經話無幾多句，憨搭个話講講揫一千擔。","example":""},{"word":"憨牯","pinyin":"hamˊ guˋ","def":"比喻不明事理或老實憨厚的男性。 例如：阿發哥做事情同講話都不褡不膝，正經係大憨牯。","example":""},{"word":"鹹菜形","pinyin":"hamˇ coi hinˇ","def":"喻個性隨和。 例如：佢同麼儕人就合得來，阿爸講佢係鹹菜形。","example":""},{"word":"閒神野鬼","pinyin":"hanˇ siinˇ iaˊ guiˋ","def":"喻無所事事、游手好閒的人，具貶義。 例如：二十歲吔，還日日在該打電動，閒神野鬼樣仔。","example":""},{"word":"行踏【行狀】","pinyin":"hangˇ tab【hangˇ congˋ】","def":"行為舉止。 例如：看厥行踏，定著係有家教个人。","example":""},{"word":"行頭","pinyin":"hangˇ teuˇ","def":"統率、領導、組織事或活動，可做動詞及名詞。 例如：這擺同學會，你來行頭。 例如：這擺打醮做行頭个人係王總理。","example":""},{"word":"好喋","pinyin":"hau de","def":"愛誇口吹牛，但說的未必是真理。 例如：佢該張嘴盡好喋，麼个天文地理就喋得著。","example":""},{"word":"好唧唧仔","pinyin":"hau jid jid eˋ","def":"興致勃勃，帶有負面意涵。 例如：無錢賭徼又還好唧唧仔，實在好賭。","example":""},{"word":"好拔","pinyin":"hau bad","def":"愛現、誇耀。 例如：佢當好拔，做細生日，也請十過張桌。","example":""},{"word":"好鬥牛","pinyin":"hau deu ngiuˇ","def":"生性好鬥的人。 例如：這細人仔當惡，動啊著就撩人尋人相打，實在係好鬥牛。","example":""},{"word":"好做王","pinyin":"hau zo vongˇ","def":"喜歡稱王。","example":""},{"word":"耗漦","pinyin":"hauˊ xiauˇ","def":"人說話虛構或誇大其辭的事。 例如：你講話實在當耗漦，男仔人仰可能會降細人仔？","example":""},{"word":"後來嫲","pinyin":"heu loiˇ maˇ","def":"鄙稱後妻、繼母，具貶義。","example":""},{"word":"後生條仔","pinyin":"heu sangˊ tiauˇ eˋ","def":"年輕小伙子。","example":""},{"word":"猴哥仔","pinyin":"heuˇ goˊ eˋ","def":"指行為不按常規或調皮的人。 例如：該細人仔一下飆上飆下，一下又亂動別人个東西，正經係猴哥仔。","example":""},{"word":"性暴暴仔","pinyin":"xin pau pau eˋ","def":"個性暴躁的樣子。 例如：佢見擺做事就性暴暴仔，故所大家異驚佢。","example":""},{"word":"喜客","pinyin":"hiˋ hagˋ","def":"對人很客氣。 例如：佢當喜客，人客一來就頭頷尾著。","example":""},{"word":"起魯夫","pinyin":"hiˋ luˊ fuˊ","def":"發作粗暴的行為。 例如：莫看佢溫馴溫馴仔，起魯夫个時節，閻王就驚佢。","example":""},{"word":"挾錢","pinyin":"hiabˋ qienˇ","def":"私自收藏錢財或藏匿錢財。","example":""},{"word":"媱嫲頭","pinyin":"hieuˇ maˇ teuˇ","def":"稱無端生事，引人注意的女人。","example":""},{"word":"媱妮妮","pinyin":"hieuˇ ni ni","def":"搔首弄姿，很騷包的樣子。","example":""},{"word":"座爽","pinyin":"co songˋ","def":"造成浪費。 例如：輒常聽人講「座食莫座爽」，就係喊𫣆兜愛儆惜食物，毋好耗爽。","example":""},{"word":"形投仔","pinyin":"hinˇ dauˇ eˋ","def":"神情儀態。 例如：電視肚做戲个，該形投仔看起來當生趣。","example":""},{"word":"耗造","pinyin":"ho co","def":"不愛惜物資。 例如：毋好恁耗造，還用得个東西毋好擲忒。","example":""},{"word":"好肚屎","pinyin":"hoˋ duˋ siiˋ","def":"謂婦人生的兒女很有成就。 例如：厥心臼好肚屎，降个毋係博士就係做頭家。","example":""},{"word":"好毋知足","pinyin":"hoˋ mˇ diˊ jiugˋ","def":"已經很好了仍再要求，用在貶義，有貪求無厭的意思。 例如：你這人哦！好毋知足，日仔過到恁舒爽，還緊呻歪命。","example":""},{"word":"何麼死苦","pinyin":"hoˇ maˋ xiˋ kuˋ","def":"何苦來哉。","example":""},{"word":"學話","pinyin":"hog fa","def":"背後說人壞話。 例如：毋好亂學話，無斯會分自家帶來麻煩。","example":""},{"word":"發性","pinyin":"fadˋ xin","def":"發脾氣。 例如：人又無講佢，做麼个好好恬恬發性，恁奇怪。","example":""},{"word":"學嘴學鼻","pinyin":"hog zoi hog pi","def":"模仿他人的語氣說話。 例如：佢像鸚哥樣仔，當會學嘴學鼻。","example":""},{"word":"喝喝咄咄","pinyin":"hoiˇ hoiˇ dodˋ dodˋ/hodˋ hodˋ dodˋ dodˋ","def":"厲聲叱罵、罵不停。 例如：正寫毋著一隻字，就喝喝咄咄，壓力當大你知無？","example":""},{"word":"夜摸仔","pinyin":"ia moˊ eˋ","def":"指在夜間工作或活動的人，即夜貓子。","example":""},{"word":"扡壁","pinyin":"iaˋ biagˋ","def":"手抓牆壁，比喻困苦求助的狀態。 例如：天光日愛考試吔，佢到今還在該睡，任講都毋聽，正經會扡壁。","example":""},{"word":"掗等","pinyin":"aˇ denˋ","def":"把持著、掌握著。 例如：阿明个月給分厥餔娘掗等，一隻月伸一萬個銀好使定定。","example":""},{"word":"扡著屎","pinyin":"iaˋ doˋ siiˋ","def":"欲得反失。 例如：佢見擺就貪利便，車仔儘採停，這擺扡著屎哩，分警察開罰單。","example":""},{"word":"扡頸【扡胲】","pinyin":"iaˋ giangˋ【iaˋ goiˊ】","def":"抓脖子，是表示遇著困難待解決。 例如：賺無三個錢，愛畜一群大細，正經會扡頸，愛仰結煞正好？","example":""},{"word":"扡爪","pinyin":"iaˋ zauˋ","def":"表勤勞、很積極想賺錢，一般用在婦女身上。 例如：厥老公過身，好得佢恁扡爪，五個細人仔正畜得起。","example":""},{"word":"一家一務","pinyin":"idˋ gaˊ idˋ vu","def":"各人有各人的事務，不必干涉他人。 例如：一家一務，你顧好自家就好，毋好去插人屋下个事。","example":""},{"word":"冤家泌背","pinyin":"ienˊ gaˊ bi boi","def":"形容吵得不可開交。 例如：現下个電視，日日就在報冤家泌背个新聞，莫看較贏。","example":""},{"word":"冤家羅債","pinyin":"ienˊ gaˊ loˇ zai","def":"與人吵架打罵，結怨結仇。 例如：共家人愛和和挼挼，毋好一日到暗冤家羅債。","example":""},{"word":"圓扁嘴","pinyin":"ienˇ bienˋ zoi","def":"指一個人比較會改變立場，很圓滑取巧。 例如：你毋好恁圓扁嘴，緊摎人詏該有个無个。 例如：佢个人盡慶，一張圓扁嘴，明明烏个分佢講到變白个。","example":""},{"word":"延纏","pinyin":"ienˇ canˇ","def":"向後推遲耽擱。 例如：這事愛遽遽做忒，莫過延纏吔。","example":""},{"word":"妖精","pinyin":"ieuˊ jinˊ","def":"形容喜歡興風作浪的樣子，具貶義。 例如：該儕人盡妖精，專門講人个壞話。","example":""},{"word":"養蛇食雞","pinyin":"iongˊ saˇ siid gieˊ","def":"養蛇吃雞，喻姑息養奸。","example":""},{"word":"癢噦","pinyin":"iongˇ veˊ","def":"形容動不動就哭的情形，或是稍有一點皮毛之痛就呼天搶地，毫無疼痛忍受度之人。 例如：這細人仔當癢噦，你莫同佢尞較贏。 例如：佢分蚊仔叼著，爪溜皮定定，斯噭到噦噦滾，實在還癢噦。","example":""},{"word":"噦嘶","pinyin":"veˇ seˊ","def":"不斷哭喊，多用小孩子身上較多。 例如：佢還癢噦哦，注一下射定定，就噭到噦嘶。","example":""},{"word":"有出有入","pinyin":"iuˊ cudˋ iuˊ ngib","def":"指人或財務金錢等有進有出。 例如：這數有出有入，捍數个人愛記清楚來。 例如：錢銀有出有入，愛用就用，知好省斯好，毋好昶齧察。","example":""},{"word":"有家有竇【有家有當】","pinyin":"iuˊ gaˊ iuˊ deu【iuˊ gaˊ iuˊ dong】","def":"有家庭，有妻兒子女，相反詞為「無家無竇（無家無當）」。 例如：𠊎有家有竇，過年過節定著愛轉屋下。","example":""},{"word":"有來有去","pinyin":"iuˊ loiˇ iuˊ hi","def":"形容言語滔滔不止，說得煞有其事貌；有來往，交情良好。 例如：阿財哥臺頂講到有來有去，毋知在該講麼个，講毋知煞。 例如：親戚之間有來有去，感情正會長久。","example":""},{"word":"遊遊野野","pinyin":"iuˇ iuˇ iaˊ iaˊ","def":"遊蕩無所事事。 例如：這個後生人下班後煞猛進修，毋會遊遊野野，當多人阿腦。","example":""},{"word":"祭衰人","pinyin":"ji soiˊ nginˇ","def":"笑死人、丟臉。 例如：食到恁多歲吔，連買隻東西都毋會，祭衰人正得。","example":""},{"word":"接腳女（接腳妹）","pinyin":"jiabˋ giogˋ ngˋ (jiabˋ giogˋ moi)","def":"若某男妻死，另娶某女入門，則稱某女為某男前妻父母的接腳女。 例如：阿明伯个接腳女，這擺過年愛來認親，異曉得。","example":""},{"word":"占先行","pinyin":"jiam xienˊ hangˇ","def":"搶先。 例如：厥手腳當遽，一下仔無看著，就分佢占先行。","example":""},{"word":"尖燒","pinyin":"jiamˊ seuˊ","def":"擠進人群中湊熱鬧。 例如：這片人都罅擺吔，你又還愛去同人尖燒。 例如：該張桌既經坐淰吔，你還去同人尖燒。","example":""},{"word":"靚裝","pinyin":"jiangˊ zongˊ","def":"穿著打扮得體。 例如：佢今晡日一身靚裝，毋知有麼个事情？","example":""},{"word":"僬懠","pinyin":"jiauˇ jiˇ","def":"指人小氣巴拉，不容易相處。 例如：這細人仔當僬懠，麼个東西就毋肯借人搞。","example":""},{"word":"唧唧啐啐","pinyin":"jid jid zud zud","def":"竊竊私語。 例如：佢兩儕在該唧唧啐啐講恁久，毋知在講麼个。","example":""},{"word":"積惡","pinyin":"jidˋ ogˋ","def":"積聚罪惡，通常是負面用語。 例如：人講：「前世積惡，正會折壽。」","example":""},{"word":"唚唚㗱㗱","pinyin":"jimˊ jimˊ jib jib","def":"彼此相親嘴，形容親暱的樣子。 例如：公園肚輒常看得著相愛个男女，在該唚唚㗱㗱。","example":""},{"word":"進鑽","pinyin":"jin zon","def":"善於謀劃鑽研；上進。 例如：阿富仔一路里來就當進鑽，哪位有錢賺佢就去。 例如：佢當進鑽，當會謀頭路做。","example":""},{"word":"精砉砉仔","pinyin":"jinˊ guag guag eˋ","def":"精明的樣子。 例如：這細人仔精砉砉仔，會算會除，還會掌店招待人客。","example":""},{"word":"精精","pinyin":"jinˊ jinˊ","def":"很精明。 例如：佢分你緊咄，本來精精个就分你咄到𠕆𠕆吔。","example":""},{"word":"精睩睩仔","pinyin":"jinˊ lugˋ lugˋ eˋ","def":"很精靈、很聰明。 例如：厥屋下个細人仔，隻隻精睩睩仔，讀書當識。","example":""},{"word":"精人使嘴","pinyin":"jinˊ nginˇ siiˋ zoi","def":"聰明的人常動嘴使喚。 例如：精人使嘴，戇人出力。","example":""},{"word":"精食","pinyin":"jinˊ siid","def":"形容人專挑好的來吃的習性。 例如：「燒」粢「冷」粽確實有影！頭擺人異精食。","example":""},{"word":"精腳","pinyin":"jinˊ giogˋ","def":"形容人很精明。 例如：同該種精腳个人交朋友，毋食虧就好偷暢哩！毋使想講愛占厥便宜。","example":""},{"word":"酒癖","pinyin":"jiuˋ piagˋ","def":"酒後之酒品。 例如：阿哥酒癖當好，酒食落去就恬恬睡目毋會吵人。","example":""},{"word":"足相","pinyin":"jiugˋ xiong","def":"指人動輒生氣、很難相處。 例如：佢當足相，無意無思，動啊著斯罵人。 例如：佢當足相，東西分人摸毋得。","example":""},{"word":"刻臭頭","pinyin":"kadˋ cu teuˇ","def":"指被狠狠地責罵。 例如：佢長透分厥姆刻臭頭，罵久乜蠻皮吔。","example":""},{"word":"刻定","pinyin":"kadˋ tin","def":"深度確定。 例如：這日仔大家都刻定好吔，你還有意見仰當時毋講？","example":""},{"word":"謹等使","pinyin":"giunˋ denˋ siiˋ","def":"有節制地使用。 例如：阿麟賺無幾多錢，佢逐隻月就愛算好來謹等使，還愛長兜仔餔娘本。","example":""},{"word":"勘勘裁裁","pinyin":"kamˊ kamˊ caiˇ caiˇ","def":"商量未定。 例如：恁多人勘勘裁裁，任裁都裁毋定哪個案仔較好。","example":""},{"word":"挳字眼","pinyin":"kang sii ngienˋ","def":"挑人毛病。 例如：你做，𠊎來相，挳字眼麼儕乜會！","example":""},{"word":"訄洗","pinyin":"kauˊ seˋ","def":"諷刺。 例如：毋好恁樣訄洗人，別人聽著心肚會毋爽快。","example":""},{"word":"擎頭擎腦（擎頭帶腦）","pinyin":"kiaˇ teuˇ kiaˇ noˋ (kiaˇ teuˇ dai noˋ)","def":"帶頭、主導。 例如：做賊分警察捉著愛坐管仔，擎頭擎腦該儕罪較重。","example":""},{"word":"擎腳【揹腳】","pinyin":"kiaˇ giogˋ【bi giogˋ】","def":"原意為抬腳，隱喻伺候他人，多為負面。 例如：這擺你係考得著律師，𠊎摎你擎腳。","example":""},{"word":"擎頭旗","pinyin":"kiaˇ teuˇ kiˇ","def":"居領導地位。 例如：擎頭旗个人愛有帶頭个要領。","example":""},{"word":"擎頭毋起","pinyin":"kiaˇ teuˇ mˇ hiˋ","def":"抬不起頭來。 例如：這擺考試打尾等，害佢嗄擎頭毋起。","example":""},{"word":"儆等","pinyin":"kiang denˋ","def":"儉省著；也指謹慎的意思。 例如：東西恁貴，愛儆等食。 例如：做月个時節，做麼个都愛儆等。","example":""},{"word":"慶頭","pinyin":"kiang teuˇ","def":"精明幹練，具貶義。","example":""},{"word":"儆嘴","pinyin":"kiang zoi","def":"謹慎飲食。 例如：想愛減肥，就愛儆嘴。 例如：胃腸消化毋好个人，食東西愛當儆嘴。","example":""},{"word":"蹶壁","pinyin":"kied biagˋ【kiad biagˋ】","def":"爬牆壁，形容面臨困境而束手無策的樣子。 例如：阿煌這恁久生理失敗，滿哪仔少人錢，苦到會蹶壁。","example":""},{"word":"牽親帶戚","pinyin":"kienˊ qinˊ dai qidˋ","def":"攀親帶故，亦可說「盤親帶戚」。 例如：佢係當好額个頭家，當多人會來牽親帶戚。","example":""},{"word":"口角","pinyin":"kieuˋ gogˋ","def":"口角、吵架。","example":""},{"word":"嘺人","pinyin":"kieuˇ nginˇ","def":"糾纏煩人。 例如：這細人仔當會嘺人，麼人都奈佢毋何。","example":""},{"word":"強監","pinyin":"kiongˇ gamˊ","def":"強迫人家做某事。","example":""},{"word":"共得著","pinyin":"kiung dedˋ doˋ","def":"有共同的源頭。 例如：佢兩儕共姓，又戴恁近，祖先敢怕共得著哦！","example":""},{"word":"共綱","pinyin":"kiung gongˊ","def":"同一胎或同一批、同一世代。例如「共綱子」表同一胎次所生之子、「共綱人」表同一世代之人、「共綱豬子」表同一胎小豬。 例如：共綱豬子，有兜較大，有兜較細。","example":""},{"word":"共爺各哀","pinyin":"kiung iaˇ gogˋ oiˊ","def":"同父異母。另，同母異父則為「共哀各爺」。 例如：這下个社會盡多共爺各哀个家庭。","example":""},{"word":"共飯甑","pinyin":"kiung fan zen","def":"同吃一鍋飯。 例如：佢兜本旦係共飯甑，背尾嗄因為分家搣到冤家，實在毋值。","example":""},{"word":"苛頭","pinyin":"koˊ teuˇ","def":"對人苛刻。 例如：這頭家一路里來就盡苛頭，厥員工全做無幾久就辭職。","example":""},{"word":"看差","pinyin":"kon caˊ","def":"看錯。 例如：正睡醒，目珠花花看差哩！同8看做6。","example":""},{"word":"看對對","pinyin":"kon dui dui","def":"看得很準。 例如：佢就係中意你啊，分𠊎看對對！","example":""},{"word":"看毋過肚","pinyin":"kon mˇ go duˋ","def":"看到他人違逆常理的行為無法忍受。 例如：阿興對爺哀講話當惡，有時節還會動手動腳，鄰舍全看毋過肚。","example":""},{"word":"看衰漦","pinyin":"kon soiˊ xiauˇ","def":"因能力不足被對方看不起。 例如：刻耐兜，做分佢成功來，毋好分人看衰漦。","example":""},{"word":"囥步","pinyin":"kong pu","def":"隱匿絕招、藏一手。","example":""},{"word":"狂狂","pinyin":"kongˇ kongˇ","def":"莽撞、瘋狂貌。 例如：厥倈仔輒常搞到狂狂，麼个拿著就擲，毋知恁仔會傷著人。","example":""},{"word":"劊頭","pinyin":"kuaiˇ teuˇ","def":"砍頭、斬頭，後引申為解聘。 例如：佢毋好好做頭路，分頭家劊頭。","example":""},{"word":"虧人","pinyin":"kuiˊ nginˇ","def":"讓人吃虧。","example":""},{"word":"空手啦些【空手鷯跳】","pinyin":"kungˊ suˋ laˇ xiaˊ【kungˊ suˋ liau tiau】","def":"空著手。詞意上較「空手」更重些。 例如：空手啦些去人屋下拜年，當失人禮。","example":""},{"word":"空頭","pinyin":"kungˊ teuˇ","def":"花樣、名堂。 例如：佢盡多空頭，麼个齣數都有。","example":""},{"word":"空殼餅","pinyin":"kungˊ hogˋ biangˋ","def":"本指空殼的餅，現常以喻虛有其表。 例如：毋好看厥公司做到恁大間，其實佢係一隻空殼餅。","example":""},{"word":"啦嘎嫲","pinyin":"la gia maˇ","def":"話多的女人。","example":""},{"word":"罅無底","pinyin":"la moˇ daiˋ","def":"超出能力範圍，喻難度高。也可以說「打無底」。 例如：佢這擺去考高考，全罅無底。","example":""},{"word":"罅嗄","pinyin":"la sa","def":"指貪得無厭，手腳不乾淨，什麼都想要的行為。 例如：該人當罅嗄，看著麼个都摎人拿走。","example":""},{"word":"邋邋呷呷","pinyin":"lab lab gab gab","def":"衣著髒亂的樣子。 例如：天光日愛去食酒，你係著到邋邋呷呷，就無愛分你跈。","example":""},{"word":"邋邋礙礙","pinyin":"lab lab ngai ngai","def":"指穿著邋遢或建築物簡陋破舊。 例如：去分人請著到邋邋礙礙，見人都毋得。 例如：看佢歇个屋邋邋礙礙，應該毋係異鬆頭。","example":""},{"word":"邋食","pinyin":"lab siid","def":"白吃白喝。 例如：這兜人去餐廳邋食，分人捉著正甘願撿錢。","example":""},{"word":"邋食狗","pinyin":"lab siid gieuˋ","def":"喻白吃白喝的人。 例如：莊下做好事請人客，有兜毋熟毋事个人會去做邋食狗。","example":""},{"word":"邋食坐大位","pinyin":"lab siid coˊ tai vi","def":"白吃白喝的人卻坐上尊位，喻喧賓奪主。 例如：邋食坐大位，面皮皮仔毋知見笑。","example":""},{"word":"落荒仔走","pinyin":"lag fang eˋ zeuˋ","def":"落荒而逃。 例如：細人仔偷摘人个朳仔，分主人䀯著，落荒仔走。","example":""},{"word":"濫泥著壁","pinyin":"lam naiˇ dauˇ biagˋ","def":"拿爛泥巴來塗牆壁，比喻扶不起的阿斗。","example":""},{"word":"攬攬揫","pinyin":"lamˋ lamˋ qiuˊ","def":"承包很多。 例如：攬攬揫恁多事來做，想做分佢死係無？","example":""},{"word":"攬揫揫","pinyin":"lamˋ qiuˊ qiuˊ","def":"全部收歸一人所有。 例如：這片柑園个柑仔，做下分佢攬揫揫。","example":""},{"word":"濫糝","pinyin":"lamˋ samˋ","def":"胡來亂來。 例如：講話愛有根據，做毋得濫糝講。","example":""},{"word":"㜮斗【㜮漦】","pinyin":"lamˊ deuˋ【lamˊ xiauˇ】","def":"形容能力差。 例如：恁㜮斗，恁簡單个事就毋曉得。","example":""},{"word":"㜮狗屎","pinyin":"lamˊ gieuˋ siiˋ","def":"指愚笨的人。 例如：這個㜮狗屎，逐擺考試都係尾崁。","example":""},{"word":"懶蛇【懶骨頭】","pinyin":"lanˊ saˇ【lanˊ gudˋ teuˇ】","def":"比喻懶惰的人，猶如冬眠的蛇，亦可說「懶蛇懶𧊅」。 例如：阿三牯懶蛇樣仔，講愛做事，喊又毋停動。","example":""},{"word":"冷雪雪仔","pinyin":"langˊ xiedˋ xiedˋ eˇ","def":"冷冰冰的，多用於指對人的態度冷淡。 例如：做店員个人，係對人冷雪雪仔，就無人敢入店囉。","example":""},{"word":"落人","pinyin":"lau nginˇ","def":"套人、騙人。 例如：阿海當聰明，毋過佢毋學好，專門去落人个錢。","example":""},{"word":"漏氣","pinyin":"lau kui","def":"漏氣（閩南語借詞），比喻行為表現不盡理想，令人喪氣；或指氣體外漏。 例如：阿水伯做一生人个牛販仔，信用異好，毋識漏氣。","example":""},{"word":"利腳","pinyin":"li giogˋ","def":"謂對於利益計較得很清楚的人，一般多用於婦人家。 例如：𠊎隔壁个婦人家當利腳，想愛梟佢，想都毋使想。","example":""},{"word":"離尸馬瀉","pinyin":"liˇ siiˊ maˊ xia","def":"人受到極度的驚嚇，造成行為失序而慌亂。 例如：兩軍對陣，細卒仔堵著大將，吂戰就驚到離尸馬瀉吔。","example":""},{"word":"領便","pinyin":"liangˊ pien","def":"坐享其成。 例如：佢下班轉來，三餐領便。","example":""},{"word":"了尾子【八敗子】","pinyin":"liauˋ miˊ ziiˋ【badˋ pai ziiˋ】","def":"不務正業，敗壞門風或耗損家產，無法自立的不肖子孫。 例如：佢歸日就知食飽尞，尞飽食，正經係一個了尾子。","example":""},{"word":"了少","pinyin":"liauˋ seu","def":"指人態度輕浮不莊重，言語粗魯又野蠻。 例如：厥屋下个細人仔，細个番綻、大个了少。","example":""},{"word":"撩刁","pinyin":"liauˇ diauˊ","def":"愛戲弄人的樣子，有好動不安分的意思。例如「這細人仔當撩刁」。","example":""},{"word":"了俐","pinyin":"liauˇ li","def":"做事乾淨俐落，亦可說「了了俐俐」。 例如：這事先做忒較了俐，毋好等到月尾，還一個擔頭㧡等。","example":""},{"word":"撩手弄腳","pinyin":"liauˇ suˋ nung giogˋ","def":"指人輕佻不莊重。 例如：對毋熟事个人，絕對做毋得摎人撩手弄腳。","example":""},{"word":"謰人","pinyin":"lien nginˇ","def":"騙人。 例如：聽講該隻人當會謰人，你愛提防佢。","example":""},{"word":"膦覂覂仔","pinyin":"linˋ fungˋ fungˋ eˇ","def":"下部挺出，一副其奈我何的態度，屬不雅之動作。","example":""},{"word":"昂昂惹惹","pinyin":"ngongˊ ngongˊ ngia ngia","def":"起爭執的狀態。 例如：佢兩儕在該昂昂惹惹，毋知在吵麼个？","example":""},{"word":"輪食","pinyin":"linˇ siid","def":"輪流供養。「輪煮」則表示輪流煮飯。 例如：佢兜兩兄弟分家，阿姆逐隻月去佢兜屋下輪食。","example":""},{"word":"兩伙計","pinyin":"liongˋ foˇ gi","def":"稱有不正常男女關係的兩人。 例如：該兩伙計這下戴共下，隔壁鄰舍講盡多閒話。","example":""},{"word":"兩頭烏","pinyin":"liongˋ teuˇ vuˊ","def":"形容早出晚歸，多用於形容人的行為。 例如：爺哀為著細人仔，日日做到兩頭烏。","example":""},{"word":"兩長年","pinyin":"liongˋ congˇ ngienˇ","def":"期滿兩年。 例如：阿琳在這做有兩長年，背尾因為結婚正辭忒頭路。","example":""},{"word":"溜麵線","pinyin":"liu mien xien","def":"麵漿從斜篩上流過，成為線條的動作，常用以喻話多說不完。 例如：佢透日在伯公下溜麵線，嘴敢毋會燥？","example":""},{"word":"流流漂漂","pinyin":"liuˇ liuˇ piu piu","def":"遊手好閒，無所事事。 例如：做兵轉來好尋頭路哩，莫歸日仔流流漂漂。","example":""},{"word":"六月牛眼","pinyin":"liugˋ ngied ngiuˇ ngienˋ","def":"六月龍眼，白色果核，以「白核」諧音客語「白咈」。比喻白吃白喝。（歇）","example":""},{"word":"老虎嫲","pinyin":"lo fuˋ maˇ","def":"母老虎，喻兇女人。","example":""},{"word":"老鼠舐貓鼻","pinyin":"lo cuˋ seˊ meu pi","def":"喻不知死活。","example":""},{"word":"老鳥精","pinyin":"loˋ diauˊ jinˊ","def":"借指經驗老到，世故、狡猾的人，多用於貶義，亦可說「死鳥精」。","example":""},{"word":"老癲倲","pinyin":"loˋ dienˊ dungˊ","def":"稱年老神智不清的人，猶如說老糊塗。 例如：阿公頭先食過飯吔，這下又講佢還吂食，阿婆罵佢係老癲倲。","example":""},{"word":"洗金身","pinyin":"seˋ gimˊ siinˊ","def":"諷刺人洗澡洗很慢。 例如：阿明洗身洗歸點鐘仔，阿姆罵佢係在洗金身抑毋係？","example":""},{"word":"老腳士","pinyin":"loˋ giogˋ sii","def":"老手。","example":""},{"word":"老戲跌落棚","pinyin":"loˋ hi diedˋ log pangˇ","def":"喻經驗老到的人做事失手。（諺）","example":""},{"word":"老熟","pinyin":"loˋ xiugˋ","def":"看起來比實際年齡要成熟。 例如：這後生條仔還老熟，正十五歲定定，看起來像人二十五歲。","example":""},{"word":"派下","pinyin":"pai ha","def":"同一親族所延續的血脈系統。例如「厥公派下有四房人」。","example":""},{"word":"【拗蠻】","pinyin":"【auˊ manˇ】","def":"耍賴，耍流氓，不是他的還硬要的行為。","example":""},{"word":"老手路","pinyin":"loˋ suˋ lu","def":"老經驗，亦可說「熟手」。","example":""},{"word":"劣拙","pinyin":"lodˋ zodˋ","def":"形容人笨拙彆扭或不講道理。 例如：厥倈仔表面看起來老實老實，其實性格當劣拙。","example":""},{"word":"落扚","pinyin":"log diag","def":"落入圈套、陷入機關，也指犯人手被銬住。","example":""},{"word":"落名","pinyin":"log miangˇ","def":"放入名字。 例如：係有收著禮金，就愛落名到禮簿項。","example":""},{"word":"駱駝","pinyin":"log toˇ","def":"駱駝的食量大，比喻很能吃的人。 例如：食吔三碗大麵還吂飽，駱駝得是仔。","example":""},{"word":"浪蕩子","pinyin":"long tong ziiˋ","def":"不務正業，到處晃蕩的人。 例如：這隻浪蕩子一年無三日在屋下，全無賺錢轉屋。","example":""},{"word":"郎當","pinyin":"longˇ dongˊ","def":"謂遊手好閒，惹事生非。 例如：阿明盡郎當，又惹事情吔。","example":""},{"word":"攎攎罅罅","pinyin":"luˊ luˊ la la","def":"限於環境，無法打點生活細節。 例如：屋下降恁多細人，攎攎罅罅乜畜到恁高恁大。","example":""},{"word":"礱礱舂舂","pinyin":"lungˇ lungˇ zungˊ zungˊ","def":"喻莽莽撞撞，行事粗率，未經思考。 例如：做事情愛先想清楚正去做，毋好礱礱舂舂。","example":""},{"word":"毋得人死","pinyin":"mˇ dedˋ nginˇ xiˋ","def":"巴不得我死嗎？諷刺浪費的精神、體力、錢財。 例如：毋得人死係無？毋使做个還拿來做麼个！","example":""},{"word":"毋擔輸贏","pinyin":"mˇ damˊ suˊ iangˇ","def":"輸不起，不認賬。 例如：輸就輸，毋好毋擔輸贏，恁無鳥。","example":""},{"word":"毋得㪐爪","pinyin":"mˇ dedˋ ludˋ zauˋ","def":"難以脫身。 例如：佢同人鬥股謀頭路，認墊錢，今這下毋得㪐爪哩！","example":""},{"word":"蹧蹋","pinyin":"zauˊ tadˋ【zauˊ tabˋ】","def":"為難人家。 例如：較聽話兜仔，毋好動啊著就恁仔蹧蹋人好無？","example":""},{"word":"毋知儕","pinyin":"mˇ diˊ saˇ","def":"不知道事情原委的人。 例如：自家做毋著還敢噭，毋知儕還恅著係𠊎欺負你呢！","example":""},{"word":"毋知頭天","pinyin":"mˇ diˊ teuˇ tienˊ","def":"不知天高地厚。 例如：你啊！莫恁毋知頭天，出社會你就知哩。","example":""},{"word":"毋堪身分","pinyin":"mˇ kamˊ siinˊ fun","def":"不明白自己是何等身分。 例如：一屋下苦煎煎仔，佢還放勢牯借錢來大開大使，實在還毋堪身分哦！","example":""},{"word":"毋聲毋氣","pinyin":"mˇ sangˊ mˇ hi","def":"悶不吭聲，實則工於心計。 例如：同佢共下做事愛細義，莫看佢毋聲毋氣，佢斯專門心肚做事哦！","example":""},{"word":"毋成人","pinyin":"mˇ sangˇ nginˇ","def":"罵人不像樣。 例如：厥老公異毋成人，歸日仔手長長仔，還跈人走去蹬酒家。","example":""},{"word":"毋識人","pinyin":"mˇ siidˋ nginˇ","def":"本義為無法辨認何人，引申指人不知好歹。 例如：毋使對佢恁好，佢這人係過橋丟楄，過忒共樣毋識人。","example":""},{"word":"雕琢","pinyin":"diauˊ dogˋ","def":"雕琢；整治。 例如：佢忒後生，愛人雕琢一下仔正好。","example":""},{"word":"麻斗","pinyin":"maˇ deuˋ","def":"能力差，帶有愚笨意。 例如：你斯還麻斗哦！仰搣恁多日吔還吂搣好？","example":""},{"word":"麼个樣相【麼个格式】","pinyin":"magˋ ge iong xiong【magˋ ge giedˋ siidˋ】","def":"什麼樣子？多用於負面。 例如：你恁樣像麼个樣相？坐毋成坐，企毋成企！","example":""},{"word":"賣嘴花","pinyin":"mai zoi faˊ","def":"形容巧於言詞，把話說得有聲有色，非常動聽。 例如：生理人盡會賣嘴花，桌布講到像人个綢緞。","example":""},{"word":"蠻牛拖犁","pinyin":"manˇ ngiuˇ toˊ laiˇ","def":"喻漫不經心，動作慢吞吞的樣子。 例如：阿祥牯做事情蠻牛拖犁樣仔，愛人緊催。","example":""},{"word":"瞞神騙鬼","pinyin":"manˇ siinˇ pien guiˋ","def":"欺上瞞下，騙神騙鬼。也有說「瞞官騙鬼」。 例如：瞞神騙鬼个頭路你也敢做，有時有日，一定會受著責罰。","example":""},{"word":"茅狗仔","pinyin":"mauˇ gieuˋ eˇ","def":"指弱小的狗；貶喻人做事不光明、做出差勁的事情；貶喻此人差勁不上道。 例如：恁重要个事情，你仰敢交分阿興該個茅狗仔做？","example":""},{"word":"搣耍人","pinyin":"medˋ sa nginˇ【miedˋ sa nginˇ】","def":"戲弄人。 例如：莫恁樣搣耍人好無，害𠊎嚇到會死。","example":""},{"word":"搣死","pinyin":"medˋ xiˋ【miedˋ xiˋ】","def":"作為令人受不了。 例如：正式會分佢搣死，麼个就無做，下二擺將就自家做較贏。","example":""},{"word":"貓徙竇","pinyin":"meu saiˋ deu","def":"母貓生小貓後，若是發現環境對小貓有危險就馬上將小貓銜至較安全處；用以比喻一個人在生活或工作上不甚穩定，常有調動。諷諭常搬家或換位子。 例如：後生人輒輒換頭路，就像貓徙竇共樣，難成大事。","example":""},{"word":"貓扡粢粑","pinyin":"meu iaˋ qiˇ baˊ","def":"貓以爪抓餈粑後黏住，比喻很難脫身。 例如：佢好衰毋衰惹著該家人，這下就像貓扡粢粑難㪐爪哩。","example":""},{"word":"尾蹀蹀仔","pinyin":"miˊ dia dia eˋ","def":"形容動物尾巴翹起來的樣子，比喻人得意的樣子。 例如：細人仔小可仔獎勵啊，就尾蹀蹀仔。","example":""},{"word":"摸無空囥【無哪庰命】","pinyin":"miaˊ moˇ kungˊ kong【moˇ naiˋ biang miang】","def":"無處可逃。 例如：該賊仔分警察逐入巷仔肚，這下斯摸無空囥哩。","example":""},{"word":"面生毛","pinyin":"mien sangˊ moˊ","def":"原指禽獸，咒罵他人的行為如禽獸一般，亦可說「面無血」。 例如：正經係面生毛，恁樣个壞事也做得出來。","example":""},{"word":"面風","pinyin":"mien fungˊ","def":"體面光榮，又作「面子」。很有面子謂「當有面風」。","example":""},{"word":"面無皮（無面皮）","pinyin":"mien moˇ piˇ (moˇ mien piˇ)","def":"不知羞恥。 例如：面無皮个人，摎佢講較多乜無效。","example":""},{"word":"無人承受","pinyin":"moˇ nginˇ siinˇ su","def":"罵人行為不善、沒教養，無法令人接納。 例如：連伯公个神像都敢搞，正經係無人承受个敗類。","example":""},{"word":"無鳥","pinyin":"moˇ diog","def":"喻做事不負責任、不牢靠。另用「無鳥無鳥」罵人沒有種、沒骨氣、沒責任感的樣子。","example":""},{"word":"無聲無哨","pinyin":"moˇ sangˊ moˇ sau","def":"指不吭氣、靜悄悄、無聲無息。 例如：戴在偏僻个莊下，無麼个人家，一斷烏就無聲無哨，盡得人驚。","example":""},{"word":"無下落","pinyin":"moˇ ha log","def":"沒著落，常用於罵人做事漫不經心、不負責任。 例如：見擺拜託你做事都恁無下落，麼人敢過請你。","example":""},{"word":"無核卵","pinyin":"moˇ hag lonˋ","def":"指人沒有勇氣、擔當，為粗俗用語。","example":""},{"word":"做逛樂","pinyin":"zo ongˇ log","def":"閒逛不做事，遊手好閒。","example":""},{"word":"無腰骨","pinyin":"moˇ ieuˊ gudˋ","def":"原形容不能撐起脊梁的人，後常喻沒骨氣或沒擔當的人。 例如：無腰骨个人想愛自家做頭家，比上天還較難。","example":""},{"word":"無落著","pinyin":"moˇ log cog","def":"沒著落，常用於形容尚未找到工作而到處遊蕩的樣子。另言「無落無著」。 例如：有人好看相算命，揀揀擇擇，一生人就無落著。","example":""},{"word":"無牙根","pinyin":"moˇ ngaˇ ginˊ","def":"指做事沒有擔當。 例如：阿明一路里來就喃喃呢呢，堵著事情又無牙根，難怪厥子女全毋驚佢。","example":""},{"word":"無議無論","pinyin":"moˇ ngi moˇ lun","def":"不予計較。 例如：阿爸仰仔講就仰仔做，大家無議無論。","example":""},{"word":"無眼睇","pinyin":"moˇ ngienˋ taiˋ","def":"不放在眼裡，有不屑一顧的意思。 例如：你莫恅著做著縣長就異會樣仔，𠊎無眼睇啦！","example":""},{"word":"管酌","pinyin":"gonˋ zogˋ","def":"約束管理。 例如：細人仔自細愛適當管酌，正毋會行差。","example":""},{"word":"無人親像","pinyin":"moˇ nginˇ qinˊ qiong","def":"罵人不像話、不合乎道理與常軌。 例如：你這無人親像个細人仔，見擺就摝死人。","example":""},{"word":"花頭","pinyin":"faˊ teuˇ","def":"花心、風流成性。 例如：佢從後生到老就盡花頭，交往个細妹仔多到算毋盡。","example":""},{"word":"無像人","pinyin":"moˇ qiong nginˇ","def":"不像人樣。 例如：仰恁無像人！手恁撩刁！","example":""},{"word":"無㘔鹽","pinyin":"moˇ saiˊ iamˇ","def":"罵人沒力氣做事。 例如：恁輕个東西乜擎毋贏，無㘔鹽係無？","example":""},{"word":"無頭神","pinyin":"moˇ teuˇ siinˇ","def":"指因精神恍惚而將東西亂放卻忘了收拾之人，常用以指注意力不足、做事心不在焉。 例如：佢仰會恁無頭神，做麼个就跌麼个。 例如：佢做事無頭神，毋知有麼个心事？","example":""},{"word":"無定無著","pinyin":"moˇ tin moˇ cog","def":"喻人立場不堅定，經常拿不定主意。 例如：湊你去臺北，你到這下還無定無著。","example":""},{"word":"無王無法","pinyin":"moˇ vongˇ moˇ fabˋ","def":"無法無天、橫行無忌，形容人膽大妄為，沒有法紀天理。 例如：這賊仔敢在日時頭偷東西，正經係無王無法。","example":""},{"word":"無心肝","pinyin":"moˇ ximˊ gonˊ","def":"喻人漫不經心、不上心、心不在焉。 例如：恁無心肝！頭下交代你个事，這下就毋記得吔。","example":""},{"word":"無出無處","pinyin":"moˇ cudˋ moˇ cu","def":"沒下落、沒有成效。 例如：喊佢做，恁久吔還無出無處，換人做好哩。","example":""},{"word":"無空無榫","pinyin":"moˇ kungˊ moˇ sunˋ","def":"空口說白話或廢話，說些沒根據的內容，語氣上較為嚴重。 例如：莫講該恁多無空無榫个話，無人會相信你。","example":""},{"word":"無鼻公","pinyin":"moˇ pi gungˊ","def":"鬼，貶義詞。 例如：該無鼻公个來哩喲，閃較遠兜仔。","example":""},{"word":"無天無地","pinyin":"moˇ tienˊ moˇ ti","def":"目無尊長。 例如：你敢對爺哀應嘴應鼻，正經無天無地。","example":""},{"word":"莫𢯭佢","pinyin":"mog ten giˇ","def":"別跟他一般見識。 例如：該隻人本來就番番，你莫𢯭佢。","example":""},{"word":"莫拘禮","pinyin":"mog giˊ liˊ","def":"不要受禮數拘束，引申為不要客氣。 例如：來到這位，你就莫拘禮，水果自家拿來食！","example":""},{"word":"莫聲佢","pinyin":"mog sangˊ giˇ","def":"不回應他或不驚動他。 例如：莫聲佢！等佢自家講到暢。","example":""},{"word":"妹仔賊","pinyin":"moi eˋ ced","def":"戲稱女兒回娘家時，順便拿東西回去。","example":""},{"word":"暮固狗","pinyin":"mu gu gieuˋ","def":"指個性孤僻，不愛多言的人。 例如：暮固狗，咬死人。","example":""},{"word":"沒沒術術","pinyin":"mud mud sud sud","def":"形容人做事不夠坦蕩的樣子。 例如：該兜人沒沒術術，毋知愛去做麼个。","example":""},{"word":"沒頭沒髻（沒頭絞髻）","pinyin":"mud teuˇ mud gi (mud teuˇ gauˋ gi)","def":"謂水滿盈溢，連最頂點都淹沒了，比喻努力以赴，專心做事。 例如：佢當認真，見擺做事情都做到沒頭沒髻。","example":""},{"word":"歿子弟","pinyin":"mudˋ ziiˋ ti","def":"不長進、不中用的晚輩。 例如：該兜歿子弟，歸日仔毋讀書，淨知搞，實在冤枉。","example":""},{"word":"目眈眈仔（眼眈眈仔）","pinyin":"mugˋ ziim ziim eˋ (ngienˋ ziim ziim eˋ)","def":"虎視眈眈，不懷好意的注視，指眼神凶惡。 例如：該儕人目眈眈仔緊看人，愛食忒人个樣仔。","example":""},{"word":"耐尞","pinyin":"nai liau","def":"與人閒聊經久不倦。 例如：平常時坐十分鐘就坐毋核，今晡日仰恁耐尞？","example":""},{"word":"喃喃呢呢","pinyin":"namˇ namˇ neˊ neˊ","def":"口中唸唸有詞而話語不清晰；喻指做事沒魄力不果決。 例如：做主管个人愛有煞氣，毋好喃喃呢呢。","example":""},{"word":"南風草","pinyin":"namˇ fungˊ coˋ","def":"咸豐草因風吹到哪就倒向哪，常用於比喻見風轉舵的人，如「牆頭草」。 例如：佢本旦就係南風草，哪向好空哪向去，你仰好信佢？","example":""},{"word":"難服侍","pinyin":"nanˇ fug sii","def":"喻人難相處或難以應付。 例如：做麼个就嫌到臭屎，正經難服侍。","example":""},{"word":"難剃頭","pinyin":"nanˇ ti teuˇ","def":"喻事情難以處理或人難以應付。 例如：恁大條个錢毋見忒，這下斯難剃頭哩，毋知愛仰結煞正好。","example":""},{"word":"鬧狗【摝博】","pinyin":"nau gieuˋ【lugˋ bogˋ】","def":"搗蛋。","example":""},{"word":"惱絕渣","pinyin":"nauˊ qied zaˊ","def":"討厭到極點。","example":""},{"word":"膩膩細細","pinyin":"ne ne se se","def":"形容做事沒有魄力的樣子。 例如：做事膩膩細細，愛仰仔贏人？","example":""},{"word":"餒餒","pinyin":"neˊ neˊ【neˋ neˋ】","def":"個性軟弱、溫吞，內向柔弱的樣子。 例如：這細人仔個性餒餒，毋會撩刁。 例如：該儕人本來餒餒，毋過上臺演講又當大般。","example":""},{"word":"捏頭扠頸（揇頭扠頸）","pinyin":"nedˋ teuˇ caˊ giangˋ (namˋ teuˇ caˊ giangˋ)","def":"扼住要害。 例如：佢一入公司就將這公司捏頭扠頸。","example":""},{"word":"𤘅奓","pinyin":"nga da","def":"愚蠢貌，另言「𤘅𤘅奓奓」、「𤘅膣𤘅奓」意思相同。 例如：阿興伯講話𤘅奓，聽毋識厥話係麼个意思。","example":""},{"word":"牙綻綻仔","pinyin":"ngaˇ can can eˋ","def":"露牙現齒，看起來一付猙獰的樣子。 例如：該貓仔牙綻綻仔，看起來盡得人驚。","example":""},{"word":"牙牙綻","pinyin":"ngaˇ ngaˇ can/ngaˋ ngaˋ can","def":"形容人個性跋扈不講理，態度傲慢無禮，神態凶惡。 例如：佢盡強蠻，見擺都愛同人爭權奪利，一副牙牙綻个形仔。","example":""},{"word":"啀啀啀啀","pinyin":"ngaiˇ ngaiˇ ngai ngai","def":"強要他人接受或同意他的想法或要求。 例如：大家同意佢好無？無佢透日仔在該啀啀啀啀，實在佇毋著。","example":""},{"word":"硬斗","pinyin":"ngang deuˋ","def":"事情很難處理，需要付出很大的心力。 例如：這擺个頭路一等硬斗，做到會死賺毋成錢。","example":""},{"word":"咬齧","pinyin":"ngauˊ ngad","def":"多用來比喻彼此意見不合。 例如：佢兩儕動啊著就咬齧，毋過也都係直性个人，無壞意。","example":""},{"word":"耳靴靴","pinyin":"ngiˋ hio hio","def":"充耳不聞。","example":""},{"word":"耳聾𦘅","pinyin":"ngiˋ lungˊ guangˇ","def":"重聽之人，用於貶義居多。 例如：𠊎講麼个你就聽無，耳聾𦘅係無？","example":""},{"word":"你你𠊎𠊎","pinyin":"ngiˇ ngiˇ ngaiˇ ngaiˇ","def":"形容爭執不休或吵鬧不休。 例如：兩兄弟在該你你𠊎𠊎，阿姆無結無煞。","example":""},{"word":"逆著","pinyin":"ngiag doˋ","def":"意見不合而起衝突。 例如：佢兩儕逆著，這下相堵頭就毋講話。","example":""},{"word":"拈雞屎食","pinyin":"ngiamˊ gieˊ siiˋ siid","def":"喻年紀還小，不明白事理。","example":""},{"word":"拈蛇打𧊅","pinyin":"ngiamˊ saˇ daˋ guaiˋ","def":"孩童好奇貪玩的行為，引申為做些不正經的事情，亦可說「摸螺挖蜆」。","example":""},{"word":"拈燒怕冷","pinyin":"ngiamˊ seuˊ pa langˊ","def":"指人行事畏首畏尾貌。 例如：做頭路拈燒怕冷，愛仰得時正會成功？","example":""},{"word":"黏牙帶齒","pinyin":"ngiamˇ ngaˇ dai ciiˋ","def":"引申為不乾淨，做事拖泥帶水。 例如：這件事分佢舞到黏牙帶齒，毋知愛仰般收馬正好。","example":""},{"word":"譊譊滾","pinyin":"ngiau ngiau gunˋ","def":"形容怨聲不斷的樣子。 例如：事情一項接等一項，連晝就無閒好食，莫怪佢會譊譊滾。","example":""},{"word":"譊譊譊譊","pinyin":"ngiauˇ ngiauˇ ngiau ngiau","def":"囉哩囉嗦或抱怨不斷的聲音。 例如：譊譊譊譊个話毋使講恁多，越聽越譴就有。 例如：歸日仔為著這件事情在吾耳公脣譊譊譊譊，毋會悿係無？","example":""},{"word":"撚等來用","pinyin":"ngienˋ denˋ loiˇ iung","def":"撙節使用，用在刀口上。 例如：屋下个錢毋罅，愛撚等來用。","example":""},{"word":"眼水（目水、目色）","pinyin":"ngienˋ suiˋ (mugˋ suiˋ、mugˋ sedˋ)","def":"視覺的判斷能力。 例如：厥眼水異好，看兩下仔就知這細倈仔生到幾高。","example":""},{"word":"眼箭摝天","pinyin":"ngienˋ jien lugˋ tienˊ","def":"拋媚眼，亦可說「眼拐摝天」。 例如：見係看著靚細妹仔，佢就眼箭摝天，實在無結煞。","example":""},{"word":"眼鑽鑽仔","pinyin":"ngienˋ zon zon eˋ","def":"專注搜尋的樣子。 例如：佢眼鑽鑽仔緊看人，驚人偷厥東西樣仔。","example":""},{"word":"𢯭毋直","pinyin":"ten mˇ ciid","def":"無法溝通、無法擺平。","example":""},{"word":"人家女","pinyin":"nginˇ gaˊ ngˋ","def":"指未結婚的女子、處女。","example":""},{"word":"人手（人腳）","pinyin":"nginˇ suˋ (nginˇ giogˋ)","def":"指可以幫忙的人力。 例如：天光日請人，人手毋罅，你做得來𢯭手無？","example":""},{"word":"人心節節高","pinyin":"nginˇ ximˊ jiedˋ jiedˋ goˊ","def":"表人的慾望無止境。 例如：人心節節高，有酒嫌無糟。（諺）","example":""},{"word":"人條仔","pinyin":"nginˇ tiauˇ eˋ","def":"青少年。","example":""},{"word":"軟腳蟹","pinyin":"ngionˊ giogˋ haiˋ","def":"軟腳的螃蟹，比喻無法做粗活的人。 例如：你這个人三兩重就拿毋起，軟腳蟹樣仔。","example":""},{"word":"讓嘴","pinyin":"ngiong zoi","def":"原意指把好吃的東西讓給他人吃，後引申為說話留餘地。 例如：佢當死豺，全毋會讓嘴。 例如：佢兩儕吵到當合線，全毋會讓嘴。","example":""},{"word":"忸愀","pinyin":"ngiuˋ jiuˋ","def":"形容難纏、不乾脆，難伺候，也可說「忸忸愀愀」。 例如：這儕人異忸愀，故所無麼个朋友。","example":""},{"word":"牛形","pinyin":"ngiuˇ hinˇ","def":"罵人不受拘束、不聽管教，像牛一樣，具貶義。 例如：罵恁多擺還毋知分醒，牛形樣仔。 例如：隔壁叔婆个細孫仔當賤，牛形樣仔動無停。","example":""},{"word":"牛面","pinyin":"ngiuˇ mien","def":"罵人頑皮不聽話。 例如：該隻細人仔盡牛面，喊佢做毋得擲人，還挑挑拿石牯擲人。","example":""},{"word":"戇戇四","pinyin":"ngong ngong xi","def":"不貪求、不計較。 例如：阿明這儕人毋會擎空頭，戇戇四緊做，故所頭家當阿腦佢。","example":""},{"word":"昂山","pinyin":"ngongˇ sanˊ","def":"迷失了方向，亦有「鬼打牆」一說。 例如：這山仔歸年透天起濛煙，輒常聽著人昂山撞走。","example":""},{"word":"呢呢哪哪","pinyin":"niˇ niˇ noˇ noˇ","def":"自言自語；嘀嘀咕咕低聲說話的樣子。 例如：阿婆老吔，自家在該呢呢哪哪，毋知講麼个。","example":""},{"word":"弄漦弄鼻","pinyin":"nungˋ xiauˇ nungˋ pi/nung xiauˇ nung pi","def":"指撥弄是非；指沒意義的事。","example":""},{"word":"噥哢","pinyin":"nungˇ nung","def":"碎唸不止的樣子，通常是小聲嚷嚷不停的樣子，亦可說「噥噥哢哢」。 例如：半滴毋會差，家無噥哢公，就樣樣空。","example":""},{"word":"屙𣲩","pinyin":"oˊ baˇ","def":"指人做事馬虎，敷衍了事的態度，亦可說「屙屙𣲩𣲩」。 例如：實在還屙𣲩！交代佢个事頭，吂做忒就走去睡目。","example":""},{"word":"屙痢屙肚【屙痢滑肚】","pinyin":"oˊ li oˊ duˋ【oˊ li vad duˋ】","def":"比喻胡言亂語。 例如：毋好聽佢屙痢屙肚，厥話信毋得。","example":""},{"word":"屙膿滑痢【屙膿滑丟】","pinyin":"oˊ nungˇ vad li【oˊ nungˇ vad diu】","def":"喻胡吹亂道。 例如：買保險愛深入多了解，屙膿滑痢个話毋使聽恁多。","example":""},{"word":"屙屎嚇番","pinyin":"oˊ siiˋ hagˋ fanˊ","def":"比喻虛張聲勢。","example":""},{"word":"詏詏暴暴","pinyin":"au au bau bau","def":"形容愛頂嘴、愛辯解。 例如：佢个人當會詏詏暴暴，長透摎佢講毋會伸俥。","example":""},{"word":"爬床扡蓆（盤床扡蓆）","pinyin":"paˇ congˇ iaˋ qiag (panˇ congˇ iaˋ qiag)","def":"以手抓床拉蓆，形容人極端痛苦的情狀。 例如：佢毋知食著麼个，肚屎痛到爬床扡蓆。","example":""},{"word":"白咈","pinyin":"pag fud","def":"白吃白喝。 例如：食忒這餐飯也毋納錢，今晡日係來白咈个係無？ 例如：該陣後生仔毋學好，不時去粄攤仔白咈，毋撿錢分人。","example":""},{"word":"盤擎","pinyin":"panˇ kiaˇ","def":"善於翻騰跳躍，形容頑皮。 例如：這細人仔屎胐生竻樣仔，坐毋核，跳上跌落，實在盤擎。","example":""},{"word":"刨合削","pinyin":"pauˇ gagˋ xiogˋ","def":"喻用言辭諷刺又挖苦。 例如：佢對人苛頭，講話刨合削，故所異無人緣。","example":""},{"word":"鼻臭臭仔","pinyin":"pi cu cu e ˋ","def":"形容人的態度驕傲而無禮。 例如：這間店个服務員鼻臭臭仔，下二擺無愛來哩。","example":""},{"word":"鼻𪖐𪖐仔","pinyin":"pi ngiu ngiu eˋ","def":"脾氣倔強又不聽話、傲慢不馴的樣子。 例如：這細人仔鼻𪖐𪖐仔，逐擺就講毋會聽。","example":""},{"word":"批人","pinyin":"piˊ nginˇ","def":"占人便宜。 例如：做生理愛講信用，毋好批人。","example":""},{"word":"批絲","pinyin":"piˊ xiˊ","def":"占人便宜，連小地方也不放過。 例如：這个人當微利，連幾條蔥仔也愛批絲人。","example":""},{"word":"偏背","pinyin":"pien boi","def":"形容背地裡、私自去做某事。 例如：這儕人逐擺人前講靚話，毋過偏背斯專門燒壞話。","example":""},{"word":"騙人恁悿","pinyin":"pien nginˇ anˋ tiamˋ","def":"把人騙得團團轉、欺人太甚之意。 例如：毋使騙人恁悿，𠊎看得識你係挑挑个。","example":""},{"word":"騙人毋識","pinyin":"pien nginˇ mˇ siidˋ","def":"騙人不懂，引申為有什麼稀罕，或自以為了不起的意思。 例如：莫騙人毋識，這書毋係你正有，吾屋下一千擔。","example":""},{"word":"品好勢","pinyin":"pinˋ hoˋ se","def":"談妥條件。 例如：早就品好勢个，佢這下又詐癲，會分佢譴死。","example":""},{"word":"品品揫","pinyin":"pinˋ pinˋ qiuˊ","def":"所有有利的條件都約定上了。 例如：條件品品揫，敢有才調做？","example":""},{"word":"品條件","pinyin":"pinˋ tiauˇ kien","def":"談條件。 例如：你愛先通過這擺个考試，正來品條件。","example":""},{"word":"品定","pinyin":"pinˋ tin","def":"約定好。 例如：這筆生理就恁仔品定下來，你斯做毋得反悔。","example":""},{"word":"破格","pinyin":"po gagˋ/giedˋ","def":"形容人品、性格偏差，行為習慣與眾不同。 例如：這個老人家實在還破格，明明厥心臼就異有孝，佢還出去投這投該，嫌七嫌八。","example":""},{"word":"背祖","pinyin":"poi zuˋ","def":"違反祖宗規矩，比喻忘本。","example":""},{"word":"賁皮","pinyin":"punˊ piˇ","def":"皮層很厚，喻人臉皮厚。","example":""},{"word":"盆頭講到缽","pinyin":"punˇ teuˇ gongˋ do badˋ","def":"費盡口舌都無法讓對方理解或改變對方的行為。 例如：盆頭講到缽佢就係毋聽，還係愛去賭，死無變个。","example":""},{"word":"謝二","pinyin":"qia ngi","def":"懵懂的人；某（不定）人的代詞。 例如：該隻人恁謝二，溚溚渧渧。","example":""},{"word":"刺額","pinyin":"qiagˋ ngiagˋ","def":"原意指在臉上、額頭上刺花紋，許多古老的民族多有此習俗；今喻指女子行為調皮、不莊重，好賣弄，具貶義。","example":""},{"word":"青面鳥","pinyin":"qiangˊ mien diauˊ","def":"指器量小、動不動就生氣翻臉的人。","example":""},{"word":"無聲無說","pinyin":"moˇ sangˊ moˇ sodˋ","def":"一聲不響地。 例如：佢無聲無說行落來，害阿爸著驚。","example":""},{"word":"七孔八竅","pinyin":"qidˋ kungˋ badˋ kieu","def":"做事情很得要領和竅門。 例如：莫看佢無哦，七孔八竅異會謀頭路，賺異成錢。","example":""},{"word":"七七八八","pinyin":"qidˋ qidˋ badˋ badˋ","def":"囉哩囉唆、不乾脆的樣子。 例如：𠊎無同你七七八八，愛買抑毋買，煞兜決定。","example":""},{"word":"錢鬼仔","pinyin":"qienˇ guiˋ eˇ","def":"視錢如命之人。","example":""},{"word":"錢絭仔","pinyin":"qienˇ kien eˋ","def":"喻守財奴。","example":""},{"word":"前人子","pinyin":"qienˇ nginˇ ziiˋ","def":"前妻或前夫的子女。","example":""},{"word":"尋人出水","pinyin":"qimˇ nginˇ cudˋ suiˋ","def":"找人算帳、找人發洩。 例如：新聞報講，該後生仔因為分阿爸刻臭頭，正會滿哪尋人出水，搣到入派出所。","example":""},{"word":"外才","pinyin":"ngoi coiˇ","def":"外顯性的才能，例如交際或經營等。","example":""},{"word":"搶篼","pinyin":"qiongˋ deuˊ","def":"形容多人一起進食時，搶食的情形，後比喻食慾旺盛。 例如：單儕食無搭碓，越多人越搶篼。","example":""},{"word":"搶光","pinyin":"qiongˋ gongˊ","def":"搶取光彩，有愛現的意思，另言「搶光狗」用來罵愛表現、爭著出風頭的人。 例如：該儕人盡搶光，開會个時節爭等講話，想愛出風頭。","example":""},{"word":"射眼箭（打眼箭、使目角）","pinyin":"sa ngienˋ jien (daˋ ngienˋ jien、siiˋ mugˋ gogˋ)","def":"使眼色。 例如：賭徼場當多射眼箭个人，專門撮假騙錢。","example":""},{"word":"沙人","pinyin":"saˊ nginˇ","def":"誇獎對方的作為，有時帶有稍許的揶揄。 例如：沙人毋使錢，嘴較甜總較贏哪。","example":""},{"word":"沙鼻狗","pinyin":"saˊ pi gieuˋ","def":"喻喜歡被人家誇讚的人。","example":""},{"word":"沙鼻碌碌仔","pinyin":"saˊ pi lugˋ lugˋ eˋ","def":"得意，神氣活現的樣子。 例如：佢著著獎券，歸日仔沙鼻碌碌仔，滿哪就買糖仔請人。","example":""},{"word":"沙鼻弄弄仔","pinyin":"saˊ pi nung nung eˋ","def":"形容神氣活現。 例如：佢斯演講比賽打頭名定，就沙鼻弄弄仔。 例如：佢沙鼻弄弄仔，不時展倈仔做教授當湛。","example":""},{"word":"蛇過尋棍","pinyin":"saˇ go qimˇ gun","def":"事過才來補救，喻錯過了時機。","example":""},{"word":"蛇窿透𧊅窟","pinyin":"saˇ lungˇ teu guaiˋ fudˋ","def":"內神通外鬼，喻相互勾結串通。 例如：佢恁多儕蛇窿透𧊅窟，鬥等來騙人。","example":""},{"word":"石灰掞路","pinyin":"sag foiˊ iam lu","def":"把石灰撒在路上，跟著白色的石灰走，意指「打白行」，喻白走一趟。 例如：石灰掞路，打白行。（諺）","example":""},{"word":"石頭狗","pinyin":"sag teuˇ gieuˋ","def":"丟石頭出去，狗隨即追過去銜回來，喻沒主見，任人使喚的人，亦可說「石頭狗，弄弄走」。 例如：毋好像石頭狗，佢講麼个你就做麼个。","example":""},{"word":"㘔恁大人","pinyin":"saiˊ anˋ tai nginˇ","def":"活到這麼大把歲數。 例如：冤枉哦！㘔恁大人，褲還著到竵竵，敢看得？","example":""},{"word":"豺","pinyin":"saiˇ","def":"粗俗不雅的字眼，指嘴饞貪吃的樣子。 例如：佢當豺，麼个東西拿著就食。 例如：佢恁久肚想毋好，毋敢多食油氣，嘴也毋豺吔。","example":""},{"word":"三碫且姆（三層且姆）","pinyin":"samˊ don qiaˊ meˊ (samˊ cenˇ qiaˊ meˊ)","def":"笑稱衣著內長外短的女人。 例如：阿美，你著到像三碫且姆，敢看得？","example":""},{"word":"三分親","pinyin":"samˊ funˊ qinˊ","def":"有點親戚關係。 例如：見面三分親，你還係自家去同佢講，較有效。","example":""},{"word":"三十暗晡个飯甑","pinyin":"samˊ siib am buˊ ge fan zen","def":"自己需要用，無法借給他人用，喻沒空。 例如：這東西大家相爭用，就像三十暗晡个飯甑，哪有閒好借分你。","example":""},{"word":"三挨四挨（三挨四磨）【挨挨磨磨】","pinyin":"samˊ aiˊ xi aiˊ (samˊ aiˊ xi moˊ)【aiˊ aiˊ mo mo】","def":"一拖再拖。 例如：做事情愛煞手兜仔，毋好三挨四挨做毋會出圍。 例如：寒著愛抽間去分醫生看，毋好三挨四挨，無斯會緊來緊嚴重。","example":""},{"word":"三見面","pinyin":"samˊ gien mien","def":"三方人員聚在一起。 例如：大家三見面講清楚，正毋會怨來怨去。","example":""},{"word":"三隻鼻公空","pinyin":"samˊ zagˋ pi gungˊ kungˊ【samˊ zagˋ pi gungˊ kangˊ】","def":"一般人的鼻孔只有兩個，第三個就是多餘的閒管。比喻喜歡踰越本分，插手或過問不是自己的事。 例如：這毋係若事，莫三隻鼻公空─閒管。","example":""},{"word":"山精（海戇）【大番薯、大戇霸】","pinyin":"sanˊ jinˊ (hoiˋ ngong)【tai fanˊ suˇ、tai ngong ba】","def":"土包子、鄉巴佬，喻少見世面的人。","example":""},{"word":"覡投投仔","pinyin":"sang dauˇ dauˇ eˋ","def":"跩而愛理不理人的樣子。 例如：做生理个人，毋好覡投投仔，會無人客。","example":""},{"word":"覡上覡下","pinyin":"sang songˊ sang haˊ","def":"走來走去，自以為了不起而不理人的樣子。 例如：講佢毋中意聽个，佢就歸日覡上覡下。","example":""},{"word":"覡頭（覡投）","pinyin":"sang teuˇ (sang dauˇ)","def":"形容我行我素，驕傲不尊重他人的態度。 例如：正賺著該幾銑錢定定，就恁覡頭。","example":""},{"word":"生腳【新跤仔】","pinyin":"sangˊ giogˋ【xinˊ kaˇ eˋ】","def":"生手、沒有經驗的人。 例如：佢係生腳，今晡日正來報到，下後就愛麻煩你多照顧哩喲。","example":""},{"word":"生角","pinyin":"sangˊ gogˋ","def":"本意為長角，喻爭鬥得很激烈。 例如：佢兩姊妹為著一支手機仔，鬥到生角。 例如：正幾多歲定就頭那生角，一哪仔惹事惹非鬥人。","example":""},{"word":"生翼","pinyin":"sangˊ id","def":"長翅膀，喻可以不受拘束。 例如：阿明出外讀書，像鳥仔生翼，日仔過到異自然。","example":""},{"word":"勢頭","pinyin":"se teuˇ","def":"後盾、靠山，可作為憑藉的勢力。 例如：雖然講佢在公司肚个勢頭盡大，毋過還係從細職員做起，正毋會分人講話。","example":""},{"word":"細心臼仔","pinyin":"se ximˊ kiuˊ eˋ","def":"童養媳，常引申畏縮個性的人。","example":""},{"word":"洗碗有相磕","pinyin":"seˋ vonˋ iuˊ xiongˊ kab","def":"喻相處一起難免會有衝突或摩擦。 例如：人講：「洗碗有相磕」，戴共下多少仔會惹杈著，盡重要个還係愛互相尊重。","example":""},{"word":"燒壞話","pinyin":"seuˊ faiˋ fa","def":"把壞話轉告他人，以挑撥是非。 例如：有話當面講，毋好在人背後燒壞話。","example":""},{"word":"誚㸐","pinyin":"seuˊ nadˋ","def":"嘲諷、挖苦。亦可用「㸐人」表示用尖酸刻薄的話去挑釁人。 例如：誚㸐人个話，毋好儘採講，搏人惱就有。","example":""},{"word":"誚誚㸐㸐","pinyin":"seuˊ seuˊ nadˋ nadˋ","def":"冷言冷語，冷嘲熱諷。 例如：你講話毋好恁樣誚誚㸐㸐，下二擺無人愛插你。","example":""},{"word":"消耗人（消磨人）","pinyin":"seuˊ hoˊ nginˇ (seuˊ moˊ nginˇ)","def":"消遣他人。 例如：做人愛公當，毋好偏心講零星話消耗人。","example":""},{"word":"屎胐嘴","pinyin":"sii vudˋ zoi","def":"指人講話無效益，如放屁一樣；亦可指烏鴉嘴或口無遮攔。 例如：你這個屎胐嘴，麼个事情都敢講，故所無人愛插你。","example":""},{"word":"屎包","pinyin":"siiˋ bauˊ","def":"喻有自大狂的人。 例如：講著佢就火著！屎包得是仔，盡得人惱。","example":""},{"word":"屎狗","pinyin":"siiˋ gieuˋ","def":"罵人桀敖不馴而無用。 例如：該人當屎狗，喊佢做麼个事情就挶身分，喊佢毋贏。","example":""},{"word":"使狗相咬","pinyin":"siiˋ gieuˋ xiongˊ ngauˊ","def":"從旁煽動，使他人爭吵或打架。","example":""},{"word":"屎缸蟲","pinyin":"siiˋ gongˊ cungˇ","def":"喻好動靜不下來的人。","example":""},{"word":"使梟","pinyin":"siiˋ hieuˊ","def":"使詐。 例如：賭場肚个郎中當會使梟，愛細義！莫分佢騙去。","example":""},{"word":"使毋行","pinyin":"siiˋ mˇ hangˇ","def":"叫不動。 例如：佢異蠻皮，這下連先生就使毋行佢。","example":""},{"word":"使人","pinyin":"siiˋ nginˇ","def":"使喚人。","example":""},{"word":"使嘴","pinyin":"siiˋ zoi","def":"使喚。而「使人」表「使喚人」。","example":""},{"word":"屎供癲（屎棍癲）","pinyin":"siiˋ giung dienˊ (siiˋ gun dienˊ)","def":"不明事理的人。","example":""},{"word":"食毋燥","pinyin":"siid mˇ zauˊ","def":"吃不完兜著走，亦可說「㘔毋燥」；另有不甘願、不服氣之意。 例如：喊你掌菜秧仔，敢走出去尞，等下你就食毋燥咧！ 例如：佢分人賴做賊，聽著食毋燥。","example":""},{"word":"食人夠夠","pinyin":"siid nginˇ gieu gieu","def":"吃定他人。","example":""},{"word":"食人戇仔（㘔人戇仔）","pinyin":"siid nginˇ ngong eˋ (saiˊ nginˇ ngong eˋ)","def":"把人當傻瓜來耍。","example":""},{"word":"食漦","pinyin":"siid xiauˇ","def":"指很糟糕，不得人喜歡的行為，亦可說「㘔漦」。 例如：該警察還食漦，連兩日來開紅單。 例如：還食漦哦，看著該老阿伯跌倒吔，也毋會扶佢䟘起來。","example":""},{"word":"識識","pinyin":"siidˋ siidˋ","def":"非常熟識。 例如：你兜在講阿茂伯係無？大家識識个人啊！","example":""},{"word":"聖旨嘴","pinyin":"siin ziiˋ zoi","def":"謂說話靈驗。","example":""},{"word":"訟棍頭","pinyin":"xiung gun teuˇ","def":"好興訟者，易惹事造謠者。 例如：這隻訟棍頭，滿哪仔去這講該講，惹事佢盡慶。","example":""},{"word":"唆慫","pinyin":"soˊ sungˋ","def":"慫恿。 例如：限勢佢愛噭都毋得嘴扁吔，你又還唆慫佢。","example":""},{"word":"尚勝","pinyin":"song siin","def":"得寸進尺，恃寵而驕。 例如：無講佢無恁死，緊講緊尚勝。","example":""},{"word":"上面","pinyin":"songˊ mien","def":"恃寵而驕、不受教，尤指小孩。 例如：這細人仔縱到當上面，仰般講都講毋會聽。","example":""},{"word":"上面蹶蹶","pinyin":"songˊ mien kied kied","def":"形容小孩子恃寵而驕，不知進退。 例如：這細人仔縱到上面蹶蹶，連神桌都敢蹶上去。","example":""},{"word":"上面豺豺","pinyin":"songˊ mien saiˇ saiˇ","def":"賴皮、不知進退，也形容小孩易怒狀態。 例如：阿廷從細分人縱壞忒，動阿著就上面豺豺。","example":""},{"word":"手長長仔","pinyin":"suˋ congˇ congˇ eˋ","def":"伸手向人討取東西的樣子。 例如：食到恁大人，還愛手長長仔同爺哀拿錢，實在還見笑。","example":""},{"word":"守顧","pinyin":"suˋ gu","def":"看守、照顧。 例如：月給較多又仰仔？係講毋會守顧，賺較多乜無效。","example":""},{"word":"手尖腳幼","pinyin":"suˋ jiamˊ giogˋ iu","def":"手指尖細，膚肉幼嫩，指過著富裕清閒的生活，而不需勞動的人。 例如：看佢手尖腳幼个樣相，日仔怕過來異好，盡少做粗事。","example":""},{"word":"手擎擎仔","pinyin":"suˋ kiaˇ kiaˇ eˋ","def":"手臂高舉，喻有所動作的樣子。 例如：你做麼个手擎擎仔？想愛打人係無？","example":""},{"word":"手斂斂仔","pinyin":"suˋ liamˊ liamˊ eˋ【suˋ liamˋ liamˋ eˊ】","def":"兩手握於背後腰際，喻袖手旁觀。 例如：手斂斂仔企在該做麼个？還毋遽遽落來𢯭手。","example":""},{"word":"收馬","pinyin":"suˊ maˊ","def":"轉圜、調解、收拾。 例如：做頭路係擴張忒遽，一下毋堵好就會收馬毋轉。","example":""},{"word":"收馬毋轉","pinyin":"suˊ maˊ mˇ zonˋ","def":"收拾不了，無法轉圜。","example":""},{"word":"收承（承受）","pinyin":"suˊ siinˇ (siinˇ su)","def":"收拾保管。 例如：頭擺路項無人收承个骨骸，好心人會摎佢撿共下，這下人講該就係「有應公」。","example":""},{"word":"縮縮","pinyin":"suˇ suˇ","def":"不活潑，沒有勇氣的樣子。 例如：佢上擺發病過後，到今看起來還係縮縮。","example":""},{"word":"馴馴","pinyin":"sunˇ sunˇ","def":"很溫馴的樣子。 例如：該細妹仔，性體馴馴，盡得人惜。","example":""},{"word":"癲頭雞","pinyin":"dienˊ teuˇ gieˊ","def":"楞小子，或指小孩子不像樣，做事莽莽撞撞；不經考慮就亂來的人。 例如：該隻癲頭雞，逐擺做事情，毋係挨著神就係打著佛。","example":""},{"word":"雙頭蛇","pinyin":"sungˊ teuˇ saˇ","def":"兩頭蛇，指搬弄是非的兩面人。","example":""},{"word":"䌈手䌈腳","pinyin":"tagˋ suˋ tagˋ giogˋ","def":"手腳都綁著，形容做事受到牽制。 例如：佢當難服侍，加入來這團體顛倒䌈手䌈腳。 例如：有本等个人去食公家飯，下下愛照法辦理，嗄感覺著䌈手䌈腳。 例如：條件恁多，䌈手䌈腳，行頭个人愛仰般做事？","example":""},{"word":"大目格","pinyin":"tai mugˋ gagˋ","def":"無法承擔卻又貪多。 例如：仰會恁大目格，食毋去就莫拿恁多。","example":""},{"word":"大擘擘仔","pinyin":"tai bag bag eˋ","def":"形容自大神氣不可一世的樣子，也具不理人之意味。 例如：賺著該兩點錢就大擘擘仔，連人就毋會問吔！","example":""},{"word":"大肚籃","pinyin":"tai duˋ lamˊ","def":"食量大的人。 例如：佢麼个都食得落，故所講佢係大肚籃。","example":""},{"word":"大空剌剌仔【假大空】","pinyin":"tai kungˊ laˇ laˇ eˋ【gaˋ tai kangˊ】","def":"說大話的樣子。 例如：佢講話大空剌剌仔，到底信得抑信毋得？","example":""},{"word":"大蠻槌（蠻牛槌）","pinyin":"tai manˇ cuiˇ (manˇ ngiuˇ cuiˇ)","def":"蠻橫不明理的人。 例如：厥爸係一個大蠻槌，你同佢講無較爭啦！","example":""},{"word":"大面神","pinyin":"tai mien siinˇ","def":"比喻人臉皮厚，無羞恥之心。 例如：好手好腳嗄摎人討食，正經係大面神。","example":""},{"word":"䗆蜱食客","pinyin":"gonˊ biˊ siid hagˋ","def":"反客為主，被客人請客，源自「神明顯外莊，䗆蜱專食客」。","example":""},{"word":"大頭确","pinyin":"tai teuˇ kog","def":"戲稱別人的頭很大。","example":""},{"word":"大條","pinyin":"tai tiauˇ","def":"原指事情大條，後也用於表示架子大、很跩。 例如：這擺事情斯大條哩！看你愛仰結煞正好哪！ 例如：佢當選過後，加異大條，人喊佢斯喊毋停動哩！","example":""},{"word":"𢯭眾【跈眾】","pinyin":"ten zung【tenˇ zung】","def":"合群，跟隨大家一起從事某些事。 例如：這間廟愛修整，𠊎乜𢯭眾出兜錢。","example":""},{"word":"跈人走","pinyin":"tenˇ nginˇ zeuˋ","def":"跟著人跑，常用於與人私奔。","example":""},{"word":"跈嘴尾","pinyin":"tenˇ zoi miˊ","def":"跟著人說。 例如：鸚哥學話毋知意思，淨跈嘴尾定定。","example":""},{"word":"投吾膝頭","pinyin":"teuˇ ngaˊ qidˋ teuˇ","def":"投訴無用或多說無益。 例如：你講恁多做麼个？斯像投吾膝頭，無用啦！ 例如：做壞事還愛投人，正式係投吾膝頭。","example":""},{"word":"頭牲仔（畜生）","pinyin":"teuˇ sangˊ eˋ (cugˋ sangˊ)","def":"罵語，指沒有人性的禽獸。 例如：恁見笑个事佢也敢做，正經頭牲仔得是仔。","example":""},{"word":"矮人多心事","pinyin":"aiˋ nginˇ doˊ ximˊ sii","def":"負面詞，用來損人用。","example":""},{"word":"條直","pinyin":"tiauˇ ciid","def":"用來指人的性格乾脆俐落，不拖泥帶水。 例如：佢个人當條直，有錢黏時還。","example":""},{"word":"天天","pinyin":"tienˊ tienˊ","def":"無憂無慮，太過天真，形容不知輕重緩急的樣子。 例如：佢吂出過社會，人還天天，屋下人全驚佢分人騙。","example":""},{"word":"田螺取肚飽","pinyin":"tienˇ loˇ qiˋ duˋ bauˋ","def":"只管有得吃即可，引申為只顧享受眼前利益而不管其他的事，源自「田螺取肚飽，毋知屎胐生溜苔」。","example":""},{"word":"脫俐","pinyin":"todˋ li","def":"徹底斷絕關係。","example":""},{"word":"脫爪毋得","pinyin":"todˋ zauˋ mˇ dedˋ","def":"被糾纏無法脫身。 例如：貓扡粢粑，脫爪毋得。（諺） 例如：佢同人鬥股開公司，伸著債這下嗄脫爪毋得。","example":""},{"word":"托人","pinyin":"togˋ nginˇ","def":"奉承人家。 例如：佢當會托人，又嘴甜舌滑，搣到大家暢摸摸仔。","example":""},{"word":"托平平","pinyin":"togˋ piangˇ piangˇ","def":"承舉得很平順安定，另引申為奉承得順順適適的。 例如：厥頭家愛人摎佢托平平哦，派頭當粗。","example":""},{"word":"亂㧾","pinyin":"lon fud","def":"亂做一通。 例如：做事愛有順序，毋好亂㧾。","example":""},{"word":"斷情","pinyin":"tonˊ qinˇ","def":"分手。","example":""},{"word":"外板","pinyin":"ngoi banˋ","def":"外表或形象。 例如：這擺个活動，外板看起來異好看，裡肚可能還較精采！","example":""},{"word":"發花癲","pinyin":"bodˋ faˊ dienˊ","def":"男女因感情問題所導致的精神失常症狀。","example":""},{"word":"同著人","pinyin":"tungˇ doˋ nginˇ","def":"與人通姦、外遇。 例如：阿月仔正結婚無幾久，老公就同著人，佢緊噭，毋知愛仰仔正好。","example":""},{"word":"同庚","pinyin":"tungˇ gangˊ","def":"年齡相同。","example":""},{"word":"同門姨丈","pinyin":"tungˇ munˇ iˇ congˊ","def":"連襟，姊妹丈夫之間的稱呼，常用於向外人介紹彼此姻親關係時使用。","example":""},{"word":"話霸","pinyin":"va ba","def":"藉口，或指不必要的花招。 例如：講話合情合理就好，毋使恁多話霸。 例如：見做麼个事情就愛看日仔，恁多話霸。","example":""},{"word":"挖肉補瘡","pinyin":"vaˊ ngiugˋ buˋ congˊ","def":"同華語「挖東牆補西牆」，只是暫時化解困境，並未完全解決問題。 例如：毋怕阿爸會賺，倈仔了到大嫲空，挖肉補瘡敢有較爭？","example":""},{"word":"滑痢滑肚【屙痢滑肚】","pinyin":"vad li vad duˋ【oˊ li vad duˋ】","def":"指人隨口亂說話。 例如：佢長間講話就滑痢滑肚、無正無經，搣到無人愛同佢來往。","example":""},{"word":"歪潦【㜮漦】","pinyin":"vaiˊ lauˇ【lamˊ xiauˇ】","def":"物品或行為醜陋、差勁，令人難以接受。 例如：你實在盡歪潦，還做得用个東西就拿去擲忒。 例如：佢該樣相盡歪潦，見人看著就會打倒𢫦。","example":""},{"word":"橫笐橫袋（橫筒橫袋）","pinyin":"vang gongˇ vang toi (vang tungˇ vang toi)","def":"傾倒得亂七八糟，或形容人落魄潦倒。 例如：佢長透斯硬頸毋聽人講，生理做到橫笐橫袋。","example":""},{"word":"橫打直過","pinyin":"vangˇ daˋ ciid go","def":"肆無忌憚、橫行霸道，比喻暢行無阻。 例如：該兜鱸鰻仔輒常在市場橫打直過，大家全當惱佢。 例如：牛毋做，賊毋做，橫打直過。","example":""},{"word":"會生會死","pinyin":"voi sangˊ voi xiˋ","def":"藉口推辭規避或拒絕，常用於負面。 例如：喊你來𢯭搬一下桌仔，就會生會死，毋甘願樣仔。","example":""},{"word":"芋荷形","pinyin":"vu hoˇ hinˇ","def":"用於能賺錢卻存不了錢的人。 例如：算命仙講佢命底係芋荷形个，賺錢留毋核，故所佢就大開大使。","example":""},{"word":"四兩話","pinyin":"xi liongˊ fa","def":"說超過自己分量的話，源自「三兩人講四兩話」。","example":""},{"word":"四門六親","pinyin":"xi munˇ liugˋ qinˊ","def":"各方親戚。 例如：厥四門六親都戴附近仔定定，一旦都有相行。","example":""},{"word":"死發脹","pinyin":"xiˋ bodˋ zong","def":"詛咒語（原意為得浮腫病的人）；渾球。","example":""},{"word":"死該（堪該）","pinyin":"xiˋ goiˊ (kamˊ goiˊ)","def":"活該，該當如此。 例如：該細不仔偷東西，還分頭家挱著，這擺斯死該哩！ 例如：好个毋學，學人做賊仔，分警察捉去關，實在死該。","example":""},{"word":"死蛞蛞仔","pinyin":"xiˋ guadˋ guadˋ eˇ","def":"不靈活、不知變通。 例如：這隻人頭腦死蛞蛞仔，半點都毋知好變巧。","example":""},{"word":"死精","pinyin":"xiˋ jinˊ","def":"過度精明，多用於負面。 例如：佢兩姊妹死精，同阿姆出去全毋帶皮包仔，愛監阿姆出錢。","example":""},{"word":"死佬","pinyin":"xiˋ loˋ","def":"死屍，謂頭腦僵化如死人般不知變通。 例如：仰會恁死佬？若錢分人騙淨淨，你還同佢恁仔細哦？","example":""},{"word":"死絕絕","pinyin":"xiˋ qied qied","def":"死光光。 例如：該農藥還強哦，一洩落去，滿坪个草仔死絕絕。","example":""},{"word":"死像種","pinyin":"xiˋ qiong zungˋ","def":"罵人不好的特質是遺傳自家中長輩，常用於負面。 例如：厥性懶尸又好譴，死像種，看著就得人惱。","example":""},{"word":"死㘔","pinyin":"xiˋ saiˊ","def":"罵人貪吃。 例如：莫恁死㘔，分兜仔若老弟食。","example":""},{"word":"死㘔無變","pinyin":"xiˋ saiˊ moˇ bien","def":"罵人不知長進、不思變通，具貶義。 例如：你死㘔無變，食到恁老，還毋知長進。","example":""},{"word":"死孤盲","pinyin":"xiˋ goˊ moˊ","def":"該死了，糟糕了！ 例如：手機仔無電，身項又無半滴錢，這下斯死孤盲哩！","example":""},{"word":"死齧齧仔","pinyin":"xiˋ ngadˋ ngadˋ eˇ","def":"一動也不動的樣子，形容不知隨環境變通。 例如：佢坐等死齧齧仔，毋曉招呼人。","example":""},{"word":"胥胥趖趖","pinyin":"xiˇ xiˇ soˇ soˇ","def":"狀聲詞，常用於沒有目的在四處漫遊蹓躂的樣子。 例如：走去哪胥胥趖趖？恁夜正轉。 例如：尞日佢當好去街路胥胥趖趖，都當夜正轉。","example":""},{"word":"瀉人面皮","pinyin":"xia nginˇ mien piˇ","def":"丟別人的臉、讓人沒面子。","example":""},{"word":"瀉祖公","pinyin":"xia zuˋ gungˊ","def":"丟祖先的臉。 例如：做出這種見笑个事情，實在瀉祖公。","example":""},{"word":"仙仙","pinyin":"xienˊ xienˊ","def":"喻人漫不經心的樣子。 例如：佢係仙仙个人，恁重要个事情毋好喊佢做。","example":""},{"word":"信嘴出","pinyin":"xin zoi cudˋ","def":"隨口說出，信口開河。 例如：佢講話無考慮，動啊著就信嘴出。","example":""},{"word":"𠕆𠕆","pinyin":"xioˇ xioˇ","def":"呆滯、沒有精神的樣子。 例如：佢係毋係識發燒過度，仰看起來𠕆𠕆樣仔？","example":""},{"word":"相駁","pinyin":"xiongˊ bogˋ","def":"互相爭辯。","example":""},{"word":"息嫲","pinyin":"sedˋ maˇ","def":"曾孫。","example":""},{"word":"拶頭","pinyin":"zad teuˇ","def":"形容人僵化不知變通。 例如：佢當拶頭，正會人講麼个都聽毋入耳。","example":""},{"word":"折福","pinyin":"zadˋ fugˋ","def":"因浪費的行為而折損了原有的福分，引申為不知惜福。 例如：好好个東西毋食還拿去擲忒，還折福。","example":""},{"word":"斬千刀","pinyin":"zamˋ qienˊ doˊ","def":"用以罵壞事做盡，理應受千刀萬剮的人。 例如：該隻人壞事做恁多，捉著愛斬千刀正做得。","example":""},{"word":"整治","pinyin":"zangˋ cii","def":"修理、教訓。 例如：佢逐擺就恁會搣衰人，愛摎佢整治正好。","example":""},{"word":"爭天毋贏","pinyin":"zangˊ tienˊ mˇ iangˇ","def":"無法與大自然競爭。","example":""},{"word":"增志","pinyin":"zen zii","def":"積極、爭氣。 例如：佢係一家之主，責任㧡當重，毋較增志兜仔仰會做得。","example":""},{"word":"走毋開腳","pinyin":"zeuˋ mˇ koiˊ giogˋ","def":"形容因某事纏身，無法離開、或捨不得離開之狀態。也可說「行毋開腳」。 例如：厥姆開刀，佢愛服侍厥姆，走毋開腳。 例如：赴車時間到哩，細人仔緊噭，害佢走毋開腳。","example":""},{"word":"走無空囥【走無空庰】","pinyin":"zeuˋ moˇ kungˊ kong【zeuˋ moˇ kangˊ biang】","def":"喻死命地奔逃，無可藏身之處。 例如：老鼠看著貓仔，全部驚到走無空囥。","example":""},{"word":"即靈","pinyin":"jidˋ linˇ","def":"聰敏機伶。 例如：這細妹仔從細就當即靈，大吔盡會讀書。","example":""},{"word":"制著","pinyin":"zii doˋ","def":"受限制、被牽制。 例如：看等電視當好看，嗄停電，這擺就分佢制著哩！","example":""},{"word":"子子肉肉","pinyin":"ziiˋ ziiˋ ngiugˋ ngiugˋ","def":"親生子女、心肝寶貝。 例如：逐個細人仔都係爺哀个子子肉肉。","example":""},{"word":"膣寶","pinyin":"ziiˊ boˋ","def":"譏諷過度保護的態度。 例如：佢該䯋鍊像膣寶樣仔，毋盼得拿出來戴。","example":""},{"word":"外姓人","pinyin":"ngoi xiang nginˇ","def":"異姓人。 例如：這土地做毋得賣分外姓人。","example":""},{"word":"執性","pinyin":"ziibˋ xin","def":"指人個性固執、堅持己見，不肯變通。 例如：這個細人仔想愛做麼个就做麼个，盡執性。","example":""},{"word":"做雜事（做雜差）","pinyin":"zo cab se (zo cab caiˊ)","def":"處理一些微不足道的雜瑣事務。 例如：佢在農會做雜事，先學兜仔東西。","example":""},{"word":"做膽","pinyin":"zo damˋ","def":"壯膽。 例如：好得有你做膽，這擺个比賽正會恁順序。","example":""},{"word":"做對頭","pinyin":"zo dui teuˇ","def":"形成對立的一方或是做結婚的對象。而對立的雙方則稱為「兩對頭」。 例如：原來佢兜係好朋友，今嗄因為選舉做對頭。","example":""},{"word":"拖皮","pinyin":"toˊ piˇ","def":"藉故拖延不履行義務，形容行為賴皮。 例如：這條錢，講下禮拜一還就係下禮拜一，半息都拖皮毋得。","example":""},{"word":"做好做歪（做好做壞）","pinyin":"zo hoˋ zo vaiˊ (zo hoˋ zo faiˋ)","def":"雙面人，時而向著我們，時而向著他人。","example":""},{"word":"做年做月","pinyin":"zo ngienˇ zo ngied","def":"經年累月在做。 例如：阿爸耕田做年做月也無長著麼个錢，實在還辛苦。","example":""},{"word":"早死早贏","pinyin":"zoˋ xiˋ zoˋ iangˇ","def":"死去比活著的好、早死較好，罵人或自怨自艾的話，亦可說「早走早贏」。 例如：像該種恁壞个人，早死早贏。","example":""},{"word":"捉猴入山","pinyin":"zogˋ heuˇ ngib sanˊ","def":"喻做事反其道而行。（歇）","example":""},{"word":"盤牙風","pinyin":"panˇ ngaˇ fungˊ","def":"聊天、閒聊。","example":""},{"word":"嘴長長仔","pinyin":"zoi congˇ congˇ eˋ","def":"張口欲食或欲言的樣子。 例如：嬰兒仔嘴長長仔，想愛食乳。","example":""},{"word":"嘴屈屈仔","pinyin":"zoi kud kud eˋ","def":"形容不善言詞。 例如：佢這人嘴屈屈仔，無麼个會問人。","example":""},{"word":"嘴碼","pinyin":"zoi maˊ","def":"開口與人說話問候的態度，例如「嘴碼異好」即指善於開口向人問好，貼心的樣子。「好嘴碼」即嘴很甜。","example":""},{"word":"嘴硬屎胐冇","pinyin":"zoi ngang sii vudˋ pang","def":"表裡不一、外強中乾，光說不練。 例如：阿光正經係嘴硬屎胐冇，喊佢出門摎人交涉總係驚這驚該。","example":""},{"word":"嘴勺勺仔","pinyin":"zoi sog sog eˋ","def":"聽或看得入神的樣子。 例如：講个人講到口涎波潑，聽个人聽到嘴勺勺仔。","example":""},{"word":"脧面脧面（脧頭脧面）","pinyin":"zoiˊ mien zoiˊ mien (zoiˊ teuˇ zoiˊ mien)","def":"罵人愚笨。 例如：仰會食到恁大人吔還脧面脧面，毋知人好壞。","example":""},{"word":"脧面（脧脧、脧槌）","pinyin":"zoiˊ mien (zoiˊ zoiˊ、zoiˊ cuiˇ)","def":"罵人愚笨。 例如：莫逐擺就講人脧面，你自家敢有較精？","example":""},{"word":"脧子","pinyin":"zoiˊ ziiˋ","def":"傻子，指愚笨的人。 例如：脧子係無？分人騙還同人講恁仔細。","example":""},{"word":"轉鉸","pinyin":"zonˋ gau","def":"轉圜，運轉；轉身。 例如：做這工程係無增加人手，會轉鉸毋過。 例如：這所在恁狹，轉鉸毋得。","example":""},{"word":"轉嘴","pinyin":"zonˋ zoi","def":"轉變口吻、改口，亦可說「轉話頭」。 例如：三日前佢應承借𠊎五萬銀，這下又轉嘴講佢無錢。 例如：佢本來在該投阿菊，毋過看著阿菊行啊過來，跈等就轉嘴講厥好話。","example":""},{"word":"莊伯姆","pinyin":"zongˊ bagˋ meˊ","def":"穿梭於莊中，熟悉莊中事，老少皆曉的婦人。","example":""},{"word":"酒席","pinyin":"jiuˋ xid","def":"宴請賓客或聚會時所用的整桌酒菜，亦可說「桌席」。","example":""},{"word":"咒孤罵絕【罵孤罵絕】","pinyin":"zu goˊ ma qied【ma goˊ ma qied】","def":"用狠話罵人，帶詛咒意味。 例如：死良絕心个事都敢做，就愛堪得分人咒孤罵絕。","example":""},{"word":"蛀錢精","pinyin":"zu qienˇ jinˊ","def":"指不會賺錢卻揮霍無度的人。","example":""},{"word":"咒天咒地","pinyin":"zu tienˊ zu ti","def":"指天指地發誓，表說話堅決肯定的意思，亦可說「咒天罵日」。 例如：別儕一滴仔對你毋過，毋好就咒天咒地，恁樣對你自家毋好。","example":""},{"word":"主人讓客","pinyin":"zuˋ nginˇ ngiong hagˋ","def":"主人禮讓客人，主要用在吃飯時。 例如：主人讓客係請人个禮數。","example":""},{"word":"豬哥形","pinyin":"zuˊ goˊ hinˇ","def":"好色之徒。 例如：該人豬哥形，故所細妹仔當惱佢。","example":""},{"word":"豬接勺","pinyin":"zuˊ jiabˋ sog","def":"餵豬時，豬隻搶食勺中食物的情形，常用於形容人搶嘴說話的行為。 例如：人話還吂講忒，佢就搶等愛講，正經係豬接勺，當得人惱。","example":""},{"word":"豬哥搭狗膦","pinyin":"zuˊ goˊ dabˋ gieuˋ linˋ","def":"比喻說話不搭調或胡亂搭配。 例如：同佢講話就像豬哥搭狗膦，還係莫講較贏。","example":""},{"word":"竹篙鬼【長腳仔】","pinyin":"zugˋ goˊ guiˋ【congˇ giogˋ eˋ】","def":"喻體型高瘦之人，帶有貶義。","example":""},{"word":"總成","pinyin":"zungˋ siinˇ","def":"成全、加利益予某人物。 例如：俗話「貓躁飯甑總成狗」係在講人做白工。","example":""},{"word":"舂上跌落","pinyin":"zungˊ songˊ diedˋ log","def":"形容忙裡忙外，沒得安寧的樣子。 例如：你透日舂上跌落，到底在無閒麼个？","example":""},{"word":"舂頭磕額【舂頭磕腦】","pinyin":"zungˊ teuˇ kab ngiagˋ【zungˊ teuˇ kab noˋ】","def":"形容忙碌奔波，焦頭爛額。 例如：選舉會到吔，逐個候選人都舂頭磕額在該拉選票。","example":""},{"word":"大戇槌","pinyin":"tai ngong cuiˇ","def":"愚痴之人。 例如：這隻大戇槌，㧡米去換番薯。","example":""},{"word":"屙屙膿膿","pinyin":"oˊ oˊ nungˇ nungˇ","def":"隨口亂說話。 例如：佢講个話屙屙膿膿，毋好儘採信。","example":""},{"word":"擎膦毋會轉肩","pinyin":"kiaˇ linˋ mˇ voi zonˋ gienˊ","def":"比喻不知變通。","example":""},{"word":"餒餒餒餒","pinyin":"neˇ neˇ ne ne","def":"不乾脆的樣子。","example":""},{"word":"恁久仔","pinyin":"an giuˋ eˇ","def":"時間很短。","example":""},{"word":"擺把仔","pinyin":"baiˋ baˋ eˇ","def":"偶爾。","example":""},{"word":"比比","pinyin":"beˇ beˇ","def":"兩者並排一齊，例「比比坐」即指並肩坐在一起。","example":""},{"word":"座往上","pinyin":"co gongˊ songˊ","def":"在上方。相反詞為「座往下」，即在下方。","example":""},{"word":"粗粗仔","pinyin":"cuˊ cuˊ eˋ","def":"簡單地，不特殊；稍微。 例如：又毋係愛請人，粗粗仔食就做得哩，毋使煮恁豐沛。 例如：田荒忒恁久，今晡日先粗粗仔改改啊就好。","example":""},{"word":"眼時間","pinyin":"ngienˋ siiˇ gienˊ","def":"目前、現在。 例如：厥个病，眼時間看來無打緊，可能一兩日就會好吔。","example":""},{"word":"當過","pinyin":"dong go","def":"勝過。 例如：天時恁熱，食西瓜當過食冰。","example":""},{"word":"棟頂項","pinyin":"dung dangˋ hong","def":"頂端。","example":""},{"word":"或或仔","pinyin":"fed fed eˋ","def":"約略的（或多或少的）。 例如：這件事情个頭尾，𠊎或或仔知。","example":""},{"word":"合界","pinyin":"gabˋ gie【gabˋ giai】","def":"交界。例如「兩合界」即指兩邊交界處。 例如：阿賢伯戴在大湖同獅潭合界个位所。","example":""},{"word":"隔遠","pinyin":"gagˋ ienˋ","def":"隔著一段較長的距離。 例如：佢生到嶄然高，隔遠就看著佢行過來。","example":""},{"word":"徑背","pinyin":"gang boi","def":"界線之外。 例如：厥倈仔踢球踢到徑背去吔，尋就尋毋著。","example":""},{"word":"過晝缽𤊶","pinyin":"go zu badˋ ladˋ","def":"逾越中午時段太多。 例如：分人請愛早啊去，過晝缽𤊶正到，人全食飽哩！","example":""},{"word":"歸拖拉","pinyin":"guiˊ toˊ loˊ","def":"拖拉指木箱，歸拖拉引申為一大串、一大堆，亦可說「歸大堆」、「歸拖拉庫」。 例如：若眠床項衫褲歸拖拉，係愛拿來墊睡係無？","example":""},{"word":"還成","pinyin":"hanˇ sangˇ","def":"副詞，實在。 例如：若花園个花開到還成靚。","example":""},{"word":"入頭","pinyin":"ngib teuˇ","def":"更深入。 例如：乞食仔占門樓，緊占緊入頭。","example":""},{"word":"寅時卯時","pinyin":"iˇ siiˇ mauˊ siiˇ","def":"隨時，不論何時；立刻、馬上。 例如：東西𠊎準備便便，你寅時卯時講愛，𠊎都會赴分你。","example":""},{"word":"一齣火","pinyin":"idˋ cudˋ foˋ","def":"一鼓作氣；一口氣，兩三下的意思。 例如：朝晨這班人落田割禾，一齣火大坵嫲就畀割忒哩。","example":""},{"word":"一對時","pinyin":"idˋ dui siiˇ","def":"二十四小時，即一整天。 例如：這膏藥貼落去，愛經過一對時正好換。","example":""},{"word":"總洗","pinyin":"zungˋ seˋ","def":"概括。 例如：這桃仔伸這兜仔定定，便宜總洗忒去！","example":""},{"word":"一抹煞","pinyin":"idˋ madˋ sadˋ","def":"通通、全部，包含一切。 例如：人都無在吔，佢少个這兜數一抹煞就算吔。","example":""},{"word":"一晝邊","pinyin":"idˋ zu bienˊ","def":"大約半個白天的時間。 例如：這毋使用著歸日仔，差毋多一晝邊就做得好。","example":""},{"word":"一時半刻（一時八刻）","pinyin":"idˋ siiˇ ban kiedˋ (idˋ siiˇ badˋ kiedˋ)","def":"指時間急迫。 例如：這係緊急个事情，你一時半刻就愛同𠊎送到。","example":""},{"word":"及及","pinyin":"kib kib","def":"謂時間非常緊迫，有緊繃之意。 例如：拖到時間及及，毋知做得忒無？","example":""},{"word":"確確係","pinyin":"kogˋ kogˋ he","def":"確實如此。","example":""},{"word":"攬總","pinyin":"lamˋ zungˋ","def":"總共。 例如：這兜樹秧攬總幾多錢？做得算較相引兜仔無？","example":""},{"word":"呂宋加拉巴","pinyin":"liˊ sung gaˊ laˊ baˊ","def":"形容遙遠地區。","example":""},{"word":"了了","pinyin":"liauˋ liauˋ","def":"盡、遍、很多的樣子。例如「桌項塵灰了了」、「全部若話了了」。","example":""},{"word":"連頭並根","pinyin":"lienˇ teuˇ bin ginˊ","def":"比喻全部。 例如：七層塔摘兜仔就好，毋好連頭並根挷走，留兜分佢傳種。","example":""},{"word":"量約仔","pinyin":"liong iogˋ eˇ","def":"大約；從略從簡、從寬。 例如：對這到車頭，量約仔愛有成十分鐘正行得到。 例如：這問題嶄然難，量約仔分佢敨下氣，莫恁嚴條哪。","example":""},{"word":"量早","pinyin":"liong zoˋ","def":"趁早，事先估算。 例如：愛帶麼个愛量早準備好勢，毋好到時節緊拚拚仔。","example":""},{"word":"六月天公","pinyin":"liugˋ ngied tienˊgungˊ","def":"六月酷熱的季節；六月農忙時節，比喻忙得不可開交。","example":""},{"word":"老底","pinyin":"loˋ daiˋ","def":"原初，本來。 例如：𠊎老底歇屏東，這下歇臺北。","example":""},{"word":"老時","pinyin":"loˋ siiˇ","def":"舊時。 例如：佢十分做家，屋下裡肚有兜老時个家具都毋盼得攉忒。","example":""},{"word":"攏棚（攏總）","pinyin":"lungˊ pangˇ (lungˊ zungˋ)","def":"全部，以普遍性而言。 例如：這下个大學生做得講攏棚都有用手機仔。","example":""},{"word":"作當","pinyin":"zogˋ dong","def":"當作；即使；抵押。 例如：作當係恁樣，你乜莫怪怨佢。 例如：𠊎吂有錢好還你，這櫃仔來作當。","example":""},{"word":"沒坪","pinyin":"mud piangˇ","def":"整片滿滿的，到處都是。 例如：佢洗車仔，水無撙緪，流到禾埕沒坪都係水。 例如：這位辦活動，沒坪个人，尖都尖毋落。","example":""},{"word":"𥍉下目","pinyin":"ngiabˋ ha mugˋ","def":"眨一下眼，表瞬間之意。也可表小睡片刻。","example":""},{"word":"額","pinyin":"ngiagˋ","def":"份量。 例如：這等路係分你个，無厥額。 例如：知得臭豆腐你毋好食，故所無買若額。","example":""},{"word":"日合夜【日帶夜】","pinyin":"ngidˋ gagˋ ia【ngidˋ dai ia】","def":"日連夜，即日以繼夜。 例如：毋好日合夜搞電腦，身體會搣壞忒。","example":""},{"word":"日見日","pinyin":"ngidˋ gien ngidˋ","def":"日復一日。 例如：日見日，年視年，阿爸人緊來緊老，面皮緊來緊皺。","example":""},{"word":"月朔","pinyin":"ngied sogˋ","def":"日期、期間。 例如：這下正開學定定，到畢業該下雖然月朔長，頭路還係做得先尋等來。","example":""},{"word":"年三夜四","pinyin":"ngienˇ samˊ ia xi","def":"臨近年關的時候，正忙著準備過年的情形，也可喻期限前，忙碌趕工的時刻。 例如：你仰毋早講，年三夜四正講，麼人有閒？","example":""},{"word":"年視年","pinyin":"ngienˇ sii ngienˇ","def":"年復一年。 例如：屋壞就愛整，放等年視年會還較難整哦！","example":""},{"word":"三不二時","pinyin":"samˊ budˋ ngi siiˇ","def":"偶而、有時候。 例如：阿全嫂搬走了後，三不二時還會倒轉來尞。","example":""},{"word":"三三仔","pinyin":"samˊ samˊ eˋ","def":"約略其事、不苛求其好。 例如：鴨仔个毛菇仔恁多，愛夾到幾時，三三仔就好哩！","example":""},{"word":"三分十秒","pinyin":"samˊ funˊ siib meuˋ","def":"喻指很短的時間。","example":""},{"word":"屎背尾","pinyin":"sii boi miˊ","def":"背後。 例如：雞嫲个屎背尾跈等一群雞子。","example":""},{"word":"十頭八日","pinyin":"siib teuˇ badˋ ngidˋ","def":"八天、十天內，表約略的時間。","example":""},{"word":"順掖仔","pinyin":"sun ie eˋ","def":"順勢、順便。 例如：你係有去街項，順掖仔買擐衛生紙轉來。","example":""},{"word":"脣脣","pinyin":"sunˇ sunˇ","def":"物品的邊邊處。 例如：杯仔毋好放到桌仔脣脣，毋注意會打爛忒。","example":""},{"word":"頭項","pinyin":"teuˇ hong","def":"最前面、前方。 例如：目珠恁大粒，頭項該黃色个敢毋係若茶罐仔？ 例如：該菠麗菜，對頭項割下來，順續摎菜蓋擇擇啊！","example":""},{"word":"天腳","pinyin":"tienˊ giogˋ","def":"地平線。","example":""},{"word":"天西恁遠【天都無恁遠】","pinyin":"tienˊ xiˊ anˋ ienˋ【tienˊ duˊ moˇ anˋ ianˋ】","def":"像前往西天一般，用以指稱距離很遠。 例如：巴西天西恁遠，你識去過無？","example":""},{"word":"斷點錢","pinyin":"tonˊ diamˋ qienˇ","def":"一點錢也沒有。相關句型有「斷粒米」、「斷滴水」、「斷條菜」。","example":""},{"word":"屋前屋背","pinyin":"vugˋ qienˇ vugˋ boi","def":"謂住宅附近的地方。 例如：屋前屋背全尋過哩，無看著人，敢係去過家尞吔？","example":""},{"word":"過䢍","pinyin":"go fang","def":"過頭，超過原本之目的地路程。例如「走過䢍」表示跑過頭、「睡過䢍」表示睡過頭。","example":""},{"word":"朝晨暗晡","pinyin":"zeuˊ siinˇ am buˊ","def":"早晨及晚上；指早晚不定之時。 例如：老人家就驚朝晨暗晡有燒有冷，故所還係愛有人照顧。","example":""},{"word":"䃗頂跑馬","pinyin":"bogˋ dangˋ pauˊ maˊ","def":"馬在石堤上跑，對馬蹄有很大的傷害；用來比喻事情不妙、糟糕之意，亦可說「河壩跑馬」。 例如：借錢分佢去賭，該斯係䃗頂跑馬。 例如：風搓天停電，手電仔又無電，正經係䃗頂跑馬，壞蹄哩。","example":""},{"word":"不勝","pinyin":"budˋ siin","def":"非常。 例如：真實愛去過太魯閣，正知該風景不勝靚，有閒定著愛去尞。","example":""},{"word":"得是仔","pinyin":"dedˋ sii eˋ","def":"語助詞（日語借音），表確定。 例如：𠊎看你嘴講無愛，心肝肚斯當想得是仔。","example":""},{"word":"加勢","pinyin":"gaˊ sii","def":"更加…。 例如：限勢衫就爛空吔，分厥孫仔一拉，加勢擘還較大空。","example":""},{"word":"合本","pinyin":"gabˋ bunˋ","def":"只不過。 例如：合本三儕人開會定定，做麼个愛借這間大教室？","example":""},{"word":"結局","pinyin":"giedˋ kiug","def":"終究。 例如：想講會有人來𢯭做就較輕鬆，背尾頭家講人毋罅，結局還係總下愛自家來做。","example":""},{"word":"僅可","pinyin":"giunˋ koˋ","def":"僅能、只能。 例如：頭擺人米毋罅食，僅可煮番薯飯來過餐。","example":""},{"word":"講罔講","pinyin":"gongˋ mongˋ gongˋ","def":"姑且一說；說實在的。 例如：講罔講啦，佢敢正經會改過，麼人知？","example":""},{"word":"去毋得","pinyin":"hi mˇ dedˋ","def":"無法前往、不能前往。「去得」則表示「可以前往」。相關句式為「動詞＋毋得」，例如「食毋得」、「看毋得」等。 例如：這禮拜食酒堵好堵著廟項做鬧熱，佢去毋得。","example":""},{"word":"玄玄風","pinyin":"hienˇ hienˇ fungˊ","def":"忽然，謂突如其來的事，亦可說「𢫦𢫦風」。","example":""},{"word":"砰天砰地","pinyin":"bong tienˊ bong ti","def":"聲音響亮。 例如：過年該下，紙炮仔打到砰天砰地。","example":""},{"word":"縱定","pinyin":"jiungˋ tin","def":"縱然、縱使。","example":""},{"word":"毋敢話（無定著）","pinyin":"mˇ gamˋ va (moˇ tin cog)","def":"說不定。 例如：叔公看佢擐等等路行入來，想講怕係來會失禮个乜毋敢話。","example":""},{"word":"吂曾吂抵","pinyin":"mangˇ qienˇ mangˇ diˋ","def":"時候未到。 例如：吂曾吂抵啊！你恁早去做麼个？同人洗揫係無？","example":""},{"word":"吂好食","pinyin":"mangˇ hoˋ siid","def":"還沒熟或還沒煮好，還不能吃。 例如：這果子皮還青青，吂好食。 例如：菜吂炒好，吂好食，你先去廳下坐等尞。","example":""},{"word":"問支柄來擎","pinyin":"mun giˊ biang loiˇ kiaˇ【mun giˊ biang loiˇ ngiaˇ】","def":"打破砂鍋問到底，一定要問出所以然來，讓人覺得很煩。","example":""},{"word":"仰得時","pinyin":"ngiong dedˋ siiˇ","def":"要待到何時。表示時間還需要很久。 例如：這下種椰仔苗，仰得時正有椰仔好摘來食？","example":""},{"word":"愛等哩","pinyin":"oi denˋ liˋ","def":"猶言「等著吧」、「甭想了」的意思。 例如：等𠊎煮分你食？愛等哩！","example":""},{"word":"愛嫌罔嫌","pinyin":"oi hiamˇ mongˋ hiamˇ","def":"說它不好嘛也蠻好的；姑妄言之。","example":""},{"word":"全全","pinyin":"qionˇ qionˇ","def":"全然地；確切的。 例如：教佢恁多擺，佢還係全全聽毋識。","example":""},{"word":"省使","pinyin":"sangˋ siiˋ","def":"省得、免得。 例如：屋下到車頭近近仔，你自家行轉來，乜省使人載。","example":""},{"word":"十二月个芥菜","pinyin":"siib ngi ngied ge gie coi","def":"種植的蔬菜過於成熟以致抽出花梗，是為上心；以「上心」諧音「傷心」，源自「十二月个芥菜—上心」。","example":""},{"word":"大體頭","pinyin":"tai tiˋ teuˇ","def":"大體而論。","example":""},{"word":"做你走（做你去）","pinyin":"zo ngˇ zeuˋ (zo ngˇ hi)","def":"任隨你去，「走（去）」可用其他動詞替換，意指任隨你…。 例如：係無想愛做，做你走，無人會留你。","example":""},{"word":"晝晝暗暗","pinyin":"zu zu am am","def":"沒日沒夜，不定時，強調超過午休、下班的時間。 例如：厥頭路盡無閒，逐日都做到晝晝暗暗無好放尞。 例如：趕工時節，大家都做到晝晝暗暗。","example":""},{"word":"磅輪（爆輪）","pinyin":"bong lin (bau lin)【bong lien】【bau lien】","def":"車子爆胎。 例如：吾自行車磅輪，還補得無？","example":""},{"word":"結石䃗","pinyin":"giedˋ sag bogˋ","def":"砌石堤。","example":""},{"word":"結磚仔","pinyin":"giedˋ zonˊ eˋ","def":"砌磚；俗隱指打麻將。","example":""},{"word":"揚瓦","pinyin":"iongˇ ngaˋ","def":"蓋上瓦片。 例如：屋頂个桁桷愛釘平，揚瓦以後正毋會漏水。","example":""},{"word":"翹峨翹棟","pinyin":"kieu ngoˇ kieu dung","def":"形容屋宇外觀壯麗。 例如：這間廟起到翹峨翹棟，可惜都係用紅毛泥淋起來个。","example":""},{"word":"作陂塘","pinyin":"zogˋ biˊ tongˇ","def":"築池塘。","example":""},{"word":"陋陋肖肖","pinyin":"leu leu seu seu","def":"形容建物或設備簡陋的樣子。 例如：老屋盡久無人歇，陋陋肖肖。","example":""},{"word":"礫礫矻矻","pinyin":"lid lid kid kid","def":"路多石頭，高低不平的樣子。 例如：新開个路，當多石頭，行起來礫礫矻矻。","example":""},{"word":"路徑頭","pinyin":"lu gang teuˇ","def":"通道或路的中間。 例如：東西毋好放在路徑頭，會杈著人。","example":""},{"word":"路頭","pinyin":"lu teuˇ","def":"路程，或路的起始點。 例如：這位到該位，愛三日个路頭。 例如：對路頭行落這隻莊項，差毋多愛花二十分鐘。","example":""},{"word":"路頭路尾","pinyin":"lu teuˇ lu miˊ","def":"整條路上，大多指不定點的路上。 例如：阿爸摎路頭路尾个樹椏仔拈開，佢講恁樣正毋會杈著人。","example":""},{"word":"盤車","pinyin":"panˇ caˊ","def":"轉車，指無法直達目的地，途中換搭別的車。 例如：愛坐海線个旅客，請在竹南站盤車。","example":""},{"word":"水汴頭","pinyin":"suiˋ banˊ teuˇ","def":"大圳設水門分水入支渠的地方。 例如：這位安到「水汴頭」，係頭擺大圳分水个所在。","example":""},{"word":"信肉","pinyin":"xin ngiugˋ","def":"相較於「信皮」，指信封內的信（有寫東西的）。","example":""},{"word":"挨著神打著佛","pinyin":"aiˊ doˋ siinˇ daˋ doˋ fud","def":"本指觸犯了神佛，引申做事碰撞，或觸犯到某人。 例如：佢恁久做事無順利，係毋係挨著神打著佛。","example":""},{"word":"庵堂","pinyin":"amˊ tongˇ","def":"庵堂，尼姑居住、禮佛的小型宗教場所。","example":""},{"word":"詏命毋贏","pinyin":"au miang mˇ iangˇ","def":"凡事命中已註定，不容改變。 例如：人个命運，一落泥時就註定吔，詏命毋贏。","example":""},{"word":"百年","pinyin":"bagˋ ngienˇ","def":"一百年。","example":""},{"word":"百年偕老","pinyin":"bagˋ ngienˇ haiˇ loˋ","def":"祝福夫妻倆人共同生活和好又長壽；老死的婉語。","example":""},{"word":"百年後","pinyin":"bagˋ ngienˇ heu","def":"比喻死後。","example":""},{"word":"拜喏【唱喏】","pinyin":"bai iaˊ【cong iaˊ】","def":"兩手合十置於胸前上下拜，表示對鬼神的敬意。 例如：逐日朝晨，阿公都會擐神茶去伯公下拜喏。","example":""},{"word":"拜轎","pinyin":"bai kieu","def":"結婚過程中，新娘到達男方家門口時，男家以一小童至轎前迎接新娘的儀式。","example":""},{"word":"拜月","pinyin":"bai ngied","def":"指客家人「拜月華」的傳統。","example":""},{"word":"胞衣跡","pinyin":"bauˊ iˊ jiagˋ","def":"指出生地。先民將嬰兒出生時的胎盤埋在住家附近，故稱「胞衣跡」為出生地。","example":""},{"word":"凴壁山","pinyin":"ben biagˋ sanˊ","def":"地理風水裡的後背靠山；所能倚靠的人或權勢。 例如：這門風水異靚，後背有凴壁山。 例如：厥凴壁山就係這公司个董事長，難怪恁毋驚人。","example":""},{"word":"拚廳下","pinyin":"biang tangˇ haˊ【bia tangˇ haˊ】","def":"本義指清掃廳堂，此指喪事前後清理廳堂。","example":""},{"word":"丙運","pinyin":"biangˋ iun","def":"壞運。","example":""},{"word":"放人","pinyin":"biong nginˇ","def":"用符咒或放蠱害人。","example":""},{"word":"放符誥","pinyin":"biong puˇ gau","def":"用符咒害人。","example":""},{"word":"分醮墓（打醮墓、分粄仔）","pinyin":"bunˊ zeu mu (daˋ zeu mu、bunˊ banˋ eˇ)","def":"向掃墓者分取祭品。","example":""},{"word":"湊牲","pinyin":"ceu senˊ","def":"湊成整套祭品。","example":""},{"word":"超拔","pinyin":"ceuˊ pad","def":"超渡亡靈，禮俗用語。","example":""},{"word":"坐上橫頭","pinyin":"coˊ song vangˇ teuˇ","def":"在筵席中坐大位。 例如：原旦个俗講，討心臼个時節愛請阿舅來坐上橫頭。","example":""},{"word":"床公婆","pinyin":"congˇ gungˊ poˇ","def":"民俗中指照顧小孩的床神。","example":""},{"word":"長錢","pinyin":"congˇ qienˇ","def":"祭祀天神時所使用的長條紙錢。","example":""},{"word":"出過世","pinyin":"cudˋ go se","def":"下輩子；比喻經歷過了大災難。 例如：佢想做總統，驚怕愛出過世正講。 例如：無分大地動矺死，就像出過世共樣。","example":""},{"word":"塚埔狗","pinyin":"cungˋ puˊ gieuˋ","def":"棺材狗，原指在墳地挖掘屍體吃的狗，後喻墳地黃牛。 例如：若爸个墳地愛尋公家申請，毋好分塚埔狗騙去哦！","example":""},{"word":"塚埔","pinyin":"cungˋ puˊ","def":"墳場。","example":""},{"word":"打落廳下","pinyin":"daˋ log tangˊ haˊ","def":"人在斷氣前，先把身體移至大廳，以備後事。","example":""},{"word":"打桶","pinyin":"daˋ tungˋ","def":"人死入殮前，先將棺木內層以油膏密封。","example":""},{"word":"打獅（弄獅）","pinyin":"daˋ siiˊ (nung siiˊ)","def":"舞獅。","example":""},{"word":"打新丁粄","pinyin":"daˋ xinˊ denˊ banˋ","def":"做新丁粄（客家民俗家中有新生男丁，於當年農曆十月半或來年正月十五元宵節做紅粄祭拜神明）。","example":""},{"word":"打醮","pinyin":"daˋ zeu","def":"打醮，在特定的日子裡，設壇為亡魂超渡或為新廟落成、神像開光等事祈福的法事，以求神鬼的保佑。","example":""},{"word":"戴孝","pinyin":"dai hau","def":"服喪。","example":""},{"word":"戴絭","pinyin":"dai kien","def":"把向神祈求保平安的神符戴在身上。","example":""},{"word":"帶路雞","pinyin":"dai lu gieˊ","def":"新婚時隨轎而行的一對雌雄中雞，以祈新婚幸福多子多孫。","example":""},{"word":"丁憂","pinyin":"denˊ iuˊ","def":"遭逢父母之喪；做七前一晚的祭祀活動。 例如：佢原本在外地服務，因為丁憂返鄉戴孝。","example":""},{"word":"點燭","pinyin":"diamˋ zugˋ","def":"舉行婚禮，祭祖時，請長輩點蠟燭的儀式。","example":""},{"word":"弔孝","pinyin":"diau hau","def":"守喪。","example":""},{"word":"對年","pinyin":"dui ngienˇ","def":"人去世後的周年忌日。 例如：今晡日阿婆做對年，阿爸牲儀準備便便，帶等屋下人去祭拜。","example":""},{"word":"合火","pinyin":"gabˋ foˋ","def":"將亡者之神靈合祭於祖先神位的儀式，亦可說「合爐」。 例如：對年過後，就做得擇日仔合火。","example":""},{"word":"交春","pinyin":"gauˊ cunˊ","def":"立春，由冬季到春季的節氣交換點。 例如：交春落雨到清明，有時落雨有時晴。（諺）","example":""},{"word":"交節氣","pinyin":"gauˊ jiedˋ hi","def":"節氣轉換。","example":""},{"word":"撿骨","pinyin":"giamˋ gudˋ","def":"人死後若干年，屍體腐化只剩骨骸，親人請撿骨工人為屍骨擦拭排放在罈子中，暫祀一處。","example":""},{"word":"金斗盎","pinyin":"gimˊ deuˋ angˊ","def":"裝骨骸或骨灰的罈子。","example":""},{"word":"腳尾飯（倒頭飯）","pinyin":"giogˋ miˊ fan (doˋ teuˇ fan)","def":"腳尾飯，亡者腳後擺一碗白飯以祭拜之。","example":""},{"word":"過火坑","pinyin":"go foˋ hangˊ","def":"廟會迎神時過火陣的一種儀式。 例如：迎神个時節，神轎愛過火坑。","example":""},{"word":"割香","pinyin":"godˋ hiongˊ","def":"將主廟中的神請出其分身至另外地方奉祀。","example":""},{"word":"扛飯","pinyin":"gongˊ fan","def":"人死後，子孫以飯菜隨三餐祭祀。","example":""},{"word":"扛茶","pinyin":"gongˊ caˇ","def":"訂婚儀式中，新娘向男方親友團奉茶。 例如：過定个時節，好命婆會牽新娘出來扛茶，食新娘茶，愛企起來用兩隻手兜，正有禮。","example":""},{"word":"孤衣","pinyin":"guˊ iˊ","def":"給孤魂野鬼衣物的冥紙。","example":""},{"word":"下世","pinyin":"haˊ se","def":"出生。","example":""},{"word":"行地理","pinyin":"hangˇ ti liˊ","def":"從事堪輿行業。","example":""},{"word":"行帖","pinyin":"hangˇ tiabˋ","def":"發帖子。","example":""},{"word":"孝家","pinyin":"hau gaˊ","def":"喪家。","example":""},{"word":"后土","pinyin":"heu tuˋ","def":"指大地或土地神明，在臺灣多指祖先墳墓風水地旁的土地神。 例如：掛紙个時節，愛先拜后土，正拜祖先。","example":""},{"word":"起鼓","pinyin":"hiˋ guˋ","def":"鳴鼓，表示某種儀式或戲劇即將開始。 例如：和尚定著愛先起鼓正開始誦經。","example":""},{"word":"香爐耳","pinyin":"hiongˊ luˇ ngiˋ","def":"祖先香火、香火繼承者。","example":""},{"word":"掩土","pinyin":"iamˋ tuˋ","def":"用土掩埋靈柩的下葬過程。","example":""},{"word":"圓墳","pinyin":"ienˇ punˇ","def":"新墳落成。","example":""},{"word":"圓七","pinyin":"ienˇ qidˋ","def":"人死後，每隔七日做一次法事，共做七次，最後一次為圓七。","example":""},{"word":"圓醮尾","pinyin":"ienˇ zeu miˊ","def":"完醮祭典。","example":""},{"word":"陰筊","pinyin":"imˊ gau","def":"擲筊時呈現兩片皆覆象，表神明否定。","example":""},{"word":"姊妹飯","pinyin":"jiˋ moi fan","def":"姊妹飯，結婚前女方的姊妹聚餐。","example":""},{"word":"責罰","pinyin":"jidˋ fad","def":"懲罰，指神明之責罰。","example":""},{"word":"進金","pinyin":"jin gimˊ","def":"把骨罈放入墓穴中，屬喪葬儀式。","example":""},{"word":"牽新娘","pinyin":"kienˊ xinˊ ngiongˇ","def":"協助牽引新娘。 例如：新娘下轎，大體愛請好命婆來牽新娘。","example":""},{"word":"開齋","pinyin":"koiˊ zaiˊ","def":"開始吃葷食。","example":""},{"word":"開光","pinyin":"koiˊ gongˊ","def":"開光，為新神像點睛的儀式。","example":""},{"word":"開青","pinyin":"koiˊ qiangˊ","def":"為人死後埋葬之新墳進行第一次掃墓。","example":""},{"word":"開新年【開年】","pinyin":"koiˊ xinˊ ngienˇ【koiˊ ngianˇ】","def":"喻新年時小孩犯錯被開罰。","example":""},{"word":"看親","pinyin":"kon qinˊ","def":"相親。","example":""},{"word":"囥間角【庰間角】","pinyin":"kong gienˊ gogˋ【biang gianˊ gogˋ】","def":"躲在房間裡；喻生小孩坐月子。","example":""},{"word":"籮䈪","pinyin":"loˇ gagˋ","def":"婚嫁、祭祀時盛裝禮物、食品用的竹製籮筐。","example":""},{"word":"落泥時","pinyin":"log naiˇ siiˇ","def":"指出生的時辰。 例如：命毋靚，毋使怨爺哀，怪得自家落泥時。","example":""},{"word":"落陰","pinyin":"log imˊ","def":"觀落陰。","example":""},{"word":"來禮","pinyin":"loiˇ liˊ","def":"送來禮金。","example":""},{"word":"抹著","pinyin":"madˋ doˋ","def":"遇到煞氣。例如觀看出殯過程中，被鬼魅煞神沖煞到，稱為「麻衣煞」。","example":""},{"word":"命底","pinyin":"miang daiˋ","def":"與生俱來的命運。 例如：各人命底無共樣，緊同人比無較贏。","example":""},{"word":"無底景","pinyin":"moˇ daiˋ ginˋ","def":"跑旱船，無底船遊戲，做熱鬧用的。 例如：七月做鬧熱，有無底景這齣事好看。","example":""},{"word":"牽仙","pinyin":"kienˊ xienˊ","def":"牽亡魂，遺屬透過靈媒，問親友死後的情況。 例如：吾婆過身後，吾爸請仙姑嫲來牽仙。","example":""},{"word":"女家頭","pinyin":"ngˋ gaˊ teuˇ","def":"指結婚時的女方。「男家頭」則是指男方。","example":""},{"word":"五燥五溼","pinyin":"ngˋ zauˊ ngˋ siibˋ","def":"五種乾的和五種溼的供品。 例如：過年敬天公，上界愛排五燥五溼。","example":""},{"word":"拈鬮","pinyin":"ngiamˊ kieuˊ","def":"從預先做好記號的紙卷或紙團中，隨意拈取一個，來決定事情。 例如：阿爸過身後，佢兜恁多兄弟愛分家，財產用拈鬮來決定。","example":""},{"word":"日腳","pinyin":"ngidˋ giogˋ","def":"傳統用來判別日常作息吉凶的日子。 例如：愛討親，愛尋隻較靚个日腳。","example":""},{"word":"禳燈","pinyin":"ngiong denˊ","def":"在寺廟中捐資點光明燈，以祈福消災。","example":""},{"word":"泡神茶","pinyin":"pau siinˇ caˇ","def":"泡茶奉神。 例如：身洗好去泡神茶，手拜拜啊。","example":""},{"word":"便媒人","pinyin":"pien moiˇ nginˇ","def":"結婚雙方已就緒，毋需多費工夫的現成媒人。 例如：厥四句聯講來當好，當多人請佢做便媒人。","example":""},{"word":"憑筊仔","pinyin":"pinˇ gau eˋ","def":"向神明請示時，依擲筊來定可否。","example":""},{"word":"墳堂","pinyin":"punˇ tongˇ","def":"墳堂，設備較完備的墳墓，有可以擺放祭品的地方。","example":""},{"word":"且郎","pinyin":"qiaˊ longˇ","def":"男儐相。","example":""},{"word":"七七","pinyin":"qidˋ qidˋ","def":"人死後的第七個「做七」，即「圓七」。","example":""},{"word":"七娘生","pinyin":"qidˋ ngiongˇ sangˊ","def":"七星娘的生日，農曆七月七日，也就是中國的七夕情人節。","example":""},{"word":"三朝","pinyin":"samˊ zeuˊ","def":"本意為三個早晨，此專指嬰兒初生或新娘新婚第三天。嬰兒出生三天即代表未來可養活不會夭折；新婚第三天後代表正式進入夫家，要開始操持家務。 例如：阿華姊降細人既經三朝，等十二朝過後，愛買一身嬰兒衫來去同佢祝賀。","example":""},{"word":"覡公","pinyin":"sang gungˊ","def":"道士（紅頭），不做喪事，主要是執行法事或是驅鬼儀式。","example":""},{"word":"牲儀【牲體】","pinyin":"senˊ ngiˇ【senˊ tiˋ】","def":"祭祀所用的牲品。 例如：天光日愛掛紙，阿姆牲儀準備便哩！","example":""},{"word":"時生月日","pinyin":"siiˇ sangˊ ngied ngidˋ","def":"出生的年月日時。","example":""},{"word":"食福","pinyin":"siid fugˋ","def":"民間集體向神明祈福，而祭神的牲禮由參加的人煮來吃，祈求福報。例「食伯公福」。","example":""},{"word":"食大垤（食大塊）","pinyin":"siid tai de (siid tai kuai)","def":"喪葬儀式結束後酬謝客人之喪宴。 例如：隔壁阿福伯過身，當多人去食大垤。","example":""},{"word":"上神桌","pinyin":"songˊ siinˇ zogˋ","def":"人死後名字登上祖牌，是一種委婉語，就是指稱人過世死亡。 例如：佢早就上神桌哩，你尋毋著佢啦！","example":""},{"word":"壽年","pinyin":"su ngienˇ","def":"享年，人在世的壽命。","example":""},{"word":"手尾","pinyin":"suˋ miˊ","def":"人死後留下來做紀念的東西，如「手尾錢」，意為臨終前身上所遺留的錢。","example":""},{"word":"收涎","pinyin":"suˊ lanˊ","def":"收口水。嬰兒四個月大時，長輩為嬰兒所舉行的習俗活動。","example":""},{"word":"送嫁","pinyin":"sung ga","def":"結婚時，女方陪送新娘到男方家的過程。","example":""},{"word":"送羹","pinyin":"sung gangˊ","def":"送新生兒禮物的習俗。","example":""},{"word":"送日課（送日仔）","pinyin":"sung ngidˋ ko (sung ngidˋ eˇ)","def":"將日子看好，送至女方家。","example":""},{"word":"大行大嫁（大行嫁）","pinyin":"tai hangˇ tai ga (tai hangˇ ga)","def":"經憑媒六禮後舉行之婚禮。","example":""},{"word":"大殮","pinyin":"tai liam","def":"大殮，把死者放進棺木裡，釘上棺蓋的禮節。","example":""},{"word":"頭轉客【轉門】","pinyin":"teuˇ zonˋ hagˋ【zonˋ munˇ】","def":"女兒結婚後第一次回娘家。","example":""},{"word":"跳童【落童】","pinyin":"tiauˇ tungˇ【log tungˇ】","def":"乩童作法。 例如：𠊎昨晡日去廟項，看著人在該跳童。","example":""},{"word":"脫絭","pinyin":"todˋ kien","def":"脫去保平安神符的儀式。 例如：原在有戴絭个細人仔，到十六歲轉骨後，就會去脫絭。","example":""},{"word":"抬重【抬棺】","pinyin":"toiˇ cungˊ【toiˇ gonˊ】","def":"抬棺。","example":""},{"word":"通書","pinyin":"tungˊ suˊ","def":"黃曆，民間通行關於曆法和擇日的參考典籍。","example":""},{"word":"完福（還福）","pinyin":"vanˇ fugˋ","def":"祈福達成心願後，酬神還願。","example":""},{"word":"還神","pinyin":"vanˇ siinˇ","def":"酬神。","example":""},{"word":"換絭","pinyin":"von kien","def":"小孩的護身符，每年固定在某個特定日子去神前更換的儀式。","example":""},{"word":"黃嘏紙","pinyin":"vongˇ guˋ ziiˋ","def":"掃墓時壓在墓碑上的黃紙。","example":""},{"word":"四炆四炒","pinyin":"xi vunˇ xi cauˋ","def":"客家人的八道傳統菜色，有四種燜煮和四種爆炒的料理。","example":""},{"word":"遮神","pinyin":"zaˊ siinˇ","def":"家中有人過世，辦喪事把神明廳神明及祖先牌位用紅紙蓋起，辦完喪事之後才恢復原貌。","example":""},{"word":"矺茶盤","pinyin":"zagˋ caˇ panˇ","def":"新娘端茶，喝茶的人回贈紅包。","example":""},{"word":"矺底","pinyin":"zagˋ daiˋ","def":"壓底。他人送禮，所用容器不宜空著回去，受禮人回贈一些小禮物於容器底部。 例如：新娘兜茶分人客食，人客愛用紅包矺底。","example":""},{"word":"矺雞髀","pinyin":"zagˋ gieˊ biˋ","def":"回禮送雞腿。","example":""},{"word":"矺聘金","pinyin":"zagˋ pinˋ gimˊ","def":"回聘金。","example":""},{"word":"齋公仔","pinyin":"zaiˊ gungˊ eˋ","def":"僧侶（和尚），供奉釋教，從事超渡事宜。","example":""},{"word":"斬雞頭","pinyin":"zamˋ gieˊ teuˇ","def":"發毒誓的一種儀式。","example":""},{"word":"做𣛮","pinyin":"zo cang","def":"備禮品或祭品，以木製容器盛裝。 例如：阿福伯討心臼做𣛮十二槓，當有面風。","example":""},{"word":"做對歲","pinyin":"zo dui se","def":"小孩週歲的慶典。","example":""},{"word":"門紅","pinyin":"munˇ fungˇ","def":"過年或喜慶時貼於門楣的紅條，有五福臨門之意。","example":""},{"word":"做鬧熱","pinyin":"zo nau ngied","def":"舉辦迎神賽會或廟會，一般都殺豬宰羊，大宴賓客。 例如：逐年媽祖生都會做鬧熱。","example":""},{"word":"做牙","pinyin":"zo ngaˇ","def":"生意人在農曆初二、十六拜土地公。","example":""},{"word":"做七","pinyin":"zo qidˋ","def":"喪家自人死之日起，每七日做忌一次，一直至第七次四十九天止。","example":""},{"word":"做大人","pinyin":"zo tai nginˇ","def":"原指男子與童養媳成親變為成人，現指男子成婚。","example":""},{"word":"做齋仔","pinyin":"zo zaiˊ eˋ","def":"喪家請道士誦經為亡者超渡的儀式。","example":""},{"word":"轉長山","pinyin":"zonˋ congˇ sanˊ","def":"回大陸原鄉，現用以指歸天。","example":""},{"word":"轉年","pinyin":"zonˋ ngienˇ","def":"回家過年；過年後。 例如：阿豪下禮拜正愛轉年。 例如：錢你先拿去用無相干，轉年正還𠊎就好。","example":""},{"word":"長孫錢","pinyin":"zongˋ sunˊ qienˇ","def":"掛於長孫孝服背後的錢，象徵長命富貴，百子千孫。","example":""},{"word":"祖公業","pinyin":"zuˋ gungˊ ngiab","def":"祖宗留傳的產業。","example":""},{"word":"舂粢打粄","pinyin":"zungˊ qiˇ daˋ banˋ","def":"形容準備慶典的熱鬧情況。","example":""},{"word":"迎古董","pinyin":"ngiangˇ guˋ dungˋ","def":"迎神中的活動，也就是民間的陣頭，如無底景。","example":""},{"word":"迎棺","pinyin":"ngiangˇ gonˊ","def":"葬禮習俗。喪家買好棺材，由長輩帶領子孫在屋前迎接棺材的送達。","example":""},{"word":"材","pinyin":"coi/caiˇ","def":"「coi」為一截，常使用在竹木、甘蔗或長形物切成數段中的一段。「caiˇ」指的是一尺見方，是一種計算體積（長寬高相乘）的專有名詞，1立方英呎俗稱「1材」。","example":""},{"word":"斛","pinyin":"fug","def":"古代一種量器，後作量詞使用，一斛原為十斗，後改為五斗。","example":""},{"word":"槓","pinyin":"gong","def":"面、排（房子），為限定性字目，例如「兩槓屋」、「兩槓𣛮」。","example":""},{"word":"一工人","pinyin":"idˋ gungˊ nginˇ","def":"一個工人在一天中所做的工作份量，「半工人」即指半個工作天。 例如：愛整理个資料十分多，一工人毋罅，怕愛兩工人正做得忒。","example":""},{"word":"一甲當","pinyin":"idˋ gabˋ dongˊ","def":"相當於一甲，用於計量土地面積。 例如：厥公過身過後，留下差毋多一甲當个土地。","example":""},{"word":"一開間","pinyin":"idˋ koiˊ gienˊ","def":"計算面寬的單位，常用於指屋舍面寬。","example":""},{"word":"一大嶂","pinyin":"idˋ tai zong","def":"形容物品之數量多。 例如：吾爸盡好買東西，一買就一大嶂，屋下無哪好堆。","example":""},{"word":"掖","pinyin":"ie","def":"非固定量詞（形容詞），指插秧時手臂所能搆到的幅度，大約五叢（株）秧苗寬為「一掖」。 例如：這坵田愛蒔六掖禾仔。","example":""},{"word":"綹","pinyin":"jiuˋ/liu","def":"綹（量詞），多用於絲、線。","example":""},{"word":"齾","pinyin":"ngadˋ","def":"刻度（量詞）。1個刻度稱1齾，10個刻度就有10齾。","example":""},{"word":"帡","pinyin":"piangˊ","def":"片（量詞），常用於大片之範圍。 例如：這堆穀愛用二十零帡个稈帡正弇得揫。","example":""},{"word":"樖","pinyin":"poˊ","def":"串（量詞）。例「一樖牛眼」。","example":""},{"word":"筍","pinyin":"sunˋ","def":"芽（蘭花量詞）。 例如：蘭花當興該下，一筍賣得著幾下萬銀。","example":""},{"word":"頭陣火","pinyin":"teuˇ ciin foˋ","def":"隱喻第一回合。","example":""},{"word":"定額","pinyin":"tin ngiagˋ","def":"固定數額。","example":""},{"word":"挨礱牽鋸","pinyin":"aiˊ lungˇ kienˊ gi","def":"推礱拉鋸，喻粗重工作。 例如：老時人講：「挨礱牽鋸，有食毋好去。」故所講著這款事頭，大家就驚。","example":""},{"word":"暗錢","pinyin":"am qienˇ","def":"不正當取來的錢。 例如：毋知佢有麼个暗錢來路無？","example":""},{"word":"詏數","pinyin":"au sii","def":"為記帳之帳目爭辯。 例如：訂簿記數愛分明，免得事後來詏數。","example":""},{"word":"撥錢","pinyin":"badˋ qienˇ","def":"調頭寸。 例如：厥爺哀去上屋撥錢，分佢出國讀書。","example":""},{"word":"掰禾頭","pinyin":"baiˊ voˇ teuˇ","def":"分植秧苗，指插秧後一段時間如有秧苗受損要補，因無秧苗可用，只能從秧田裡較大叢的秧苗分支出來補，亦可說「分禾頭」。 例如：阿杰仔讀書轉來，分厥爸喊去𢯭掰禾頭，到斷烏正轉屋。","example":""},{"word":"枋頭枋截","pinyin":"biongˊ teuˇ biongˊ jiedˋ","def":"製作木器時，裁截掉的大小木塊。 例如：地泥項个枋頭枋截，你看有用个拈起來，其他个抔去燒火。","example":""},{"word":"本錢落番薯湯","pinyin":"bunˋ qienˇ log fanˊ suˇ tongˊ","def":"表投資的資金虧蝕淨盡。","example":""},{"word":"茶䉂仔","pinyin":"caˇ luiˋ eˇ","def":"採茶時背在身後裝茶青的籠子。 例如：摘茶姊頭戴笠嫲、手戴手袖仔、腳包腳裹、腰繫茶䉂仔，還開嘴來唱山歌。","example":""},{"word":"茶店仔","pinyin":"caˇ diam eˋ","def":"茶室，早期的風月場所。","example":""},{"word":"拆數","pinyin":"cagˋ sii","def":"還債、給付所欠的錢。 例如：阿爸用貸款買這間屋，故所逐隻月个月給就愛勻兜仔來拆數。","example":""},{"word":"拆債","pinyin":"cagˋ zai","def":"還清帳務。 例如：月給無高，借錢買屋，愛拆債就無恁該。","example":""},{"word":"差仔","pinyin":"caiˊ eˋ","def":"供差使的人。","example":""},{"word":"秤頭係路頭","pinyin":"ciin teuˇ he lu teuˇ","def":"做生意要講求公道，斤兩公道自然生意興隆，否則生意就無人光顧了。","example":""},{"word":"做毋出水","pinyin":"zo mˇ cudˋ suiˋ","def":"做不出成果。","example":""},{"word":"踔田","pinyin":"cogˋ tienˇ","def":"以腳部除田草，不同於「挲草」，「挲草」表用手除草。意象為：腳在其周圍繞圈圈，感覺到有雜草，就用力將它踩入泥土中，使其不見天日無法生長而變身為肥料。 例如：踔田个細妹仔，一手擎遮仔，一手擎棍仔，用兩支腳做事。","example":""},{"word":"賺食","pinyin":"con siid","def":"謀生活；指女人操賤業以謀生。 例如：佢靠這臺貨車載貨賺食，故所愛好好保養。","example":""},{"word":"賺食嫲","pinyin":"con siid maˇ","def":"意指妓女。","example":""},{"word":"丈田","pinyin":"cong tienˇ","def":"丈量田地的長寬面積。","example":""},{"word":"長年仔","pinyin":"congˇ ngienˇ eˋ","def":"長工。 例如：阿煥伯公講佢還細時節，識去同人做長年仔，學著異多耕田个手路。","example":""},{"word":"打稅","pinyin":"daˋ soi","def":"訂定稅額，收稅。 例如：舊年賺較多，故所今年打稅就分佢打著。","example":""},{"word":"打租","pinyin":"daˋ zuˊ","def":"訂定租額，收租。 例如：厥田賣忒，買過屋仔贌人打租，日仔過來罔罔仔。","example":""},{"word":"打秧","pinyin":"daˋ iongˊ","def":"播種，常用於稻麥之秧苗。 例如：頭擺人耕田，自家打秧，這下人同農場買秧仔。","example":""},{"word":"打石","pinyin":"daˋ sag","def":"將石塊打造成各種器具。","example":""},{"word":"打磚","pinyin":"daˋ zonˊ","def":"製磚。","example":""},{"word":"搭垤仔","pinyin":"dab de eˋ","def":"賣雜貨之人。 例如：頭擺莊下伙房項，會有搭垤仔㧡等各種雜貨來賣。","example":""},{"word":"貼秤頭","pinyin":"dabˋ ciin teuˇ","def":"買賣肉類斤兩不足時，附加上使足夠的部分，引申為本體以外所加的附加物。 例如：阿西哥賣番豆，秤好吔又扡加一扡貼秤頭分人，大家異愛同佢交關。","example":""},{"word":"貼钁頭","pinyin":"dabˋ giogˋ teuˇ","def":"修補鋤頭。鐵匠會重新拿鐵修補鐵片凹缺處。","example":""},{"word":"沾秧仔","pinyin":"demˊ iongˊ eˋ","def":"將插秧後剩餘的秧苗，浸在稻田旁，以備插好的秧苗受損時可以補插。 例如：吾屋下个田蒔忒哩，𠊎在田塍脣沾秧仔，阿爸講毋使沾忒多，堵好就好。","example":""},{"word":"斗分人【估分人】","pinyin":"deuˋ bunˊ nginˇ【guˋ bunˊ nginˇ】","def":"用物品折算價錢的方式賣給別人。 例如：厥車仔斗分人，換過一臺新个。","example":""},{"word":"斗換【轉換、交換】","pinyin":"deuˋ von【zonˋ von、gauˊ von】","def":"物物交換、以物易物。 例如：頭擺歇在山項个原住民，會拿自家生產个物品同漢人斗換日常用品。","example":""},{"word":"兜飯碗","pinyin":"deuˊ fan vonˋ","def":"捧飯碗，引申為受僱於人。","example":""},{"word":"點仁","pinyin":"diam inˇ","def":"種子播入土中的動作。例如「點菜仁」，「點菜花籽」即撒播油菜花的種子。 例如：種蘿蔔仔，大體用點仁較多，無看著有人用種秧。","example":""},{"word":"店堵仔","pinyin":"diam duˇ eˋ","def":"不友善的店員；常賴在店中不走之人。 例如：請店員𢯭手掌店，盡驚請著店堵仔，人客會畀嚇走淨淨。","example":""},{"word":"倒墊","pinyin":"do tiabˋ","def":"原本應由甲給乙，今反由乙給甲的情形。 例如：經費毋罅，佢辦活動還自家倒墊幾下萬箍。","example":""},{"word":"貨底","pinyin":"fo daiˋ","def":"庫存。","example":""},{"word":"掇貨","pinyin":"dodˋ fo","def":"批發貨物。 例如：開百貨店个人，不時愛上下二港去掇貨。","example":""},{"word":"堆稈棚","pinyin":"doiˊ gonˋ pangˇ","def":"把稻草堆積成壟，用以保存稻草不致腐爛。 例如：阿爸講堆稈棚愛有孔竅，棚脣愛圓，棚心愛實，棚頂漸度毋好忒平，正毋會漏水。","example":""},{"word":"堵數","pinyin":"duˇ sii【duˇ seu】","def":"抵帳。 例如：係無錢還，就拿若屋來堵數。","example":""},
