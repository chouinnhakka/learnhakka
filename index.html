<!DOCTYPE html>
<html lang="zh-TW" data-theme="吊菜色">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>手機版四縣腔客語隨機詞卡</title>

  <!-- 社群分享預覽(Open Graph)設定:分享連結到 LINE、Facebook、Messenger 時會用這裡的標題/說明/縮圖 -->
  <meta property="og:title" content="手機版四縣腔客語隨機詞卡">
  <meta property="og:description" content="手機版免費客語學習詞卡,收錄各分級詞彙。">
  <meta property="og:image" content="https://chouinnhakka.github.io/learnhakka/thumbnail.png">
  <meta property="og:url" content="https://chouinnhakka.github.io/learnhakka/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="手機版四縣腔客語隨機詞卡">
  <meta name="twitter:description" content="手機版免費客語學習詞卡,收錄各分級詞彙。">
  <meta name="twitter:image" content="https://chouinnhakka.github.io/learnhakka/thumbnail.png">

  <!-- 引入 Google Fonts 思源宋體 (Noto Serif TC) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #f3ebf9;
      --card-bg: #f8f2fc;
      --theme-color: #a782d9;
      --theme-dark: #8c63c7;
      --text-main: #6b43a6;
      --text-sub: #8c63c7;
      --text-muted: #aa93cd;
      --btn-bg: #ffffff;
      --shadow-color: rgba(140, 99, 199, 0.15);
    }

    [data-theme="吊菜色"] {
      --bg-main: #f3ebf9; --card-bg: #f8f2fc; --theme-color: #a782d9;
      --theme-dark: #8c63c7; --text-main: #6b43a6; --text-sub: #8c63c7;
      --text-muted: #aa93cd; --shadow-color: rgba(140, 99, 199, 0.15);
    }
    [data-theme="藍色"] {
      --bg-main: #eef2fa; --card-bg: #f5f8fd; --theme-color: #8fa5e6;
      --theme-dark: #708bd7; --text-main: #4a63b0; --text-sub: #708bd7;
      --text-muted: #9bb0e8; --shadow-color: rgba(112, 139, 215, 0.15);
    }
    [data-theme="青色"] {
      --bg-main: #e9f6f6; --card-bg: #f2fafb; --theme-color: #79d0d0;
      --theme-dark: #50baba; --text-main: #2b9191; --text-sub: #50baba;
      --text-muted: #8be0e0; --shadow-color: rgba(80, 186, 186, 0.15);
    }
    [data-theme="綠色"] {
      --bg-main: #edf5e8; --card-bg: #f4faf0; --theme-color: #a3d99b;
      --theme-dark: #82c978; --text-main: #4f9645; --text-sub: #82c978;
      --text-muted: #aae0a0; --shadow-color: rgba(130, 201, 120, 0.15);
    }
    [data-theme="黃色"] {
      --bg-main: #fcf6e8; --card-bg: #fdfaf2; --theme-color: #f1cf8a;
      --theme-dark: #e5b95c; --text-main: #ad7e24; --text-sub: #d19f38;
      --text-muted: #e2c686; --shadow-color: rgba(229, 185, 92, 0.15);
    }
    [data-theme="柑仔色"] {
      --bg-main: #fdf3eb; --card-bg: #fef8f3; --theme-color: #f3b584;
      --theme-dark: #eb9a5b; --text-main: #bf6621; --text-sub: #db813e;
      --text-muted: #eab48b; --shadow-color: rgba(235, 154, 91, 0.15);
    }
    [data-theme="紅色"] {
      --bg-main: #fdeeee; --card-bg: #fef6f6; --theme-color: #e59999;
      --theme-dark: #d67a7a; --text-main: #aa3d3d; --text-sub: #c95757;
      --text-muted: #e09b9b; --shadow-color: rgba(214, 122, 122, 0.15);
    }
    [data-theme="粉茄色"] {
      --bg-main: #f9ebf5; --card-bg: #fcf2f9; --theme-color: #d88cca;
      --theme-dark: #c46eb3; --text-main: #963f85; --text-sub: #b752a2;
      --text-muted: #cf8cc0; --shadow-color: rgba(196, 110, 179, 0.15);
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: "Noto Serif TC", "DFKai-SB", "BiauKai", "標楷體", serif; 
    }
    
    body { 
      background-color: var(--bg-main); 
      color: var(--text-main); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      height: 100dvh; 
      padding: 8px; 
      overflow: hidden; 
      transition: background-color 0.3s; 
    }

    .app-container { 
      width: 100%; 
      max-width: 400px; 
      height: 100%;
      max-height: 720px; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      position: relative; 
    }
    
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .admin-btn { background-color: var(--btn-bg); border: none; border-radius: 10px; padding: 6px 12px; font-size: 14px; color: var(--text-sub); font-weight: bold; cursor: pointer; box-shadow: 0 2px 6px var(--shadow-color); outline: none; }
    
    .theme-select-wrapper { position: relative; display: inline-block; }
    .theme-select { appearance: none; background-color: var(--btn-bg); border: none; border-radius: 10px; padding: 6px 26px 6px 12px; font-size: 14px; color: var(--text-sub); font-weight: bold; cursor: pointer; box-shadow: 0 2px 6px var(--shadow-color); outline: none; }
    .theme-select-wrapper::after { content: "▼"; font-size: 9px; color: var(--text-sub); position: absolute; right: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; }
    
    .level-tabs { display: flex; background-color: var(--theme-color); padding: 3px; border-radius: 12px; margin-bottom: 6px; gap: 2px; }
    .level-btn { flex: 1; border: none; background: transparent; padding: 8px 2px; font-size: 13px; font-weight: bold; color: rgba(255, 255, 255, 0.85); border-radius: 9px; cursor: pointer; transition: all 0.2s; text-align: center; white-space: nowrap; }
    .level-btn.active { background-color: var(--btn-bg); color: var(--text-sub); box-shadow: 0 2px 4px var(--shadow-color); }
    
    .flashcard-wrapper { flex: 1; perspective: 1000px; margin-bottom: 6px; cursor: pointer; min-height: 0; }
    .flashcard { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }
    .flashcard.flipped { transform: rotateY(180deg); }
    
    .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 16px; background-color: var(--card-bg); padding: 40px 18px 34px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 14px; box-shadow: 0 6px 16px var(--shadow-color); border: 1px solid rgba(255, 255, 255, 0.6); text-align: center; }
    .card-back { transform: rotateY(180deg); }
    
    .vocab-title { font-size: 44px; font-weight: bold; color: var(--text-main); letter-spacing: 2px; }
    .vocab-pinyin { font-size: 22px; color: var(--text-sub); font-family: "Noto Serif TC", "Georgia", serif; margin-top: 2px; }
    .flip-hint { font-size: 16px; color: var(--text-muted); font-weight: bold; }
    
    .definition-container { width: 100%; margin-top: 0; text-align: left; color: var(--text-main); line-height: 1.6; max-height: 260px; overflow-y: auto; }
    .def-text { font-size: 18px; margin-bottom: 10px; white-space: pre-line; }
    .example-text { font-size: 16px; color: var(--text-sub); padding-top: 8px; border-top: 1px dashed var(--theme-color); white-space: pre-line; }
    
    .card-footer-text { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 11px; color: var(--text-muted); }
    .card-watermark { position: absolute; top: 10px; right: 14px; font-size: 10px; font-family: "Noto Serif TC", "DFKai-SB", "BiauKai", "標楷體", serif; letter-spacing: 0.5px; color: var(--text-muted); opacity: 0.55; pointer-events: none; }
    
    .nav-bar { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
    .nav-btn { flex: 1; background-color: var(--btn-bg); border: none; padding: 14px 12px; border-radius: 12px; font-size: 17px; font-weight: bold; color: var(--text-sub); cursor: pointer; box-shadow: 0 2px 6px var(--shadow-color); transition: all 0.2s; outline: none; }
    .nav-btn:active { transform: scale(0.97); }

    /* 後臺管理 Modal 樣式 */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 12px; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: var(--card-bg); width: 100%; max-width: 380px; max-height: 85vh; border-radius: 16px; padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: flex; flex-direction: column; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid var(--theme-color); padding-bottom: 8px; }
    .modal-title { font-size: 16px; font-weight: bold; color: var(--text-main); }
    .close-btn { background: none; border: none; font-size: 18px; color: var(--text-sub); cursor: pointer; }
    
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 3px; color: var(--text-sub); }
    .form-control { width: 100%; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--theme-color); background: var(--btn-bg); color: var(--text-main); font-size: 13px; outline: none; font-family: "Noto Serif TC", serif; }
    textarea.form-control { resize: vertical; height: 50px; }
    
    .admin-actions { display: flex; gap: 8px; margin-top: 8px; }
    .admin-btn-action { flex: 1; padding: 8px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 13px; font-family: "Noto Serif TC", serif; }
    .btn-primary { background-color: var(--theme-color); color: white; }
    .btn-secondary { background-color: var(--btn-bg); color: var(--text-sub); border: 1px solid var(--theme-color); }
    .vocab-count-info { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 6px; }
  </style>
</head>
<body>

<div class="app-container" id="app">
  <div class="top-bar">
    <button class="admin-btn" onclick="openAdminModal()">⚙️ 詞庫後臺</button>
    <div class="theme-select-wrapper">
      <select id="themeSelect" class="theme-select" onchange="changeTheme(this.value)">
        <option value="吊菜色">吊菜色</option>
        <option value="藍色">藍色</option>
        <option value="青色">青色</option>
        <option value="綠色">綠色</option>
        <option value="黃色">黃色</option>
        <option value="柑仔色">柑仔色</option>
        <option value="紅色">紅色</option>
        <option value="粉茄色">粉茄色</option>
      </select>
    </div>
  </div>

  <div class="level-tabs">
    <button class="level-btn" onclick="setLevel('基礎級')">基礎級</button>
    <button class="level-btn" onclick="setLevel('初級')">初級</button>
    <button class="level-btn" onclick="setLevel('中級')">中級</button>
    <button class="level-btn" onclick="setLevel('中高級')">中高級</button>
    <button class="level-btn" onclick="setLevel('高級')">高級</button>
  </div>

  <div class="flashcard-wrapper" onclick="flipCard()">
    <div class="flashcard" id="card">
      <div class="card-face card-front">
        <div class="card-watermark">ChouInn</div>
        <div>
          <div class="vocab-title" id="frontWord">--</div>
          <div class="vocab-pinyin" id="frontPinyin">--</div>
        </div>
        <div class="flip-hint">掀落去看華語同例句</div>
        <div class="card-footer-text" id="cardCounter">資料來源:臺灣教育部客語辭典</div>
      </div>

      <div class="card-face card-back">
        <div class="card-watermark">ChouInn</div>
        <div style="width: 100%;">
          <div class="vocab-title" id="backWord" style="font-size: 38px;">--</div>
          <div class="vocab-pinyin" id="backPinyin" style="font-size: 20px; margin-bottom: 8px;">--</div>
          
          <div class="definition-container">
            <div class="def-text" id="backDef">--</div>
            <div class="example-text" id="backExample">--</div>
          </div>
        </div>
        <div class="card-footer-text">資料來源:臺灣教育部客語辭典</div>
      </div>
    </div>
  </div>

  <div class="nav-bar">
    <button class="nav-btn" onclick="prevCard(event)">上一隻詞彙</button>
    <button class="nav-btn" onclick="nextCard(event)">下一隻詞彙</button>
  </div>
</div>

<!-- 後臺管理 Modal -->
<div class="modal-overlay" id="adminModal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title">⚙️ 詞庫後臺管理</div>
      <button class="close-btn" onclick="closeAdminModal()">✕</button>
    </div>

    <!-- 新增單筆詞彙 -->
    <div class="form-group">
      <label>新增單筆詞彙</label>
      <select id="addLevel" class="form-control" style="margin-bottom: 4px;">
        <option value="基礎級">基礎級</option>
        <option value="初級">初級</option>
        <option value="中級">中級</option>
        <option value="中高級">中高級</option>
        <option value="高級">高級</option>
      </select>
      <input type="text" id="addWord" class="form-control" placeholder="客語詞彙 (例: 發燒)" style="margin-bottom: 4px;">
      <input type="text" id="addPinyin" class="form-control" placeholder="拼音 (例: fadˋ seuˊ)" style="margin-bottom: 4px;">
      <input type="text" id="addDef" class="form-control" placeholder="華語釋義 (例: 發燒)" style="margin-bottom: 4px;">
      <textarea id="addExample" class="form-control" placeholder="例句 (例: 略略仔發燒。)"></textarea>
      <button class="admin-btn-action btn-primary" style="margin-top: 6px; width: 100%;" onclick="addNewVocab()">＋ 新增到詞庫</button>
    </div>

    <hr style="border: 0; border-top: 1px solid var(--theme-color); margin: 8px 0;">

    <!-- 檔案匯入 (CSV / Excel) -->
    <div class="form-group">
      <label>上傳 CSV 檔案批次匯入</label>
      <input type="file" id="csvFileInput" accept=".csv" class="form-control" style="padding: 2px; margin-bottom: 4px;">
      <button class="admin-btn-action btn-secondary" style="width: 100%;" onclick="importCSV()">📁 匯入 CSV 檔案</button>
      <div style="font-size: 10px; color: var(--text-muted); margin-top: 2px;">格式要求：分級,客語詞彙,拼音,華語釋義,例句</div>
    </div>

    <hr style="border: 0; border-top: 1px solid var(--theme-color); margin: 8px 0;">

    <div class="admin-actions">
      <button class="admin-btn-action btn-secondary" onclick="exportData()">📥 匯出備份</button>
      <button class="admin-btn-action btn-secondary" onclick="resetDefaultData()" style="color: #aa3d3d; border-color: #aa3d3d;">🔄 還原預設</button>
    </div>
    <div class="vocab-count-info" id="vocabCountInfo">目前詞庫統計中...</div>
  </div>
</div>

<script>

doˋ","def":"走路扭傷腳踝，狀況較嚴重。 例如：佢走忒遽，一下無注意，腳嗄踣著。","example":""},{"word":"磅血壓（量血壓）","pinyin":"bongˇ hiedˋ abˋ (liongˇ hiedˋ abˋ)【bongˇ hiadˋ abˋ】【liongˇ hiadˋ abˋ】","def":"量血壓。 例如：磅血壓身體愛放鬆正磅得準。","example":""},{"word":"撐腿","pinyin":"cang tuiˋ","def":"因勞累而使腿部肌肉僵化。 例如：昨晡日行（行啊）忒悿（𤸁），朝晨䟘床，還撐腿撐腿。","example":""},{"word":"食涼","pinyin":"siid liongˇ","def":"吃了可以消暑退火。 例如：天時恁熱，煲兜仔青草茶來食涼，愛無？","example":""},{"word":"撐壞","pinyin":"cang fai","def":"指人吃過飽而壞了身體，若是對親近之人會說「撐死」。 例如：豬撐大，狗撐壞，人撐變精怪。（諺） 例如：莫食恁多，會撐壞。","example":""},{"word":"晟眼","pinyin":"cangˇ ngienˋ【cangˇ ngianˋ】","def":"陽光太強，使眼昏花。 例如：西照日，駛車（車仔）晟眼當（盡）艱苦。","example":""},{"word":"痔仔","pinyin":"cii eˋ","def":"痔瘡。 例如：屙屎出血，可能係發痔仔。","example":""},{"word":"著病","pinyin":"cog piang","def":"得病。 例如：這種肺炎當（蓋）會遰，世界各地當（蓋）多人著病。","example":""},{"word":"長命","pinyin":"congˇ miang","def":"長壽。 例如：根據研究，細妹人旦勢（大部分）比細倈人較（過）長命。","example":""},{"word":"長短腳","pinyin":"congˇ donˋ giogˋ","def":"長短腳。 例如：佢有長短腳，故所一隻鞋愛做較（過）賁底个。","example":""},{"word":"臭羴","pinyin":"cu hien【cu hian】","def":"身體有異樣氣味，也可指動物身上發臭的味道。 例如：你昨暗晡無洗身，歸身仔當（蓋）臭羴。 例如：該狗仔怕當（蓋）久無洗身吔，當（蓋）臭羴。","example":""},{"word":"臭乳臊","pinyin":"cu nen soˊ","def":"原指小嬰兒身上的乳臭味，現主要用於喻人未成熟、不明事理。 例如：細嬰兒仔雖然有多少仔臭乳臊，毋過盡得人惜。 例如：佢頭那都還臭乳臊，恁要緊个事情，你敢喊佢去？","example":""},{"word":"臭尿馦","pinyin":"cu ngiau hiamˊ","def":"尿騷味。 例如：細人仔拉尿無換褲，恁臭尿馦。","example":""},{"word":"臭汗酸（臭汗臊）","pinyin":"cu hon sonˊ (cu hon soˊ)","def":"汗酸臭味、汗臭味。 例如：打球過，歸身汗，一定愛洗身，正毋會歸身仔臭汗酸。","example":""},{"word":"臭耳聾","pinyin":"cu ngiˋ lungˊ","def":"耳聾，耳朵重聽、聽力不佳。 例如：頭擺老人家講，食黃梨心會臭耳聾。 例如：該老人家臭耳聾，聽毋著，講話乜哈哈砰砰。","example":""},{"word":"嗽到會死【嗽啊會死】","pinyin":"cug do voi xiˋ【cug a voi xiˋ】","def":"咳得要命。 例如：佢分卵黃哽著，嗽到會死（嗽啊會死）。","example":""},{"word":"打噎","pinyin":"daˋ ed","def":"打嗝。 例如：阿姊消化毋好，食過東西就緊打噎。","example":""},{"word":"打認盡（打激顫）【打膦磬、打盡認】","pinyin":"daˋ ngin qin (daˋ gid zunˊ)【daˋ linˋ qinˋ、daˋ qin ngin】","def":"打冷顫；急而短的顫抖。 例如：尿屙好會打認盡（打膦磬），這係正常个現象。 例如：寒流來，冷風吹到人緊打認盡（打膦磬）。","example":""},{"word":"膽水","pinyin":"damˋ suiˋ","def":"膽汁。 例如：老弟暈車（昏車），翻到（翻啊）連膽水都翻出來。","example":""},{"word":"單瞼（單瞼目）","pinyin":"danˊ ngiamˊ (danˊ ngiamˊ mugˋ)","def":"單眼皮。 例如：單瞼（單瞼目）个人，目珠看起來較（過）細粒。","example":""},{"word":"吊頸","pinyin":"diau giangˋ","def":"自縊、上吊。 例如：佢欠債，分人逼到（逼啊）強強會去吊頸吔。","example":""},{"word":"斷臍","pinyin":"donˋ qiˇ","def":"剪斷臍帶。 例如：斷臍毋好剪到貼，愛留一細截仔。","example":""},{"word":"斷血","pinyin":"donˋ hiedˋ【donˋ hiadˋ】","def":"止血。 例如：傷著血筋，血流血濯，愛遽遽（共快）斷血較（過）要緊。","example":""},{"word":"當門牙","pinyin":"dongˊ munˇ ngaˇ","def":"門牙。 例如：阿弟仔當當（正）愛生牙，當門牙暴出來哩喲（吔喲）！","example":""},{"word":"肚膁","pinyin":"duˋ iamˋ","def":"腹側。 例如：佢做鐵工仔，肚膁該片分鐵仔刮著，緊出血。","example":""},{"word":"肚燥嘴渴（嘴燥肚渴）","pinyin":"duˋ zauˊ zoi hodˋ (zoi zauˊ duˋ hodˋ)","def":"口乾舌燥。 例如：天時恁熱愛啉加兜仔水，正毋會肚燥嘴渴（嘴燥肚渴）。","example":""},{"word":"棟指","pinyin":"dung ziiˋ","def":"中指。 例如：人有五隻手指，手指公、蛇頭指、棟指、無名指同手指尾。","example":""},{"word":"噎啄","pinyin":"ed dug/dog","def":"打嗝。 例如：嬰兒仔食乳過後同佢背囊拍拍啊，愛分佢噎啄，正毋會哽著。","example":""},{"word":"噎酸【哊酸】","pinyin":"ed sonˊ【iogˋ sonˊ】","def":"反胃湧出胃酸。 例如：係食著毋合肚个東西會噎酸（哊酸）。","example":""},{"word":"發禍","pinyin":"fadˋ fo","def":"傷口發炎疼痛。 例如：分鐵釘仔刺著盡驚傷口發禍。","example":""},{"word":"發福","pinyin":"fadˋ fugˋ","def":"發胖，變得福態。 例如：你恁久係毋係食忒多，有略略仔發福哦！","example":""},{"word":"發紅","pinyin":"fadˋ fungˇ","def":"發炎紅腫。 例如：若這傷口毋好打著水，無就會發紅。","example":""},{"word":"飯匙骨","pinyin":"fan ciiˇ gudˋ","def":"肩胛骨。 例如：歸日仔打電腦个人，盡會飯匙骨痠痛。","example":""},{"word":"狐癖（臭狐癖）","pinyin":"fuˇ pidˋ (cu fuˇ pidˋ)","def":"人胳肢窩下面發臭的病，即狐臭。 例如：佢有狐癖，行兼就鼻得著。","example":""},{"word":"昏昏（暈暈）","pinyin":"funˇ funˇ (hinˇ hinˇ)","def":"暈眩的樣子。 例如：駛車仔行山路，歸路仔彎彎斡斡，人坐到（坐啊）昏昏。","example":""},{"word":"合藥仔","pinyin":"gabˋ iog eˋ","def":"配藥。 例如：有病愛拿藥單到藥局，請藥劑師合藥仔。","example":""},{"word":"感著","pinyin":"gamˋ doˋ","def":"著涼，指一時之間不能適應天氣變化而生病。 例如：天時一下寒一下熱，毋堵好就會感著。","example":""},{"word":"雞毛管","pinyin":"gieˊ moˊ gonˋ","def":"膠囊。 例如：吞雞毛管愛頭磬磬，較（過）好吞。","example":""},{"word":"結舌","pinyin":"giedˋ sad【giadˋ sad】","def":"講話結巴、口吃的樣子。 例如：佢講話會結舌，你愛較（過）有耐心聽。","example":""},{"word":"緊掣（緊顫）","pinyin":"ginˋ cadˋ (ginˋ zunˊ)","def":"一直在發抖。例「痛到緊掣」、「嚇到緊顫」。","example":""},{"word":"腳凹","pinyin":"giogˋ auˊ","def":"腳膝蓋後方的轉彎處。 例如：中醫講，會腰骨痠軟个人，腳凹愛輒啊撚撚啊。","example":""},{"word":"腳跛跛","pinyin":"giogˋ baiˊ baiˊ","def":"跛腳的樣子。 例如：看佢行路腳跛跛，原來係坐忒久，腳痺忒（痺核）吔。","example":""},{"word":"腳髀","pinyin":"giogˋ biˋ","def":"大腿。 例如：厥腳髀當（蓋）大笐（筒），一支當若兩支著。","example":""},{"word":"腳脛","pinyin":"giogˋ guangˋ","def":"小腿。 例如：佢慣勢著長褲，腳脛長期無晒日頭，白雪雪仔。","example":""},{"word":"腳㬹","pinyin":"giogˋ zangˊ","def":"腳跟；腳筋為「腳㬹筋」。 例如：逐（每）年寒天，吾（𠊎个）腳㬹該位都會必到（必啊）當（蓋）嚴重。","example":""},{"word":"腳囊肚","pinyin":"giogˋ nangˇ duˋ","def":"小腿肚。 例如：人講腳囊肚係人个第二粒心臟，愛好好保養。","example":""},{"word":"腳㬹筋","pinyin":"giogˋ zangˊ ginˊ","def":"腳筋。 例如：阿哥溜雪發生意外，腳㬹筋斷忒哩（斷核吔）。","example":""},{"word":"腳趾罅","pinyin":"giogˋ ziiˋ la","def":"腳趾縫。 例如：洗身腳該下，腳趾罅乜愛鑪淨來。","example":""},{"word":"勼筋","pinyin":"giu ginˊ【jiu ginˊ】","def":"抽筋。 例如：𠊎睡目當（蓋）會勼筋，毋知係少麼个營養？","example":""},{"word":"降子","pinyin":"giung ziiˋ","def":"生孩子。 例如：佢當（蓋）想做阿公，心臼還吂得時降子，雞子就先畜等來。","example":""},{"word":"光頂","pinyin":"gongˊ dangˋ","def":"禿頭。 例如：阿爸還吂（毋曾）五十歲就光頂吔！","example":""},{"word":"痀背【匍背】","pinyin":"guˊ boi【puˇ boi】","def":"駝背，或用在指稱脊椎沒有辦法撐力。 例如：行路毋好痀背（匍背），看起來無精神。","example":""},{"word":"下身","pinyin":"haˊ siinˊ","def":"下半身或指陰部。 例如：歸日仔坐等做事个人，下身較（過）會贅水（腳贅贅）。 例如：佢𨃰柵欄毋堵好嗄頓著下身，痛到（痛啊）無結煞。","example":""},{"word":"下顎","pinyin":"haˊ ngongˊ","def":"下顎，口腔的下部；下巴。 例如：阿華下顎个大牙蛀忒（蛀核），噍麼个都毋得。","example":""},{"word":"後斗","pinyin":"heu deuˋ","def":"後臀；靠山。 例如：老弟當（蓋）瘦，後斗無麼个肉。 例如：厥事業全部係自家拚來个，哪有倚恃麼个後斗？","example":""},{"word":"氣緲緲仔","pinyin":"hi meuˋ meuˋ eˇ【hi meuˋ meuˋ eˊ】","def":"上氣不接下氣的樣子，亦可指呼吸氣若游絲。 例如：細人仔毋聽話，爺仔譴到氣緲緲仔。","example":""},{"word":"起寒毛菇（起雞嫲皮）","pinyin":"hiˋ honˇ moˊ guˊ (hiˋ gieˊ maˇ piˇ)","def":"起雞皮疙瘩。 例如：一講著蛇哥，𠊎就會起寒毛菇。","example":""},{"word":"翕壞","pinyin":"hibˋ fai","def":"悶壞。 例如：恁熱个天時毋開冷氣，人會翕壞。","example":""},{"word":"翕死（翕消忒）【翕消核】","pinyin":"hibˋ xiˋ (hibˋ xiauˊ tedˋ)【hibˋ xiauˊ hedˋ】","def":"悶死、窒息而死。 例如：恁熱个天時還同窗門關密密，會翕死（翕消核）哦！","example":""},{"word":"血洋洋仔","pinyin":"hiedˋ iongˇ iongˇ eˋ【hiadˋ iongˇ iongˇ eˊ】","def":"鮮血滿流的樣子。 例如：兩臺車仔相撞，地泥項血洋洋仔，異（盡）得人驚。","example":""},{"word":"胸脯","pinyin":"hiungˊ puˇ","def":"胸脯、胸膛。 例如：你愛食加兜仔，胸脯作加兜肉，看著正毋會恁瘦弱。","example":""},{"word":"打噎啄","pinyin":"daˋ ed dug/dog","def":"不間斷的打嗝。 例如：東西食忒遽異（盡）會打噎啄，還係定定仔噍較（過）贏。","example":""},{"word":"汗流脈落","pinyin":"hon liuˇ mag log","def":"汗流浹背，亦可說「歸身大汗」。 例如：懶尸牯做事就尋衫著，食飯就拚到（拚啊）汗流脈落。","example":""},{"word":"醫病","pinyin":"iˊ piang","def":"治療疾病。 例如：陳醫生按算轉（歸）鄉下開業，同鄉親醫病。","example":""},{"word":"菸願","pinyin":"ienˊ ngien【ianˊ ngian】","def":"菸癮。 例如：正十分鐘無食菸，厥菸願又擎（惹）起來。","example":""},{"word":"蜒著","pinyin":"ienˇ doˋ【ianˇ doˋ】","def":"被毒蟲爬過而灼傷皮膚。 如「分蟲仔蜒著」。","example":""},{"word":"有身妊","pinyin":"iuˊ siinˊ imˋ","def":"懷孕，有孕在身。 例如：有身妊个人愛多尞，毋好忒過勞碌。","example":""},{"word":"酒窟仔","pinyin":"jiuˋ fudˋ eˇ【jiuˋ fudˋ eˋ】","def":"酒窩。 例如：佢一笑（㖸），面項个酒窟仔就會走出來。","example":""},{"word":"腳脥下（胠罅下）","pinyin":"giogˋ kiab haˊ (kia la haˊ)","def":"胯下。 例如：當（蓋）多蚊仔在若腳脥下蒐啊蒐仔（𫟧啊𫟧仔）愛叼你，還毋遽遽（共快）走！","example":""},{"word":"缺嘴","pinyin":"kiedˋ zoi【kiadˋ zoi】","def":"兔脣。 例如：現下人出世係講缺嘴，有好醫。","example":""},{"word":"拳頭嫲","pinyin":"kienˇ teuˇ maˇ【kianˇ teuˇ maˇ】","def":"拳頭。 例如：抽血个時節，護理師會喊你揢等拳頭嫲。","example":""},{"word":"虯毛仔（皺毛仔）","pinyin":"kiuˇ moˊ eˋ (jiu moˊ eˋ)","def":"稱捲髮的人。 例如：𠊎生成就係虯毛仔（皺毛仔），自娘胎吾姆就同𠊎電好吔。","example":""},{"word":"靠溜皮【磨溜皮】","pinyin":"ko liu piˇ【mo liu piˇ】","def":"擦破皮。 例如：厥皮鞋毋合腳，正著著一點鐘就靠溜皮（磨溜皮）。","example":""},{"word":"擐人","pinyin":"kuan nginˇ","def":"懷孕。 例如：吾（𠊎个）心臼擐人吔，𠊎愛做阿婆（阿嬤）哩喲（吔喲）！","example":""},{"word":"爛嘴","pinyin":"lan zoi","def":"口腔潰爛，嘴破。 例如：𠊎恁久火氣大，緊爛嘴。","example":""},{"word":"冷底","pinyin":"langˊ daiˋ","def":"體質冷的特性，反之，體質熱的人會說「熱底」。 例如：冷底个人，一到寒天就手冷腳冷。","example":""},{"word":"落胎【溜胎】","pinyin":"lau toiˊ【liu toiˊ】","def":"流產。 例如：佢身體弱，擐細人仔毋核，落胎（溜胎）幾下擺，盡衰過。","example":""},{"word":"力頭","pinyin":"lid teuˇ","def":"力氣。 例如：佢生來矮細罔矮細，毋過力頭異（盡）大。","example":""},{"word":"膦棍","pinyin":"linˋ gun","def":"陰莖。 例如：該人講話，膦棍長膦棍短，盡無水準。","example":""},{"word":"溜皮","pinyin":"liu piˇ","def":"擦破表皮。 例如：佢走相逐分人撞著跌倒（橫倒），膝頭溜皮，好得人無仰仔。","example":""},{"word":"老症頭","pinyin":"loˋ ziin teuˇ","def":"老毛病。 例如：這係老症頭哩（吔），食藥仔就做得，無麼个相干。","example":""},{"word":"落院（戴院、歇院）","pinyin":"log ien (dai ien、hed ien)【hed ian】","def":"住院。 例如：阿伯落院（歇院）手術骨刺，厥妹仔在院項掌。","example":""},{"word":"鑪溜皮","pinyin":"lu liu piˇ","def":"因摩擦而破皮。 例如：阿文仔跌倒（橫倒），手腳毋單淨（毋單止）鑪溜皮，還緊出血。","example":""},{"word":"㪐皮","pinyin":"ludˋ piˇ【lodˋ piˇ】","def":"脫皮。 例如：上禮拜割著个傷口，會㪐皮吔，當（蓋）癢。","example":""},{"word":"毛辮仔","pinyin":"moˊ bienˊ eˋ","def":"髮辮子。如「拼毛辮仔」。","example":""},{"word":"目珠打著","pinyin":"mugˋ zuˊ daˋ doˋ","def":"眼睛被異物入侵。 例如：熱天時虻仔歸陣仔飛，騎車仔該下目珠打著，當（盡）痛。","example":""},{"word":"目珠花花","pinyin":"mugˋ zuˊ faˊ faˊ","def":"視力模糊，看不清楚的樣子。 例如：人老吔，毋係耳聾聾，就係目珠花花。","example":""},{"word":"目摸目罅","pinyin":"mugˋ moˊ mugˋ la","def":"視力模糊，四處摸索的樣子。 例如：佢正醒，目摸目罅，尋當（盡）久正尋著便所。","example":""},{"word":"目屎","pinyin":"mugˋ siiˋ","def":"眼屎。 例如：老妹朝晨䟘床吂（毋曾）洗面，目屎浙濟。","example":""},{"word":"撓著（扭著）【撙著】","pinyin":"nauˋ doˋ (ngiuˋ doˋ)【zunˋ doˋ】","def":"手部或腳部扭傷。 例如：佢昨晡日打籃球撓著（撙著）腳，行路跛啊跛仔，異（盡）衰過。","example":""},{"word":"乳臊","pinyin":"nen soˊ","def":"乳臭味。 例如：細嬰兒仔鼻著阿姆个乳臊，嘴斯緊擘。","example":""},{"word":"魚鱗痣","pinyin":"ngˇ linˊ zii","def":"魚鱗痣。 例如：頭擺醫學無恁好，當（蓋）多人會用酸醋來點魚鱗痣。","example":""},{"word":"牙暴暴仔","pinyin":"ngaˇ bau bau eˋ【ngaˇ bau bau eˊ】","def":"形容牙齒突出的樣子。 例如：佢牙暴暴仔，講話會漏風，成時連嘴都合毋密。","example":""},{"word":"牙齦肉（牙床肉、牙倉肉）","pinyin":"ngaˇ ngienˊ ngiugˋ (ngaˇ congˇ ngiugˋ、ngaˇ congˊ ngiugˋ)【ngaˇ ngianˊ ngiugˋ】","def":"牙齦。 例如：搓牙齒个時節，牙齦肉若會流血，可能係牙周病哦！","example":""},{"word":"牙腳","pinyin":"ngaˇ giogˋ","def":"牙根。 例如：先生講吾（𠊎个）牙腳蛀忒哩（蛀核吔），毋挷忒（挷核）斯做毋得。","example":""},{"word":"齧牙","pinyin":"ngad ngaˇ","def":"磨牙、咬著牙。 例如「睡到齧牙」、「譴到齧牙」。","example":""},{"word":"癌症","pinyin":"ngamˇ ziin","def":"癌症。 例如：有專家講壓力係人著著癌症个原因之一。","example":""},{"word":"耳砣","pinyin":"ngiˋ toˇ","def":"耳垂。 例如：厥耳公異（盡）大對，耳砣當（蓋）賁肉。","example":""},{"word":"耳聾","pinyin":"ngiˋ lungˊ","def":"耳聾。 例如：無論係耳聾抑係目瞨个人，都愛有自家謀生个能力。","example":""},{"word":"拈藥仔","pinyin":"ngiamˊ iog eˋ","def":"拿藥方去中藥店配藥。 例如：阿森伯嗽當（盡）多日吔，佢講愛去藥店拈藥仔來食。","example":""},{"word":"尿出","pinyin":"ngiau cudˋ","def":"有尿意，尿急；「屎出」則代表有「便意」。 例如：尿出就愛遽啊去屙，毋好忍。","example":""},{"word":"尿泡","pinyin":"ngiau pau","def":"膀胱。 例如：食恁多茶還毋屙尿，尿泡會砰忒（砰核）哦！","example":""},{"word":"熱痱仔","pinyin":"ngied bi eˋ【ngiad bi eˋ】","def":"痱子。 例如：老弟背囊發熱痱仔，阿姆同佢挲熱痱粉。","example":""},{"word":"殗殗","pinyin":"ngiem ngiem","def":"病弱無神貌。 例如：阿慶姨正手術出來，殗殗講話無力。","example":""},{"word":"人毋好","pinyin":"nginˇ mˇ hoˋ","def":"生病、不舒服。 例如：阿叔婆（叔婆）這站仔人毋好，當（蓋）少出來過家尞。","example":""},{"word":"屙硬屎","pinyin":"oˊ ngang siiˋ","def":"排硬便。 例如：阿明牯屙硬屎，掙毋得出。","example":""},{"word":"嗀出來","pinyin":"og cudˋ loiˇ","def":"腹中逆氣使東西排出。 例如：阿明毋知食著麼个無淨俐个，嗄歸下嗀出來。","example":""},{"word":"呸血（嘔血、翻血）","pinyin":"pi hiedˋ (euˋ hiedˋ、ponˊ hiedˋ)【ponˊ hiadˋ】","def":"吐血。 例如：佢鼻血倒流到嘴項嗄呸血（翻血）出來，害𠊎著驚一下。","example":""},{"word":"鼻龍峎","pinyin":"pi liungˇ gien","def":"鼻梁。 例如：佢分同學用球仔擲（擳）著鼻龍峎，出當（蓋）多鼻旺仔。","example":""},{"word":"鼻塞塞","pinyin":"pi sedˋ sedˋ","def":"本指鼻子呼吸不通暢，引申為形容人小氣、不通人情。 例如：佢做人盡慨，你仰會講佢鼻塞塞？","example":""},{"word":"鼻水","pinyin":"pi suiˋ","def":"鼻水。 例如：佢見食著辣个東西就會緊流鼻水。","example":""},{"word":"呸痰","pinyin":"pi tamˇ【pui tamˇ】","def":"吐痰。 例如：儘採呸痰異（盡）無衛生，當（蓋）得人惱。","example":""},{"word":"病丁仔","pinyin":"piang denˊ eˋ","def":"病夫。 例如：愛多運動，正毋會分人喊做病丁仔。","example":""},{"word":"病症","pinyin":"piang ziin","def":"病症。 例如：係講著著尿毒這種病症，一生人都愛洗腰仔。","example":""},{"word":"偏著","pinyin":"pienˊ doˋ","def":"扭傷。 例如：運數實在還毋好，正行啊出大路，腳就偏著。","example":""},{"word":"破病","pinyin":"po piang","def":"生病，形容體弱多病，引申義為差勁的意思。 例如：佢破病破病，身體當（蓋）弱，做麼个事就毋得。","example":""},{"word":"破相","pinyin":"po xiong","def":"破相。 例如：頭擺人驚破相，毋會儘採去桊耳。","example":""},{"word":"青瞑","pinyin":"qiangˊ miangˊ","def":"失明，眼睛喪失了視覺能力。 例如：若目珠歸日仔看手機仔，毋驚會搣青瞑喺？","example":""},{"word":"七坐八爬九生牙","pinyin":"qidˋ coˊ badˋ paˇ giuˋ sangˊ ngaˇ","def":"謂小兒生長的過程，七個月能坐，八個月能爬，九個月長牙齒。 例如：七坐八爬九生牙，細人仔撚啊撚仔，毋多知仔就恁大吔。","example":""},{"word":"膝頭腕","pinyin":"qidˋ teuˇ vonˋ","def":"膝蓋骨；膝關節。 例如：阿伯姆腳毋好，加兩日愛手術換膝頭腕。","example":""},{"word":"搶食胲","pinyin":"qiongˋ siid goiˊ","def":"喉結。 例如：細阿哥仔轉骨吔，搶食胲看起來加較（過）顯明。","example":""},{"word":"刺著","pinyin":"qiugˋ doˋ","def":"刺到、刺傷。 例如：厥腳分鐵釘仔刺著，出當（蓋）多血。","example":""},{"word":"刺眼","pinyin":"qiugˋ ngienˋ【qiugˋ ngianˋ】","def":"耀眼、礙眼。 例如：日頭下箭等，恁刺眼，愛仰仔看書？","example":""},{"word":"勯忒【勯核】","pinyin":"sanˊ tedˋ【sanˊ hedˋ】","def":"沒了氣息，但不一定死亡，亦有昏去的意思。 例如：頭擺人㓾雞鴨，愛等佢完全勯忒（勯核），正做得熝滾水。 例如：阿日哥做个係粗事，逐日轉來強強就會勯忒（每日歸來都險險勯核）。","example":""},{"word":"聲胲【聲說】","pinyin":"sangˊ goiˊ【sangˊ sodˋ】","def":"聲音、嗓音的大小。例如「厥聲胲（聲說）當（蓋）大」。","example":""},{"word":"擤鼻","pinyin":"sen pi","def":"擤鼻涕。 例如：佢寒著（凍著），擤鼻擤無停。","example":""},{"word":"屎胐斗","pinyin":"sii vudˋ deuˋ【sii fudˋ deuˋ】","def":"臀部。 例如：大箍起來，屎胐斗變大，驚怕褲會尖毋落哩（吔）！","example":""},{"word":"食嗽","pinyin":"siid cug","def":"吃了可以治療咳嗽。 例如：這藥仔食嗽，毋會苦，你做得試看哪。","example":""},{"word":"食腳痛个","pinyin":"siid giogˋ tung ge","def":"治療腳痛的藥（食用）。而相同句型為「食嗽个」則為「治療咳嗽的藥」。 例如：這係食腳痛个，這係食嗽个，你斯毋好拿毋著來食哦！","example":""},{"word":"腎家","pinyin":"siin gaˊ","def":"腎臟。 例如：聽人講，腎家毋砸个人較（過）會腰骨痠軟。","example":""},{"word":"上想","pinyin":"song xiongˋ","def":"上截，指手臂或腿的上半部，即上臂或大腿部位。「下想」則為「下截」，指手臂或腿的下半部，即下臂或小腿部位。 例如：擎啞鈴做得鍛鍊上想个肌肉。","example":""},{"word":"手脛","pinyin":"suˋ guangˋ","def":"下臂，指手掌至手肘的那一段。「腳脛」則指腳掌至膝蓋的那一段。 例如：佢瘦夾夾仔，手脛恁幼，一撚就會斷樣仔。","example":""},{"word":"手瘸腳跛（瘸手跛腳）","pinyin":"suˋ kioˇ giogˋ baiˊ (kioˇ suˋ baiˊ giogˋ)","def":"形容手腳不健全，行動不便的樣子。 例如：佢無手瘸腳跛，也毋會目瞨耳聾，應該毋會尋毋著頭路。","example":""},{"word":"手丫","pinyin":"suˋ aˊ","def":"手掌的虎口處。 例如：手丫係著傷盡毋好醫。","example":""},{"word":"手指罅","pinyin":"suˋ ziiˋ la","def":"手指間之縫隙。 例如：湖鰍仔當（蓋）會鑽，看等捉著吔，又對手指罅溜走吔。","example":""},{"word":"水藥","pinyin":"suiˋ iog","def":"用水煎煮的中藥。 例如：今這下个漢醫大體都開安到科學中藥个藥粉仔，較（過）少合水藥喊人自家轉去（歸去）煲吔。","example":""},{"word":"雙下𪘒","pinyin":"sungˊ haˊ ngamˊ","def":"雙下巴。 例如：佢恁久較（過）福相，笑啊（㖸啊）去雙下𪘒就看現現。","example":""},{"word":"雙瞼目","pinyin":"sungˊ ngiamˊ mugˋ","def":"雙眼皮。 例如：佢係雙瞼目，目珠當（蓋）大蕊。","example":""},{"word":"大嫲聲","pinyin":"tai maˇ sangˊ","def":"很大聲。 例如：隔壁講話大嫲聲，驚人聽毋著樣仔。","example":""},{"word":"大聲胲","pinyin":"tai sangˊ goiˊ","def":"大嗓門。 例如：姐婆（外阿婆）个大聲胲，遠遠就聽得著。","example":""},{"word":"聽毋真","pinyin":"tangˊ mˇ ziinˊ","def":"聽不清楚。 例如：你話講忒細聲，𠊎聽毋真。","example":""},{"word":"拖命","pinyin":"toˊ miang","def":"接近死亡而未死，勉強維持生命。 例如：中風恁多年，搵在眠床項毋會停動，淨拖命定定。","example":""},{"word":"退紅","pinyin":"tui fungˇ","def":"消炎。 例如：這藥膏異（蓋）有效，搽兩到仔就退紅吔。","example":""},{"word":"推推啊","pinyin":"tuiˊ tuiˊ aˋ","def":"將傷部搓揉搓揉一番；抓來修理一番。 例如：頸根試著硬鉸硬鉸，去分人推推啊會較（過）鬆爽。 例如：佢當（蓋）番綻，分厥爸推推啊過後，有較（過）乖。","example":""},{"word":"橫忒【橫核】","pinyin":"vang tedˋ【vang hedˋ】","def":"以人死亡倒地的意象，用以指稱死亡。 例如：佢一橫忒（橫核），歸家屋就四離五散。","example":""},{"word":"胃糟糟","pinyin":"vi zoˊ zoˊ","def":"腸胃中缺乏油脂想吃肉的感覺。 例如：李仔酸合澀，食吔胃糟糟。","example":""},{"word":"禾鐮鐵（禾鐮缺）【禾鐮結】","pinyin":"voˇ liamˇ tiedˋ (voˇ liamˇ kiedˋ)【voˇ liamˇ giadˋ】","def":"胰臟。 例如：當（蓋）多人毋知，禾鐮鐵（禾鐮結）乜係一種消化器官。","example":""},{"word":"烏蠅屎","pinyin":"vuˊ inˇ siiˋ","def":"指臉上的雀斑。 例如：行兼一看，厥面項斷真有當（蓋）多烏蠅屎。","example":""},{"word":"烏青","pinyin":"vuˊ qiangˊ","def":"瘀青。 例如：你在哪𢼛著？𢼛到（𢼛啊）烏青烏青。 例如：吾（𠊎）腳項該搭烏青，恁多日吔還毋得退。","example":""},{"word":"搵著","pinyin":"vudˋ doˋ","def":"扭傷。 例如：佢昨晡日打拳，毋堵好搵著，怕幾下日做毋得去哩（吔）。","example":""},{"word":"瀉痢肚（屙痢肚）","pinyin":"xia li duˋ (oˊ li duˋ)","def":"拉肚子。 例如：𠊎怕係食著無萋个東西，緊瀉痢肚。","example":""},{"word":"楔牙縫","pinyin":"xiabˋ ngaˇ pung","def":"塞牙縫。 例如：雞肉當（蓋）好食，毋過也當（蓋）會楔牙縫。 例如：食著恁多仔定定，無搭碓，毋罅楔牙縫。","example":""},{"word":"襲著風【受著風】","pinyin":"xib doˋ fungˊ【su doˋ fungˊ】","def":"受到風寒。 例如：細妹人做月盡驚襲著風（受著風）。","example":""},{"word":"心肝前","pinyin":"ximˊ gonˊ qienˇ","def":"胸前。 例如：該隻（該）細人仔，伏在厥姆个心肝前睡目，睡到牽覺。","example":""},{"word":"心肝頭","pinyin":"ximˊ gonˊ teuˇ","def":"胸中或心裡。 例如：同佢冤家（吵事）過後，𠊎心肝頭拶拶，當（蓋）毋爽快。","example":""},{"word":"鑲牙補齒","pinyin":"xiongˊ ngaˇ buˋ ciiˋ","def":"鑲牙補齒。 例如：現代牙科毋單淨（毋單止）摎（同）人鑲牙補齒，還有當（盡）多種醫療服務。","example":""},{"word":"咻咻咻咻","pinyin":"xiuˇ xiuˇ xiu xiu","def":"形容一陣一陣抽痛的樣子。 例如：寒天來吔，阿婆个腳膝頭（膝頭）又會咻咻咻咻，痛到（痛啊）睡毋得。","example":""},{"word":"砸身","pinyin":"zabˋ siinˊ","def":"身體健壯。 例如：佢看起來還恁砸身，無想著恁遽就走忒（走核）吔。","example":""},{"word":"照光線（照電光）","pinyin":"zeu gongˊ xien (zeu tien gongˊ)","def":"照X光。 例如：佢分車仔撞著，愛去照光線。","example":""},{"word":"診所","pinyin":"ziinˊ soˋ","def":"診所。 例如：你緊嗽，還毋去診所拿藥仔食！","example":""},{"word":"捉痧（刮痧）【扭痧】","pinyin":"zogˋ saˊ (guadˋ saˊ)【neuˋ saˊ】","def":"刮痧，替中暑或身體不適的人刮經絡。 例如：熱著頭那暈（昏），分人捉痧（扭痧）過後會較（過）自然。","example":""},{"word":"嘴包","pinyin":"zoi bauˊ","def":"口腔內部兩側。 例如：佢毋知食著麼个，嘴包當（蓋）爛。","example":""},{"word":"嘴竵竵","pinyin":"zoi feˋ feˋ","def":"嘴歪歪的。 例如：佢識中風過，故所正會嘴竵竵。","example":""},{"word":"蛀牙","pinyin":"zu ngaˇ","def":"蛀牙。 例如：食過東西愛洗嘴，正毋會蛀牙。","example":""},{"word":"種牙齒","pinyin":"zung ngaˇ ciiˋ","def":"植牙。 例如：這下人種牙齒，一支就愛歸十萬個銀。","example":""},{"word":"斷乳","pinyin":"donˋ nen【tonˊ nen】","def":"斷奶。 例如：狗子吂（毋曾）斷乳，不時都擒等狗嫲搶乳食。","example":""},{"word":"氣脈","pinyin":"hi magˋ","def":"氣力、精力，一般多指生命的延續力。 例如：該人分水浸著（沉著），聽講吂（毋曾）送到醫院就測無氣脈吔。 例如：仰仔講佢都毋會分醒，𠊎無恁大氣脈同佢詏。","example":""},{"word":"反症","pinyin":"fanˋ ziin","def":"舊病復發；引申為反悔。 例如：𠊎上夜食西瓜，下夜就反症。 例如：上擺𠊎同佢講好个生理，今晡日嗄反症，這下無結無煞。","example":""},{"word":"閼死","pinyin":"adˋ xiˋ","def":"氣死。 例如：佢分頭家在大家面前恁仔哆，又做毋得罵轉去（歸去），忍在（忍啊）心肚（心肚仔）會閼死。","example":""},{"word":"唉唉㗱㗱","pinyin":"aiˊ aiˊ jib jib","def":"怨歎連連的樣子。 例如：動啊著就唉唉㗱㗱个人，愛仰仔做大事？","example":""},{"word":"半生死","pinyin":"ban sangˊ xiˋ","def":"要死不活；剩下半條命。 例如：佢做到半生死，錢又分人騙淨淨，實在衰到貼地！","example":""},{"word":"蹦跳","pinyin":"bangˋ tiauˇ","def":"跳腳，氣急敗壞的樣子；近義詞有「蹦飆」、「蹦蹦跳」。 例如：佢聽著這兜傷人个話，譴到蹦跳。","example":""},{"word":"發琢愕（發琢呆）","pinyin":"bodˋ dogˋ ngogˋ (bodˋ dogˋ ngoiˇ)","def":"發呆、發楞。 例如：遽啊去赴上班，莫在該發琢愕。","example":""},{"word":"痴呆痴呆","pinyin":"ciiˊ ngoiˇ ciiˊ ngoiˇ","def":"呆癡、愚痴；亦可說「痴痴呆呆」。 例如：你莫挑事（剔事）挶到（挶啊）痴呆痴呆，麼个就毋知樣仔。","example":""},{"word":"暢快【爽快】","pinyin":"congˋ kuai【songˋ kuai】","def":"身心舒服快樂。 例如：論文總算寫忒（寫核）通過吔，實在暢快（爽快）。","example":""},{"word":"抽筋縮脈","pinyin":"cuˊ ginˊ sogˋ magˋ","def":"痛苦萬分狀。原指抽除筋絡緊縮血脈，表痛苦至極。 例如：痛風擎起來，抽筋縮脈，痛到（痛啊）佇毋著。","example":""},{"word":"鈂鈂","pinyin":"dem dem","def":"感到笨重的樣子。 例如：無食殗殗，食飽又鈂鈂。","example":""},{"word":"知足","pinyin":"diˊ jiugˋ","def":"對於現狀感到滿足。 例如：人愛知足正會快樂。","example":""},{"word":"顛顛倒倒","pinyin":"dienˊ dienˊ do do","def":"神智不甚清醒貌。 例如：佢食酒醉吔，講話顛顛倒倒，聽都毋識。","example":""},{"word":"丟酸","pinyin":"diuˊ sonˊ【diu sonˊ】","def":"形容食物的味道極酸。 例如：現下柑仔還毋係時節，食起來丟酸。","example":""},{"word":"丟苦","pinyin":"diuˊ fuˋ【diu fuˋ】","def":"形容食物的味道極苦。亦可說「苦丟丟仔」。 例如：苦瓜丟苦，盡多細人仔毋敢食。","example":""},{"word":"發性（起性）","pinyin":"fadˋ xin (hiˋ xin)","def":"指人使性子、發脾氣。 例如：佢係發性起來，麼人个話都毋聽。","example":""},{"word":"反心","pinyin":"fanˋ ximˊ","def":"改變心意、反悔。 例如：見擺大家講好个事情，佢毋係反心就係毋承認。","example":""},{"word":"火氣","pinyin":"foˋ hi","def":"怒氣；中醫裡講的火氣。 例如：做麼个火氣恁大？麼人惹著你係無？ 例如：佢前一駁仔火氣大，緊爛嘴，到今還吂（毋曾）好。","example":""},{"word":"風神哎哎","pinyin":"fungˊ siinˇ ngai ngai","def":"洋洋得意。 例如：阿祿伯自從厥倈仔頭路成功以後，去到哪就風神哎哎。","example":""},{"word":"甘","pinyin":"gamˊ","def":"甘甜的味道。亦可說「甘甘」，強調甘的滋味。 例如：這茶食吔嘴尾會甘，有影係好茶。","example":""},{"word":"浹嘴","pinyin":"giabˋ zoi","def":"嘴巴有澀而沾黏的感覺，亦可說「嘴浹浹」。 例如：這弓蕉還青青，食起來會浹嘴。","example":""},{"word":"驚到會死","pinyin":"giangˊ do voi xiˋ","def":"怕得要命。 例如：講著地動，大家驚到會死。","example":""},{"word":"驚驚險險","pinyin":"giangˊ giangˊ hiamˋ hiamˋ","def":"感到驚險可怕的樣子。 例如：這渡線橋又高又長，行過去个人每儕（一個人）都驚驚險險，潑一身大汗。","example":""},{"word":"嘐嘐滾","pinyin":"giau giau gunˋ","def":"形容抱怨或不滿的聲音，多用於罵人。 例如：百貨起價，就薪水無起，食月給个人嘐嘐滾。","example":""},{"word":"過願","pinyin":"go ngien【go ngian】","def":"過癮。 例如：好看个戲，無看三遍毋會過願。","example":""},{"word":"鹹丟丟仔","pinyin":"hamˇ diuˊ diuˊ eˋ【hamˇ diuˊ diuˊ eˊ】","def":"形容味道很鹹。 例如：鹹魚仔鹹丟丟仔，傍飯毋好傍恁粗（恁大矻）。","example":""},{"word":"好擳擳仔【好絕絕仔】","pinyin":"hau jied jied eˋ【hau qied qied eˊ】","def":"興沖沖的樣子。 例如：阿哥一聽著搞水就好擳擳仔（好絕絕仔），逐等愛去。 例如：細人仔一學會騎自行車，就好擳擳仔（好絕絕仔）密密愛去騎。","example":""},{"word":"起牛面","pinyin":"hiˋ ngiuˇ mien","def":"不理性的發洩情緒、發牛脾氣。 例如：講人毋贏，嗄在該起牛面，還見笑。","example":""},{"word":"起戇面【起番面】","pinyin":"hiˋ ngong mien【hiˋ fanˊ mien】","def":"生氣、翻臉。 例如：佢心情毋好，你毋好惹佢，等一下佢起戇面（起番面）你就知哩（吔）！","example":""},{"word":"翕翕（翕熱）","pinyin":"hibˋ hibˋ (hibˋ ngied)【hibˋ ngiad】","def":"悶熱。 例如：今晡日个日頭盡烈，又無半點（半息）風，試著翕翕。","example":""},{"word":"梟心","pinyin":"hieuˊ ximˊ","def":"心存非分。 例如：做人毋好有梟心，正會受人歡迎。","example":""},{"word":"堪毋得（毋堪）","pinyin":"kamˊ mˇ dedˋ (mˇ kamˊ)","def":"不值得；承受不了。 例如：該就堪毋得半角銀个東西，仰使（毋使）愛恁計較。 例如：毋好恁拚命个做哦，若身體斯會堪毋得。","example":""},{"word":"企坐毋核","pinyin":"kiˊ coˊ mˇ hed","def":"坐立難安。 例如：清海嫂聽著妹仔會降吔，企坐毋核，遽遽（共快）逐到醫院項去。","example":""},{"word":"虔誠","pinyin":"kienˇ siinˇ【kianˇ siinˇ】","def":"恭敬而真誠。 例如：求神拜佛，定著愛虔誠。","example":""},{"word":"看無","pinyin":"kon moˇ","def":"看不見、看不懂；瞧不起。 例如：你整理个資料，大家看無，摎（同）大家說明一下好無？ 例如：你斯愛較（過）拚兜仔（一息），正毋會分人看無。","example":""},{"word":"看戇忒【看戇核】","pinyin":"kon ngong tedˋ【kon ngong hedˋ】","def":"看到出神，呆若木雞。 例如：看戲看戇忒（看戇核）吔，還會跈等做戲个噭。","example":""},{"word":"寬心","pinyin":"konˊ ximˊ","def":"安心、放心。 例如：看著佢平安轉來（歸來），大家就寬心吔！","example":""},{"word":"怙勢仔【盡命牯】","pinyin":"ku sii eˋ【qin miang guˋ】","def":"盡情的。 例如：今晡日做到當（盡）𤸁，天光日放尞，做得怙勢仔（盡命牯）睡。","example":""},{"word":"罅擺","pinyin":"la baiˋ","def":"夠了。 例如：共件事情你做麼个愛講恁多擺，算來罅擺吂（吔無）？","example":""},{"word":"懶𧊅𧊅仔","pinyin":"lanˊ/nanˊ guaiˋ guaiˋ eˇ【lanˊ/nanˊ guaiˋ guaiˋ eˊ】","def":"懶洋洋地。 例如：你仰看起來懶𧊅𧊅仔，係毋係人無鬆爽？","example":""},{"word":"起懶根","pinyin":"hiˋ lanˊ/nanˊ ginˊ","def":"發懶。 例如：畢業過後在屋下尞忒久，新頭路正做著兩日仔定定，又開始起懶根。","example":""},{"word":"摝死人","pinyin":"lugˋ xiˋ nginˇ","def":"煩死人；不斷給他人添麻煩。 例如：事頭就做毋俐吔，你還來鬧，正經（正式）摝死人。","example":""},{"word":"毋知天合地","pinyin":"mˇ diˊ tienˊ gagˋ ti","def":"比喻很投入，忘了時間與空間的存在；不知天高地厚。 例如：好朋友逐擺（每擺）打鬥四，淨番豆同茶，乜共樣講到毋知天合地。 例如：這兜後生仔仰會恁毋知天合地，講毋好去又走等去。","example":""},{"word":"愐心事","pinyin":"menˋ ximˊ sii","def":"想著心裡惦記的事。 例如：老妹歸下晝在該愐心事，無心思做頭路。","example":""},{"word":"面臭臭仔（面臭臭）","pinyin":"mien cu cu eˋ (mien cu cu)【mien cu cu eˊ】","def":"沒有笑容，生氣的樣子 例如：逐（每）日看著佢都面臭臭仔，當（盡）像少著厥錢樣仔。","example":""},{"word":"無鹹無腥","pinyin":"moˇ hamˇ moˇ xiamˊ/xiangˊ","def":"一點味道都沒有。而「無鹹無淡」則表示沒有鹹味。 例如：這桌菜煮到（煮啊）無鹹無腥，毋餳人食。","example":""},{"word":"無相無干","pinyin":"moˇ xiongˊ moˇ gonˊ","def":"不在乎，不相干。 例如：佢從細就係無緊無慢个性格，堵著考試，乜本本涼涼，無相無干。","example":""},{"word":"目勾勾仔（目望望仔）","pinyin":"mugˋ gieuˊ gieuˊ eˋ (mugˋ mong mong eˋ)【mugˋ mong mong eˊ】","def":"望眼欲穿的樣子。 例如：阿姆目勾勾仔（目望望仔）等阿哥轉（歸來），透（歸）夜仔全毋敢睡。","example":""},{"word":"奈毋何","pinyin":"nai mˇ hoˇ","def":"承受不了、應付不了、負荷不了；沒轍。反義則為「奈得何」。 例如：阿姆歸日企等做事，厥兩支腳怕會奈毋何。 例如：佢這人就係講毋會聽，逐儕（每一個人）對佢都奈毋何。","example":""},{"word":"耐毋得【毋得結煞】","pinyin":"nai mˇ dedˋ【mˇ dedˋ gadˋ sadˋ】","def":"忍不住、不得了。 例如：佢考一擺就拿著駕照，暢到耐毋得（暢啊毋得結煞）。","example":""},{"word":"懶骨","pinyin":"nanˊ/lanˊ gudˋ","def":"懶散的本性。 例如：佢一路里來就當（蓋）懶骨，喊佢做事佢甘願犁（眠）凳板。","example":""},{"word":"齧牙𫠛齒","pinyin":"ngad ngaˇ sen ciiˋ","def":"咬牙切齒，忿怒狀。 例如：佢譴你譴到（譴啊）齧牙𫠛齒，拳頭嫲（拳頭）就揢出水吔。","example":""},{"word":"疑心病","pinyin":"ngiˇ ximˊ piang","def":"疑心病。 例如：疑心病忒重哩（吔），疑神疑鬼，仰結煞？","example":""},{"word":"虐削","pinyin":"ngiogˋ xiogˋ","def":"皮膚受到芒刺而痛癢的感覺；因困窘而感到不自在的感覺。另言「虐虐削削」。 例如：割一日禾下來，歸身虐削，遽啊去洗身。 例如：入門係看著一張臭屎面，會虐削到（啊）企坐毋核。","example":""},{"word":"愛使","pinyin":"oi siiˋ","def":"何必，多使用於反詰語語境，義為不必要，也可說「仰使」。 例如：這愛使你教？淨看一下就學會吔。","example":""},{"word":"嗄會知【哪會知】","pinyin":"sa voi diˊ【nai voi diˊ】","def":"怎知道？ 例如：𠊎嗄會知（哪會知）佢走哪去？你做得問厥餔娘（姐仔）。","example":""},{"word":"沙鼻摝天（沙鼻弄天）","pinyin":"saˊ pi lugˋ tienˊ (saˊ pi nung tienˊ)","def":"神氣活現的樣子。 例如：阿明這擺考試打頭名，佢就沙鼻摝天，一哪仔同人講。","example":""},{"word":"三心打兩意（三心兩意）","pinyin":"samˊ ximˊ daˋ liongˋ i (samˊ ximˊ liongˋ i)","def":"形容人意志不堅，做事狐疑、猶豫不決。 例如：愛就愛遽啊決定，毋好三心打兩意。","example":""},{"word":"細心細意","pinyin":"se ximˊ se i","def":"小心翼翼、周到的樣子。 例如：佢做事情細心細意，項項周到。","example":""},{"word":"食睡毋得","pinyin":"siid soi mˇ dedˋ","def":"寢食難安。 例如：佢做虧心事，難怪這幾日仔食睡毋得。","example":""},{"word":"算毋著","pinyin":"son mˇ doˋ","def":"無法算準。 例如：會有幾多儕人（幾多人）來，𠊎乜算毋著，毋罅坐正講。","example":""},{"word":"酸丟丟仔","pinyin":"sonˊ diuˇ diuˇ eˋ【sonˊ diuˇ diuˇ eˊ】","def":"形容很酸的樣子。 例如：紅李仔酸丟丟仔，食到（食啊）𠊎牙齒當（蓋）軟。","example":""},{"word":"酸咚咚仔","pinyin":"sonˊ dungˇ dungˇ eˋ【sonˊ dungˇ dungˇ eˊ】","def":"味道酸溜溜的。 例如：這缸酸醋酸咚咚仔，做到（做啊）有得著訣。","example":""},{"word":"受當毋起","pinyin":"su dongˊ mˇ hiˋ","def":"承受不起，不敢當。 例如：你輩分較（過）高，又送恁大个禮，𠊎實在受當毋起。","example":""},{"word":"偷暢","pinyin":"teuˊ tiong","def":"暗自高興。 例如：大家分佢騙到譴呰呰仔，佢自家嗄恬恬仔偷暢。","example":""},{"word":"天長命短","pinyin":"tienˊ congˇ miang donˋ","def":"感嘆生命短暫。 例如：老古人講：「天長命短」，故所𫣆兜（𠊎等）愛好好把扼每一日。","example":""},{"word":"暢靂靂仔（暢若若仔）","pinyin":"tiong lag lag eˋ (tiong na na eˋ)【tiong lag lag eˊ】","def":"私底下覺得微微的高興。 例如：頭家講發三個月个年終獎金，大家聽著都暢靂靂仔。","example":""},{"word":"暢摸摸仔","pinyin":"tiong miaˊ miaˊ eˋ【tiong miaˊ miaˊ eˊ】","def":"非常高興。 例如：厥爸放尞帶等歸家人共下出國遶尞，大家都暢摸摸仔。","example":""},{"word":"暢暢仔","pinyin":"tiong tiong eˋ【tiong tiong eˊ】","def":"微微的高興。 例如：佢打官司，眼時看著還暢暢仔，最尾會仰仔還吂知（毋知）。","example":""},{"word":"毒心","pinyin":"tug ximˊ","def":"狠心。 例如：實在還毒心，恁仔个壞事佢乜敢做。","example":""},{"word":"吞毋落胲（食毋落胲）","pinyin":"tunˊ mˇ log goiˊ (siid mˇ log goiˊ)","def":"嚥不下去。 例如：這餅仔恁燥，無傍茶吞毋落胲（食毋落胲）。 例如：這糖仔比參仔還較（過）貴，𠊎吞毋落胲（食毋落胲）唷。","example":""},{"word":"死鹹","pinyin":"xiˋ hamˇ","def":"極鹹而無其他味道調和。 例如：這盤菜仰煮到恁死鹹，落嘴就毋得。","example":""},{"word":"惜入心","pinyin":"xiagˋ ngib ximˊ","def":"疼愛到心坎裡。 例如：爺哀惜子惜入心，這就係天下父母心。","example":""},{"word":"心焦","pinyin":"ximˊ zeuˊ","def":"因思念而焦慮不安。 例如：離開屋下幾下日，無看著親人，就會心焦。","example":""},{"word":"心神毋定","pinyin":"ximˊ siinˇ mˇ tin","def":"心思精神無法專注，顯得不安穩、不安定。 例如：佢這下心神毋定，最好莫分佢駛車（車仔），驚怕會出事情。","example":""},{"word":"想去想轉（想來想去）","pinyin":"xiongˋ hi xiongˋ zonˋ (xiongˋ loiˇ xiongˋ hi)","def":"反覆思量、想了又想。 例如：這件事情，𠊎想去想轉，總感覺毋妥當，還係莫做好吔。","example":""},{"word":"想空想缺（想空想榫）","pinyin":"xiongˋ kungˊ xiongˋ kiedˋ (xiongˋ kungˊ xiongˋ sunˋ)【xiongˋ kungˊ xiongˋ kiadˋ】","def":"用心想計謀。 例如：做人愛光明正大，毋好總係想空想缺想愛謀人。","example":""},{"word":"朝思夜想","pinyin":"zeuˊ siiˊ ia xiongˋ","def":"朝思暮想。 例如：阿明牯朝思夜想在外國个女朋友，可見兩儕（兩個人）感情當（蓋）深。","example":""},{"word":"半條命","pinyin":"ban tiauˇ miang","def":"指快要沒命。 例如：這種頭路个事恁重，日做夜做，做到（做啊）伸半條命。","example":""},{"word":"渴渴","pinyin":"hodˋ hodˋ","def":"指人畜極度口渴。 例如：熱天做事做到（做啊）渴渴該下，毋好隨啉水，驚會縮著。","example":""},{"word":"戇神戇神","pinyin":"ngong siinˇ ngong siinˇ","def":"神情呆滯。 例如：阿旺伯上擺車禍以後，怕係有傷著腦，這下歸個人看起來戇神戇神。","example":""},{"word":"小項下","pinyin":"seuˋ hong ha","def":"小件事物。 例如：這間清潔公司當（蓋）用心，連小項下个東西都清到（清啊）淨淨俐俐。","example":""},{"word":"大項下","pinyin":"tai hong ha","def":"泛指大件物品或重要的事項。 例如：恁多微毛末節做毋去，做大項下就好。","example":""},{"word":"挨著","pinyin":"aiˊ doˋ","def":"觸犯。 例如：佢斯青面鳥，莫挨著佢就有較（過）贏。","example":""},{"word":"拗花","pinyin":"auˋ faˊ","def":"採摘花朵。 例如：佢分人看著，走落公園肚拗花。","example":""},{"word":"拗腰","pinyin":"auˋ ieuˊ","def":"身體向後彎腰。 例如：細人仔異（盡）會拗腰，背佢該下愛特別細義。","example":""},{"word":"拗牛眼","pinyin":"auˋ ngiuˇ ngienˋ【auˋ ngiuˇ ngianˋ】","def":"採摘龍眼。 例如：跋上樹尾頂拗牛眼當（蓋）危險。","example":""},{"word":"拗斷（拗斷截）","pinyin":"auˋ tonˊ (auˋ tonˊ jiedˋ)","def":"把東西折斷。 例如：竹杈仔愛先拗斷，正做得縈草結。","example":""},{"word":"把等（攔等）","pinyin":"baˋ denˋ (lanˇ denˋ)","def":"阻攔著。 例如：你在門項把等，莫分人入來。","example":""},{"word":"巴等","pinyin":"baˊ denˋ","def":"攀附著物體。 例如：天時恁熱歸身仔汗，莫緊巴等人个背囊！","example":""},{"word":"跋","pinyin":"bagˋ","def":"爬起來或攀爬。 例如：老弟對眠床跋䟘起來，就在梯排項跋上跋下。","example":""},{"word":"擘開析","pinyin":"bagˋ koiˊ sagˋ","def":"剝開成兩片。 例如：番豆擘開析，裡背有幾下粒番豆仁。","example":""},{"word":"擘嘴角","pinyin":"bagˋ zoi gogˋ","def":"用拇指和食指把人的嘴巴用力拉開，指懲罰亂說話的人。 例如：你莫亂講話，會分人擘嘴角。","example":""},{"word":"逼著","pinyin":"bedˋ doˋ","def":"受到強迫。 例如：佢分債務逼著，走無路去。","example":""},{"word":"凴著","pinyin":"ben doˋ","def":"輕微碰觸到。 例如：兩臺車仔相閃車，毋堵好凴著。 例如：這鑊仔燒燒，你斯愛細義，莫凴著哦！","example":""},{"word":"泌","pinyin":"bi【mi】","def":"將固體攔住，讓液體由細縫間流走或濾掉。 例如：煮飯該下，洗米个米汁水泌起來，做得淋花。","example":""},{"word":"泌燥來","pinyin":"bi zauˊ loiˇ【mi zauˊ loiˇ】","def":"將水分瀝乾。 例如：香菇浸好，水泌燥來，等下切切啊來𤐙香料。","example":""},{"word":"比手畫腳","pinyin":"biˋ suˋ vag giogˋ","def":"比手畫腳。 例如：佢兩儕（個人）講个話無共樣，比手畫腳，也做得溝通。","example":""},{"word":"拚事","pinyin":"biang se【bia se】","def":"趕工。 例如：老弟暑假作業有閒毋寫，等到愛開學正在該拚事。","example":""},{"word":"抨啊去","pinyin":"biangˊ a hi","def":"用手掌劈擊。 例如：佢同人相打，分人抨啊去，面項一搭紅紅个巴掌印。","example":""},{"word":"抨巴掌","pinyin":"biangˊ baˊ zongˋ","def":"賞耳光，用手掌搧打人的臉部。 例如：佢分人抨巴掌，開聲大噭。","example":""},{"word":"抨忒【抨核】","pinyin":"biangˊ tedˋ【biangˊ hedˋ】","def":"丟掉。 例如：這粒柑仔綿忒哩（綿核吔），愛抨忒（抨核）抑係拿來做肥料？","example":""},{"word":"撆","pinyin":"bied","def":"用手掌輕輕拍打，接觸面比較小。 例如：頭擺个細人仔係做毋著會分阿爸撆屎胐處罰。","example":""},{"word":"掊開","pinyin":"boiˊ koiˊ","def":"用手或腳撥開物品。 例如：地泥項恁多東西，掊開來就尋得著哩（吔）！","example":""},{"word":"抔","pinyin":"budˋ","def":"用雙手捧取；盛裝。 例如：禾埕掃掃啊，愛記得同垃圾抔抔起來。","example":""},{"word":"捧","pinyin":"bungˋ","def":"以雙手承舉物品。例如「捧水食」。","example":""},{"word":"掣","pinyin":"cadˋ","def":"抽動、顫抖，例如「掣一下」、「痛到緊掣」。","example":""},{"word":"掣著【電著】","pinyin":"cad doˋ【tien doˋ】","def":"觸電，例「分電掣著（電著）」。","example":""},{"word":"參著","pinyin":"camˊ doˋ","def":"跌倒時手著地受傷。 例如：阿義个手目毋堵好參著，嗄㪐腕，實在還衰喲。","example":""},{"word":"綻","pinyin":"can","def":"破損、裂開；引申有植物冒出頭、生長之義。 例如：老弟騎自行車跌倒（橫倒），跌到（橫到）皮都綻開來。 例如：這草仔當（蓋）會綻，種落去（下去）幾日仔就綻到一哪仔就係。","example":""},{"word":"剷","pinyin":"canˋ","def":"以鏟子、圓鍬或鋤頭等割除或削平。 例如：耕圃園，草愛先剷淨，地愛先剷平，正做得種瓜豆。","example":""},{"word":"躁躁轉","pinyin":"cau cau zonˋ","def":"像無頭蒼蠅一樣繁忙，躁動不安、心緒不寧，不知道在忙什麼；亦可說「躁往轉」。 例如：歸日仔躁躁轉，到底在該無閒麼个？","example":""},{"word":"呻生呻死","pinyin":"cenˊ sangˊ cenˊ xiˋ","def":"唉聲嘆氣、長吁短嘆。 例如：你遽啊去尋正當个頭路來做，毋好歸日仔呻生呻死呻無錢。","example":""},{"word":"直直落【直直入】","pinyin":"ciid ciid log【ciid ciid ngib】","def":"直入。 例如：你直直落（直直入），行到底過後斡右手片，就係厥間房。","example":""},{"word":"坐在角角","pinyin":"coˊ do gogˋ gogˋ","def":"坐到角落或是最裡面的地方。「坐在脣脣」則為坐在邊邊之意。 例如：見擺上音樂課，阿偉就坐在角角，怕係驚先生點佢唱歌仔。","example":""},{"word":"踔","pinyin":"cogˋ","def":"用腳掌踢動、推。例如「同石頭踔走」、「同球仔踔過去」。","example":""},{"word":"亍上亍下","pinyin":"cogˋ songˊ cogˋ haˊ","def":"沒有目的地閒逛。 例如：佢日日就在街項亍上亍下，難怪尋無頭路。","example":""},{"word":"穿空","pinyin":"conˊ kungˊ【con kangˊ】","def":"穿洞、鑽洞。 例如：紙限勢恁薄又裝溼，難怪輕輕仔一揰就穿空哩（吔）。","example":""},{"word":"抽聲胲","pinyin":"cuˊ sangˊ goiˊ","def":"大聲哭叫。 例如：老弟噭歸半點鐘吔，還在該抽聲胲。","example":""},{"word":"捽屎胐","pinyin":"cud sii vudˋ【cud sii fudˋ】","def":"擦屁股，引申為收拾殘局。 例如：屎屙好愛捽屎胐。 例如：頭家走路，愛手腳下同佢𢯭捽屎胐，正經有罅見笑哪。","example":""},{"word":"捽嘴","pinyin":"cud zoi","def":"擦拭嘴巴，引申為湮滅證據。 例如：食東西過後愛捽嘴正衛生。","example":""},{"word":"捶背囊","pinyin":"cuiˇ boi nongˇ","def":"搥背。 例如：背囊小可痠軟，係講有人𢯭捶背囊，毋知有幾好仔！","example":""},{"word":"打底","pinyin":"daˋ daiˋ","def":"奠基、墊底；觸及底層。 例如：啉酒以前，食兜仔東西先打底正毋會恁遽醉。 例如：萬丈深潭難打底，毋知哥哥哪樣心。（山）","example":""},{"word":"打老鼠","pinyin":"daˋ lo cuˋ【daˋ no cuˋ】","def":"捉老鼠。例「貓仔當（蓋）會打老鼠」。","example":""},{"word":"打赤腳","pinyin":"daˋ cagˋ giogˋ","def":"打赤腳。「打赤膊」則為「上身裸露」。 例如：蹶山（跋山）愛著鞋，毋好打赤腳。","example":""},{"word":"打觔斗","pinyin":"daˋ kin deuˋ【daˋ gin deuˋ】","def":"翻跟斗。 例如：細人仔較（過）軟身，想學會打觔斗毋會難。","example":""},{"word":"打彳亍","pinyin":"daˋ qidˋ cogˋ","def":"遊蕩閒逛。 例如：後生人毋做頭路，歸日仔打彳亍，仰會有出息？","example":""},{"word":"打走","pinyin":"daˋ zeuˋ","def":"因水勢過大而沖走東西。 例如：落恁大雨，毋好去河脣搞，分水打走斯無結無煞。","example":""},{"word":"搭手（拍手）","pinyin":"dab suˋ (pogˋ suˋ)","def":"拍手。 例如：大家搭手（拍手）歡迎新同學。","example":""},{"word":"釘","pinyin":"dangˊ","def":"以釘、針貫穿物體。 例如：這兩本書先分開來釘，過來正釘共下。","example":""},{"word":"著著【膏著】","pinyin":"dauˇ doˋ【goˇ doˋ】","def":"沾染到糊狀物。 例如：壞哩（吔）！白衫著著（膏著）豆油，洗毋淨吔哪！","example":""},{"word":"擲拶來","pinyin":"deb zad loiˇ","def":"將容器中穀物、砂石之類的物品，用力上下擲地，使它緊密。 例如：茶袋肚个茶青擲拶來，還做得裝加兜仔入去。","example":""},{"word":"蹬","pinyin":"demˋ","def":"用腳踩踏或踹踢。 例如：這隻細人仔起性吔，兩支腳緊蹬地泥，還走去蹬門又蹬人。","example":""},{"word":"蹬被【踢被】","pinyin":"demˋ piˊ【tedˋ piˊ】","def":"睡覺時踢被子。 例如：佢睡目會蹬被（踢被），故所長間（不時）寒著（凍著）。","example":""},{"word":"沾水","pinyin":"demˊ suiˋ","def":"將盛著熱食的容器浸於水中，加以冷卻。 例如：正煮好个粥，沾水會較（過）遽冷。","example":""},{"word":"扚耳公","pinyin":"diag ngiˋ gungˊ","def":"用手指彈耳朵。 例如：寒天時分人扚耳公，試著（測著）加異（盡）痛。","example":""},{"word":"扚算盤","pinyin":"diag son panˇ","def":"用手指撥打算盤，引申為算計。 例如：阿欽叔異（盡）會算，無論大小事情佢就會先扚算盤，看算得和無。","example":""},{"word":"扚電火","pinyin":"diag tien foˋ","def":"撥動電燈開關。 例如：扚電火，一般人會用手指去撳。","example":""},{"word":"𫟧","pinyin":"dinˊ","def":"繞行。 例如：𫣆兜（𠊎等）來搞𫟧圓圈仔，看麼人𫟧較（過）多圈。","example":""},{"word":"倒頭椊","pinyin":"do teuˇ zud","def":"頭下腳上的栽下去；亦作「倒頭墜」。 例如：毋好企恁脣翕相，毋堵好倒頭椊就壞蹄哩（吔）！","example":""},{"word":"倒頭種","pinyin":"do teuˇ zung","def":"倒立的靜止狀態；頭下腳上栽下去。 例如：佢對樓頂倒頭種跌下來，異（盡）傷重。","example":""},{"word":"剁圈","pinyin":"dog kienˊ【dog kianˊ】","def":"剁成扁圓柱狀，常用於豬腳。 例如：豬腳剁圈煲湯，你有食過無？","example":""},{"word":"哆（咄）","pinyin":"doiˇ (dodˋ)","def":"斥責。 例如：佢做毋著事情，故所分人哆。","example":""},{"word":"對拗","pinyin":"dui auˋ","def":"從中間折成兩截，使兩截相等。 例如：佢同索仔糖對拗，一截請𠊎食。","example":""},{"word":"頓著","pinyin":"dun doˋ","def":"受外力大力撞擊。 例如：佢分人頓著，嗄內傷，煞煞（共快）去分先生看。","example":""},{"word":"𠖄等","pinyin":"dungˊ denˋ","def":"由上往下覆蓋、蒙著。 例如：日頭恁烈，頭那係𠖄等大手帕，就較（過）毋驚晒哩（吔）。","example":""},{"word":"揞面","pinyin":"emˊ mien","def":"掩面，另掩嘴即為「揞嘴」。 例如：淨用手來揞面，較（過）揞乜還有縫仔。","example":""},{"word":"壞看相","pinyin":"faiˋ kon xiong","def":"動作不雅，或行為不適宜，呈現出來的樣子很難看；亦可說「毋好看相」。 例如：人客吂（還無）食，細人仔就先挾，實在壞看相。","example":""},{"word":"拂","pinyin":"fid","def":"搖動、揮擺。 例如：該隻細牛子緊行緊拂尾，一條細細个尾拂啊拂仔異（盡）生趣。","example":""},{"word":"拂釣梹","pinyin":"fid diau binˊ","def":"甩釣竿。 例如：佢當（蓋）會拂釣梹，一拂，蠶絲線（蠶金線）就㩆幾下丈遠。","example":""},{"word":"拂手","pinyin":"fin suˋ","def":"甩手。 例如：厥手分電掣著（電著），痛到緊拂手。","example":""},{"word":"拂頭","pinyin":"fin teuˇ","def":"搖頭，甩頭。 例如：佢毋好食生个東西，見湊（邀）佢去食魚生，佢就拂頭。","example":""},{"word":"赴時間","pinyin":"fu siiˇ gienˊ【fu siiˇ gianˊ】","def":"趕時間。 例如：這下愛赴時間，你行較（過）遽兜仔（一息）好無？","example":""},{"word":"㧾","pinyin":"fud","def":"廣義的打，指動作很快，不限定工具。 例如：額頭分人拿棍仔㧾著，黏時腫起來。","example":""},{"word":"咈","pinyin":"fud","def":"吃（俚俗的說法）。 例如：佢肚當飢（蓋肚飢），兜著飯就盡命牯咈。","example":""},{"word":"架腳","pinyin":"ga giogˋ","def":"把腳架起。 例如：佢兜凳仔架腳看電視。","example":""},{"word":"加等","pinyin":"gaˊ denˋ【gaˇ denˋ】","def":"披著；以手搭人肩上。 例如：轉寒哩（吔）！這領衫加等，正毋會寒著（凍著）。 例如：若手莫在吾（𠊎个）肩頭加等啦，當（盡）難做事。","example":""},{"word":"呷","pinyin":"gab","def":"張口急咬，「呷著」即指咬到。 例如：這隻狗仔毋知幾久無食東西，看著烏蠅也在該緊呷。","example":""},{"word":"合分佢","pinyin":"gagˋ bunˊ giˇ","def":"附贈、附送給他。 例如：佢一到就買幾下雙球鞋，頭家拿兩雙襪仔合分佢。","example":""},{"word":"減兜去【減一息去】","pinyin":"gamˋ deuˊ hi【gamˋ idˋ xidˋ hi】","def":"分一些過去。 例如：若飯添到（添啊）忒多，碗拿來，𠊎減兜去（減一息去）。","example":""},{"word":"哽著","pinyin":"gangˋ doˋ","def":"噎到。 例如：食忒遽，分卵黃哽著敨氣毋出，差一息仔就哽死。","example":""},{"word":"絞","pinyin":"gauˋ","def":"將細長物扭緊。 例如：搭瓠棚絞鉛線仔愛絞緪來，正毋會分風掀忒（掀核）。","example":""},{"word":"攪","pinyin":"gauˋ","def":"攪動。 例如：用風車攪穀。 例如：衫褲洗好，拿去脫水機攪攪啊，晾較（過）遽燥。","example":""},{"word":"鋸","pinyin":"gi","def":"鋸；工具即為「鋸仔」。 例如：鋸仔做得鋸竹仔同樹枋仔。","example":""},{"word":"嘰嘰滾","pinyin":"gi gi gunˋ","def":"受到驚嚇或恐懼而發出高而尖的聲音。 例如：厥孫女吂（毋曾）滿五歲，見看著壁蛇（壁蛇仔）都嚇到（嚇啊）嘰嘰滾。","example":""},{"word":"寄雨【庰雨（救雨）】","pinyin":"gi iˋ【biang iˋ (giu iˋ)】","def":"避雨。 例如：好恬恬拚（落）大雨，店亭下當（蓋）多人寄雨（庰雨）。","example":""},{"word":"挾去挾轉","pinyin":"giabˋ hi giabˋ zonˋ","def":"挾過來挾過去。 例如：該雞髀毋好挾去挾轉，食忒（食核）就好。","example":""},{"word":"兼身","pinyin":"giamˊ siinˊ","def":"身體靠近。 例如：六月火囪，兼身毋得。（諺）","example":""},{"word":"結","pinyin":"giedˋ【giadˋ】","def":"佩帶。例如「頭那頂（項）結一蕊花」。","example":""},{"word":"弇密密（弇塞塞）","pinyin":"giemˇ miˊ miˊ (giemˇ sedˋ sedˋ)","def":"蓋得密不透風。 例如：歸暗晡蚊仔在耳公脣飛來飛去，佢將就同被骨弇密密，正睡得。","example":""},{"word":"加添","pinyin":"gaˊ tiamˊ","def":"添加、增加。 例如：一張桌先放兩罐酒，毋罅正加添。","example":""},{"word":"逐走","pinyin":"giugˋ zeuˋ","def":"趕走、驅趕。 例如：烏蠅當（蓋）得人惱，遽啊逐走佢。","example":""},{"word":"拱起來","pinyin":"giungˋ hiˋ loiˇ","def":"拱起來，例如「背囊拱起來」。","example":""},{"word":"弓闊","pinyin":"giungˊ fadˋ","def":"由內向外使力，使之加寬。 例如：這箱仔弓闊兜仔（一息），裝得較（過）多東西。","example":""},{"word":"𢼛門（搉門）","pinyin":"gog munˇ (kog munˇ)","def":"敲門。 例如：係愛落人个間房，愛先𢼛門。","example":""},{"word":"𢼛頭那","pinyin":"gog teuˇ naˇ","def":"敲頭。 例如：佢忒毋聽講，正會分厥爸𢼛頭那。","example":""},{"word":"擱等","pinyin":"gogˋ denˋ","def":"擋著。 例如：用柵仔擱等，雞仔正毋會飆出來。","example":""},{"word":"合等","pinyin":"hab denˋ","def":"合上、蓋上。 例如：愛考試吔，課本通通（總概）合等，放入書包肚（裡背）。","example":""},{"word":"合轉去","pinyin":"hab zonˋ hi","def":"合回去、套回去、蓋回去。 例如：齋菜裝好，該蓋仔愛合轉去，正毋會壞忒（壞核）。","example":""},{"word":"含等","pinyin":"hamˇ/hemˇ denˋ","def":"放在嘴巴裡含著。 例如：佢含等糖仔緊講話，口涎水緊噴，還無衛生哦！","example":""},{"word":"行往上【行上上】","pinyin":"hangˇ gongˊ songˊ【hangˇ songˊ songˊ】","def":"往上走。「行往下（行下下）」為往下走。 例如：愛去雜貨店，對這行往上（行上上），就會到哩（吔）！","example":""},{"word":"行往走","pinyin":"hangˇ gongˊ zeuˋ","def":"躲開，往他處走。 例如：該狗仔看著人同棍仔擎起來，黏時行往走。","example":""},{"word":"行開","pinyin":"hangˇ koiˊ","def":"走開、離開。 例如：這湯當（蓋）燒，你行開兜仔，正毋會熝著。 例如：阿英行開一下仔定定，厥倈仔就噭到（噭啊）大嫲聲。","example":""},{"word":"行毋兼","pinyin":"hangˇ mˇ giamˊ","def":"無法靠近。 例如：該狗仔當（盡）惡，麼人都行毋兼。","example":""},{"word":"打倒𢫦","pinyin":"daˋ do mag","def":"身體向後仰倒下，頭部著地，亦可說「打往𢫦、倒頭𢫦」。 例如：凳仔毋好恁仔坐，等下（等一下）毋堵好係打倒𢫦，頭那就會𢫦著。","example":""},{"word":"起波","pinyin":"hiˋ poˊ","def":"起水泡；起泡沫。 例如：水愛對高高个所在沖往下，正會起波。","example":""},{"word":"掞","pinyin":"iam","def":"以上下抖動的方式撒細碎物。 例如：石灰掞路，打白行。（諺）","example":""},{"word":"弛胸㪐胛","pinyin":"ieˊ hiungˊ ludˋ gabˋ","def":"衣服穿得袒胸露肩。 例如：佢弛胸㪐胛打赤膊，看著人來正遽遽（共快）拿衫來著。","example":""},{"word":"𢼛菸屎","pinyin":"gog ienˊ siiˋ【gog ianˊ siiˋ】","def":"輕敲菸斗或紙菸條使菸灰掉落。 例如：毋好在這𢼛菸屎，去垃圾桶該片𢼛。","example":""},{"word":"印著","pinyin":"in doˋ","def":"受小硬物頂觸。 例如：運動坪个細石仔乜愛拈淨來，莫害打赤腳運動个人印著。","example":""},{"word":"窿落去【窿入去】","pinyin":"lungˇ log hi【lungˇ ngib hi】","def":"伸進洞內、或把柴火送進爐灶裡。 例如：草結先窿落去（窿入去），等火較猛（過烈）兜仔，竹笐（竹筒）正窿落去（窿入去）。","example":""},{"word":"嘖嘖滾","pinyin":"jid jid gunˋ","def":"緊閉嘴巴再迅速張開，發出嘖嘖的聲音，表達讚嘆之意。 例如：佢考一百分，先生當下嘖嘖滾，阿腦（說）佢恁慶（登真）。","example":""},{"word":"揤","pinyin":"jidˋ","def":"用手指或棍棒等擠壓。 例如：將半燥濕个鹹菜揤入盎仔肚，倒覆放就會變覆菜。","example":""},{"word":"箭","pinyin":"jien","def":"使勁地蹬。 例如：箭自行車。 例如：出力箭。 例如：這崎恁嶇，你斯愛盡力牯箭。","example":""},{"word":"濾水","pinyin":"li suiˋ","def":"把水分過濾掉，可以用在濾粄、濾豆腐。 例如：鹹菜對醃缸肚撈出來个時節，愛先濾水一下。","example":""},{"word":"喫【咬】","pinyin":"kie【ngauˊ】","def":"啃、咬。例如「喫（咬）甘蔗」。","example":""},{"word":"蹶崎（跋崎）","pinyin":"kied gia (bagˋ gia)【kiad gia】","def":"爬坡。 例如：阿爸个車仔無力，蹶崎毋上。","example":""},{"word":"桊耳","pinyin":"kien ngiˋ【kian ngiˋ】","def":"穿耳洞。 例如：阿婆後生時節就有桊耳，異（盡）跈得著時行。","example":""},{"word":"箍圓圈仔","pinyin":"kieuˊ ienˇ kienˊ eˋ【kieuˊ ianˇ kianˊ eˋ】","def":"畫圈圈。 例如：佢在書裡背，箍圓圈仔準暗號。","example":""},{"word":"靠著","pinyin":"ko doˋ","def":"挨近而磨擦到。 例如：這箱蓮霧（蒜果）靠著吔，該載（好在）無綿忒（綿核），阿姆講愛先洗來食。","example":""},{"word":"𨃰","pinyin":"kiam","def":"跨越，例如「𨃰過去」即跨越過去，「𨃰戶檻」即跨過門檻。 例如：過人个家門，毋好踏人个戶檻，愛𨃰過去。","example":""},{"word":"開聲","pinyin":"koiˊ sangˊ","def":"放開聲帶發出聲音。「開聲噭」則表放聲大哭。 例如：便所裡背怕有人，吂（毋曾）入去愛先開聲。","example":""},{"word":"看真真","pinyin":"kon ziinˊ ziinˊ","def":"看得清清楚楚。 例如：車仔就係佢偷駛走个，𠊎看真真，絕對毋會認差。","example":""},{"word":"寬容笑面","pinyin":"konˊ iungˇ seu mien","def":"笑容滿面。 例如：阿爸聽講老弟考著理想个學校，寬容笑面，暢到耐毋得。","example":""},{"word":"擐皮包仔","pinyin":"kuan piˇ bauˊ eˋ","def":"原意指提皮包，後引申為替人服務的跟班者。 例如：做人个秘書，愛同頭家擐皮包仔。","example":""},{"word":"環毋過","pinyin":"kuanˊ mˇ go","def":"轉不過去，有周轉不靈的意思。 例如：莫起恁多隻（個）會仔，細人仔讀書當（正）愛用錢，強強（驚怕）會環毋過吔！","example":""},{"word":"罅罅啊","pinyin":"la la aˋ","def":"攪一攪。 例如：阿輝比猴精較（過）精，看佢無異（盡）煞猛，儘採罅罅啊食著就有吔。","example":""},{"word":"𠠝","pinyin":"lag","def":"一刀直線割開。 例如：恁大張个紙仔（紙），對中𠠝開來，愛細義。","example":""},{"word":"濫著（漯著）","pinyin":"lam doˋ (labˋ doˋ)","def":"陷入泥淖裡。 例如：落大雨崩山屙石，害車仔濫著，停動毋得。","example":""},{"word":"攔毋核","pinyin":"lanˇ mˇ hed","def":"攔不住。 例如：佢決心想辭頭路，麼人乜攔毋核。","example":""},{"word":"摟袋仔","pinyin":"leuˇ toi eˋ","def":"掏口袋。 例如：愛結數吔，摟袋仔正知無帶半銑錢（半尖錢）。","example":""},{"word":"撩起來","pinyin":"liauˊ hiˋ loiˇ","def":"用鏟具鏟取。 例如：魚仔煎好吔，遽啊撩起來。","example":""},{"word":"捋牛乳","pinyin":"lod ngiuˇ nen","def":"擠牛奶。 例如：在牧場做事，逐（每）日愛跍等捋牛乳，盡辛苦。","example":""},{"word":"摝勻","pinyin":"lugˋ iunˇ","def":"攪拌均勻。 例如：這牛乳粉愛摝勻正做得，毋好分佢結矻仔。","example":""},{"word":"擂","pinyin":"luiˇ","def":"磨碎或揉擦。 例如：店員一隻手擂擂茶，一隻手擂目珠，異（盡）無衛生。","example":""},{"word":"擂綿","pinyin":"luiˇ mienˇ","def":"磨爛。 例如：想愛食擂茶，愛先同材料放落（放入）擂缽，用樹棍仔去擂綿。","example":""},{"word":"抹鬚","pinyin":"madˋ xiˊ","def":"以手指撫摸鬍鬚，引申為悠閒自在的樣子。 例如：愛有錢有閒，正有抹鬚過日个可能。","example":""},{"word":"抿等嘴","pinyin":"manˇ denˋ zoi","def":"抿著嘴。 例如：翕相時節愛有笑面，毋好緊抿等嘴。","example":""},{"word":"搣壞壞","pinyin":"medˋ fai fai【miedˋ fai fai】","def":"把事情弄得一團糟。 例如：佢當（蓋）無耐性，事情交代佢，全搣壞壞。","example":""},{"word":"汨水（沒汨洎）【沒洎汨】","pinyin":"mi suiˋ (mud mi qi)【mud qi mi】","def":"憋氣把臉沒入水中。 例如：泅水愛先學汨水（沒洎汨），汨水（沒洎汨）毋好勢就會食著水。","example":""},{"word":"尾瀉屎","pinyin":"miˊ xia siiˋ","def":"形容被嚇得屁滾尿流而跑得飛快。 例如：阿如當（蓋）驚狗仔，遠遠看啊著，就走到尾瀉屎。","example":""},{"word":"蒙","pinyin":"miangˊ【mangˊ】","def":"以革布之類的軟物遮蓋。 例如：會落雨哩（吔）！遽遽（共快）摎（同）禾埕个穀耙歸堆，用塑膠布仔蒙起來。","example":""},{"word":"無好食","pinyin":"moˇ hoˋ siid","def":"沒得吃。反義為「有好食」，此句式亦可插入名詞，如「無飯好食」、「無電視好看」、「無錢好使」、「無車仔好駛」。 例如：該儕（該）人毋知係無好食抑仰仔，正會瘦到（瘦啊）像支竹篙樣仔。","example":""},{"word":"無懼著","pinyin":"moˇ kiˋ doˋ","def":"不懾於人的威勢。 例如：阿叔完全無懼著該兜惡豺豺仔个鱸鰻仔（鱸鰻頭），同佢兜（佢等）論理。","example":""},{"word":"沒水","pinyin":"mud suiˋ","def":"水中閉氣。 例如：想學會泅水，愛先學沒水。","example":""},{"word":"目汁含等","pinyin":"mugˋ ziibˋ hamˇ denˋ","def":"含淚。 例如：𠊎目汁含等，毋敢噭出來。","example":""},{"word":"目汁濫泔【目汁湳串】","pinyin":"mugˋ ziibˋ lamˇ gamˊ/gam【mugˋ ziibˋ namˇ con】","def":"淚流滿面的樣子。 例如：佢噭到目汁濫泔（目汁湳串），看著斯異（盡）毋盼得。","example":""},{"word":"㖸","pinyin":"nagˋ","def":"大笑。 例如：佢逐擺（每擺）講笑科，脣項（脣口）个人都㖸到大嫲聲。","example":""},{"word":"躪","pinyin":"nang","def":"踩踏，例如「躪等」即踩著。 例如：恁靚个草坪，毋好落去（入去）躪。","example":""},{"word":"撓人【肢人】","pinyin":"neuˊ nginˇ【ji nginˇ】","def":"搔人家癢；以甜言蜜語引誘人。 例如：佢緊撓人（肢人），害人笑到（㖸到）毋會轉氣（敨氣毋過）。 例如：詐騙集團盡會撓人（肢人），大家定著愛提高警覺，莫分佢兜（佢等）拐走。","example":""},{"word":"耐毋過","pinyin":"ngai mˇ go","def":"撐不過。 例如：看佢身體恁仔，怕耐毋過今年。","example":""},{"word":"頷頭","pinyin":"ngamˋ teuˇ","def":"點頭，即「頷首」，表首肯。 例如：這學生仔，見看著先生，就會頷頭行禮。","example":""},{"word":"研粉（研末）","pinyin":"nganˊ funˋ (nganˊ mad)","def":"研磨成粉。 例如：驚老人家食藥仔會哽著，先研粉正分佢食。","example":""},{"word":"𢳆走","pinyin":"ngau zeuˋ","def":"轉向，另有故意躲開或不屑之意思。 例如：佢兩儕（個人）打逆面，看著對方，頭那就𢳆走。","example":""},{"word":"𢳆轉來","pinyin":"ngau zonˋ loiˇ","def":"轉向過來。 例如：天時恁熱，請同電扇𢳆轉來。","example":""},{"word":"𥍉","pinyin":"ngiabˋ","def":"閃爍或眨眼。 例如：細阿哥仔臥頭看天頂一𥍉一𥍉个星仔，看到無𥍉目。","example":""},{"word":"攝","pinyin":"ngiabˋ","def":"包起或捲起。 例如：過河壩水，褲腳愛攝起來，正毋會浸濕。","example":""},{"word":"攝衫袖","pinyin":"ngiabˋ samˊ qiu","def":"捲起衣袖，相近的動作如「攝褲腳」即捲起褲管。 例如：水缸肚撈東西，愛先攝衫袖正做得。","example":""},{"word":"染","pinyin":"ngiam","def":"染，如「染頭那毛」、「染紅卵」。","example":""},{"word":"拈忒去【拈核去】","pinyin":"ngiamˊ tedˋ hi【ngiamˊ hedˋ hi】","def":"撿出來丟掉。 例如：禾埕項晒穀，係有看著細石頭就順續拈忒去（拈核去）。","example":""},{"word":"撚","pinyin":"ngienˋ【ngianˋ】","def":"以手按握或擠壓。 例如：撚牙膏毋好像撚拳頭嫲（拳頭）樣恁大力，會撚爆忒（爆核）。","example":""},{"word":"虐人","pinyin":"ngiogˋ nginˇ","def":"扎刺人。 例如：虐毛蟲个毛會虐人，愛細義毋好分佢蜒著。","example":""},{"word":"扭腳髀","pinyin":"ngiuˋ giogˋ biˋ","def":"擰大腿。 例如：腳髀肉嫩嫩，故所扭腳髀會當（蓋）痛。","example":""},{"word":"蹂綿","pinyin":"noˇ mienˇ","def":"以腳踩爛。 例如：泥團愛用腳蹂綿，正會散忒（散核）。","example":""},{"word":"弄等來","pinyin":"nung denˋ loiˇ","def":"大搖大擺的不請自來。 例如：人無按算請佢，佢自家弄等來，還緊嫌菜毋好食，當（盡）得人惱。","example":""},{"word":"弄弄仔行","pinyin":"nungˋ nungˋ eˇ hangˇ【nungˋ nungˋ eˊ hangˇ】","def":"逕自走。 例如：打早就看佢頭磬磬弄弄仔行，毋知愛去哪。","example":""},{"word":"噥","pinyin":"nungˇ","def":"不自覺地喃喃自語、說個不停。 例如：後生人最驚老人家噥。","example":""},{"word":"逛街【亍街】","pinyin":"ongˇ gieˊ【cogˋ giaiˊ】","def":"閒步街頭、逛街。 例如：拜六暗晡出來逛街（亍街）个人特別多。","example":""},{"word":"撥塵灰","pinyin":"pad ciinˇ foiˊ","def":"拍去灰塵。 例如：佢當在該撥塵灰，毋好偎忒兼。","example":""},{"word":"撥蚊仔","pinyin":"pad munˊ eˋ","def":"揮趕蚊子。 例如：你先去撥蚊仔，係無撥揫，透夜仔都難睡。","example":""},{"word":"撥淨來","pinyin":"pad qiang loiˇ","def":"拍打物體上的塵埃，使其潔淨。 例如：布仔久無用，愛先撥淨來，正用得。","example":""},{"word":"撥火","pinyin":"padˋ foˋ","def":"搧火。 例如：風爐火，係堵著斷點風，定著愛撥火正會猛（烈）。","example":""},{"word":"撥涼","pinyin":"padˋ liongˇ","def":"搧涼。 例如：緊吹冷氣緊擎葵扇來撥涼，試著加異（盡）涼哩（吔）。","example":""},{"word":"拌","pinyin":"panˊ","def":"用東西鞭打或摔打。 例如：阿圳牯當晝偷走去河壩搞水，轉來（歸來）分厥爸拌。","example":""},{"word":"拌倒","pinyin":"panˊ doˋ","def":"摔倒。 例如：地泥滑滑，會害人拌倒。","example":""},{"word":"嗙風","pinyin":"pangˊ fungˊ","def":"吹氣、打氣。 例如：若車輪仔摸起來無風，愛嗙風哩（吔）！","example":""},{"word":"棚目鏡","pinyin":"pangˇ mugˋ giang","def":"戴眼鏡。 例如：正讀幼稚園就學人棚目鏡，係毋係看電視看忒多？","example":""},{"word":"呸口涎","pinyin":"pi heuˋ lanˊ【pui heuˋ lanˊ (pui heuˋ nanˊ)】","def":"吐口水，引申為唾棄。 例如：為著環境衛生，毋好儘採呸口涎。","example":""},{"word":"鼻香","pinyin":"pi hiongˊ","def":"聞香。 例如：目珠大好看光，鼻公大好鼻香。","example":""},{"word":"劈草","pinyin":"piagˋ coˋ","def":"用刀砍除雜草。 例如：草仔生到恁高，愛去劈草。","example":""},{"word":"䠙上䠙下","pinyin":"pongˊ songˊ pongˊ haˊ","def":"來回奔波。 例如：你兩儕（個人）透日共下䠙上䠙下，到底做麼个頭路。","example":""},{"word":"䀯等","pinyin":"pu denˋ","def":"刺探著，偵伺著。 例如：佢囥（庰啊）在門後背䀯等，按算愛捉（扭）賊仔。","example":""},{"word":"天甫光（甫白光）【臨天光】","pinyin":"tienˊ puˋ gongˊ (puˋ pag gongˊ)【limˇ tienˊ gongˊ】","def":"天略微亮。 例如：天甫光（臨天光）定定，阿公就去公園運動。","example":""},{"word":"烳【煲】","pinyin":"puˇ【boˊ】","def":"以慢火烹煮，常用於「烳番薯」、「烳茶」。 例如：見擺人客來，吾姆就喊𠊎去烳（煲）滾水泡茶。","example":""},{"word":"伏等","pinyin":"pug denˋ","def":"趴著。 例如：腰骨痛就去眠床項伏等，一下仔（等一下添）同你貼藥膏。","example":""},{"word":"伏落去【覆下去】","pinyin":"pug log hi【pugˋ haˊ hi】","def":"趴下去。 例如：阿美分樹頭徑著，歸隻（個）人伏落去（覆下去），額頭撞到起瘻。","example":""},{"word":"𠠃","pinyin":"qiamˊ","def":"以尖刀深刺。 例如：頭過㓾豬仔愛用𠠃豬刀對豬仔个蛤蟆胲𠠃落去（入去）。","example":""},{"word":"撨","pinyin":"qiauˇ","def":"推拿、整骨，挪移調整。 例如：佢手骨偏著，去分拳頭師傅撨轉去。","example":""},{"word":"撨位仔","pinyin":"qiauˇ vi eˋ","def":"調整位子，挪出空間。 例如：厥腳行路無方便，做得撨位仔分佢坐無？","example":""},{"word":"亼粄仔","pinyin":"qib banˋ eˇ【qib banˋ eˋ】","def":"搓揉粄團。 例如：愛先亼粄仔，正做得打菜包同雪圓仔（圓粄仔）。","example":""},{"word":"彳彳亍亍","pinyin":"qidˋ qidˋ cogˋ cogˋ","def":"漫無目的的來回走。 例如：該儕（該）人無赴著尾枋車，在車頭彳彳亍亍，無結無煞。","example":""},{"word":"尋無","pinyin":"qimˇ moˇ","def":"找不到。 例如：若條件恁好，仰會到今還尋無對象？","example":""},{"word":"尋食","pinyin":"qimˇ siid","def":"找食物吃。 例如：該兜人豚仔當（蓋）豺，三不二時（三不時）就打冰箱尋食。","example":""},{"word":"尋味","pinyin":"qimˇ mi","def":"探索玩味。例如「食到還會尋味」。","example":""},{"word":"躍","pinyin":"qiogˋ","def":"跳躍，例如「躍上躍下」、「躍往上」。","example":""},{"word":"吮乳","pinyin":"qionˊ nen","def":"吸奶。 例如：恁多隻狗子在該吮乳，狗嫲个乳敢罅？","example":""},{"word":"挱著來","pinyin":"saˊ doˋ loiˇ","def":"抓起來。 例如：遽遽（共快）同該賊仔挱著來，送去坐管仔（坐監）。","example":""},{"word":"挱毋著","pinyin":"saˊ mˇ doˋ","def":"抓不到，引申為摸不著頭緒。 例如：佢走當（盡）遽，你挱毋著佢啦。 例如：佢講話顛顛倒倒，分人挱毋著頭䌈。","example":""},{"word":"徙位","pinyin":"saiˋ vi","def":"移開原來的位子至別處，亦可說「徙走、徙開」。 例如：這臺車仔仰會停在（恬啊在）路徑頭？煞煞（共快）喊車主來徙位。","example":""},{"word":"閃俐俐","pinyin":"samˋ li li","def":"躲得遠遠的。 例如：講著食，大家就尖等來；講著算數，大家斯閃俐俐。","example":""},{"word":"閃走","pinyin":"samˋ zeuˋ","def":"躲開、避開。 例如：佢這禮拜毋知仰仔，看著先生就閃走。","example":""},{"word":"三擇四擇","pinyin":"samˊ tog xi tog","def":"一再挑選。 例如：係愛就煞煞（遽啊）決定，毋好在該三擇四擇。","example":""},{"word":"三叮嚀四吩咐（三叮嚀四囑咐）","pinyin":"samˊ denˊ nenˇ xi funˊ fu (samˊ denˊ nenˇ xi zugˋ fu)","def":"一再的叮囑。 例如：頭一擺出國，阿姆三叮嚀四吩咐，喊𠊎愛好好照顧自家个身體。","example":""},{"word":"三揀四揀","pinyin":"samˊ gienˋ xi gienˋ【samˊ gianˋ xi gianˋ】","def":"挑三揀四。 例如：三揀四揀，揀著一隻賣牛眼；三擇四擇，擇著一隻賣瓠勺。（諺）","example":""},{"word":"搧巴掌","pinyin":"sanˊ baˊ zongˋ","def":"打耳光。 例如：頭擺細人仔係番綻講毋聽，會分爺哀捉（扭）來搧巴掌。","example":""},{"word":"山歌溜天","pinyin":"sanˊ goˊ liuˋ tienˊ","def":"山歌嘹亮，聲音不斷，引申為生活快樂，無憂無慮。 例如：伯公下个老人家逐（每）日開容笑面，山歌溜天，看起來日仔盡好過。","example":""},{"word":"屎胐凸凸【屎胐露露】","pinyin":"sii vudˋ tied tied【sii fudˋ leu leu】","def":"坦露屁股。 例如：厥短褲仔恁細截仔定定，屎胐凸凸（屎胐露露）分人看著哩（吔）。","example":""},{"word":"使筷仔（擎筷仔）","pinyin":"siiˋ kuai eˋ (kiaˇ kuai eˋ)","def":"使用筷子。 例如：佢毋曉得使筷仔，挾毋著菜來食。","example":""},{"word":"食毋得","pinyin":"siid mˇ dedˋ","def":"不能吃。反言之，可以吃則為「食得」。 例如：這柑仔生菇，食毋得吔。 例如：阿姆屙痢肚，麼个都食毋得，淨食粥定定。","example":""},{"word":"食毋去","pinyin":"siid mˇ hi","def":"吃不完。另有「衫褲著毋去」也常用。 例如：毋好煮恁多，屋下淨兩儕（個）人，食毋去倒忒（倒核）當（蓋）打爽（浪核）。","example":""},{"word":"失聲","pinyin":"siidˋ sangˊ","def":"失聲。 例如：教書个人，歸日仔講無停，一下（一下仔）無堵好就會失聲。 例如：海脣風恁大，你又講無停，係食著海風，轉去（歸去）會失聲。","example":""},{"word":"承水","pinyin":"siinˇ suiˋ","def":"承接（降落的）水。 例如：落大雨，屋頂水緊漏，去拿一隻桶仔來承水。","example":""},{"word":"挲平來","pinyin":"soˊ piangˇ loiˇ","def":"抹平。 例如：衫褲愛挲平來摺，正毋會皺膣郎當。","example":""},{"word":"趖","pinyin":"soˇ","def":"形容像蟲蠕動一般的爬行。 例如：坐在竹頭下會看得著蟲仔趖來趖去，下把仔蜈蚣蟲趖啊過就毋知。","example":""},{"word":"嗍汗","pinyin":"sogˋ hon","def":"吸汗。 例如：熱天愛著較（過）嗍汗个衫褲，會較（過）舒爽（鬆爽）。","example":""},{"word":"算來算去","pinyin":"son loiˇ son hi","def":"來回周密的計算。 例如：𠊎算來算去，還係這張保險單个條件最好。","example":""},{"word":"上上去","pinyin":"songˋ songˊ hi","def":"把東西放置高處或上方。 例如：這大鑊較（過）少用，同佢上上去棧仔項，係愛用正拿下來。","example":""},{"word":"上肩","pinyin":"songˊ gienˊ【songˊ gianˊ】","def":"將物品扛上肩膀。 例如：阿哥身體當（盡）砸，恁大个穀包上肩完全毋使人𢯭手。","example":""},{"word":"上下","pinyin":"songˊ haˊ","def":"經過；左右，約略之意。 例如：有上下愛入來坐。 例如：這尾石斑仔，差毋多有兩斤上下。","example":""},{"word":"上上下下","pinyin":"songˊ songˊ haˊ haˊ","def":"來來往往。 例如：臺北火車頭歸日仔上上下下个人，毋知有幾多？","example":""},{"word":"大細聲","pinyin":"tai se sangˊ","def":"大聲責罵。 例如：這下事情還吂（毋曾）搞清楚，你莫在這大細聲。","example":""},{"word":"探手","pinyin":"tamˊ suˋ【damˊ suˋ】","def":"伸手勉強搆著。 例如：紅棗樹毋會盡高，毋使探手就摘得著棗仔。","example":""},{"word":"透水","pinyin":"teu suiˋ","def":"引水。 例如：阿姆用水管對水龍頭項透水淋菜。","example":""},{"word":"敨氣","pinyin":"teuˋ hi","def":"把氣輸出；呼吸。 例如：阿公敨氣毋順，阿爸遽啊載佢去醫院分先生看。","example":""},{"word":"敨開來【解開來】","pinyin":"teuˋ koiˊ loiˇ【kieˋ koiˊ loiˇ】","def":"鬆開、放鬆。 例如：衫褲毋好束到恁緪，敨開來（解開來）較（過）爽快。","example":""},{"word":"敨涼","pinyin":"teuˋ liongˇ","def":"休息一下，使之舒爽。 例如：恁熱个天，先在樹下敨涼一下正行，好無？","example":""},{"word":"敨水","pinyin":"teuˋ suiˋ","def":"摻入水、稀釋，例如「滾水忒燒，敨兜冷水」。 例如：這杯西瓜汁全無敨水，難怪食起來恁醹。","example":""},{"word":"敨大氣","pinyin":"teuˋ tai hi","def":"嘆氣；深呼吸。 例如：仰會好恬恬敨大氣？有發生麼个事情係無？","example":""},{"word":"敨鮮來","pinyin":"teuˋ xienˊ loiˇ","def":"加入水使其變稀。 例如：蜂糖做得夾麵包食，也做得敨鮮來食。","example":""},{"word":"偷偷㘝㘝","pinyin":"teuˊ teuˊ ngiabˋ ngiabˋ","def":"偷偷摸摸，暗中夾藏的樣子。 例如：阿梅見擺轉妹家，厥姆就會偷偷㘝㘝包一息仔（一息）東西分佢帶轉去（歸去）。","example":""},{"word":"頭鉤鉤仔","pinyin":"teuˇ gieuˊ gieuˊ eˋ【teuˇ gieuˊ gieuˊ eˊ】","def":"伸頭外望的樣子，比喻引頸期盼。 例如：厥姆頭鉤鉤仔，望佢轉來（歸來）𢯭手屋下个事業。","example":""},{"word":"挑竻","pinyin":"tiauˊ nedˋ","def":"剔出、摒除刺。 例如：賺錢可比針挑竻，使錢可比水推沙。（諺）","example":""},{"word":"跳上跌落（跳上跳下）","pinyin":"tiauˇ songˊ diedˋ log (tiauˇ songˊ tiauˇ haˊ)","def":"跳上跳下；忙裡忙外，表示忙得不可開交的樣子。 例如：該細人仔在石碫仔頂高跳上跌落。 例如：你跳上跌落，到底在該無閒麼个？","example":""},{"word":"停腳","pinyin":"tinˇ giogˋ","def":"休息片刻，也可引申作沉澱用。 例如：這盆水還汶汶，愛先放分佢停腳正來用。","example":""},{"word":"溜著","pinyin":"tiu/liu doˋ","def":"滑倒。 例如：麼人同地泥捽到溼溚溚仔，害𠊎溜著。","example":""},{"word":"盪","pinyin":"tong","def":"以手掌往水平方向揮打，常為大面積的接觸，且力氣較大。 例如「巴掌嫲（巴掌）盪啊過去」、「盪巴掌嫲（巴掌）」。","example":""},{"word":"偎","pinyin":"vaˋ","def":"偏向；挨近。例如「偎一片」。","example":""},{"word":"偎脣","pinyin":"vaˋ sunˇ【vaˋ siinˇ】","def":"靠邊。 例如：若車仔偎脣兜仔，正毋會杈著人。","example":""},{"word":"斡來斡去","pinyin":"vadˋ loiˇ vadˋ hi","def":"彎來彎去。 例如：這條山路斡來斡去，車仔當（蓋）難駛。","example":""},{"word":"斡頭","pinyin":"vadˋ teuˇ","def":"轉頭、回頭，常用於人或車輛。 例如：同佢講無兩句話佢就斡頭走，毋知在該譴麼个。","example":""},{"word":"挽著","pinyin":"vanˋ doˋ","def":"鉤到。 例如「膨線衫分釘仔挽著」。","example":""},{"word":"橫倒","pinyin":"vang doˋ","def":"跌倒、摔倒；直著身軀倒下。 例如：去蹶山（跋山）行山路愛細義，毋好橫倒。 例如：佢身體無爽快，行兩步仔就橫倒，分人送去醫院。","example":""},{"word":"橫下來","pinyin":"vang haˊ loiˇ","def":"人或物體倒下來。 例如：風搓過後，盡多樹仔橫下來。","example":""},{"word":"橫來橫去","pinyin":"vang loiˇ vang hi","def":"搖搖晃晃。 例如：佢食忒多酒，醉到行路橫來橫去。","example":""},{"word":"搵彎","pinyin":"vudˋ vanˊ","def":"把東西折彎。 例如：塑膠管愛先用火燂燂（炕炕）啊，正較（過）好搵彎。","example":""},{"word":"搵等","pinyin":"vun denˋ","def":"躺臥著，或指賴著不走。 例如：毋好透日仔在屋下搵等，愛出去行行啊。 例如：細人仔在地泥項搵等緊噭，愛監爺哀買玩具分佢。","example":""},{"word":"搵地泥","pinyin":"vun ti naiˇ","def":"躺、坐在地上或在地上打滾。 例如：這細人仔分大人縱壞吔，動啊著就蹬腳搵地泥。","example":""},{"word":"四腳惹天","pinyin":"xi giogˋ ngia tienˊ","def":"四腳朝天或四肢張開的樣子；也可說「四腳惹惹」。 例如：阿玲玩具搞忒（搞核）無收揫，害厥姆躪著，跌到（橫啊）四腳惹天。","example":""},{"word":"絲","pinyin":"xiˊ","def":"撕去植物較老的表皮。例「絲番薯葉莖」、「絲芋荷莖」。","example":""},{"word":"削著","pinyin":"xiag doˋ【xiogˋ doˋ】","def":"刀類由內往外削導致的割傷。 例如：割草个時節愛細義兜仔（一息），正毋會分禾鐮仔削著。","example":""},{"word":"潛水","pinyin":"xiamˇ suiˋ","def":"潛水。 例如：𠊎想去墾丁學潛水。","example":""},{"word":"先行","pinyin":"xienˊ hangˇ","def":"先走。 例如：你這兜（你等）先行無相干，吾（𠊎个）鞋帶仔繫好就會跈等逐上去。","example":""},{"word":"遮掩","pinyin":"zaˊ iamˋ","def":"遮掩。 例如：佢偷東西分警察捉（扭）著，驚見笑，就遽遽（共快）拿衫來遮掩面。","example":""},{"word":"挱起來","pinyin":"saˊ hiˋ loiˇ","def":"抓起來、拉起來。 例如：頭家，這抓筷菜毋知有幾重仔？做得挱起來秤一下無？","example":""},{"word":"炙日頭（晒日頭）","pinyin":"zagˋ ngidˋ teuˇ (sai ngidˋ teuˇ)","def":"晒太陽。 例如：天時恁寒，去外背炙日頭，會較（過）燒暖。 例如：天時恁好，被骨擎（拿）出去炙日頭。","example":""},{"word":"輾啊過","pinyin":"zan a go","def":"以滾輪壓過去。 例如：燒燒个馬膠愛用石輪仔輾啊過，大路正毋會礫礫矻矻。","example":""},{"word":"碾地泥","pinyin":"zan ti naiˇ","def":"在地上滾。 例如：該狗仔正洗好身又碾地泥，碾到（碾啊）屙屙糟糟。","example":""},{"word":"涉水","pinyin":"zeb suiˋ","def":"以腳踩水嬉戲。 例如：落雨過後，細人仔在水窟涉水，搣到鞋溼溼。","example":""},{"word":"揕人","pinyin":"zemˊ nginˇ","def":"握緊拳頭揍人。 例如：佢揢等拳頭嫲（拳頭），像愛揕人樣仔（樣）。","example":""},{"word":"走東走西","pinyin":"zeuˋ dungˊ zeuˋ xiˊ","def":"到處走，無確定目標的走。 例如：防疫期間無法度走東走西，還艱苦哦！","example":""},{"word":"走俐俐","pinyin":"zeuˋ li li","def":"跑走，閃得俐落。 例如：該隻賊仔偷東西，警察吂（還無）到，佢就對後門出，走俐俐。 例如：這擺金融風暴，佢个股票、基金全部走俐俐，無麼个有了著。","example":""},{"word":"走毋掣","pinyin":"zeuˋ mˇ cadˋ","def":"來不及跑。 例如：這擺火燒屋，當（盡）多人因為走毋掣分火燒死忒（燒死核）。","example":""},{"word":"走毋俐","pinyin":"zeuˋ mˇ li","def":"逃不開、避不掉。 例如：賊仔偷東西分頭家捉著（扭著），這下斯走毋俐哩（吔）！","example":""},{"word":"斟茶","pinyin":"ziimˊ caˇ","def":"倒茶。 例如：阿婆（阿嬤）當（蓋）工夫，有人客來屋下尞，佢定著會斟茶分人食。","example":""},{"word":"做加做減（加減做）","pinyin":"zo gaˊ zo gamˋ (gaˊ gamˋ zo)","def":"多少做一點。 例如：退休閒閒，有成時屋下个事做加做減，身體動動啊乜好。","example":""},{"word":"作力","pinyin":"zogˋ lid","def":"使力、用力、出力。 例如：佢中風過後，右手毋會作力，連飯碗都兜毋起來。 例如：吾腳異（盡）毋作力，哪都去毋得。","example":""},{"word":"載去載轉","pinyin":"zoi hi zoi zonˋ","def":"載過來載過去。 例如：上下班時間，車枋載去載轉，仰等車个人還係恁多？","example":""},{"word":"嘴就合毋揫","pinyin":"zoi qiu hab mˇ qiuˊ【zoi lu/luˊ hab mˇ qiuˊ】","def":"比喻高興得合不攏嘴，亦可說「嘴都合毋密」。 例如：老妹數學考一百分，歡喜到（歡喜啊）嘴就合毋揫。","example":""},{"word":"鑽空仔【鑽空】","pinyin":"zon kungˊ eˋ【zon kangˊ】","def":"鑽洞。 例如：阿爸打早就拿等鑽仔在該鑽空仔（鑽空），搣到（搣啊）歸屋下人完全睡毋得。","example":""},{"word":"鑽上鑽下","pinyin":"zon songˊ zon haˊ","def":"來回穿梭。 例如：毋好在桌下鑽上鑽下，去別位搞！","example":""},{"word":"轉身","pinyin":"zonˋ siinˊ","def":"轉過身子。 例如：間房恁狹，轉身就毋得，愛仰仔歇人！","example":""},{"word":"裝便","pinyin":"zongˊ pien","def":"事先做好。 例如：包袱仔（包袱）先裝便來，毋好到時緊拚拚仔（亂緊緊仔）。","example":""},{"word":"鑽來鑽去","pinyin":"zonˊ loiˇ zonˊ hi/zon loiˇ zon hi","def":"鑽來鑽去。 例如：細人仔看收冬戲，總係在戲棚下鑽來鑽去無時閒。","example":""},{"word":"舂","pinyin":"zungˊ","def":"用杵臼搗物；鈍擊。 例如：舂米。 例如：毋好舂人，會傷著人。","example":""},{"word":"過火","pinyin":"go foˋ","def":"料理時火侯過猛；過分，超過限度。","example":""},{"word":"杈椏","pinyin":"ca vaˊ","def":"樹木歧生出的杈枝。 例如：屋背該頭牛眼樹杈椏該位仔有一竇蜂竇。","example":""},{"word":"必筍（暴筍）","pinyin":"bidˋ sunˋ (bau sunˋ)","def":"植物長出新芽。 例如：落雨過後，這頭老樹仔又必筍（暴筍）哩（吔）。","example":""},{"word":"刺波仔","pinyin":"cii poˊ eˋ","def":"野生草莓。 例如：掌牛哥仔牽牛上山去食草，會有紅紅个刺波仔好摘來食。","example":""},{"word":"糙米","pinyin":"co miˋ","def":"糙米。 例如：糙米个纖維含量較（過）高，當（蓋）有營養，毋過食起來較（過）硬，愛煮較（過）綿兜仔（一息）。","example":""},{"word":"苧仔","pinyin":"cuˊ eˋ","def":"苧麻。 例如：你識著過用苧仔做个衫褲無？","example":""},{"word":"苦蕒（野苦蕒）","pinyin":"fuˋ magˋ (iaˊ fuˋ magˋ)","def":"苦萵苣。 例如：青色个草坪項，看得著開細細蕊仔黃花个苦蕒（野苦蕒）。","example":""},{"word":"佛果【釋迦仔、沙梨】","pinyin":"fud goˋ【xiag giaˊ eˋ、saˊ liˇ】","def":"釋迦。 例如：臺灣係目前全世界佛果（釋迦仔）種植面積盡闊、生產技術盡好、果品品質盡湛个所在。","example":""},{"word":"甘杞（枸杞）","pinyin":"gamˊ giˋ (gieuˋ giˋ)","def":"枸杞。 例如：煲雞湯加甘杞，湯頭較（過）甜。","example":""},{"word":"茭筍【包筍】","pinyin":"gauˊ sunˋ【bauˊ sunˋ】","def":"茭白筍。 例如：阿火伯種一坵茭筍（包筍），自家食毋忒（食毋核），隔壁鄰舍也有好食。","example":""},{"word":"芥蓮菜","pinyin":"gie lienˇ coi","def":"芥藍菜。 例如：今年清雲嫂種个芥蓮菜當（蓋）靚，一屋下人食到（食啊）當（蓋）過願。","example":""},{"word":"枸薑（月桃）","pinyin":"gieuˋ giongˊ (ngied toˇ)【ngiad toˇ】","def":"月桃。 例如：有兜客人䌈（裹）粽仔慣用枸薑葉，講食起來有一種特別个香氣。","example":""},{"word":"荷蘭豆","pinyin":"hoˇ lanˇ teu","def":"豌豆。 例如：阿嫂炒雜菜用紅蘿蔔、馬鈴薯、荷蘭豆，色香味齊全。","example":""},{"word":"田豆【開花豆】","pinyin":"tienˇ teu【koiˊ faˊ teu】","def":"蠶豆。 例如：用油烰个田豆（開花豆）酥合香，異（盡）多人好食。","example":""},{"word":"𧊅絲","pinyin":"guaiˋ xiˊ","def":"紫蘇。 例如：𧊅絲做得菣香，乜做得做藥。","example":""},{"word":"羊角仔【菱角】","pinyin":"iongˇ gogˋ eˇ【linˇ gogˋ】","def":"菱角。 例如：市場項有人賣煮熟个羊角仔（菱角），細人仔看到（看啊）緊吞口涎水。","example":""},{"word":"艾菜","pinyin":"ngie coi","def":"茼蒿。 例如：客人煮鹹粄圓（圓粄）會放兜艾菜落去（入去），異（盡）合味。","example":""},{"word":"桑仔子（鹽酸仔）","pinyin":"sonˊ eˋ ziiˋ (iamˇ sonˊ eˋ)","def":"桑葚。 例如：路脣該頭桑仔樹（鹽酸仔樹）項打到淰淰（滿滿）个桑仔子（鹽酸仔），有紅有烏，還鬧哪！","example":""},{"word":"芙蓉","pinyin":"puˇ iungˇ","def":"芙蓉。 例如：阿公用花盆仔種一頭芙蓉，灰白个葉仔，乜係一盆盆景。","example":""},{"word":"楓樹","pinyin":"pungˊ su【fungˊ su】","def":"楓樹。 例如：氣溫係毋罅冷，生在平地个楓樹，葉仔毋會變紅。","example":""},{"word":"蝦公夾","pinyin":"haˇ gungˊ giab","def":"鬼針草。 例如：蝦公夾異（盡）賤，生到（生啊）一哪仔就係，除毋會淨。","example":""},{"word":"蕹菜","pinyin":"vung coi","def":"空心菜。 例如：蕹菜係盡普遍个青菜，用炒無就煮湯共樣恁好食。","example":""},{"word":"秥米","pinyin":"zamˊ miˋ","def":"在來米。 例如：蒸發粄、水粄仔會用著秥米，軟硬正較（過）堵好。","example":""},{"word":"燥絲絲仔","pinyin":"zauˊ xiˊ xiˊ eˋ【zauˊ xiˊ xiˊ eˊ】","def":"形容非常乾燥，水分很少；另可說「燥絲燥絲」。 例如：當（蓋）久無落雨，一哪仔都燥絲絲仔。","example":""},{"word":"蒂頭","pinyin":"di teuˇ","def":"果實之蒂。 例如：食刺波仔个時，蒂頭愛摘忒（摘核）。","example":""},{"word":"菜仁仔（菜籽）","pinyin":"coi inˇ eˋ (coi ziiˋ)","def":"青菜的種子。 例如：春天係點菜仁仔个好時節。","example":""},{"word":"樹頭","pinyin":"su teuˇ","def":"樹的根部，也可指木頭。 例如：一頭樹頭愛探來深，樹仔正紥得穩。","example":""},{"word":"竹笐【竹筒】","pinyin":"zugˋ gongˇ【zugˋ tungˇ】","def":"竹筒，竹子節與節間的中空部分。 例如：鋸一截竹笐（竹筒）來做筆笐。","example":""},{"word":"縐核仔","pinyin":"jiu fud eˋ","def":"果實中籽小肉多者。 例如：牛眼同荔枝愛擇縐核仔个，正會好食。","example":""},{"word":"禾串（穀串）","pinyin":"voˇ con (gugˋ con)【gugˋ can】","def":"稻穗。 例如：這細人仔從細就恁做家，看人割禾，佢就屎胐背跈等拈禾串（穀串）。","example":""},{"word":"冇穀","pinyin":"pang gugˋ","def":"穀粒空虛不實；飽滿者稱「精穀」。 例如：冇穀無米，割來乜無用。","example":""},{"word":"冇冇","pinyin":"pang pang","def":"形容物體不飽滿、不紮實，亦可引申為做人不實在；飽滿則為「精精」，專指穀物。 例如：這半年來做天旱，這冬个穀做下（聚概）冇冇，耕田人實在辛苦。","example":""},{"word":"递藤","pinyin":"taiˊ tenˇ","def":"藤類植物莖葉蔓生。 例如：雷公根會递藤，目目都會生葉、開花、打子，遰到哪仔就係。","example":""},{"word":"豆腐頭","pinyin":"teu fu teuˇ","def":"豆渣。 例如：豆腐頭做得分豬仔食。","example":""},{"word":"胞衣","pinyin":"bauˊ iˊ","def":"胎盤。 例如：中藥个紫河車就係胞衣做个。","example":""},{"word":"腹內（下水）","pinyin":"bugˋ nui (ha suiˋ)","def":"指動物的內臟。 例如：腹內拿來炒當（蓋）好食。","example":""},{"word":"胗肝","pinyin":"kinˊ gonˊ","def":"胗是胃，泛指動物內臟。 例如：講該種話，正經胗肝都會㖸出來。","example":""},{"word":"雞旺仔（雞紅）","pinyin":"gieˊ vong eˋ (gieˊ fungˇ)","def":"雞血。 例如：雞旺仔炒筷菜係一品（項）名菜。","example":""},{"word":"雞核仔","pinyin":"gieˊ hag eˋ","def":"雞睪丸。 例如：雞核仔煮酒食，有人當（蓋）好。","example":""},{"word":"雞胗","pinyin":"gieˊ kinˊ","def":"雞的胃。 例如：阿婆逐（每）擺都同雞胗分孫仔食。","example":""},{"word":"雞公","pinyin":"gieˊ gungˊ","def":"公雞。 例如：雞公會啼，雞嫲毋會啼。","example":""},{"word":"雄雞仔","pinyin":"hiungˇ gieˊ eˋ","def":"未閹的雄雞。 例如：這隻雄雞仔恁靚，留來做雞公。","example":""},{"word":"雞公髻","pinyin":"gieˊ gungˊ gi","def":"雞冠。 例如：雞公相打專觜雞公髻。","example":""},{"word":"雞僆仔","pinyin":"gieˊ lon eˋ","def":"小母雞，尚未生蛋的雌雞。 例如：這隻雞僆仔留來生卵。","example":""},{"word":"雞子","pinyin":"gieˊ ziiˋ","def":"小雞。 例如：雞嫲帶雞子在樹下蹶食。","example":""},{"word":"閹雞","pinyin":"iamˊ gieˊ","def":"閹雞，去勢後的公雞。 例如：過年㓾一隻閹雞來敬天公。","example":""},{"word":"水牛牯","pinyin":"suiˋ ngiuˇ guˋ","def":"公水牛。 例如：吾屋下畜一隻水牛牯，當（蓋）砸。","example":""},{"word":"膨尾鼠","pinyin":"pong miˊ cuˋ","def":"松鼠。 例如：膨尾鼠當慶（蓋壁），在樹頂躍來躍去。","example":""},{"word":"錢鼠（唧鼠、唧匿鼠）","pinyin":"qienˇ cuˋ (jid cuˋ、jid nid cuˋ)","def":"臭鼩。 例如：有人講錢鼠緊叫，怕有錢入戶哩喲（吔喲）。","example":""},{"word":"長頸鹿","pinyin":"congˇ giangˋ lug","def":"長頸鹿。 例如：長頸鹿頸根長，食得著較（過）高个樹葉仔。","example":""},{"word":"熊","pinyin":"iungˇ","def":"熊。 例如：熊盡會在河壩脣捉魚仔來食。","example":""},{"word":"龜殼花","pinyin":"guiˊ hogˋ faˊ","def":"龜殼花。 例如：龜殼花係惡蛇名，毋係花名。","example":""},{"word":"禽獸","pinyin":"kimˇ cu","def":"原指禽獸，常用以比喻失去人性的人。 例如：人同禽獸無共樣个所在，就係人有文明。 例如：比禽獸還較（過）慘！㓾死人毋知差。","example":""},{"word":"共竇","pinyin":"kiung deu","def":"同一窩。 例如：平平係共竇个雞仔，一隻恁大、一隻恁細，仰差恁多。","example":""},{"word":"毛蟹","pinyin":"moˊ/mo haiˋ【no haiˋ】","def":"螃蟹。 例如：食毛蟹愛食嫲个較（過）有膏。","example":""},{"word":"黃鱔","pinyin":"vongˇ sanˊ","def":"黃鱔。 例如：黃鱔同鰻仔當（蓋）相像。","example":""},{"word":"頦鰓","pinyin":"hoiˊ soiˊ","def":"魚的呼吸器官、鰓。 例如：㓾魚仔愛摎（同）頦鰓挖忒（挖核）。","example":""},{"word":"湖蜞","pinyin":"fuˇ kiˇ","def":"水蛭，水中吸血蟲。 例如：水項異（盡）多湖蜞會巴人个腳囊肚食血。","example":""},{"word":"湖鰍仔","pinyin":"fuˇ qiuˊ eˋ","def":"泥鰍。 例如：湖鰍仔一身滑溜溜仔捉佢毋核。","example":""},{"word":"做竇","pinyin":"zo deu","def":"築巢。 例如：山阿鵲盡好在高高个樹頂做竇。","example":""},{"word":"貓頭鳥","pinyin":"meu teuˇ diauˊ","def":"貓頭鷹。 例如：貓頭鳥愛暗晡頭正會出來絡食。","example":""},{"word":"白鶴仔","pinyin":"pag hog eˋ","def":"白鷺鷥；白鶴。 例如：春天个時，耕種人一做田，白鶴仔就會跈到後背來食蟲仔（蟲䘆）。","example":""},{"word":"阿啾箭","pinyin":"aˊ jiuˊ jien","def":"烏鶖、大卷尾鳥。 例如：阿啾箭會打鷂婆，乜輒常企在牛背頂。","example":""},{"word":"斑鳩仔（鵓鴣仔）","pinyin":"banˊ gieuˊ eˋ (pug guˊ eˋ)","def":"斑鳩。 例如：斑鳩仔同月鴿仔差毋多大，異（盡）多人無分別。","example":""},{"word":"山阿鵲","pinyin":"sanˊ aˊ xiagˋ","def":"喜鵲。 例如：山阿鵲身裝生來盡靚，毋過叫聲毋好聽。","example":""},{"word":"蝠婆仔","pinyin":"pid poˇ eˋ","def":"蝙蝠。 例如：蝠婆仔像會飛个老鼠。","example":""},{"word":"狗嫲蛇","pinyin":"gieuˋ maˇ saˇ","def":"蜥蜴。 例如：狗嫲蛇肥肥金金，看起來比山狗太較（過）得人驚。","example":""},{"word":"山狗太","pinyin":"sanˊ gieuˋ tai","def":"攀木蜥蜴。 例如：人講分山狗太咬著，愛雷公響正會放忒（放核）。","example":""},{"word":"山牛牯","pinyin":"sanˊ ngiuˇ guˋ","def":"天牛。 例如：苦楝樹項盡輒看著山牛牯。","example":""},{"word":"蟬仔","pinyin":"samˇ eˋ","def":"蟬。 例如：熱天該下，細人仔會去黏蟬仔來搞。","example":""},{"word":"屎烏蠅【屎缸烏蠅】","pinyin":"siiˋ vuˊ inˇ【siiˋ gongˊ vuˊ inˇ】","def":"紅頭蒼蠅。 例如：熱天魚仔死啊忒（死啊核），跈等就餳屎烏蠅（屎缸烏蠅）來。","example":""},{"word":"揚尾仔","pinyin":"iongˇ miˊ eˋ","def":"蜻蜓。 例如：天頂揚尾仔緊飛，怕會落雨哩（吔）。","example":""},{"word":"水揚尾","pinyin":"suiˋ iongˇ miˊ","def":"豆娘，水蜻蜓。 例如：水揚尾同揚尾仔無共樣，身體生來較（過）瘦較（過）細，兩皮翼平大。","example":""},{"word":"竹筍蛄","pinyin":"zugˋ sunˋ guˊ","def":"台灣大象鼻蟲。 例如：細人仔會用線同竹筍蛄个鼻公笐䌈等放畀飛。","example":""},{"word":"金蛄仔","pinyin":"gimˊ guˊ eˋ","def":"金龜子。 例如：青菜葉仔分金蛄仔食到（食啊）一空一空仔（吔）。","example":""},{"word":"火焰蟲【火黏蟲】","pinyin":"foˋ iam cungˇ【foˋ ngiamˇ cungˇ】","def":"螢火蟲。 例如：因爭噴農藥、除草劑个關係，火焰蟲（火黏蟲）嗄異（盡）少看著吔。","example":""},{"word":"大頭狗","pinyin":"tai teuˇ gieuˋ","def":"竹林、樹林、草叢裡的小型蚊蚋，會吸血的黑頭蚊。 例如：大頭狗細罔細，分佢咬著斯會當（盡）癢。","example":""},{"word":"𧊅𬠖仔","pinyin":"guaiˋ ngiam eˋ","def":"蝌蚪。 例如：該水窟肚異（盡）多𧊅𬠖仔，鴨仔在該食到（食啊）飽飽。","example":""},{"word":"㪐殼【退殼】","pinyin":"ludˋ hogˋ【tui hogˋ】","def":"脫殼，可用於植物或昆蟲等脫殼行為。 例如：毛蟹㪐殼（退殼）一擺就大一擺。","example":""},{"word":"絕忒【絕核】","pinyin":"qied tedˋ【qied hedˋ】","def":"絕種、滅絕。 例如：因爭環境个汙染同改變，異（盡）多生物就會絕忒（絕核）。","example":""},{"word":"養","pinyin":"iongˊ","def":"稱動物生子。 例如：佢畜个狗嫲養十過隻狗子（細狗仔），你愛捉（扭）幾隻仔轉去（歸去）畜無？","example":""},{"word":"雙胞卵","pinyin":"sungˊ bauˊ lonˋ【(sungˊ bauˊ nonˋ)】","def":"雙胞胎，出生前的稱呼。 例如：厥心臼肚屎（肚笥）恁大粒，怕係雙胞卵哦！","example":""},{"word":"雙生仔","pinyin":"sungˊ sangˊ eˋ","def":"雙胞胎，出生後的稱呼。 例如：該對雙生仔像到無跌忒（無跌核），看毋出哪位無共樣。","example":""},{"word":"嘴落仔","pinyin":"zoi labˋ eˇ","def":"牲畜（如牛、馬、狗等）用的口罩。 例如：若狗仔會咬人，愛用嘴落仔落等。","example":""},{"word":"轉輪骨","pinyin":"zonˋ lunˇ gudˋ","def":"動物腿上關節的骨頭。 例如：雞肉轉輪骨該位个肉盡好食。","example":""},{"word":"吮人","pinyin":"qionˋ nginˇ","def":"扁嘴的家禽用嘴去啄人。 例如：厥鵝公會吮人，大家毋敢行兼。","example":""},{"word":"觜人","pinyin":"zuiˋ nginˇ","def":"尖嘴的家禽用嘴快速且用力地啄人。 例如：捉（扭）雞子（雞仔）該下，雞嫲會觜人。","example":""},{"word":"嘍狗仔","pinyin":"leu gieuˋ eˇ","def":"出聲喊叫並吸引狗，也可用於其他家禽家畜，例如「嘍雞、嘍貓仔」。「嘍狗相咬」則比喻挑撥離間，引起爭端。 例如：大家食啊飽，阿姆就去準備飼料，嘍狗仔來食。","example":""},{"word":"壞蹄","pinyin":"fai taiˇ","def":"指馬蹄受到損傷，表事態嚴重，糟糕了！又作「壞哩（吔）」。 例如：細人仔个學費幾下萬銀，嗄分人偷拿走，這擺壞蹄哩（吔）。","example":""},{"word":"狺狺滾","pinyin":"guen guen gunˋ","def":"狗哀叫聲。 例如：狗仔个腳分車仔輾著，狺狺滾瀉一路走。","example":""},{"word":"半寒熱","pinyin":"ban honˇ ngied【ban honˇ ngiad】","def":"指不冷不熱的天氣。 例如：像今晡日這種半寒熱个天時，做田事最好。","example":""},{"word":"崩崗石壁","pinyin":"benˊ gongˊ sag biagˋ","def":"懸崖峭壁。 例如：行這山路崩崗石壁當（蓋）多，愛細義。","example":""},{"word":"放雨白（打雨白）","pinyin":"biong iˋ pag (daˋ iˋ pag)","def":"颱風前，忽下忽停的陣雨。 例如：放雨白哩（吔），一下仔落一下仔停。","example":""},{"word":"波螺皺風（龍捲風、扭揪風、皺螺風）【（皺波螺風）】","pinyin":"boˊ loˇ jiu fungˊ (liungˇ gienˋ fungˊ、ngiuˋ jiuˋ fungˊ、jiu loˇ fungˊ)【liungˇ gianˋ fungˊ (jiu boˊ loˇ fungˊ)】","def":"旋風、龍捲風。 例如：臺灣盡罕得有波螺皺風，較（過）多个係颱風（風搓）。","example":""},{"word":"泉水【自然水】","pinyin":"qienˇ/canˇ suiˋ【cii ianˇ suiˋ】","def":"泉水。 例如：去山項露營，用泉水（自然水）泡茶，盡甘！","example":""},{"word":"草埔","pinyin":"coˋ puˊ","def":"生滿雜草的荒野地。 例如：這草埔恁平，做得開球場。","example":""},{"word":"著火","pinyin":"cog foˋ","def":"火燒起來了。 如「屋仔著火」。","example":""},{"word":"臭青","pinyin":"cu qiang","def":"有生草的味道。 例如：草坪个草正割啊忒（割啊核），風吹啊來就鼻得著臭青味。","example":""},{"word":"落雨毛仔（打雨毛冇、打雨毛屑）","pinyin":"log iˋ moˊ eˋ (daˋ iˋ moˊ pang、daˋ iˋ moˊ sebˋ)","def":"飄毛毛雨。 例如：外背落雨毛仔吔，晒在禾埕項个衫褲好遽遽（共快）去收入來。","example":""},{"word":"打露（打露水）","pinyin":"daˋ lu (daˋ lu suiˋ)","def":"物體晚間置於外頭露天處，露水凝結於其上。 例如：晾在外背个衫褲愛收起來，無會打露。","example":""},{"word":"當日","pinyin":"dongˊ ngidˋ","def":"太陽直射。 例如：企在恁當日个所在，會晒死哦！","example":""},{"word":"翡翠","pinyin":"fiˋ cui","def":"翡翠。 例如：若䯋鍊面項該垤（塊）翡翠，看起來盡靚！","example":""},{"word":"回南","pinyin":"fiˇ namˇ","def":"颱風眼離開後所颳的南風。 例如：回南哩（吔），風搓會走哩（吔）。","example":""},{"word":"火忒猛（火忒烈）","pinyin":"foˋ tedˋ mangˊ (foˋ tedˋ ladˋ)","def":"火太猛烈。 例如：若火忒猛（火忒烈）哩（吔）！魚仔分你煎到臭火𤊶。","example":""},{"word":"窟","pinyin":"fudˋ","def":"窟窿、窩、坑。 例如：該條路異（盡）多所在有窟仔，你駛車愛較（過）細義兜仔（一息）！","example":""},{"word":"輻射線","pinyin":"fugˋ sa xien","def":"輻射線。 例如：日頭个輻射線會傷害皮膚，故所出門愛戴帽仔同著長袖衫。","example":""},{"word":"分水峎（分水崠）","pinyin":"funˊ suiˋ gien (funˊ suiˋ dungˋ)","def":"分水嶺。 例如：山頂項該分水峎還分明哪，山面拚大雨，山背大好天。","example":""},{"word":"風吹日炙","pinyin":"fungˊ coiˊ ngidˋ zagˋ","def":"風吹日晒。 例如：做外送个頭路，逐（每）日都愛風吹日炙，異（盡）辛苦！","example":""},{"word":"風馳雨","pinyin":"fungˊ ciiˇ iˋ","def":"午後雷陣雨，夏天的一種季節雨，常在午後時分，來得急也去得快。 例如：熱天時輒輒會打風馳雨，出門愛記得帶遮仔。","example":""},{"word":"風沙（風飛沙）","pinyin":"fungˊ saˊ (fungˊ biˊ saˊ)","def":"風沙。 例如：寒天時節東北季風一來，溪底个風沙就一哪仔飛，空氣盡壞！","example":""},{"word":"風合雨（風合水）","pinyin":"fungˊ gagˋ iˋ (fungˊ gagˋ suiˋ)","def":"風雨交加。 例如：風合雨个天時，你還愛在外背走，實在異（盡）辛苦！","example":""},{"word":"合縫","pinyin":"gabˋ pung","def":"接縫。 例如：無共年起个屋仔，合縫項會洩水。","example":""},{"word":"陶盎泥【盎仔泥】","pinyin":"toˇ/tongˇ angˊ naiˇ【angˊ eˋ naiˇ】","def":"屬黏土的土質，多用來燒陶瓷器用。 例如：苗栗个陶盎泥（盎仔泥）土質當（蓋）好，燒个缶仔盡靚。","example":""},{"word":"浩洪斗雨（谿濛斗雨、喊盆大雨、喊頭大雨）","pinyin":"heˊ fungˇ deuˋ iˋ (haiˊ mungˇ deuˋ iˋ、hemˊ punˇ tai iˋ、hemˊ teuˇ tai iˋ)","def":"傾盆大雨，亦可說「龍搞水」。 例如：下班个時節堵著浩洪斗雨，一下仔歸身涿到潦潦（歸身仔涿啊溚溼）。","example":""},{"word":"起風","pinyin":"hiˋ fungˊ","def":"開始颳風，引申形容人專注做事，高速運轉的樣子。 例如：事做到當（蓋）起風該下，連電話響就毋知。","example":""},{"word":"嗋石","pinyin":"hiab sag","def":"磁石，磁鐵。 例如：用嗋石做得測出東西係毋係用鐵仔做个。","example":""},{"word":"響雷公（打雷公）","pinyin":"hiongˋ luiˇ gungˊ (daˋ luiˇ gungˊ)","def":"打雷。 例如：𥍉爧過後，跈等（接等）會響雷公。","example":""},{"word":"好天好時","pinyin":"hoˋ tienˊ hoˋ siiˇ","def":"好天氣。 例如：好天好時愛做事就趕緊，毋好透日仔在屋肚囥等（透日在屋仔裡背庰等）。","example":""},{"word":"呵著","pinyin":"ho doˋ","def":"被熱氣燙到、薰著。 例如：蒸粄該下，掀籠床愛細義，莫分佢呵著。","example":""},{"word":"燒風","pinyin":"seuˊ fungˊ","def":"熱風、焚風。 例如：這幾日个天時無正常，溫度高又過起燒風。","example":""},{"word":"雨淋雨涿","pinyin":"iˋ limˇ iˋ dugˋ","def":"受雨水滴淋。 例如：落雨天，安全帽毋好放在外背雨淋雨涿，會生菇。","example":""},{"word":"雨毛仔","pi
