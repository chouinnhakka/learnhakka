子。 例如：自上禮拜開刀到今，佢歸隻人還病膩膩仔，無麼个精神。","example":""},{"word":"破病破病","pinyin":"po piang po piang","def":"形容病懨懨的樣子。 例如：這駁仔佢破病破病，係毋係身體有麼个所爭？","example":""},{"word":"𱱿仔","pinyin":"pug eˋ","def":"被蚊蟲叮咬引起的小腫塊。","example":""},{"word":"青瞑的啄","pinyin":"qiangˊ miangˊ didˋ dugˋ","def":"罵人走路漫不經心，像瞎子走路樣。 例如：你行路青瞑的啄，等一下就會撞著壁。","example":""},{"word":"撨筋接骨","pinyin":"qiauˇ ginˊ jiabˋ gudˋ","def":"推拿整復。 例如：去分拳頭師傅撨筋接骨，毋知有效無？","example":""},{"word":"石女","pinyin":"sag ngˋ","def":"形容因身心異常而無法行房的女子。","example":""},{"word":"析著","pinyin":"sagˋ doˋ","def":"腰椎因使力不當或熱身不足而受傷、閃到。 例如：阿登牯个腰骨析著，歸個月毋會做事。","example":""},{"word":"勯勯","pinyin":"sanˊ sanˊ","def":"形容沒有元氣，病懨懨的樣子。 例如：釣轉來个魚仔，一下仔就變到勯勯，畜毋生。 例如：逐日天時都恁好，日頭盡烈，見出去晒一下，轉來就熱到勯勯。","example":""},{"word":"聲腌腌","pinyin":"sangˊ iabˋ iabˋ","def":"聲音沙啞。 例如：𠊎逐日在學校愛教六節課，一直講無停，長透下課就聲腌腌哩。","example":""},{"word":"聲失失","pinyin":"sangˊ siidˋ siidˋ","def":"聲音沙啞，帶有鼻音。 例如：你做麼个聲失失，係有寒著抑係大聲胲講無停？","example":""},{"word":"細骼","pinyin":"se gagˋ","def":"體格小。","example":""},{"word":"消胲","pinyin":"xiauˊ goiˊ","def":"死亡；否定或質疑的語氣用詞。 例如：佢病到恁傷重，𠊎看啊！怕會消胲哩！ 例如：消胲吔！發風落大雨還毋停班停課，仰結煞！","example":""},{"word":"屎哱哱仔","pinyin":"siiˋ bud bud eˋ","def":"原意是指一直有便意拉不乾淨，引申為形容一副跩兮兮、很驕傲的樣子。 例如：單淨係考著大學定定，就屎哱哱仔，沙鼻弄天。","example":""},{"word":"屎洩洩仔","pinyin":"siiˋ xied xied eˋ","def":"本意為頻便的樣子，喻某人不可一世的樣子。","example":""},{"word":"失魂","pinyin":"siidˋ funˇ","def":"暈倒。 例如：佢對梯排項跌下來，一下就失魂忒去。","example":""},{"word":"失氣","pinyin":"siidˋ hi","def":"休克。","example":""},{"word":"身胚","pinyin":"siinˊ poiˊ","def":"身體軀幹。","example":""},{"word":"縮著","pinyin":"sogˋ doˋ","def":"因急吃冰或喝水引起的不舒服。 例如：正走啊轉毋好跈等就食冰个，會縮著。","example":""},{"word":"受病","pinyin":"su piang","def":"指植物生病或染病。 例如：今年个柑仔樹有兜受病，故所收成毋好。","example":""},{"word":"手瘸瘸","pinyin":"suˋ kioˇ kioˇ","def":"手部捲曲不靈活的樣子。 例如：天時恁冷，冷到手瘸瘸，煞煞去焙火。","example":""},{"word":"手軟腳犁【手軟腳攋】","pinyin":"suˋ ngionˊ giogˋ laiˇ【suˋ ngionˊ giogˋ laiˋ】","def":"疲憊不堪，手腳無力的樣子。 例如：平常無運動个人，敢怕蹶幾下層樓仔个樓梯就手軟腳犁吔。 例如：做無半日事就手軟腳犁，實在還㜮。","example":""},{"word":"手揋揋","pinyin":"suˋ voiˋ voiˋ","def":"手部僵硬不靈活，拿東西不穩。 例如：佢手揋揋，連糖仔就拿毋核。","example":""},{"word":"手指腡","pinyin":"suˋ ziiˋ loˇ","def":"指紋。","example":""},{"word":"窣鼻【煞鼻】","pinyin":"sud pi【sod pi】","def":"鼻涕流出又抽回去的情形。 例如：鼻愛擤出來，毋好在該窣鼻。","example":""},{"word":"水感","pinyin":"suiˋ gamˋ","def":"因流汗、淋雨而著涼。 例如：佢做田事堵著風馳來，就著著水感。","example":""},{"word":"損身仔","pinyin":"sunˋ siinˊ eˋ","def":"流產。 例如：損身仔異傷身體，同做月共樣愛補身體。","example":""},{"word":"雙旋","pinyin":"sungˊ qion","def":"頭上頭髮形成的漩渦，雙髮旋。傳說雙旋者，個性很兇，因而有「雙旋牯，惡過老虎」之說。","example":""},{"word":"大肚踉䠙【大肚扐膕】","pinyin":"tai duˋ longˊ pongˊ【tai duˋ led gued】","def":"孕婦大肚便便。 例如：厥心臼大肚踉䠙，下隻月就愛做月哩！","example":""},{"word":"大核包","pinyin":"tai hag bauˊ","def":"男子疝氣。","example":""},{"word":"大漢","pinyin":"tai hon","def":"長大；身材高大；排行在先的。 例如：細人仔大漢吔，正出去食頭路。","example":""},{"word":"大汗氣","pinyin":"tai hon hi","def":"容易流汗，「當大汗」指很容易流汗。","example":""},{"word":"痰火","pinyin":"tamˇ foˋ","def":"肺癆病。例「發痰火」。","example":""},{"word":"癱風","pinyin":"tanˊ fungˊ","def":"中風後癱瘓的病。","example":""},{"word":"頭疤面疤","pinyin":"teuˇ baˊ mien baˊ","def":"頭部和臉疤痕累累。 例如：面項个長薯仔毋好緊挳，正毋會舞到頭疤面疤。","example":""},{"word":"頭高髻大","pinyin":"teuˇ goˊ gi tai","def":"喻體格高大。 例如：厥老公生到頭高髻大，毋過好食懶做，實在盡無採。","example":""},{"word":"頭暈目暗","pinyin":"teuˇ hinˇ mugˋ am","def":"頭暈目眩。 例如：血毋罅个人，跍忒久會頭暈目暗。","example":""},{"word":"頭暈腦疺","pinyin":"teuˇ hinˇ noˋ bienˋ","def":"頭暈腦脹，暈頭轉向，難以忍受的的樣子，亦可說「暈頭疺腦」。 例如：日頭恁烈，天時又熱，人晒到頭暈腦疺，毋會食。 例如：老人家噩夜兩日就頭暈腦疺，血壓擎起來。","example":""},{"word":"頭燒額痛","pinyin":"teuˇ seuˊ ngiagˋ tung","def":"指一般感冒、頭痛發燒的症狀。","example":""},{"word":"頭鬚並白","pinyin":"teuˇ xiˊ bin pag","def":"頭髮與鬍子都白了，亦可說「頭鬚蓬白」。","example":""},{"word":"天庭","pinyin":"tienˊ tinˇ","def":"額頭；神仙住的宮殿。 例如：人講，毋好動啊著就額結結仔，愛天庭伸紋，運勢正會開。 例如：灶君爺上天庭，有一句講一句。","example":""},{"word":"天行痘（天花）","pinyin":"tienˊ hangˇ teu (tienˊ faˊ)","def":"天花。","example":""},{"word":"拖腳毋起","pinyin":"toˊ giogˋ mˇ hiˋ","def":"腳累得走不動。 例如：昨晡日去蹶山，朝晨䟘起來歸身痠軟到拖腳毋起。","example":""},{"word":"拖亡","pinyin":"toˊ mongˇ","def":"病得要死不死，要好不好的樣子，表示勉強延續下去。 例如：拖亡吔哩，吾病怕毋會好吔。","example":""},{"word":"橫膁","pinyin":"vangˇ iamˋ","def":"腰側。","example":""},{"word":"黃皮瘦弱","pinyin":"vongˇ piˇ ceu ngiog","def":"面黃肌瘦。 例如：這兜難民黃皮瘦弱，看著實在衰過。","example":""},{"word":"黃腫","pinyin":"vongˇ zungˋ","def":"肝膽病。 例如：佢著著黃腫，做毋得過噩夜吔。","example":""},{"word":"烏青紫嘔【烏青臌血】","pinyin":"vuˊ qiangˊ ziiˋ euˋ【vuˊ qiangˊ guˋ hiadˋ】","def":"瘀青發黑。 例如：昨晡日騎自行車無細義跌倒，害𠊎手腳嗄搉到烏青紫嘔。","example":""},{"word":"搵啊下去","pinyin":"vun a haˊ hi","def":"體力不支而癱在地上。 例如：佢身體可能有所爭，好好个人就恁樣搵啊下去。","example":""},{"word":"溫痛","pinyin":"vunˊ tung","def":"隱隱約約的疼痛。 例如：毋知食著麼个，肚屎試著溫痛溫痛，異無爽快。","example":""},{"word":"溫溫溫溫","pinyin":"vunˊ vunˊ vun vun","def":"隱隱作痛。 例如：吾胃長透溫溫溫溫，食藥仔乜毋會斷根。","example":""},{"word":"四犁筆直（四蹄筆直）【四腳壁直】","pinyin":"xi laiˇ bidˋ ciid (xi taiˇ bidˋ ciid)【xi giogˋ biagˋ ciid】","def":"形容累得四肢無力，猶如癱瘓一般。 例如：仰恁毋耐當？正擎米行兩輪定定，就悿到四犁筆直。","example":""},{"word":"鬚赤赤","pinyin":"xiˊ cagˋ cagˋ","def":"鬍鬚赤褐貌。","example":""},{"word":"鬚矛矛仔","pinyin":"xiˊ mauˇ mauˇ eˋ","def":"鬍鬚多貌。 例如：若鬍鬚仰毋剃剃啊，恁樣鬚矛矛仔，當媸看。","example":""},{"word":"鬚惹惹","pinyin":"xiˊ ngia ngia","def":"鬍鬚翹起貌，形容人生氣或非常失望的樣貌。 例如：戲棚頂，張飛譴到鬚惹惹；戲棚下，阿才看到嘴擘擘。","example":""},{"word":"心肝窟【心肝窩】","pinyin":"ximˊ gonˊ fudˋ【ximˊ gonˊ voˊ】","def":"心窩，位置在肋骨與胸骨之凹陷處。","example":""},{"word":"相屌","pinyin":"xiongˊ diauˋ","def":"性交，粗俗之說法。","example":""},{"word":"贅贅","pinyin":"zui zui","def":"浮腫。如「目珠皮贅贅」。","example":""},{"word":"撮藥仔","pinyin":"zebˋ iog eˋ","def":"指的是抓藥，著重在動作俐落。 例如：藥店个人撮藥仔當熟絡。","example":""},{"word":"焦積","pinyin":"zeuˊ jidˋ","def":"謂很多病痛或災厄，亦可作「焦焦積積」。 例如：這個細人仔當多焦積，畜毋得大。","example":""},{"word":"子癖","pinyin":"ziiˋ piagˋ","def":"懷孕時的習性嗜好。","example":""},{"word":"左𥯟犁","pinyin":"zoˋ baiˊ laiˇ","def":"左撇子。","example":""},{"word":"糟腸扡肚","pinyin":"zoˊ congˇ iaˋ duˋ","def":"腸胃中缺乏油脂想吃肉的感覺，或指腸胃中缺乏油脂而感到不舒服的狀態。 例如：有兜人藥仔食忒多，會糟腸扡肚，當毋爽快。","example":""},{"word":"作渴","pinyin":"zogˋ hodˋ","def":"因生病而感到口渴。 例如：𠊎作燒，嗄緊作渴。","example":""},{"word":"捉龍","pinyin":"zogˋ liungˇ","def":"傳統的背部按摩。此處的「龍」為「龍骨」，即為脊椎骨。","example":""},{"word":"作肉","pinyin":"zogˋ ngiugˋ","def":"長肉。 例如：你愛食加兜，正會作肉。","example":""},{"word":"作燒作熱","pinyin":"zogˋ seuˊ zogˋ ngied","def":"發燒、發燙之症狀。 例如：佢作燒作熱，遽啊帶佢去分先生看。","example":""},{"word":"作燒","pinyin":"zogˋ seuˊ","def":"發燒。亦可做「作燒作燒」。","example":""},{"word":"嘴毋轂","pinyin":"zoi mˇ gugˋ","def":"食慾不振，亦可說「無胃口」。 例如：阿公恁久嘴毋轂，食麼个都講毋好食。","example":""},{"word":"嘴囁囁動","pinyin":"zoi ngiabˋ ngiabˋ tungˊ","def":"（嘴巴）一開一合的樣子。 例如：阿公嘴囁囁動，毋知愛講麼个。","example":""},{"word":"轉骨","pinyin":"zonˋ gudˋ","def":"青春期發育的過程。 例如：細人仔轉骨，愛食較多兜仔。","example":""},{"word":"轉酒","pinyin":"zonˋ jiuˋ","def":"醉酒嘔吐，通常是喝了後座力強的酒。 例如：酒加食兜哪！轉酒个時節，你就知艱苦哩！","example":""},{"word":"長薯仔","pinyin":"zongˋ suˇ eˋ","def":"青春痘。 例如：你係發長薯仔毋好去挳佢，留疤會當媸。","example":""},{"word":"豬哥牙","pinyin":"zuˊ goˊ ngaˇ","def":"乳牙未脫，其旁所斜生的永久齒。 例如：係生著豬哥牙个人，愛去看牙科正好。","example":""},{"word":"豬嫲瘵【發死】","pinyin":"zuˊ maˇ caiˋ【bodˋ xiˋ】","def":"癲癇，俗稱羊癲瘋，是一種神經系統疾病，因腦部神經細胞異常放電，導致反覆發作的短暫抽搐或意識障礙。","example":""},{"word":"贅水","pinyin":"zui suiˋ","def":"身上某部位浮腫的樣子。 例如：若腳骨仰贅水贅水？有去分先生看無？","example":""},{"word":"挨生挨死","pinyin":"aiˊ sangˊ aiˊ xiˋ","def":"隱忍苟活、肯吃苦。 例如：越王句踐挨生挨死，就係為著國家个前途。 例如：阿爸阿姆挨生挨死，就係為著子女个前途。","example":""},{"word":"恁大神氣","pinyin":"anˋ tai siinˇ hi","def":"用這麼大的精神去理會。 例如：由在佢去，𠊎正無恁大神氣搭佢。","example":""},{"word":"半鹹淡","pinyin":"ban hamˇ tamˊ","def":"不鹹不淡的味道，喻對事物不專精，似懂非懂的情況。 例如：讀書讀到半桶水，學人煮菜又煮到半鹹淡，你愛仰結煞正好？","example":""},{"word":"噼核","pinyin":"biag hag","def":"氣極敗壞、氣炸了。","example":""},{"word":"蹦蹦跳","pinyin":"bangˋ bangˋ tiauˇ","def":"指惱怒而暴跳如雷的樣子。 例如：堵著有理講毋清个人，佢譴到蹦蹦跳。","example":""},{"word":"愊愊掣","pinyin":"bid bid cadˋ","def":"因心裡恐懼害怕而四肢發抖。 例如：佢分人講个古嚇著，驚到愊愊掣。","example":""},{"word":"起願","pinyin":"hiˋ ngien","def":"上癮。 例如：佢逐朝晨四點䟘床行路，日長月久行到起願吔。","example":""},{"word":"發痴驚（發豕驚）","pinyin":"bodˋ ciiˊ giangˊ (bodˋ siiˋ giangˊ)","def":"心裡發毛，無端的驚恐。 例如：佢半夜行過塚埔，緊行緊發痴驚。","example":""},{"word":"本心","pinyin":"bunˋ ximˊ","def":"原來的想法、心意。 例如：佢本心怕毋係恁樣，你莫想恁多哪！","example":""},{"word":"踩踩踏踏","pinyin":"caiˇ caiˇ tab tab","def":"拿不定主意，不知該如何下決定。 例如：佢在屋下踩踩踏踏，像有異重个心事樣仔。","example":""},{"word":"逞強逞惡","pinyin":"ciinˋ kiongˇ ciinˋ ogˋ","def":"強橫霸道不講理。 例如：該群鱸鰻仔逞強逞惡，實在係無王無法！","example":""},{"word":"澄心","pinyin":"ciinˇ ximˊ","def":"使心緒清淨澄明。 例如：你毋使緊張，等𠊎較澄心兜仔，正來簽字。","example":""},{"word":"腸仔毋直","pinyin":"congˇ eˋ mˇ ciid","def":"常用來說小孩子心情不愉快、鬧情緒的情況。 例如：限勢佢都腸仔毋直吔，莫緊撩佢，等下斯拐毋得恬吔。","example":""},{"word":"出水","pinyin":"cudˋ suiˋ","def":"出氣、遷怒；將水排出。 例如：佢奈冬瓜毋何，斯尋苦瓜出水。（諺） 例如：水粄仔放忒久，嗄出水吔，盡毋好食。","example":""},{"word":"打潑賴","pinyin":"daˋ padˋ lai","def":"故意耍賴。 例如：該隻細人仔異摝人，一下毋堵好就打潑賴。","example":""},{"word":"膽在在","pinyin":"damˋ cai cai","def":"表心無畏懼，亦可說「膽大大」。 例如：佢參加演講當多擺吔，故所這下上臺講話膽在在。","example":""},{"word":"擔當毋起","pinyin":"damˊ dongˊ mˇ hiˋ","def":"承擔不起，亦可說「受當毋起」。 例如：你講𠊎當慶又有才情，𠊎實在擔當毋起。","example":""},{"word":"知知","pinyin":"diˊ diˊ","def":"明明知道。 例如：佢心肚知知，還挑挑恁仔做，正經當無意思。","example":""},{"word":"知頭知尾","pinyin":"diˊ teuˇ diˊ miˊ","def":"從頭到尾都清楚。 例如：你明明知頭知尾，做麼个恬恬全毋講？","example":""},{"word":"知總","pinyin":"diˊ zungˋ","def":"深知、透澈瞭解，能掌握事理的關鍵。 例如：愛同人鬥股做生理，愛尋知總个人正較保險。","example":""},{"word":"頂願（適願）","pinyin":"dinˋ ngien (didˋ ngien)【dinˋ ngian】【didˋ ngian】","def":"滿足願望、過癮，較爽快。 例如：𠊎要求無多，兩罐高粱啉落去就頂願哩。","example":""},{"word":"當興","pinyin":"dongˊ him","def":"對於某事興致很高。 例如：阿舅當興蹶山，一有閒就湊伴去蹶。","example":""},{"word":"厄厄惻惻","pinyin":"edˋ edˋ zedˋ zedˋ","def":"鬱悶。 例如：𠊎心肝肚厄厄惻惻，想愛出去行行啊。","example":""},{"word":"壞癖","pinyin":"faiˋ piagˋ","def":"壞脾氣。 例如：佢麼个都毋會，加勢一下無順佢个意，斯拍桌拍凳，實在毋壁又壞癖。","example":""},{"word":"反想","pinyin":"fanˋ xiongˋ","def":"反思、反省。 例如：等得佢知好反想，吾鬚都白哩喲。 例如：十賭九輸，摎你講恁多擺吔，仰還毋知好反想？","example":""},{"word":"火屎燦天","pinyin":"foˋ siiˋ can tienˊ","def":"形容很生氣的樣子。另「火屎𤊶天」亦同義。 例如：佢上隻月分人倒會仔，譴到火屎燦天。","example":""},{"word":"歡喜靂天","pinyin":"fonˊ hiˋ lagˋ tienˊ","def":"形容非常歡喜。 例如：學生仔一到避暑，做下歡喜靂天去遶尞。","example":""},{"word":"苦嗒嗒仔","pinyin":"fuˋ dab dab eˋ","def":"形容味道很苦，近乎澀澀的。 例如：茶泡忒釅，食起來苦嗒嗒仔。","example":""},{"word":"苦丟丟仔","pinyin":"fuˋ diuˊ diuˊ eˋ","def":"形容味道很苦。 例如：苦丟丟仔个藥仔，吞就毋落。","example":""},{"word":"苦篤篤仔","pinyin":"fuˋ dugˋ dugˋ eˋ","def":"形容味道很苦。 例如：苦瓜苦篤篤仔，異多細人仔毋敢食。","example":""},{"word":"苦篤苦篤","pinyin":"fuˋ dugˋ fuˋ dugˋ","def":"形容味道有點苦。 例如：中藥生成會苦篤苦篤，愛忍一下仔，食落去就毋會哩！","example":""},{"word":"苦甘苦甘仔","pinyin":"fuˋ gamˊ fuˋ gamˊ eˋ","def":"由苦變甘的味道。 例如：青草茶苦甘苦甘仔，食吔盡退火。","example":""},{"word":"昏嗲昏嗲","pinyin":"funˇ deˇ funˇ deˇ","def":"可能因喝酒或其他非天生因素造成的頭昏腦脹。 例如：毋知幾多細倈人分該靚細妹仔迷到昏嗲昏嗲。","example":""},{"word":"昏嗲嗲仔","pinyin":"funˇ deˇ deˇ eˋ","def":"如醉如痴的樣子。 例如：佢食酒食到昏嗲嗲仔，行路斯打踜蹭。","example":""},{"word":"哽哽汩汩","pinyin":"gangˇ gangˇ gud gud","def":"不順暢，指說話或事情不順暢的樣子。 例如：景氣毋好，生理做到哽哽汩汩。 例如：你做麼个恁緊張？恁簡單个一句話乜講到哽哽汩汩。","example":""},{"word":"鹻鹻","pinyin":"giam giam","def":"水或湯微澀的口感。 例如：水質毋好，煮个湯鹻鹻，毋好食。 例如：莧菜煮湯無放油，食起來鹻鹻。","example":""},{"word":"驚撓【畏肢】","pinyin":"giangˊ neuˊ【vi ji】","def":"怕人捉弄搔癢。 例如：腳底同脅下驚撓，盡驚人撩弄撓癢。","example":""},{"word":"驚山","pinyin":"giangˊ sanˊ","def":"因環境陌生或孤單而心生恐懼，原詞為「驚生」，音變為「驚山」。 例如：佢在熟地碼做生理，講會驚山，麼儕信呢？","example":""},{"word":"驚心","pinyin":"giangˊ ximˊ","def":"戒慎恐懼，隨時警惕在心。 例如：阿光讀書有驚心，成績一直盡好。","example":""},{"word":"驚怯怯仔【驚潑潑仔】","pinyin":"giangˊ kab kab eˋ【giangˊ pad pad eˊ】","def":"非常驚恐害怕的樣子，指自己心裡的恐懼。 例如：去公司面試，毋使驚怯怯仔，係舌嫲打結就壞蹄哩！","example":""},{"word":"驚忸忸仔","pinyin":"giangˊ nug nug eˋ","def":"現場有讓其害怕的東西，有外在的東西讓其害怕。 例如：佢看啊著厥班導師就驚忸忸仔，敢有犯麼个錯係無？","example":""},{"word":"激著","pinyin":"gidˋ doˋ","def":"受到刺激。 例如：佢分阿明个打落激著，斯當打拚，事業做到盡成功。","example":""},{"word":"噭襤溼褸","pinyin":"gieu lamˇ siibˋ luiˋ","def":"哭溼衣襟，形容哭得一把眼淚一把鼻涕的樣子。 例如：厥盡好个朋友過身，佢噭到噭襤溼褸。","example":""},{"word":"噭豺豺仔（噭垂垂仔）","pinyin":"gieu saiˇ saiˇ eˋ(gieu suiˇ suiˇ eˋ)","def":"哭泣不止的樣子。 例如：阿民為著愛食糖仔就噭豺豺仔，毋過全無半息目汁。","example":""},{"word":"緊躁躁仔","pinyin":"ginˋ cau cau eˋ","def":"急躁的樣子。 例如：做事情愛定定仔來，毋好緊躁躁仔。","example":""},{"word":"腳底撓撓","pinyin":"giogˋ daiˋ neuˊ neuˊ【giogˋ daiˋ ngiauˊ ngiauˊ】","def":"因懼高而生的感覺。 例如：企在恁高个山頂看啊下，試著腳底撓撓。","example":""},{"word":"跔跔蹜蹜","pinyin":"giuˊ giuˊ suˇ suˇ","def":"畏縮不前的樣子。","example":""},{"word":"跔跔羞羞","pinyin":"giuˊ giuˊ xiuˊ xiuˊ","def":"畏縮怕羞的樣子。 例如：做事恁仔跔跔羞羞，愛仰仔做大事業？","example":""},{"word":"挶外外","pinyin":"giug ngoi ngoi","def":"漠不關心貌。 例如：大家恁無閒，你仰挶外外，毋肯來𢯭手？","example":""},{"word":"挶心","pinyin":"giug ximˊ","def":"為某事費盡心思或傷心懊惱。 例如：阿明毋讀書，爺哀為著佢，當挶心。","example":""},{"word":"挶心事","pinyin":"giug ximˊ sii","def":"工於心計、算計。 例如：佢專門挶心事，正會恁無人緣。","example":""},{"word":"合合上","pinyin":"hab hab songˊ","def":"對於心裡想要的事物急著想要或興致沖沖的樣子。 例如：客家炒肉兜啊出，大家都合合上搶等挾。 例如：𫣆兜毋好講啊著就合合上，愛多加考慮啊哩。","example":""},{"word":"鹹纖鹹纖","pinyin":"hamˇ xiamˊ hamˇ xiamˊ","def":"略帶鹹味。 例如：熱天鹹菜泡滾水食，鹹纖鹹纖，異做得。","example":""},{"word":"好蹀蹀仔","pinyin":"hau dia dia eˋ","def":"興致勃勃的樣子。 例如：你自家都吂知曉得無，就好蹀蹀仔緊應人。","example":""},{"word":"黑天","pinyin":"hedˋ tienˊ","def":"茫然、完全不懂。 例如：這問著𠊎，𠊎就黑天吔。","example":""},{"word":"含燒火𤊶","pinyin":"hemˇ seuˊ foˋ ladˋ","def":"遭日晒或灼傷感到刺痛，難以忍受的樣子。 例如：吾手分燒滾水熝著，這幾下日含燒火𤊶，當艱苦。","example":""},{"word":"喉嗹頭硬硬","pinyin":"heuˇ lienˇ teuˇ ngang ngang","def":"感到哽咽的樣子。 例如：看著這細人仔恁早就無阿姆，𠊎斯喉嗹頭硬硬。","example":""},{"word":"氣命","pinyin":"hi miang","def":"精神氣力。 例如：外甥仔食酒駛車畀判刑，講佢毋聽，無恁大氣命插佢。","example":""},{"word":"氣噴噴仔","pinyin":"hi pun pun eˋ","def":"氣呼呼，很生氣的樣子。 例如：你先坐下來，莫恁樣氣噴噴仔。","example":""},{"word":"棄嫌","pinyin":"hi hiamˇ","def":"因為厭惡而不願接近。 例如：你係無棄嫌，𠊎想紹介吾姪女分你做心臼。","example":""},{"word":"氣凹凹仔","pinyin":"hi ngiabˋ ngiabˋ eˇ","def":"有氣無力的樣子。 例如：平常無運動，走無兩下仔，就氣凹凹仔。","example":""},{"word":"氣嗙氣鼓","pinyin":"hi pangˇ hi guˋ","def":"形容很生氣的樣子。 例如：佢一轉到屋就氣嗙氣鼓，毋知麼人惹著佢？","example":""},{"word":"氣勃勃仔","pinyin":"hi pud pud eˋ","def":"氣呼呼的，形容非常生氣的樣子。 例如：字簿仔分老弟扯爛，想啊著佢就氣勃勃仔。","example":""},{"word":"起猴面","pinyin":"hiˋ heuˇ mien","def":"發飆，使性子。 例如：毋好同佢共下搞，動啊著就起猴面。","example":""},{"word":"興頭","pinyin":"him teuˇ","def":"興致正高、興味正濃。 例如：莫看佢恬恬毋講話，係講著騎自行車，厥興頭就來吔，比麼人都較有好講。","example":""},{"word":"䁯人【視人】","pinyin":"himˇ nginˇ【sii nginˇ】","def":"怒視人，用以表警示禁止之意。 例如：毋好亂動佢个東西，佢企在該緊䁯人哦！","example":""},{"word":"雄弸弸仔","pinyin":"hiungˇ bangˇ bangˇ eˋ","def":"精力充沛，躍躍欲試的樣子。 例如：這雞公雄弸弸仔，其他个雄雞仔全毋敢偎兼。 例如：阿明牯練擎重，練到雄弸弸仔。","example":""},{"word":"爽牙","pinyin":"songˋ ngaˇ","def":"吃起來很舒服，爽口。 例如：這餐廳个廚師煮出來个菜一等爽牙。","example":""},{"word":"異興","pinyin":"i him","def":"很有興趣。","example":""},{"word":"𢛟落落仔","pinyin":"ia lag lag eˋ","def":"灰心的樣子，帶有無可奈何感覺。 例如：聽著恁好个課長分人辭頭路，全課个人就𢛟落落仔無想做哩。","example":""},{"word":"一條線","pinyin":"idˋ tiauˇ xien","def":"喻專注於一事。 例如：講起讀書佢就懶頭懶頭，係講著搞，佢就一條線。","example":""},{"word":"蝓著","pinyin":"ieˇ doˋ","def":"氣著了、惹毛了。 例如：隔壁个阿三哥異多是非，阿爸蝓著吔，講下二擺無愛相行。","example":""},{"word":"蝓漦","pinyin":"ieˇ xiauˇ","def":"怒火中燒、感到火大。 例如：同佢做到恁多，嗄聽著佢講這兜話，盡蝓漦。","example":""},{"word":"有惹無𥍉（睨目毋起）","pinyin":"iuˊ ngiaˊ moˇ ngiabˋ (ne mugˋ mˇ hiˋ)","def":"連眨眼的力氣都沒有，比喻很疲累的樣子。 例如：佢下班轉夜，有惹無𥍉，連身都無洗就入間睡目哩。","example":""},{"word":"刻耐仔","pinyin":"kadˋ ngai eˋ","def":"艱苦忍耐地。 例如：因為上下班个需要，佢刻耐仔買一臺車仔，這駁仔錢愛省省仔用。","example":""},{"word":"欺藐","pinyin":"kiˊ meuˋ","def":"輕視、藐視，亦可說「鄙視」、「藐視」。 例如：毋好欺藐人，無定著下二擺你會求著佢。","example":""},{"word":"譴到胲滿肚飽","pinyin":"kienˋ do goiˊ manˊ duˋ bauˋ","def":"氣飽了；氣憤填膺。 例如：看厥倈仔歸日遊遊野野毋去尋事做，佢譴到胲滿肚飽。","example":""},{"word":"譴呲呲仔（譴腸閼胗）","pinyin":"kienˋ ziiˊ ziiˊ eˋ (kienˋ congˇ adˋ kinˊ)","def":"形容生氣的樣子。 例如：佢啊，異毋受人講，動啊著就譴呲呲仔掣等走。","example":""},{"word":"凝神","pinyin":"kienˇ siinˇ","def":"形容細心周到的意思。 例如：吾婆盡凝神，大細項下个東西，佢都收到盡好勢。","example":""},{"word":"欽服","pinyin":"kimˊ fug","def":"欽佩。 例如：阿叔在美國做教授，𠊎當欽服佢。","example":""},{"word":"罅無頭䌈（挱無頭䌈）","pinyin":"la moˇ teuˇ tagˋ (saˊ moˇ teuˇ tagˋ)","def":"摸不著頭緒。 例如：第一擺考客語高級認證，對題目罅無頭䌈無考過。","example":""},{"word":"啦歌哩曲","pinyin":"laˊ goˊ liˋ kiugˋ","def":"哼著歌曲，表心情愉快。 例如：這下麼个時節吔，貨當趕等愛出，毋好過啦歌哩曲哩。","example":""},{"word":"辣啾啾仔","pinyin":"lad jiuˊ jiuˊ eˋ","def":"很辣、極辣，亦可說「辣喳喳仔」。 例如：炒肉放恁多辣椒仔，食起來辣啾啾仔緊㐁舌嫲。","example":""},{"word":"懶頭（懶懶）","pinyin":"lanˊ/nanˊ teuˇ (lanˊ lanˊ/nanˊ nanˊ)","def":"意興闌珊。 例如：阿明做事情三分鐘熱度，做無幾久就懶頭吔。","example":""},{"word":"膦火著【膦火繃著】","pinyin":"linˋ foˋ cog【linˋ foˋ bang cog】","def":"火大，發怒。「膦火當著」表示正是憤怒時。 例如：等加一下佢氣火較消兜仔正來，這下佢膦火著，仙講就毋聽。","example":""},{"word":"靈靈","pinyin":"linˇ linˇ","def":"清醒不迷糊。 例如：阿旺伯公還盡健，耳公靈靈，人講麼个佢都知。","example":""},{"word":"六月芥菜","pinyin":"liugˋ ngied gie coi【liugˋ ngiad gie coi】","def":"假有心（歇）。比喻一個人虛情假意。冬天出產的芥菜，外表豐碩，菜的中央有芥菜心；農曆六月的芥菜，葉子雖也豐碩，實際上卻是沒有菜心的。","example":""},{"word":"落力","pinyin":"log lid","def":"興致高昂、賣力。 例如：做到落力个時節，連飯都毋使食。","example":""},{"word":"茫心","pinyin":"mangˇ ximˊ","def":"心不安、心神慌亂沒有主見，六神無主的感覺。 例如：佢受著恁大个打擊，歸隻人都茫心吔。","example":""},{"word":"貓挨癢（貓爪癢）","pinyin":"meu aiˊ iongˊ (meu zauˋ iongˊ)","def":"喻動作輕微，不痛不癢。 例如：細人仔力頭細，分佢打兩下仔，貓挨癢定定。","example":""},{"word":"尾擸擸仔【尾㘝㘝仔】","pinyin":"miˊ liabˋ liabˋ eˇ【miˊ ngiabˋ ngiabˋ eˊ】","def":"夾著尾巴的樣子，喻很失意。 例如：狗仔偷食分人咄一下，就尾擸擸仔走忒去。","example":""},{"word":"迷迷痴痴","pinyin":"miˇ miˇ ciiˊ ciiˊ","def":"因生病或沒睡好導致神智不清的樣子。 例如：阿清仔車禍過後，就變到迷迷痴痴，認人毋出。","example":""},{"word":"面挷挷仔","pinyin":"mien bangˊ bangˊ eˋ","def":"繃著臉，不高興的樣子。 例如：佢打早就面挷挷仔，毋知在該譴麼个？","example":""},{"word":"面惹惹仔","pinyin":"mien ngiaˊ ngiaˊ eˋ","def":"因理虧無法辯駁而悻悻然難為情的樣子。 例如：細人仔偷摘番檨，分人扭著罵，面惹惹仔遽遽走。","example":""},{"word":"面舐舐仔","pinyin":"mien seˊ seˊ eˋ","def":"厚著臉皮的樣子。 例如：阿明昨晡日正摎阿英相吵泌背，今晡日又面舐舐仔走來分佢請。","example":""},{"word":"面爪爪仔","pinyin":"mien zauˋ zauˋ eˇ","def":"臉色不和悅的樣子。 例如：開店人愛開容笑面，毋好面爪爪仔，無斯人會毋敢上門。","example":""},{"word":"無唉哉","pinyin":"moˇ aiˊ zaiˇ","def":"無費力氣或不覺痛癢，另言「無唉無哉」即為一動也不動，沒有反應。 例如：佢當發，出該兜錢定定，無唉哉。","example":""},{"word":"無空好囥【無空好庰】","pinyin":"moˇ kungˊ hoˋ kong【moˇ kangˊ hoˋ biang】","def":"原指無藏身之地，現喻無地自容；例「見笑到尋無空好囥」。","example":""},{"word":"無安無樂","pinyin":"moˇ onˊ moˇ log","def":"謂心情不定，不安樂。 例如：佢分頭路个事情搣到無安無樂，食睡就毋得。","example":""},{"word":"無聲無氣","pinyin":"moˇ sangˊ moˇ hi","def":"不出聲、悶不吭聲。 例如：無聲無氣就同人个東西拿走，會分人話著係賊仔。","example":""},{"word":"無頭無䌈","pinyin":"moˇ teuˇ moˇ tagˋ","def":"毫無頭緒。 例如：這件事恁複雜，無頭無䌈，毋知愛仰般處理正好？","example":""},{"word":"無心性【無心事】","pinyin":"moˇ ximˊ xiang【moˇ ximˊ sii】","def":"心情不好，沒心情做事，亦可說「無心無性」。 例如：阿明尋毋著頭路，連食飯都無心性。","example":""},{"word":"目凝凝仔","pinyin":"mugˋ kienˇ kienˇ eˋ","def":"眸子不動，眼神呆滯的樣子。 例如：歸桌个菜恁豐沛，佢還係目凝凝仔全無動筷仔。","example":""},{"word":"目𥍉鼻動（目𥍉鼻琢）","pinyin":"mugˋ ngiabˋ pi tungˊ (mugˋ ngiabˋ pi dog)","def":"眼眨鼻動，很有心思的樣子。 例如：看佢目𥍉鼻動，就知佢定著有麼个齣事！","example":""},{"word":"目澀澀仔","pinyin":"mugˋ sebˋ sebˋ eˇ","def":"眼睛痠澀疲累的樣子，亦有想睡意味。 例如：空氣毋好，目澀澀仔緊流目汁。 例如：恁夜吔！目澀澀仔想睡目，無愛看書哩！","example":""},{"word":"膩胲","pinyin":"ne goiˊ","def":"吃飽不想再吃，或吃膩了；表示吃到感覺很膩可用「試著畏胲」。 例如：連食幾下日便當，食到膩胲，看著就會驚。","example":""},{"word":"撓胲撓胲","pinyin":"neuˊ goiˊ neuˊ goiˊ","def":"很膩的感覺，亦可說「膩胲膩胲」。 例如：燜个豬肉忒肥，食起來撓胲撓胲。","example":""},{"word":"牙牙蛇蛇","pinyin":"ngaˇ ngaˇ saˇ saˇ","def":"嬉皮笑臉、鬧著玩的樣子。 例如：你啊！愛較正經兜仔！毋好恁樣牙牙蛇蛇。","example":""},{"word":"齧牙根","pinyin":"ngad ngaˇ ginˊ","def":"磨牙；或用以比喻忍受痛苦而堅持到底，意志堅定不移之意。 例如：就算日仔過到當苦，佢還係齧牙根忍等，毋同人借錢。","example":""},{"word":"𪘒𪘒愕愕","pinyin":"ngamˊ ngamˊ ngogˋ ngogˋ","def":"身體不平順，時好時壞。 例如：厥身體這駁仔𪘒𪘒愕愕，無異伸俥。","example":""},{"word":"額結結仔","pinyin":"ngiagˋ giedˋ giedˋ eˇ","def":"愁眉不展貌。 例如：叔姆在該愁厥倈仔个事情，歸日額結結仔。","example":""},{"word":"入文","pinyin":"ngib vunˇ","def":"專注、入神。 例如：佢看電視看到當入文，喊佢幾下到就無聽著。","example":""},{"word":"熱嘴","pinyin":"ngied zoi","def":"形容食物吃得很有味道，越吃越想吃，欲罷不能。 例如：這番豆當好食，緊食緊熱嘴。","example":""},{"word":"眼剷剷仔","pinyin":"ngienˋ canˋ canˋ eˋ","def":"眼神散失，瞳孔張大的樣子，為受驚嚇、失望或行將嚥氣時的表情。","example":""},{"word":"眼佛佛仔","pinyin":"ngienˋ fud fud eˋ","def":"睜眼注視的樣子，無可奈何不知所以貌。 例如：佢眼佛佛仔緊看桌項个雞肉盤，想食該支雞髀。","example":""},{"word":"眼桱桱仔","pinyin":"ngienˋ guangˊ guangˊ eˋ","def":"眼睛直視有所求的樣子。 例如：阿爸還眼桱桱仔吂死，你做倈仔个人，就緊逐愛分財產，正經係惜無用个。","example":""},{"word":"眼䁯䁯仔","pinyin":"ngienˋ himˇ himˇ eˋ","def":"怒目而視貌，可用於挑釁。 例如：阿萬叔逐擺就眼䁯䁯仔看人，細人仔根本毋敢同佢講話。","example":""},{"word":"眼擎擎仔","pinyin":"ngienˋ kiaˇ kiaˇ eˋ","def":"怒目而視的樣子。 例如：佢動啊著就眼擎擎仔，盡無人緣。","example":""},{"word":"眼確確仔","pinyin":"ngienˋ kogˋ kogˋ eˋ","def":"眼神乾涸，無精打采的樣子。 例如：佢一瘦，目珠窟就塌下去，眼確確仔，異毋好看。","example":""},{"word":"眼睚睚仔","pinyin":"ngienˋ ngaiˇ ngaiˇ eˋ","def":"形容不予理會的樣子。 例如：喊佢𢯭手做事，佢嗄眼睚睚仔，實在無結煞。","example":""},{"word":"眼豺豺仔","pinyin":"ngienˋ saiˇ saiˇ eˋ","def":"怒目視人的樣子。 例如：這細人仔盡惡，講佢兩句就眼豺豺仔，愛食忒人樣仔。","example":""},{"word":"臥臥到到","pinyin":"ngo ngo do do","def":"頭腦不清晰的樣子，屬短暫性的，可能是喝醉酒或生病所引起的狀態。 例如：該隻老阿伯講話臥臥到到，毋好全信。 例如：佢這幾下日無睡好，臥臥到到。","example":""},{"word":"呆呆","pinyin":"ngoiˇ ngoiˇ","def":"失神貌。 例如：佢一個人呆呆企在該，毋知在該想麼个？","example":""},{"word":"心肝當雄","pinyin":"ximˊ gonˊ dongˊ hiungˇ","def":"心懷大志。 例如：佢心肝當雄，無兩點錢，就想愛謀大事業。","example":""},{"word":"昂昂","pinyin":"ngongˇ ngongˇ","def":"昏暈的樣子。 例如：𠊎頭一擺坐蝲䗁型个雲霄飛車，分佢拂到昂昂，下來企都企毋核。","example":""},{"word":"怩忸","pinyin":"nid nug","def":"形容受到刺激後，身體或心理的瞬間反應。 例如：嬰兒仔聽著紙炮仔聲，著下驚，怩忸一下！","example":""},{"word":"妄想","pinyin":"nong xiongˋ","def":"不切實際的、非分的幻想或念頭。 例如：你啊！還係煞猛兜仔較贏哪！莫一日到暗妄想睡等就有錢賺。","example":""},{"word":"惡桀桀仔","pinyin":"ogˋ kied kied eˋ","def":"人凶惡的樣子。 例如：這野猴仔不受教，摎阿姆講話照樣惡桀桀仔。","example":""},{"word":"哀腸哀肚","pinyin":"oiˊ congˇ oiˊ duˋ","def":"肝腸寸斷，形容極端的哀傷。 例如：佢分車仔撞死，看著厥餔娘噭到哀腸哀肚，實在還衰過。","example":""},{"word":"疲爬極蹶","pinyin":"piˇ paˇ kid kied","def":"為爭生存而努力掙扎的樣子。另形容因心神不寧而不停的動或毛躁不安的樣子。 例如：阿福叔婆為著子女讀書，一生人疲爬極蹶，毋識有閒過。 例如：細人仔坐毋核，無幾久又開始疲爬極蹶。","example":""},{"word":"胚著","pinyin":"poiˊ doˋ","def":"猜到了。 例如：佢今晡日正經有來，斷真分𠊎胚著吔。","example":""},{"word":"胚想（料想）","pinyin":"poiˊ xiongˋ (liau xiongˋ)","def":"猜想。 例如：吂到个事情毋使緊胚想，船到灘頭水路開。","example":""},{"word":"青驚摝天","pinyin":"qiangˊ giangˊ lugˋ tienˊ","def":"非常害怕的樣子，屬於頂級的程度。 例如：佢在百貨公司偷掱東西，面緊走色，青驚摝天，嗄分保全捉著吔。","example":""},{"word":"七上八落","pinyin":"qidˋ songˊ badˋ log","def":"形容一個人的情緒起伏不定，忐忑不安的樣子。 例如：想著等下愛上臺表演，老妹心頭就七上八落。","example":""},{"word":"膝頭出目汁","pinyin":"qidˋ teuˇ cudˋ mugˋ ziibˋ","def":"膝蓋流眼淚，比喻傷心到極點。 例如：花精神考試也無考好，正式膝頭出目汁。","example":""},{"word":"澀澀","pinyin":"sebˋ sebˋ","def":"食物嚐起來粗糙不滑溜的樣子。 例如：食忒多酸酸澀澀个東西，會糟腸扡肚。 例如：這朳仔吂熟，食起來澀澀。","example":""},{"word":"澀咭咭仔","pinyin":"sebˋ gid gid eˋ","def":"很澀。 例如：柿仔青青，澀咭咭仔，食毋得。","example":""},{"word":"笑弛弛仔","pinyin":"seu ieˊ ieˊ eˋ","def":"笑呵呵，表嘴角微張，微笑的樣子。 例如：阿婆揇孫仔，暢到笑弛弛仔。","example":""},{"word":"小膽薄心","pinyin":"seuˋ damˋ pog ximˊ","def":"膽子小，心胸窄。 例如：該人小膽薄心，莫摎佢鬥股做頭路較贏。","example":""},{"word":"燒氣發冷氣","pinyin":"seuˊ hi bodˋ langˊ hi","def":"由歡喜變得一肚子氣。 例如：莫講較贏，無斯燒氣發冷氣，賺譴就有。","example":""},{"word":"愁勞博激","pinyin":"seuˇ loˇ bogˋ gidˋ","def":"既憂愁又激動。 例如：滿叔厥倈仔恁久無轉吔，佢逐日在該愁勞博激。","example":""},{"word":"愁勞勞仔（愁㤕㤕仔）","pinyin":"seuˇ loˇ loˇ eˋ (seuˇ dudˋ dudˋ eˇ)","def":"憂心忡忡。 例如：屋還吂揚瓦，聽著風搓愛來，阿伯愁勞勞仔。","example":""},{"word":"死刻刻仔（死板板仔）","pinyin":"xiˋ kadˋ kadˋ eˇ (xiˋ banˋ banˋ eˇ)","def":"指想法固執不會變通；亦可形容看起來沒有活力的樣子。 例如：想法毋好死刻刻仔，無飯毋會食麵係無？ 例如：佢像樹頭樣仔，面項無麼个表情，死刻刻仔在該企等。","example":""},{"word":"恃夠夠（恃定定）","pinyin":"sii gieu gieu (sii tin tin)","def":"因有依靠而很有把握。 例如：佢恃夠夠，有阿爸摎佢𢯭手，故所敢去買屋。","example":""},{"word":"神堵堵仔","pinyin":"siinˇ duˇ duˇ eˋ","def":"神色嚴肅，沒有笑臉。 例如：佢這儕人本成就神堵堵仔，你斯莫恅著佢在譴。","example":""},{"word":"心焦馬亂","pinyin":"ximˊ zeuˊ maˊ lon","def":"心中慌亂無主。 例如：佢這下心焦馬亂，講麼个佢乜無心性聽。","example":""},{"word":"心肝活活開","pinyin":"ximˊ gonˊ vaˋ vaˋ koiˊ","def":"心花朵朵開。 例如：看著貯金簿緊來緊多錢，佢就心肝活活開。","example":""},{"word":"酸藕","pinyin":"sonˊ ngiauˊ","def":"食物發酵時聞起來或嚐起來的酸味，亦可說「酸藕酸藕」。 例如：這豆腐鼻著有一息仔酸藕味，敢怕臭餿吔，莫食較贏。 例如：雞肉加鹽摎酸醋，半鹹淡又酸藕酸藕，當堵好食。","example":""},{"word":"酸心","pinyin":"sonˊ ximˊ","def":"傷心、心酸。 例如：厥姆好恬恬仔過身，佢痛到酸心。","example":""},{"word":"熟行","pinyin":"sug hongˇ","def":"熟悉此道。 例如：佢對耕田當熟行，你問佢定著毋會差。","example":""},{"word":"熟熟","pinyin":"sug sug","def":"很熟悉；受風吹、火炙、水侵而變軟。 例如：菜園肚个菜分日頭晒到熟熟。","example":""},{"word":"隨來隨鬥","pinyin":"suiˇ loiˇ suiˇ deu","def":"隨機應變。 例如：頭擺人唱山歌，全係隨來隨鬥，當生趣。","example":""},{"word":"淡濫淡濫","pinyin":"tamˊ lam tamˊ lam","def":"食物沒什麼味道。 例如：這項菜淡濫淡濫，毋好食。","example":""},{"word":"毒著","pinyin":"teu doˋ","def":"中毒，可用以比喻吃到怕了。 例如：頭擺人逐日食番薯，強強會毒著。","example":""},{"word":"頭犁犁仔","pinyin":"teuˇ laiˇ laiˇ eˋ","def":"低頭而無精打采的樣子；反義詞為「頭臥臥仔」。 例如：阿湖盡驚見笑，看著人就頭犁犁仔，毋敢看人。","example":""},{"word":"頭望望仔（頭勾勾仔）","pinyin":"teuˇ mong mong eˋ (teuˇ gieuˊ gieuˊ eˋ)","def":"引領企盼的樣子。 例如：佢頭望望仔緊看人在樹頂拗牛眼，看會分兜佢食無。","example":""},{"word":"頭那打箭格（頭那打尖）","pinyin":"teuˇ naˇ daˋ jien gagˋ (teuˇ naˇ daˋ jiamˊ)","def":"思維鑽入牛角尖，無法轉圜。","example":""},{"word":"頭鬞髻披","pinyin":"teuˇ nungˇ gi paiˊ","def":"頭髮蓬鬆雜亂，落魄無神的樣子。 例如：佢恁久尋無頭路，頭鬞髻披，看著當落喪。","example":""},{"word":"悿悿","pinyin":"tiamˋ tiamˋ","def":"疲憊的樣子。 例如：逐日渡兩個細人仔，就摎佢搣到悿悿咧。","example":""},{"word":"悿漬漬仔","pinyin":"tiamˋ jid jid eˋ","def":"疲累的樣子。 例如：逐日上班轉到屋下就悿漬漬仔，麼个都毋想停動。","example":""},{"word":"甜漬漬仔","pinyin":"tiamˇ jid jid eˋ","def":"味道很甜的樣子。 例如：甜柿甜漬漬仔、酸柑酸丟丟仔，毋過好食个人盡多。","example":""},{"word":"天轉笠嫲花","pinyin":"tienˊ zonˋ libˋ maˇ faˊ","def":"喻得意快樂，逍遙無拘束的樣子。 例如：阿俊現時單身，錢有身體又好，正經係天轉笠嫲花，由在佢愛東就東愛西就西。","example":""},{"word":"暢蹀蹀仔","pinyin":"tiong dia dia eˋ","def":"形容高興，且帶點得意的樣子。 例如：細人仔分著一支糖仔，暢蹀蹀仔拿等轉。","example":""},{"word":"道嘆","pinyin":"to tan","def":"感嘆，怨嘆。 例如：阿婆成時會道嘆，後生時節當做又賺無好食。","example":""},{"word":"痛腸","pinyin":"tung congˇ","def":"形容非常傷心痛苦。 例如：該條烏狗仔佢畜好多年吔，好恬恬消忒，難怪佢恁痛腸。","example":""},{"word":"痛㸐㸐仔","pinyin":"tung nad nad eˋ","def":"形容很痛心。 例如：看著孫仔跌倒，阿公心肝肚痛㸐㸐仔。","example":""},{"word":"痛難【難痛】","pinyin":"tung nan【nan tung】","def":"病痛災難。 例如：無法度！佢怕生成就係有這隻痛難愛受。","example":""},{"word":"痛切","pinyin":"tung qiedˋ","def":"形容很沉痛。 例如：無看著厥姆最後一面，莫怪佢噭到恁痛切。","example":""},{"word":"歪怪【歪格】","pinyin":"vaiˊ guai【vaiˊ giedˋ】","def":"自己不需要，看見他人有也想要有的心態。 例如：問佢該下講佢還飽飽毋想食，這下看人食到當好食，又講愛食，盡歪怪。","example":""},{"word":"萬望","pinyin":"van mong","def":"殷切希望。 例如：吾倈仔新入若公司，萬望你來牽成佢。","example":""},{"word":"目眡眡","pinyin":"mugˋ seˋ seˋ","def":"眼睛沒精神的樣子。 例如：打早就目眡眡，昨暗晡無睡係無？","example":""},{"word":"畏畏","pinyin":"vi vi","def":"擔心害怕而不敢向前的樣子。吃過多的東西而生噁心害怕之意。 例如：肥豬肉食忒多，試著畏畏。","example":""},{"word":"慍慍悴悴","pinyin":"vudˋ vudˋ zudˋ zudˋ","def":"悶悶不樂。 例如：佢摎細妹朋友斷情吔，透日慍慍悴悴。","example":""},{"word":"死犁犁仔","pinyin":"xiˋ laiˇ laiˇ eˋ","def":"俗語說：「生犁犁，死犁犁；講麼个，都會喈」，取「死犁犁仔」表示推託事情，裝做無精打采的樣子。 例如：阿順仔今晡日仰看起來死犁犁仔樣仔，毋知係毋係身體有麼个問題？","example":""},{"word":"惜花連盆","pinyin":"xiagˋ faˊ lienˇ punˇ","def":"愛屋及烏，源自「惜花連盆，惜子連孫」。","example":""},{"word":"醒睡","pinyin":"xiangˋ soi","def":"睡覺時警覺性高。 例如：阿光當醒睡，厥餔娘正翻下身定定，佢就醒吔。","example":""},{"word":"醒水【水水】","pinyin":"xiangˋ suiˋ【suiˋ suiˋ】","def":"形容蒸粄未全熟，表面留有凝水的樣貌。 例如：蒸粄个時間係吂到就掀鑊蓋，粄仔就會醒水醒水毋好食。","example":""},{"word":"醒醒","pinyin":"xiangˋ xiangˋ","def":"米食菜餚未熟透貌。 例如：飯還醒醒，吂熻熟。","example":""},{"word":"心在在","pinyin":"ximˊ cai cai","def":"內心安閒自在。 例如：演講比賽係有準備就心在在，係無準備就心躁躁。","example":""},{"word":"心躁躁","pinyin":"ximˊ cau cau","def":"心煩不安的樣子。 例如：猴哥性，心躁躁，做毋成大事。","example":""},{"word":"心寒膽顫","pinyin":"ximˊ honˇ damˋ zunˊ","def":"心驚膽顫。 例如：見想著該件事情，𠊎就心寒膽顫。","example":""},{"word":"心野野仔","pinyin":"ximˊ iaˊ iaˊ eˋ【ximˊ iaˊ iaˊ eˊ】","def":"不能定下心來的樣子。 例如：喊佢讀書，佢嗄心野野仔總係想愛出去搞。","example":""},{"word":"心糟糟","pinyin":"ximˊ zoˊ zoˊ","def":"腸胃油分不足的樣子。 例如：藥仔食多，油氣毋足，試著心糟糟。","example":""},{"word":"心頭拶拶","pinyin":"ximˊ teuˇ zad zad","def":"形容人心中鬱結，心情不開朗的樣子。 例如：恁多災難連續發生，大家都感覺心頭拶拶。","example":""},{"word":"信仃仃仔","pinyin":"xin dangˇ dangˇ eˋ","def":"確信不移。 例如：算命仙講个話就信仃仃仔，爺哀講个話就挶毋聽。","example":""},{"word":"測毋著","pinyin":"zedˋ mˇ doˋ","def":"預測不到。 例如：佢煮飯煮恁久吔，愛放幾多水，到今還測毋著，實在無結煞。","example":""},{"word":"照本心","pinyin":"zeu bunˋ ximˊ","def":"憑善良本性。 例如：做人愛照本心，毋好做違反良心个事情。","example":""},{"word":"作躁","pinyin":"zogˋ cau","def":"鬼神使人心神不寧。 例如：恁久當無順，毋知係阿公婆作躁無？","example":""},{"word":"轉想","pinyin":"zonˋ xiongˋ","def":"轉變想法。 例如：講講揫恁多，你自家去轉想看啊，愛仰般做正好。 例如：佢坐管仔15年出來，歲數大吔，應該會轉想吔。","example":""},{"word":"專專","pinyin":"zonˊ zonˊ","def":"專一地，執意地。 例如：阿仙哥个魚箱仔肚項麼个就無，專專畜該河壩蝦，大大細細怕有歸百隻。","example":""},{"word":"豬肚面","pinyin":"zuˊ duˋ mien","def":"形容人臉色變化哭笑不定，亦有情緒不穩定之意；常說「豬肚面時時變」，亦有說「春天面時時變」。 例如：這人豬肚面，動啊著就變面，莫相行較贏。","example":""},{"word":"死鹹膽（死鹽膽）","pinyin":"xiˋ hamˇ damˋ (xiˋ iamˇ damˋ)","def":"很鹹。 例如：這鑊豬肉炆到死鹹膽，食吔會緊灌茶哦！","example":""},{"word":"堪毋起","pinyin":"kamˊ mˇ hiˋ","def":"承擔不起。","example":""},{"word":"唉唉唷唷","pinyin":"aiˊ aiˊ ioˇ ioˇ","def":"呻吟聲的狀聲詞。 例如：喊佢莫做又自家好做，做啊去又唉唉唷唷緊呻。","example":""},{"word":"挨身","pinyin":"aiˊ siinˊ","def":"側著身子；擦身。 例如：這片當狹，愛挨身正過得。","example":""},{"word":"盦盦覆","pinyin":"amˋ amˋ pugˋ","def":"俯臥。 例如：嬰兒仔毋好盦盦覆睡，驚會無法度敨氣。","example":""},{"word":"掩磡","pinyin":"amˋ kamˋ","def":"掩藏，隱瞞事跡。 例如：較仰仔掩磡，包尾共樣騙毋過手。","example":""},{"word":"拗腳骨","pinyin":"auˋ giogˋ gudˋ","def":"本指折斷別人的骨頭，引申為斷了人的去路，亦可說「拗人腳骨」。","example":""},{"word":"跋起跋落","pinyin":"bagˋ hiˋ bagˋ log","def":"爬上爬下，喻操勞辛苦。","example":""},{"word":"跋起腳走","pinyin":"bagˋ hiˋ giogˋ zeuˋ","def":"拔腿快跑。 例如：佢遠遠看著警察行過來，攤仔赴毋掣收，跈等跋起腳走。","example":""},{"word":"擘嘴擘鼻","pinyin":"bagˋ zoi bagˋ pi","def":"不斷的打哈欠，形容尚未睡醒或極為疲倦的樣子。 例如：𠊎昨暗晡睡毋落覺，今晡日歸日擘嘴擘鼻。","example":""},{"word":"扳頭揇頸","pinyin":"banˊ teuˇ namˋ giangˋ","def":"勾肩搭背，形容感情親密，關係深厚。 例如：佢兩儕當相好，長透扳頭揇頸。","example":""},{"word":"挷毛","pinyin":"bangˊ moˊ","def":"拔毛，引申為出錢。 例如：愛喊佢捐錢，就像愛摎佢挷毛樣。 例如：聽講，八月半㓾鴨仔愛先灌酒，挷毛正較好挷。","example":""},{"word":"包包㘝㘝","pinyin":"bauˊ bauˊ ngiabˋ ngiabˋ","def":"偷偷摸摸地藏東西。 例如：看佢包包㘝㘝，毋知偷囥麼个東西？","example":""},{"word":"煏","pinyin":"bedˋ","def":"靠近熱源。例「煏燥來」。 例如：買轉來个細尾魚仔，愛用細火煏畀燥赤來，正會香酥好食。","example":""},{"word":"壁竳","pinyin":"biag denˇ","def":"形容如牆壁一般的直立著，引申為筆挺的樣子。 例如：佢企到壁竳，恬恬仔聽阿爸講道理。","example":""},{"word":"抨抨頓頓","pinyin":"biangˊ biangˊ dun dun","def":"以摔器物來表達心中不滿的情緒。 例如：佢分阿爸罵，譴到拿著東西就抨抨頓頓。","example":""},{"word":"嗶嗶跳","pinyin":"bid bid tiauˇ","def":"蹦蹦跳跳，活潑有精神的樣子。 例如：阿明領著矺年錢，就暢到嗶嗶跳。 例如：這尾魚仔正釣啊著，還嗶嗶跳，捉都捉毋核。","example":""},{"word":"湢瀉【直瀉】","pinyin":"bid xia【ciid xia】","def":"落荒而逃、開溜。 例如：正吩咐啊忒事情，頭斡啊轉，阿明嗄湢瀉哩！","example":""},{"word":"貶轉來","pinyin":"bienˋ zonˋ loiˇ","def":"翻回來、翻面；徹底。例「食到貶轉來」、「搞到貶轉來」。","example":""},{"word":"奮奮綻【奮奮腦綻】","pinyin":"binˋ binˋ can【binˋ binˋ noˋ can】","def":"一直想掙脫的樣子。 例如：該隻細人仔毋聽講，分厥爸打到奮奮綻。","example":""},{"word":"奮命","pinyin":"binˋ miang","def":"垂死的掙扎。 例如：老鼠仔分人个藥仔毒著，這下在鐵籠仔裡肚奮命。","example":""},{"word":"摒屎","pinyin":"binˋ siiˋ","def":"解便後以器物擦屁股。 例如：頭擺个人生活較無恁利便，無衛生紙，愛用竹摒仔摒屎。","example":""},{"word":"踣踣跌","pinyin":"boˇ boˇ diedˋ","def":"頻頻跌倒。 例如：正學行个細人仔，輒常八字腳踣踣跌。","example":""},{"word":"博噎毋轉","pinyin":"bogˋ ed mˇ zonˋ","def":"泣不成聲。 例如：看佢噭到博噎毋轉，毋知發生麼个事情？","example":""},{"word":"碰著（挨著）","pinyin":"bongˇ doˋ (aiˊ doˋ)","def":"擦撞到。 例如：阿明駛車駛忒兼，無細義碰著路脣个車仔。","example":""},{"word":"哱","pinyin":"bud","def":"湧出。例「哱波」，指泡沫湧出。","example":""},{"word":"抔出去","pinyin":"budˋ cudˋ hi【vudˋ cudˋ hi】","def":"轟出；以手捧物出去。 例如：講這無搭無碓盡得人惱，等一下仔就分人抔出去。","example":""},{"word":"岔走","pinyin":"ca zeuˋ","def":"走分岔的路，引申為脫離主軸之意。 例如：線愛畫正來，毋好分線岔走。 例如：演講有演講个主題，岔走就會扣分。","example":""},{"word":"捙","pinyin":"caˊ","def":"指由下往向上提起。 例如：阿明今晡日著條新褲，看佢見企有一站仔，就緊捙褲頭，敢怕係忒冗會落下去。","example":""},{"word":"赤腳嫲踏","pinyin":"cagˋ giogˋ maˊ dab","def":"赤腳，光著腳。 例如：蒔田个人大部分都係赤腳嫲踏。","example":""},{"word":"攙等","pinyin":"camˊ denˋ","def":"以手掌撐著。 例如：細人仔當在學爬，輒輒手攙等，頭那探起來看人。","example":""},{"word":"攙人","pinyin":"camˊ nginˇ","def":"向人身上撲去。 例如：狗仔看著主人，緊攙人。","example":""},{"word":"剷（劖）","pinyin":"canˋ (camˇ)","def":"被尖物刺及。 例如：分筅剷著，愛遽遽用針挑出來。","example":""},{"word":"綻","pinyin":"can","def":"由反方向快速猛力剝下，例如「同葉仔綻下來」即為將葉子除去、「衫褲綻淨淨」即衣服剝光光。","example":""},{"word":"晟","pinyin":"cangˇ","def":"持物以眼對著光源檢視。 例如：阿婆同雞卵拿到日頭下晟一下，看精抑冇？","example":""},{"word":"躁光","pinyin":"cau gongˊ","def":"原指小孩天一亮就醒，後形容一早就有所動作的小孩，多指人過動、坐不住，一早就動個不停；「躁光狗」、「躁光蟲」則表過動兒。","example":""},{"word":"呻","pinyin":"cenˊ","def":"呻吟。 例如：後生人堵著困難毋好恁會呻，志氣會消耗忒。","example":""},{"word":"種觔斗","pinyin":"zung kin deuˋ【zung gin deuˋ 】","def":"跌倒往前翻滾。","example":""},{"word":"層高","pinyin":"cenˇ goˊ","def":"疊高。 例如：鑊仔買買揫恁多，係無層高來，強強會無位好放。","example":""},{"word":"層矺二三【層三隔四】","pinyin":"cenˇ zagˋ ngi samˊ【cenˇ samˊ gagˋ xi】","def":"層層積疊。 例如：新貨、舊貨層矺二三堆堆揫共下，係無整理起來，有兜貨就會放到過期。","example":""},{"word":"層上去","pinyin":"cenˇ songˊ hi","def":"疊高上去。 例如：較賁个被摺好來，層上去放，寒天正尋得著來蓋。","example":""},{"word":"湊添","pinyin":"ceu tiamˊ","def":"加多一點，有補足之意味。 例如：阿哥買車仔還欠幾下萬銀，阿爸講愛拿兜錢分佢湊添。","example":""},{"word":"沉水","pinyin":"ciim suiˋ","def":"用外力把人或物推入、浸入水中。 例如：釣魚仔个鉛子忒輕，毋會沉水，釣毋著魚。","example":""},{"word":"挫溜皮","pinyin":"co liu piˇ","def":"與外物磨擦使得破皮或撕裂傷，亦可說「鑪溜皮」。","example":""},{"word":"座酒【沾酒】","pinyin":"co jiuˋ【demˊ jiuˋ】","def":"以熱水隔水加熱溫酒。 例如：寒天時，阿公暗晡頭食飯前，總會先座酒畀燒正食。","example":""},{"word":"串上串下（躘上躘下）","pinyin":"con songˊ con haˊ (liungˇ songˊ liungˊ haˊ)","def":"來去穿梭自如。 例如：禾串飽熟吔，禾鷝仔煞猛在田坵肚串上串下，仰結煞正好哪！","example":""},{"word":"抽掣","pinyin":"cuˊ cadˋ","def":"因為哭泣而身子抽搐的樣子；形容故意離開不做。 例如：佢毋知為著麼个事情，噭到緊抽掣。 例如：阿哥分阿爸唸，抽掣毋𢯭手做事。","example":""},{"word":"抽胲另命","pinyin":"cuˊ goiˊ nang miang","def":"聲嘶力竭。例如「噭到抽胲另命」。","example":""},{"word":"搐","pinyin":"cug","def":"將物體上下抖動。例如「搐麵」、「搐籤筒」、「搐衫褲」。 例如：衫褲項有頭那毛，拿來搐搐啊！","example":""},{"word":"搐上搐下","pinyin":"cug songˊ cug haˊ","def":"跑上跑下。 例如：阿美著一領新衫，滿哪搐上搐下，驚人無看著樣仔。","example":""},{"word":"伸俥","pinyin":"cunˊ caˊ","def":"理清楚、弄平整，可用於衣服，主要用事情上。 例如：這筆生理問題恁多，搣毋得伸俥。","example":""},{"word":"伸懶筋","pinyin":"cunˊ lanˊ/nanˊ ginˊ","def":"伸懶腰，舒活筋骨。 例如：你歸朝晨緊擘嘴又緊伸懶筋，敢係昨暗晡無睡好？","example":""},{"word":"打暗摸","pinyin":"daˋ am moˊ","def":"在暗中摸索東西，引申為在黑暗中工作。 例如：好恬恬仔嗄停電，歸屋下人輪等打暗摸食飯。","example":""},{"word":"打竳","pinyin":"daˋ denˊ","def":"小孩學站立。 例如：厥姪仔當在該學打竳。","example":""},{"word":"打腳偏","pinyin":"daˋ giogˋ pienˊ","def":"行走時，瞬間腳力不支，偏頗搖晃，屬於短暫性，且可以立即回復走正。 例如：食酒醉个人，目珠起赤砂，行路打腳偏，嘴項還緊講佢無醉。","example":""},{"word":"打環車（打翻車）","pinyin":"daˋ kuanˇ caˊ (daˋ fanˇ caˊ)","def":"側滾翻，亦可說「打拌車」。 例如：打環車進前愛先暖身一下，正毋會著傷。","example":""},{"word":"打卵退","pinyin":"daˋ lonˋ tui","def":"喻後退、退縮。 例如：還發冷！講好天光日愛去抗議，結果今晡日佢就打卵退。","example":""},{"word":"打衊嘴","pinyin":"daˋ med zoi【daˋ me zoi】","def":"弄髒嘴巴，常用於比喻食物太少。 例如：若糖仔有恁多，正分𠊎恁多仔定定，打衊嘴就有。","example":""},{"word":"打衊","pinyin":"daˋ med【daˋ me】","def":"弄髒；沾惹到。例「打衊手」。","example":""},{"word":"打盦覆","pinyin":"daˋ amˋ pugˋ","def":"趴著。例「打盦覆睡」則為趴睡。","example":""},{"word":"㐁舌","pinyin":"teˋ sad","def":"有意識地使用舌頭用力接觸物體。","example":""},{"word":"上上肩","pinyin":"songˋ songˊ gienˊ","def":"將東西放上肩膀。","example":""},{"word":"貼蓆","pinyin":"dabˋ qiag","def":"原指緊貼著草蓆就寢，現指上床就寢。 例如：阿連哥做事做到當悿，食飽一貼蓆，就睡忒吔。 例如：昨暗晡老弟身無貼蓆，歸夜無睡，毋知在該無閒麼个？","example":""},{"word":"帶行帶走","pinyin":"dai hangˇ dai zeuˋ","def":"指連走帶跑。 例如：看等車門就愛關吔，該後生人帶行帶走，差一息仔赴毋著。","example":""},{"word":"探頭","pinyin":"damˊ teuˇ","def":"把頭伸出去。 例如：坐車仔，毋好對窗仔探頭出去，當危險。","example":""},{"word":"著著屎【膏著屎】","pinyin":"dauˇ doˋ siiˋ【goˇ doˋ siiˋ】","def":"沾到大便；招致不必要的麻煩。 例如：這嬰兒仔盡愛淨俐，屎胐一著著屎就毋肯。 例如：你見擺都好心同佢𢯭手，這擺嗄著著屎，收尾就罅擺哩。","example":""},{"word":"沾水","pinyin":"demˊ suiˋ","def":"物體貼近水面，輕微的沾點水。 例如：阿爸去河壩戽魚，無注意跍忒低，屎胐沾水沾到溼溼。","example":""},{"word":"竳竳企【釘釘企】","pinyin":"denˇ denˇ kiˊ【dangˊ dangˊ kiˊ】","def":"直立站著，亦可說「企竳竳」。 例如：小學生參加升旗典禮，竳竳企毋敢停動。","example":""},{"word":"兜腳","pinyin":"deuˊ giogˋ","def":"抓抬別人的腳，讓人站不穩，引申為抓出缺點。 例如：愛做就做好來，係儘採做，到時斯會分人兜腳。","example":""},{"word":"蹀蹀","pinyin":"diaˊ dia","def":"比喻小孩走路不穩貌。 例如：細人仔學行路，阿公在頭前緊講「蹀蹀、蹀蹀」，喊佢過來。","example":""},{"word":"蹀上蹀下（蹀來蹀去）","pinyin":"diaˊ songˊ diaˊ haˊ (diaˊ loiˇ diaˊ hi)","def":"來回走動。 例如：你歸日仔蹀上蹀下，仰毋使讀書？","example":""},{"word":"𫟧𫟧轉","pinyin":"dinˊ dinˊ zonˋ","def":"來回奔波，團團轉。 例如：愛喊人買麼个做一擺講，莫搣到人𫟧𫟧轉。 例如：𠊎𫟧𫟧轉都尋透吔，還係毋記得吾車仔停在哪？","example":""},{"word":"跺","pinyin":"dioˇ","def":"以腳用力踩踏。例如「跺腳」、「跺鹹菜」。","example":""},{"word":"潗出","pinyin":"xib cudˋ","def":"水湧出或滲出的樣子。 例如：一開始矺粄个米漿，就會看著有水潗出。","example":""},{"word":"打閹雞行","pinyin":"daˋ iamˊ gieˊ hangˇ","def":"倒立行走。","example":""},{"word":"揬著","pinyin":"dudˋ doˋ","def":"碰觸到。 例如：這人公仔放在恁高个地方，係分人揬著會橫下來。","example":""},{"word":"剢冰","pinyin":"dug benˊ","def":"鑿冰。 例如：冰雕比賽選手用鏨仔剢冰，雕出各種樣式个作品。","example":""},{"word":"挩","pinyin":"duiˋ","def":"瞬間拉扯。例如「這線挩分佢斷」。","example":""},{"word":"頓齊來","pinyin":"dun ceˇ loiˇ","def":"把整束或整疊的東西在平面上整頓使一端齊平。 例如：書頓齊來放桌項，看起來就較淨俐。","example":""},{"word":"頓井","pinyin":"dun jiangˋ","def":"鑿井。又「頓空仔」即鑿洞。","example":""},{"word":"頓恬","pinyin":"dunˋ diamˊ","def":"（自行進中之狀態）停止、中止。 例如：看著先生落來，學生仔通體頓恬，無半息聲說。 例如：區間快車在較細个車頭無頓恬。","example":""},{"word":"撎撎共下【擳擳共下】","pinyin":"edˋ edˋ kiung ha【jied jied kiung ha】","def":"放置、堆積在一起。 例如：東西毋分類，麼个就撎撎共下，還毋係愛整理過。","example":""},{"word":"揞泥","pinyin":"emˊ naiˇ","def":"拿土掩蓋。 例如：種樹仔愛揞泥固定樹頭，正會生根發芽。","example":""},{"word":"毆","pinyin":"euˋ","def":"用棍棒大力揮打。 例如：佢食酒醉，擎等棍仔儘採毆人。","example":""},{"word":"翻身轉側","pinyin":"fanˊ siinˊ zonˋ zedˋ","def":"睡覺時翻身。","example":""},{"word":"㧒忒【㧒核】","pinyin":"fidˋ tedˋ【fidˋ hedˋ】","def":"丟棄、扔掉。","example":""},{"word":"呼呼碾【綑綑腦碾】","pinyin":"fu fu zan【kunˋ kunˋ noˋ zan】","def":"在地上打滾。 例如：佢毋知食著麼个，肚痛到在地泥呼呼碾。","example":""},{"word":"扶扶插插","pinyin":"fuˇ fuˇ cabˋ cabˋ/puˇ puˇ cabˋ cabˋ","def":"形容走路踉蹌，需要人扶持。 例如：老人家腳無力，上下都愛人扶扶插插，實在毋方便。","example":""},{"word":"咈淨淨","pinyin":"fud qiang qiang","def":"一口氣吃光光。 例如：佢歸日仔無食，歸盤雞肉分佢自家一儕咈淨淨。","example":""},{"word":"燻","pinyin":"fun【hiunˊ】","def":"以煙霧燻。如「燻蚊仔」、「用煙來燻」。 例如：因爭香火當旺，廟項神像个面全部燻到烏烏。","example":""},{"word":"燻燥","pinyin":"fun zauˊ【hiunˊ zauˊ】","def":"以煙、火燻乾。 例如：菸葉愛用火燻燥來。","example":""},{"word":"覂","pinyin":"fungˋ","def":"用手背把東西用力推開，如「覂淨淨」意即為推光光。亦有翻覆之義，如「覂忒」意即翻倒。","example":""},{"word":"頸鋸鋸仔","pinyin":"giangˋ gi gi eˋ","def":"脖子長長的，形容脖子因負擔太重而緊繃的樣子。 例如：該水忒重，𠊎㧡到頸鋸鋸仔。","example":""},{"word":"𠗻冰","pinyin":"gien benˊ","def":"以冰塊接觸物體。 例如：市場賣个海產定著愛𠗻冰，正毋會壞忒。","example":""},{"word":"𠗻冷水","pinyin":"gien langˊ suiˋ","def":"接觸冷水使之冷卻。 例如：炒菜熱鑊時節，係毋堵好手㸐著鑊頭，愛遽啊𠗻冷水，正毋會起膘。","example":""},{"word":"𠗻人","pinyin":"gien nginˇ","def":"以冷物碰觸人。 例如：恁寒个天，毋好拿冰个東西𠗻人。","example":""},{"word":"揀揀擇擇","pinyin":"gienˋ gienˋ tog tog","def":"挑三揀四。 例如：逐粒柑仔都平大平靚，毋使揀揀擇擇，做下都當好食。 例如：佢買東西揀揀擇擇，花當多時間。","example":""},{"word":"奸來奸去","pinyin":"gienˊ loiˇ gienˊ hi","def":"形容互相推諉、不願接受的樣子。 例如：見擺講著顧爺哀，兩兄弟就奸來奸去，實在還冤枉。","example":""},{"word":"緊唊","pinyin":"ginˋ giab","def":"形容說個不停。 例如：阿明嫂在吾耳公脣緊唊，𠊎斯恬恬緊聽。","example":""},{"word":"跏","pinyin":"gioˊ","def":"肢體彎曲。如「跏落去」表腳軟癱倒，「跏等」表身體蜷曲著。 例如：阿伯公行路行行仔嗄跏落去，毋知做麼个？","example":""},{"word":"腳跔跔","pinyin":"giogˋ giuˊ giuˊ","def":"縮曲著腳，比喻怕死沒膽量。","example":""},{"word":"挶力【使暗力】","pinyin":"giug lid【siiˋ am lid】","def":"使勁用力。 例如：挷大索个時節，大家愛挶力。","example":""},{"word":"過火","pinyin":"go foˋ","def":"在炭火上踏過、跨過的避邪、去穢儀式。","example":""},{"word":"過水","pinyin":"go suiˋ","def":"在水裡浸泡過。 例如：該花菜過水一下，就做得撈起來準備煮。","example":""},{"word":"擱水","pinyin":"gogˋ suiˋ","def":"擋住水。 例如：雨落毋會停腳，家家戶戶疊沙包擱水。","example":""},{"word":"槓鼻","pinyin":"gong pi","def":"以手臂橫向擦鼻涕。 例如：毋好用手槓鼻，去拿兩張仔衛生紙來擤擤啊！","example":""},{"word":"槓忒【畫核】","pinyin":"gong tedˋ【vag hedˋ】","def":"劃線條以示標記或刪除。 例如：這寫毋著無相干，直接槓忒佢，過撍若印仔就做得。","example":""},{"word":"鼓落去","pinyin":"guˋ log hi","def":"刺進去，指用較細長的針，刺得較深入。 例如：佢當驚注射，針仔還吂鼓落去，佢就噭到大嫲聲。","example":""},{"word":"慣戰","pinyin":"guan zan","def":"習慣。 例如：褲頭綻綻，各人慣戰。（諺）","example":""},{"word":"摑頭那【砉頭那】","pinyin":"gued teuˇ naˇ【guag teuˇ naˇ】","def":"以指節處敲打他人頭部，用以制止不當的行為。 例如：阿祥緊拿樹奶仔射人，分厥爸摑頭那。","example":""},{"word":"汩汩滾","pinyin":"gug gug gunˋ","def":"大口喝水時，水聲咕嚕咕嚕的樣子。 例如：佢嘴當渴，就看佢一碗公水汩汩滾，一下就啉忒。","example":""},{"word":"汩落去","pinyin":"gug log hi","def":"大口喝下去，用於飲用液體。 例如：食慢兜仔，恁大口汩落去，也毋驚哽死。","example":""},{"word":"下下來","pinyin":"haˋ haˊ loiˇ","def":"卸下來。 例如：做下下下來，上上上層去。","example":""},{"word":"號等（霸等）","pinyin":"ho denˋ (ba denˋ)","def":"占據著。例「歸日仔號等電視」。","example":""},{"word":"號位仔","pinyin":"ho vi eˋ","def":"占據比較寬的地方或位子。 例如：這片當壞尋位仔停車，你先下車去餐廳號位仔。","example":""},{"word":"學竳","pinyin":"hog denˊ","def":"幼兒學站立。 例如：阿姊个妹仔正開始學竳，還毋會行路。","example":""},{"word":"掞腳","pinyin":"iam giogˋ","def":"抖動腳及腿。 例如：野猴仔坐在樹項掞腳。 例如：阿公揇等孫仔坐在膝頭項緊掞腳，兩下半孫仔就睡忒吔！","example":""},{"word":"掞掞動","pinyin":"iam iam tungˊ","def":"上下抖動著。 例如：該人坐等，腳掞掞動，當壞看相。","example":""},{"word":"掩身","pinyin":"iamˋ siinˊ","def":"隱藏形體。 例如：墨斗魚係堵著危險，會噴烏墨汁來掩身，正做得遽遽脫身。","example":""},{"word":"縈線","pinyin":"iangˊ xien","def":"纏繞、環繞線材。又「縈索仔」則表纏繞繩索。 例如：紡織廠有專門用來縈線个機臺。","example":""},{"word":"擠擠揫【擠擠腦亂】","pinyin":"jiˊ jiˊ qiuˊ【jioˊ jioˊ qiuˊ】【jioˊ jioˊ noˋ lon】","def":"聚集在一起。擠在一起。 例如：廟坪前一大群人擠擠揫，毋知發生麼个事情？","example":""},{"word":"擠落去【塌下去】","pinyin":"jiˊ log hi【labˋ haˊ hi】","def":"塌陷下去。 例如：佢用塑膠罐仔裝滾水，結果罐仔嗄擠落去。","example":""},{"word":"汫水","pinyin":"jiang suiˋ","def":"傾斜使水流出。 例如：罐仔毋好打側側，無會汫水出來。","example":""},{"word":"汫燥","pinyin":"jiang zauˊ","def":"倒乾。 例如：碗洗好，水汫燥過後倒覆放，正較遽燥。","example":""},{"word":"剿忒【剿核】","pinyin":"jiauˋ tedˋ【jiog hedˋ】","def":"消滅掉。 例如：佢當好食佛果，這一箱兩下半仔就分佢剿忒吔！","example":""},{"word":"揤拶來","pinyin":"jidˋ zad loiˇ","def":"擠得緊密。 例如：覆菜盎个覆菜愛揤拶來，係衖著風，覆菜就會生菇臭風忒。","example":""},{"word":"擳","pinyin":"jied","def":"以拳直擊。","example":""},{"word":"磡綿","pinyin":"kamˋ mienˇ","def":"壓碎。 例如：蒜頭磡綿來，正會出味。","example":""},{"word":"磡著","pinyin":"kamˋ doˋ","def":"被重物壓到。 例如：這箱仔疊到恁高，你愛注意兜仔，莫分佢磡著。","example":""},{"word":"挳","pinyin":"kang","def":"用指甲用力摳，有移動的方向性。 例如：手毋好恁賤，逐擺就摎面挳到疤疤。","example":""},{"word":"詐睡","pinyin":"za soi","def":"裝睡。","example":""},{"word":"䞚䞚走（跁跁走）","pinyin":"kiaˊ kiaˊ zeuˋ (paˊ paˊ zeuˋ)","def":"到處亂跑。","example":""},{"word":"擎槌擎棍【背槌背棍】","pinyin":"kiaˇ cuiˇ kiaˇ gun【baˇ cuiˇ baˇ gun】","def":"拿武器，準備動武的樣子。 例如：該陣鱸鰻仔動啊著就擎槌擎棍尋人輸贏。","example":""},{"word":"種崩崗","pinyin":"zung benˊ gongˊ","def":"栽到懸崖下。 例如：起濛紗煙个時節，駛山路定著愛細義，係種崩崗，就壞蹄哩！","example":""},{"word":"吃吃滾","pinyin":"kid kid gunˋ","def":"掩著嘴巴輕笑。 例如：佢吃吃滾緊笑，問佢麼个事情也毋講。","example":""},{"word":"擒捉【擒】","pinyin":"kimˇ zogˋ【kimˇ】","def":"擒。 例如：老虎伏等目眈眈仔看等該群羊仔，等機會去擒捉。","example":""},{"word":"揪","pinyin":"kiuˋ【jiuˋ】","def":"用手緊抓或扭住。例如「揪頭那毛」、「揪等胸裌」。 例如：又寒又大風，愛摎襖揪核兜仔。 例如：佢摎賊仔揪核核，毋畀走忒。","example":""},{"word":"跼起來","pinyin":"kiug hiˋ loiˇ","def":"以圍欄圈起來。 例如：這隻鳥仔分人跼起來，想愛飛也飛毋走。","example":""},{"word":"跼等","pinyin":"kiug denˋ","def":"困著。 例如：該火雞分頭家跼等，走無哪去。","example":""},{"word":"狂狂偏【顛顛倒倒】","pinyin":"kongˇ kongˇ pienˊ【dienˊ dienˊ do do】","def":"腳不聽使喚，持續腳步不穩的樣子，屬於持續性，越走越偏沒有辦法立即走正。 例如：阿公食酒醉吔，行路狂狂偏，差一息仔撞著壁。","example":""},{"word":"環環轉","pinyin":"kuanˊ kuanˊ zonˋ【kuanˇ kuanˇ zonˋ】","def":"不停的轉來轉去，用來形容人著急或忙碌的樣子。 例如：為著準備請人客，阿姆在灶下無閒到環環轉。","example":""},{"word":"嘳忒【嘳核】","pinyin":"kue tedˋ【kie hedˋ】","def":"打破了。若要表示破得很嚴重，可說「嘳爛爛」。 例如：地泥滑滑，碗險險分老弟嘳忒。","example":""},{"word":"罅啊罅仔","pinyin":"la a la eˋ","def":"輕輕地試探。 例如：佢在米缸罅啊罅仔，毋堵好嗄罅著一條蛇哥。","example":""},{"word":"睞啊過","pinyin":"laiˋ a go","def":"以眼大略掃視。 例如：佢書底飽，記才又好，文章睞啊過就奈得何。","example":""},{"word":"睞人","pinyin":"laiˋ nginˇ","def":"眼神對人掃視。 例如：佢目珠當會睞人，看起來當惡。","example":""},{"word":"犁頭剷","pinyin":"laiˇ teuˇ canˋ","def":"跌跤時，身體重心不穩而向前俯衝的情形。 例如：佢行忒遽，一下仔無注意就打犁頭剷。","example":""},{"word":"㐁舌","pinyin":"leˇ sad","def":"吐舌的樣子。 例如：天時忒熱，狗仔就會㐁舌來降低體溫。","example":""},{"word":"擸牙擸齒","pinyin":"liabˋ ngaˇ liabˋ ciiˋ","def":"食物夾在牙縫中或齒隙裡。","example":""},{"word":"尥","pinyin":"liauˊ","def":"腳背揮踢。 例如：毋好用腳尥人，會害人跌倒。 例如：用腳尥人，傷害當大。","example":""},{"word":"捩當轂","pinyin":"lidˋ dongˊ gugˋ","def":"轉得很快，例如陀螺快速轉動，同義詞為「轉當轂」。","example":""},{"word":"捩上捩下","pinyin":"lidˋ songˊ lidˋ haˊ","def":"轉來轉去，忙個不停。 例如：佢歸下晝騎車仔捩上捩下，毋知在無閒麼个？","example":""},{"word":"蹥","pinyin":"lien","def":"反覆踩踏。例如「牛仔蹥菜地」、「細人仔上眠床蹥被」。","example":""},{"word":"哯出來","pinyin":"lienˋ cudˋ loiˇ","def":"吐出來，該動作較緩慢。 例如：佢食著這雞卵糕味緒怪怪，遽遽哯出來。","example":""},{"word":"踜蹭","pinyin":"linˊ qinˊ","def":"走不穩要跌倒的樣子，亦可說「打踜蹭」、「踜踜蹭蹭」。 例如：阿丑伯食過酒，行路打踜蹭，見人就笑到牙絲絲仔。","example":""},{"word":"兩腳無搭地【兩腳無揬地】","pinyin":"liongˋ giogˋ moˇ dabˋ ti【liongˋ giogˋ moˇ dudˋ ti】","def":"跑得很快，引申為事情繁忙，忙碌不停。 例如：阿叔正開業生理當好，做到兩腳無搭地。 例如：賊仔看著警察來，走到兩腳無搭地。","example":""},{"word":"溜溜蹴","pinyin":"liu liu co/qio","def":"地勢傾斜，讓人往下滑。 例如：下山个路溜溜蹴，係無注意會跌落去。","example":""},{"word":"罶毋核【掠毋核】","pinyin":"liu mˇ hed【liag mˇ hed】","def":"套不住。 例如：清潔隊員捉野狗，用索仔罶狗仔罶毋核。","example":""},{"word":"攞著","pinyin":"loˊ doˋ","def":"東西混合了；交到壞朋友。 例如：這係分阿芬个，該係分阿珍个，你斯毋好攞著哦。 例如：阿明毋知去哪攞著恁多不褡不膝个朋友，這下還學人食菸。","example":""},{"word":"攞攞合合","pinyin":"loˊ loˊ gabˋ gabˋ","def":"混合在一起分不開。 例如：麼个菜都攞攞合合共下煮，敢會好食？","example":""},{"word":"攞攞揫等【攞揫合滑】","pinyin":"loˊ loˊ qiuˊ denˋ【loˊ qiuˊ gabˋ vad】","def":"混合在一起。同「攞攞合合」。 例如：生个同熟个食物，毋好攞攞揫等合共下。 例如：中藥、西藥毋好攞攞揫等共下食。","example":""},{"word":"捋","pinyin":"lod","def":"用細竹條抽打；用手掌握住，順勢滑動。 例如：佢同同學相打，分阿爸知著，跈等捉來捋。 例如：佢用手去捋冬瓜莖，分毛虐著。","example":""},{"word":"捋衫袖","pinyin":"lod samˊ qiu","def":"將長的衣袖直接從手腕往手臂上方反覆推的動作，表示要準備做事情了。 例如：阿春伯在該捋衫袖，準備愛出手吔。","example":""},{"word":"捋鬚","pinyin":"lod xiˊ","def":"以手掠鬍子，有神情自若的樣子。","example":""},{"word":"攎","pinyin":"luˇ","def":"捲衣服或雙手抱持著東西，例如「攎褲腳」、「攎褲頭」即提褲腳、提褲頭。","example":""},{"word":"攎攎扐扐","pinyin":"luˇ luˇ led led","def":"摟摟抱抱；大包小包，提的提，抱的抱。 例如：看佢去百貨公司轉來攎攎扐扐，買著恁多東西。","example":""},{"word":"攎手捋腳","pinyin":"luˇ suˋ lod giogˋ","def":"捲起袖子及褲腳，要動手的樣子。 例如：看著田肚有田螺，大家相賽攎手捋腳跳落去拈。 例如：阿明牯攎手捋腳，當像愛摎人相打樣仔。","example":""},{"word":"錑空仔","pinyin":"lui kungˊ eˋ","def":"以旋轉方式鑽孔。 例如：木匠師傅不時愛做錑空仔个事頭。","example":""},{"word":"𢫦","pinyin":"mag","def":"比較大的器物重力打擊。 例如：棍仔𢫦啊去！山豬就橫下去哩！","example":""},{"word":"搣來搣去","pinyin":"medˋ loiˇ medˋ hi【miedˋ loiˇ miedˋ hi】","def":"弄來弄去、搞來搞去。 例如：搣來搣去還毋係共樣，早知就先轉吔。","example":""},{"word":"蒙揫揫","pinyin":"miangˊ qiuˊ qiuˊ","def":"完全遮蓋沒有遺漏。 例如：袋仔裡肚个東西蒙揫揫，會知係麼个。","example":""},{"word":"蒙塞塞","pinyin":"miangˊ sedˋ sedˋ","def":"完全遮蓋不露出。 例如：阿姆摎東西蒙塞塞，喊𠊎揣看啊係麼个。","example":""},{"word":"糜","pinyin":"moiˋ","def":"沒有牙齒的人以舌頭和牙齦慢慢磨碎食物。 例如：阿婆無牙齒，用牙倉肉糜啊糜仔。","example":""},{"word":"望啊望仔","pinyin":"mong a mong eˋ","def":"隨處張望的樣子。 例如：聽講阿燕愛轉，阿婆歸日仔企在門口望啊望仔。","example":""},{"word":"目聚聚仔","pinyin":"mugˋ qi qi eˋ","def":"皺眉瞇眼看物的樣子。 例如：𠊎看你斯怕近視吔，見看人就目聚聚仔。","example":""},{"word":"目眨眨仔","pinyin":"mugˋ sabˋ sabˋ eˇ","def":"雙眼閉著的樣子。 例如：熟地碼，𠊎目眨眨仔就尋得著。","example":""},{"word":"目摸摸仔","pinyin":"mugˋ miaˊ miaˊ eˋ","def":"盲眼摸著走路的樣子。 例如：看佢目摸摸仔，怕係正醒定定。","example":""},{"word":"揇肚屎","pinyin":"namˋ duˋ siiˋ","def":"捧腹，亦可說「扐肚屎」；另外，「笑到揇肚屎」指捧腹大笑。","example":""},{"word":"另命","pinyin":"nang miang","def":"拚命出力，亦可說「硬命牯」。 例如：這細人仔見擺同人搞到另命緊喊，也毋驚半夜發狂。","example":""},{"word":"躡腳（躡腳尾）【挺腳仔】","pinyin":"ne giogˋ (ne giogˋ miˊ)【tenˋ giogˋ eˋ】","def":"抬起腳跟、踮腳。 例如：阿明較矮細，看戲輒常愛躡腳正看得著。","example":""},{"word":"磕著","pinyin":"ngab doˋ","def":"碰撞到，例如「磕頭」指叩頭、「磕壁」指以額頭碰撞牆壁。","example":""},{"word":"頷頷仔食","pinyin":"ngabˋ ngabˋ eˇ siid","def":"埋頭猛吃，亦可說「頭沉沉地食」。 例如：老弟食著這碗粥好食，就頷頷仔食無停。","example":""},{"word":"囓著","pinyin":"ngadˋ doˋ","def":"咬到，噬著。 例如：同你講毋好食恁遽，你看！這下囓著舌嫲流血哩！","example":""},{"word":"頷頷拜","pinyin":"ngamˋ ngamˋ bai","def":"一直點頭的樣子或不停的拜。 例如：阿公坐在該啄目睡，頭那頷頷拜。","example":""},{"word":"刓","pinyin":"nganˊ","def":"小物削大物時，刀不離物，先用刀在周圍畫一圈，越切越深，然後用力斷之，可用於竹子、甘蔗等。例「刓斷」即切斷。 例如：該支竹仔盡硬程，愛先用刀仔刓過一圈，正刓得斷。","example":""},{"word":"禁腳【極腳】","pinyin":"gim giogˋ【gib giogˋ】","def":"因鞋小導致腳不舒服，走起來不順暢的樣子。 例如：鞋忒細，著著毋合腳，會禁腳。","example":""},{"word":"逆腳","pinyin":"ngiag giogˋ","def":"腳走起來不順暢的樣子。 例如：這條路半嶇半嶇仔，行起來當逆腳。","example":""},{"word":"黏牙擸齒","pinyin":"ngiamˇ ngaˇ liabˋ ciiˋ","def":"食物黏著牙齒或夾在牙縫中，引申為不乾淨，做事拖泥帶水、含糊不清。 例如：這麥芽糖好食斯好食，毋過黏牙擸齒，盡得人惱。 例如：阿太九十二歲吔，成下仔講話會黏牙擸齒，聽無麼个清楚。","example":""},{"word":"唸唸唸唸","pinyin":"ngiamˇ ngiamˇ ngiam ngiam","def":"針對某件事情，口中說話不停的樣子。 例如：佢透日唸唸唸唸，毋知講麼个東西。","example":""},{"word":"眼盯盯仔","pinyin":"ngienˋ dangˊ dangˊ eˋ","def":"瞪大了眼睛挑釁的看。 例如：講話就講話，眼盯盯仔做麼个？","example":""},{"word":"撚死死","pinyin":"ngienˋ xiˋ xiˋ","def":"牢牢的抓住，不肯放手。 例如：屋下个錢分阿蘭撚死死，係愛用著錢愛同佢伸手。","example":""},{"word":"扭屎胐花","pinyin":"ngiuˋ sii vudˋ faˊ","def":"屁股扭動的樣子。 例如：阿華个孫仔盡會扭屎胐花，毋知係摎麼人學个？","example":""},{"word":"愕愕然","pinyin":"ngogˋ ngogˋ ienˇ","def":"因突發、不明究理之狀態下而產生的愕然現象。 例如：50年前做兵个朋友，玄玄風來尋𠊎，𠊎愕愕然一下，險險認佢毋出。","example":""},{"word":"弄來弄去","pinyin":"nung loiˇ nung hi","def":"鑽來鑽去，動個不停。 例如：歸陣細人仔在茶園肚弄來弄去搞囥人尋。","example":""},{"word":"遏等","pinyin":"odˋ denˋ","def":"以力量抵住、按住，相反「遏毋核」即按不住。 例如：下崎哩！嬰兒車愛遏等，正無會溜等走。","example":""},{"word":"爬山蹶壁","pinyin":"paˇ sanˊ kied biagˋ","def":"徒手赤腳攀登山崖峭壁。 例如：阿城哥爬山蹶壁个功夫盡好。","example":""},{"word":"盤","pinyin":"panˇ","def":"抓著某物向上爬，例如「盤上盤下」即謂到處攀越。","example":""},{"word":"盤籬吊壁","pinyin":"panˇ liˇ diau biagˋ","def":"翻越籬笆，爬登牆壁，形容人善於攀爬或好動的樣子。 例如：這細人仔盤籬吊壁，厥姆乜奈佢毋何。","example":""},{"word":"匉勻來","pinyin":"pangˊ iunˇ loiˇ","def":"分開使之均勻。 例如：你斯愛匉勻來，莫分人講大細心。","example":""},{"word":"匉開來","pinyin":"pangˊ koiˊ loiˇ","def":"分散開來。 例如：蘿蔔絲匉開來，黏共下晒毋會燥。","example":""},{"word":"拋拋啊","pinyin":"pauˊ pauˊ aˋ","def":"上下拋動。 例如：該瓜仔切好拿來拋拋啊！就做得打淨食。","example":""},{"word":"翍開來","pinyin":"piaˊ koiˊ loiˇ","def":"向兩側張開或敞開。 例如：這領大襖，係講鈕仔無鈕起來，翍開來乜拗蠻好看。 例如：孔雀个尾翍開來盡靚。","example":""},{"word":"翍翍","pinyin":"piaˊ piaˊ","def":"向兩側張開的樣子。 例如：該隻鳥仔翼翍翍，親像著傷樣仔。","example":""},{"word":"破","pinyin":"po","def":"依比例混合。例如「對半破」指製作米食時，對半調配不同米類的比例。","example":""},{"word":"搒","pinyin":"pongˊ","def":"捶擊。例如「捉來搒」即為抓來痛毆。","example":""},{"word":"伏貼貼","pinyin":"pug dabˋ dabˋ","def":"五體貼地。 例如：搞囥人尋該下，佢伏貼貼，驚分人看著。","example":""},{"word":"聚總","pinyin":"qi zungˋ","def":"聚集。 例如：你先行無相干，等一下仔在厥屋下聚總正共下出發。","example":""},{"word":"亼拶來【拶轂】","pinyin":"qib zad loiˇ【zad gugˋ】","def":"擠壓使之堅實。 例如：做肉丸个絞肉愛亼拶來，還愛出力擲畀韌韌，正會承牙。","example":""},{"word":"七攞八合","pinyin":"qidˋ loˊ badˋ gabˋ","def":"各式各樣的東西摻在一起。 例如：藥仔毋好七攞八合共下食，愛先問過先生。","example":""},{"word":"蹴","pinyin":"qio【co】","def":"以腳底搓。 例如：腳烏烏，上眠床以前愛摎腳蹴淨來。","example":""},{"word":"躍等來","pinyin":"qiogˋ denˋ loiˇ","def":"奔躍而來。 例如：狗仔看著主人轉屋當暢，黏時躍等來。","example":""},{"word":"哨聲","pinyin":"sauˇ sangˊ","def":"失聲。 例如：佢去外背唱歌仔食著風，轉來斯哨聲吔。","example":""},{"word":"眨目","pinyin":"sabˋ mugˋ","def":"眼睛微閉。 例如：聽講冤枉死个人，死吔還毋肯眨目。","example":""},{"word":"舌㐁㐁仔","pinyin":"sad leˇ leˇ eˋ","def":"舌頭伸出很長的樣子。","example":""},{"word":"閃籬閃壁","pinyin":"samˋ liˇ samˋ biagˋ","def":"躲躲藏藏。 例如：講著食，大家擠擠揫；講著做，相賽閃籬閃壁。","example":""},{"word":"捎短來","pinyin":"sauˊ donˋ loiˇ","def":"用剪刀或鋸子把布料、樹枝等物品剪短的動作。 例如：樹椏恁長，拿鋸仔捎短來。","example":""},{"word":"眡人【打橫眼】","pinyin":"seˋ nginˇ【daˋ vangˇ ngianˋ】","def":"斜眼看人，帶有不友善眼神。 例如：毋好恁仔眡人，當無禮貌。","example":""},{"word":"舐嘴擸鼻","pinyin":"seˊ zoi liabˋ pi","def":"把舌頭伸出舔取口邊的餘津，形容吃得津津有味的樣子。","example":""},{"word":"摻【𫠛】","pinyin":"sem【sen】","def":"用力打。例如「分人摻」、「拿棍仔摻」。","example":""},{"word":"狌人","pinyin":"senˇ nginˇ【semˇ nginˇ】","def":"咬人。 例如：這細猴牯盡得人驚，一無注意著會對背後狌人。","example":""},{"word":"挲忒【挲核】","pinyin":"soˊ tedˋ【soˊ hedˋ】","def":"用手擦掉；私下把事情抹銷。 例如：上禮拜該條新聞背尾無繼續報，怕係尋律師挲忒吔。","example":""},{"word":"挲心肝","pinyin":"soˊ ximˊ gonˊ","def":"撫胸口。 例如：佢緊張到緊顫，阿姆同佢挲心肝，喊佢放輕鬆毋使驚。","example":""},{"word":"手輕腳輕","pinyin":"suˋ kiangˊ giogˋ kiangˊ","def":"動作輕巧小心。 例如：賊仔手輕腳輕，對窗門爬入屋肚，同保險箱偷走哩。","example":""},{"word":"手爬腳蹶","pinyin":"suˋ paˇ giogˋ kied","def":"四體操勞。 例如：這條山路當毋好行，大家手爬腳蹶正到山頂。 例如：佢跌落水竇肚，大家手爬腳蹶正摎佢救起來。","example":""},{"word":"踏出踏入","pinyin":"tab cudˋ tab ngib","def":"來回不停走進走出，或來回躊躇不安的樣子。 例如：隔壁阿伯請𠊎去食酒，堵著一陣雨來，踏出踏入毋知愛去抑毋去。","example":""},{"word":"踏兜起來","pinyin":"tab deuˊ hiˋ loiˇ","def":"預留一些。 例如：財產分細人，自家老本愛先踏兜起來。","example":""},{"word":"踏上踏下","pinyin":"tab songˊ tab haˊ","def":"走來走去。 例如：佢透日在灶下踏上踏下，毋知愛變麼个出來。","example":""},{"word":"憚憚顫（激激顫）","pinyin":"tan tan zunˊ (gid gid zunˊ)","def":"發抖，主要指身體的抖動，原因可能為寒冷或驚嚇。 例如：佢做賊分人捉著，吂去派出所，就驚到憚憚顫。","example":""},{"word":"彈著","pinyin":"tanˇ doˋ","def":"彈擊到。 例如：煎魚仔，分油彈著當痛。","example":""},{"word":"打挺昂（挺挺昂）","pinyin":"daˋ tenˋ ngongˊ (tenˋ tenˋ ngongˊ)","def":"仰臥，臉朝上躺著。 例如：佢兩公婆，一儕睡目打挺昂，一儕打側睡。","example":""},{"word":"跈陣","pinyin":"tenˇ ciin","def":"跟著隊伍。","example":""},{"word":"跈龍","pinyin":"tenˇ liungˇ","def":"跟隨舞龍隊伍一起遊行。 例如：厥屋下人全去跈龍哩，故所屋下全無人在。","example":""},{"word":"頭探探仔","pinyin":"teuˇ damˊ damˊ eˋ","def":"頭伸出在外的樣子。 例如：該賊仔在圍牆外背頭探探仔，看有人在無。","example":""},{"word":"偷睞","pinyin":"teuˊ laiˋ","def":"以斜眼偷看。","example":""},{"word":"頭臥臥","pinyin":"teuˇ ngo ngo","def":"頭仰著的樣子。 例如：佢在該頭臥臥看天頂，毋知在想麼个。","example":""},{"word":"頭磬磬仔","pinyin":"teuˇ qinˋ qinˋ eˇ","def":"低著頭。 例如：佢毋知有麼个心事打結，日日就頭磬磬仔，還不時敨大氣。","example":""},{"word":"拖濟","pinyin":"toˊ ceˋ","def":"截長補短，使整體狀態平均。 例如：公司在各地開幾下間分店，結算下來有賺有了，拖濟還打得過。","example":""},{"word":"綯等","pinyin":"toˇ denˋ","def":"拴住或綁住。 例如：這狗仔會咬人，愛綯等正較安全。","example":""},{"word":"宕睡","pinyin":"tong soi","def":"睡過頭。 例如：佢輒輒宕睡，睡到當晝，下晝正去上課。","example":""},{"word":"斡頭湢瀉【斡頭捋瀉】","pinyin":"vadˋ teuˇ bid xia【vadˋ teuˇ lod xia】","def":"掉頭就跑。 例如：阿明看啊著警察就斡頭湢瀉，怕係做麼个虧心事。","example":""},{"word":"噦天噦地","pinyin":"ve tienˊ ve ti","def":"指哭泣，大聲喊叫。 例如：該隻癲仔毋知為著麼个，噭到噦天噦地。","example":""},{"word":"噦噦滾","pinyin":"ve ve gunˋ","def":"哇哇叫。 例如：該隻細人仔毋聽講，分厥姆打到噦噦滾緊噭。","example":""},{"word":"噦噦嘶嘶","pinyin":"veˊ veˊ seˊ seˊ","def":"大聲嘶喊。 例如：小可仔著傷定定，你就莫在該噦噦嘶嘶。","example":""},{"word":"唩唩喊喊","pinyin":"voˋ voˋ hemˊ hemˊ","def":"呼叫不止。 例如：今晡日愛掛紙，天吂光阿姆就唩唩喊喊，喊大家遽䟘床。","example":""},{"word":"攉攉忒去【攉攉核去】","pinyin":"vogˋ vogˋ tedˋ hi【vogˋ vogˋ hedˋ hi】","def":"全部丟棄。 例如：無愛个東西，好攉攉忒去，毋好放等霸位仔。","example":""},{"word":"揋石頭","pinyin":"voiˊ sag teuˇ","def":"投擲石頭，手腕有彎曲，「揋」就是彎曲的意思。 例如：佢在䃗崁面項揋石頭下來，𠊎無提防嗄嚇一下。","example":""},{"word":"喤喤噦噦","pinyin":"vongˇ vongˇ veˋ veˋ","def":"哭鬧喊叫的樣子。 例如：厥孫仔分人揇慣吔，正放落凳仔項就喤喤噦噦。","example":""},{"word":"死睡【倔睡】","pinyin":"xiˋ soi【kudˋ soi】","def":"熟睡不醒。 例如：恁死睡，睡到毋知人事。","example":""},{"word":"瀉走","pinyin":"xia zeuˋ","def":"溜走。 例如：該隻賊仔聽著狗吠，還吂偷著東西就瀉走吔。","example":""},{"word":"潛入","pinyin":"xiamˇ ngib","def":"暗中侵入。","example":""},{"word":"潛走","pinyin":"xiamˇ zeuˋ","def":"暗中逃走，或偷走。 例如：毋知麼人同阿祥仔講警察愛來，佢昨暗晡包袱款款仔就潛走吔。","example":""},{"word":"抋啊抋仔","pinyin":"xim a xim eˋ","def":"持續柔性的上下彈動。 例如：細人仔睡在阿姆腳髀項，抋啊抋仔就睡忒吔。","example":""},{"word":"㩆著","pinyin":"xio doˋ","def":"被擦身方式打到、擊中或擦撞到，例如「分車仔㩆著」、「分銃子㩆著」。","example":""},{"word":"揟當遽","pinyin":"xio dongˊ giagˋ","def":"跑得很快、溜得很快。 例如：該車仔揟當遽，當得人驚。 例如：知講有事頭愛喊佢做，佢斯揟當遽。","example":""},{"word":"修人","pinyin":"xiuˋ nginˇ","def":"以小竹條打人。 例如：頭擺个細人仔係毋聽話，爺哀會拿竹修仔修人。","example":""},{"word":"紮髻鬃","pinyin":"zadˋ gi zungˊ","def":"束髮髻。 例如：吾太逐擺出門都會紮髻鬃。","example":""},{"word":"矺","pinyin":"zagˋ","def":"壓住，例如「矺石頭」即用石頭壓著、「矺扁忒」即壓扁。","example":""},{"word":"掙力","pinyin":"zang lid","def":"朝外部出力、用力、使力。 例如：老人家腳還會掙力，就毋好歸日坐等。 例如：這櫃仔當重，連掙力就搬毋停動。","example":""},{"word":"㧗頭那毛","pinyin":"ziiˊ teuˇ naˇ moˊ","def":"爭吵中拉扯頭髮的動作。 例如：兩公婆冤家，互相㧗頭那毛，搣到細人仔毋知愛仰般做正好。","example":""},{"word":"揕","pinyin":"ziim","def":"以指甲的尖端向目標物，施力往下壓迫壓擠。 例如：聽講分蚊仔叼毋好緊爪，手指甲揕一下仔，較毋會癢。","example":""},{"word":"轉肩","pinyin":"zonˋ gienˊ","def":"挑擔時左右肩互換。 例如：係忒重，你就愛轉肩。","example":""},{"word":"轉側","pinyin":"zonˋ zedˋ","def":"翻身，轉成側面；換個角度思考、反向思考。 例如：睡目會轉側个人較多。 例如：做事情係堵著困難，愛曉得轉側。","example":""},{"word":"醉摸摸仔","pinyin":"zui miaˊ miaˊ eˋ","def":"醉得摸著走路的樣子。","example":""},{"word":"蹳尾","pinyin":"bad miˊ","def":"鱷魚、牛隻等大型動物甩尾巴的動作，亦可說「拂尾」、「拔尾」。 例如：係有蚊仔抑係烏蠅嗛牛背囊，牛會緊蹳尾。","example":""},{"word":"暴禾串【暴穀】","pinyin":"bau voˇ con【bau gugˋ】","def":"抽穗。 例如：這禾仔當暴禾串，毋好堵著落雨天正好。","example":""},{"word":"飽仁","pinyin":"bauˋ inˇ","def":"指豆莢內的果仁精實飽滿。 例如：這豆莢當飽仁，炒起來定著當好食。","example":""},{"word":"金包膿","pinyin":"gimˊ bauˊ nungˇ","def":"傷口表面雖然好了，但裡面還長膿。 例如：傷口愛清淨來，無斯會金包膿。","example":""},{"word":"飆筍","pinyin":"beuˊ sunˋ","def":"植物初生的枝葉特別突出者。 例如：春雨落來多，竹仔看等佢飆筍。","example":""},{"word":"扁嘴","pinyin":"bienˋ zoi","def":"要哭的樣子。 例如：講佢兩句仔定定，跈等就扁嘴。","example":""},{"word":"奮走","pinyin":"binˋ zeuˋ","def":"動物掙扎想要逃脫。 例如：該隻鳥仔分人捉著，看佢緊撥翼想愛奮走。","example":""},{"word":"晟卵","pinyin":"cangˇ lonˋ","def":"在光照下看蛋內胚體孵化的狀況。 例如：阿婆拿卵在該門縫晟卵。","example":""},{"word":"瘦狗多鹵","pinyin":"ceu gieuˋ doˊ luˊ","def":"瘦弱的狗特別多毛病。鹵，本義是鐵鏽，用以比喻人體弱多病。 例如：佢生來瘦瘦仔，盡多症頭，正式係瘦狗多鹵。","example":""},{"word":"菜廂","pinyin":"coi xiongˊ","def":"菜畦。","example":""},{"word":"菜秧仔","pinyin":"coi iongˊ eˋ","def":"菜苗。","example":""},{"word":"出浹仁","pinyin":"cudˋ giabˋ inˇ","def":"動植物的傷口流出汁液，凝成硬塊的過程。","example":""},{"word":"打㪐","pinyin":"daˋ ludˋ","def":"拴著或繫著的動物被掙脫了。 例如：若牛仔啊，牛索分佢打㪐，瀉走哩！","example":""},{"word":"打哦歌嘴","pinyin":"daˋ ngoˇ goˊ zoi","def":"指狗發長嘯聲，像狼嚎一般。民間傳說是狗看到鬼時才會這樣叫，俗以為是不祥之兆。 例如：昨暗晡隔壁該隻烏狗仔緊打哦歌嘴，聽起來當得人驚。","example":""},{"word":"探根","pinyin":"dam ginˊ","def":"生根，亦可說「綻根」。 例如：番薯藤異生趣，目目就會探根落泥打番薯。","example":""},{"word":"反種","pinyin":"fanˋ zungˋ","def":"原意為變種，後喻反常。 例如：你種个柑仔係反種个，抑係買毋著樹秧仔？任看就係桔仔！","example":""},{"word":"雞鵠仔","pinyin":"gieˊ gugˋ eˇ","def":"發育中的小公雞。 例如：該隻雞鵠仔盡會食，一包飼料無幾久就食忒哩。","example":""},{"word":"狗條仔","pinyin":"gieuˋ tiauˇ eˋ","def":"不大不小、尚未達成犬的狗。 例如：有兜狗條仔毋大隻，毋過盡會吠。","example":""},{"word":"猴嫲","pinyin":"heuˇ maˇ","def":"母猴，原為罵人用語，後來轉為長輩對較小女孩或女性好友之間的戲謔、親暱稱呼。","example":""},{"word":"現蹄","pinyin":"hien taiˇ","def":"牛隻腳蹄向後踢，此動作會把蹄顯出，引申為暴露自己的缺點。 例如：兄弟愛和挼，毋好現蹄分別人看。","example":""},{"word":"吭吭飛","pinyin":"hong hong biˊ","def":"嗡嗡地飛。 例如：田坵項係有放雞屎肥，烏蠅就會吭吭飛。","example":""},{"word":"翼閕閕","pinyin":"id hiaˊ hiaˊ","def":"翅膀張開。 例如：鷂婆翼閕閕，緊飛緊高。","example":""},{"word":"翼翍翍","pinyin":"id piaˊ piaˊ","def":"形容雙翅外張微垂的樣子。 例如：該隻鷂婆翼翍翍，看起來當無精神。","example":""},{"word":"羊豭","pinyin":"iongˇ gaˊ","def":"公的種羊。 例如：羊豭係專門做種牽豭个公羊。","example":""},{"word":"油蔥","pinyin":"iuˇ cungˊ","def":"蘆薈。","example":""},{"word":"蹶食","pinyin":"kied siid","def":"形容動物以爪抓地取食。 例如：雞鴨放落田項，佢自然會去蹶食。","example":""},{"word":"撳雞嫲","pinyin":"kim gieˊ maˇ","def":"公雞騎上母雞進行交配。 例如：雞公撳雞嫲，為著傳宗接代。","example":""},{"word":"跼雞鴨","pinyin":"kiug gieˊ abˋ","def":"把雞鴨關住、圍堵住。 例如：這下人畜頭牲跼雞鴨都有專門个設備。","example":""},{"word":"開翼","pinyin":"koiˊ id","def":"展翅。 例如：地泥項有一隻細鳥子，緊開翼想愛學飛。","example":""},{"word":"開目","pinyin":"koiˊ mugˋ","def":"初生動物，第一次張開眼睛。","example":""},{"word":"開椏","pinyin":"koiˊ vaˊ","def":"樹枝開叉。 例如：該頭梅花恁多日起勢開椏綻筍吔。","example":""},{"word":"𥏘尾","pinyin":"kud miˊ","def":"尾巴短貌。 例如：這下人畜个豬仔，旦勢就係𥏘尾个。","example":""},{"word":"賴孵","pinyin":"lai pu","def":"小雞都已孵出，儘管雞窩裡沒有蛋，母雞仍然賴著不走。比喻固執、不知變通。 例如：賴孵雞嫲毋知醒。（諺）","example":""},{"word":"嚂嚂滾","pinyin":"lem lem gunˋ","def":"狂吠不止，比喻人大聲咆哮。例如「狗仔透暗晡嚂嚂滾吠無停」、「嚂嚂滾罵無停」。","example":""},{"word":"鰭菇仔","pinyin":"kiˇ guˊ eˋ","def":"魚鰭。","example":""},{"word":"蔭忒【蔭核】","pinyin":"lim tedˋ【lim hedˋ】","def":"植物因陽光被遮蔽而枯萎。 例如：籬笆脣該析蔭忒个禾仔生著奀孱，較無禾仔好割。","example":""},{"word":"溜苔","pinyin":"liuˊ toiˇ","def":"苔蘚。","example":""},{"word":"卵崽仔","pinyin":"lonˋ zaiˊ eˋ","def":"雞鴨腹中尚未成形的蛋。 例如：係㓾雞僆仔，大體腹內都會有卵崽仔。","example":""},{"word":"虻仔（蚊蜶仔）","pinyin":"mangˋ eˇ (munˊ sud eˋ)【mangˊ eˋ】","def":"指搖蚊、蜉蝣或小飛蟲。 例如：熱天騎車仔愛注意虻仔，分佢打著會擘毋開目。","example":""},{"word":"尾仃仃","pinyin":"miˊ dangˇ dangˇ","def":"動物尾巴翹起來的樣子，也可比喻人得意高興的樣子。 例如：該貓仔尾仃仃，毋好摸佢，會分佢爪著。 例如：老弟考著頭名，分先生阿腦兩句，就歸日仔尾仃仃。","example":""},{"word":"尾砣砣仔【尾貼貼仔】","pinyin":"miˊ toˇ toˇ eˋ【miˊ dabˋ dabˋ eˊ】","def":"尾巴下垂貌，多用於羽毛類動物。 例如：該隻鳥仔歸身烏疏疏又尾砣砣仔，定著係阿啾箭。","example":""},{"word":"毛菇仔【毛菇】","pinyin":"moˊ guˊ eˋ【moˊ guˊ】","def":"禽鳥類身上初生之短毛。 例如：這隻鴨仔毛菇仔嶄然多，挷毋得淨。","example":""},{"word":"㸐角仔","pinyin":"nadˋ gogˋ eˇ","def":"毒蛾的幼蟲，看起來像隻小毛毛蟲，人體碰上如灼傷的感覺，又痛又癢。","example":""},{"word":"牙狌狌仔","pinyin":"ngaˇ senˇ senˇ eˋ","def":"形容牙齒顯露，一副要咬人的樣子。 例如：該隻狗仔牙狌狌仔，像愛咬人个樣仔，你毋好偎兼。","example":""},{"word":"硬絲硬絲","pinyin":"ngang xiˊ ngang xiˊ/ngang siiˊ ngang siiˊ","def":"蔬果纖維粗硬的樣子。 例如：這菜莖硬絲硬絲，炒起來毋好食，愛擇忒佢。","example":""},{"word":"二槽仔【二涵仔】","pinyin":"ngi coˇ eˋ【ngi hamˇ eˋ】","def":"攪穀後掉至風車第二格的穀子，此類稻穀屬不精也不實的狀態，亦可說「米槽」。 例如：一般攪穀時節，較冇个穀會自動跌落二槽仔。","example":""},{"word":"齬齬齖齖","pinyin":"ngi ngi ngia ngia","def":"原指貓或狗彼此相爭時齜牙咧嘴的樣子，後比喻為吵架的意思。 例如：大家毋好齬齬齖齖，事情正會做到順序。","example":""},{"word":"惹惹","pinyin":"ngia ngia","def":"條枝不整齊的樣子。 例如：若頭那毛惹惹，遽啊去梳好來。","example":""},{"word":"廿廿趖【蠕蠕趖】","pinyin":"ngiam ngiam soˇ【nugˋ nugˋ soˇ】","def":"蠕動爬行的樣子。 例如：厥菜園無打農藥，虐毛蟲廿廿趖。","example":""},{"word":"藕絲","pinyin":"ngiauˊ xiˊ","def":"生物生長纖弱貌，另言「藕絲藕絲」即枯萎、不茂盛的樣子。 例如：禾埕該盆花樹久無淋水，椏桍藕絲藕絲緊落葉。","example":""},{"word":"牛牸仔","pinyin":"ngiuˇ cii eˋ","def":"小母牛。","example":""},{"word":"牛拂仔【牛槌】","pinyin":"ngiuˇ fid eˋ【ngiuˇ cuiˇ】","def":"趕牛用的鞭子。","example":""},{"word":"鵝公吮人","pinyin":"ngoˇ gungˊ qionˋ nginˇ","def":"公鵝攻擊、驅趕陌生人的行為。","example":""},{"word":"藕藕","pinyin":"niauˊ niauˊ/ngiauˊ ngiauˊ","def":"植物外皮不平整貌。如「朳仔藕藕」、「番薯藕藕」。而人的臉不平整可說「面藕藕」，或「藕面藕面」。","example":""},{"word":"撥翼","pinyin":"pad id","def":"拍打翅膀。 例如：該隻雞公緊撥翼想愛飛上樹頂。","example":""},{"word":"冇笐","pinyin":"pang gongˇ","def":"植物的莖不堅實。 例如：竹仔冇笐冇笐，窿入灶空，大火一燒就會砰砰滾響。","example":""},{"word":"皮堅堅【皮赤赤】","pinyin":"piˇ gienˊ gienˊ【piˇ cagˋ cagˋ】","def":"泛指物體表皮經作用結成硬皮。 例如：蘿蔔粄煎到皮堅堅，還香還好食。","example":""},{"word":"青瞑狗","pinyin":"qiangˊ miangˊ gieuˋ","def":"原指家犬一時辨識不清，連主人也狂吠；後喻被事務蒙蔽，對事件不明、發言不當的人，或罵人沒長眼睛似的。 例如：該儕人係青瞑狗係無？看著人像毋識樣仔。","example":""},{"word":"絕氣","pinyin":"qied hi","def":"斷氣、氣絕。","example":""},{"word":"豺蟲","pinyin":"saiˇ cungˇ","def":"蛔蟲。","example":""},{"word":"生腸","pinyin":"sangˊ congˇ","def":"動物的卵巢、輸卵管。","example":""},{"word":"蝨嫲","pinyin":"sedˋ maˇ","def":"蝨子。","example":""},{"word":"上栖","pinyin":"songˊ ji","def":"本義是雞隻跳上雞舍睡覺，現常用於戲謔人上床睡覺。 例如：老雞嫲上栖，蹶毋得上。 例如：正食啊飽定定，恁早就上栖哦？","example":""},{"word":"踏雞嫲（打雞嫲、打踏）","pinyin":"tab gieˊ maˇ (daˋ gieˊ maˇ、daˋ tab)","def":"公雞與母雞交配。 例如：雞公踏雞嫲，搣到一雞栖捩捩轉，還浙濟哦！","example":""},{"word":"跳子","pinyin":"tiau ziiˋ","def":"母雞脫離扶養的小雞的過程。 例如：雞嫲跳子後，接等正會生卵、孵卵。","example":""},{"word":"田螺疕","pinyin":"tienˇ loˇ piˋ","def":"田螺開口部分的保護片，俗語：「田螺疕，做到死」，相命者認為指甲粗短如田螺疕是勞碌命。","example":""},{"word":"搵浴","pinyin":"vun iog","def":"在水裡浸泡，多用於水牛。 例如：熱天時節，牛仔盡好去河壩肚搵浴。","example":""},{"word":"相背","pinyin":"xiongˊ baˇ","def":"動物交配。","example":""},{"word":"熟水","pinyin":"xiugˋ suiˋ","def":"指動植物或果實已經成熟。 例如：熟水个雞仔，剁雞肉盤當湛。","example":""},{"word":"孱著","pinyin":"zanˊ doˋ","def":"因營養不良而致長不大。 例如：這粒朳仔孱著，無冇，毋好食。 例如：阿金還細時節屋下苦，不時餓晝餓暗無好食嗄孱著，故所這下人瘦瘦又毋高。","example":""},{"word":"孱孱（奀孱）","pinyin":"zanˊ zanˊ (nganˊ zanˊ)","def":"形容發育不良、長不大的樣子。 例如：莫看阿明孱孱，走相逐無人走得佢贏。","example":""},{"word":"走大水","pinyin":"zeuˋ tai suiˋ","def":"逃避水患或指家禽罹患瘟疫。 例如：該間雞寮，這擺嗄走大水吔。","example":""},{"word":"走醒","pinyin":"zeuˋ xiangˋ","def":"動物發情。 例如：吾屋下貓仔走醒，歸日仔探聲，害𠊎暗晡頭睡毋落覺。","example":""},{"word":"走種","pinyin":"zeuˋ zungˋ","def":"品種失純。 例如：該頭樹仔交花个時節怕有雜著，打个花形有兜仔走種。","example":""},{"word":"作劇","pinyin":"zogˋ hiagˋ","def":"小牛突然性起奔跳；引申為調皮搗蛋意。 例如：班項个細人仔係有一個作劇，會摝到歸班毋使上課。","example":""},{"word":"壯旺","pinyin":"zong vong","def":"（植物）茂盛、強壯。 例如：這肥恁好，種个禾仔當壯旺。","example":""},{"word":"豬牸仔","pinyin":"zuˊ cii eˋ","def":"未成年、且未生育的母豬。 例如：畜豬仔較愛畜豬牸仔，㓾个豬肉較毋會臭臊。","example":""},{"word":"豬哥","pinyin":"zuˊ goˊ","def":"公的種豬；好色之徒。「豬哥涎」就是指好色鬼流的口水。","example":""},{"word":"豬胚仔","pinyin":"zuˊ poiˊ eˋ","def":"正在成長、未成熟之中豬。 例如：恁久飼料緊起價，阿叔高不將改畜豬胚仔較省錢。","example":""},{"word":"觜食","pinyin":"zuiˋ siid","def":"啄食。 例如：禾埕晒穀，屋簷鳥當會來觜食。","example":""},{"word":"滑鼻","pinyin":"vad pi","def":"繩索穿過牛鼻，導致牛的鼻孔破裂；後用以引申指穿物的孔破裂。 例如：該隻袋仔逐日擐重鈂鈂个鐵鎚，擐索承毋起滑鼻吔。","example":""},{"word":"轉青","pinyin":"zonˋ qiangˊ","def":"植物變得青綠，有復活之意。 例如：有一息仔變黃个禾葉，肥料委落去，看等佢轉青。","example":""},{"word":"打觜","pinyin":"daˋ zuiˋ","def":"蛋孵了一段時間後，裡面的小雞開殼而出。","example":""},{"word":"過枝","pinyin":"go giˊ","def":"植物植接後發芽。 例如：阿爸接个花樹過枝綻筍吔。","example":""},{"word":"半山排","pinyin":"ban sanˊ paiˇ","def":"半山腰。 例如：該片半山排種恁多檳榔，落大雨毋知會仰仔？","example":""},{"word":"半崎仔","pinyin":"ban gia eˋ","def":"半山坡、坡道的中途。 例如：還絕！行到半崎仔正發現皮包仔無擐著。","example":""},{"word":"崩崗㪐屻","pinyin":"benˊ gongˊ ludˋ in","def":"崩山坍頂、山崩石落。 例如：大地動崩崗㪐屻造成當大个災害。","example":""},{"word":"發風落雨","pinyin":"bodˋ fungˊ log iˋ","def":"颳風下雨，形容天氣惡劣。 例如：佢當有信用，就算發風落雨佢乜係會過來。","example":""},{"word":"陣光陣暗","pinyin":"ciin gongˊ ciin am","def":"一陣光一陣暗之省語，即時晴時雨。 例如：風搓天較會堵著陣光陣暗个天時。","example":""},{"word":"陣寒陣熱","pinyin":"ciin honˇ ciin ngied","def":"氣候溫差變化快；生病時忽冷忽熱。 例如：聽講著著惡性感冒會陣寒陣熱，愛歸禮拜正會好。","example":""},{"word":"塵灰猛湧【塵灰猛榮】","pinyin":"ciinˇ foiˊ mangˊ iungˋ【ciinˇ foiˊ mangˊ iungˇ】","def":"灰塵到處飄、塵土飛揚。 例如：這站仔整屋，搣到滿哪塵灰猛湧，落腳就毋得。","example":""},{"word":"草弄弄仔","pinyin":"coˋ nung nung eˋ","def":"草又高又密，形容雜草叢生的樣子。 例如：這搭位仔草弄弄仔，異毋好行。","example":""},{"word":"長尾星（掃把星）","pinyin":"congˇ miˊ senˊ (so baˋ senˊ)","def":"彗星，俗以為災星。 例如：衰鬼堵著長尾星。","example":""},{"word":"衝燒","pinyin":"cungˊ seuˊ","def":"極熱物體遇水產生熱氣上湧；有機物堆積含水分發霉時產生熱能的過程。 例如：馬膠路晒到盡燒，一陣雨落啊下就衝燒。 例如：穀愛晒燥來，係無，衝燒就會壞忒。","example":""},{"word":"打烏𪐞𠘆","pinyin":"daˋ vuˊ du sem","def":"會使人打冷顫的天氣，指寒流中的陰暗寒雨。 例如：外背打烏𪐞𠘆吔，你自家在外地知好著燒來無？","example":""},{"word":"頂崠（崠頂）","pinyin":"dinˋ dungˋ (dungˋ dangˋ)","def":"山之最高點，例如「高山頂崠」。","example":""},{"word":"倒汗（倒汗水）","pinyin":"do hon (do hon suiˋ)","def":"水氣在壁上或容器中凝成水滴的現象，像冒汗一般。 例如：逐擺洗燒水，浴堂个玻璃就會倒汗。","example":""},{"word":"倒大雨（拚大雨）","pinyin":"doˋ tai iˋ (biang tai iˋ)","def":"傾盆大雨，下大雨，彷彿用倒的。 例如：打風馳个天時，一下四方八面烏雲遮天，跈等就倒大雨。","example":""},{"word":"東弓晴，西弓雨","pinyin":"dungˊ giungˊ qiangˇ，xiˊ giungˊ iˋ","def":"東邊出現彩虹，將會是大晴天，不會下雨，西邊出現彩虹，則會下雨，描述自然現象。","example":""},{"word":"搕下來","pinyin":"ebˋ haˊ loiˇ","def":"土崩蓋下來。 例如：山仔搕下來，該家人走毋掣，屋仔連人跈等就分佢搕忒吔。","example":""},{"word":"漚雨","pinyin":"eu iˋ","def":"久雨不止。 例如：漚雨漚歸隻月，毋知幾時正會好天？","example":""},{"word":"火炎炎仔","pinyin":"foˋ iam iam eˋ","def":"形容天氣非常炎熱。 例如：熱天个日頭盡烈，歸日火炎炎仔。","example":""},{"word":"火煙𠖄天","pinyin":"foˋ ienˊ dungˊ tienˊ","def":"濃煙瀰漫遮蔽了天空。 例如：迎龍个紙炮仔打到火煙𠖄天，強強會看毋著路吔。","example":""},{"word":"火𤊶泥","pinyin":"foˋ ladˋ naiˇ","def":"火燒草木物品產生的灰與土，可做肥料促進植物根莖的成長。","example":""},{"word":"火路","pinyin":"foˋ lu","def":"隔火區，為防止火苗蔓延。 例如：火燒山哩！遽遽開火路，正毋會歸片山仔燒淨淨。","example":""},{"word":"火屎","pinyin":"foˋ siiˋ","def":"木柴、煤炭等燃燒後之餘燼。 例如：倒火屎愛注意防火安全。","example":""},{"word":"風溜溜仔","pinyin":"fungˊ liuˋ liuˋ eˇ","def":"清風吹拂的樣子。 例如：今晡日騎車仔上班，歸路風溜溜仔，異舒爽。","example":""},{"word":"峎頂","pinyin":"gien dangˋ","def":"山嶺之最高處。 例如：大部分个人蹶山最尾目標都係峎頂。","example":""},{"word":"坑壢【山壢坑】","pinyin":"hangˊ lagˋ【sanˊ lagˋ hangˊ】","def":"溝壑。 例如：寒天个坑壢愛尋著水个機會較少。","example":""},{"word":"行山【走山】","pinyin":"hangˇ sanˊ【zeuˋ sanˊ】","def":"因地層滑動，導致山位移。 例如：地動搖啊去，異會造成行山。","example":""},{"word":"毫光【豪光】","pinyin":"hauˊ gongˊ【hoˊ gongˊ】","def":"在陰暗中顯現的光芒。 例如：該隻石牯，放在暗个地方會發出毫光。","example":""},{"word":"氣湧湧","pinyin":"hi iungˋ iungˋ","def":"熱氣往上蒸騰或湧出的樣子。 例如：過年蒸粄仔，大鑊滾水氣湧湧，開鑊蓋時愛細義兜仔。","example":""},{"word":"翕翕","pinyin":"hibˋ hibˋ","def":"沉悶不通風的樣子。 例如：浴堂無開窗門會翕翕。","example":""},{"word":"炣日","pinyin":"hoˊ ngidˋ","def":"太陽熱氣逼人。 例如：日頭恁烈，紅毛泥埕項盡炣日。","example":""},{"word":"河壩壢","pinyin":"hoˇ ba lagˋ","def":"河溝。","example":""},{"word":"熇蝦公樣仔","pinyin":"hogˋ haˇ gungˊ iong eˋ","def":"比喻在烈日下極為乾熱的樣子。 例如：在恁烈个日頭下做事，像在該熇蝦公樣仔。","example":""},{"word":"旱坑","pinyin":"honˊ hangˊ","def":"乾涸的溪流流域。 例如：有人會在旱坑尋較特別个石頭。","example":""},{"word":"煙烔烔仔","pinyin":"ienˊ dungˇ dungˇ eˋ","def":"濃煙漫布的樣子。 例如：隔壁火燒屋，歸間屋煙烔烔仔，還得人驚。","example":""},{"word":"夭泥","pinyin":"ieuˊ naiˇ","def":"濕軟的泥巴。 例如：細人仔搞夭泥膏到歸面烏烏。","example":""},{"word":"應聲","pinyin":"in sangˊ","def":"回音。 例如：喊門喊盡久都無人應聲。 例如：在高山頂大聲喊，會聽著自家个應聲。","example":""},{"word":"壅塵打灰","pinyin":"iungˊ ciinˇ daˋ foiˊ","def":"積了一層灰塵。 例如：歸間屋仔壅塵打灰，毋知幾久無拚掃吔。","example":""},{"word":"壅壅","pinyin":"iungˊ iungˊ","def":"塵土飛揚貌，散亂凌亂貌。 例如：歸間屋壅壅，窗門打開來分佢散。","example":""},{"word":"榮榮","pinyin":"iungˇ iungˇ","def":"形容草木茂盛的樣子。 例如：該桃花開到榮榮，蜂仔、揚蝶仔乜來鬥鬧熱。","example":""},{"word":"企死","pinyin":"kiˊ xiˋ","def":"形容因乾旱或病蟲害，樹木立著枯死。 例如：這樹仔企死，阿爸講愛倒忒去。","example":""},{"word":"冷泧泧仔","pinyin":"langˊ vedˋ vedˋ eˇ【langˊ vadˋ vadˋ eˊ】","def":"形容冰冷的樣子。 例如：冬下頭，水龍頭撙啊開，水都冷泧泧仔。","example":""},{"word":"冷沁冷沁","pinyin":"langˊ xim langˊ xim","def":"形容天氣或空間陰冷的樣子。 例如：正入啊來這間屋仔，背囊試著冷沁冷沁。","example":""},{"word":"冷膣冷泧","pinyin":"langˊ ziiˊ langˊ vedˋ/vadˋ","def":"形容食物或水很冷的樣子。 例如：這水果冷膣冷泧，愛仰般食？ 例如：桌項个飯毋好放到冷膣冷泧，遽來食！","example":""},{"word":"溓溓","pinyin":"liamˋ liamˋ","def":"形容水減少了。 例如：田肚溓溓，愛遽去旱水，係無，禾仔會消忒。","example":""},{"word":"溓淨淨","pinyin":"liamˋ qiang qiang","def":"水乾涸掉了。 例如：河壩个水溓淨淨，連魚仔都無看著。","example":""},{"word":"溓忒【溓核】","pinyin":"liamˋ tedˋ【liamˋ hedˋ】","def":"水漸乾涸。 例如：恁久無落雨，陂塘个水溓忒吔。","example":""},{"word":"蔭蔭","pinyin":"lim lim","def":"陽光被遮蔽陰暗的樣子。 例如：這條路蔭蔭，行起來得人驚得人驚。","example":""},{"word":"涼習習仔","pinyin":"liongˇ xib xib eˋ","def":"形容涼爽舒適。 例如：恁久天時涼習習仔，異鬆爽。","example":""},{"word":"涼沁沁仔","pinyin":"liongˇ xim xim eˋ","def":"形容涼入心扉。 例如：這碗冰食落肚，歸身仔試著涼沁沁仔。","example":""},{"word":"老樹開花","pinyin":"loˋ su koiˊ faˊ","def":"老樹開花，引申為年紀大了才懷孕。","example":""},{"word":"熡【灰屎】","pinyin":"loˊ【foiˊ siiˋ】","def":"灰燼，為紙類燒盡之產物。 例如：頭擺，燒金紙个熡，愛放長流水流走。","example":""},{"word":"落毋成雨","pinyin":"log mˇ sangˇ iˋ","def":"下不了什麼雨。 例如：外背雨點跌啊跌，天還異開落毋成雨啦。","example":""},{"word":"落雨浙濟","pinyin":"log iˋ zab ze","def":"形容雨天濕漉泥濘。 例如：這下落大雨，落雨浙濟，你行路愛細義兜仔。","example":""},{"word":"窿底【落窩】","pinyin":"lungˇ daiˋ【log voˊ】","def":"地勢最低的水路區域。 例如：窿底个圳溝肚有盡多蜆仔好覓。","example":""},{"word":"滿山滿屻（滿山滿谷）【滿山滿野】","pinyin":"manˊ sanˊ manˊ in (manˊ sanˊ manˊ gugˋ)【manˊ sanˊ manˊ iaˋ/iaˊ】","def":"滿山遍野。 例如：山花開到滿山滿屻。","example":""},{"word":"濛紗煙（濛煙）","pinyin":"mungˇ saˊ ienˊ (mungˇ ienˊ)","def":"霧。「起濛煙」則為起霧之意。","example":""},{"word":"泥肉","pinyin":"naiˇ ngiugˋ","def":"可種植之土壤，指植物根部能夠吸收到養分的土層。 例如：這坵田个泥肉肥又賁，無論蒔禾抑係種菜就當會生。","example":""},{"word":"日朔","pinyin":"ngidˋ sogˋ","def":"白晝。 例如：冬至到，日朔短。","example":""},{"word":"日枷晴，夜枷雨","pinyin":"ngidˋ gaˊ qiangˇ，ia gaˊ iˋ","def":"白天太陽有暈，則天必將晴朗；夜裡月亮有暈，則天必將下雨。","example":""},{"word":"日頭擎枷【日頭㧡枷】","pinyin":"ngidˋ teuˇ kiaˇ gaˊ【ngidˋ teuˇ kaiˊ gaˊ】","def":"太陽戴枷，即「日暈」。 例如：日頭擎枷係難得看著个現象。","example":""},{"word":"熱𤐰𤐰仔","pinyin":"ngied fag fag eˋ","def":"形容炎熱。 例如：天時熱𤐰𤐰仔，這襖你還著得核，還慶哪！","example":""},{"word":"熱漬漬仔","pinyin":"ngied jid jid eˋ","def":"形容天氣非常熱；引申為十分熱衷。 例如：外背熱漬漬仔，先歇下睏來。 例如：佢恁久熟事一個細妹朋友，兩儕行到熱漬漬仔。","example":""},{"word":"屙山","pinyin":"oˊ sanˊ","def":"山崩塌下來。 例如：這擺風搓發風落雨，阿玲厥屋背屙山，佢嚇到毋敢轉。","example":""},{"word":"潑雨","pinyin":"padˋ iˋ","def":"被雨水斜向潑打。 例如：外背潑雨，遽啊同窗仔門關微來。","example":""},{"word":"拋花作浪","pinyin":"pauˊ faˊ zogˋ long","def":"形容水勢湍急、波濤洶湧，猶如「浪花滔天」。 例如：逐擺風搓來，港口都會見著拋花作浪个海湧。","example":""},{"word":"芃塞（塞芃芃仔）","pinyin":"pong sedˋ (sedˋ bongˇ bongˇ eˋ)","def":"雜草叢生的樣子。 例如：屋背該條細路仔芃塞，怕異久無人行吔。","example":""},{"word":"清冷","pinyin":"qiangˇ langˊ","def":"形容清涼而寒冷的天氣。 例如：朝晨頭䟘起來試著清冷清冷，著加一領衫正毋會寒著。","example":""},{"word":"三洽水","pinyin":"samˊ gabˋ suiˋ","def":"三河交會處。 例如：借問一下哪位有三洽水个景緻？","example":""},{"word":"山峎","pinyin":"sanˊ gien","def":"山脊的稜線。","example":""},{"word":"山坑壁壢角","pinyin":"sanˊ hangˊ biagˋ lagˋ gogˋ","def":"山谷偏僻的角落。 例如：罕得見著人影个山坑壁壢角，有毛蟹、水揚尾在這位自在絡食。","example":""},{"word":"山林壁角","pinyin":"sanˊ naˇ biagˋ gogˋ","def":"山林偏僻的角落。 例如：佢歇在該山林壁角，愛出來割一料豬肉都無恁該。","example":""},{"word":"山排","pinyin":"sanˊ paiˇ","def":"山頂與平地間的斜面地帶，即山坡或山腰。","example":""},{"word":"生溜苔","pinyin":"sangˊ liuˊ toiˇ","def":"長青苔。 例如：路係久無行，就會生溜苔。","example":""},{"word":"塞哱哱仔","pinyin":"sedˋ bog bog eˋ","def":"雜草叢生。 例如：這草埔塞哱哱仔，驚怕有蛇哥。","example":""},{"word":"星仔瀉屎","pinyin":"senˊ eˋ xia siiˋ","def":"流星。","example":""},{"word":"蔭著","pinyin":"lim doˋ","def":"被陰影遮去日光，以致發育不良。 例如：較偎樹林个禾仔分樹仔蔭著，試著種毋會大樣仔。","example":""},{"word":"水竇肚","pinyin":"suiˋ deu duˋ","def":"水裡。 例如：聽講該水竇肚有水蛇，毋知有影無？","example":""},{"word":"水汶汶","pinyin":"suiˋ vunˇ vunˇ","def":"水渾濁的樣子。 例如：風搓過後，河壩水汶汶，還有當多大水樵打下來。","example":""},{"word":"大水頭","pinyin":"tai suiˋ teuˇ","def":"山洪爆發時，首先到達的洪水。 例如：外背大水頭，還得人驚。","example":""},{"word":"递","pinyin":"taiˊ","def":"蔓延、蔓生。 例如：雷公根當會递，递到哪生到哪。","example":""},{"word":"天年倒貶","pinyin":"tienˊ ngienˇ do bienˋ","def":"節氣反常，也可用於價值觀等反常狀態。 例如：天年倒貶，朳仔打牛眼。（諺）","example":""},{"word":"斷雨腳","pinyin":"tonˊ iˋ giogˋ","def":"久雨後，雨停了。 例如：歸隻月雨落無停，到昨晡日正斷雨腳。","example":""},{"word":"推山","pinyin":"tuiˇ sanˊ","def":"山崩塌。 例如：地動最驚推山埋人个災害。","example":""},{"word":"泧冷","pinyin":"vadˋ langˊ","def":"很冷，亦可引申為心灰意冷。 例如：恁寒个天，若菜還冰到泧冷，麼人愛食？ 例如：分佢恁樣講啊去，心肝黏時就泧冷。","example":""},{"word":"死泥團","pinyin":"xiˋ naiˇ tonˇ","def":"硬泥塊，引申為不懂變通的笨蛋。 例如：這死泥團！愛仰仔教？送去外背分先生教較贏。","example":""},{"word":"燥衣㪐殼","pinyin":"zauˊ iˊ ludˋ hogˋ","def":"形容乾旱，植物乾枯得脫落了枯葉。 例如：農作物都燥衣㪐殼，有可能係天旱造成个，也有可能係分雷公打个。","example":""},{"word":"做寒","pinyin":"zo honˇ","def":"寒流來襲。 例如：過舊曆年堵著做寒最畏落雨。","example":""},{"word":"轉秋","pinyin":"zonˋ qiuˊ","def":"進入秋天、初秋。 例如：轉秋哩！暗晡頭有較涼兜仔吔。","example":""},{"word":"轉風頭","pinyin":"zonˋ fungˊ teuˇ","def":"變天，指好好的天，突然暗下來又吹起冷風。 例如：轉風頭哩！等下驚怕會拚大雨哦！","example":""},{"word":"竹篙浪","pinyin":"zugˋ goˊ long","def":"下雨又刮風時，引起的陣陣雨浪。 例如：風搓天較會出現竹篙浪。","example":""},{"word":"凝油鏡","pinyin":"kienˇ iuˇ giang","def":"水面上有幾滴汙油，像鏡面一樣。 例如：機油滴落水面項會有凝油鏡个現象。","example":""},{"word":"低湖（低瓤）","pinyin":"daiˊ fuˇ (daiˊ nongˊ)","def":"低窪地區。 例如：發大水該下，較低湖个所在，當會浸水。","example":""},{"word":"當風","pinyin":"dongˊ fungˊ","def":"風很強勁、迎風的（地方）。 例如：毋好企在當風个所在，會襲著風。","example":""},{"word":"蔫忒【殗核】","pinyin":"lien tedˋ【ngiem hedˋ】","def":"形容萎縮、無生氣的樣子。","example":""},{"word":"朝朝（朝忒）","pinyin":"ceuˇ ceuˇ (ceuˇ tedˋ)","def":"植物失去水分枯萎。","example":""},{"word":"巴巴揫等","pinyin":"baˊ baˊ qiuˊ denˋ","def":"許多東西一起附在上面。 例如：一矻糖仔跌在地泥項，歸陣仔蟻公巴巴揫等。","example":""},{"word":"半攔半出","pinyin":"ban lanˇ ban cudˋ","def":"有的溢出有的留住。 例如：老妹手巴掌忒細，洗米該下半攔半出，米流忒一半。 例如：老弟抔穀裝袋仔，袋仔無牽好，搣到半攔半出。","example":""},{"word":"暴線縫","pinyin":"bau xien pung","def":"衣物縫合處裂開。 例如：佢跍落去愛拈手機仔，毋堵好褲襠嗄弓到暴線縫，佢敗勢到遽遽拿面衫遮等。","example":""},{"word":"噼忒【噼核】","pinyin":"biag tedˋ【biag hedˋ】","def":"爆裂掉。 例如：頭那吹著冷風，痛到強強會噼忒。","example":""},{"word":"必必","pinyin":"bidˋ bidˋ","def":"表面有很多裂痕的樣子，可用於形容物品、水果、皮膚表面。如「勺嫲晒到必必」、「蓮霧擲到必必」、「嘴脣分風交到必必」。","example":""},{"word":"筆胠胠","pinyin":"bidˋ kia kia","def":"毛筆筆尖張開不聚，屬已不適宜寫字之狀態。","example":""},{"word":"必壢","pinyin":"bidˋ lagˋ","def":"裂開成溝痕。 例如：恁久天旱無落雨，田泥係晒必壢，愛加當多水來放。","example":""},{"word":"必壢必壢","pinyin":"bidˋ lagˋ bidˋ lagˋ","def":"形容龜裂。 例如：頭前个紅毛泥路歸條必壢必壢，行毋得哩。","example":""},{"word":"筆擂擂","pinyin":"bidˋ luiˇ luiˇ","def":"筆尖磨損的樣子。 例如：係講筆擂擂也還寫到恁靚，該就嶄然會喲！","example":""},{"word":"綻皮","pinyin":"can piˇ","def":"表皮翹起，通常指表皮撕裂翻轉。如「樹仔綻皮」表示樹的表皮翹起、「手指綻皮」表示指甲邊細小皮膚翹起。","example":""},{"word":"臭水菇【臭水合】","pinyin":"cu suiˋ guˊ【cu suiˋ gagˋ】","def":"食物因長浸水中而產生的腐敗臭味。 例如：頭擺窮苦人，連臭水菇个番薯都還煮來食。","example":""},{"word":"打竳","pinyin":"daˋ denˇ","def":"豎立。 例如：這竹篙愛打竳放，打橫放會徑著人。","example":""},{"word":"打翻彈【翻石打腦】","pinyin":"daˋ fanˊ tanˇ【fanˊ sag daˋ noˋ】","def":"反彈，引申為不認帳。 例如：這筆生理講到好好，包尾佢嗄打翻彈。","example":""},{"word":"沾腳目【沾腳目珠仁】","pinyin":"demˊ giogˋ mugˋ【demˊ giogˋ mugˋ zuˊ inˇ】","def":"浸到腳踝。 例如：臺灣錢，沾腳目。（諺）","example":""},{"word":"倒草","pinyin":"do coˋ","def":"牛反芻，也可諷刺人吃東西吃得很慢。 例如：會倒草个動物，性體較馴良。 例如：佢食東西像牛倒草共樣，慢趖趖仔。","example":""},{"word":"倒頭","pinyin":"doˋ teuˇ","def":"過世。 例如：人一倒頭就無氣無脈哩。","example":""},{"word":"熰火","pinyin":"eu foˋ","def":"將物品聚集在一起焚燒。 例如：田項个野草會拿來熰火做肥。","example":""},{"word":"返生","pinyin":"fanˋ sangˊ","def":"復活。 例如：剷草定著愛斬草除根，日後正毋會返生。","example":""},{"word":"腐忒【腐核】","pinyin":"fuˊ tedˋ【fuˊ hedˋ】","def":"物體腐爛變成粉狀。","example":""},{"word":"合陣","pinyin":"gabˋ ciin","def":"兩個以上的隊伍合併在一起。 例如：係愛合陣去乜做得，𠊎先來打電話定位仔。","example":""},{"word":"間等來","pinyin":"gam denˋ loiˇ","def":"間隔交錯出現著。 例如：係講時間正經講毋會好勢，你兩儕間等來乜無相干。","example":""},{"word":"堅堅","pinyin":"gienˊ gienˊ","def":"因水分蒸發而變堅韌的樣子。 例如：甜粄晒到堅堅，食起來本本恁香。","example":""},{"word":"走爭【走盞】","pinyin":"zeuˋ zangˊ【zeuˋ zanˋ】","def":"失去準確度、離開原位。 例如：這櫃仔放這片輒輒走爭，愛徙到較平个地方。 例如：佢這駁仔个表現多少仔有走爭，係毋係屋下發生麼个事情？","example":""},{"word":"跔","pinyin":"giuˊ","def":"向內縮。如「跔手跔腳」即縮手縮腳。 例如：天時恁寒，佢囥在眠床肚跔等睡。","example":""},{"word":"現現","pinyin":"hien hien","def":"顯露的樣子；現成。 例如：若衫恁薄，著等圓身看現現，遽遽去換過一領。 例如：明明佢現現有錢，就硬硬毋拿去還人。","example":""},{"word":"現淨淨","pinyin":"hien qiang qiang","def":"全部呈現出來。 例如：手巴掌毋好全下打開，會現淨淨。","example":""},{"word":"弛走","pinyin":"ieˊ zeuˋ","def":"從上往下向外滑動。 例如：貨車頂个東西愛䌈緪，在路項係弛走跌下來，會害人發生車禍。","example":""},{"word":"翹翹橫","pinyin":"kieu kieu vang","def":"指人有頻頻倒下的行為或動作。 例如：你哦！歸路仔翹翹橫，算來係食幾多酒啊？","example":""},{"word":"開析","pinyin":"koiˊ sagˋ","def":"裂開成兩片。 例如：西瓜破開析，一析切來食，一析分你帶轉去。","example":""},{"word":"綑綑碾","pinyin":"kunˋ kunˋ zan/gunˋ gunˋ zan","def":"打滾、滾動。 例如：佢出力一擲，球仔就飛到當遠个地方綑綑碾。","example":""},{"word":"輪啊過","pinyin":"lin a go","def":"滾過去。 例如：該球仔對厥面前輪啊過，一路溜到大路項。","example":""},{"word":"無油無臘","pinyin":"moˇ iuˇ moˇ lab","def":"形容食物缺少油脂。 例如：這盤菜無油無臘，毋好食。","example":""},{"word":"無骨無屑","pinyin":"moˇ gudˋ moˇ sud/sebˋ","def":"完全沒有剩餘。 例如：佢肚屎當枵，歸桌个東西食到無骨無屑。","example":""},{"word":"凝心","pinyin":"nenˇ ximˊ","def":"轉動之物，因重心穩定，中心呈現靜止的狀態。 例如：這極樂仔打到當凝心，當生趣。","example":""},{"word":"韌喈喈仔","pinyin":"ngiun gaiˇ gaiˇ eˋ","def":"形容食物柔軟卻不易嚼爛。 例如：豬腸係無用大火炒，會韌喈喈仔。","example":""},{"word":"漂啊過","pinyin":"piu a go","def":"從物體表面擦行而過。 例如：打水漂仔該下，打出个石頭在該水面漂啊過。","example":""},{"word":"漂走","pinyin":"piu zeuˋ","def":"滑走、失手。 例如：佢逐擺標工程就當準，盡少漂走。","example":""},{"word":"蝕水","pinyin":"sad suiˋ【siid suiˋ】","def":"烹調時，所調理的食品很會吸收水分。 例如：冬粉毋好煮忒久，會蝕水。","example":""},{"word":"生狗屎毛","pinyin":"sangˊ gieuˋ siiˋ moˊ","def":"食物因發霉而長出長長細細的白色菌絲。 例如：雞卵糕無放冰箱肚冰，毋記得嗄放到生狗屎毛。","example":""},{"word":"消蝕","pinyin":"seuˊ sad","def":"減損、虧耗。 例如：賭徼毋止消蝕體力，又浪費時間，實在係加了个。","example":""},{"word":"消磨","pinyin":"seuˊ moˊ","def":"因使用而漸漸減損。 例如：屋下人多事重，生活消磨異大。","example":""},{"word":"收煞","pinyin":"suˊ sadˋ","def":"原指樂器停止的聲音，用以指稱結尾、結束。 例如：事情舞到恁大棚，這下難收煞哩。","example":""},{"word":"水泧泧仔","pinyin":"suiˋ ved ved eˋ","def":"水分過多的樣子，常指本來不該有水而仍然水分未乾或變成有水的狀態。 例如：這碗冷飯放到水泧泧仔，怕食毋得哩！ 例如：水粄仔摝到水泧泧仔，無人想食！","example":""},{"word":"停跎","pinyin":"tinˇ toˇ","def":"停止；延遲。 例如：佢十分無閒，一年透天無停跎。","example":""},{"word":"斷利利","pinyin":"tonˊ li li","def":"完全斷掉、斷得俐落。 例如：該條鐵鍊仔分佢鋸到斷利利。","example":""},{"word":"突走","pinyin":"tud zeuˋ","def":"山脈等因自然力滑動而移動了位置；東西脫離了原來的現狀。 例如：自上擺地動過後，歸個山仔突走五十公尺恁遠著。 例如：穀袋原旦疊到好好，毋知仰仔會突走。","example":""},{"word":"通通透透","pinyin":"tungˊ tungˊ teu teu","def":"相通沒有阻礙。 例如：都市个捷運通通透透，愛去哪位都會異利便。","example":""},{"word":"滑髀","pinyin":"vad biˋ","def":"從開叉處裂開。 例如：跳舞个時節，擘腳開來愛試試仔，毋好忒放勢，係無會滑髀。 例如：柚仔打到當結，吊在樹桍項，強強會滑髀忒吔！","example":""},{"word":"換向","pinyin":"von hiong","def":"換個方向，亦可說「轉向」。 例如：聽講有人膨床睡久會換向。 例如：朝晨頭向西坐，下晝頭愛換向向東坐，正毋會晟著日頭。","example":""},{"word":"瀉下來","pinyin":"xia haˊ loiˇ","def":"坍塌下來。如「山壁瀉下來」。","example":""},{"word":"蹍前","pinyin":"zanˋ qienˇ","def":"提前、往前挪。 例如：阿貴禮拜二生日，厥恁多隻倈仔蹍前同佢做生日。","example":""},{"word":"燥胗胗仔","pinyin":"zauˊ kinˊ kinˊ eˋ","def":"食物缺少水分的樣子。 例如：這肉乾燥胗胗仔，吞毋落胲。","example":""},{"word":"燥水","pinyin":"zauˊ suiˋ","def":"乾燥到無水分的狀態。 例如：洗淨俐个筷仔愛放燥水正收起來。","example":""},{"word":"側側仔","pinyin":"zedˋ zedˋ eˇ","def":"略微側向一邊。 例如：門毋罅闊，這張四方桌愛側側仔正入得。","example":""},{"word":"側走","pinyin":"zedˋ zeuˋ","def":"偏了，傾斜了。 例如：上擺地動搖啊去，這棟老屋仔就側走吔。","example":""},{"word":"走色","pinyin":"zeuˋ sedˋ","def":"顏色變了、不對；原來的顏色走樣了。 例如：佢有一領紅色个洋裝，分日頭晒著嗄走色吔。","example":""},{"word":"轉忒【轉核】","pinyin":"zon tedˋ【zon hedˋ】","def":"物體倒下，多用於較高大的物體，如屋、樹、牆等。 例如：做大水哩！異多屋仔分水沖轉忒。 例如：這擺地動，轉忒幾下間大樓。","example":""},{"word":"轉潤","pinyin":"zonˋ iun","def":"乾燥物變濕，如糖鹽之類吸收空氣中之水分而變濕。如「餅仔轉潤」。","example":""},{"word":"轉手","pinyin":"zonˋ suˋ","def":"換到別人手上。 例如：好好个東西，一轉手到厥手項，跈等就分佢搣壞。","example":""},{"word":"轉水","pinyin":"zonˋ suiˋ","def":"鹽糖結晶體受潮變液體的過程。如「鹽轉水」、「水粄轉水」。","example":""},{"word":"無爭","pinyin":"moˇ zangˊ","def":"沒什麼要緊。反之，則為「有爭」。 例如：無爭啦！你儘採煮，有好食就好。","example":""},{"word":"鴨仔吞紅䘆","pinyin":"abˋ eˇ tunˊ fungˇ hienˋ","def":"鴨子吞蚯蚓，比喻吃得爽快可口。","example":""},{"word":"鴨嫲嘴罔吮","pinyin":"abˋ maˇ zoi mongˋ qionˋ","def":"母鴨覓食，胡亂啄食，多多少少會有收穫，比喻不妨一試。","example":""},{"word":"暗間仔","pinyin":"am gienˊ eˋ","def":"本指黑暗的房間，後引申為性交易場所。","example":""},{"word":"粄脆","pinyin":"banˋ ce","def":"米磨成漿經濾乾後的米漿塊。","example":""},{"word":"粄印","pinyin":"banˋ in","def":"印紅龜粄的模子。","example":""},{"word":"粄簝仔","pinyin":"banˋ liauˊ eˋ","def":"蒸粄用的平面竹器蒸架。 例如：係用鑊仔蒸菜抑係蒸粄仔，愛用粄簝仔較遽熟。","example":""},{"word":"粄嫲【粄脆】","pinyin":"banˋ maˇ【banˋ ce】","def":"燙熟的粄脆。做粄類食品時，將它滲入粄脆中，便於搓揉。 例如：愛做菜包進前个粄脆，定著愛有一息熝熟个粄嫲來攞正亼得入軟。","example":""},{"word":"粄袋","pinyin":"banˋ toi","def":"盛裝粄漿的布袋。 例如：做甜粄个米挨變米漿了後，愛用粄袋䌈起來矺畀溓水。","example":""},{"word":"泌糜飲","pinyin":"bi moiˇ imˋ","def":"飯煮熟時，把飯裡的湯汁濾出。 例如：頭擺大戶人家用烳鏍煮飯，愛泌糜飲飯正會好食。","example":""},{"word":"篦仔","pinyin":"bi eˋ","def":"細齒梳子。","example":""},{"word":"放竳","pinyin":"biong denˊ","def":"大人放手，讓學步期的小孩學習站立。","example":""},{"word":"幫刀仔","pinyin":"bongˊ doˊ eˋ","def":"磨刀，為使之鋒利。 例如：頭擺剃頭師傅都會用皮帶幫刀仔，使起來較順手。","example":""},{"word":"幫衫褲","pinyin":"bongˊ samˊ fu","def":"在衣服上擦拭。 例如：老弟逐擺手搣到屙屙糟糟就幫衫褲。","example":""},{"word":"布截仔","pinyin":"bu jiedˋ eˇ","def":"從整匹布中裁剪剩下的零碼布。 例如：永樂市場有各色便宜个布截仔，異多家事科个學生仔去該位選布來練習。","example":""},{"word":"布碎仔","pinyin":"bu sui eˋ","def":"裁縫時剪裁剩下的布片。 例如：頭擺人个布碎仔哪有好攉忒，愛留來補衫褲。","example":""},{"word":"裁桌","pinyin":"caiˇ zogˋ","def":"將桌子擺放妥當。 例如：張伯姆好手腳，火一著喊裁桌。","example":""},{"word":"傪菜","pinyin":"cam coi","def":"形容菜餚豐盛。 例如：年三十暗晡，阿姆煮十過項菜，還傪菜哦！","example":""},{"word":"晟燥來","pinyin":"cangˇ zauˊ loiˇ","def":"在陽光下晒乾。 例如：趕這下有日頭，衫褲拿出去晟燥來。","example":""},{"word":"樵草","pinyin":"ceuˇ coˋ","def":"原指供炊事的木柴及糧草，現泛指供炊事的木柴。 例如：現代社會注重環保，既經無人用樵草來煮食吔。","example":""},{"word":"搓㿸（鑪㿸）","pinyin":"co man (lu man)","def":"搓去皮膚上的汙垢。 例如：洗身愛用面帕搓㿸，正洗得淨俐。","example":""},{"word":"菜蓋","pinyin":"coi habˋ","def":"蔬菜外層的老葉。 例如：菠麗菜个菜蓋老老，阿婆講愛同佢擇忒去做肥料。","example":""},{"word":"菜湯腳","pinyin":"coi tongˊ giogˋ","def":"泛指剩菜。 例如：你仰恁晝正到來呢？大家都食飽吔，伸菜湯腳定定。","example":""},{"word":"吹涼","pinyin":"coiˊ liongˇ","def":"因熱而在透風涼快的地方休息。 例如：天時恁熱，電扇撙開來吹涼。","example":""},{"word":"臭黃","pinyin":"cu vongˇ","def":"蔬果過熟的氣味。 例如：這柑仔放忒久，食起來臭黃臭黃。","example":""},{"word":"臭沊","pinyin":"cu dem","def":"指難聞的氣味，一般多因浸於水中過長的時間而發出。 例如：這鹹菜無幾萋，食起來有一息仔臭沊。","example":""},{"word":"臭火煙","pinyin":"cu foˋ ienˊ","def":"形容食物裡有殘留柴火的煙味。 例如：餔娘高天天，煮飯臭火煙；餔娘矮㑁㑁，煮飯香馞馞。（謠）","example":""},{"word":"臭火𤊶","pinyin":"cu foˋ ladˋ","def":"燒焦，亦可說「臭火燒」。 例如：煮飯煮忒過火，會臭火𤊶。","example":""},{"word":"臭翕","pinyin":"cu hibˋ","def":"物品受潮悶出發臭的氣味。 例如：這間屋當久無人歇，故所臭翕臭翕。","example":""},{"word":"臭殕","pinyin":"cu puˋ","def":"物品因潮濕而生的霉味。 例如：漚雨个時節，歸屋間都臭殕味。 例如：這領衫在衫櫥肚放歸年正拿出來，臭殕臭殕，愛洗過正做得著。","example":""},{"word":"重屋","pinyin":"cungˇ vugˋ","def":"蓋第二層以上屋頂；換屋頂的茅草，多指茅屋屋頂換新或再加新茅草。 例如：頭擺人戴茅屋逐年都愛重屋，就係驚漏雨。","example":""},{"word":"打粉","pinyin":"daˋ funˋ","def":"在臉上搽粉。","example":""},{"word":"打淡食【食淨飯】","pinyin":"daˋ tamˊ siid【siid qiang fan】","def":"沒有配菜，只有吃白飯而已。 例如：食飯愛傍菜正有營養，毋好打淡食。","example":""},{"word":"打裎脧","pinyin":"daˋ qin zoiˊ","def":"小男孩下體裸露。 例如：上早个細人仔，熱天全係著肚褡褲或者打裎脧。","example":""},{"word":"擔頭","pinyin":"damˊ teuˇ","def":"擔子，引申為肩上的責任。","example":""},{"word":"單家園屋","pinyin":"danˊ gaˊ ienˇ vugˋ","def":"獨立家屋，意指單獨的住家，周圍沒有鄰居。","example":""},{"word":"得入毋得出","pinyin":"dedˋ ngib mˇ dedˋ cudˋ","def":"能進不能出。 例如：細人仔个頭那卡入柵欄肚，得入毋得出。","example":""},{"word":"跌落飯甑下","pinyin":"diedˋ log fan zen haˊ","def":"掉落在飯桶下，喻沒趕上吃飯的時間。","example":""},{"word":"跌馬","pinyin":"diedˋ maˊ","def":"指火車、門窗等脫軌。 例如：下晝火車跌馬，車枋个時間做下拖著吔。","example":""},{"word":"跌磕（跌巖）","pinyin":"diedˋ ngabˋ (diedˋ ngam)","def":"地平落差，常用於樓梯或山路。 例如：這碫仔在這位有異大个跌磕，大家行到這片來愛細義。","example":""},{"word":"跌齾","pinyin":"diedˋ ngadˋ","def":"刻度落差。 例如：溫度計緊跌齾下來，天時緊來緊寒吔。","example":""},{"word":"改番薯菇仔","pinyin":"goiˋ fanˊ suˇ guˊ eˋ","def":"挖掘田主遺漏的番薯。","example":""},{"word":"頓水","pinyin":"dunˋ suiˋ","def":"阻擋水，使之停止流動，有蓄水之意。 例如：阿公用泥團頓水，田項个水正毋會流淨淨。","example":""},{"word":"揰木瓜","pinyin":"dungˋ mugˋ guaˊ【tung mugˋ guaˊ】","def":"用竹竿把木瓜從樹上捅下來。","example":""},{"word":"搕泥","pinyin":"ebˋ naiˇ","def":"用泥土掩埋，另言「搕起來」即指用土覆蓋。 例如：綠竹頭逐年都愛搕泥，暴出來个竹筍正會又笨又嫩。","example":""},{"word":"搕塞塞","pinyin":"ebˋ sedˋ sedˋ","def":"被土完全掩蓋。 例如：泥矻仔愛搕塞塞，煨出來个番薯正會好食。","example":""},{"word":"揞細人仔","pinyin":"emˊ se nginˇ eˋ","def":"把小孩抱在胸懷前或放在身旁一起睡覺。","example":""},{"word":"熰火爐堆","pinyin":"eu foˋ luˇ doiˊ","def":"將垃圾堆的垃圾焚燒。 例如：外背熰火爐堆，愛注意毋好遰火燒。","example":""},{"word":"漚淨淨","pinyin":"eu qiang qiang","def":"全都發霉敗壞。 例如：落恁久个雨，西瓜漚淨淨。","example":""},{"word":"漚壞忒【漚壞核】","pinyin":"eu fai tedˋ【eu fai hedˋ】","def":"（受潮）久置壞掉，用於家具為多。 例如：這張凳仔放竹頭下恁多年，漚壞忒哩。","example":""},{"word":"熰火爐","pinyin":"eu foˋ luˇ","def":"產生熱能。 例如：這兜燥稈拿去熰火爐當好。","example":""},{"word":"飯撈（撈勺）","pinyin":"fan leuˇ (leuˇ sog)","def":"撈食物的漏勺。","example":""},{"word":"火燂煤","pinyin":"foˋ tamˇ moiˇ","def":"煤灰。 例如：頭擺个火車燒石炭，烏煙會有火燂煤。","example":""},{"word":"火囪","pinyin":"foˋ cungˊ","def":"火囪，舊時放置煤炭用以取暖的竹製提籃。","example":""},{"word":"戽水","pinyin":"fu suiˋ","def":"把水從一個地方盛起潑出。例如「拿畚斗戽水出去」。","example":""},{"word":"戽魚仔","pinyin":"f
