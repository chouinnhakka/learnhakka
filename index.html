{"word":"活菜秧仔","pinyin":"fad coi iongˊ eˋ","def":"分植蔬菜的幼苗。 例如：有兜菜愛活菜秧仔，分佢有較闊个所在，正大得起來。","example":""},{"word":"翻耕仔","pinyin":"fanˊ gong eˋ","def":"第二期農作物。","example":""},{"word":"火脈先生","pinyin":"foˋ magˋ xinˊ sangˊ","def":"為人把脈看病的醫生。","example":""},{"word":"斛桶（機器楻）","pinyin":"fug tungˋ (giˊ hi fongˇ)","def":"脫穀機。 例如：早期个人割禾，會用斛桶打穀。","example":""},{"word":"奉工","pinyin":"fung gungˊ","def":"義務工作、義務勞動。 例如：河壩項有一板臨時樹枋橋，逐擺分水打忒，附近人家就愛奉工來探轉去。","example":""},{"word":"加水加豆腐","pinyin":"gaˊ suiˋ gaˊ teu fu","def":"做豆腐時，多加水以增加豆腐份量，但黃豆並未增加，喻多多益善；加量不加質，灌水行為，喻不真實。","example":""},{"word":"合貨","pinyin":"gagˋ fo","def":"配置主貨品以發售。 例如：頭過雜貨店賣鹽，係合貨定定，無麼个利存。","example":""},{"word":"交關","pinyin":"gauˊ gonˊ","def":"交易、關照生意。 例如：厥店仔个東西好，價錢實在，𠊎異輒同佢交關。","example":""},{"word":"換工（交工）","pinyin":"von gungˊ (gauˊ gungˊ)【gau gungˊ】","def":"交互支援，完成彼此工作。 例如：割禾時節，尋無恁多人𢯭手，大家愛換工來做。","example":""},{"word":"撿兜尞","pinyin":"giamˋ deuˊ liau","def":"時間充裕，有得休息。 例如：景氣差訂單少，工人撿兜尞。","example":""},{"word":"撿兜做","pinyin":"giamˋ deuˊ zo","def":"工作很多，有得忙。 例如：事頭恁多毋請人𢯭手，頭家撿兜做。","example":""},{"word":"撿工錢","pinyin":"giamˋ gungˊ qienˇ","def":"取或付工資。 例如：這事頭愛做好勢來，頭家正會撿工錢分你。","example":""},{"word":"撿稗仔","pinyin":"giamˋ pai eˋ","def":"有次序地撿除稗草（稗，一種雜草，形似稻子，常混雜稻子當中）。 例如：耕種人較閒工該下，會落田去撿稗仔。","example":""},{"word":"結數","pinyin":"giedˋ sii","def":"結賬。 例如：生理人，逐個月愛結數，正知賺抑了。","example":""},{"word":"見本","pinyin":"gien bunˋ","def":"樣本、樣品。 例如：聽起來斯異做得，有見本好分人看無？","example":""},{"word":"夠工","pinyin":"gieu gungˊ","def":"形容工作時間做得很滿，甚至超時。 例如：今晡日做到恁夠工，東西收收啊好轉夜哩！","example":""},{"word":"緊工","pinyin":"ginˋ gungˊ","def":"農忙、趕工的時候。 例如：佢事頭當多，當緊工，做都做毋忒去。","example":""},{"word":"緊工時節","pinyin":"ginˋ gungˊ siiˇ jiedˋ","def":"指事務繁忙的時候，一般指每年六月農忙時節。 例如：緊工時節，老人細子都愛𢯭手做事。","example":""},{"word":"焗酒","pinyin":"giugˋ jiuˋ","def":"釀酒。","example":""},{"word":"過磅","pinyin":"go bongˇ","def":"越過磅秤之界線，亦可指置於磅秤上秤重量。 例如：百五斤个磅仔拿來秤兩百斤个東西，過磅哩，秤毋出尾。 例如：菜瓜放在磅仔頂項過磅，看有幾重？","example":""},{"word":"趕事","pinyin":"gonˋ se","def":"趕工。 例如：這工廠當趕事，連暗晡頭乜電火通透。","example":""},{"word":"孤行獨市","pinyin":"guˊ hongˇ tug sii","def":"獨占事業。 例如：做生理，儕儕就想孤行獨市，沒斗仔全部自家賺，到尾會做末忒。","example":""},{"word":"起榼","pinyin":"hiˋ kuagˋ","def":"開始動工。 例如：你講愛開自助餐个中央廚房，準備好吂？哪久愛起榼？","example":""},{"word":"號頭","pinyin":"ho teuˇ","def":"號碼，記數的字或符號。 例如：現下去銀行辦事情，大家都愛先拿號頭來排列仔。","example":""},{"word":"一掖禾仔","pinyin":"idˋ ie voˇ eˋ","def":"一行稻子。","example":""},{"word":"移撥轉借","pinyin":"iˇ badˋ zonˋ jia","def":"指金錢往來。 例如：做生理，錢銀來去移撥轉借係難免个，總愛有借有還就做得。","example":""},{"word":"贏徼【贏博】","pinyin":"iangˇ gieuˋ【iangˇ bogˋ】","def":"賭博贏了，相反即為「輸徼」。","example":""},{"word":"一包捎","pinyin":"idˋ bauˊ sauˊ","def":"表全部，多用於買賣行為。 例如：人講生理各人做，有錢大家賺，毋好總係想一包捎，做下自家來。","example":""},{"word":"蔭水","pinyin":"im suiˋ","def":"引水進田灌溉；淹水，被水覆蓋。 例如：番薯種落去，隔一暗晡就做得蔭水，番薯壟愛蔭畀透。","example":""},{"word":"秧盆（秧船）","pinyin":"iongˊ punˇ (iongˊ sonˇ)","def":"插秧時用來裝秧苗的盆子。","example":""},{"word":"幼工","pinyin":"iu gungˊ","def":"手工精細。例如「這身衫當幼工」。","example":""},{"word":"有剝","pinyin":"iuˊ bogˋ","def":"有希望，有利可圖，反義詞為「無剝」。 例如：這所在偎海脣雨水較多，係來賣防水用品怕較有剝哦！","example":""},{"word":"壅肥","pinyin":"iungˊ piˇ","def":"用泥土或肥料培養植物的根部。 例如：種番薯愛壅肥上土正會大條。","example":""},{"word":"剪綹仔","pinyin":"jienˋ liu eˋ","def":"扒手。","example":""},{"word":"極毋出水（撚毋出水）","pinyin":"kid mˇ cudˋ suiˋ (ngienˋ mˇ cudˋ suiˋ)","def":"擠不出半滴水，引申為拿不出錢。 例如：這駁仔手頭緪，極毋出水好還你哦！","example":""},{"word":"揜蝦公","pinyin":"kiebˋ haˇ gungˊ","def":"用小型網子捕蝦。 例如：掌牛哥仔牽牛落河壩，牛索縈起來，放佢食草，自家就去揜蝦公、捉狗蛄硺。","example":""},{"word":"牽猴仔","pinyin":"kienˊ heuˇ eˋ","def":"拉皮條。","example":""},{"word":"牽豬哥","pinyin":"kienˊ zuˊ goˊ","def":"原指舊時農業社會，牽著種豬到各農戶，方便母豬受精，以便繁衍的行業，今則戲謔為介紹男女媒合之意。 例如：牽豬哥─賺暢。","example":""},{"word":"靠天絡食","pinyin":"ko tienˊ logˋ siid","def":"看天候來謀生。","example":""},{"word":"開錢","pinyin":"koiˊ qienˇ","def":"分攤經費。 例如：𫣆兜這隻社區三個月來打鬥四一擺，大家平平共下開錢，較會長久。","example":""},{"word":"開山打林","pinyin":"koiˊ sanˊ daˋ naˇ","def":"開墾荒地，亦可說「開林」。","example":""},{"word":"開田","pinyin":"koiˊ tienˇ","def":"闢地為田。","example":""},{"word":"掄空","pinyin":"lemˇ kungˊ","def":"掏空；挖洞。 例如：這間公司个財產分會計掄空。 例如：田塍分蛤蟆掄空，堵堵好放支塑膠管落去，旱水較利便。","example":""},{"word":"捋禾串","pinyin":"lod voˇ con","def":"將穀子從穗中扯下。 例如：耕田人想愛禾仔靚、穀粒精，就愛選穀種，會捋禾串先同較靚个擇起來。","example":""},{"word":"礱穀（挨礱）","pinyin":"lungˇ gugˋ (aiˊ lungˇ)","def":"舊時碾米的一個過程，將稻穀放入礱中磨去穀殼。","example":""},{"word":"末賺","pinyin":"mad con","def":"賺得少、利潤薄。 例如：賣這東西實在末賺，毋當換頭路。","example":""},{"word":"買賣算分，相請無論","pinyin":"maiˊ mai son funˊ，xiongˊ qiangˋ moˇ lun","def":"彼此交易，價格計論清楚，但請客時就不必太計較。前後兩句在口語中可單獨使用。","example":""},{"word":"貌事","pinyin":"mau se","def":"視其外貌而估計其工作量或物之價值，事先約定酬勞或代價者；喻只管工作從速做完，不管工作品質者。 例如：佢專門貌事做，這擺係同人割禾，加減有賺兜仔工錢。 例如：期末報告天光日盡尾一日，佢赴時赴刻愛寫畀好，就像貌事樣仔。","example":""},{"word":"謀頭路","pinyin":"meuˇ teuˇ lu","def":"謀職、籌劃事業。","example":""},{"word":"汨做事","pinyin":"mi zo se","def":"一味工作，另例如「汨賺錢」即一味賺錢之意。 例如：阿欽叔一生人逐日淨汨做事，到今四十零歲還無婆無卵。","example":""},{"word":"微利","pinyin":"miˇ li","def":"形容利潤極低。 例如：這批貨多係多，毋過當微利，賺毋成錢。","example":""},{"word":"無出益","pinyin":"moˇ cudˋ idˋ","def":"無利可圖。 例如：像恁仔做到無日無夜又無出益个頭路，莫做較贏。","example":""},{"word":"無賒無欠","pinyin":"moˇ caˊ moˇ kiam","def":"不賒不欠。 例如：無賒無欠毋成店，賒賒欠欠店毋成。（諺） 例如：這下便利商店買賣無賒無欠，愛付現金。","example":""},{"word":"拈禾串","pinyin":"ngiamˊ voˇ con","def":"撿拾割稻後遺落之稻穗。 例如：割禾該下，會有細人仔跈在割禾機背後拈禾串，愛拿轉去餵雞鴨。","example":""},{"word":"牛軛","pinyin":"ngiuˇ agˋ","def":"掛在牛脖子上的弓形物，便於駕御牛隻工作。","example":""},{"word":"外水","pinyin":"ngoi suiˋ","def":"外快，本業以外的金錢收入。 例如：阿姆日時頭上班，暗晡頭又接手工頭路屋下做，外水賺不少。","example":""},{"word":"冇數","pinyin":"pang sii","def":"呆帳。","example":""},{"word":"標頭","pinyin":"peuˊ teuˇ","def":"指商標或商品的指示、說明。 例如：該罐豆油盎仔貼有標頭，看就知哪家做个。","example":""},{"word":"便宜貴賤","pinyin":"pienˇ ngiˇ gui qien","def":"無論價格高低。 例如：這弓蕉伸著兩箱仔定定，便宜貴賤做下賣賣忒去換現錢較贏。","example":""},{"word":"便宜煎煎仔【便宜鮮鮮】","pinyin":"pienˇ ngiˇ jienˊ jienˊ eˋ【pienˇ ngiˇ xienˊ xienˊ】","def":"形容很便宜。 例如：這餅仔便宜煎煎仔，毋係麼个高級个等路啦！","example":""},{"word":"便宜過狗屎","pinyin":"pienˇ ngiˇ go gieuˋ siiˋ","def":"比狗屎還便宜，表不值錢。 例如：麼个東西就共樣，新出就貴蔘蔘仔，等到大出就便宜過狗屎。","example":""},{"word":"掣市","pinyin":"cadˋ sii","def":"銷路好。","example":""},{"word":"錢水","pinyin":"qienˇ suiˋ","def":"錢，指錢銀。 例如：同厥錢水斷忒去，看佢仰仔作怪。","example":""},{"word":"錢水生","pin   // 優先讀取瀏覽器紀錄，若無則採用內建的預設詞庫
  let vocabDatabase = JSON.parse(localStorage.getItem("hakka_vocab_db")) || defaultVocabDatabase;
  let currentLevel = "基礎級";
  let currentIndex = 0;
  let isFlipped = false;

  window.onload = function() {
    const savedLevel = localStorage.getItem("hakka_level");
    const savedTheme = localStorage.getItem("hakka_theme");

    if (savedLevel && vocabDatabase[savedLevel]) {
      currentLevel = savedLevel;
    }
    if (savedTheme) {
      changeTheme(savedTheme);
      document.getElementById("themeSelect").value = savedTheme;
    } else {
      changeTheme("吊菜色");
    }

    updateLevelTabs();
    initDailyCard();
    updateVocabCountInfo();
  };

  function setLevel(level) {
    currentLevel = level;
    localStorage.setItem("hakka_level", level);
    updateLevelTabs();
    const list = vocabDatabase[currentLevel] || [];
    currentIndex = list.length > 0 ? Math.floor(Math.random() * list.length) : 0;
    resetCardFlip();
    renderCard();
  }

  function updateLevelTabs() {
    const btns = document.querySelectorAll(".level-btn");
    btns.forEach(btn => {
      if (btn.innerText === currentLevel) {
        btn.classList.add("active");
      } else {
        btn.classList.remove("active");
      }
    });
  }

  function changeTheme(themeName) {
    document.documentElement.setAttribute("data-theme", themeName);
    localStorage.setItem("hakka_theme", themeName);
  }

  function initDailyCard() {
    const list = vocabDatabase[currentLevel] || [];
    if (list.length === 0) return;
    currentIndex = Math.floor(Math.random() * list.length);
    renderCard();
  }

  function renderCard() {
    const list = vocabDatabase[currentLevel] || [];
    if (list.length === 0) {
      document.getElementById("frontWord").innerText = "無資料";
      document.getElementById("frontPinyin").innerText = "";
      document.getElementById("backWord").innerText = "無資料";
      document.getElementById("backPinyin").innerText = "";
      document.getElementById("backDef").innerText = "該分級目前尚無詞彙，請至後臺新增。";
      document.getElementById("backExample").innerText = "";
      document.getElementById("cardCounter").innerText = `第 0 / 0 筆`;
      return;
    }

    if (currentIndex >= list.length) currentIndex = 0;
    const item = list[currentIndex];
    document.getElementById("frontWord").innerText = item.word;
    document.getElementById("frontPinyin").innerText = item.pinyin;
    document.getElementById("backWord").innerText = item.word;
    document.getElementById("backPinyin").innerText = item.pinyin;
    document.getElementById("backDef").innerText = item.def;
    document.getElementById("backExample").innerText = item.example ? "例：" + item.example : "";
    document.getElementById("cardCounter").innerText = `[${currentLevel}] 第 ${currentIndex + 1} / ${list.length} 筆`;
  }

  function flipCard() {
    const card = document.getElementById("card");
    isFlipped = !isFlipped;
    if (isFlipped) {
      card.classList.add("flipped");
    } else {
      card.classList.remove("flipped");
    }
  }

  function resetCardFlip() {
    const card = document.getElementById("card");
    isFlipped = false;
    card.classList.remove("flipped");
  }

  function nextCard(event) {
    event.stopPropagation();
    const list = vocabDatabase[currentLevel] || [];
    if (list.length === 0) return;
    currentIndex = (currentIndex + 1) % list.length;
    resetCardFlip();
    setTimeout(renderCard, 150);
  }

  function prevCard(event) {
    event.stopPropagation();
    const list = vocabDatabase[currentLevel] || [];
    if (list.length === 0) return;
    currentIndex = (currentIndex - 1 + list.length) % list.length;
    resetCardFlip();
    setTimeout(renderCard, 150);
  }

  function openAdminModal() {
    document.getElementById("adminModal").classList.add("active");
    updateVocabCountInfo();
  }

  function closeAdminModal() {
    document.getElementById("adminModal").classList.remove("active");
    renderCard();
  }

  function updateVocabCountInfo() {
    let total = 0;
    let details = [];
    for (let lvl in vocabDatabase) {
      let count = vocabDatabase[lvl].length;
      total += count;
      details.push(`${lvl}: ${count}筆`);
    }
    document.getElementById("vocabCountInfo").innerText = `總計 ${total} 筆詞彙 (${details.join(' | ')})`;
  }

  function addNewVocab() {
    const level = document.getElementById("addLevel").value;
    const word = document.getElementById("addWord").value.trim();
    const pinyin = document.getElementById("addPinyin").value.trim();
    const def = document.getElementById("addDef").value.trim();
    const example = document.getElementById("addExample").value.trim();

    if (!word || !def) {
      alert("請至少填寫「客語詞彙」與「華語釋義」！");
      return;
    }

    if (!vocabDatabase[level]) {
      vocabDatabase[level] = [];
    }

    vocabDatabase[level].push({ word, pinyin, def, example });
    localStorage.setItem("hakka_vocab_db", JSON.stringify(vocabDatabase));

    document.getElementById("addWord").value = "";
    document.getElementById("addPinyin").value = "";
    document.getElementById("addDef").value = "";
    document.getElementById("addExample").value = "";

    alert("成功新增詞彙！");
    updateVocabCountInfo();
  }

  function importCSV() {
    const fileInput = document.getElementById("csvFileInput");
    if (fileInput.files.length === 0) {
      alert("請先選擇一個 CSV 檔案！");
      return;
    }

    const file = fileInput.files[0];
    const reader = new FileReader();
    reader.onload = function(e) {
      const text = e.target.result;
      const lines = text.split("\n");
      let count = 0;

      for (let i = 1; i < lines.length; i++) {
        let line = lines[i].trim();
        if (!line) continue;
        
        let parts = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
        if (parts.length >= 4) {
          let level = parts[0].replace(/"/g, "").trim();
          let word = parts[1].replace(/"/g, "").trim();
          let pinyin = parts[2].replace(/"/g, "").trim();
          let def = parts[3].replace(/"/g, "").trim();
          let example = parts[4] ? parts[4].replace(/"/g, "").trim() : "";

          if (level && word && vocabDatabase[level]) {
            vocabDatabase[level].push({ word, pinyin, def, example });
            count++;
          }
        }
      }

      localStorage.setItem("hakka_vocab_db", JSON.stringify(vocabDatabase));
      alert(`成功批次匯入 ${count} 筆詞彙！`);
      updateVocabCountInfo();
    };
    reader.readAsText(file, "UTF-8");
  }

  function exportData() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(vocabDatabase, null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", "hakka_vocab_backup.json");
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
  }

  function resetDefaultData() {
    if (confirm("確定要重設回預設詞庫嗎？您自行新增的詞彙將會被清空。")) {
      vocabDatabase = JSON.parse(JSON.stringify(defaultVocabDatabase));
      localStorage.setItem("hakka_vocab_db", JSON.stringify(vocabDatabase));
      updateVocabCountInfo();
      alert("已重設為預設詞庫！");
    }
  }
</script>
</body>
</html>
