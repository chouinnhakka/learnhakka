nyin":"iˋ moˊ eˋ","def":"毛毛雨。 例如：雨毛仔越來越粗，頭那毛就涿到（涿啊）溼溼（溚溼）。","example":""},{"word":"隕石","pinyin":"iunˋ sag","def":"隕石。 例如：隕石係對外太空跌落地球个固體碎片，罕得看得著。","example":""},{"word":"箭日","pinyin":"jien ngidˋ","def":"形容陽光直射的樣子。 例如：窗門（窗仔）下恁箭日，莫在該片坐。","example":""},{"word":"崁下","pinyin":"kam haˊ","def":"崖下。 例如：去蹶山（跋山）若無（係無）細義跌落崁下就死無命吔哪！","example":""},{"word":"交風","pinyin":"kauˊ fungˊ","def":"被風吹到表皮乾枯。 例如：若面交風交到（交啊）粗粗，愛搽兜仔面油，正毋會必哦。","example":""},{"word":"牽絲","pinyin":"kienˊ xiˊ【kianˊ xiˊ】","def":"蜘蛛結網；食物發霉，長出的絲狀物；食物拉長而見絲狀。 例如：粄仔挾起來係會牽絲，就係壞忒（壞核）吔。","example":""},{"word":"環保","pinyin":"kuanˇ/fanˇ boˋ","def":"環保。 例如：為著環保，做毋得烏白燒垃圾。","example":""},{"word":"濫濫","pinyin":"lam lam","def":"泥巴稀爛的樣子。 例如：落過雨个泥路濫濫，當（蓋）毋好行。","example":""},{"word":"濫仔","pinyin":"lam eˋ","def":"爛泥地、沼澤。 例如：這坵田係濫仔，打田愛注意莫漯著。","example":""},{"word":"落雹","pinyin":"log pog","def":"下冰雹。 例如：天時恁好，好恬恬嗄落雹，感覺盡奇怪。","example":""},{"word":"窿（磅空）","pinyin":"lungˇ (bong kungˊ)","def":"隧道、洞穴。 例如：兩頭打窿愛對著來，無斯會打宕窿。","example":""},{"word":"木浪樹","pinyin":"mugˋ long su","def":"無患子樹。 例如：木浪樹个子做得拿來洗衫褲。","example":""},{"word":"泥漿","pinyin":"naiˇ jiongˊ","def":"泥漿。 例如：落雨過後去外背搞，輒輒會舞到（舞啊）一哪仔都係泥漿。","example":""},{"word":"濫膏糜【濫泥】","pinyin":"lam goˊ moiˇ【lam naiˇ】","def":"爛泥巴。 落雨天，滿哪仔係濫膏糜（濫泥），行路毋得。","example":""},{"word":"日頭雨（分龍水）","pinyin":"ngidˋ teuˇ iˋ (funˊ liungˇ suiˋ)","def":"太陽雨。 例如：落一陣日頭雨過後，天頂出天弓吔。","example":""},{"word":"日頭花（日頭絲）","pinyin":"ngidˋ teuˇ faˊ (ngidˋ teuˇ xiˊ)","def":"雲縫中灑下的陽光。 例如：趕這下還有日頭花，衫褲拿出去晒晒啊。","example":""},{"word":"屙忒【屙核】","pinyin":"oˊ tedˋ【oˊ hedˋ】","def":"崩坍，可用於高大物體；如山、牆、土堆等。 例如：這擺落大雨，吾田脣屙忒（屙核）一大角。","example":""},{"word":"肥泥","pinyin":"piˇ naiˇ","def":"肥沃的泥土。 例如：你這坵田都係肥泥，難怪收成會恁好！","example":""},{"word":"硼砂","pinyin":"pinˇ saˊ","def":"硼砂。 例如：食品係摻硼砂落去（入去）會變到（變啊）較（過）軟虯好食，毋過對身體毋好。","example":""},{"word":"青天白日","pinyin":"qiangˊ tienˊ pag ngidˋ","def":"大白天。 例如：青天白日你還在該睡目，毋使做事抑毋係？","example":""},{"word":"賤","pinyin":"qien","def":"植物不挑剔環境，生長快速，或指地位低下。 例如：蝦公夾當（蓋）賤，毋使幾久就生到（生啊）一哪仔就係。","example":""},{"word":"石卵仔","pinyin":"sag lonˋ eˇ【sag lonˋ eˋ (sag nonˋ eˋ)】","def":"鵝卵石。 例如：舖（打）紅毛泥地愛先用石卵仔打底。","example":""},{"word":"石炭","pinyin":"sag tan","def":"煤炭。 例如：有兜火力發電係燒石炭个，故所會造成空氣污染。","example":""},{"word":"山坳","pinyin":"sanˊ auˊ","def":"山腰低窪之地。 例如：佢个柑仔園在頭前个山坳該搭仔（該跡仔）。","example":""},{"word":"山花水【白鶴水】","pinyin":"sanˊ faˊ suiˋ【pag hog suiˋ】","def":"下雨時山上流下的水。 例如：山崠拚大雨過後，山花水（白鶴水）就變到（變啊）又大又汶。","example":""},{"word":"山窩","pinyin":"sanˊ voˊ","def":"山之凹處。 例如：佢在頭前該個山窩起一間別莊，𫣆兜（𠊎等）來去同佢拜訪。","example":""},{"word":"生蟲仔","pinyin":"sangˊ cungˇ eˋ","def":"物體因腐敗而長出蟲子，亦可說「發蟲仔」。 例如：這包地圾愛遽遽（共快）拿去擲（丟），係無驚怕會生蟲仔。","example":""},{"word":"生菇","pinyin":"sangˊ guˊ","def":"物品因潮溼發霉。 例如：包仔萋萋毋食，放到生菇，實在還打爽（浪核）。","example":""},{"word":"塞弄弄仔","pinyin":"sedˋ nung nung eˋ【sedˋ nung nung eˊ】","def":"形容草木叢生，無法行走的樣子。 例如：山路無人行，兩下半就塞弄弄仔。","example":""},{"word":"上埔","pinyin":"song puˊ","def":"上面那塊旱地。 例如：上埔較（過）燥種番豆，下埔較（過）濕種番薯。","example":""},{"word":"上崎","pinyin":"songˊ gia","def":"上坡；反義詞「下崎」即下坡。 例如：㧡重擔上崎正知腳力个功夫。","example":""},{"word":"水沖（水寨）","pinyin":"suiˋ cungˇ (suiˋ zai)","def":"瀑布。 例如：落大雨个時節，對屋簷流下來个水大到親像水沖。","example":""},{"word":"水窟","pinyin":"suiˋ fudˋ","def":"積水的窪地。 例如：這搭仔（這跡仔）地較（過）無平，見擺落雨就變大水窟，你愛細義毋好躪下去。","example":""},{"word":"炭礦","pinyin":"tan kongˋ","def":"煤礦。 例如：頭擺厥爸同人打炭礦。","example":""},{"word":"天河（河溪）","pinyin":"tienˊ hoˇ (hoˇ haiˊ)","def":"銀河。 例如：暗晡頭在較（過）無光害个所在，有時節看得著天河。","example":""},{"word":"天旱","pinyin":"tienˊ honˊ","def":"乾旱。 例如：雨落忒多做大水，無半息雨做天旱，實在異（盡）難耐。","example":""},{"word":"天昏地暗","pinyin":"tienˊ funˊ ti am","def":"天色昏暗無光。 例如：會落西北雨進前，成時會玄玄風（𢫦𢫦風）變到（變啊）天昏地暗。","example":""},{"word":"天狗食日","pinyin":"tienˊ gieuˋ siid ngidˋ","def":"日蝕。月蝕即為「天狗食月」。 例如：這擺五月堵好堵著天狗食日，歸家人做得共下來欣賞。","example":""},{"word":"斷烏","pinyin":"tonˊ vuˊ","def":"天色完全暗黑。 例如：阿山哥實在還煞猛，做到斷烏還吂（毋曾）轉夜。","example":""},{"word":"橫龍（橫崗、橫龍崗）","pinyin":"vangˇ liungˇ (vangˇ gongˊ、vangˇ liungˇ gongˊ)","def":"橫向的山脈。 例如：有兜人擇屋場當（盡）講究，愛尋青龍片、白虎片還過橫龍，定著愛仰般（仰仔）又仰般（仰仔）。","example":""},{"word":"窩壢","pinyin":"voˊ lagˋ","def":"低窪、兩山之間的山凹。 例如：土石流同該隻窩壢个田歸下都揞忒（揞核），現下無法度耕作哩（吔）！","example":""},{"word":"汶水","pinyin":"vunˇ suiˋ","def":"混濁的水。 例如：大雨正過，河壩都係汶水。","example":""},{"word":"遮蔭","pinyin":"zaˊ imˊ","def":"遮住太陽光，有陰涼處可以乘涼。 例如：豬大把門風；樹大好遮蔭。（諺）","example":""},{"word":"走山","pinyin":"zeuˋ sanˊ","def":"走山、地層滑動。 例如：這站仔緊落大雨，造成盡多山仔走山，盡危險。","example":""},{"word":"轉寒","pinyin":"zonˋ honˇ","def":"天氣變冷。 例如：轉寒哩（吔）！加領裌仔，無，寒著（凍著）斯無結無煞。","example":""},{"word":"接口","pinyin":"jiabˋ heuˋ","def":"接縫、接合處。 例如：高速公路逐（每一）段都有接口。 例如：該領衫个接口暴線縫。","example":""},{"word":"大水樵","pinyin":"tai suiˋ ceuˇ","def":"漂流木。 例如：吂有（還無）瓦斯該下，大水一過就愛去拈大水樵來燒。","example":""},{"word":"山壢","pinyin":"sanˊ lagˋ","def":"小而深的山谷。 例如：行山路愛較（過）細義兜仔（一息），若係跌落山壢肚該就壞哩喲！","example":""},{"word":"打狗就毋出門","pinyin":"daˋ gieuˋ qiu mˇ cudˋ munˇ【daˋ gieuˋ lu/luˊ mˇ cudˋ munˇ】","def":"天氣惡劣，即使棒打狗，狗兒也賴在家不逃出門外。 例如：打狗就毋出門个天時，你仰會弄等來？","example":""},{"word":"拗毋轉","pinyin":"auˋ mˇ zonˋ","def":"轉不過來。 例如：阿宗當（盡）慶（登真），一下講海陸，一下講四縣，係𠊎哦？斯拗毋轉哦！","example":""},{"word":"把扼","pinyin":"baˋ agˋ","def":"把握。 例如：這擺客語認證考試，佢盡有把扼會通過中高級。","example":""},{"word":"叭叭跌","pinyin":"bad bad diedˋ","def":"紛紛掉落，常用於固態物。 例如：一陣風吹來，油桐花就叭叭跌，當（蓋）像落雪。","example":""},{"word":"暴線縫","pinyin":"bau xien pung","def":"衣物的縫合部位裂開來。 例如：衫忒細領，分你弓到（弓啊）暴線縫。","example":""},{"word":"飆","pinyin":"beuˊ","def":"指植物快速長出、茁壯的狀態。 例如：這下係禾苗當（蓋）飆个時節。","example":""},{"word":"必縫","pinyin":"bidˋ pung","def":"裂開成狹長的隙縫。 例如：紅毛泥屋頂係有必縫，定著會漏水。","example":""},{"word":"必忒【必核】","pinyin":"bidˋ tedˋ【bidˋ hedˋ】","def":"裂開。 例如：鏡仔跌到（跌啊）地泥項，必忒（必核）吔。","example":""},{"word":"貶車","pinyin":"bienˋ caˊ","def":"翻車。 例如：佢車仔駛忒遽，轉彎該下嗄貶車，該哉人無仰仔。","example":""},{"word":"放冗","pinyin":"biong ngiung","def":"（褲頭、或標準）放鬆；班次減少。 例如：這擺標準放冗兜仔，毋好忒嚴條。 例如：下晝頭正做事个人較（過）少，車枋就放冗吔。","example":""},{"word":"沉落底","pinyin":"ciimˇ log daiˋ","def":"沉入水底。 例如：車仔沉落底，毋知有人在車肚無？","example":""},{"word":"沉落去","pinyin":"ciimˇ log hi","def":"沉下去。 例如：聽講該隻船仔堵著颱風沉落去，死盡多人哦。","example":""},{"word":"墜下來","pinyin":"cui haˊ loiˇ","def":"垂下來；拉彎下來。 例如：柑仔打當（蓋）結，歸葩仔墜下來。 例如：牛眼（牛眼仔）拗毋著，同樹椏仔（樹桍）墜下來較（過）好拗。","example":""},{"word":"打毋見忒【打毋見核】","pinyin":"daˋ mˇ gien tedˋ【daˋ mˇ gian hedˋ】","def":"弄丟了。 例如：錢打毋見忒（打毋見核），毋知尋得著無？","example":""},{"word":"打平放","pinyin":"daˋ piangˇ biong","def":"平放，亦可說「平平放、平平造」。 例如：衫褲愛打平放，正較（過）好摺。 例如：竹篙毋好打直凴壁放，打平放正毋會橫下來。","example":""},{"word":"溚溚跌","pinyin":"dab dab diedˋ","def":"一直掉下來（常用於液體）。如「口涎溚溚跌」。","example":""},{"word":"恬忒【恬核】","pinyin":"diamˊ tedˋ【diamˊ hedˋ】","def":"停了，也可指人停止呼吸。 例如：這老車仔，輒輒（不時）駛到半路就恬忒（恬核），異（盡）無結煞。","example":""},{"word":"倒貶","pinyin":"do bienˋ","def":"裡外倒反。 例如：仰仔著个衫？倒貶著哩（吔）。","example":""},{"word":"絞毋見","pinyin":"gau mˇ gien【gau mˇ gian】","def":"因混雜錯亂而丟失。 例如：鎖匙毋知放在哪，若係絞毋見就慘哩喲。","example":""},{"word":"弓大","pinyin":"giungˊ tai","def":"撐大。 例如：鞋若係忒緪，做得去鞋店弓大一息仔（一息）。","example":""},{"word":"膏著","pinyin":"goˇ doˋ","def":"沾染。 例如：衫褲分油漆膏著，怕洗毋淨哩（吔）。","example":""},{"word":"耗爽","pinyin":"hoˊ songˋ","def":"浪費。 例如：阿哥用水用電當（盡）耗爽，無保護地球，實在毋應該。","example":""},{"word":"勻開來","pinyin":"iunˇ koiˊ loiˇ","def":"均勻分開。 例如：蘿蔔絲愛勻開來晒，無斯晒毋會燥。","example":""},{"word":"湧起來","pinyin":"iungˋ hiˋ loiˇ","def":"湧起來。 例如：莫企恁脣，海水會湧起來。 例如：佢分人激著，火氣一下湧起來。","example":""},{"word":"溶忒【溶核】","pinyin":"iungˇ tedˋ【iungˇ hedˋ】","def":"溶化。 例如：鹽在水底溶忒（溶核）哩（吔）。","example":""},{"word":"較爭【過爭】","pinyin":"ka zangˊ【go zangˊ】","def":"有起色或進步。 例如：頭那痛，藥仔食落去（下去）睡一覺目，這下有較爭（過爭）吔。","example":""},{"word":"卡等","pinyin":"kaˇ denˋ","def":"卡著，被夾住或阻塞而不能活動。 例如：該臺車仔撞著大樹，司機卡等毋得出。 例如：洗面以前，頭那毛愛用毛落仔卡等。 例如：頭前出車禍，車仔全在路項卡等。","example":""},{"word":"卡著","pinyin":"kaˇ doˋ","def":"卡住、不自由，也指時間無法錯開。 例如：時間堵好卡著，阿爸無法度來學校開會。 例如：門毋知仰仔卡著，嗄打毋開來。","example":""},{"word":"確實","pinyin":"kogˋ siid","def":"的確、確實。 例如：俗話講「一樣米畜百樣人」，確實有影！","example":""},{"word":"漯落去【漯入去】","pinyin":"labˋ log hi【labˋ ngib hi】","def":"陷下去，套進去。 例如：田項泥濫濫，係漯落去（漯入去）無人拉（挷）起來就麻煩哩（吔）。","example":""},{"word":"漏淨淨","pinyin":"leu qiang qiang","def":"漏光光。 例如：這桶仔爛恁大空，裡肚（裡背）个水漏淨淨。","example":""},{"word":"輪等來","pinyin":"linˇ denˋ loiˇ","def":"輪流來，照輪。 例如：阿爸這駁仔人較（過）毋好，𫣆（𠊎等）兄弟姊妹輪等來照顧。","example":""},{"word":"㪐忒【㪐核】","pinyin":"ludˋ tedˋ【lodˋ hedˋ】","def":"脫落。而「剝毋㪐」即指無法卸下。 例如：自行車鏈㪐忒（㪐核），無法度騎哩（吔）。","example":""},{"word":"歿忒【歿核】","pinyin":"mudˋ tedˋ【mudˋ hedˋ】","def":"腐爛掉。 例如：溼氣重，樹仔當（蓋）遽歿忒（歿核）。","example":""},{"word":"蝕忒【蝕核】","pinyin":"sad tedˋ【sad hedˋ】","def":"縮小，減損。 例如：菠麗菜（高麗菜）煮啊去就蝕忒（蝕核），伸無幾多。","example":""},{"word":"煞忒【煞核】","pinyin":"sod tedˋ【sod hedˋ】","def":"結束、消失。 例如：現代化過後，異（盡）多頭路都煞忒（煞核）吔。","example":""},{"word":"收尾","pinyin":"suˊ miˊ","def":"處理事情最後的部分。 例如：這件事情，係無人收尾就無結煞。","example":""},{"word":"收山","pinyin":"suˊ sanˊ","def":"結束、收場。 例如：佢早就收山無做吔，毋使過湊（邀）佢入股。","example":""},{"word":"水水","pinyin":"suiˋ suiˋ","def":"食物因水分太多呈現不乾爽的樣子。 例如：這水粄仔（碗仔粄）水水，毋好食。","example":""},{"word":"溜走","pinyin":"tiu zeuˋ/liu zeuˋ","def":"滑走。 例如：茶箍（番鹼）滑滑，當（蓋）會對手項溜走。","example":""},{"word":"換頭","pinyin":"von teuˇ","def":"換另外一端；換另外一棵。 例如：線穿毋會過，換頭試看啊。","example":""},{"word":"輾著","pinyin":"zan doˋ","def":"被輪子滾壓到。 例如：厥腳分車仔輾著，毋知會當（盡）嚴重無？","example":""},{"word":"轉色","pinyin":"zonˋ sedˋ","def":"物品顏色改變；因恐懼或憤怒而變臉色。 例如：這酒放二十零年，放到轉色吔。 例如：聽著這消息，厥面跈等（接等）就轉色吔。","example":""},{"word":"椊等（塞等）","pinyin":"zud denˋ (sedˋ denˋ)【(sedˋ nenˋ)】","def":"用塞子塞住。 例如：水龍頭壞忒（壞核），水洩到歸灶下，遽遽（共快）先拿隻椊仔（塞仔）椊等（塞等）佢。","example":""},{"word":"椊下去【翻下去】","pinyin":"zud haˊ hi【panˊ haˊ hi】","def":"墜落下去。 例如：隔壁阿伯食酒醉，騎車仔無注意椊下去（翻下去）圳溝肚（裡背），聽人講當（盡）嚴重。","example":""},{"word":"醃瓜仔","pinyin":"amˊ guaˊ eˋ","def":"越瓜，亦指以其醃製而成的醬瓜。 例如：食粥傍醃瓜仔，有特別个味緒。","example":""},{"word":"半肥腈","pinyin":"ban piˇ jiangˊ","def":"有瘦又有肥的肉。例「割一料半肥腈个豬肉」。","example":""},{"word":"腈豬肉","pinyin":"jiangˊ zuˊ ngiugˋ","def":"瘦豬肉。 例如：老弟毋敢食肥豬肉，淨擇腈豬肉來食。","example":""},{"word":"爌肉【封肉】","pinyin":"kong ngiugˋ【fungˊ ngiugˋ】","def":"紅燒肉。 例如：爌肉（封肉）炆較（過）酪兜仔（一息），老人家乜食得。","example":""},{"word":"膨蹄【豬跤】","pinyin":"pong taiˇ【zuˊ kaˇ】","def":"蹄膀，指豬腿上端的肉。 例如：筍乾膨蹄（豬跤）係當（盡）有名个客家菜。","example":""},{"word":"肥湯","pinyin":"piˇ tongˊ","def":"高湯，煮雞鴨或豬肉後的湯水，含油脂，美味可口。 例如：肥湯炆（燜）筍乾，抑係拿來煲湯，通體（總概）當（盡）好食。","example":""},{"word":"肉麩","pinyin":"ngiugˋ fuˊ","def":"肉鬆。 例如：外背賣个飯糰，大體就有包肉麩。","example":""},{"word":"肉氣","pinyin":"ngiugˋ hi","def":"肉類食物的總稱。 例如：肉氣一下食忒多，可能會胃腸消化毋好。","example":""},{"word":"片栗粉【太白粉】","pinyin":"pienˋ lid funˋ【tai pag funˋ】","def":"太白粉。 例如：片栗粉（太白粉）做毋得直接加燒水調勻，抑係放入煮熟个食物中，佢會隨時結成一矻一矻煮毋散。","example":""},{"word":"糯米氣","pinyin":"no miˋ hi","def":"糯米食品。 例如：糯米氣食多，盡毋消化。","example":""},{"word":"炒肉","pinyin":"cauˋ ngiugˋ","def":"客家小炒。 例如：炒肉緊炒緊香，係客家料理个美食。","example":""},{"word":"長年菜","pinyin":"congˇ ngienˇ coi【congˇ ngianˇ coi】","def":"長年菜。 例如：過年時節肉氣食忒多，老人家吩咐愛多食長年菜。","example":""},{"word":"桔醬","pinyin":"gidˋ jiong","def":"桔醬。 例如：金黃色个桔醬雖然酸澀，毋過同糖、鹽處理後，變成有名个美食。","example":""},{"word":"米篩目","pinyin":"miˋ qiˊ mugˋ","def":"米苔目，用粄脆加水調合成濃稠狀，然後用滿是孔目的篩板刷過，流入沸水中煮熟成形的條狀食品，亦可說「米篩粄」。 例如：割禾時節，主人會準備米篩目分工人食點心。","example":""},{"word":"米醬【豆醬】","pinyin":"miˋ jiong【teu jiong】","def":"味噌。 例如：米醬（豆醬）摎（同）海帶煮湯，盡好食。","example":""},{"word":"雞酒【麻油酒】","pinyin":"gieˊ jiuˋ【maˇ iuˇ jiuˋ】","def":"雞酒。 例如：婦人家做月愛食雞酒（麻油酒），因為做得較（過）遽恢復元氣。","example":""},{"word":"滷卵","pinyin":"lo lonˋ【luˊ lonˋ (luˊ nonˋ)】","def":"將熟蛋加入滷汁用文火慢燉而成。 例如：滷卵毋單淨做得傍飯、傍麵，還做得做便當菜，實在盡好用。","example":""},{"word":"老米（舊米）","pinyin":"loˋ miˋ (kiu miˋ)","def":"舊米。 例如：老米比新米較（過）適合包粽仔，口感虯又好食。","example":""},{"word":"火油【番豆油】","pinyin":"foˋ iuˇ【fanˊ teu iuˇ】","def":"花生油。 例如：用火油（番豆油）炒菜，香又好食。","example":""},{"word":"魚生","pinyin":"ngˇ sangˊ","def":"生魚片。 例如：魚生定著愛經過低溫冷凍，抑係其他殺菌處理，正會較（過）安全。","example":""},{"word":"魚脯仔【細魚乾仔】","pinyin":"ngˇ puˋ eˇ【ngˇ puˋ eˋ】【se ngˇ gonˊ eˋ】","def":"小魚乾。 例如：豆豉、魚脯仔（細魚乾仔）𤐙到酥酥，當（蓋）扯飯。","example":""},{"word":"糖梨仔【梨仔糖】","pinyin":"tongˇ liˇ eˋ【liˇ eˋ tongˇ】","def":"沾過糖膏的山楂；糖葫蘆。 例如：做鬧熱个時節，戲棚脣會有人賣糖梨仔（梨仔糖）。","example":""},{"word":"齋菜","pinyin":"zaiˊ coi","def":"素菜，如麵筋、蔭瓜等。 例如：阿婆食早齋，逐（每）日朝晨愛煮齋菜。","example":""},{"word":"水粄仔【碗仔粄】","pinyin":"suiˋ banˋ eˇ【suiˋ banˋ eˋ】【vonˋ eˋ banˋ】","def":"碗粄，用碗裝米漿蒸成的米食糕點。 例如：水粄仔（碗仔粄）係早期農村平常生活中个點心，差毋多家家戶戶都會做。","example":""},{"word":"釅酒","pinyin":"ngiamˇ jiuˋ","def":"烈酒。 例如：食釅酒較（過）會醉，莫食有較（過）好。","example":""},{"word":"膨風茶","pinyin":"pong fungˊ caˇ","def":"膨風茶，又名東方美人茶。 例如：膨風茶又安到東方美人茶，係新竹北埔、峨眉个名產。","example":""},{"word":"釅茶","pinyin":"ngiamˇ caˇ","def":"濃茶。 例如：有人講，酒醉時節，啉釅茶做得解酒，敢有影？","example":""},{"word":"結𤊶","pinyin":"giedˋ ladˋ【giadˋ ladˋ】","def":"結鍋巴。 例如：煮飯該下，火忒猛（烈）會結𤊶。","example":""},{"word":"嘬水【唶水】","pinyin":"zod suiˋ【jiod suiˋ】","def":"吸水。 例如：用麥管慢慢仔嘬水（唶水）較（過）毋會哽著。","example":""},{"word":"賁肉","pinyin":"punˊ ngiugˋ","def":"肉層很厚，可用於水果、肉類等。 例如：該粒朳仔（拉朳仔）盡賁肉，朳仔（拉朳仔）仁當（盡）少。","example":""},{"word":"橄欖核【欖仔核】","pinyin":"gaˋ lamˋ fud【lamˋ eˋ fud (namˋ eˋ fud)】","def":"橄欖的果核。 例如：橄欖核（欖仔核）係中藥材，做得消腫止痛。","example":""},{"word":"刣豬皮","pinyin":"taiˋ zuˊ piˇ","def":"將刀以水平方向削去豬皮。 例如：看豬砧（豬肉擔）頭家刣豬皮个手路，就知佢賣豬肉既經（已經）多年哩（吔）。","example":""},{"word":"剁雞盤","pinyin":"dog gieˊ panˇ","def":"把白斬雞剁成小塊裝盤，以供食用。 例如：阿婆對剁雞盤當（蓋）有經驗，請人客時，兜出个雞肉盤正經當（蓋）好看。","example":""},{"word":"斷粢粑仔","pinyin":"donˋ qiˇ baˊ eˋ","def":"將餈粑分捏成小團，方便食用。 例如：佢斷粢粑仔斷到（斷啊）逐隻（每個）圓圓勻勻，看著加異（盡）好食。","example":""},{"word":"片豬肉","pinyin":"pienˋ zuˊ ngiugˋ","def":"切豬肉片。 例如：片豬肉定著愛用較（過）薄个刀仔來片，肉片正會薄。","example":""},{"word":"㓾雞捋鴨","pinyin":"ciiˇ gieˊ lod abˋ","def":"殺雞殺鴨。一般用於歡度年節的豐盛菜餚，又引申為招待客人的盛情。 例如：今晡日莊項做鬧熱，阿姆㓾雞捋鴨來款待人客。","example":""},{"word":"揤覆菜","pinyin":"jidˋ pugˋ coi","def":"擠裝福菜。 例如：這下五、六十歲以上个客家人，大體有揤覆菜个童年回憶。","example":""},{"word":"滷鹹菜","pinyin":"luˊ hamˇ coi","def":"醃漬鹹菜。 例如：滷鹹菜个時節用扁扁、平平、圓圓个石牯矺等正堵好。","example":""},{"word":"捻菜包","pinyin":"ngiabˋ coi bauˊ","def":"用手指捏菜包、包菜包。 例如：係教學生仔捻菜包來解說客家文化，效果盡好哦。","example":""},{"word":"𤐙","pinyin":"biag","def":"乾煎。如「𤐙香料、𤐙香」。","example":""},{"word":"餞糖","pinyin":"jien tongˇ","def":"食物加糖處理的一種方法，如蜜餞。 例如：鹹酸甜係梅仔、李仔、桃仔這兜餞糖做出來个。","example":""},{"word":"浸酒","pinyin":"jim jiuˋ","def":"把物品置至酒中浸泡，多為藥用。 例如：有兜藥草晒燥，做得浸酒。","example":""},{"word":"攞味","pinyin":"loˊ mi","def":"加入湯汁。 例如：這爌肉（封肉）當（蓋）香，淨飯攞味食，盡扯飯。","example":""},{"word":"帶飯【帶飯包】","pinyin":"dai fan【dai fan bauˊ】","def":"帶飯包、帶便當。 例如：𠊎今晡日懶尸帶飯（帶飯包），當晝去外背食大麵就好。","example":""},{"word":"打淨食","pinyin":"daˋ qiang siid","def":"只吃一種食物，不配其他食物或佐料的吃法。 例如：檸檬當（蓋）酸，無法度打淨食。","example":""},{"word":"嗒看啊","pinyin":"dab kon aˋ","def":"嚐嚐看，用舌頭感受。 例如：這係今年挷个新番豆，正炒啊著，你先嗒看啊！","example":""},{"word":"正餐","pinyin":"ziin conˊ","def":"指一天內的早、中、晚三餐，不包含點心。 例如：正餐毋食，淨食點心，仰做得？","example":""},{"word":"準飯食","pinyin":"zunˋ fan siid","def":"當作飯吃。相關句式如「準凳仔坐」、「準錢使」。 例如：當在減肥期間个人，毋敢食米飯，就摎（同）包粟、綠豆準飯食。","example":""},{"word":"耐食","pinyin":"nai siid","def":"指吃的時間很長；也指一種食物可以吃很久。 例如：仰恁耐食？一碗飯食吔兩點鐘還在該食。","example":""},{"word":"菜頭菜腳（菜腳仔）【菜尾】","pinyin":"coi teuˇ coi giogˋ (coi giogˋ eˇ)【coi miˊ】","def":"剩菜。 例如：阿財哥！暗晡夜來吾（𠊎）屋下食夜，當晝還伸當（蓋）多菜頭菜腳（菜尾）。","example":""},{"word":"菜頭菜尾","pinyin":"coi teuˇ coi miˊ","def":"剩菜。 例如：好事做煞个時節，同全部个菜頭菜尾落落歸大鑊煮過來食，有特別个味緒哦。","example":""},{"word":"冷飯","pinyin":"langˊ fan","def":"冷飯、剩飯。 例如：用冷飯來炒卵，當（蓋）好食。","example":""},{"word":"撩菜","pinyin":"liauˊ coi","def":"菜炒好用鍋鏟把菜盛起的動作。 例如：聽著撩菜聲，就知食夜个時間會到哩。","example":""},{"word":"炆【燜】","pinyin":"vunˇ【munˊ】","def":"以小火長時間燜煮。 例如：炆（燜）爌肉（封肉）放蒜仔，傍飯盡好食。","example":""},{"word":"汁","pinyin":"ziibˋ","def":"餿水；水分、液體。 例如：農家人畜豬仔食汁。 例如：做得同朳仔、蘋果打變汁來食。","example":""},{"word":"泌菜味","pinyin":"bi coi mi","def":"把菜餚中的湯濾出來。 例如：食伸个菜先泌菜味，正倒入汁桶裡肚。","example":""},{"word":"變食","pinyin":"bien siid","def":"弄吃的。 例如：恁大人吔，肚飢就自家去灶下變食。","example":""},{"word":"知食","pinyin":"diˊ siid","def":"懂得什麼好吃。 例如：阿明哥當（蓋）知食，愛去哪位（哪仔）聚餐，問佢就知啦！","example":""},{"word":"落鑊","pinyin":"log vog","def":"下鍋。 例如：鑊頭烈，魚仔正好落鑊。","example":""},{"word":"搣食个","pinyin":"medˋ siid ge【miedˋ siid ge】","def":"弄吃的；廚師。 例如：肚飢哩（吔），來去灶下搣食个。 例如：愛有手路菜，正好去做搣食个。","example":""},{"word":"出火煙","pinyin":"cudˋ foˋ ienˊ【cudˋ foˋ ianˊ】","def":"煙囪冒出炊煙，表示有烹飪。 例如：佢屋下有大鑊，毋過罕得出火煙，還打爽（浪核）。","example":""},{"word":"手路","pinyin":"suˋ lu","def":"本事、手藝。 例如：這個廚師有二十年个經驗，手路當（蓋）好。","example":""},{"word":"出味","pinyin":"cudˋ mi","def":"透出食物的原味。 例如：熻菜愛加一滴仔油，較（過）出味。","example":""},{"word":"減飯","pinyin":"gamˋ fan","def":"把飯自容器中撥至其他容器。 例如：爺哀个愛心，總係減飯分子女，驚佢兜（佢等）無食飽。","example":""},{"word":"撿碗筷","pinyin":"giamˋ vonˋ kuai","def":"擺出碗筷，準備吃飯的動作。 例如：厥屋下大人煮飯，細人仔撿碗筷，當（蓋）和樂。","example":""},{"word":"飯盆頭","pinyin":"fan punˇ teuˇ","def":"裝飯的寬口容器。 例如：頭擺做苦力个人，當（蓋）會食，見擺食飯食到飯盆頭強強會貶轉來。","example":""},{"word":"落碗公","pinyin":"labˋ vonˋ gungˊ","def":"疊大碗。 例如：你負責洗碗，阿明落碗公，一儕（個人）一項盡公平。","example":""},{"word":"撈仔","pinyin":"leuˇ eˋ","def":"有孔洞的漏勺。 例如：經過三到（擺）水滾過，水餃浮起來，就做得用撈仔撈起來食哩（吔）。","example":""},{"word":"缶仔","pinyin":"fiˇ eˋ","def":"陶瓷。 例如：用缶仔做个米缸裝米，較（過）毋會轉潤。","example":""},{"word":"缽仔（缽頭）","pinyin":"badˋ eˇ (badˋ teuˇ)【badˋ eˋ】","def":"泛稱可用來盛湯、裝食物的圓形金屬或陶瓷用具。 例如：一般人用缽仔裝湯、裝菜，當（蓋）好用。","example":""},{"word":"擂缽","pinyin":"luiˇ badˋ","def":"研碎物品的缽。 例如：用缶仔做个擂缽拿來研粉盡好用。","example":""},{"word":"泥缽仔","pinyin":"naiˇ badˋ eˇ【naiˇ badˋ eˋ】","def":"陶缽。 例如：到寒天，阿姆就會用泥缽仔燉雞仔分𠊎兜（𠊎等）食。","example":""},{"word":"醃缸","pinyin":"amˊ gongˊ","def":"以陶土燒成的容器。 例如：阿婆用醃缸滷个鹹菜，食起來甘甘，當（蓋）好食。","example":""},{"word":"鑊頭","pinyin":"vog teuˇ","def":"鍋子。 例如：煎豆腐个時節，鑊頭若係忒烈，就會煎到臭火𤊶。","example":""},{"word":"酒娘","pinyin":"jiuˋ ngiongˇ","def":"釀酒用的酵母。 例如：這一駁仔，酒娘當（蓋）便宜，米酒頭乜落價吔。","example":""},{"word":"發酵","pinyin":"fadˋ gau","def":"酵母。 例如：打發粄該下，放兜發酵正會發。","example":""},{"word":"阿不倒","pinyin":"aˊ bud do","def":"不倒翁。 例如：阿公䟓䟓去買一隻阿不倒分孫仔搞。","example":""},{"word":"擺靚","pinyin":"baiˋ jiangˊ","def":"只擺著好看，無實質意義；裝飾。 例如：這花係假个啦！淨擺靚定定。","example":""},{"word":"排桌","pinyin":"baiˇ zogˋ","def":"排餐桌、餐具準備開飯。另言「排桌凳」意即排桌椅。 例如：大家𢯭手排桌，準備食飯哩（吔）。","example":""},{"word":"包食包著","pinyin":"bauˊ siid bauˊ zogˋ","def":"管吃管穿，負責衣食兩方面的開銷。 例如：這擺貌頭請工有包食包著，故所盡多人肯做。","example":""},{"word":"伙頭","pinyin":"foˋ teuˇ","def":"掌炊事的工作。「輪伙頭」即表示輪流掌炊事的工作。 例如：天正甫甫仔光，輪著伙頭个人就愛準備歸屋下人食朝个東西。","example":""},{"word":"硬飯牯（硬飯頭）【燥飯】","pinyin":"ngang fan guˋ (ngang fan teuˇ)【zauˊ fan】","def":"乾飯。 例如：頭擺个客人年初一好食硬飯牯（燥飯），做毋得食粥。","example":""},{"word":"扚西瓜","pinyin":"diag xiˊ guaˊ","def":"用手指彈西瓜，試其成熟度。 例如：種西瓜个人毋使扚西瓜，就知西瓜熟吔吂（吔無）。","example":""},{"word":"雞啄米","pinyin":"gieˊ dugˋ miˋ","def":"雞啄米。 例如：老弟食飯个樣相，就像雞啄米，當（蓋）生趣。","example":""},{"word":"籠床","pinyin":"lungˇ congˇ","def":"蒸籠。 例如：佢按算蒸一籠床个蘿蔔粄去市場賣。","example":""},{"word":"箅仔","pinyin":"bi eˋ","def":"濾網或濾器。 例如：用箅仔濾水盡好勢。","example":""},{"word":"圍身裙","pinyin":"viˇ siinˊ kiunˇ","def":"圍裙。 例如：厥个圍身裙久無洗吔，看起來當（蓋）屙糟。","example":""},{"word":"水确仔【水勺仔】","pinyin":"suiˋ gog eˋ【suiˋ sog eˋ】","def":"舀水的勺子。 例如：恁大缸水用水确仔（水勺仔）舀，愛舀到幾時？","example":""},{"word":"水龍頭","pinyin":"suiˋ liungˇ teuˇ","def":"水龍頭。 例如：你愛記得同水龍頭撙緪來，正毋會緊漏水。","example":""},{"word":"石碫仔","pinyin":"sag don eˋ","def":"石階。 例如：佢去蹶山（跋山）該下，行到（行啊）當悿（蓋𤸁），就坐在石碫仔項休息。","example":""},{"word":"石舂臼【石米臼】","pinyin":"sag zungˊ kiuˊ【sag miˋ kiuˊ】","def":"石臼。 例如：頭擺阿公還在个時節，輒常用石舂臼（石米臼）舂粢粑仔食。","example":""},{"word":"鐵釘仔","pinyin":"tiedˋ dangˊ eˋ","def":"鐵釘。 例如：這個木匠用鑿空鬥榫个方式做家具，全毋使用著鐵釘仔。","example":""},{"word":"電球仔【鴨胲仔】","pinyin":"tien kiuˇ eˋ【abˋ goiˊ eˋ】","def":"電燈泡。 例如：這隻電球仔（鴨胲仔）燒忒哩（燒核吔），你做得𢯭手換無？","example":""},{"word":"斧頭","pinyin":"buˋ teuˇ","def":"斧頭。 例如：自家个倈仔教毋會乖，就像斧頭削自家个柄毋著共樣。","example":""},{"word":"茶箍波【番鹼波】","pinyin":"caˇ guˊ poˊ【fanˊ gianˋ poˊ】","def":"肥皂泡沫。 例如：愛買茶箍波（番鹼波）較（過）少个茶箍（番鹼），正較（過）省水。","example":""},{"word":"茶米粕（茶葉粕）【茶心渣】","pinyin":"caˇ miˋ pogˋ (caˇ iab pogˋ)【caˇ ximˊ zaˊ】","def":"經過沖泡後的茶葉。 例如：茶米粕（茶心渣）晒燥，做得拿來做枕頭。","example":""},{"word":"茶壽","pinyin":"caˇ su","def":"茶壺的保溫器，多用稻稈製成。 例如：這個老伯姆當（蓋）有計，會用禾稈來做茶壽，連外國人都當（蓋）阿腦佢。","example":""},{"word":"茶炙仔","pinyin":"caˇ zagˋ eˇ【caˇ zagˋ eˋ】","def":"用來煮茶的茶壺。 例如：佢昨晡日去街項買轉來（歸來）一隻茶炙仔，準備拿來炙茶食。","example":""},{"word":"茶罐（茶罐仔）","pinyin":"caˇ gon (caˇ gon eˋ)","def":"茶壺。 例如：熱天个時節，渟一杯茶罐（茶罐仔）肚个涼茶來食，止渴又退火。","example":""},{"word":"渟茶","pinyin":"tinˇ caˇ","def":"斟茶、倒茶。 例如：這頭家當（蓋）會做生理，人客來買東西个時節，佢都會渟茶請人食。","example":""},{"word":"𥯥箕","pinyin":"cabˋ giˊ","def":"盛裝雜物的竹器，用細竹篾編，外形與畚箕相似，但沒有握把。 例如：收冬个時節，頭擺个耕種人會用𥯥箕來抔穀。","example":""},{"word":"壁角（壁壢角）","pinyin":"biagˋ gogˋ (biagˋ lagˋ gogˋ)","def":"牆角，角落。 例如：無用著个東西，記得愛摎（同）佢放在壁角，正毋會杈人。","example":""},{"word":"草蓆","pinyin":"coˋ qiag","def":"草蓆。 例如：這領草蓆愛賣幾多錢？","example":""},{"word":"擔竿","pinyin":"dam gonˊ","def":"扁擔。 例如：佢用一支擔竿㧡出一副身家。","example":""},{"word":"凳墊仔","pinyin":"den tiabˋ eˇ【den tiabˋ eˋ】","def":"椅墊。 例如：愛過年吔，阿爸摎（同）舊个凳墊仔換新个，看起來異（盡）靚。","example":""},{"word":"刀石【挼石】","pinyin":"doˊ sag【noˇ sag】","def":"磨刀石。 例如：逐（每）擺佢愛剁雞盤个時節，會先用刀石（挼石）挼菜刀。","example":""},{"word":"臭風","pinyin":"cu fungˊ","def":"腐臭味，包括動植物的腐臭味。 例如：鹹菜愛封好勢來，毋好分佢臭風忒去（核吔）。 例如：該甕鹹豬肉還臭風，敢食得？","example":""},{"word":"臭油垢","pinyin":"cu iuˇ gieuˋ","def":"油脂腐化的味道。 例如：這豬油放忒久，鼻起來當（蓋）臭油垢，怕係壞忒哩（壞核吔）。 例如：佢怕歸禮拜無洗頭那，頭那當（蓋）臭油垢。","example":""},{"word":"臭肨肨仔（臭肨肨）","pinyin":"cu pangˊ pangˊ eˋ (cu pangˊ pangˊ)【cu pangˊ pangˊ eˊ】","def":"形容臭氣沖天。 例如：這卵壞忒（壞核）吔，臭肨肨仔，㧒忒佢（擳核去）。","example":""},{"word":"打烏蠅【撆烏蠅】","pinyin":"daˋ vuˊ inˇ【bied vuˊ inˇ】","def":"（用蒼蠅拍）拍打蒼蠅。 例如：點心店生理當（蓋）冷淡，頭家坐在門口打烏蠅（撆烏蠅）。","example":""},{"word":"凳頭","pinyin":"den teuˇ","def":"矮而較穩重、無靠背的凳子。有「圓凳頭」、「四腳凳頭」。","example":""},{"word":"鉛線仔【鉛線】","pinyin":"ienˇ xien eˋ【ianˇ xien】","def":"鉛線、鐵絲。 例如：該支竹篙愛用鉛線仔（鉛線）纏緪來，正毋會分風吹橫忒（橫核）。","example":""},{"word":"油漆","pinyin":"iuˇ qidˋ","def":"油漆（一種塗料）。 例如：佢用水藍色个油漆漆壁過後，歸間屋看起來像係新个共樣。","example":""},{"word":"熨斗","pinyin":"iun deuˋ","def":"熨斗。 例如：用熨斗熨衫褲愛細義，毋好同衫褲熨爛空。","example":""},{"word":"鉗仔","pinyin":"kiamˇ eˋ","def":"鉗子。 例如：使鉗仔挷鐵釘仔較（過）方便，乜較（過）毋會著傷。","example":""},{"word":"尿裙仔（尿墊仔）【尿布仔（尿片）】","pinyin":"ngiau kiunˇ eˋ (ngiau tiabˋ eˇ)【ngiau bu eˋ (ngiau pienˋ)】","def":"尿布、尿片。 例如：細嬰兒仔哇哇滾，又毋想食乳，怕係尿裙仔（尿布仔）溼哩（吔）。","example":""},{"word":"乳珠仔（玻璃珠）","pinyin":"nen zuˊ eˋ (boˊ liˇ zuˊ)","def":"彈珠、玻璃珠。 例如：下課个時節，細人仔會湊（邀）伴來打乳珠仔。","example":""},{"word":"牙确仔","pinyin":"ngaˇ gog/kog eˋ","def":"刷牙漱口用的水杯。 例如：阿公同假牙放在牙确仔浸等，天光日正拿來用。","example":""},{"word":"撬仔","pinyin":"kieu eˋ","def":"撬起物之工具。 例如：去拿撬仔摎（同）這石牯（大石頭）撬開來。","example":""},{"word":"壞銅壞鐵","pinyin":"faiˋ tungˇ faiˋ tiedˋ","def":"破銅爛鐵。 例如：壞銅壞鐵愛先整理好勢，正好交分清潔隊資源回收。","example":""},{"word":"生鹵","pinyin":"sangˊ luˊ","def":"生鏽。 例如：鐵仔个東西，久吔就會生鹵。","example":""},{"word":"嗶嗶仔","pinyin":"biˇ bi eˋ【biˊ biˊ eˋ】","def":"哨子。 例如：一群人硠硠散，想集合無嗶嗶仔好歕，僅可（只好）用嘴咻。","example":""},{"word":"背帶","pinyin":"bi dai","def":"背小孩用的長布條。 例如：背帶毋單淨背細人仔，成時綑被骨乜會暫用著。","example":""},{"word":"火爐堆","pinyin":"foˋ luˇ doiˊ","def":"堆放垃圾並焚燒的地方。 例如：頭擺有兜學校自家設火爐堆，用來燒樹葉、垃圾。","example":""},{"word":"火炭","pinyin":"foˋ tan","def":"木炭。 例如：一般來講，風爐燒火炭，大灶就燒樵。","example":""},{"word":"桊針（桊針線）","pinyin":"kien ziimˊ (kien ziimˊ xien)【kian ziimˊ】【kian ziimˊ xien】","def":"穿針。 例如：佢桊針手緊顫，線桊毋得過。","example":""},{"word":"針線空","pinyin":"ziimˊ xien kungˊ【ziimˊ xien kangˊ】","def":"針的孔，用於穿線。 例如：過目關哩（吔），針線空就桊（串）毋過。","example":""},{"word":"褲襠底","pinyin":"fu nong/long daiˋ","def":"褲襠。 例如：派頭在人挶，有人著長褲，褲襠底淺到（淺啊）屎胐斗看現現。","example":""},{"word":"褲帶仔","pinyin":"fu dai eˋ","def":"腰帶。 例如：屎當（蓋）出，褲帶仔打死結，解就毋得開，當（蓋）緊張。","example":""},{"word":"褲頭","pinyin":"fu teuˇ","def":"褲頭、褲腰。 例如：西裝褲愛合身，腰仔愛先量，看褲頭有幾闊。","example":""},{"word":"肚褡褲","pinyin":"duˋ dabˋ fu","def":"開襠褲。 例如：頭擺个細孲仔輒常著肚褡褲。","example":""},{"word":"拉鏈（夾股）","pinyin":"laiˊ lien (jiag guˋ)【la lien】","def":"拉鏈。 例如：百貨公司這下賣个衫褲，大體用拉鏈，安鈕仔（安扣仔）个少加多哩（吔）。","example":""},{"word":"嘴揞仔（封嘴仔）","pinyin":"zoi emˊ eˋ (fungˊ zoi eˋ)","def":"人類使用的口罩。 例如：你緊嗽，遽啊同嘴揞仔戴等好無？","example":""},{"word":"綢仔","pinyin":"cuˇ eˋ","def":"綢布。 例如：阿婆驚熱，好著綢仔做个衫褲。","example":""},{"word":"綢緞","pinyin":"cuˇ ton","def":"綢緞。 例如：你這領綢緞做个衫，料仔好又合身，怕無便宜嗬！","example":""},{"word":"底衫仔","pinyin":"daiˋ samˊ eˋ","def":"內衣；另「底褲仔」即內褲。 例如：老弟當（蓋）會出汗，常常搞到歸領底衫仔溼忒（溼核）。","example":""},{"word":"面衫","pinyin":"mien samˊ","def":"外衣。 例如：面衫愛著好來，人看起來正會有精神。","example":""},{"word":"衫腳","pinyin":"samˊ giogˋ","def":"衣服的下緣。褲子的下緣則為「褲腳」。 例如：若衫腳分麼个鉤著？爛到（爛啊）恁大空。","example":""},{"word":"勼水","pinyin":"giuˊ suiˋ","def":"縮水。 例如：這條褲个料仔仰恁差，洗無幾多擺就勼水哩（吔）！","example":""},{"word":"熨衫褲","pinyin":"iun samˊ fu","def":"熨衣服。 例如：阿哥做業務以後，為著愛分客戶好印象，輒輒會自家熨衫褲。","example":""},{"word":"勼帶仔【勼帶】","pinyin":"jiu dai eˋ【giuˊ dai】","def":"鬆緊帶。 例如：若（你个）褲仰落落，勼帶仔（勼帶）冗忒（鬆核）係無？","example":""},{"word":"金手鈪【金手環仔】","pinyin":"gimˊ suˋ agˋ【gimˊ suˋ kuanˇ eˋ】","def":"金鐲子。 例如：阿姊結婚个時節，阿舅䟓䟓打對金手鈪（金手環仔）分佢。","example":""},{"word":"胭脂","pinyin":"ienˊ ziiˊ【ianˊ ziiˊ】","def":"口紅，也泛指婦女化妝品。 例如：叔姆（姆姆）著等靚衫，又搽胭脂，聽講係愛去做便媒人。","example":""},{"word":"耳環","pinyin":"ngiˋ vanˇ【ngiˋ kuanˇ】","def":"耳環。 例如：這對耳環係用夾个，耳砣毋使桊空。","example":""},{"word":"䯋鍊","pinyin":"pad lien","def":"項鍊。 例如：姐婆（外阿婆）做八十一，阿爸打條䯋鍊送分佢。","example":""},{"word":"羅帕","pinyin":"loˇ pa","def":"面紗。例如「新娘𠖄羅帕」。","example":""},{"word":"簞笥","pinyin":"tan siiˋ【tangˋ siiˋ】","def":"衣櫥。 例如：阿姆个簞笥係請木匠做个，手工盡幼。","example":""},{"word":"屐仔","pinyin":"kiag eˋ","def":"木屐。 例如：有兜人去日本尞个時節，會著等屐仔去浸溫泉。","example":""},{"word":"印色","pinyin":"in sedˋ","def":"印泥。 例如：郵局有準備印色，分大家用來打印仔。","example":""},{"word":"腳跡","pinyin":"giogˋ jiagˋ","def":"腳印。 例如：恁大个腳跡，係麼个動物个呀？","example":""},{"word":"落忒【落核、溜核】","pinyin":"lau tedˋ【lau hedˋ、liu hedˋ】","def":"繫結鬆脫。例如「褲落忒（落核）」。","example":""},{"word":"落褲頭","pinyin":"lau fu teuˇ","def":"褲子快要掉下來的樣子。 例如：佢肚弛弛仔，透日著褲著到（著啊）落褲頭。","example":""},{"word":"安鈕仔【安扣仔】","pinyin":"onˊ neuˋ eˇ【onˊ kieu eˋ】","def":"縫鈕扣。 例如：阿姆在該安鈕仔（安扣仔），毋好去碰著佢！","example":""},{"word":"鍬布脣（車布脣）","pinyin":"qioˊ bu sunˇ (caˊ bu sunˇ)【qioˊ bu siinˇ】【caˊ bu siinˇ】","def":"縫布邊、釘布邊。 例如：衫愛做到耐著，定著愛先鍬布脣。","example":""},{"word":"打被骨","pinyin":"daˋ piˊ gudˋ","def":"製作被胎；購置被胎。 例如：上早，耕山園个人會種兜仔棉仔，拈棉花來打被骨。","example":""},{"word":"摺痕","pinyin":"zabˋ finˇ","def":"摺過的痕跡。 例如：該西裝褲恁多摺痕，遽啊拿熨斗來熨熨啊！","example":""},{"word":"整衫褲","pinyin":"zangˋ samˊ fu","def":"修改衣服。 例如：衫褲買忒大領，做得拿去分人整衫褲，著起來較（過）合身。","example":""},{"word":"針頭線尾","pinyin":"ziimˊ teuˇ xien miˊ","def":"指針黹之事。 例如：田頭水尾、灶頭鑊尾、針頭線尾，頭擺个客家婦人家麼个都愛做。","example":""},{"word":"漚箱角","pinyin":"eu xiongˊ gogˋ","def":"久置箱櫃裡。 例如：這兜衫褲從來毋識看你著，漚箱角定定。","example":""},{"word":"繳細人仔讀書","pinyin":"gieuˋ se nginˇ eˋ tug suˊ","def":"供給小孩子讀書。 例如：這條錢毋好拿去使，愛用來繳細人仔讀書。","example":""},{"word":"款包袱","pinyin":"kuanˋ bauˊ fug","def":"收拾整理行李。 例如：阿姊天光日愛去旅行，當在厥間房款包袱。","example":""},{"word":"槓仔","pinyin":"gong eˋ","def":"用竹竿或木條做成的挑貨或扛物的工具。 例如：頭擺㧡樵，愛用槓仔來㧡較（過）穩當。","example":""},{"word":"瓜刨仔","pinyin":"guaˊ pauˇ eˋ","def":"刨瓜果類的刨刀。 例如：煮蘿蔔仔愛先用瓜刨仔刨皮。","example":""},{"word":"怙杖仔（枴棍仔）【杖仔】","pinyin":"ku congˋ eˇ (guaiˋ gun eˋ)【congˋ eˋ】","def":"枴杖；拄著枴杖。 例如：佢腳踣著，愛擎怙杖仔（杖仔）正行得穩。","example":""},{"word":"膨鏡","pinyin":"pong giang","def":"放大鏡。 例如：在實驗室做實驗，愛用膨鏡正較（過）看得著較（過）微細个東西。","example":""},{"word":"笠嫲","pinyin":"libˋ maˇ","def":"斗笠。 例如：在恁熱个天時耕作，戴等笠嫲較（過）毋會分日頭炙壞。","example":""},{"word":"門閂仔","pinyin":"munˇ conˊ eˋ","def":"關門的橫木。 例如：睡目進前，愛同門閂仔閂好。","example":""},{"word":"閂門","pinyin":"conˊ munˇ","def":"把門閂上。 例如：愛睡吔！愛記得閂門哦！","example":""},{"word":"柵門","pinyin":"cag munˇ【cab munˇ】","def":"柵門。 例如：柵門愛關好，頭牲正毋會走落（走入）屋肚去。","example":""},{"word":"籬笆","pinyin":"liˇ baˊ","def":"籬笆。 例如：菜園个籬笆壞壞哩（吔）！愛煞煞仔整好來。","example":""},{"word":"絡索","pinyin":"log sogˋ","def":"套繩，其一頭有木鉤，可以纏套東西的繩子。 例如：老時人上山撿（拈）樵，用葛藤準絡索捆樵杈。","example":""},{"word":"籮仔","pinyin":"loˇ eˋ","def":"籮筐。 例如：叔公當（蓋）會用竹篾仔編籮仔。","example":""},{"word":"米籮","pinyin":"miˋ loˇ","def":"一種大型的方底圓口籮筐，用以挑運稻穀或稻米。 例如：𠊎同阿公𢯭手用米籮㧡穀轉（歸）屋。","example":""},{"word":"抔地圾","pinyin":"budˋ ti sebˋ【vudˋ ti sebˋ】","def":"裝垃圾。例如「用畚斗抔地圾」。","example":""},{"word":"撐堵仔","pinyin":"cang duˇ eˋ","def":"撐柱。 例如：阿爸用幾支撐堵仔同布篷撐等，兩下半就搭好一個簡單个寮仔哩（吔）。","example":""},{"word":"躁火","pinyin":"cau foˋ","def":"上火氣。 例如：烰个食品較（過）躁火，毋好食忒多。","example":""},{"word":"遰火燒","pinyin":"ce foˋ seuˊ","def":"引起火災。 例如：田肚（項）恁多燥禾稈，食菸愛細義，毋好遰火燒。","example":""},{"word":"坐涼","pinyin":"coˊ liongˇ","def":"坐下來乘涼。 例如：叔婆伯姆在伯公下坐涼打嘴鼓。","example":""},{"word":"翕等","pinyin":"him denˋ【hibˋ denˋ (hibˋ nenˋ)】","def":"悶著。 例如：炒蕹菜毋好翕等，變黃忒（黃核）就毋餳人哩（吔）。","example":""},{"word":"呵燒來","pinyin":"ho seuˊ loiˇ","def":"以熱氣加熱之。 例如：摎（同）豬油呵燒來攪飯，味緒當（蓋）好，做得連食三碗。","example":""},{"word":"熇燥（熇乾）","pinyin":"hogˋ zauˊ (hogˋ gonˊ)","def":"烤乾、烘乾。 例如：茶米（茶心）轉潤，愛熇燥來。","example":""},{"word":"焙火【炕火】","pinyin":"poi foˋ【hangˊ foˋ】","def":"在火上烘。 例如：這下有暖氣機，寒天毋使用火缽仔焙火（炕火）。","example":""},{"word":"焙衫褲【炕衫褲】","pinyin":"poi samˊ fu【hangˊ samˊ fu】","def":"烘乾衣服。 例如：灶頭背燒燒，堵好拿來焙衫褲（炕衫褲）。","example":""},{"word":"旱水","pinyin":"honˊ suiˋ","def":"將水放出。 例如：等一下愛洗車仔，你先去牽管仔，𠊎來旱水。","example":""},{"word":"看靚个","pinyin":"kon jiangˊ ge","def":"當裝飾或欣賞用的。 例如：這手鈪（手環仔）係當（蓋）有紀念性个，毋係戴來看靚个。","example":""},{"word":"麵線","pinyin":"mien xien","def":"麵線，引申為囉嗦。 例如：新官上任，開會場項，麵線溜毋會煞。","example":""},{"word":"眠一下","pinyin":"minˇ idˋ ha","def":"小睡片刻。 例如：當晝眠一下，下晝做事較（過）有精神。","example":""},{"word":"無在","pinyin":"moˇ coiˊ","def":"不在；去世、逝世。 例如：阿明去田項哩（吔），人無在。 例如：五年前，厥爺哀就無在哩（吔）！","example":""},{"word":"入門","pinyin":"ngib munˇ","def":"進入家門，亦可表示娶進家門。 例如：𠊎正入門就看著佢。 例如：厥倈仔交女朋友十過年，到今還吂（毋曾）討入門。","example":""},{"word":"入被","pinyin":"ngib piˊ","def":"將被胎塞入被單中。 例如：日時頭被骨拿去晒，睡目以前愛先入被。","example":""},{"word":"人客間","pinyin":"nginˇ hagˋ gienˊ【nginˇ hagˋ gianˊ】","def":"客房。 例如：吾（𠊎等）屋下个人客間閒閒，你來歇兩暗晡乜無問題。","example":""},{"word":"忍床","pinyin":"ngiun congˇ","def":"賴床。 例如：朝晨當（蓋）寒，一忍床嗄無赴著車枋哩（吔）。","example":""},{"word":"噩夜","pinyin":"ngog ia","def":"熬夜。 例如：𠊎昨暗晡噩夜吔，當晝定著愛眠一下正做得。","example":""},{"word":"弄孫仔","pinyin":"nung sunˊ eˋ","def":"逗弄孫子。 例如：佢舊年退休吔，這下在屋下弄孫仔。","example":""},{"word":"盤水","pinyin":"panˇ suiˋ","def":"打水、取水。指從一種容器舀水到另一種容器中的動作。 例如：你同阿公盤水，順續擐到浴堂項。","example":""},{"word":"瓠勺","pinyin":"puˇ sog","def":"瓠瓢，用老熟的瓠瓜對半剖開做成的勺子，可用來舀取水、酒等物。 例如：頭擺个人用瓠勺舀水，當（蓋）環保。","example":""},{"word":"縫仔【衖縫】","pinyin":"pung eˋ【lang pung】","def":"縫隙，指裂開或自然露出的狹長空隙。 例如：若窗仔無關密，該冷風對縫仔（衖縫）透入屋肚（屋仔裡背）。","example":""},{"word":"沙沙","pinyin":"saˊ saˊ","def":"有沙粒的感覺。 例如：這蜆仔敢有養過？仰食起來沙沙？","example":""},{"word":"三步門就毋出","pinyin":"samˊ pu munˇ qiu mˇ cudˋ【samˊ pu munˇ lu/luˊ mˇ cudˋ】","def":"足不出戶。 例如：三步門就毋出，外背有麼个事你乜毋知。","example":""},{"word":"食釣","pinyin":"siid diau","def":"魚兒上鉤。 例如：恁熱个天時，魚仔毋食釣。","example":""},{"word":"嗍水","pinyin":"sogˋ suiˋ","def":"吸水。 例如：這條布仔當（盡）嗍水，正放啊下就同歸桌仔个水嗍到燥燥。","example":""},{"word":"有講有笑【有講有㖸】","pinyin":"iuˊ gongˋ iuˊ seu【iuˊ gongˋ iuˊ nagˋ】","def":"有說有笑。 例如：年三十暗晡食團圓飯，大家有講有笑（有講有㖸）。","example":""},{"word":"熝湯粢","pinyin":"lug tongˊ qiˇ","def":"煮甜湯餈粑。 例如：熝湯粢係往擺（弄擺）蒔田時長間（不時）食个點心。","example":""},{"word":"睡毋落覺","pinyin":"soi mˇ log gau","def":"睡不著，相反詞「睡得落覺」即可以入睡。 例如：日時頭啉忒（啉核）一杯咖啡，暗晡頭就睡毋落覺。","example":""},{"word":"上鄰下舍","pinyin":"song linˇ haˊ sa【songˊ linˇ haˊ sa】","def":"鄰居。 例如：八月半，𠊎兜（𠊎等）會湊（邀）上鄰下舍共下焙肉（烤肉），盡鬧熱。","example":""},{"word":"天墀坪（丹墀坪）","pinyin":"tienˊ ciiˇ piangˇ (danˊ ciiˇ piangˇ)","def":"建築物的前庭廣場。 例如：頭過（頭擺），竹仔閣个天墀坪（丹墀坪）異（盡）雅，外坪還有一個半月形个魚塘。","example":""},{"word":"拖箱角","pinyin":"toˊ xiongˊ gogˋ","def":"抽屜內部。 例如：阿婆个禁指做下（聚概）囥在拖箱角。","example":""},{"word":"伐鐮","pinyin":"padˋ liamˇ","def":"砍除草木的長柄鐮刀。 例如：掛紙前，風水个草愛先用伐鐮伐淨來。","example":""},{"word":"禾鐮仔【禾鐮】","pinyin":"voˇ liamˇ eˋ【voˇ liamˇ】","def":"鐮刀，用來收割農作物或割除雜草的器具。 例如：老妹擎等禾鐮仔（禾鐮）去菜園割筷菜。","example":""},{"word":"屋簷（屋簷頭）【簷頭】","pinyin":"vugˋ iamˇ (vugˋ iamˇ teuˇ)【iamˇ teuˇ】","def":"屋簷。 例如：逐（每）年三、四月仔，吾（𠊎等）屋簷（簷頭）下就會有燕仔來做竇。","example":""},{"word":"搵水","pinyin":"vun suiˋ","def":"沾水使溼；另言「搵溼」即沾溼。 例如：桌布先搵水正去捽桌仔。","example":""},{"word":"楔桌腳","pinyin":"xiabˋ zogˋ giogˋ","def":"墊桌腳。 例如：這桌仔無平，拿張紙伯仔（紙枋仔）來楔桌腳。","example":""},{"word":"洩水","pinyin":"xied suiˋ","def":"把水加壓力噴至遠地。 例如：過年屋下大拚掃，阿姊拿水管對等窗門（窗仔）洩水。","example":""},{"word":"修面","pinyin":"xiuˊ mien","def":"刮臉，刮除臉上的鬚毛，使面容光潔。 例如：細倈人（細倈仔）剃頭，大體仔（寡寡）有合修面。","example":""},{"word":"齋齋","pinyin":"zaiˊ zaiˊ","def":"缺乏油分的感覺；口語亦可說「齋到會死」。 例如：你煮个菜齋齋，無半點油氣，仰傍飯得落？","example":""},{"word":"撍印仔（頓印仔）","pinyin":"zemˋ in eˋ (dun in eˋ)","def":"蓋印章。 例如：去銀行臨櫃領錢愛撍印仔。","example":""},{"word":"砧枋","pinyin":"zemˊ biongˊ","def":"砧板。 例如：這垤砧枋係切菜个，另外一垤係切肉个。","example":""},{"word":"紙伯仔【紙枋仔】","pinyin":"ziiˋ bagˋ eˇ【ziiˋ biongˊ eˋ】","def":"厚紙板。 例如：果子裝箱該下，愛墊兜紙伯仔（紙枋仔）落去（入去），正毋會矺壞忒（壞核）。","example":""},{"word":"莊頭","pinyin":"zongˊ teuˇ","def":"村莊。 例如：頭前該隻莊頭，係吾姑婆歇个位所。","example":""},{"word":"灶頭鑊尾","pinyin":"zo teuˇ vog miˊ","def":"廚房瑣事。 例如：灶頭鑊尾愛抺抺摸摸个事有當（蓋）多。","example":""},{"word":"早去早轉【早去早歸】","pinyin":"zoˋ hi zoˋ zonˋ【zoˋ hi zoˋ guiˊ】","def":"早去早回。 例如：你到新竹恁遠去辦事情，愛早去早轉（早去早歸）哦。","example":""},{"word":"掌屋","pinyin":"zongˋ vugˋ","def":"看家。 例如：𠊎去車頭載若哥，你在屋下掌屋。","example":""},{"word":"椊仔【塞仔】","pinyin":"zud eˋ【sedˋ eˋ】","def":"瓶口的塞子。例「盎椊仔（塞仔）」、「酒椊仔（塞仔）」。","example":""},{"word":"竹篙","pinyin":"zugˋ goˊ","def":"竹竿，可用於晒衣服或撐船。 例如：天時恁好，被骨拿去竹篙頂晒晒啊。","example":""},{"word":"竹修仔","pinyin":"zugˋ xiuˊ eˋ","def":"小竹條，用以修理小孩。 例如：頭擺个細人仔係毋聽話，世大人（大人儕）就擎（拿）竹修仔捋。","example":""},{"word":"撙水【扭水】","pinyin":"zunˋ suiˋ【ngiuˋ suiˋ】","def":"轉動水龍頭，意指把水龍頭打開，使其可以出水。「撙（扭）電火」同，其動作為轉動電燈開關，意指打開電燈。 例如：停水恁久，你撙水（扭水）看水道水有來吂（吔無）？","example":""},{"word":"菸屎","pinyin":"ienˊ siiˋ【ianˊ siiˋ】","def":"香菸燃燒過後所留下的灰燼。 例如：無人食菸，桌項仰會有菸屎？","example":""},{"word":"菸截仔","pinyin":"ienˊ jiedˋ eˇ【ianˊ jiedˋ eˋ】","def":"菸屁股。 例如：菸截仔莫亂擲（擳），愛放到菸确仔肚。","example":""},{"word":"打門","pinyin":"daˋ munˇ","def":"開門。 例如：人客來吔！去打門分人入。","example":""},{"word":"阿里不答","pinyin":"aˊ liˊ budˋ dabˋ/aˊ li bud dabˋ","def":"形容不三不四、沒規沒矩的人或事。 例如：若嘴較（過）正經兜仔好無？毋好專門講該阿里不答个話，敢聽得？","example":""},{"word":"矮頓","pinyin":"aiˋ dunˋ","def":"形容人矮而勇壯。 例如：佢生來矮頓矮頓，遠遠𠊎就認得出來。","example":""},{"word":"唉唉唧唧","pinyin":"aiˊ aiˊ jid jid【aiˊ aiˊ ziid ziid】","def":"形容唉聲嘆氣、猶豫不決、裹足不前的樣子。 例如：機會失忒（失核）毋使唉唉唧唧，下二擺愛記得把扼就好。","example":""},{"word":"挨尸磨壁（挨尸磨骨）【挨挨磨磨】","pinyin":"aiˊ siiˊ mo biagˋ (aiˊ siiˊ mo gudˋ)【aiˊ aiˊ mo mo】","def":"做事緩慢拖延，喻拖拖拉拉。 例如：喊你掃一下地泥就毋甘願，恁仔挨尸磨壁（挨挨磨磨），愛到哪央時（麼个時節）正做得好？","example":""},{"word":"暗摸叮咚","pinyin":"am moˊ dinˇ dungˇ","def":"形容漆黑一片。 例如：停電哩（吔），屋肚（屋仔裡背）暗摸叮咚，摸鼻公都毋著，將就上眠床睡目好哩（吔）。","example":""},{"word":"恁好膽","pinyin":"anˋ hoˋ damˋ","def":"這麼大膽。 例如：仰恁好膽，敢講賊仔擎刀仔你乜毋驚？","example":""},{"word":"八字吂有一撇【八字還無一撇】","pinyin":"badˋ sii mangˇ iuˊ idˋ pied【badˋ sii hanˇ/vanˇ moˇ idˋ piedˋ】","def":"喻事情還早呢！ 例如：這擺个合作，八字吂有一撇（八字還無一撇），還愛過談正會知有成無。","example":""},{"word":"半大細","pinyin":"ban tai se","def":"不大不小。 例如：半大細个細人仔吂知（毋知）頭天，異（盡）難教招（教示）。","example":""},{"word":"半生熟","pinyin":"ban sangˊ sug","def":"半生不熟。 例如：飯煮到（煮啊）半生熟，實在吞毋落胲。","example":""},{"word":"半天高","pinyin":"ban tienˊ goˊ","def":"比喻很高，用於形容空間上的高度。 例如：日頭半天高吔，你仰到今吂（毋曾）䟘床？","example":""},{"word":"半新舊","pinyin":"ban xinˊ kiu","def":"半新不舊。 例如：佢今晡日著一領半新舊个裌仔。","example":""},{"word":"半燥溼","pinyin":"ban zauˊ siibˋ","def":"半乾半溼。 例如：烏陰天晾个衫褲半燥溼，等好天正來晒過好哩（吔）。","example":""},{"word":"飽飽","pinyin":"bauˋ bauˋ","def":"飽飽的、滿滿的，形容充裕的樣子。例如「肚屎（肚笥）飽飽」、「賺到飽飽」。 例如：這皮包仔恁細仔定定，分你弓到飽飽，裡背敢有幾下百萬？","example":""},{"word":"飽水","pinyin":"bauˋ suiˋ","def":"飽含水分。 例如：這水果看起來盡飽水，當（蓋）餳人食。","example":""},{"word":"肉色","pinyin":"ngiugˋ sedˋ","def":"皮膚的顏色；皮膚色。 例如：厥肉色靚，著麼个都好看。","example":""},{"word":"包揫揫【包煞煞】","pinyin":"bauˊ qiuˊ qiuˊ【bauˊ sadˋ sadˋ】","def":"全包了，通通被包去；把頭臉、身體包裹得密不通風。 例如：愛帶个東西全部包揫揫（包煞煞）在這，你毋使愁哪項無帶著。 例如：若面做麼个包揫揫（包煞煞）？害𠊎嗄認毋出來係你。","example":""},{"word":"包山包海","pinyin":"bauˊ sanˊ bauˊ hoiˋ","def":"多得把山都包住，把海填滿，形容事物很多、範圍很廣的樣子。 例如：厥公司包山包海，麼个頭路都做。","example":""},{"word":"冰冰","pinyin":"benˊ benˊ","def":"凍凍的，形容冰涼。 例如：天時恁熱，食一罐冰冰个涼水，異（盡）舒爽（鬆爽）。","example":""},{"word":"啵啵滾","pinyin":"bo bo gunˋ","def":"狀聲詞，形容水勢盛大的狀聲詞。 例如：做大水過，河壩水啵啵滾拚等出。","example":""},{"word":"褒獎","pinyin":"boˊ jiongˋ","def":"褒揚獎勵。 例如：這個細人仔異（盡）好嘴碼，老老嫩嫩都褒獎佢。","example":""},{"word":"發扯扯仔","pinyin":"bodˋ ca ca eˋ【bodˋ ca ca eˊ】","def":"形容很富有。 例如：厥屋下發扯扯仔，出國讀書毋使愁無錢用。","example":""},{"word":"不褡不膝","pinyin":"budˋ dabˋ budˋ qidˋ","def":"既不是肚兜也不是護膝帕，比喻不三不四、不倫不類、不像樣、不正派。 例如：該筆錢係子女个學費，你莫不褡不膝想拿去賭徼（賭博）。","example":""},{"word":"齊腰仔","pinyin":"ceˇ ieuˊ eˋ","def":"指高度或深度到腰部。 例如：這泅水池个水正齊腰仔定定（定），你做得落來（下來）搞。","example":""},{"word":"齊膝頭","pinyin":"ceˇ qidˋ teuˇ","def":"及膝。 例如：頭擺讀書，細妹仔著个裙愛齊膝頭，正毋會忒短。","example":""},{"word":"層層疊疊","pinyin":"cenˇ cenˇ tiab tiab","def":"重重疊疊。 例如：若眠床項長袖短襖層層疊疊，敢看得？有閒愛整理一下仔。","example":""},{"word":"瘦夾夾仔","pinyin":"ceu giab giab eˋ【ceu giab giab eˊ】","def":"形容很瘦的樣子。 例如：佢兩子爺都瘦夾夾仔，生來盡相像。","example":""},{"word":"瘦身","pinyin":"ceu siinˊ","def":"身形較瘦。反之，則為「肥身」。 例如：阿壽哥个倈仔看著異（盡）瘦身，毋過罕得聽著佢發病仔（發病）。","example":""},{"word":"試試仔","pinyin":"cii cii eˋ【cii cii eˊ】","def":"由淺入深去嘗試。 例如：吂識（毋識）做過个事，先試試仔做看啊，做到順手正做下去。","example":""},{"word":"自大","pinyin":"cii tai","def":"自大。 例如：天外有天、人外有人，一個人絕對毋好自大。","example":""},{"word":"著釣","pinyin":"cog diau","def":"上鉤，落入陷阱。 例如：看釣魚仔个老阿伯跍歸半日吔，吂（還無）有魚仔著釣。","example":""},{"word":"脆脆","pinyin":"coi coi/ce ce","def":"形容很脆易斷裂的樣子。例「這材甘蔗脆脆」。","example":""},{"word":"長胲長胲","pinyin":"congˇ goiˊ congˇ goiˊ","def":"指物品細長。如「暖罐長胲長胲」。","example":""},{"word":"長纜纜仔","pinyin":"congˇ lamˇ lamˇ e/congˇ namˇ namˇ eˋ【congˇ namˇ namˇ eˊ】","def":"形容東西像繩子一樣又細又長。 例如：這條索仔長纜纜仔，拿來綑這隻大箱仔，還伸異（盡）長。","example":""},{"word":"長槓長槓（直條直條）","pinyin":"congˇ gong congˇ gong (ciid tiauˇ ciid tiauˇ)","def":"指東西修長的樣子。 例如：這屋舍長槓長槓，係竹篙屋。","example":""},{"word":"粗刊刊仔（粗鱗鱗仔）","pinyin":"cuˊ kanˊ kanˊ eˋ (cuˊ linˊ linˊ eˋ)【cuˊ kanˊ kanˊ eˊ】【cuˊ linˇ linˇ eˊ】","def":"物品粗糙而不夠細緻。如「麻紗粗刊刊仔」。","example":""},{"word":"出出入入","pinyin":"cudˋ cudˋ ngib ngib","def":"人或物進出頻繁的樣子；金錢的收入和支出繁雜。 例如：阿尚哥个雜貨店，歸日仔人客出出入入，生理還好哦！","example":""},{"word":"墜墜","pinyin":"cui cui","def":"下垂的樣子。 例如：柑仔打當（盡）結，樹椏仔（樹桍）墜墜。","example":""},{"word":"重跕跕仔（重鈂鈂仔）","pinyin":"cungˊ deb deb eˋ (cungˊ demˇ demˇ eˋ)【cungˊ demˇ demˇ eˊ】","def":"形容物品很重的樣子。 例如：這箱東西重跕跕仔（重鈂鈂仔），毋知係麼个？","example":""},{"word":"衝突","pinyin":"cungˊ tud","def":"衝突。 例如：佢兩儕人（個人）个衝突，在里長个排解下解決哩（吔）。","example":""},{"word":"溚潦（溚溼）","pinyin":"dab lauˇ (dab siibˋ)","def":"溼透了，形容溼淋淋的樣子。 例如：雨落到嶄然大，涿到（涿啊）歸身溚潦（溚溼）。","example":""},{"word":"低言細語","pinyin":"daiˊ ngienˇ se ngiˊ【daiˊ ngianˇ se ngiˊ】","def":"說話聲音細小。用以形容說話言語柔順、輕聲細語。 例如：該細人仔異（盡）好家教，對世大人（大人儕）講話做下（聚概）低言細語。","example":""},{"word":"恬索索","pinyin":"diamˊ sogˋ sogˋ","def":"形容寂靜無聲的樣子。 例如：學校開學，屋下無細人仔个聲，恬索索異（盡）毋慣。","example":""},{"word":"滴滴溚溚","pinyin":"did did dab dab","def":"零零星星的樣子；雨點打在屋頂或物品上的聲音。 例如：正餐無食，專門食該滴滴溚溚个，仰會飽？","example":""},{"word":"癲痴","pinyin":"dienˊ ciiˊ","def":"瘋癲，亦可說「癲癲痴痴」。 例如：這個人有小可仔癲痴，講話顛顛倒倒。","example":""},{"word":"𫟧上𫟧下（𫟧來𫟧去）","pinyin":"dinˊ songˊ dinˊ haˊ (dinˊ loiˇ dinˊ hi)","def":"轉來轉去忙個不停。 例如：恁夜吔，莫在該𫟧上𫟧下，好睡目吔！","example":""},{"word":"琢琢仔","pinyin":"dogˋ dogˋ eˇ【dogˋ dogˋ eˊ】","def":"按部就班地，多指連續的動作。 例如：做事愛像走馬拉松，琢琢仔做，毋使急。","example":""},{"word":"斷定","pinyin":"don tin","def":"斷定。 例如：佢從來盡準時，恁晝吔吂（毋曾）到，𠊎敢斷定佢定著有事情來毋得吔。","example":""},{"word":"短屈短屈","pinyin":"donˋ kud donˋ kud","def":"粗短的樣子。 例如：厥手指生來短屈短屈，毋過佢做事盡扡爪。","example":""},{"word":"肚挺挺仔","pinyin":"duˋ tenˋ tenˋ eˇ【duˋ tenˋ tenˋ eˊ】","def":"走路時身體將肚子往前挺的樣子。 例如：阿哥行路肚挺挺仔，像婦人家擐大肚樣仔。","example":""},{"word":"肚扐扐仔","pinyin":"duˋ led led eˋ【duˋ led led eˊ】","def":"肚子突出的模樣，且像游泳圈的樣子。 例如：你食忒多哩（吔），食到肚扐扐仔。","example":""},{"word":"肚凸凸仔","pinyin":"duˋ tied tied eˋ【duˋ tied tied eˊ】","def":"露出肚子的樣子；肚子鼓鼓的樣子。 例如：該隻（該）細人仔無著衫，肚凸凸仔，在恁多蟲仔个樹下搞，毋知驚。","example":""},{"word":"啄痀啄痀","pinyin":"dugˋ guˊ dugˋ guˊ【dug guˊ dug guˊ】","def":"打瞌睡的樣子，喻精神不振。 例如：阿叔在藤椅項坐等啄痀啄痀，十分目睡个樣仔。","example":""},{"word":"話屎仔","pinyin":"fa siiˋ eˇ【fa siiˋ eˋ】","def":"閒言閒語、不必要的廢話。 例如：有麼个話簡單講就好哩（吔），莫恁多話屎仔。","example":""},{"word":"壞漦【壞空】","pinyin":"faiˋ xiauˇ【faiˋ kangˊ】","def":"形容人脾氣不好。 例如：該隻（該）人盡壞漦（壞空），動啊著就緊罵人。","example":""},{"word":"反性","pinyin":"fanˋ xin","def":"性情大變，一般指老年人老了轉性或因承受打擊而改變性情的狀況。 例如：阿爸本旦當（蓋）好譴，老吔嗄反性，這下脾氣變到異（盡）好。 例如：厥婆過身了後，佢歸隻人反性，歸日仔面逼逼，全無笑面。","example":""},{"word":"煩躁","pinyin":"fanˇ cau","def":"心煩意躁。 例如：細人仔毋聽講愛定定仔解勸，莫起戇面（起番面），正毋會煩躁。","example":""},{"word":"褲袋仔","pinyin":"fu toi eˋ","def":"褲子的口袋。相近者「衫袋仔」即上衣的口袋。 例如：若个褲袋仔裝恁多東西，飽飽膨膨異（盡）壞看相。","example":""},{"word":"福氣","pinyin":"fugˋ hi","def":"福氣。 例如：畜个大細若係煞猛增志，斯係屋下个福氣。","example":""},{"word":"福相","pinyin":"fugˋ xiong","def":"福態。 例如：阿伯姆（伯姆）生來福相福相，看著異（盡）好命个樣仔。","example":""},{"word":"分醒","pinyin":"funˊ xiangˋ","def":"清醒。 例如：道理講到一千擔，佢到今還毋知分醒。","example":""},{"word":"紅冬冬","pinyin":"fungˇ dungˊ dungˊ","def":"因外力導致而呈現紅通通的狀態，如火烤，日晒所引起。 例如：佢去海脣搞，歸身分日頭晒到（晒啊）紅冬冬。","example":""},{"word":"紅濟濟仔","pinyin":"fungˇ ji ji eˋ【fungˇ ji ji eˊ】","def":"形容物品紅通通的樣子。例如「紅濟濟仔个李仔」、「頭那毛染到紅濟濟仔」。","example":""},{"word":"紅囉囉仔","pinyin":"fungˇ loˊ loˊ eˋ【fungˇ loˊ loˊ eˊ】","def":"形容臉色紅潤的樣子，屬自體呈現，非由外力引起。 例如：這個細妹仔个面紅囉囉仔，盡像蘋果共樣。","example":""},{"word":"紅漬漬仔","pinyin":"fungˇ jid jid eˋ【fungˇ jidˋ jidˋ eˊ】","def":"物品豔紅色的樣子。 例如：厥嘴脣畫到（畫啊）紅漬漬仔像阿旦。","example":""},{"word":"加減好","pinyin":"gaˊ gamˋ hoˋ","def":"多少有好處；多多益善。 例如：佢當（盡）好批人，見堵著毋使錢个，就加減好加減拿。","example":""},{"word":"合身","pinyin":"gagˋ siinˊ【hab siinˊ】","def":"衣服很合身。 例如：厥這身西裝係同裁縫師傅定做个，特別合身。","example":""},{"word":"徑徑杈杈","pinyin":"gang gang ca ca","def":"形容東西零亂、礙手礙腳。 例如：歸屋仔放恁多東西，徑徑杈杈愛仰仔行？","example":""},{"word":"徑手徑腳","pinyin":"gang suˋ gang giogˋ","def":"礙手礙腳。 例如：阿姆這下在灶下當（蓋）無閒，你莫在這徑手徑腳。","example":""},{"word":"粳膏个","pinyin":"gangˊ goˇ ge","def":"漿糊糊的，比喻不牢靠。 例如：你這東西摸啊著就壞，像人用粳膏个。","example":""},{"word":"結團【結矻】","pinyin":"giedˋ tonˇ【giadˋ tonˇ】【giadˋ kid】","def":"凝結成一塊。 例如：歸包幼幼仔个萋魚脯仔放落冰庫，異（盡）遽就結團（結矻）。","example":""},{"word":"肩胛咻咻","pinyin":"gienˊ gabˋ hio hio【gianˊ gabˋ hieu hieu】","def":"肩膀斜斜的樣子，帶有神氣、驕傲的意味。 例如：說（講）佢兩句，佢就肩胛咻咻。","example":""},{"word":"奸雄","pinyin":"gienˊ hiungˇ【gianˊ hiungˇ】","def":"狡詐多端的，亦可指狡詐多端的人。 例如：這兜奸雄，食就走第一，做事就瀉淨淨。","example":""},{"word":"金若若仔","pinyin":"gimˊ na na eˋ【gimˊ na na eˊ】","def":"物品的外貌亮晶晶的。 例如：該臺舊車仔捽到金若若仔，像新个樣仔。","example":""},{"word":"緊性","pinyin":"ginˋ xin","def":"急性子。 例如：駛車仔愛順順仔來，莫忒緊性，較（過）安全。","example":""},{"word":"過時","pinyin":"go siiˇ","def":"時節已過、不流行了；過了適當時節。 例如：逐（每）年年下仔百貨公司會同過時个衫褲拿來打折便宜賣。 例如：過時个西瓜無恁甜，較（過）毋好食。","example":""},{"word":"過時个月曆","pinyin":"go siiˇ ge ngied lag【go siiˇ ge ngiad lag】","def":"表時機已過，常用於比喻已經沒有用處的物品。 例如：阿窩伯盡好（最好）講後生時節个風光事蹟，同年笑佢：過時个月曆哩（吔）。","example":""},{"word":"高長大漢","pinyin":"goˊ congˇ tai hon","def":"高頭大馬，可用於名詞或形容詞。 例如：莊頭項，臨暗仔來兩個高長大漢个人，毋知愛來做麼个。 例如：吾（𠊎个）倈仔生到高長大漢，毋過連八十斤个擔頭都㧡毋贏。","example":""},{"word":"高擎擎仔","pinyin":"goˊ kiaˇ kiaˇ eˋ【goˊ kiaˇ kiaˇ eˊ】","def":"形容個子高。 例如：厥倈仔生到高擎擎仔，係較（過）作肉兜仔，就盡好看。","example":""},{"word":"各樣","pinyin":"gogˋ iong","def":"身體顯現出來的缺陷或異樣；各種。 例如：阿爸个腳有各樣，行路跛啊跛仔。","example":""},{"word":"該食【簡單】","pinyin":"goiˊ siid【gianˋ danˊ】","def":"喻容易勝任，常用於否定，指沒那麼簡單。 例如：這頭路異（盡）多孔竅，𠊎看斯無恁該食（簡單）哦！","example":""},{"word":"趕遽","pinyin":"gonˋ giagˋ","def":"趕緊，趕快。 例如：該間屋仔係有中意就愛趕遽同佢過定（註文），無斯會分人買走哩喲（吔喲）。","example":""},{"word":"趕後生","pinyin":"gonˋ heu sangˊ","def":"趁年輕。 例如：讀書愛趕後生，係無記才會越來越退步。","example":""},{"word":"趕燒趕熱（趕燒）","pinyin":"gonˋ seuˊ gonˋ ngied (gonˋ seuˊ)【gonˋ seuˊ gonˋ ngiad】","def":"趁熱、乘勢，即打鐵趁熱。 例如：做事情愛趕燒趕熱，正會成功。","example":""},{"word":"江湖","pinyin":"gongˊ fuˇ","def":"江湖；形容人很海派。 例如：阿亮叔異（盡）江湖，見知著鄰舍有困難，就會出手相𢯭。","example":""},{"word":"光光","pinyin":"gongˊ gongˊ","def":"光線明亮的樣子。 例如：天光日愛考試，三更半夜火還光光，今暗晡怕毋使睡哩（吔）。","example":""},{"word":"光頭落勺（光頭息勺）","pinyin":"gongˊ teuˇ log sog (gongˊ teuˇ xid sog)","def":"光著頭。 例如：該隻賊仔光頭落勺，著白色短褲，還合一雙烏色个球鞋，當（蓋）好認。","example":""},{"word":"孤栖孤栖","pinyin":"guˊ xiˊ guˊ xiˊ","def":"孤單的樣子。 例如：阿紹伯兩公婆感情當（蓋）好，自阿紹伯無在過後，伸伯姆一個人孤栖孤栖。","example":""},{"word":"慣慣","pinyin":"guan guan","def":"習慣了。 例如：看慣慣个牆頭一下拆忒（拆核）嗄真毋慣。","example":""},{"word":"狹膣狹極（狹膣狹蹶）","pinyin":"hab ziiˊ hab kid (hab ziiˊ hab kied)","def":"形容空間極狹窄。 例如：恁闊个位所分佢起屋，灶下做到狹膣狹極，轉身就毋得，實在還無結煞。","example":""},{"word":"還較得【還過得】","pinyin":"hanˇ ka dedˋ【hanˇ/vanˇ go dedˋ】","def":"比較起來好多了，同義詞如「還較（過）正」、「還較（過）好」。 例如：講著成績，老弟同頭名全全比毋得，比該尾名就還較得（還過得）。","example":""},{"word":"還較死【還過死】","pinyin":"hanˇ ka xiˋ【hanˇ/vanˇ go xiˋ】","def":"比死亡還悲慘，意即更加糟糕。 例如：無錢毋會作怪，有錢顛倒還較死（還過死），嗄變鬼變怪。","example":""},{"word":"閒手腳","pinyin":"hanˇ suˋ giogˋ","def":"比喻多餘的時間、力氣。 例如：愛去你自家去，麼人有閒手腳好去！","example":""},{"word":"閒亍亍","pinyin":"hanˇ cogˋ cogˋ","def":"悠閒；無所事事。 例如：尞日閒亍亍，睡較（過）晝兜仔無相干。 例如：佢退休過後，閒亍亍，就去社區做義工。","example":""},{"word":"閒毋得","pinyin":"hanˇ mˇ dedˋ","def":"閒不住，閒不下來。 例如：阿婆腳毋方便還恁好做，正經係閒毋得。","example":""},{"word":"閒時間","pinyin":"hanˇ siiˇ gienˊ【hanˇ siiˇ gianˊ】","def":"閒工夫。 例如：屋下人無恁多閒時間教你，去學校問先生。","example":""},{"word":"緪斗（緪頭）","pinyin":"henˇ deuˋ (henˇ teuˇ)","def":"事多而時間幾乎不足的緊迫狀態。 例如：這事頭恁緪斗，無人敢貌來做。","example":""},{"word":"口涎波潑","pinyin":"heuˋ lanˊ poˊ/boˊ bad","def":"口沫橫飛。 例如：講个人講到口涎波潑，聽个人聽到嘴勺勺仔。","example":""},{"word":"猴形","pinyin":"heuˇ hinˇ","def":"喻搞怪善變。 例如：該隻（該）人盡猴形，無恁該（無恁簡單）剃頭。","example":""},{"word":"興嘟嘟仔","pinyin":"him du du eˋ【him du du eˊ】","def":"興沖沖的。 例如：講著食就興嘟嘟仔，講著做就懶𧊅𧊅仔。","example":""},{"word":"香噴噴仔","pinyin":"hiongˊ pun pun eˋ【hiongˊ pun pun eˊ】","def":"香噴噴。 例如：這品（項）菜鼻起來香噴噴仔，食起來無見奇。","example":""},{"word":"雄頭","pinyin":"hiungˇ teuˇ","def":"有雄風的樣子。 例如：看你恁久殗殗，無半息雄頭，係毋係有哪爭差？","example":""},{"word":"雄猛","pinyin":"hiungˇ mangˊ/menˊ","def":"勇猛，亦可說「雄兵猛將」。 例如：佢像牛牯樣仔恁雄猛，承你三下拳頭還無問題。","example":""},{"word":"好運","pinyin":"hoˋ iun","def":"運氣很好。 例如：佢實在當（蓋）好運，買樂透長透（不時）著獎。","example":""},{"word":"好膽","pinyin":"hoˋ damˋ","def":"有膽量、不怕。 例如：你實在異（盡）好膽！喊你在屋下掌屋，你還偷偷仔走出去，毋驚阿姆發譴係無？","example":""},{"word":"頸跔跔仔【頸縮縮仔】","pinyin":"giangˋ giuˊ giuˊ eˋ【giangˋ sugˋ sugˋ eˊ】","def":"脖子縮短貌。 例如：天時寒，寒到（寒啊）頸跔跔仔（頸縮縮仔）。","example":""},{"word":"好衰毋衰","pinyin":"hoˋ soiˊ mˇ soiˊ","def":"指壞運氣，真倒楣的意思。 例如：好衰毋衰，一出門就踏著牛屎堆。（諺） 例如：好衰毋衰，無赴著車仔，皮包仔又跌忒（跌核）。","example":""},{"word":"好頭好尾","pinyin":"hoˋ teuˇ hoˋ miˊ","def":"從頭好到尾，表示事情圓滿成功。 例如：做麼个事情都共樣，好頭好尾正圓滿。","example":""},{"word":"好頭好面","pinyin":"hoˋ teuˇ hoˋ mien","def":"外表顯示出很好的樣子。 例如：看佢好頭好面，毋過心肝當（蓋）壞。 例如：這朳仔（拉朳仔）看起來好頭好面，毋過裡肚（裡背）全綿忒（綿核）。","example":""},{"word":"好手腳（好手板）","pinyin":"hoˋ suˋ giogˋ (hoˋ suˋ banˋ)","def":"動作迅速。 例如：張伯姆好手腳（好手板），毋使半點鐘，就煮一張桌豐豐沛沛。","example":""},{"word":"海底摸針","pinyin":"hoiˋ daiˋ miaˊ ziimˊ","def":"海底撈針。 例如：寄信仔个住所寫無詳細，愛喊送信仔个海底摸針咩？","example":""},{"word":"一千擔","pinyin":"idˋ qienˊ damˊ","def":"形容東西很多，稀鬆平常，到處可見。 例如：這係異（盡）平常个東西，吾（𠊎）屋下一千擔，毋係你正有。","example":""},{"word":"一踢三通","pinyin":"idˋ tedˋ samˊ tungˊ","def":"舉一反三。 例如：佢盡聰明，一踢三通，毋使加講。","example":""},{"word":"一窩一窟（窩窩窟窟）","pinyin":"idˋ voˊ idˋ fudˋ (voˊ voˊ fudˋ fudˋ)","def":"形容高低不平或坑坑洞洞貌。 例如：落雨過後，這條大路嗄一窩一窟，盡難行。","example":""},{"word":"樣相","pinyin":"iong xiong","def":"樣子、態度、形像。 例如：見擺就頸偏偏仔，該樣相看著就得人惱。","example":""},{"word":"洋洋洋洋","pinyin":"iongˇ iongˇ iong iong","def":"水盛大、水流不止的樣子。 例如：落過雨，屋面前（頭前）个圳溝水洋洋洋洋。","example":""},{"word":"幼皮嫩肉","pinyin":"iu piˇ nun ngiugˋ","def":"細皮嫩肉。 例如：嬰兒仔幼皮嫩肉，同佢洗身愛細義，輕手定板正好。","example":""},{"word":"幼秀","pinyin":"iu xiu","def":"形容外表清秀脫俗；動作慢、做工精細。 例如：這細妹仔生來幼秀，講話又當（盡）軟聲。 例如：食東西恁幼秀，毋知做粗事敢有法度？","example":""},{"word":"油光油光","pinyin":"iuˇ gongˊ iuˇ gongˊ","def":"青菜煮好後呈現的油亮貌。 例如：若蕹菜炒到油光油光，異（盡）餳人食。","example":""},{"word":"有頭有尾","pinyin":"iuˊ teuˇ iuˊ miˊ","def":"有始有終。相反詞為「有頭無尾」。 例如：頭家盡中意做事有頭有尾个承勞仔。","example":""},{"word":"有修","pinyin":"iuˊ xiuˊ","def":"德行方面修養得很圓滿。 例如：這間廟个住持係有修个人。","example":""},{"word":"油濟濟仔","pinyin":"iuˇ ji ji eˋ【iuˇ ji ji eˊ】","def":"油膩膩的。 例如：烰个東西通體（總概）都油濟濟仔，毋好食忒多。","example":""},{"word":"潤潤","pinyin":"iun iun","def":"溼潤的樣子。 例如：落恁久个雨，這衫摸起來潤潤。","example":""},{"word":"潤忒【潤核】","pinyin":"iun tedˋ【iun hedˋ】","def":"物品因受潮而溼潤的樣子。 例如：餅仔係無食忒（食核）愛䌈起來，毋好放分佢潤忒（潤核）。","example":""},{"word":"靚靚仔","pinyin":"jiangˊ jiangˊ eˋ【jiangˊ jiangˊ eˊ】","def":"還算漂亮。 例如：佢生來靚靚仔，算異（盡）耐看。","example":""},{"word":"落毋著（落窖毋著）","pinyin":"labˋ mˇ doˋ (labˋ gau mˇ doˋ)","def":"無法兜攏。 例如：你兩儕（兩個人）講个完全落毋著（落窖毋著），定著有一儕（一個人）講花蓼。","example":""},{"word":"精靈","pinyin":"jinˊ linˇ","def":"形容人頭腦清楚、聰明靈敏的樣子。 例如：厥妹仔生來盡精靈，讀書當慶（盡壁）。","example":""},{"word":"精頭精面","pinyin":"jinˊ teuˇ jinˊ mien","def":"謂面貌長相很聰明；「戇頭戇面」為反義詞，謂表面看起來呆呆的。 例如：看佢精頭精面，吂知（毋知）也會做糊塗事。","example":""},{"word":"精俐","pinyin":"jinˊ li","def":"精明伶俐。 例如：佢新討个心臼盡精俐，手腳遽，想事情又周到。","example":""},{"word":"啁啁滾","pinyin":"jio jio gunˋ","def":"形容喧鬧吵雜的樣子。 例如：屋簷（簷頭）下有鳥仔做竇，鳥子歸日仔啁啁滾。","example":""},{"word":"皺皺","pinyin":"jiu jiu","def":"形容皺痕多。 例如：棉質个衫褲，洗過係無熨，就變到（變啊）皺皺。","example":""},{"word":"皺皮","pinyin":"jiu piˇ","def":"皮膚有皺紋。 例如：正三十歲，面就皺皮皺皮，看起來加異（盡）老。","example":""},{"word":"酒醉摸些","pinyin":"jiuˋ zui miaˊ xiaˊ","def":"酒醉走路東倒西歪的樣子。 例如：佢長間食酒食到（食啊）酒醉摸些，行路打腳偏。","example":""},{"word":"卡手卡腳","pinyin":"kaˇ suˋ kaˇ giogˋ","def":"手腳被束縛不自由、不順暢。 例如：愛改竹筍無恁該（無恁簡單），使钁頭會卡手卡腳。","example":""},{"word":"交手交腳【交手翹腳】","pinyin":"kauˊ suˋ kauˊ giogˋ【kauˊ suˋ kieu giog】","def":"形容人很清閒的樣子。 例如：佢同頭路放下來尞，食飽飯就交手交腳（交手翹腳），異（盡）爽快。","example":""},{"word":"嶇（竳）","pinyin":"kiˊ (denˇ)","def":"陡峭。 例如：這崎當（蓋）嶇，騎自行車毋好直接溜下來，當（盡）危險。","example":""},{"word":"輕手輕腳","pinyin":"kiangˊ suˋ kiangˊ giogˋ","def":"手腳動作輕巧，小心翼翼的以免發出聲響。 例如：歸班仔都在該睡當晝，你行路愛輕手輕腳，莫吵著人。","example":""},{"word":"輕可事","pinyin":"kiangˊ koˋ se","def":"輕鬆事。 例如：麼个啊？連兜茶、抺桌這兜輕可事你都毋曉做！","example":""},{"word":"及及仔","pinyin":"kib kib eˋ【kib kib eˊ】","def":"勉強達到，處於臨界點之狀態。 例如：這批貨个原料，算算啊及及仔還罅，有少乜毋會少盡多。","example":""},{"word":"極多漦鼻","pinyin":"kid doˊ xiauˇ pi","def":"煩人囉嗦事特別多。也可說「漦鼻極（盡）多」。 例如：一下講愛改這，一下講愛修該，極多漦鼻！","example":""},{"word":"矻矻搉搉","pinyin":"kid kid kog kog","def":"狀聲詞，形容敲打物品聲，時不時傳出的聲響。 例如：半夜毋睡目，在該矻矻搉搉做麼个？","example":""},{"word":"汔","pinyin":"kied","def":"形容穀物熬煮到汁液濃稠。 例如：粥煮到醹合汔，好食又食得飽。","example":""},{"word":"翹翹","pinyin":"kieu kieu","def":"翹起的樣子。 例如：這粒石頭一頭翹翹，踏（蹬）上去愛較（過）細義兜仔（一息），莫跌倒（橫倒）。","example":""},{"word":"巧神","pinyin":"kauˋ siinˇ【kieuˋ siinˇ】","def":"聰慧，屬具特殊能力的聰明。 例如：佢當（蓋）巧神，一講佢就知。","example":""},{"word":"虯虯","pinyin":"kiuˇ kiuˇ","def":"彎曲的；彈牙有嚼勁。 例如：這豬皮食起來虯虯，當（蓋）好食。","example":""},{"word":"共樣共樣","pinyin":"kiung iong kiung iong","def":"一模一樣。 例如：佢兩儕（個人）係雙生仔，難怪生來共樣共樣。","example":""},{"word":"孔竅","pinyin":"kungˋ kieu","def":"事物的要領與訣竅。 例如：學麼个都愛用心看，抓捉著孔竅來，就毋會難哩（吔）。","example":""},{"word":"空空缺缺（一空一缺）","pinyin":"kungˊ kungˊ kiedˋ kiedˋ (idˋ kungˊ idˋ kiedˋ)【kangˊ kangˊ kiadˋ kiadˋ】【idˋ kangˊ idˋ kiadˋ】","def":"形容道路坑坑洞洞、凹凸不平的樣子。 例如：這條路挖自來水管，搣到（搣啊）哪都空空缺缺，你斯愛細義兜仔（一息）。","example":""},{"word":"拉拉雜雜","pinyin":"lab lab cab cab","def":"東西混雜在一起，有加強語氣的作用。 例如：堆到歸間仔拉拉雜雜个東西，愛尋一雙鞋都難。","example":""},{"word":"爛擐","pinyin":"lan kuan","def":"衣物破爛，亦可說「爛爛擐擐」或「爛膣爛擐」，即形容衣物破爛不堪。 例如：頭擺个布做衫異（盡）毋耐著，窮人長年透天都著到（著啊）爛擐爛擐。","example":""},{"word":"亮亮【金金】","pinyin":"lang lang【gimˊ gimˊ】","def":"平整光亮的樣子。 例如：烏結𤊶个鑊頭，分𠊎鑪到（鑪啊）亮亮（金金）。","example":""},{"word":"亮頭","pinyin":"lang teuˇ","def":"衣裝整潔、光鮮亮麗。 例如：佢做業務，一哪仔尋客戶，故所逐（每）日著到亮頭亮頭。","example":""},{"word":"伶伶俐俐","pinyin":"langˇ langˇ li li","def":"乾乾淨淨，也可指乾淨俐落。 例如：佢異（盡）會理家，屋下內內外外全部整理到伶伶俐俐。","example":""},{"word":"零零星星","pinyin":"langˇ langˇ sangˊ sangˊ","def":"零零星星。 例如：大項下个東西整理好來，伸个零零星星就等佢哪。","example":""},{"word":"落臍","pinyin":"lau ce","def":"衣服沒穿好，引申為邋遢；比喻做事沒信用、不牢靠。 例如：有兜人著衫褲當（蓋）落臍，有兜人當（盡）講究。","example":""},{"word":"潦潦【溚溼】","pinyin":"lauˇ lauˇ【dab siibˋ】","def":"溼透的樣子，多用於被雨淋溼。 例如：風雨忒大，就算擎遮仔還係歸身仔涿到（涿啊）潦潦（溚溼）。","example":""},{"word":"連峨接棟","pinyin":"lienˇ ngoˇ jiabˋ dung","def":"房舍多而相連。 例如：該隻（個）新社區个樓屋起到連峨接棟，當（盡）鬧熱。","example":""},{"word":"流流流流","pinyin":"liuˇ liuˇ liu liu","def":"形容細水流不停的樣子。例如「鼻水流流流流」。","example":""},{"word":"老老","pinyin":"loˋ loˋ","def":"形容老、不嫩，常用於植物。 例如：這蘿蔔仔忒過潦正挷，煮湯食著老老，布布哩（吔）。","example":""},{"word":"潦草","pinyin":"loˋ coˋ","def":"潦草。 例如：先生講佢：生來恁幼秀，可惜寫字恁潦草。","example":""},{"word":"落罶","pinyin":"log liu","def":"掉入圈套、上當。 例如：詐騙集團當（盡）聰明，害盡多人落罶。","example":""},{"word":"酪酪【綿綿】","pinyin":"logˋ logˋ【mienˇ mienˇ】","def":"爛熟。 例如：這鑊豬腳煲到（煲啊）酪酪（綿綿），十分湛斗（登真）。","example":""},{"word":"來來去去","pinyin":"loiˇ loiˇ hi hi","def":"形容往來進出頻繁。 例如：臺北捷運个人逐（每）日來來去去，就像泥竇肚（裡背）个蟻公出出入入。","example":""},{"word":"㪐㪐","pinyin":"ludˋ ludˋ","def":"形容鬆脫的樣子。 例如：該支钁頭柄㪐㪐，愛細義。","example":""},{"word":"毋堵好","pinyin":"mˇ duˋ hoˋ","def":"不小心、不慎。 例如：工人挖大路，毋堵好同水管挖斷忒（斷核）。","example":""},{"word":"毋係時節","pinyin":"mˇ he siiˇ jiedˋ","def":"不是時候，指時機不對。 例如：這下毋係時節，西瓜無幾好食。","example":""},{"word":"毋成","pinyin":"mˇ sangˇ","def":"沒有成功；算不了什麼。 例如：𠊎看啊，這筆生理定著講毋成。 例如：這包茶米（茶心）送你，毋成麼个禮數。","example":""},{"word":"末忒【末核】","pinyin":"mad tedˋ【mad hedˋ】","def":"滅絕、沒落。 例如：客話愛有人講，正毋會末忒（末核）。","example":""},{"word":"慢趖趖仔","pinyin":"man soˇ soˇ eˋ【man soˇ soˇ eˊ】","def":"動作慢吞吞的。 例如：你過恁仔慢趖趖仔，等下會赴毋著車枋。","example":""},{"word":"慢板","pinyin":"man banˋ","def":"比喻做事慢吞吞的樣子。 例如：做事情莫恁慢板，愛遽兜仔。","example":""},{"word":"滿山滿坪","pinyin":"manˊ sanˊ manˊ piangˇ","def":"遍及整座山。 例如：這所在往擺有滿山滿坪野生个栗仔樹。","example":""},{"word":"茅","pinyin":"mauˇ","def":"不順、不好用、糟糕。 例如：這手機仔當（盡）茅，兩下半就壞忒（壞核）。","example":""},{"word":"微細","pinyin":"miˇ se","def":"細微。 例如：醫院分工異（盡）微細，有分做當（蓋）多科。","example":""},{"word":"命靚","pinyin":"miang jiangˊ","def":"命好。 例如：肚飢還愛揀食，正經命靚。","example":""},{"word":"命歪","pinyin":"miang vaiˊ","def":"命不好，例如「怨命歪」。","example":""},{"word":"面𢳆面竵（面𢳆鼻竵）","pinyin":"mien ngau mien feˋ (mien ngau pi feˋ)","def":"形容非常不高興，擺出不好看的臉色，亦可說「面臭面勿」。 例如：該隻（個）後生人講佢毋得，一下仔就面面竵。","example":""},{"word":"面呰呰仔","pinyin":"mien ziiˊ ziiˊ eˋ【mien ziiˊ ziiˊ eˊ】","def":"臉色不和悅的樣子。 例如：逐（每）日看著佢就面呰呰仔，像少著厥錢樣仔。","example":""},{"word":"摸挲（摸摸挲挲）","pinyin":"mo so (mo mo so so)","def":"東摸西摸，做事態度緩慢拖拖拉拉的樣子。 例如：你恁（恁仔）摸挲（摸摸挲挲），事頭哪久正做得好？","example":""},{"word":"毛絨絨","pinyin":"moˊ iungˇ iungˇ","def":"毛髮綿密的樣子。 例如：細雞子歸身毛絨絨，像一粒球仔，盡得人惜。","example":""},{"word":"無恁該【無恁簡單】","pinyin":"moˇ anˋ goiˊ【moˇ anˋ gianˋ danˊ】","def":"沒那麼容易。 例如：著獎券無恁該（無恁簡單），運氣好个人正著得著。","example":""},{"word":"無採工","pinyin":"moˇ caiˋ gungˊ","def":"枉費，白做的意思。 例如：拚死拚命做事賺个錢拿去賭徼（賭博）輸淨淨，正經係無採工。","example":""},{"word":"無打無扮","pinyin":"moˇ daˋ moˇ ban","def":"毫無打扮。 例如：看厥餔娘（姐仔）平常時無打無扮，今晡日恁仔打扮起來，異靚（蓋鬧）哦。","example":""},{"word":"無搭無碓","pinyin":"moˇ dabˋ moˇ doi","def":"沒意思、沒趣味之意。 例如：你莫在這講該無搭無碓个，𢯭手想辦法較（過）重要。","example":""},{"word":"無見奇","pinyin":"moˇ gien kiˇ【moˇ gian kiˇ】","def":"普通、不足為奇；沒多大效果。 例如：這品菜鼻起來香馞馞仔，食起來無見奇。","example":""},{"word":"無閒洎杈","pinyin":"moˇ hanˇ qi ca","def":"形容忙得無法開交的狀態。 例如：年下仔，家家屋屋愛拚掃、愛辦年貨，大家都無閒洎杈。","example":""},{"word":"無好空","pinyin":"moˇ hoˋ kungˊ【moˇ hoˋ kangˊ】","def":"沒什麼好處；沒什麼好事。 例如：平常無來往，你這駁仔恁輒來尋佢，定著無好空。","example":""},{"word":"無味無緒","pinyin":"moˇ mi moˇ xi","def":"淡然無味。 例如：這食起來無味無緒，餳佢毋著啦！","example":""},{"word":"無目水","pinyin":"moˇ mugˋ suiˋ","def":"沒眼光、沒見識。 例如：無目水个人淨顧眼前，毋知好向前發展。","example":""},{"word":"無哪尋","pinyin":"moˇ nai qimˇ","def":"找不到、無處尋，多用於表難得之語境。 例如：恁好、恁惜老公个餔娘（姐仔），無哪尋，你斯毋好過嫌哩（吔）！","example":""},{"word":"無腦屎【無腦屎漿】","pinyin":"moˇ noˋ siiˋ【moˇ noˋ siiˋ jiongˊ】","def":"罵人笨拙沒腦筋。 例如：無腦屎（無腦屎漿）係無？恁簡單个事，你到今還看毋真。","example":""},{"word":"無主無意","pinyin":"moˇ zuˋ moˇ i","def":"對事物沒有確定的主張或見解；沒有表達意見的立場。 例如：佢做人做事盡會擎順風旗，對所有个事情全部無主無意。","example":""},{"word":"無字眼个","pinyin":"moˇ sii ngienˋ ge【moˇ sii ngianˋ ge】","def":"不成理的。 例如：講該無字眼个，公廳仰會做得分開來賣分別姓人呢？","example":""},{"word":"無新無舊","pinyin":"moˇ xinˊ moˇ kiu","def":"不新不舊。 例如：這領衫个色看起來無新無舊，你仰會中意呢？","example":""},{"word":"目吊吊","pinyin":"mugˋ diau diau","def":"眼珠向上翻。 例如：細人仔發豬嫲瘵（發死）目吊吊，愛遽遽（共快）送去醫院。","example":""},{"word":"目金金仔【眼金金仔】","pinyin":"mugˋ gimˊ gimˊ eˋ【ngianˋ gimˊ gimˊ eˊ】","def":"睜大眼睛想看清楚的樣子。 例如：銀樓个金條盡餳人，大家看到目金金仔（眼金金仔）毋想走。","example":""},{"word":"目𥍉𥍉仔","pinyin":"mugˋ ngiabˋ ngiabˋ eˇ【mugˋ ngiabˋ ngiabˋ eˊ】","def":"眼巴巴顯得無可奈何的樣子。 例如：佢做生理失敗吔，目𥍉𥍉仔異（盡）衰過。","example":""},{"word":"食力","pinyin":"siid lid","def":"吃力。 例如：蹶玉山進前愛先準備好勢，正毋會蹶到忒食力。","example":""},{"word":"目睡摸些","pinyin":"mugˋ soi miaˊ xiaˊ","def":"睡眼惺忪的樣子。 例如：早車肚（裡背），盡輒看著當（蓋）多人還目睡摸些就赴上班。","example":""},{"word":"濛濛","pinyin":"mungˇ mungˇ","def":"模糊狀。 例如：落大雨，歸路仔濛濛，看毋清楚頭前有幾多臺車仔來。","example":""},{"word":"耐當","pinyin":"nai dong","def":"能夠忍受得了、經得起長時間考驗。例「阿明這人當（蓋）耐當」、「索仔毋耐當」、「身體毋耐當」。","example":""},{"word":"耐命","pinyin":"nai miang","def":"生命力很堅韌。 例如：出恁大个車禍佢全無事，人講佢實在耐命。","example":""},{"word":"耐看","pinyin":"nai kon","def":"可以長時間觀賞，不會被嫌惡。「耐畜」則表可以養得很久。 例如：這女主角雖然講毋係當（蓋）靚，毋過當（蓋）耐看。","example":""},{"word":"難講","pinyin":"nanˇ gongˋ","def":"難說、不確定之意。 例如：阿叔講會轉來（歸來）過年，圍爐吔還無看著人，𠊎看斯難講哦。","example":""},{"word":"鬧熱煎煎","pinyin":"nau ngied jienˊ jienˊ【nau ngiad jienˊ jienˊ】","def":"形容非常熱鬧。 例如：操場今晡日鬧熱煎煎，原來係借人辦運動會。","example":""},{"word":"淰黃","pinyin":"nemˊ vongˇ","def":"形容色彩黃澄澄地。 例如：園仔肚（裡背）个柑仔淰黃淰黃，好摘哩（吔）！","example":""},{"word":"五五十十（唔唔啐啐）","pinyin":"ngˋ ngˋ siib siib (ngˋ ngˋ sud sud)","def":"支吾其詞；心猿意馬。 例如：阿姆看著阿通仔講話五五十十講毋得出，就知得佢定著又做差事哩（吔）。","example":""},{"word":"硬健硬健","pinyin":"ngang kien ngang kien 【ngang kian ngang kian】","def":"質地硬硬的。 例如：這品種个番薯，食起來硬健硬健，煲番薯湯較（過）好食。","example":""},{"word":"耳卻卻仔","pinyin":"ngiˋ hiogˋ hiogˋ eˇ【ngiˋ hiogˋ hiogˋ eˊ】","def":"高豎耳朵，認真傾聽的樣子，亦可說「耳角角仔」。 例如：阿公在廳下講古，孫仔耳卻卻仔聽。 例如：佢當（蓋）會講古，逐儕（每一個人）都聽到耳卻卻仔。","example":""},{"word":"眼擘擘仔","pinyin":"ngienˋ bagˋ bagˋ eˇ【ngianˋ bagˋ bagˋ eˊ】","def":"眼巴巴看著，眼神帶有失望的樣子。 例如：慢來，無好食，眼擘擘仔看人食。","example":""},{"word":"眼扁扁仔","pinyin":"ngienˋ bienˋ bienˋ eˇ【ngianˋ bienˋ bienˋ eˊ】","def":"眼巴巴的，不甘心而無奈的樣子。 例如：老妹手項个軟冰無拿好跌到地泥項，眼扁扁仔目汁強強（險險）會流下來。","example":""},{"word":"眼鬥鬥仔","pinyin":"ngienˋ deu deu eˋ【ngianˋ deu deu eˊ】","def":"瞪眼注視的樣子，有想打架的眼神。 例如：佢生來異（盡）惡相，見看人就眼鬥鬥仔，毋過佢人盡好。","example":""},{"word":"眼晶晶仔","pinyin":"ngienˋ jinˊ jinˊ eˋ【ngianˋ jinˊ jinˊ eˊ】","def":"眼睛亮晶晶的，形容凝神專注，眼神注視、目不轉睛的樣子。 例如：看佢眼晶晶仔聽人講話，看起來當（盡）精个樣仔。","example":""},{"word":"眼視視仔","pinyin":"ngienˋ sii sii eˋ【ngianˋ sii sii eˊ】","def":"兩眼直視的樣子。 例如：佢眼視視仔緊看，毋知變麼个鬼。","example":""},{"word":"眼垂垂仔","pinyin":"ngienˋ seˇ seˇ eˋ【ngianˋ seˇ seˇ eˊ】","def":"眼簾低垂，無神的樣子。 例如：這兩三日趕報告全無睡，眼垂垂仔，擘目就毋開。","example":""},{"word":"人山人海（人千人萬）","pinyin":"nginˇ sanˊ nginˇ hoiˋ (nginˇ qienˊ nginˇ van)","def":"人山人海，形容有非常多的人聚集在一起的樣子。 例如：頭擺廟坪做收冬戲，戲棚下輒常人山人海，想愛尋一隻（個）較（過）鬆容个位仔都無。","example":""},{"word":"弱弱","pinyin":"ngiog ngiog","def":"身體孱弱。 例如：阿伯正出院，身體還弱弱，毋好去做粗事。","example":""},{"word":"軟濟濟仔","pinyin":"ngionˊ jiˇ jiˇ eˋ【ngionˊ ji ji eˊ】","def":"形容軟軟的，多形容物品柔軟，例如抱枕布偶等。 例如：該張膨凳軟濟濟仔，坐起來當（盡）鬆爽。","example":""},{"word":"軟入入仔（軟習習仔）","pinyin":"ngionˊ ngib ngib eˋ (ngionˊ xibˋ xibˋ eˇ)【ngionˊ ngib ngib eˊ】","def":"物品軟綿綿的。 例如：粢粑仔打來軟入入仔，當（蓋）好食。","example":""},{"word":"軟聲軟斗","pinyin":"ngionˊ sangˊ ngionˊ deuˋ","def":"形容人說話輕聲細語，語帶溫柔。 例如：該隻（該）細妹仔講話軟聲軟斗，罵人都毋會大聲。","example":""},{"word":"戇面","pinyin":"ngong mien","def":"長相傻傻的樣子，亦可說「戇面戇面」。 例如：人不可貌相，看佢戇面戇面，麼人知佢係一間大公司个董事長。","example":""},{"word":"嫩相","pinyin":"nun xiong","def":"看起來比實際年齡年輕。 例如：佢生來當（盡）嫩相，其實佢四十零歲吔。","example":""},{"word":"惡豺豺仔","pinyin":"ogˋ saiˇ saiˇ eˋ【ogˋ saiˇ saiˇ eˊ】","def":"形容很凶惡的樣子。 例如：這狗仔惡豺豺仔，大家都驚分佢咬著。","example":""},{"word":"白直【戇直】","pinyin":"pag ciid【ngong ciid】","def":"言語、個性率直老實。 例如：佢當（蓋）白直（戇直），想著麼个就講麼个。","example":""},{"word":"白罕白罕","pinyin":"pag hanˋ pag hanˋ","def":"淡淡的白色。 例如：鰻仔个肚底白罕白罕，黃鱔个肚底黃黃，無共樣。","example":""},{"word":"白淨（白淨白淨）","pinyin":"pag qiang (pag qiang pag qiang)","def":"形容皮膚潔白乾淨，指直接全面性的白。 例如：阿嫂生來當（蓋）白淨，異（盡）得人惜。","example":""},{"word":"白雪雪仔","pinyin":"pag xiedˋ xiedˋ eˇ【pag xiedˋ xiedˋ eˊ】","def":"形容像雪般乾淨潔白的樣子。例如「天頂个雲白雪雪仔」、「油桐花白雪雪仔」。","example":""},{"word":"排場","pinyin":"paiˇ congˇ","def":"鋪張，場面熱鬧。 例如：阿哥結婚時辦到（辦啊）當（盡）排場。","example":""},{"word":"胖大","pinyin":"pang tai","def":"肥肥胖胖的樣子，專指小孩。 例如：該隻（該）嬰兒仔生到當（蓋）胖大，異（盡）得人惜。","example":""},{"word":"鼻流流仔","pinyin":"pi liuˇ liuˇ eˋ/pi lauˇ lauˇ eˋ【pi liuˇ liuˇ eˊ】","def":"鼻涕流不停的樣子，用來形容人。 例如：從細看佢就鼻流流仔，大吔變恁靚。","example":""},{"word":"肥肥","pinyin":"piˇ piˇ","def":"形容人外型肥胖的樣子；肉很肥。 例如：厥面肥肥圓圓，盡得人惜。 例如：老人家當（蓋）好食肥肥个爌肉（封肉）。","example":""},{"word":"肥卒卒仔","pinyin":"piˇ zudˋ zudˋ eˇ【piˇ zudˋ zudˋ eˊ/piˇ zud zud eˊ】","def":"形容人或動物肥胖的樣子；肉類太肥膩。 例如：細人仔隻隻（每一個）畜到肥卒卒仔。 例如：這盤豬肉肥卒卒仔，細人仔毋敢食。","example":""},{"word":"平高平大","pinyin":"piangˇ goˊ piangˇ tai","def":"一樣高大。 例如：該兩兄弟生來平高平大。","example":""},{"word":"平平","pinyin":"piangˇ piangˇ","def":"一樣，引申為一視同仁的意思。 例如：平平係你降个，仰差到恁多？","example":""},{"word":"平平共樣","pinyin":"piangˇ piangˇ kiung iong","def":"兩者一樣。 例如：平平共樣都係共爺哀降个，兩兄弟性體爭恁多。","example":""},{"word":"平洋洋仔","pinyin":"piangˇ iongˇ iongˇ eˋ【piangˇ iongˇ iongˇ eˊ】","def":"寬闊平坦的樣子。 例如：對嘉義到臺南一帶，係一大片平洋洋仔个農田。","example":""},{"word":"薄薄仔","pinyin":"pog pog eˋ【pog pog eˊ】","def":"薄薄的。 例如：外背有一息仔涼涼，愛著加一領薄薄仔个衫。 例如：豬肉切薄薄仔，熝一下仔就做得食。","example":""},{"word":"噴香","pinyin":"pun hiongˊ【pung hiongˊ】","def":"香噴噴，形容香氣四溢且濃郁。 例如：逐（每一）樣菜都煮到噴香，當（盡）餳人食。","example":""},{"word":"蓬白","pinyin":"pung pag","def":"形容很大面積的白色連成一片，非常白的樣子。 例如：油桐花開，滿山排一片蓬白。","example":""},{"word":"萋萋","pinyin":"qiˊ qiˊ","def":"新鮮，常指尚未料理的食材，如魚、肉等。 例如：買著萋萋个魚仔，就愛遽啊趕萋料理，正毋會過澇。","example":""},{"word":"萋頭","pinyin":"qiˊ teuˇ","def":"光鮮亮麗的樣子。 例如：阿坤仔今晡日討心臼，著到當（盡）萋頭。","example":""},{"word":"青溜溜仔（青油油仔）","pinyin":"qiangˊ liuˋ liuˋ eˇ (qiangˊ iuˇ iuˇ eˋ)【qiangˊ liuˋ liuˋ eˊ】【qiangˊ iuˇ iuˇ eˊ】","def":"形容植物翠綠到發亮的樣子。 例如：看著路脣个禾仔青溜溜仔，心肝活活開。","example":""},{"word":"千難萬難","pinyin":"qienˊ nanˇ van nanˇ","def":"形容十分困難或非常不容易。 例如：斷一個朋友一下半下，交一個朋友千難萬難。","example":""},{"word":"豺牯（豺嫲）","pinyin":"saiˇ guˋ (saiˇ maˇ)","def":"像豺狼一般貪吃的人。 例如：食吂（毋曾食）得个柑仔就摘來食，豺牯正得。","example":""},{"word":"三長兩短","pinyin":"samˊ congˇ liongˋ donˋ","def":"三長兩短，發生不幸的事。 例如：同人渡細人仔愛異（盡）細義，毋堵好有麼个三長兩短，該就慘哩（吔）。","example":""},{"word":"省死省命","pinyin":"sangˋ xiˋ sangˋ miang","def":"形容極為節儉。 例如：兩公婆省死省命繳倈仔讀書，倈仔走到外國嗄毋轉（歸）吔。","example":""},{"word":"省儉","pinyin":"sangˋ kiam","def":"省儉、節儉。 例如：客家人當（盡）省儉，不時聽人講：「有薑莫刨皮，愛想無薑時。」（諺）","example":""},{"word":"生疏","pinyin":"sangˊ soˊ","def":"陌生、不熟悉的。 例如：這事，係久無做，就會生疏。","example":""},{"word":"塞塞","pinyin":"sedˋ sedˋ","def":"形容阻塞不通；形容草木叢生。 例如：鼻塞塞。 例如：這條山路久無人行，歸路仔菅草生到（生啊）塞塞。","example":""},{"word":"生活","pinyin":"senˊ fad","def":"靈活。 例如：厥手當（盡）生活，攣衫、釘車項項都會。","example":""},{"word":"燒燒","pinyin":"seuˊ seuˊ","def":"形容熱或燙。 例如：寒天煮一鑊燒燒个薑嫲湯，盡有銷。 例如：同爺哀共下歇，老人家燒燒冷冷較（過）顧得著。","example":""},{"word":"燒話","pinyin":"seuˊ fa","def":"傳播有關他人是非長短的不實言談，且會無中生有。 例如：做人莫燒話，是非自然無。","example":""},{"word":"溼溚溚仔","pinyin":"siibˋ dab dab eˋ【siibˋ dab dab eˊ】","def":"溼答答。 例如：正落過雨，一哪仔都溼溚溚仔。","example":""},{"word":"所爭","pinyin":"soˋ zangˊ","def":"有所差異。 例如：你這恁久瘦盡多，到底哪位（哪息）有所爭？","example":""},{"word":"所爭一息","pinyin":"soˋ zangˊ idˋ xid【soˋ zangˊ idˋ xidˋ】","def":"相差一點點，亦可說「爭一息、差一息、爭差一息、爭差無多、爭差無遠、爭差毋遠」。 例如：參加職業考試異（盡）競爭，分數所爭一息，就無錄取哩（吔）。","example":""},{"word":"算毋和","pinyin":"son mˇ foˇ","def":"不划算。 例如：你愛用六百萬買佢這間屋，算毋和啦！省起來較（過）贏。","example":""},{"word":"傷重","pinyin":"songˊ dong","def":"嚴重。 例如：聽講厥婆寒著（凍著）當（盡）傷重，敢係（怕係）肺炎正得。 例如：屋下完（聚概）十儕（個人），食米異（盡）傷重，礱一百斤穀無十日米缸就斷粒米。","example":""},{"word":"手長腳長","pinyin":"suˋ congˇ giogˋ congˇ","def":"指人的手腳比較長。 例如：厥妹仔手長腳長，看著人又笑頭笑面，盡得人惜。","example":""},{"word":"純良","pinyin":"sunˇ liongˇ","def":"單純而善良。 例如：天性純良个人，較（過）有同情心。","example":""},{"word":"純正","pinyin":"sunˇ ziin","def":"純正。 例如：佢賣个蜂糖盡純正，無摻半息砂糖。","example":""},{"word":"大嫲嫲仔","pinyin":"tai maˇ maˇ eˋ【tai maˇ maˇ eˊ】","def":"個體大的樣子；勢利、不理人的樣子。 例如：厥字寫到大嫲嫲仔。 例如：細人仔畜到大嫲嫲仔。 例如：樣相看起來大嫲嫲仔。","example":""},{"word":"大仙【大槳】","pinyin":"tai xienˊ【tai jiongˋ】","def":"形容個子大。 例如：厥該班个學生仔通體（總概）都當大仙（蓋大槳）。","example":""},{"word":"透風落雨","pinyin":"teu fungˊ log iˋ","def":"冒著風雨去做某件事，風雨無阻，亦可說「透風透雨」。 例如：不管風雨幾大，佢透風落雨走忒（走核）全程。","example":""},{"word":"頭擂擂仔","pinyin":"teuˇ luiˇ luiˇ eˋ【teuˇ luiˇ luiˇ eˊ】","def":"形容做事專注，極為努力的樣子。 例如：掌店个人頭擂擂仔搞手機，連人客入門都毋知。","example":""},{"word":"頭沉沉仔","pinyin":"teuˇ ciim ciim eˋ【teuˇ ciim ciim eˊ】","def":"埋頭苦幹的樣子。 例如：佢逐（每）日頭沉沉仔煞猛做事，做到兩頭烏。","example":""},{"word":"悿【𤸁】","pinyin":"tiamˋ【kioi】","def":"非常疲累，引申為「嚴重」的用法。「一擺打到（打啊）悿悿（𤸁𤸁）」指一次打嚴重些，通常有嚇阻作用避免再犯。 例如：今晡日做當（蓋）多事，還悿（𤸁）哦！","example":""},{"word":"甜粄色","pinyin":"tiamˇ banˋ sedˋ","def":"淡褐色，原指客家年糕使用黃砂糖調味後，成品呈現的顏色。 例如：熱天个海脣沙灘項，看得著異（盡）多歸身仔晒到（晒啊）甜粄色个男男女女。","example":""},{"word":"天背恁遠","pinyin":"tienˊ boi anˋ ienˋ【tienˊ boi anˋ ianˋ】","def":"形容距離非常遙遠，但是目的地不必明確。 例如：佢搬到天背恁遠，轉一輪（擺）故鄉斯無恁該（無恁簡單）哦。","example":""},{"word":"天曚曚","pinyin":"tienˊ mungˇ mungˇ","def":"天色灰暗。 例如：外背天曚曚，你騎車仔愛較（過）細義兜仔。","example":""},{"word":"妥當","pinyin":"toˇ dong","def":"事情妥貼穩當。 例如：做麼个事情都愛想頭想尾，觀前顧後正妥當。","example":""},{"word":"鈍鈍","pinyin":"tun tun","def":"不鋒利，常用於刀類，引申形容人的思索能力不靈光。 例如：這支刀嫲鈍鈍，剁樵毋斷，有罅壞使。","example":""},{"word":"滑溜溜仔","pinyin":"vad tiu tiu eˋ【vad liuˋ liuˋ eˊ/vad diu diu eˊ】","def":"形容東西滑溜溜貌；形容地面非常溼滑。 例如：湖鰍仔滑溜溜仔，盡難捉得核。 例如：大雨落啊過，泥路滑溜溜仔，行路愛細義。","example":""},{"word":"萬戶","pinyin":"van fu","def":"形容很富有。 例如：佢出世在萬戶家庭，日日食魚食肉，朝朝睡到日頭晒屎胐。","example":""},{"word":"彎彎斡斡","pinyin":"vanˊ vanˊ vadˋ vadˋ","def":"道路或河流彎曲。 例如：這條路彎彎斡斡，毋知透到哪去？","example":""},{"word":"橫","pinyin":"vangˇ","def":"蠻橫。 例如：做人毋好忒橫，係見人全閃你像驚鬼樣仔，該就見笑吔哪。","example":""},{"word":"橫橫擎【拗蠻】","pinyin":"vangˇ vangˇ kiaˇ【auˊ manˇ】","def":"十分、相當蠻橫不講理。 例如：參詳事情愛講道理，係橫橫擎（拗蠻），定著毋會有結果。","example":""},{"word":"黃橙黃橙","pinyin":"vongˇ cangˇ vongˇ cangˇ","def":"黃澄澄的。 例如：樹頂个酸柑熟哩（吔），歸樹仔黃橙黃橙籃籃吊吊。","example":""},{"word":"烏金","pinyin":"vuˊ gimˊ","def":"形容黑得發亮。 例如：頭那毛係烏金，留長留短都好看。","example":""},{"word":"烏麻攢濟【密麻濟炸】","pinyin":"vuˊ maˇ zanˋ zaiˋ【med maˇ ji jia】","def":"比喻人山人海，萬頭攢動。 例如：有名个夜市生理當（盡）好，一哪仔都烏麻攢濟（密麻濟炸）。","example":""},{"word":"烏金金仔","pinyin":"vuˊ gimˊ gimˊ eˋ【vuˊ gimˊ gimˊ eˊ】","def":"黑黝黝的。 例如：歸隻（歸）暑假都走到海脣沙埔項搞，當然晒到歸身烏金金仔。","example":""},{"word":"烏烙","pinyin":"vuˊ logˋ","def":"暗沉。 例如：厥面烏烙烏烙，看起來乜無麼个精神，怕係有病。","example":""},{"word":"穩死","pinyin":"vunˋ xiˋ","def":"死定了。 例如：天光日愛考英文，到今吂（還無）準備好，考試𠊎穩死哩（吔）。","example":""},{"word":"穩穩","pinyin":"vunˋ vunˋ","def":"篤定，有十足把握。 例如：有兜事情實在難講穩穩有把扼，成半下仔會有意外啊！","example":""},{"word":"溫燒","pinyin":"vunˊ seuˊ","def":"溫溫的。 例如：當晝个飯包仔放在電鑊肚，到今還溫燒溫燒。","example":""},{"word":"死無變","pinyin":"xiˋ moˇ bien","def":"永遠都不知要改變，例如壞習慣或壞脾氣。 例如：阿宏仔這死無變个，後生到今都恁懶尸，毋會長進。","example":""},{"word":"息把仔","pinyin":"xid baˋ eˇ【xidˋ baˋ eˊ】","def":"一點兒，稍微。例如「息把仔痛」、「息把仔悿（𤸁）」。","example":""},{"word":"鮮","pinyin":"xienˊ","def":"清澈，用來形容液體之狀態；亦可用來形容半液體之狀態，指濃度較低、較稀。 例如：水恁鮮、水鏡鮮。 例如：朝晨食朝个粥較（過）鮮，傍醬菜異（盡）堵好食。","example":""},{"word":"新衝衝仔","pinyin":"xinˊ cung cung eˋ【xinˊ cung cung eˊ】","def":"非常新的樣子。 例如：阿明著个西裝新衝衝仔。","example":""},{"word":"砸磳","pinyin":"zabˋ zen","def":"強壯結實。 例如：吾公八十六吔！身體還盡砸磳。","example":""},{"word":"湛","pinyin":"zam","def":"美好、很好、優秀。 例如：頭家喊阿敏姊做个事，佢樣樣都做到（做啊）當（蓋）湛。","example":""},{"word":"正板","pinyin":"zang banˋ","def":"道地的、標準的，常用來指專門技術或能力。 例如：厥客話係同厥婆學个，講到當（盡）正板。","example":""},{"word":"正好","pinyin":"zang hoˋ【nang hoˋ】","def":"才可以，才甘心；剛剛完成。 例如：搣歸日還搣毋得好，愛仰結煞正好？ 例如：湯正好定定，等較（過）冷兜仔正舀來食。","example":""},{"word":"走無路去","pinyin":"zeuˋ moˇ lu hi","def":"走投無路。 例如：佢分人逼到走無路去，高不將正會去做這項頭路。","example":""},{"word":"真真","pinyin":"ziinˊ ziinˊ","def":"清清楚楚。 例如：就係該隻偷東西个賊仔，𠊎看真真，絕對毋會認毋著。","example":""},{"word":"嘴扁扁","pinyin":"zoi bienˋ bienˋ","def":"形容抿著嘴要哭的樣子。 例如：佢事情做差分人罵，含等目汁嘴扁扁。","example":""},{"word":"嘴嘟鼻翹","pinyin":"zoi du pi kieu","def":"嘟嘴歪鼻，不高興的樣子。 例如：這細人仔動啊著就嘴嘟鼻翹，盡毋得人惜。","example":""},{"word":"拄固","pinyin":"zuˋ gu","def":"物品堅固穩當，可用於屋、家具等人為之物件。 例如：這屋仔起到（起啊）當（蓋）拄固，上擺个大地動乜全無影響著。","example":""},{"word":"豬肝色","pinyin":"zuˊ gonˊ sedˋ","def":"褐色。 例如：吾公戴一頂豬肝色个帽仔去街路。","example":""},{"word":"豬嫲肥豬子旺","pinyin":"zuˊ maˇ piˇ zuˊ ziiˋ vong","def":"母肥子壯。 例如：人講豬嫲肥豬子旺，家底好个人較（過）有錢繳子弟讀書。","example":""},{"word":"腫腫","pinyin":"zungˋ zungˋ","def":"腫脹貌。 例如：阿賁伯這擺發病仔（發病）過後，腳嗄變到（變啊）腫腫。","example":""},{"word":"舂上舂下","pinyin":"zungˊ songˊ zungˊ haˊ","def":"形容為了緊急的事情，到處奔波。 例如：大家人為著厥事情舂上舂下，佢嗄在該山歌溜天。","example":""},{"word":"老鋸鋸仔","pinyin":"loˋ gi gi eˋ【loˋ gi gi eˊ】","def":"很老的樣子，常用來形容蔬菜。 例如：阿婆（阿嬤）當（蓋）做家，老鋸鋸仔个芹菜也擇起來食。","example":""},{"word":"古古怪怪","pinyin":"guˋ guˋ guai guai","def":"不同尋常，常做出意想不到的事情。 例如：性體無穩定个人，長下會做出古古怪怪个事情來。","example":""},{"word":"入軟","pinyin":"ngib ngionˊ","def":"非常軟。 例如：佢請人客食點心个粢粑仔用舂臼舂到（舂啊）入軟。","example":""},{"word":"額結結仔（面結結仔）","pinyin":"ngiagˋ giedˋ giedˋ eˇ (mien giedˋ giedˋ eˋ)【ngiagˋ giadˋ giadˋ eˊ】【mien giadˋ giadˋ eˊ】","def":"愁眉不展貌。 例如：佢想著身項還背等个債務，逐（每）日就額結結仔，笑（㖸）毋出來。","example":""},{"word":"高溜高溜仔","pinyin":"goˊ liuˊ goˊ liuˊ eˋ【goˊ liuˊ goˊ liuˊ eˊ】","def":"高高瘦瘦的。 例如：阿明哥个倈仔生來高溜高溜仔，看起來異（盡）斯文。","example":""},{"word":"磬磬鏘鏘","pinyin":"kin kin kiang kiang","def":"形容金屬撞擊發出的聲音。 例如：隔壁間个打鐵師傅，打鐵打到磬磬鏘鏘還吵人。","example":""},{"word":"磬磬硜硜","pinyin":"kin kin kong kong","def":"形容物體彼此撞擊發出的清脆響聲。 例如：該臺貨車空車在石粒路行，歸路仔磬磬硜硜。","example":""},{"word":"查核","pinyin":"caˇ hedˋ","def":"檢查審核。 例如：加幾日仔上頭會來查核，若資料準備好勢吂（吔無）？","example":""},{"word":"處分","pinyin":"cuˋ funˊ","def":"處分、處理。 例如：阿公講趕佢頭腦還清楚，身下个財產先處分較（過）贏。","example":""},{"word":"調兵","pinyin":"diau binˊ","def":"調動軍隊；徵召入伍。 例如：災難過後，政府輒輒會調兵來同災民𢯭手。 例如：你係還在該（還在）讀書，收著調兵个通知單斯愛去辦延期徵召。","example":""},{"word":"火藥","pinyin":"foˋ iog","def":"火藥。 例如：餳著眾人个澎湖煙花，單淨火藥就毋知愛用忒（用核）幾多。","example":""},{"word":"交官結府","pinyin":"gauˊ gonˊ giedˋ fuˋ【gauˊ gonˊ giadˋ fuˋ】","def":"官民勾結。 例如：恁仔交官結府个事情你也敢做，毋驚坐囹仔（坐監）係無？","example":""},{"word":"關囹仔【坐監（坐鹿櫥）】","pinyin":"guanˊ longˊ eˋ【coˊ gamˊ (coˊ lug cuˇ)】","def":"監禁、坐牢。 例如：阿婆講頭擺个婦人家做月像關囹仔（坐監）樣仔，哪有像這下人恁自由。","example":""},{"word":"退伍","pinyin":"tui ngˋ","def":"退伍。 例如：阿哥退伍過後，正去考研究所。","example":""},{"word":"縣長","pinyin":"ien zongˋ【ian zongˋ】","def":"縣長。 例如：現下異（盡）多縣長都當（蓋）後生。","example":""},{"word":"啞狗","pinyin":"aˋ gieuˋ","def":"啞巴，常用於貶義；稱該說話而不說的人。 例如：你係全毋同人相借問，會分人講係啞狗。","example":""},{"word":"阿姨仔","pinyin":"aˊ iˇ eˋ","def":"小姨子，指妻子的妹妹。 例如：天光日係吾阿姨仔轉外家（轉門）个日仔。","example":""},{"word":"恁久無看著","pinyin":"anˋ giuˋ moˇ kon doˋ","def":"好久不見，問候語。 例如：恁久無看著，你高加異（盡）多哦！","example":""},{"word":"恁久好無","pinyin":"anˋ giuˋ hoˋ moˇ","def":"近來好嗎，問候語。 例如：這駁仔全無若消息，恁久好無？","example":""},{"word":"恁毋係款","pinyin":"anˋ mˇ he kuanˋ","def":"這麼不像話！ 例如：仰會恁毋係款，敢在街項駛車仔駛恁遽！","example":""},{"word":"恁毋像人","pinyin":"anˋ mˇ qiong nginˇ","def":"這麼不像樣！ 例如：恁毋像人！自家个爺哀也敢罵！","example":""},{"word":"恁會摸【恁會趖】","pinyin":"anˋ voi miaˊ【anˋ voi soˇ】","def":"如此拖延時間。 例如：恁會摸（恁會趖），毋驚赴毋著係無？","example":""},{"word":"恁早萋","pinyin":"anˋ zoˋ qiˊ","def":"早安，問候語。 例如：阿明恁早萋，你今晡日愛去哪位（哪跡位）尞？","example":""},{"word":"詏","pinyin":"au","def":"強為辯解、爭論 例如：佢從後生就恁好詏，一息仔事情就愛同人詏到贏。","example":""},{"word":"詏嘴【吵事】","pinyin":"au zoi【cauˇ sii】","def":"爭論、爭辯。 例如：佢兩儕（個人）盡會詏嘴（吵事），講無兩句話就冤家。","example":""},{"word":"八隻手","pinyin":"badˋ zagˋ suˋ","def":"喻此人做事很有能力、很能幹，帶有貶義。 例如：你無麼个八隻手，毋會比人較（過）會啦！","example":""},{"word":"百籃肚","pinyin":"bagˋ lamˊ duˋ【bagˋ lamˇ duˋ (bagˋ namˇ duˋ)】","def":"好胃口，什麼都吃，喻食量大。 例如：老弟像係百籃肚，毋會揀食，故所食到（食啊）肥固固仔。","example":""},{"word":"挷工","pinyin":"bangˊ gungˊ","def":"騰出時間來，也可說「挷工挷工仔」。 例如：𠊎今晡日本底（本旦）當（蓋）無閒，講著分你請，𠊎斯挷工過來。","example":""},{"word":"輩分","pinyin":"bi fun【pi fun】","def":"輩分。 例如：吾輩分毋罅，還係莫去坐主桌正著！","example":""},{"word":"拚命（拚死拚命）","pinyin":"biang miang (biang xiˋ biang miang)【bia miang】【bia xiˋ bia miang】","def":"豁出性命，不顧一切。 例如：為著屋下大細个食著，佢拚命賺錢。","example":""},{"word":"變鬼變怪【變古變怪】","pinyin":"bien guiˋ bien guai【bien guˋ bien guai】","def":"變花樣、耍手段。 例如：大人無在屋下，細人仔就變鬼變怪（變古變怪），搞到貶轉來。","example":""},{"word":"編","pinyin":"bienˊ","def":"掰、亂講話。 例如：你莫恁會編，無影無跡講到有手有腳。","example":""},{"word":"發脹","pinyin":"bodˋ zong","def":"原指一種肚子發脹的病，嚴重會致死；後引申為罵人很無聊、糟糕，具貶義。 例如：恁發脹！這兜難聽个話也講得出來。","example":""},{"word":"博人惱","pinyin":"bogˋ nginˇ nauˊ","def":"惹人厭。 例如：你逐擺都係講話無算數，難怪會博人惱！","example":""},{"word":"分家","pinyin":"bunˊ gaˊ","def":"兄弟分產各自經營、獨立生活。 例如：𠊎結婚過後，吾爸就分𠊎兜（𠊎等）兄弟分家，各人去打拚。","example":""},{"word":"分人招","pinyin":"bunˊ nginˇ zeuˊ","def":"被人招贅，指男人入贅女家。 例如：今這下細倈仔當（蓋）少分人招吔。","example":""},{"word":"插事牯【葉煠猴（葉煠牯）】","pinyin":"cabˋ sii guˋ【iab sab heuˇ (iab sab guˋ)】","def":"愛管閒事的男子；愛管閒事的女子則稱為「插事嫲（葉煠嫲）」。 例如：你食飽忒閒係無？做麼个去做插事牯（葉煠猴）呢？","example":""},{"word":"掣等走","pinyin":"cadˋ denˋ zeuˋ","def":"負氣而走。 例如：大家尞等好好，講兩句仔佢毋中意聽个話，佢就掣等走。","example":""},{"word":"參詳","pinyin":"camˊ xiongˇ","def":"商討。 例如：這個問題，等你同屋下人參詳過後正來決定。","example":""},{"word":"吵耳吵鼻","pinyin":"cauˇ ngiˋ cauˇ pi","def":"聒噪不休。 例如：頭擺个細人仔，有耳無嘴；這下个細人仔，吵耳吵鼻。","example":""},{"word":"襯鬧熱","pinyin":"cen nau ngied【cen nau ngiad】","def":"湊熱鬧。 例如：今晡日係阿國做生日啦！𠊎係來襯鬧熱定定。","example":""},{"word":"自重","pinyin":"cii cung","def":"認清自己的身分或處境，自我約束、節制。 例如：做人愛知好自重，正會得著別人个尊重。","example":""},{"word":"治理","pinyin":"cii liˊ","def":"關心管理。 例如：縣長治理百姓个事務係盡無閒个。","example":""},{"word":"飼料雞","pinyin":"ciiˇ liau gieˊ","def":"以飼料飼養的雞，現常用以喻養尊處優不耐操勞的人或諷刺體弱的人。 例如：正擎（背）一包米定定（定），就緊敨大氣，飼料雞樣仔。","example":""},{"word":"姪婿","pinyin":"ciid se","def":"姪女婿。 例如：吾姪女同姪婿都係小學个教書先生。","example":""},{"word":"姪嫂","pinyin":"ciid soˋ","def":"姪媳婦。 例如：吾姪嫂係在公所上班个公務人員。","example":""},{"word":"稱功討勞（討功討勞）","pinyin":"ciinˊ gungˊ toˋ loˇ (toˋ gungˊ toˋ loˇ)","def":"向人誇耀自己的功勞。 例如：有半毫利就相爭比背，行著三步路就稱功討勞。","example":""},{"word":"座大","pinyin":"co tai","def":"排行老大。 例如：在屋下𠊎座大，下背還有三個老妹。","example":""},{"word":"坐到屎胐生根","pinyin":"coˊ do sii vudˋ sangˊ ginˊ【coˊ do sii fudˋ sangˊ ginˊ】","def":"坐到屁股都長出根來了，比喻久坐。 例如：隔壁鄰舍來屋下坐尞，坐到屎胐生根還毋轉（歸），自家个事情全做毋得。","example":""},{"word":"信用","pinyin":"xin iung","def":"信任。 例如：佢做事情當（蓋）負責，難怪頭家當（盡）信用佢。","example":""},{"word":"才人無貌","pinyin":"coiˇ nginˇ moˇ mau","def":"有才華的人不一定有好的外表，喻人不可貌相。 例如：才人無貌，爛扇多風。（諺）","example":""},{"word":"賺罵","pinyin":"con ma","def":"招來責罵。 例如：落雨天，搞到衫褲溼溼（溚溼），賺罵係無？","example":""},{"word":"傳話","pinyin":"conˇ fa","def":"傳遞消息。 例如：麼人亂傳話？外背人講到當難聽（講啊盡壞聽）你知無？","example":""},{"word":"出社會","pinyin":"cudˋ sa/saˊ fi","def":"出社會；見世面。 例如：出社會過後，正較（過）體會著爺哀對子女个愛心。","example":""},{"word":"打幫","pinyin":"daˋ bongˊ","def":"沾光、助益，「無好打幫」即指得不到助益。 例如：厥哥做水果个大賣生理，厥屋下食水果多多少少有好打幫。","example":""},{"word":"打點","pinyin":"daˋ diamˋ","def":"標記，被記黑名單。 例如：佢分人打點吔，想愛升經理怕異（盡）難。","example":""},{"word":"打禁指","pinyin":"daˋ gim ziiˋ","def":"訂購戒指。 例如：阿財伯姆厥孫仔這禮拜滿月，佢按算打禁指分佢。","example":""},{"word":"打合","pinyin":"daˋ hab","def":"商量、洽商。 例如：去同二伯打合看啊，看哪久打秧較（過）堵好。","example":""},{"word":"打逆面","pinyin":"daˋ ngiag mien","def":"鬧翻，因起衝突而不相往來。 例如：若性體愛改，毋好動啊著就同人打逆面。","example":""},{"word":"打眼拐（使眼拐）","pinyin":"daˋ ngienˋ guaiˋ (siiˋ ngienˋ guaiˋ)【daˋ ngianˋ guaiˋ】【siiˋ ngianˋ guaiˋ】","def":"拋媚眼。 例如：戲棚頂个阿旦，緊同棚下看戲个人打眼拐。","example":""},{"word":"打蛇跈棍上","pinyin":"daˋ saˇ tenˇ gun songˊ","def":"用棍子打毒蛇，一次沒打死，蛇卻隨著棍子爬上來，反而把人咬死了。喻做事必須堅決澈底，不可拖泥帶水，否則貽害無窮。 例如：中酒毒个人想戒酒就愛煞煞，毋好戒著一兩日仔又偷食一口，人講打蛇跈棍上，戒一生人乜戒毋成。","example":""},{"word":"搭信","pinyin":"dabˋ xin","def":"托人帶口信，傳話。也寫做「搭訊」。 例如：有人講，搭信會加話，故所盡好（最好）係自家聯絡。","example":""},{"word":"單丁子","pinyin":"danˊ denˊ ziiˋ","def":"獨子，唯一的兒子。 例如：阿明係單丁子，從細就得人惜到命樣仔。","example":""},{"word":"䟓䟓（䟓工）","pinyin":"dangˊ dangˊ (dangˊ gungˊ)","def":"專程。 例如：滿子正入學還毋慣，𠊎䟓䟓去學校看一下。","example":""},{"word":"等靚","pinyin":"denˋ jiangˊ","def":"想得美。（嘲笑語） 例如：自家有閒毋做，還想愛𠊎同你做便便，等靚哪！","example":""},{"word":"戥真【會算】","pinyin":"denˋ ziinˊ【voi son】","def":"過分認真而斤斤計較。 例如：做人毋好忒戥真（會算），會交無朋友。","example":""},{"word":"鬥當","pinyin":"deu dong","def":"勉強要求別人接受。 例如：有價毋賣，到落價該下正來鬥當人。","example":""},{"word":"鬥鬧熱","pinyin":"deu nau ngied【deu nau ngiad】","def":"湊熱鬧。 例如：限勢灶下就恁細，你兩姊妹還入來鬥鬧熱做麼个。","example":""},{"word":"鬥桌","pinyin":"deu zogˋ","def":"人數湊成一桌。 例如：𠊎這兜（𠊎等）人較（過）少，做得同你這兜（你等）鬥桌無？","example":""},{"word":"鬥陣","pinyin":"deu ciin","def":"湊成一夥。 例如：阿原哥討心臼，大家鬥陣來去分佢請。","example":""},{"word":"鬥氣【博氣】","pinyin":"deu hi【bogˋ hi】","def":"賭氣、嘔氣。 例如：兩公婆鬥氣（博氣），共下睡就無講話。","example":""},{"word":"知人我","pinyin":"diˊ nginˇ ngoˊ","def":"懂事，指懂得人我分際關係。 例如：阿明從細就盡知人我，故所阿婆當（蓋）惜佢。","example":""},{"word":"知死","pinyin":"diˊ xiˋ","def":"後悔；明白自己將面臨的後果，通常是負面的結果，知道糟糕了。 例如：愛阿華認真讀書，佢聽毋入耳，等佢尋頭路該下正知死。 例如：這下同你講你毋聽，等𠊎洗好身腳你就知死哩（吔）！ 例如：豬知走毋知死，牛知死毋知走。（諺）","example":""},{"word":"展手路","pinyin":"dienˋ suˋ lu","def":"展現本事、大顯身手。 例如：你兜（你等）禮拜日來吾屋下，等𠊎展手路請你兜（你等）食好料仔。","example":""},{"word":"展寶","pinyin":"dienˋ boˋ","def":"把寶物拿來展示炫耀一番。 例如：阿松出國去尞轉來（歸來），輒輒將佢買个東西一哪仔去展寶。","example":""},{"word":"癲癲","pinyin":"dienˊ dienˊ","def":"形容人的行為偏離常軌。 例如：莫搞到（搞啊）癲癲，較（過）差毋多兜仔（一息）！","example":""},{"word":"癲牯","pinyin":"dienˊ guˋ","def":"指瘋男人；指女性則用「癲嫲」。 例如：你係緊逐該細妹仔毋肯放，驚怕會分人罵癲牯哦！","example":""},{"word":"頂分人","pinyin":"dinˋ bunˊ nginˇ【dangˋ bunˊ nginˇ】","def":"過繼、讓渡給人。 例如：厥該間店面頂分人開麵包店，自家搬到二樓去歇。","example":""},{"word":"頂香火（頂香煙）","pinyin":"dinˋ hiongˊ foˋ (dinˋ hiongˊ ienˊ)【dangˋ hiongˊ foˋ】【dangˋ hiongˊ ianˊ】","def":"承繼家族血脈。 例如：佢無降倈仔，厥哥个倈仔過房一個分佢頂香火。","example":""},{"word":"短命（短命子）","pinyin":"donˋ miang (donˋ miang ziiˋ)","def":"生命不長壽；詛咒人命不長。 例如：做壞事个人逐儕（每一個人）都惱，難怪會分人罵短命。","example":""},{"word":"當天咒誓","pinyin":"dongˊ tienˊ zu sii","def":"對天發誓。 例如：該個村長在大家面頭前當天咒誓，佢定著無拿回扣。","example":""},{"word":"堵來堵去","pinyin":"duˊ loiˇ duˊ hi","def":"將東西推來推去，不乾脆的樣子。 例如：一料豬肉定定，乜在該堵來堵去，壞看相。","example":""},{"word":"堵人","pinyin":"duˇ nginˇ","def":"用言語頂撞人。 例如：講你一句，就緊堵人，麼人愛同你交朋友？","example":""},{"word":"應話","pinyin":"en fa【in fa】","def":"回話、答話。 例如：佢做毋著事情，恬恬分人罵，全毋敢應話。","example":""},{"word":"應嘴","pinyin":"en zoi【in zoi】","def":"頂嘴。 例如：忒會應嘴个細人仔，毋得人惜。","example":""},{"word":"壞底","pinyin":"faiˋ daiˋ","def":"本性不好。 例如：該人盡壞底，愛佢變好，無恁該（無恁簡單）。","example":""},{"word":"壞東西","pinyin":"faiˋ dungˊ xiˊ","def":"壞東西、壞蛋。 例如：阿新仔正式係壞東西！一哪仔燒吾（𠊎个）壞話，係分𠊎堵著愛捉（扭）來推！","example":""},{"word":"壞種（壞種草）","pinyin":"faiˋ zungˋ (faiˋ zungˋ coˋ)","def":"不好的遺傳。 例如：好種毋傳，壞種毋斷。（諺）","example":""},{"word":"壞心","pinyin":"faiˋ ximˊ","def":"壞心，又作「壞心肝」。 例如：做人做毋得壞心，係無會有報應个。","example":""},{"word":"犯著","pinyin":"famˊ doˋ","def":"觸犯到、衝撞、侵擾、得罪。 例如：婦人家有身妊个時節，屋下个東西做毋得儘採動、儘採釘，驚怕會犯著胎神。","example":""},{"word":"番番","pinyin":"fanˊ fanˊ","def":"不按禮數、不守常規。 例如：佢番番个人，無拜阿公婆，乜無掛紙。","example":""},{"word":"赴食晝","pinyin":"fu siid zu","def":"趕赴吃中餐。 例如：這下正十點，赴食晝還早早仔哪！","example":""},{"word":"服侍","pinyin":"fug sii","def":"服侍。 例如：世細（下輩）服侍世大人（大人儕）係天公地道个事情。","example":""},{"word":"假精","pinyin":"gaˋ jinˊ","def":"自作聰明。 例如：你恁假精做个決定，後果斯愛你自家來承受（承擔）！","example":""},{"word":"假精假怪","pinyin":"gaˋ jinˊ gaˋ guai","def":"自作聰明弄出許多枝枝節節的花樣。 例如：這擺募款既經（已經）達到目標，佢又假精假怪一哪仔去請求贊助，搣到（搣啊）打壞名聲。","example":""},{"word":"假細義","pinyin":"gaˋ se ngi","def":"假客氣。 例如：愛食就食，毋使在該假細義。","example":""},{"word":"假會","pinyin":"gaˋ voi","def":"逞強，不自量力。 例如：麼人喊你恁假會，這下同洗衫機搣壞忒（壞核），你敢無愛負責？","example":""},{"word":"加減講","pinyin":"gaˊ gamˋ gongˋ","def":"講話沒有經過思考，隨便亂說。 例如：厥話哦？加減講个啦！你聽聽啊就好。","example":""},{"word":"外甥仔","pinyin":"ngoi senˊ eˋ","def":"外甥，姊妹的兒子。 例如：阿志同外甥仔感情異（盡）好，尞日就會湊等去打球仔。","example":""},{"word":"家家屋屋","pinyin":"gaˊ gaˊ vugˋ vugˋ","def":"家家戶戶。 例如：年三十暗晡，家家屋屋都在該食團圓飯。","example":""},{"word":"合人毋得","pinyin":"gabˋ nginˇ mˇ dedˋ","def":"無法與人共事；亦可說「攞人毋得」。 例如：若個性恁暮固合人毋得，難怪愛輒輒換頭路。","example":""},{"word":"敢就贏人","pinyin":"gamˋ qiu iangˇ nginˇ","def":"敢於行動就能搶得先機，常指行為莽撞。 例如：枵鬼搶飯坐大位，敢就贏人。","example":""},{"word":"監你做","pinyin":"gamˊ nˇ zo【gamˊ ngˇ zo】","def":"勉強你去做。 例如：佢早就知得你無閒，還愛監你做，實在當（盡）無意思。","example":""},{"word":"監人食","pinyin":"gamˊ nginˇ siid","def":"強迫人家吃。 例如：東西毋好買到恁多，係食毋去又愛監人食。","example":""},{"word":"徑杈","pinyin":"gang ca","def":"妨礙、阻礙。 例如：自行車毋好停在門口，會徑杈著大家出入。","example":""},{"word":"徑杈人","pinyin":"gang ca nginˇ","def":"阻礙到人家。 例如：東西毋好儘採放在巷路項，會徑杈人哦！","example":""},{"word":"狡怪","pinyin":"gauˋ guai","def":"搞怪、作怪；不合群、和人作對。 例如：隔壁个阿明頭，大家都講佢當（蓋）狡怪。 例如：阿良這人當（盡）狡怪，同麼人就合毋著。","example":""},{"word":"教精人","pinyin":"gauˊ jinˊ nginˇ","def":"讓人知所警惕；反義詞即「教毋會精」，教導過了仍不知醒悟，喻吃了虧仍學不乖。 例如：做毋著就準學經驗，做得教精人也係拗蠻好个。","example":""},{"word":"交際","pinyin":"gauˊ ji","def":"交際。 例如：做生理嘴碼愛好，愛曉得同人交際。","example":""},{"word":"交朋結友【交結朋友】","pinyin":"gauˊ penˇ giedˋ iuˊ【gauˊ giadˋ penˇ iuˊ】","def":"結交朋友。 例如：食頭路除忒（除核）賺錢以外，乜做得交朋結友（交結朋友）。","example":""},{"word":"唊唊滾","pinyin":"giab giab gunˋ","def":"說個不停、連續不斷。 例如：透日仔唊唊滾唊無停，聽著厥聲就驚。","example":""},{"word":"結公婆","pinyin":"giedˋ gungˊ poˇ【giadˋ gungˊ poˇ】","def":"結成夫妻。 例如：百年修來同船渡，千年修來結公婆。（山）","example":""},{"word":"結冤仇","pinyin":"giedˋ ienˊ suˇ【giadˋ ianˊ suˇ】","def":"結仇。 例如：做人做事愛同逐儕人（每一個人）和挼，毋好儘採同人結冤仇。","example":""},{"word":"結同年","pinyin":"giedˋ tungˇ ngienˇ【giadˋ tungˇ ngianˇ】","def":"結為同年兄弟。 例如：佢兩儕（個人）從細就係當（蓋）好个朋友，到大吔兩儕（個人）乜結同年。","example":""},{"word":"見人毋得","pinyin":"gien nginˇ mˇ dedˋ【gian nginˇ mˇ dedˋ】","def":"無臉見人，見不得人。 例如：好好个頭路毋做，走去做賊仔，實在見人毋得。","example":""},{"word":"勾結","pinyin":"gieuˊ giedˋ【gieuˊ giadˋ】","def":"引誘或串通做不正當的事。 例如：一隻（個）國家个經濟建設，盡驚官商勾結作弊。","example":""},{"word":"緊看緊靚","pinyin":"ginˋ kon ginˋ jiangˊ","def":"越看越美。 例如：這細妹仔大吔，緊看緊靚。","example":""},{"word":"腳士","pinyin":"giogˋ sii","def":"角色。 例如：你這毋成腳士，愛做麼个大頭路？","example":""},{"word":"挶屎","pinyin":"giug siiˋ","def":"喻態度傲慢不理人。 例如：對人愛較（過）親切兜仔，毋好忒挶屎。","example":""},{"word":"逐細妹仔","pinyin":"giugˋ se moi eˋ","def":"追求女孩子。 例如：你毋係當（蓋）會逐細妹仔喺？仰會到這滿還係羅漢腳呢？","example":""},{"word":"過家尞","pinyin":"go gaˊ liau","def":"到他人的家中閒聊，即串門子。 例如：佢退休過後無事好做，逐（每）日正過家尞定定。","example":""},{"word":"過門","pinyin":"go munˇ","def":"泛指女子因婚姻而進入另一方的家庭，成為其中一員。 例如：雖然講還吂（毋曾）過門，毋過阿美對佢將來个家官家娘盡有孝。","example":""},{"word":"孤盲絕代（孤盲絕）","pinyin":"goˊ moˊ qied toi (goˊ moˊ qied)","def":"絕子絕孫。 例如：你毋好恁食人戇仔，係無受著報應斯會孤盲絕代。","example":""},{"word":"絕代","pinyin":"qied toi","def":"斷絕後代，常用於罵人無後，屬貶義詞。 例如：還絕代，這種傷天害理个事情佢也做得出來。","example":""},{"word":"該死","pinyin":"goiˊ xiˋ","def":"活該、糟糕了。 例如：早就喊你錢愛收好來，這下打毋見忒（打毋見核），該死哩（吔）！轉去（歸去）愛食棍仔哩（吔）！","example":""},{"word":"干涉","pinyin":"gonˊ sab","def":"參與、過問；關聯、牽涉。 例如：管好自家，毋好去干涉別人。 例如：這議題干涉著歷史个發展，愛收集還較（過）多資料正做得解釋。","example":""},{"word":"講東講西","pinyin":"gongˋ dungˊ gongˋ xiˊ","def":"東扯西扯。 例如：你好好應答吾（𠊎）个問題，莫恁仔講東講西。","example":""},{"word":"講靚話","pinyin":"gongˋ jiangˊ fa","def":"說漂亮的話或場面話。 例如：佢無麼个才情，淨會講靚話定定。","example":""},{"word":"呱牯（呱嫲）","pinyin":"guaˇ guˋ (guaˇ maˇ)","def":"喋喋不休之人。 例如：滿叔个性體當（蓋）好又當（蓋）熱心，毋過佢係一個呱牯。","example":""},{"word":"拐細人仔","pinyin":"guaiˋ se nginˇ eˋ","def":"哄小孩。 例如：阿公去雜貨店買異（盡）多敘饈仔，講係愛拐細人仔。","example":""},{"word":"鬼精仔","pinyin":"guiˋ jinˊ eˋ","def":"比喻聰明、狡猾的人。 例如：這下个細人仔學當（蓋）遽，隻隻都係鬼精仔樣仔。","example":""},{"word":"公太","pinyin":"gungˊ tai","def":"曾祖父；曾祖母為「婆太」，若用以稱曾祖父母，不分性別者，為「阿太」。 例如：吾公太異（盡）早就開始在這開店做大餅，故所𠊎係第四代个傳人。","example":""},{"word":"公當人（公親）","pinyin":"gungˊ dong nginˇ (gungˊ qinˊ)","def":"主持公道的人或仲裁者。 例如：在莊下，若係堵著有糾紛个情事（相爭个事情），村長就會做公當人。","example":""},{"word":"公子阿舍【阿舍公子】","pinyin":"gungˊ ziiˋ aˊ sa【aˊ sa gungˊ ziiˋ】","def":"紈褲子弟。 例如：你毋好想講有錢就好食懶做，係無斯會分人笑係公子阿舍（阿舍公子）。","example":""},{"word":"下屋人","pinyin":"haˊ vugˋ nginˇ","def":"下方鄰居，多用於伙房屋這種具上下方位的群居型式。 例如：你恁大聲唱卡拉OK，下屋人都試著（覺著）異（盡）吵鬧。","example":""},{"word":"鹹合澀（鹹澀）","pinyin":"hamˇ gagˋ sebˋ (hamˇ sebˋ)","def":"很吝嗇又小氣。 例如：佢這個人鹹合澀，故所全無朋友。","example":""},{"word":"行灶下樣仔","pinyin":"hangˇ zo haˊ iong eˋ","def":"就像去自己家的廚房一樣；指常去這個地方，因此非常熟悉。 例如：該代書生理當（蓋）好，去地政事務所就像行灶下樣仔。","example":""},{"word":"好展","pinyin":"hau dienˋ","def":"愛現。 例如：佢當（蓋）好展，見人就拿手錶仔出來展，驚人毋知樣仔。","example":""},{"word":"喊兼來","pinyin":"hemˊ giamˊ loiˇ","def":"把人召集過來聚集在一起。 例如：阿公傳下來个果子大賣生理，想愛轉型賣電器，兄弟姊妹喊兼來參詳。","example":""},{"word":"喊燒","pinyin":"hemˊ seuˊ","def":"是說分不到一杯羹，叫一叫，過過乾癮也甘心。或比喻多管閒事，例如「人食大麵你喊燒」。","example":""},{"word":"後撐仔（後進仔）【後生仔】","pinyin":"heu cang eˋ (heu jin eˋ)【heu sangˊ eˋ】","def":"後輩，稱呼年輕的後輩。 例如：𠊎係正入公司个後撐仔（後生仔），感謝頭家个牽成分𠊎機會。","example":""},{"word":"起赤沙","pinyin":"hiˋ cagˋ saˊ","def":"本意為眼紅，引申為嫉妒。 例如：厥店仔生理好，大家看著目珠起赤沙。","example":""},{"word":"起雷追（起頓屈）","pinyin":"hiˋ luiˇ duiˊ (hiˋ dun kud)","def":"耍賴。 例如：佢像三歲个細人仔樣仔，略下仔（息把仔）無順佢就起雷追（起頓屈）。","example":""},{"word":"嫌到臭屎","pinyin":"hiamˇ do cu siiˋ","def":"批評得一文不值。 例如：做到會死，還分人嫌到臭屎，實在毋值。","example":""},{"word":"嫌毋得","pinyin":"hiamˇ mˇ dedˋ","def":"很好，沒有可批評的地方；不能接受他人的批評。 例如：阿姆煮个菜嫌毋得哦，係分佢聽著，佢斯會面臭臭仔。","example":""},{"word":"梟雄","pinyin":"hieuˊ hiungˇ","def":"狡詐凶狠之領袖人物。 例如：在局勢混亂个時代，梟雄輒輒會得著天下。","example":""},{"word":"畜蚊仔","pinyin":"hiugˋ munˊ eˋ","def":"養蚊子，喻閒置空間。 例如：這兜屋舍無人歇，放在該畜蚊仔，實在盡無彩（浪核）！","example":""},{"word":"凶呷呷仔【凶豺豺仔】","pinyin":"hiungˊ gab gab eˋ【hiungˊ saiˇ saiˇ eˊ】","def":"猛吃的樣子、搶著要吃的樣子。 例如：狗仔食東西个時節，凶呷呷仔（凶豺豺仔），別儕一來就咬佢。","example":""
