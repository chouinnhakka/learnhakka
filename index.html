u ngˇ eˋ","def":"戽水捉魚。","example":""},{"word":"福神漬","pinyin":"fugˋ siinˇ jidˋ","def":"精緻的醬菜名，內容大致有蓮藕、瓜類、蘿蔔等。","example":""},{"word":"合共下","pinyin":"gabˋ kiung ha","def":"混一起。 例如：阿明輒常同不褡不膝个朋友合共下，爺哀當驚佢會學壞。","example":""},{"word":"撿水腳","pinyin":"giamˋ suiˋ giogˋ","def":"收集餘水。 例如：耕田人堵著輪水鬮，水尾輪轉水頭該下，逐截逐個主人都會撿水腳，全無分佢打爽。","example":""},{"word":"鏡析","pinyin":"giang sagˋ","def":"鏡子的玻璃碎片。「盎析」則為花瓶碎片。","example":""},{"word":"過風","pinyin":"go fungˊ","def":"透風、透氣。 例如：這領衫毋會過風，寒天著等騎車仔較無恁寒。","example":""},{"word":"過潦","pinyin":"go lauˇ","def":"果實過熟。 例如：這弓蕉放到過潦，出水吔。","example":""},{"word":"過心（透心）","pinyin":"go ximˊ (teu ximˊ)","def":"指飯粒熟透。 例如：今晡日煮个飯無過心，食起來粒粒。","example":""},{"word":"講狂話","pinyin":"gongˋ kongˇ fa","def":"講夢話。 例如：佢盡會發目睡狂，昨暗晡緊講狂話。","example":""},{"word":"鹹淡","pinyin":"hamˇ tamˊ","def":"乾菜類，屬客家特色名產。 例如：鹽、糖、酸醋係滷鹹淡个三項材料。","example":""},{"word":"閒間仔","pinyin":"hanˇ gienˊ eˋ","def":"備用的房間，常用做客房或倉庫。","example":""},{"word":"桁桷","pinyin":"hangˇ gogˋ","def":"桁，指屋梁上的橫木。桷，在橫木上承接瓦片的方形木條或指屋角的斜柱。","example":""},{"word":"耗光噩夜","pinyin":"hauˊ gongˊ ngog ia","def":"熬夜。 例如：耗光噩夜，目毋足，盡傷身。","example":""},{"word":"閕水","pinyin":"hia suiˋ","def":"灑水。 例如：日頭恁烈，阿姆去禾埕閕水，看會較涼兜仔無。","example":""},{"word":"香馞馞仔","pinyin":"hiongˊ pudˋ pudˋ eˇ","def":"香噴噴地。 例如：到吔下晝三點，麵包店香馞馞仔个味道就會傳出來。","example":""},{"word":"旱陂塘（旱陂塘水）","pinyin":"honˊ biˊ tongˇ (honˊ biˊ tongˇ suiˋ)","def":"排放池塘水。","example":""},{"word":"糠仔","pinyin":"hongˊ eˋ","def":"穀粒上剝落下來的皮殼，多用來餵食家禽。","example":""},{"word":"油氣","pinyin":"iuˇ hi","def":"油脂類食物之總稱。 例如：過年過節敬神个雞鴨油氣特別多。","example":""},{"word":"壅被骨","pinyin":"iungˊ piˊ gudˋ","def":"蒙被子，指人全身都蒙在被窩裡的情況。 例如：寒天壅被骨，恁樣較好睡。","example":""},{"word":"漬水","pinyin":"ji suiˋ","def":"用紙或布吸水。 例如：杯仔橫忒，遽遽去拿布仔來漬水一下。","example":""},{"word":"唶心甜","pinyin":"jiod ximˊ tiamˇ","def":"甜滋滋，形容非常的甜。 例如：麼人泡酸梅茶放恁多糖？食起來唶心甜。","example":""},{"word":"漿洗","pinyin":"jiongˊ seˋ","def":"衣物洗淨後，浸入稀麵糊中漿平。 例如：阿婆个被單漿洗到淨淨俐俐，又較毋會屙糟。","example":""},{"word":"祛","pinyin":"kia","def":"掃除。例如「祛祛仔」即大略掃一掃、「祛把」即掃帚、「祛祛淨來」即用掃帚清掃乾淨。","example":""},{"word":"揜等","pinyin":"kiebˋ denˋ","def":"覆置著。 例如：碗洗淨放在碗櫥項揜等，較遽燥，下二擺愛用也較利便。","example":""},{"word":"牽粉仔【牽粉】","pinyin":"kienˊ funˋ eˇ【kianˊ funˋ】","def":"芶芡。","example":""},{"word":"牽覺","pinyin":"kienˊ gau","def":"熟睡打呼。","example":""},{"word":"凝底","pinyin":"kienˇ daiˋ","def":"溶液中沒有溶解的物質沉積於底部的現象；沉積於底部。 例如：放等个水係有凝底，最好還係莫食較好。 例如：片栗粉會凝底，等愛用正摝過就好吔。","example":""},{"word":"凝家","pinyin":"kienˇ gaˊ","def":"善於經營家務。 例如：厥心臼異會凝家，項項做到好勢好勢，佢兩老做得放下來尞哩！","example":""},{"word":"凝油","pinyin":"kienˇ iuˇ","def":"油脂遇冷表面凝結。 例如：寒天个豬油會凝油，面項一層蓬白。","example":""},{"word":"開洋","pinyin":"koiˊ iongˇ","def":"形容陽光及視界良好的地方。 例如：這門風水，頭前當開洋，實在靚。","example":""},{"word":"舊陋","pinyin":"kiu leu","def":"形容食物因陳放過久而變質。 例如：先生喊阿婆毋好恁省，密密食舊陋个對身體毋好。","example":""},{"word":"罅縫","pinyin":"la pung","def":"指長的縫隙。 例如：地動過後，壁項長長一條罅縫。","example":""},{"word":"邋食皮","pinyin":"lab siid piˇ","def":"外出服。","example":""},{"word":"瀝水溝","pinyin":"lagˋ suiˋ gieuˊ","def":"疏通水溝。 例如：水溝分葉仔塞著，水毋會通，阿爸在屋背瀝水溝。","example":""},{"word":"㕸㕸激激","pinyin":"leb leb gieb gieb","def":"指稀飯或菜湯的水分太多，在容器裡搖晃激盪的樣子。 例如：朝晨食著兩碗糜，㕸㕸激激，吂出門就枵吔，哪有氣力好做事！ 例如：恁大鑊㕸㕸激激个排骨湯，毋過無看著幾多垤排骨。","example":""},{"word":"㕸㕸滾","pinyin":"leb leb gunˋ","def":"原指豬吃東西時所發出的聲音，可形容人大口喝湯水飲品，發出粗魯的聲音；引申為說個不停，非常流暢。 例如：食東西較斯文兜仔，毋好㕸㕸滾無禮貌。 例如：佢正讀高中定定，英文就講到㕸㕸滾吔。","example":""},{"word":"掄腸肚","pinyin":"lemˇ congˇ duˋ","def":"掏取腹部中的內臟、腸肚。 例如：雞仔正㓾好，手伸入去掄腸肚，裡肚還溫燒溫燒。","example":""},{"word":"利水","pinyin":"li suiˋ","def":"形容利於排水。例如「這田當利水」。","example":""},{"word":"理家","pinyin":"liˊ gaˊ","def":"持家、料理家務。","example":""},{"word":"粒粒","pinyin":"liab liab","def":"形容煮飯時因所加的水分太少，導致煮熟的飯粒呈現乾硬的狀態。","example":""},{"word":"掠頭那毛","pinyin":"liog teuˇ naˇ moˊ","def":"用短齒無柄的梳子梳理頭髮。","example":""},{"word":"餾粄仔","pinyin":"liu banˋ eˇ","def":"把粄二次加熱蒸軟。 例如：頭家娘先餾粄仔以後，正分𫣆兜點看愛食哪項粄仔。","example":""},{"word":"老屋跡","pinyin":"loˋ vugˋ jiagˋ","def":"老屋遺跡。","example":""},{"word":"蘿蔔錢","pinyin":"loˇ ped qienˇ","def":"圓片狀且薄的蘿蔔乾。將新鮮蘿蔔刨成狀似銅錢的薄片，經過晒乾而成。","example":""},{"word":"捋豬腸（揢豬腸）","pinyin":"lod zuˊ congˇ (kag zuˊ congˇ)","def":"清洗豬腸內部。 例如：炒豬腸進前，愛先捋豬腸，正揙轉來洗淨。","example":""},{"word":"落峨","pinyin":"log ngoˇ","def":"位於三合院房子正廳之側邊，與護龍（橫屋）交接的轉折處。","example":""},{"word":"落峨間（峨頭間）","pinyin":"log ngoˇ gienˊ (ngoˇ teuˇ gienˊ)","def":"三合院正廳側邊，與廂房相連的轉折緩衝空間，此處多當作廚房使用。","example":""},{"word":"滷鹽","pinyin":"luˊ iamˇ","def":"用鹽巴醃漬食材。 例如：買轉來个蘿蔔仔食毋去，做得滷鹽入盎放。","example":""},{"word":"毋當市","pinyin":"mˇ dongˊ sii","def":"不在鬧市地區。","example":""},{"word":"鉚走","pinyin":"mauˇ zeuˋ","def":"金屬工具的鋒刃因使用磨損而鈍化；偏離正軌彎走。 例如：這鋸齒鉚走哩，拿去分洗鋸師傅洗洗啊！ 例如：火車路係鉚走，會出車禍。","example":""},{"word":"眠床刀","pinyin":"minˇ congˇ doˊ","def":"床沿凸起的部分。 例如：該細人仔在眠床刀項吊等吔，毋知係愛蹶上眠床抑係愛下來？","example":""},{"word":"眠櫃","pinyin":"minˇ kui","def":"古時店鋪放置重要財物的大木櫃。","example":""},{"word":"磨石","pinyin":"mo sag","def":"石磨。","example":""},{"word":"毛籣","pinyin":"moˊ lanˇ","def":"淺邊平底大而圓的竹製容器，常用來盛裝揉好的湯圓。","example":""},{"word":"問仙","pinyin":"mun xienˊ","def":"由靈媒（俗稱「仙姑」）做橋梁促成陰陽兩界的對話，俗稱「牽亡魂」，後引申為「去睡覺」或「打瞌睡」。","example":""},{"word":"門樓","pinyin":"munˇ leuˇ","def":"三合院建築外的牌樓，不僅為家勢的象徵，亦具防禦的功能。","example":""},{"word":"㸐鑊","pinyin":"nadˋ vog","def":"食物被鍋具燒焦。 例如：㸐鑊哩！這尾魚仔還打爽哪！","example":""},{"word":"泥棍棍仔","pinyin":"naiˇ gun gun eˋ","def":"形容沾滿了泥土。 例如：逐日在田坵做事，做到歸身仔泥棍棍仔。","example":""},{"word":"扭臊","pinyin":"neuˋ soˊ","def":"處理食物前，去除腺體除腥的過程。","example":""},{"word":"魚魚肉肉","pinyin":"ngˇ ngˇ ngiugˋ ngiugˋ","def":"魚魚肉肉；形容菜色豐富的樣子。 例如：這張酒席魚魚肉肉恁多，當豐沛哦。","example":""},{"word":"熬更守夜","pinyin":"ngauˇ gangˊ suˋ ia","def":"熬夜，夜間因忙於某事，勉力支撐而延後睡眠。 例如：頭家交代个事當緪頭，輒常愛熬更守夜正做得好。","example":""},{"word":"拈甜","pinyin":"ngiamˊ tiamˇ","def":"抓取甜食，象徵喜氣，亦可說「食甜」。 例如：新正年頭，辦公桌項會放糖盒仔分人拈甜。","example":""},{"word":"熱氣","pinyin":"ngied hi","def":"燥熱性質，如油炸類。 例如：熱氣个東西忒熱，毋好恁輒食。","example":""},{"word":"韌鋸鋸仔","pinyin":"ngiun gi gi eˋ","def":"形容食物不易嚼爛。 例如：這條大腸韌鋸鋸仔，食毋落去。","example":""},{"word":"餓晝仔","pinyin":"ngo zu eˋ","def":"沒吃中餐。 例如：為著愛省錢買書，佢輒輒餓晝仔。","example":""},{"word":"拋鹽","pinyin":"pauˊ iamˇ","def":"在食物上灑鹽後，上下拋動，使鹽味均勻。 例如：朳仔切好以後，愛拋鹽正會較好食。","example":""},{"word":"浮皮面仔","pinyin":"peuˇ piˇ mien eˋ【feuˇ piˇ mien eˋ】","def":"薄薄的表面一層，如煮豬肉後，會有薄薄的一層灰泡。 例如：煮豬肉湯該下，係有浮皮面仔，愛撈忒去較好。","example":""},{"word":"漂水","pinyin":"peu suiˋ","def":"浸泡在水裡，屬漂洗的動作。 例如：米篩目煮好，愛黏時放入冷水先漂水過。","example":""},{"word":"拼索仔","pinyin":"pinˊ sogˋ eˇ","def":"編繩子。","example":""},{"word":"浮冇仔","pinyin":"poˇ pang eˋ【peuˇ pangˋ eˋ】","def":"浮標；浮球，進水控制器。 例如：釣魚仔用个浮冇仔。 例如：水塔裡肚个浮冇仔。","example":""},{"word":"䀯老鼠","pinyin":"pu lo cuˋ【pu no cuˋ】","def":"窺伺老鼠的行動以便捕捉。 例如：野貓䀯老鼠个功夫一流。","example":""},{"word":"匍潦","pinyin":"puˇ lauˇ","def":"衣褲不合身，引申為邋遢的樣子。 例如：天光日若哥愛討餔娘，你斯毋好著到匍潦匍潦哦！","example":""},{"word":"浡出來","pinyin":"pud cudˋ loiˇ","def":"液體或氣體從容器中滿溢出來。 例如：茶罐肚个水裝忒淰，一煮滾就浡出來。","example":""},{"word":"盆頭缽仔","pinyin":"punˇ teuˇ badˋ eˇ","def":"泛指廚用器具。 例如：屋下愛辦兩三張桌，盆頭缽仔做下愛揙出來。","example":""},{"word":"淬水","pinyin":"qi suiˋ","def":"熱鐵與水接觸，為降低溫度。 例如：炒菜个時節愛淬水，熻一下，正毋會忒燥。","example":""},{"word":"淬鑊頭","pinyin":"qi vog teuˇ","def":"灑水於熱鍋中，以降低溫度。 例如：炒青菜該下，係忒烈火愛放一息仔水淬鑊頭，正毋會臭火𤊶。","example":""},{"word":"槧仔","pinyin":"qiamˋ eˇ","def":"尖形插物之工具。水果叉子也可稱之。","example":""},{"word":"膝頭帕","pinyin":"qidˋ teuˇ pa","def":"坐姿時膝蓋以上的部位，現也指圍在腹下膝上的布巾，如用餐時放在膝上的餐巾。 例如：佢還細時節，長間坐在阿公个膝頭帕項，聽阿公講老頭擺。","example":""},{"word":"捨垃圾","pinyin":"saˋ lebˋ sebˋ","def":"倒垃圾。","example":""},{"word":"晒鹹淡","pinyin":"sai hamˇ tamˊ","def":"醃晒各種蔬果。 例如：冬下時節，食毋去个菜做得拿來晒鹹淡。","example":""},{"word":"糝糝","pinyin":"samˋ samˋ","def":"鬆散不黏的樣子。 例如：暗晡夜个飯無煮透，食起來糝糝。","example":""},{"word":"𤍒","pinyin":"sauˇ","def":"將食物以滾水稍微燙過，例如「𤍒菜」，或說「用滾水𤍒過」。 例如：長豆仔愛先用滾水𤍒過，晒過正會變豆乾。","example":""},{"word":"私菜","pinyin":"siiˊ coi","def":"特地為某人準備的菜餚，亦可說「私伽菜」。 例如：阿哥當揀食，阿姆逐餐還愛另外煮私菜分佢傍飯。","example":""},{"word":"食雜","pinyin":"siid cab","def":"泛指飲食及菜色。 例如：因爭生活環境無共樣，客家个食雜乜有變化。","example":""},{"word":"食罅胲","pinyin":"siid la goiˊ","def":"饜足，吃得飽飽的。 例如：豬欄肚个細豬仔係食罅胲，就毋會搶篼吔。","example":""},{"word":"食了米","pinyin":"siid liauˋ miˋ","def":"浪費糧食。 例如：窮人毋知死，買鹹魚，食了米。（諺）","example":""},{"word":"睡一覺目","pinyin":"soi idˋ gau mugˋ","def":"睡一覺。 例如：阿姆都睡一覺目吔，你仰還搵等看電視啊？","example":""},{"word":"上白","pinyin":"songˊ pag","def":"食物因發酵而長出白色的物質，食物處理後仍可食用。 例如：甜粄上白，愛餾過正食得。","example":""},{"word":"上烏雞","pinyin":"songˊ vuˊ gieˊ","def":"物品因潮溼發霉而產生的黑點。 例如：筷桶愛汫燥，筷仔愛焙燥，無斯會上烏雞。","example":""},{"word":"樹料","pinyin":"su liau","def":"供製作或建築用的木料。","example":""},{"word":"水楻","pinyin":"suiˋ fongˇ","def":"盛水的大缸。 例如：今晡日停水，水楻又無水，看愛仰仔煮飯正好？","example":""},{"word":"水筧仔","pinyin":"suiˋ gienˋ eˇ","def":"竹子對半剖做成的導水管。","example":""},{"word":"燂","pinyin":"tamˇ","def":"以火熱物使其軟化。 例如：塑膠管愛先用火燂軟來，正搵得彎。","example":""},{"word":"燂烏","pinyin":"tamˇ vuˊ","def":"燻黑。 例如：瓦斯爐个火係變紅色該下，鑊底就會燂烏。","example":""},{"word":"豆筣","pinyin":"teu li","def":"給豆類植物攀爬的竹竿。","example":""},{"word":"墊睡","pinyin":"tiabˋ soi","def":"墊在底下睡覺。 例如：這領較薄个被分你墊睡。","example":""},{"word":"甜滋胲","pinyin":"tiamˇ jiˊ goiˊ","def":"不爽口的甜味，有點膩口。 例如：阿婆做个熝湯粢，食起來甜滋胲甜滋胲，食忒多會畏胲。","example":""},{"word":"天下","pinyin":"tienˊ haˊ","def":"指屋外、露天。 例如：阿祿伯做生日，天下排桌請人，熱到會死。","example":""},{"word":"天井","pinyin":"tienˊ jiangˋ","def":"四合院房屋的中庭院子。傳統建築中，房子與房子中間，或房子與圍牆所圍起的空地皆稱「天井」。 例如：大樓肚留隻天井，樓肚个光線改善當多。","example":""},{"word":"奪地氣","pinyin":"tod ti hi","def":"貼近地面，吸取大地之氣。 例如：阿爸下把仔會打赤腳奪地氣，佢講恁樣較康健。","example":""},{"word":"屯泥","pinyin":"tunˇ naiˇ","def":"填土。","example":""},{"word":"銅笐仔","pinyin":"tungˇ gongˇ eˋ","def":"銅罐子，泛指金屬罐子。","example":""},{"word":"四門透底","pinyin":"xi munˇ teu daiˋ","def":"門窗全部都打開來，用以形容門戶全開。 例如：若屋下常間無人在還四門透底，毋驚賊仔偷係無？","example":""},{"word":"絲芋荷","pinyin":"xiˊ vu hoˇ","def":"把芋頭的葉梗表皮撕去。用於豌豆莢則為「絲荷蘭豆」。 例如：叔姆講芋仔歸頭都食得，青莖做得絲芋荷炒豆豉，一等好食。","example":""},{"word":"楔","pinyin":"xiabˋ","def":"異物塞住縫隙，例如「楔牙縫」表塞牙縫、「楔桌腳」表塞住高低不平的桌腳。","example":""},{"word":"錫桶仔","pinyin":"xiagˋ tungˋ eˇ","def":"以金屬製成的水桶。 例如：頭擺人用大錫桶仔擐水洗身，用細錫桶仔打井水上來洗湯。","example":""},{"word":"修籬整壁","pinyin":"xiuˊ liˇ zangˋ biagˋ","def":"謂整修家園的雜事。","example":""},{"word":"矺鹹菜","pinyin":"zagˋ hamˇ coi","def":"以石頭壓緊鹹菜，使之發酵。 例如：鹹菜用鹽亼過後，放入醃缸滷个時節，愛用石頭來矺鹹菜正會出味。","example":""},{"word":"矺粄仔","pinyin":"zagˋ banˋ eˇ","def":"壓乾粄漿。 例如：米漿挨好了定著愛先矺粄仔矺畀燥。","example":""},{"word":"酒開仔","pinyin":"jiuˋ koiˊ eˋ","def":"開瓶器。","example":""},{"word":"炙酒（暖酒）","pinyin":"zagˋ jiuˋ (nonˊ jiuˋ)","def":"用小火熱過，使酒變溫。 例如：恁寒个天時，炙酒來食，加異好睡。","example":""},{"word":"棧學寮","pinyin":"zanˋ hog liauˇ","def":"住在學校宿舍。","example":""},{"word":"正身","pinyin":"ziin siinˊ","def":"三合院的正廳那棟房子。","example":""},{"word":"做家","pinyin":"zo gaˊ","def":"形容勤勞節儉顧家，治理家務。 例如：阿錦嫂當做家，做得回收个東西全部留起來賣。","example":""},{"word":"灶頭","pinyin":"zo teuˇ","def":"灶。「灶頭背」即為爐灶附近的地方。","example":""},{"word":"粥水","pinyin":"zugˋ suiˋ","def":"飯湯，又稱為「糜飲」。 例如：婆太識講過，頭擺係毋罅乳水分細人仔食个時節，愛煲粥水來添貼。","example":""},{"word":"漚肥","pinyin":"eu piˇ","def":"將青草、樹葉或人畜的糞尿等放在坑內，加水浸泡，發酵後製成肥料。","example":""},{"word":"菣香","pinyin":"kien hiongˊ","def":"用佐料調理食物的味道。 例如：炒炒肉愛用蝦米、蔥仔菣香正好食。","example":""},{"word":"揙穀","pinyin":"bienˋ gugˋ","def":"翻穀。 例如：今這下人做下用機器焙穀，無人用老式个盪耙揙穀晒穀吔。","example":""},{"word":"勾搭","pinyin":"gieuˊ dabˋ","def":"用以挑物的掛勾，常與扁擔配成挑具。","example":""},{"word":"烳鏍","pinyin":"puˇ loˇ","def":"腹大而深的鍋子。","example":""},{"word":"單手事","pinyin":"danˊ suˋ se","def":"指工作時僅自己一人在做，沒有人可以幫忙的情況。","example":""},{"word":"覆槽","pinyin":"pugˋ coˇ","def":"瓦片的凸槽。","example":""},{"word":"張槽","pinyin":"zongˊ coˇ","def":"瓦片的凹槽。","example":""},{"word":"矮㑁㑁","pinyin":"aiˋ dudˋ dudˋ","def":"形容人很矮又有一點兒胖。","example":""},{"word":"矮頓矮頓（矮頓頓仔）","pinyin":"aiˋ dunˋ aiˋ dunˋ (aiˋ dunˋ dunˋ eˋ)","def":"形容身材矮矮胖胖的樣子。","example":""},{"word":"矮墩墩仔","pinyin":"aiˋ dunˊ dunˊ eˋ","def":"又矮又胖且行動緩慢的樣子。 例如：厥先生生來矮墩墩仔，做人篤實，盡有人緣。","example":""},{"word":"暗摸摸仔","pinyin":"am moˊ moˊ eˋ","def":"形容很暗。 例如：無通無知就停電，滿哪就暗摸摸仔，麼个就看毋著。","example":""},{"word":"暗摸絮疏","pinyin":"am moˊ xiˊ soˊ/soˇ","def":"黑漆漆的，黑暗中行走必須摸索前進，故曰「暗摸」，「絮疏」則是狀聲詞。 例如：仰會暗摸絮疏？係毋係停電？","example":""},{"word":"恁多仔","pinyin":"an doˊ eˋ","def":"那麼少。 例如：飯正煮著恁多仔定定，哪罅佢食？","example":""},{"word":"恁大仔","pinyin":"an tai eˋ","def":"那麼小而已。 例如：若老妹正恁大仔就識恁多字，實在還慶！ 例如：這盒仔正恁大仔，哪裝得落恁多東西？","example":""},{"word":"恁猴","pinyin":"anˋ heuˇ","def":"這麼精明，這麼頑皮。 例如：若這倈仔恁猴哦！麼个都考佢毋橫。 例如：若這倈仔恁猴哦！你喊佢，佢敢毋去。","example":""},{"word":"疤膣疤面","pinyin":"baˊ ziiˊ baˊ mien","def":"物品表面坑坑疤疤。 例如：仰會恁牛？鉛筆盒仔昨晡日正買，今晡日就搣到疤膣疤面。","example":""},{"word":"背笐","pinyin":"baˇ gongˇ","def":"背竹筒盛具以行乞，比喻陷入最糟糕的境地。 例如：做生理，無簡單，一下毋堵好，就會了到背笐。","example":""},{"word":"種草","pinyin":"zungˋ coˋ","def":"品種（表遺傳）。 例如：厥種草異好，降个細人仔體格好又聰明。","example":""},{"word":"百番底","pinyin":"bagˋ fanˊ daiˋ","def":"非常徹底。 例如：佢兩兄弟為著祖公業，鬧到百番底。","example":""},{"word":"半離半棧","pinyin":"ban liˇ ban can","def":"指事情做到半途尚未完成。 例如：做事愛擔硬兜，煞煞做好來，毋好半離半棧就放佢拖。","example":""},{"word":"半尷不尬（不尷不尬）","pinyin":"ban gangˊ budˋ gie (budˋ gangˊ budˋ gie)","def":"指事情進行到一半就停下來，變成進退不得的情況。 例如：係愛做就愛做正來，莫做到半尷不尬。","example":""},{"word":"粄印印个","pinyin":"banˋ in in ge","def":"同一個模子塑造出來的，喻長得很像。","example":""},{"word":"繃緪","pinyin":"bang henˇ","def":"拉得很緊。","example":""},{"word":"繃雄","pinyin":"bang hiungˇ","def":"形容很有精力。","example":""},{"word":"包密密","pinyin":"bauˊ miˊ miˊ","def":"包得緊緊的、包得密密的。基本上和「包塞塞」是相同意思。 例如：像佢恁樣連面都包密密，就毋會分蚊仔叼著吔。","example":""},{"word":"包塞塞","pinyin":"bauˊ sedˋ sedˋ","def":"包得密密的、包得緊緊的，形容把東西或人完全包住。 例如：佢用手帕包塞塞，𠊎仰知該係麼个？","example":""},{"word":"咇唎啵囉","pinyin":"bi li bo lo","def":"形容嘈雜的聲響，狀聲詞。 例如：下班个鈴仔聲一響，大家就走到咇唎啵囉。","example":""},{"word":"噼事","pinyin":"biag sii","def":"不為人知的事情爆發出來，一般指倒閉、破產而言。 例如：佢做人好貪，過手个錢銀數目毋清毋楚，總有一日會噼事，到時就有「公家飯」好食哪！","example":""},{"word":"拚生死","pinyin":"biang sangˊ xiˋ【bia sangˊ xiˋ】","def":"拚命。","example":""},{"word":"拚上崁","pinyin":"biang songˊ kam","def":"進步，更上一層樓。 例如：佢當認真，這擺總算分佢拚上崁哩！","example":""},{"word":"鷝瀝屎","pinyin":"bidˋ lid siiˋ","def":"原指微細的東西，現常用於指最後一名。","example":""},{"word":"筆瀝直","pinyin":"bidˋ lid ciid","def":"筆直。 例如：這條大路筆瀝直，一下仔無注意就會駛忒遽。","example":""},{"word":"貶白（貶肚）","pinyin":"bienˋ pag (bienˋ duˋ)","def":"魚類翻肚的樣子。 例如：歸魚塘个魚仔貶白貶白，損失嶄然大。","example":""},{"word":"並並磅磅","pinyin":"bin bin bong bong","def":"狀聲詞，形容撞擊的聲音，大而響亮且吵人。 例如：細人仔上梯排並並磅磅，還有元氣哦。","example":""},{"word":"並令拚喨","pinyin":"bin lin biang lang","def":"狀聲詞，形容撞擊的聲音。 例如：樓頂並令拚喨，敢係該兩公婆又相吵吔？","example":""},{"word":"並絆","pinyin":"bin ban","def":"行動被羈絆、阻礙，亦可說「並並絆絆」。 例如：恁多事情並絆等，𠊎哪走得開腳？","example":""},{"word":"並並絆絆","pinyin":"bin bin ban ban","def":"事務繁雜、糾纏不清。 例如：降五六個細人仔，愛轉妹家，並並絆絆，渡毋得開。","example":""},{"word":"兵挷齒扯","pinyin":"binˊ bangˊ ciiˋ caˋ","def":"事情繁多、十分忙亂，形容忙得不可開交。 例如：限勢𠊎就搣到兵挷齒扯，你莫在這徑手徑腳好無？","example":""},{"word":"發瘠","pinyin":"bodˋ jidˋ","def":"病懨懨、不健康，多病瘦弱貌，引申為差勁的意思。 例如：這狗仔看起來發瘠發瘠，還衰過。 例如：你仰恁發瘠，這恁簡單个事情都毋會做。","example":""},{"word":"幫幫拔拔","pinyin":"bongˇ bongˇ bad bad","def":"拖泥帶水、拖拖拉拉；形容事多繁瑣的樣子。 例如：請人客，係講自家辦桌，幫幫拔拔，盡麻煩。","example":""},{"word":"笨筍（麻筍）【笨投】","pinyin":"bun sunˋ (maˇ sunˋ)【bun dauˇ】","def":"形容幼嫩肥壯的樣子，多用於形容女孩子或幼兒。 例如：細人仔生到笨筍笨筍，異得人惜。","example":""},{"word":"畚箕𢯭𣛮","pinyin":"bun giˊ ten cang","def":"不相稱的東西搭配在一起，比喻不相稱。","example":""},{"word":"赤哎哎仔","pinyin":"cagˋ ngai ngai eˋ","def":"顏色呈現赤赤的。例如「豆腐煎到赤哎哎仔」、「魚仔煎到赤哎哎仔」。","example":""},{"word":"赤赤","pinyin":"cagˋ cagˋ","def":"物體經外力作用呈現暗紅色或赤褐色接近黑色。 例如：柳青哥做建築个工地事，歸身仔晒到赤赤。 例如：魚仔煎到赤赤，正拿來半煎煮較無恁躁火。","example":""},{"word":"燦光","pinyin":"can gongˊ","def":"火花綻放。 例如：對門山頂一陣燦光，怕係𥍉爧。","example":""},{"word":"操持","pinyin":"cauˊ ciiˇ","def":"勤勞、勤奮。 例如：好得𠊎个阿公阿婆恁操持，正有恁幸福个日仔。 例如：這个人當操持，一日到暗做無停。","example":""},{"word":"傪","pinyin":"cemˊ【cam】","def":"豐盛、享受。 例如：這擺傪哩！一張桌萬八個銀。","example":""},{"word":"瘦薑","pinyin":"ceu giongˊ","def":"細瘦，另言「瘦薑瘦薑」即形容身子略為細瘦。 例如：這細人仔生到恁瘦薑，風一吹就橫走吔。","example":""},{"word":"自主自意【自顧自義】","pinyin":"cii zuˋ cii i【cii gu cii ngi】","def":"我行我素、自作主張。 例如：佢自主自意，愛同屋仔賣忒，完全無問過厥屋下人。","example":""},{"word":"深落","pinyin":"ciimˊ log","def":"指房子之縱深度很深，亦可說「深落落」，反義詞為「淺間」。 例如：厥屋下起个新屋，狹狹仔，毋過深落深落。","example":""},{"word":"陣陣腦上","pinyin":"ciin ciin noˋ songˊ","def":"越來越囂張。也可說「陣陣上」。 例如：你假使緊讓佢，佢就會陣陣腦上。","example":""},{"word":"座包尾","pinyin":"co bauˊ miˊ","def":"殿後。","example":""},{"word":"坐儕毋知企儕苦","pinyin":"coˊ saˇ mˇ diˊ kiˊ saˇ kuˋ","def":"坐著的人不知道站著的人的辛苦，喻享受者不知勞役者的苦楚。 例如：人講「坐儕毋知企儕苦」、「坐轎毋知扛轎苦」，等到自家堵著吔正會知。","example":""},{"word":"財丁兩旺","pinyin":"coiˇ denˊ liongˋ vong","def":"既富有又多子。","example":""},{"word":"才情","pinyin":"coiˇ qinˇ","def":"才能、才華。 例如：老妹又靚又有才情，班項當多人合意佢。","example":""},{"word":"賺著來愁","pinyin":"con doˋ loiˇ seuˇ","def":"無端惹出來的煩惱事。 例如：外行人買股票，其實斯係賺著來愁。","example":""},{"word":"賺暢","pinyin":"con tiong","def":"僅得到快樂而無實質收益。 例如：頭擺人講：「戇雞嫲孵鴨春，戇姐婆惜外孫」，外孫唚嘴角，賺暢！","example":""},{"word":"長膏膏","pinyin":"congˇ goˇ goˇ","def":"一種細長、長弧形的樣子。 例如：這菜頭粄長膏膏，做得切當多料。","example":""},{"word":"長饒饒仔","pinyin":"congˇ ngieuˇ ngieuˇ eˇ","def":"形容物體形狀非常修長；亦用在指稱時間很長。 例如：該水管長饒饒仔，用忒斯愛收好，無會徑著人。 例如：日仔長饒饒仔，莫去想恁多有个無个。","example":""},{"word":"長勢長勢","pinyin":"congˇ se congˇ se","def":"四方形，長而寬且薄。 例如：這垤客家花布長勢長勢，拿來墊托盤堵好合靚。","example":""},{"word":"長噦噦仔","pinyin":"congˇ veˇ veˇ eˋ","def":"指講話的時間拖得很長，亦可說「長纜纜仔」。 例如：阿清嫂係長屎胐，見講麼个都長噦噦仔毋得佢煞。","example":""},{"word":"臭臊巴哺【臭腥巴哺】","pinyin":"cu soˊ baˇ buˇ【cu xiangˊ baˇ buˇ】","def":"形容騷臭味衝人鼻子。 例如：該魚仔臭臊巴哺，麼人愛食？","example":""},{"word":"粗殘","pinyin":"cuˊ canˇ","def":"粗魯殘暴。","example":""},{"word":"粗番番仔","pinyin":"cuˊ fanˊ fanˊ eˋ","def":"粗糙、不光滑的樣子。 例如：這衫用个料毋好，摸起來粗番番仔，著起來試著虐削虐削。","example":""},{"word":"粗蠻","pinyin":"cuˊ manˇ","def":"粗壯勇武的樣子。 例如：看佢生來恁粗蠻，力頭怕拗蠻大。","example":""},{"word":"粗皮瘌礙","pinyin":"cuˊ piˇ ladˋ ngai","def":"表面粗糙而不平滑的樣子。 例如：這恁多隻月無落雨，樹皮晒到粗皮瘌礙，葉仔乜燥燥。","example":""},{"word":"齣數","pinyin":"cudˋ sii","def":"名堂、狀況、情況。 例如：今个人毋知麼个齣數，蓋被來吹冷氣。","example":""},{"word":"出心","pinyin":"cudˋ ximˊ","def":"形容人針對某事奉獻心力。 例如：風搓過後，大家出心來整理。","example":""},{"word":"墜椏墜桍【墜椏墜杷】","pinyin":"cui vaˊ cui kuaˋ【cui vaˊ cui paˋ】","def":"枝椏下垂的樣子。 例如：柚仔打到結結，墜椏墜桍，強強會揬著地泥哩。","example":""},{"word":"伸紋","pinyin":"cunˊ vunˇ","def":"臉色愉悅的樣子。 例如：恁久看厥个面容伸紋，毋知在歡喜麼个？","example":""},{"word":"打眼","pinyin":"daˋ ngienˋ","def":"起眼，顯眼。 例如：這領衫無打眼，講麼个愛兩千個銀，騙人毋識。","example":""},{"word":"貼貼","pinyin":"dabˋ dabˋ","def":"極限，形容事態或時間到了很慘或很吃緊的地步。 例如：講好九點愛轉，佢貼貼尞到十二點正甘願轉。 例如：佢生理失敗，了到貼貼。","example":""},{"word":"擔硬","pinyin":"damˊ ngang","def":"能吃苦，形容一個人吃得了苦，能夠忍受艱辛。 例如：佢係當擔硬个人，幾苦个事都肯做。","example":""},{"word":"澹澹汀汀","pinyin":"damˇ damˇ din din","def":"滴水貌；物件成一條一條地向下垂。 例如：麼个屋仔？一落雨，屋肚滿哪仔漏到澹澹汀汀。 例如：若衫仰爛到澹澹汀汀還在該著？去買過一領好無？","example":""},{"word":"釘楯仔","pinyin":"dangˊ dunˋ eˇ","def":"釘木樁，引申為人站著不會移動的樣子。 例如：阿山牯毋知受著麼个打擊，像釘楯仔樣仔企透日。","example":""},{"word":"沾沾仔","pinyin":"debˋ debˋ eˇ","def":"指水量微沾而不滿的樣子。 例如：面帕莫裝恁溼，沾沾仔就好。","example":""},{"word":"竳線","pinyin":"denˇ xien","def":"形容一個人衣著、儀表漂亮、標緻。 例如：今晡日著到恁竳線，愛去哪位？","example":""},{"word":"恬風息氣","pinyin":"diamˊ fungˊ xidˋ hi","def":"風與空氣都呈現靜止狀態，比喻四周平靜或情勢穩定。 例如：冤家毋相讓，哪有恬風息氣个場面。","example":""},{"word":"著著","pinyin":"diauˇ diauˇ","def":"穩固的樣子。 例如：這索仔䌈到緪著著，當難解開來。","example":""},{"word":"癲癲倲倲","pinyin":"dienˊ dienˊ dungˊ dungˊ","def":"神志不清貌。 例如：老吔就癲癲倲倲，毋係跌西就跌東。","example":""},{"word":"中中仔","pinyin":"zungˊ zungˊ eˋ","def":"普普通通、中等。 例如：阿明个成績中中仔，毋過佢整車仔个手藝當好。","example":""},{"word":"癲癲痴痴","pinyin":"dienˊ dienˊ ciiˊ ciiˊ","def":"瘋瘋癲癲，行為脫序。 例如：莫恁仔癲癲痴痴，係無搣好，該斯會出人命哦！","example":""},{"word":"尛尛仔","pinyin":"diu diu eˋ","def":"常形容東西細小，又可引申指人瘦小。 例如：這豆仁尛尛仔，夾都夾毋起。","example":""},{"word":"丟籬橫壁","pinyin":"diuˊ liˇ vang biagˋ","def":"零亂沒有收拾；也可比喻家境窮困。 例如：這個細妹仔房間个東西丟籬橫壁，又毋肯整理，當律不。","example":""},{"word":"到家","pinyin":"do gaˊ","def":"完備、齊全；深入了解而內行、有經驗且通曉其內容。 例如：好得你準備到恁到家，大家正有點心好食，毋會餓著。 例如：厥功夫異到家吔，做得出師哩。","example":""},{"word":"多到徑腳","pinyin":"doˊ do gang giogˋ","def":"形容物品很多，多到會絆倒人。 例如：毋好過買哩，若衫褲多到徑腳哩。","example":""},{"word":"琢服","pinyin":"dogˋ fug","def":"非常佩服。","example":""},{"word":"堆山塞海","pinyin":"doiˊ sanˊ sedˋ hoiˋ","def":"形容東西、雜物很多，多到堆積成山，填滿了海。 例如：大賣場个貨品堆山塞海，隨在你想買麼个就買得著。","example":""},{"word":"賭彩","pinyin":"duˋ coiˋ","def":"碰碰運氣；運氣好。 例如：罔買張樂透，賭彩會著著乜無定著。","example":""},{"word":"肚膕膕仔","pinyin":"duˋ gued gued eˋ","def":"肚子挺出的樣子，常是因為吃太多，屬短暫性狀態。 例如：你都食到肚膕膕仔，又還愛過食？ 例如：這張桌當傪菜，大家都食到肚膕膕仔。","example":""},{"word":"肚弛弛仔","pinyin":"duˋ ie ie eˋ【duˋ ieˇ ieˇ eˊ】","def":"肚子鬆垮垮的樣子。 例如：肥到肚弛弛仔，連動都懶尸，愛仰結煞正好？","example":""},{"word":"賭造化","pinyin":"duˋ co fa","def":"碰運氣，亦可說「賭膦造化」、「賭膦彩」。 例如：毋使擇，賭造化會著著！","example":""},{"word":"堵胲","pinyin":"duˇ goiˊ","def":"謂吃得太飽，已堵到喉嚨。 例如：阿姆當晝煮忒豐沛，食到堵胲，暗晡夜怕毋使食哩。","example":""},{"word":"對毋著","pinyin":"dui mˇ doˋ","def":"不相配、不能相合，亦可說「和毋著」，反義詞「對得著」即為配得上。 例如：這頂項寫个，同你算个，完全對毋著。","example":""},{"word":"咚咚滾","pinyin":"dung dung gunˋ","def":"咚咚作響。 例如：上梯排腳步放輕兜仔，踏恁重，舞到咚咚滾，害人血壓都會擎起來。","example":""},{"word":"花花假假","pinyin":"faˊ faˊ gaˋ gaˋ","def":"虛虛假假。 例如：賣藥仔个廣告花花假假，儘採買來食可能會傷身。","example":""},{"word":"花喇","pinyin":"faˊ laˊ","def":"形容物品的顏色參雜，即色不純，可重疊構詞為「花喇花喇」。 例如：厥店項个貨品擺到淰淰，看起來花喇花喇，毋知愛仰仔選？","example":""},{"word":"花喇必駁","pinyin":"faˊ laˊ bidˋ bogˋ【faˊ laˊ bid bog】","def":"形容物品色彩很多很花的樣子，讓人看起來眼花撩亂。 例如：這領衫个花色看起來花喇必駁，你敢著出去參加朋友个結婚典禮喺？","example":""},{"word":"花蓼","pinyin":"faˊ liauˊ","def":"謊言，亦可說「花花蓼蓼」。 例如：該人講話盡花蓼，信毋得。","example":""},{"word":"定板","pinyin":"tin banˋ","def":"不慌不忙，不疾不徐。","example":""},{"word":"闊野野仔","pinyin":"fadˋ iaˊ iaˊ eˋ","def":"寬闊的樣子。 例如：屋背該垤地闊野野仔，係種兜仔花落去，定著當靚。","example":""},{"word":"壞風性","pinyin":"faiˋ fungˊ xin","def":"（社會）風氣不好；氣候不好，容易生病的氣候。 例如：社會越進步，顛倒壞風性，著到屎胐出出乜安到時行。 例如：這站仔壞風性，當多人著著感冒。","example":""},{"word":"壞膣壞鳥","pinyin":"faiˋ ziiˊ faiˋ dog","def":"形容東西破舊不堪。 例如：壞膣壞鳥个桌凳，好攉忒去哩。","example":""},{"word":"竵竵","pinyin":"feˋ feˋ","def":"歪歪的。如「嘴竵竵」表嘴巴歪歪的、「面竵過去」表臉轉歪向一側。","example":""},{"word":"和和仔","pinyin":"foˇ foˇ eˋ","def":"平緩和平的樣子。 例如：恁久厥爸身體和和仔，看起來精神毋會差。","example":""},{"word":"和挼","pinyin":"foˇ noˇ","def":"和諧，另言「和和挼挼」，意思相同。","example":""},{"word":"緩緩仔","pinyin":"fon fon eˋ","def":"慢慢地，不用急。 例如：這件事情毋會急，緩緩仔做就做得，做較好兜仔較要緊。","example":""},{"word":"方可仔","pinyin":"fongˊ koˋ eˇ","def":"尚稱可以。 例如：這桌仔，雖然工無做到盡幼，方可仔啦！算異用得哩！","example":""},{"word":"富罅罅仔","pinyin":"fu la la eˋ","def":"富有的樣子。 例如：看佢富罅罅仔，到底係做麼个頭路？","example":""},{"word":"戽水上天","pinyin":"fu suiˋ songˊ tienˊ","def":"形容事情很難，或完全做不到。 例如：戇狗想食豬肝骨，戇猴妄想戽水上天。","example":""},{"word":"腐腐","pinyin":"fuˊ fuˊ","def":"物體質變成粉末狀。 例如：樹頭分白蟻蛀到腐腐！","example":""},{"word":"鬍鬚馬加","pinyin":"fuˇ xiˊ maˊ gaˊ","def":"花臉雜亂貌。 例如：若面畫到鬍鬚馬加，係愛去哪表演係無？","example":""},{"word":"鬍鬚頭難剃","pinyin":"fuˇ xiˊ teuˇ nanˇ ti","def":"喻事情不易處理。","example":""},{"word":"豐湧","pinyin":"fungˊ iungˋ","def":"豐裕、富有，衣食不缺。 例如：雖然講厥屋下異豐湧，厥日仔還係過到當省儉。","example":""},{"word":"紅霞紅霞","pinyin":"fungˇ haˇ fungˇ haˇ","def":"自體呈現臉部如紅霞般的紅色。 例如：細孲仔个面紅霞紅霞，大家看著都想愛唚一下。","example":""},{"word":"紅啾啾仔","pinyin":"fungˇ jiuˊ jiuˊ eˋ","def":"形容物品盛紅的樣子。例如「紅啾啾仔个柿仔」。","example":""},{"word":"紅羅花色","pinyin":"fungˇ loˇ faˊ sedˋ","def":"形容氣色好，臉色紅潤。 例如：阿公八十零歲吔，面相還係紅羅花色，應該食得著歸百歲喲。","example":""},{"word":"紅歪歪仔","pinyin":"fungˇ vaiˇ vaiˇ eˋ","def":"非常的紅，大多指嘴唇或胭脂塗抹得很紅的狀態。 例如：若嘴脣膏到紅歪歪仔，愛去食酒喺？","example":""},{"word":"合合","pinyin":"gabˋ gabˋ","def":"混合得均勻，呈現無縫隙狀態。 例如：紅毛泥愛鍬到合合，起个屋正會實疊。","example":""},{"word":"合个（搭秤頭个）","pinyin":"gagˋ ge (dabˋ ciin teuˇ ge)","def":"指主物之外附加的。 例如：這人公仔係買東西合个，你係中意就送你，無相干。","example":""},{"word":"交運","pinyin":"gauˊ iun","def":"轉運，由惡運轉為好運。 例如：佢舊年做麼个都毋成，今年交運，做麼个都順序。","example":""},{"word":"嘰嘰嘎嘎","pinyin":"gi gi ga ga","def":"形容吵雜的聲音。 例如：打早聽著同學在該嘰嘰嘎嘎，一問正知係在該討論昨晡日个電視節目。","example":""},{"word":"飢色","pinyin":"giˊ sedˋ","def":"面有菜色。 例如：若面仰恁仔黃臘黃臘、飢色飢色，係幾多日無正常食睡吔？","example":""},{"word":"浹浹","pinyin":"giabˋ giabˋ","def":"嚐起來苦澀的樣子。 例如：柿仔吂黃，食起來浹浹。","example":""},{"word":"兼兼仔","pinyin":"giamˊ giamˊ eˋ","def":"形容很接近，若是指錢的金額表示所差不遠。 例如：該價數兼兼仔一萬個銀。","example":""},{"word":"雞無啼狗無吠","pinyin":"gieˊ moˇ taiˇ gieuˋ moˇ poi","def":"雞不啼，狗不叫，用以比喻不尋常的寂靜。","example":""},{"word":"激來激去","pinyin":"gieb loiˇ gieb hi","def":"水波晃動。 例如：佢㧡一擔水激來激去，激到屋下伸無半桶水。","example":""},{"word":"結結","pinyin":"giedˋ giedˋ","def":"形容肌肉或果實很結實的樣子；形容食物或材料很黏很稠的樣子。 例如：佢腳囊肚摸起來結結，定著當有力。 例如：水梨打到結結，最驚風搓來吹。 例如：紅毛泥攪到結結，淋啊上去，毋使幾久就燥。","example":""},{"word":"堅耐","pinyin":"gienˊ ngai","def":"形容人意志堅強，有韌性、不怕苦。 例如：佢盡堅耐，擔頭較重乜㧡起來。","example":""},{"word":"金晶積亮（金脂百亮）","pinyin":"gimˊ jiaˊ jidˋ lang (gimˊ ziiˊ/jiˊ bagˋ lang)","def":"物品的外貌亮晶晶。 例如：厥公司个招牌捽到金晶積亮，生理定著好！","example":""},{"word":"金皙皙仔","pinyin":"gimˊ xiagˋ xiagˋ eˋ","def":"物品的外貌亮晶晶。 例如：新娘戴个䯋鍊金皙皙仔，當靚。","example":""},{"word":"涇碽","pinyin":"gin gung","def":"狀聲詞，用來指石頭的聲音較多。 例如：拿隻大石牯擲落深潭，就聽著涇碽一聲。","example":""},{"word":"緊拚拚仔","pinyin":"ginˋ biang biang eˋ","def":"需要趕工而時間很急迫的樣子。 例如：做事情緊拚拚仔，較會出差錯。","example":""},{"word":"緊搐搐仔","pinyin":"ginˋ cug cug eˋ","def":"倉卒、匆忙的樣子。 例如：做麼个事情就恁樣緊搐搐仔毋先規劃好來，仰會做得好？","example":""},{"word":"緊衝衝仔【亂緊緊吔】","pinyin":"ginˋ cung cung eˋ【lon ginˋ ginˋ eˊ】","def":"匆匆忙忙的樣子。 例如：佢緊衝衝仔走出去，毋知到底發生麼个事情。","example":""},{"word":"薑根","pinyin":"giongˊ ginˊ","def":"本義為生薑的根長得細長的樣子，引申為形容人細瘦的樣子。 例如：細人仔胃腸毋好，畜到薑根薑根。","example":""},{"word":"過套","pinyin":"go tau","def":"過時了。 例如：這東西過套吔，無人愛買。","example":""},{"word":"高低齾","pinyin":"goˊ daiˊ ngadˋ","def":"兩者高度略有差異，例如兩張桌子併在一起不平整；形容身高有高有矮亦可說「高低伏」；形容梯田亦可說「高低碫」、「高低巖」。 例如：這雙鞋著久嗄高低齾，盡毋好著。","example":""},{"word":"高溜","pinyin":"goˊ liuˊ","def":"高高瘦瘦的樣子。 例如：阿祥生來盡高溜，著麼个衫都好看。","example":""},{"word":"密密蒙蒙","pinyin":"miˊ miˊ mangˊ mangˊ","def":"包得很密。 例如：阿貴嫂見去田坵仔做事，歸個面包到密密蒙蒙，淨伸著兩粒目珠定定。","example":""},{"word":"高天天仔","pinyin":"goˊ tienˊ tienˊ eˋ","def":"很高的樣子，可以指人或物。 例如：都市个大樓高天天仔，強強會看毋著天頂哩。 例如：阿榮生到高天天仔，著西裝盡好看。","example":""},{"word":"膏膏","pinyin":"goˇ goˇ","def":"混有粉狀物而形成黏稠的樣子。 例如：煠三層肉搵膏膏个豆油膏當合味。","example":""},{"word":"胲哊哊仔","pinyin":"goiˊ iogˋ iogˋ eˇ","def":"張口想吃，流口水的樣子。 例如：佢胲哊哊仔望等樹頂个李仔，想到緊吞口涎水！","example":""},{"word":"胲嗙嗙仔","pinyin":"goiˊ pangˊ pangˊ eˋ","def":"臉紅脖子粗，一副怒氣的狀態。 例如：莫嫌佢哦，佢分人嫌啊著就譴到胲嗙嗙仔。","example":""},{"word":"晃晃激激","pinyin":"gongˇ gongˇ gieb gieb","def":"液體因搖動溢出的樣子，通常指桶、勺、杯、碗等較小的容器因受外力激盪而濺出內容物的情形。「半桶水晃晃激激」則是比喻能力不足又愛喧嚷炫耀之人。 例如：阿姆㧡水淋菜，上大崎一擔水晃晃激激，㧡到菜園伸無一半。","example":""},{"word":"古琢","pinyin":"guˋ dogˋ","def":"滑稽貌，另言「古古琢琢」即形容人非常滑稽、幽默的樣子。 例如：阿丑伯个表演當古琢，看个人全笑到佇毋著。","example":""},{"word":"掛屎掛尿","pinyin":"gua siiˋ gua ngiau","def":"未經篩選，一股腦兒地。 例如：佢去摘菜，掛屎掛尿，歸擔㧡等轉。","example":""},{"word":"砉砉滾","pinyin":"guag guag gunˋ","def":"形容皮鞋等硬物碰撞發出清脆的聲音。 例如：佢著雙新皮鞋，行路砉砉滾，遠遠就聽得著。","example":""},{"word":"砉硬","pinyin":"guag ngang","def":"堅硬貌。 例如：你摘个朳仔還砉硬，吂食得。","example":""},{"word":"弳弳","pinyin":"guangˊ guangˊ","def":"鼓凸貌。 例如：這地泥仰粉到弳弳，無平。","example":""},{"word":"弳起來","pinyin":"guangˊ hiˋ loiˇ","def":"因病態造成由內而外鼓起來的狀態。 例如：厥肚屎緊弳起來，怕異傷重吔。","example":""},{"word":"骨惹惹","pinyin":"gudˋ ngia ngia","def":"形容人很瘦，骨骼外露貌；形容骨頭很多。 例如：你係毋係有麼个病？係無仰會瘦到骨惹惹呢？ 例如：該種魚仔骨惹惹，愛細義食。","example":""},{"word":"骨頭打鼓","pinyin":"gudˋ teuˇ daˋ guˋ","def":"指人過世很久，埋在土裡的骨頭都能拿來當鼓打了，喻人死很久了。 例如：佢消忒完十年有哩，早就骨頭打鼓囉！","example":""},{"word":"耿耿","pinyin":"guenˋ guenˋ","def":"個性耿直的樣子。 例如：佢該耿耿个性體，逐擺講話就當會跌失人。","example":""},{"word":"淈汶","pinyin":"gug vunˇ","def":"水極為渾濁。 例如：這河壩水黃貢貢仔，看起來淈汶淈汶，當屙糟。","example":""},{"word":"轂","pinyin":"gugˋ","def":"動作快速；緊密。 例如：看該風車捩到恁轂，就知風當大。 例如：這索仔挼到當轂，盡砸。","example":""},{"word":"貢貢滾","pinyin":"gung gung gunˋ","def":"轟隆轟隆的聲響。 例如：迎神該下大鼓班打到貢貢滾，全毋驚會吵人。 例如：做大水該下，河壩水貢貢滾，當得人驚。","example":""},{"word":"狹極極仔","pinyin":"hab kid kid eˋ","def":"形容空間狹窄。比「狹狹仔」更窄。 例如：這間灶下狹極極仔，放毋落恁大个冰箱。","example":""},{"word":"狹狹仔","pinyin":"hab hab eˋ","def":"空間狹窄的樣子。 例如：這灶下狹狹仔，莫入來尖燒。","example":""},{"word":"焓燒","pinyin":"hem seuˊ","def":"燙熱、灼熱的感覺。 例如：這種天時，行在晒到焓燒个打馬膠地泥，愛著鞋正毋會熝著哦！","example":""},{"word":"緪繃繃仔","pinyin":"henˇ bang bang eˋ","def":"形容經濟拮据，或事情緊迫。 例如：阿秀想愛出國讀書，屋下緪繃繃仔，哪有錢好繳佢讀？","example":""},{"word":"後生窈窈","pinyin":"heu sangˊ ieuˋ ieuˋ","def":"形容年紀還很輕。 例如：你還後生窈窈吔，就這痛該痛，仰結煞正好？","example":""},{"word":"錐錐","pinyin":"zuiˊ zuiˊ","def":"形容容器盛的物品呈凸起尖尖的形狀，形容滿溢狀。 例如：阿光開精米所賣米，逐擺量斗就裝到錐錐，難怪恁多人愛摎佢交關。","example":""},{"word":"虛虛","pinyin":"hiˊ hiˊ","def":"脆弱，孱弱的樣子。 例如：這恁多日仔屙痢肚，歸隻人試著虛虛。","example":""},{"word":"顯當當仔","pinyin":"hienˋ dongˊ dongˊ eˋ","def":"裸露顯現的樣子。 例如：鎖匙就顯當當仔放在桌頂，仰般會尋毋著呢？","example":""},{"word":"顯顯","pinyin":"hienˋ hienˋ","def":"很明顯的樣子。例如「衫忒短，肚屎顯顯」。","example":""},{"word":"翹卻【卻起來】","pinyin":"hieuˊ hiogˋ【hiogˋ hiˋ loiˇ】","def":"平面板狀物翹起其中一邊的現象。 例如：這鉛筆盒仔个蓋仔翹卻忒，弇毋得。","example":""},{"word":"靴背爪癢","pinyin":"hioˊ boi zauˋ iongˊ","def":"隔靴搔癢。 例如：佢發表个意見做下係靴背爪癢，一息作用都無。","example":""},{"word":"卻卻","pinyin":"hiogˋ hiogˋ","def":"物品表面翹起的樣子。 例如：這樹皮分日頭晒啊去，兩片卻卻。 例如：這紙仔捲過嗄卻卻，舞毋會平。","example":""},{"word":"兇豺","pinyin":"hiungˊ saiˇ","def":"貪吃的樣子。 例如：莫恁兇豺驚食毋著樣仔，愛等阿爸先擎筷仔正做得食！","example":""},{"word":"好洩洩仔","pinyin":"hoˋ xied xied eˋ","def":"很適切，最好不過的，猶如說「好端端的」。 例如：該組事𠊎計畫到好洩洩仔，分你這兜搞躁啊去嗄亂淨淨吔。","example":""},{"word":"好死毋死","pinyin":"hoˋ xiˋ mˇ xiˋ","def":"該死的不死；很不湊巧。 例如：今晡日衫著較少，好死毋死，辦公室个冷氣開到恁冷，害𠊎險險寒著。","example":""},{"word":"吭吭滾","pinyin":"hong hong gunˋ","def":"聲響喧天。 例如：水泥廠个機器歸日仔吭吭滾，講話全聽無著。","example":""},{"word":"一一二二","pinyin":"idˋ idˋ ngi ngi","def":"詳詳細細。 例如：這件事情到底係仰仔發生个，你愛一一二二同𠊎報告。","example":""},{"word":"閕掰","pinyin":"hiaˊ baiˊ","def":"囂張。 例如：阿明伯還閕掰哦，做五十一就請人請到歸百張桌。","example":""},{"word":"一隔一跳","pinyin":"idˋ gagˋ idˋ tiau","def":"彼此相隔不連接。 例如：佢兩公婆一儕在南一儕在北，一隔一跳，當毋利便。 例如：這條河壩个石跳仔一隔一跳，行過去个時節愛細義。","example":""},{"word":"一頭一面","pinyin":"idˋ teuˇ idˋ mien","def":"滿頭滿臉。 例如：細人仔搞泥漿，舞到一頭一面就係泥。","example":""},{"word":"掖麻掖米","pinyin":"ie maˇ ie miˋ","def":"形容數量極多；人山人海。 例如：上阿里山个第一枋車，早早就掖麻掖米个人，尋無位仔坐。","example":""},{"word":"弛","pinyin":"ieˊ","def":"鬆弛，通常用來形容泥土、糕點等因太軟而坍塌的樣子。 例如：若麵糰忒發哩，發到弛開來吔。","example":""},{"word":"蝓膏","pinyin":"ieˇ goˊ","def":"指稱物品自然融化的現象。 例如：烏糖矻無封好勢蝓膏忒，看著就較毋想食。","example":""},{"word":"弛崗打陣","pinyin":"ieˊ gongˊ daˋ ciin","def":"成群結隊而來。 例如：尞日一到，弛崗打陣个人到這遶尞。","example":""},{"word":"蝓蝓","pinyin":"ieˇ ieˇ","def":"物體成黏稠滑溜的樣子。 例如：湖鰍仔歸身蝓蝓，愛捉佢無恁該。","example":""},{"word":"蝓蝓溚溚","pinyin":"ieˇ ieˇ dab dab","def":"滿是汁液，濕漉漉的樣子。 例如：你仰還像細人仔樣，食水果食到蝓蝓溚溚，還得人畏。","example":""},{"word":"圓律律仔（圓滾滾仔）","pinyin":"ienˇ ludˋ ludˋ eˇ (ienˇ kunˋ kunˋ eˇ)","def":"形容人長得福態矮胖很圓的樣子。","example":""},{"word":"夭夭","pinyin":"ieuˊ ieuˊ","def":"略帶水分而柔軟貌，也可形容物質未凝固之前的狀態。例如「夭夭个粄仔」、「夭夭个紅毛泥」。","example":""},{"word":"搖搖噹噹","pinyin":"ieuˇ ieuˇ dongˊ dongˊ","def":"物品鬆脫而搖晃的樣子。 例如：螺絲仔搖搖噹噹會㪐會㪐樣仔，愛撙緪來！","example":""},{"word":"陰著【愐著】","pinyin":"imˊ doˋ【menˋ doˋ】","def":"想到，屬於心中的猜測，比較接近往例。 例如：佢早就陰著你會來，斷真揣到準準。","example":""},{"word":"因由","pinyin":"inˊ iuˇ","def":"原因。 例如：佢這下會恁譴，定著有因由，過兩日仔你正問佢看啊。","example":""},{"word":"洧洧洧洧","pinyin":"ioˇ ioˇ io io","def":"水流不停的樣子，多用於形容口水或較細水流。 例如：嬰兒仔个口涎水洧洧洧洧，故所四隻月个時節愛同佢收涎。","example":""},{"word":"浴浴","pinyin":"iog iog","def":"因水浸泡而呈現整個溼透的樣子。 例如：衫褲愛先浸到浴浴，正較好洗。","example":""},{"word":"平平","pinyin":"piangˇ piangˇ","def":"土地地勢平順的樣子。","example":""},{"word":"幼骨","pinyin":"iu gudˋ","def":"細骨；體型骨架細小，其對稱為「粗骨」。 例如：秋刀魚有當多幼骨，你食个時節愛注意，莫哽著。 例如：阿姊生來幼骨，還合矮瘦矮瘦，顛倒看起來比𠊎還較後生。","example":""},{"word":"悠悠仔","pinyin":"iuˇ iuˇ eˋ","def":"心平氣和、悠閒自在地。 例如：你做事情毋使鬥緊，悠悠仔做斯好。","example":""},{"word":"有挷【有拚】","pinyin":"iuˇ bangˊ【iuˇ bia】","def":"雙方旗鼓相當，有得拚的意思。 例如：這場比賽，兩隊人馬都恁慶，看來斯有挷哦！","example":""},{"word":"柔柔仔","pinyin":"iuˇ iuˇ eˋ","def":"從容不迫，不疾不徐的樣子。 例如：離交貨个期限還恁久，大家柔柔仔做較工夫兜仔。","example":""},{"word":"油臘臘仔","pinyin":"iuˇ lab lab eˋ","def":"衣物、餐具沾染很多油脂的樣子。 例如：這隻盤仔洗過吔還係油臘臘仔，愛仰結煞正好？","example":""},{"word":"油㕸㕸仔","pinyin":"iuˇ leb leb eˋ","def":"油膩膩的。 例如：若頭那毛膏到油㕸㕸仔，愛去約會係無？","example":""},{"word":"油膩膩仔","pinyin":"iuˇ ni ni eˋ/iuˇ ne ne eˋ","def":"油膩膩的，亦可說「油漬漬仔」。 例如：鑊頭油膩膩仔，盡毋好洗。","example":""},{"word":"勻大勻細","pinyin":"iunˇ tai iunˇ se","def":"大小很平均，不會差距很大，亦可說「勻大勻大」。 例如：阿婆挼个雪圓仔，勻大勻細，實在還慶。","example":""},{"word":"嚌嚌啾啾","pinyin":"ji ji jiu jiu","def":"形容人多而嘈雜之聲。 例如：該片嚌嚌啾啾，敢係發生麼个事情？","example":""},{"word":"嗟嗟","pinyin":"jiaˇ jiaˇ","def":"無能、看不上眼的樣子。 例如：莫看這東西嗟嗟，佢斯當好用你知無？ 例如：你莫看佢嗟嗟，佢走起腳來斯無人逐得著哦！","example":""},{"word":"尖篤篤仔","pinyin":"jiamˊ dugˋ dugˋ eˇ","def":"物體外表呈現尖錐狀。 例如：阿西哥逐擺食飯，飯都添到尖篤篤仔，省使密密添。","example":""},{"word":"尖尖極極","pinyin":"jiamˊ jiamˊ kid kid","def":"非常擁擠。 例如：逐朝晨上班个時間，逐枋公車都尖尖極極。","example":""},{"word":"靚怪","pinyin":"jiangˊ guai","def":"尷尬、出糗；喻糟糕了。 例如：這擺就靚怪吔哪，開會時間伸五分鐘，聯絡主持人講還在屋下摸些。","example":""},{"word":"𠎷碎","pinyin":"sabˋ sui","def":"破到稀爛。","example":""},{"word":"漬漬灂灂","pinyin":"jid jid jiog jiog","def":"指在因水多而積水的路面行走所發出的聲響，亦可說「漬漬浙浙」。 例如：正落過大雨，斡對地下道去車頭，歸路仔漬漬灂灂有罅難行。","example":""},{"word":"節節仔","pinyin":"jiedˋ jiedˋ eˇ","def":"節省的。例「節節仔用」、「節節仔食」。","example":""},{"word":"箭著","pinyin":"jien doˋ","def":"為煞氣所衝或陽光所照。 例如：這屋分對面个電火楯箭著，故所愛吊隻八卦來化忒。 例如：分日頭箭著，擘目毋開。","example":""},{"word":"浸青","pinyin":"jim qiangˊ","def":"顏色很青綠。 例如：這蔥仔浸青，看起來當好食。","example":""},{"word":"踅踅","pinyin":"jioˋ jioˋ","def":"斜斜的、不正的樣子。 例如：排列仔排到踅踅，愛排正、排直來。 例如：這條路半中央開到踅踅，愛挷直來正看得。","example":""},{"word":"灂灂","pinyin":"jiog jiog","def":"水分過多。如「水粄炊到灂灂」。","example":""},{"word":"皺膣郎當","pinyin":"jiu ziiˊ longˇ dongˊ","def":"形容物皺巴巴不平整。 例如：衫搣到皺膣郎當，看得係無？去換過一領。","example":""},{"word":"啾紅","pinyin":"jiuˊ fungˇ","def":"很紅、深紅。 例如：生生个蝦公一落鑊，歸身變到啾紅，圓身也勼做一團。","example":""},{"word":"足水","pinyin":"jiugˋ suiˋ","def":"水分足夠；分量足夠。 例如：水田係足水，收成就會較好。","example":""},{"word":"跤梢","pinyin":"kaˊ sauˊ","def":"吝嗇；笨拙；低劣。（閩南語借詞） 例如：仰會恁跤梢，連粢粑仔都毋盼得分人食。","example":""},{"word":"嶇嶇","pinyin":"kiˊ kiˊ","def":"形容坡度陡。 例如：這條崎嶇嶇，騎自行車毋好直接溜啊下。","example":""},{"word":"奇巧","pinyin":"kiˇ kauˋ","def":"奇巧、特別的。 例如：厥店項个水果包山塞海，麼个奇巧个就有。","example":""},{"word":"胠鬚","pinyin":"kia xiˊ","def":"毛筆的毛或毛髮分岔。","example":""},{"word":"岐嶷","pinyin":"kiaˊ ngiaˋ","def":"聰明能幹的樣子，常用於讚美年輕人或婦女。 例如：阿美異岐嶷，怪毋得大家愛選佢做班長。","example":""},{"word":"極極","pinyin":"kid kid","def":"擁擠的樣子。例如「尖到極極」。","example":""},{"word":"極手極腳","pinyin":"kid suˋ kid giogˋ","def":"喻空間不大，手腳活動都受到限制。 例如：你這兜細人仔，去別位尞，毋好在這極手極腳。 例如：間房忒狹，做麼个事都極手極腳。","example":""},{"word":"缺缺","pinyin":"kiedˋ kiedˋ","def":"指玻璃、陶瓷類之容器有破損或缺角。 例如：這隻碗缺缺，毋好過用哩，係無割啊著無結無煞。","example":""},{"word":"缺齾","pinyin":"kiedˋ ngadˋ","def":"器物有小缺口。","example":""},{"word":"健操","pinyin":"kien cau","def":"康健有神的樣子。 例如：佢九十歲吔，還真健操，行路盡遽。","example":""},{"word":"阻阻隔隔（阻阻擋擋）","pinyin":"zuˋ zuˋ gagˋ gagˋ (zuˋ zuˋ dongˋ dongˋ)","def":"很多障礙。 例如：任何个阻阻隔隔都擋毋核佢出國留學个決心。","example":""},{"word":"豬頭面","pinyin":"zuˊ teuˇ mien","def":"喻人生氣時頭臉都漲紅。 例如：佢這儕人，譴啊去就變豬頭面，你斯莫挑挑去惹佢。","example":""},{"word":"𤸁苶苶仔","pinyin":"kioi ngiab ngiab eˋ","def":"極為疲憊的樣子。 例如：今晡日做事做到𤸁苶苶仔，天光日無想愛去哩。","example":""},{"word":"虯虯","pinyin":"kiuˇ kiuˇ","def":"（毛）捲捲的。","example":""},{"word":"靠靠","pinyin":"ko ko","def":"原指顴骨突出，比喻裸露突出的樣子。例如「面頰卵靠靠」、「壁項个石頭靠靠」。","example":""},{"word":"囥泥空【庰泥窿】","pinyin":"kong naiˇ kungˊ【biang naiˇ lungˊ】","def":"喻死去了。","example":""},{"word":"苦煎煎仔","pinyin":"kuˋ jienˊ jienˊ eˋ","def":"形容窮苦無錢。 例如：你該間屋買啊去，這下苦煎煎仔，想愛出國去遶尞怕無恁該哩。","example":""},{"word":"孔孔","pinyin":"kungˋ kungˋ","def":"形容翹得高高的樣子。 例如：細人仔屙屎過後，屎胐孔孔，愛人𢯭手捽屎胐。","example":""},{"word":"孔孔翹翹【覂覂翹翹】","pinyin":"kungˋ kungˋ kieu kieu【fungˋ fungˋ kieu kieu】","def":"顛簸不平的樣子；或走路不穩，一跛一跛的樣子。 例如：這條石崎路孔孔翹翹，你愛行好勢。 例如：厥腳分車仔撞著，這下行路孔孔翹翹。","example":""},{"word":"罅咈","pinyin":"la fud","def":"常用在做不到、很難達成的事務上。 例如：上回選舉佢落選，這擺過選，還係罅咈哦！","example":""},{"word":"罅力","pinyin":"la lid","def":"力道夠。 例如：吾哥係委員會个委員，佢講話異罅力。","example":""},{"word":"裸裸倒貶","pinyin":"laˋ laˋ do bienˋ【ladˋ ladˋ do bienˋ】","def":"反面，亦可說「裸裸貶」、「裸裸反」、「裸面」。 例如：佢為著赴該枋車仔，衫嗄著到裸裸倒貶，還見笑。","example":""},{"word":"臘醢醢仔","pinyin":"lab goiˇ goiˇ eˋ","def":"形容皺褶多、不平整，多用於衣物。 例如：衫褲著到臘醢醢仔，愛拿去漿過、熨過，著等正毋會分人笑無下落。","example":""},{"word":"邋邋磕磕","pinyin":"lab lab kab kab","def":"不平安。 例如：這恁久仔，該房个人相賽出事，正經係邋邋磕磕。","example":""},{"word":"躐熟","pinyin":"labˋ sug","def":"滾瓜爛熟。 例如：這課𠊎背到躐熟吔，你考𠊎毋橫。","example":""},{"word":"瘌瘌刻刻","pinyin":"ladˋ ladˋ kadˋ kadˋ","def":"疤痕累累、表面不平整的樣子。 例如：這張桌分人搣到瘌瘌刻刻，用毋得吔。","example":""},{"word":"歷史（歷載）","pinyin":"lag saiˋ (lag zai)","def":"底細。（閩南語借詞） 例如：該人毋係好東西，厥歷史大家就知知。","example":""},{"word":"犁犁","pinyin":"laiˇ laiˇ","def":"低垂的樣子。 例如：柑仔打到當結，連樹椏都墜到犁犁吔！","example":""},{"word":"爛瓠勺","pinyin":"lan puˇ sog","def":"喻不堪使用的東西，也可比喻人。 例如：擇來擇去，擇著一隻爛瓠勺。","example":""},{"word":"爛扇多風","pinyin":"lan san doˊ fungˊ","def":"物雖破舊，卻頗有用處，一般用於「對人而言」，指人不可貌相、不可以貌取人；源自「才人無貌，爛扇多風」。","example":""},{"word":"爛巴漬灂","pinyin":"lan baˊ jid jiog","def":"泥濘的樣子。","example":""},{"word":"爛醢醢（綿醢醢）","pinyin":"lan goiˇ goiˇ (mienˇ goiˇ goiˇ)","def":"形容破爛不堪貌。 例如：布袋爛醢醢，用毋得吔。","example":""},{"word":"亮線","pinyin":"lang xien","def":"整齊亮麗。 例如：阿哥逐日上班，都著到亮線亮線。","example":""},{"word":"冷冷浸浸","pinyin":"langˊ langˊ jim jim","def":"指天氣寒涼，亦可說「冷浸冷浸」。 例如：天時冷冷浸浸，愛著加一領較妥當。","example":""},{"word":"冷落","pinyin":"langˊ log","def":"冷冷清清，亦可說「冷冷落落」、「冷落冷落」。 例如：開會出席个人忒少，場面有一息仔冷落。","example":""},{"word":"零零㪐㪐","pinyin":"langˇ langˇ ludˋ ludˋ/longˇ longˇ ludˋ ludˋ","def":"零碎斷續的樣子，斷斷續續。 例如：這擺錄音零零㪐㪐，怕用毋得。 例如：桌席還吂食忒，人客就零零㪐㪐先行吔。","example":""},{"word":"㕸㕸涉涉","pinyin":"leb leb zeb zeb","def":"因水分多而呈現濕漉漉的樣子，常用於形容本身濕漉漉的地面因受外力踩踏後之狀態。 例如：正落過水个泥漿路㕸㕸涉涉，盡難行。","example":""},{"word":"釐絲仔","pinyin":"liˇ xiˊ eˋ","def":"形容細微。 例如：差著該釐絲仔定定，有麼个好計較？","example":""},{"word":"粒粒精","pinyin":"liab liab jinˊ","def":"顆顆或每粒都是精實飽滿。 例如：該婦人家買个棗仔粒粒精，逐粒都係擇過个。","example":""},{"word":"稴稴斜","pinyin":"liam liam qia","def":"傾斜。 例如：這山仔恁樣稴稴斜，看起來有兜仔得人驚。","example":""},{"word":"裂裂","pinyin":"lied lied","def":"裂開得嚴重的樣子。 例如：地動過後，紅毛泥坪歸片仔搖到裂裂。","example":""},{"word":"涼涼仔","pinyin":"liongˇ liongˇ eˋ","def":"從容不迫地、輕鬆輕鬆地，事情簡單容易。 例如：這兜事頭對𠊎來講係輕可事，涼涼仔做就好。","example":""},{"word":"犖","pinyin":"lo","def":"稀疏。如「網仔忒犖」表網子間的空隙太大。 例如：蒔田愛蒔較犖兜仔，禾仔正會較壯旺。","example":""},{"word":"犖犖仔","pinyin":"lo lo eˋ","def":"稀疏貌；斷斷續續。 例如：委菜仁毋好委忒賁，犖犖仔就做得。 例如：這下腳毋方便，毋敢恁輒去街路，犖犖仔定定。","example":""},{"word":"犖花犖花","pinyin":"lo faˊ lo faˊ","def":"稀稀疏疏的樣子。 例如：風搓過後，柚仔花開到犖花犖花，打無多。 例如：今年个梅樹犖花犖花，愛食梅仔驚怕難哩喲！","example":""},{"word":"犖行犖行","pinyin":"lo hongˇ lo hongˇ","def":"行距很大的樣子。 例如：你這擺種菠麗菜，犖行犖行就好，正會生較大頭。","example":""},{"word":"犖粒犖粒","pinyin":"lo liab lo liab","def":"顆粒稀疏的樣子。可依照形容之物品調整量詞。 例如：今年柑仔打毋結，犖粒犖粒，怕會種毋著來賣哦！","example":""},{"word":"老翹翹仔","pinyin":"loˋ kieu kieu eˋ/loˋ kiau kiau eˋ","def":"老老的，亦可形容人年紀大。 例如：菜頭過熟老翹翹仔，煲毋得酪來食。","example":""},{"word":"老齧齧","pinyin":"loˋ ngadˋ ngadˋ","def":"形容人很老的樣子。 例如：莫看佢老齧齧，佢行路都毋使人扶等。","example":""},{"word":"勞碌","pinyin":"loˇ lugˋ","def":"勞苦與忙碌。 例如：屋下恁多兄弟姊妹，就佢盡勞碌，一年透天無時閒轉老屋。","example":""},{"word":"落著","pinyin":"log cog","def":"著落、事情的歸宿。 例如：阿明這駁仔尋頭路，到今還無落著。","example":""},{"word":"落針毋得","pinyin":"log ziimˊ mˇ dedˋ","def":"無處插針，喻密集得沒有間隙。「落腳毋得」也是相同用法。 例如：公車肚淰淰个人，落針毋得吔，你還想愛尖入去。","example":""},{"word":"落喪","pinyin":"log song","def":"失敗、不得志的樣子。也可說「落喪落喪」。 例如：佢生理失敗，恁久看著當落喪。","example":""},{"word":"落威","pinyin":"log viˊ","def":"失勢的樣子。 例如：這官員下臺以後，看起來當落威。","example":""},{"word":"犖犖确确","pinyin":"logˋ logˋ kogˋ kogˋ","def":"破舊鬆脫的樣子。 例如：老自行車犖犖确确，騎毋得吔，送去資源回收場。","example":""},{"word":"朗朗滾","pinyin":"long long gunˋ","def":"形容聲音嘹亮。 例如：三更半夜講話講到朗朗滾，毋驚吵人睡目係無？","example":""},{"word":"㝗㝗㝩㝩","pinyin":"long long kong kong","def":"空洞、過於寬鬆，用於衣物及器具。 例如：褲恁大條，著到㝗㝗㝩㝩，盡壞看。","example":""},{"word":"朗天朗地","pinyin":"long tienˊ long ti","def":"喻聲音響亮。","example":""},{"word":"朗朗膨膨","pinyin":"long long pong pong","def":"形體很大，卻鬆散而不夠紮實的樣子。 例如：分人請你還著到朗朗膨膨，當像著睡衫你知無？","example":""},{"word":"狼離狼犁【狼狼攋攋】","pinyin":"longˇ liˇ longˇ laiˇ【longˇ longˇ lai lai】","def":"形容物品沒有收拾，凌亂不堪。 例如：食酒過後个桌仔，狼離狼犁。","example":""},{"word":"路數","pinyin":"lu su","def":"途徑、步驟、技巧。 例如：你還有麼个路數，盡量展出來。","example":""},{"word":"樐樐鼓鼓","pinyin":"luˋ luˋ guˋ guˋ","def":"衣服穿太多，一層一層沒穿整齊的情形。 例如：老弟衫褲著到樐樐鼓鼓，愛洗身該下顛倒脫毋得下。","example":""},{"word":"鹵膏捱屎","pinyin":"luˊ goˊ ngai sai","def":"汙垢很多，髒兮兮的。 例如：你一身鹵膏捱屎，無人敢同你共下坐。","example":""},{"word":"律不","pinyin":"lud bud","def":"骯髒、邋遢不堪的樣子，亦可說「律律不不」。 例如：有兜人律不慣吔，㓾豬也這身，拜佛也這身。","example":""},{"word":"㪐核","pinyin":"ludˋ fud","def":"吃有核的水果時，果肉與果核容易分離。㪐核，通常表示水果已經成熟，如龍眼。也用以比喻事情容易完成或取得。","example":""},{"word":"擂落去","pinyin":"luiˇ log hi","def":"傾力去做，一頭栽入。","example":""},{"word":"窿窿空空","pinyin":"lungˇ lungˇ kungˊ kungˊ","def":"形容內部空空洞洞，不結實貌。 例如：恁大隻个冰箱麼个就無，窿窿空空恁無採。","example":""},{"word":"毋係搞","pinyin":"mˇ he gauˋ","def":"不是在開玩笑的，很危險之意。 例如：船仔係無燈塔，就會尋毋著方向來入港，這毋係搞个。","example":""},{"word":"默默仔","pinyin":"mad mad eˋ/madˋ madˋ eˇ","def":"默不作聲地。 例如：龜仔毋驚人笑，默默仔行，總算分佢行到終點。","example":""},{"word":"慢行快到","pinyin":"man hangˇ kuai do","def":"穩步的走，反而容易到達。","example":""},{"word":"蠻皮","pinyin":"manˇ piˇ","def":"因適應而沒效果、習以為常，亦可使用於藥效之效果減弱。 例如：細人仔毋好動啊著就打，會蠻皮忒哦！","example":""},{"word":"渺渺茫茫","pinyin":"meuˋ meuˋ mongˇ mongˇ","def":"遠而不明的樣子。 例如：昨暗晡發夢夢著過身个阿婆，毋過渺渺茫茫，摸佢毋著。","example":""},{"word":"密【密蒙】","pinyin":"miˊ【miˊ mangˊ】","def":"緊密無縫隙。如「門關密來」即把門關緊關密，「蓋仔弇密來」即把蓋子蓋密。 例如：木匠師傅做个碗櫥，歸槓都當密，恁樣正毋會分黃蚻走入去。","example":""},{"word":"抺籮抺𥯥","pinyin":"miˇ loˇ miˇ cab","def":"籮與𥯥是盛稻米的容器；擦拭籮與𥯥，使人看來很忙，卻沒有明顯的事功，形容非常忙碌或匆匆忙忙的樣子，也引申為裝作很忙的樣子，亦可說「抺鏍抺鑔」。 例如：年三夜四个時節，大家人抺籮抺𥯥，當無閒。","example":""},{"word":"微末","pinyin":"miˇ mad","def":"形容微細。 例如：為著鼻屎蒂仔微末事，兩儕嗄逆著，事後知差乜來毋掣吔！","example":""},{"word":"微毛末節","pinyin":"miˇ moˊ mad jiedˋ","def":"形容微細的事情。 例如：出國个行程先大概仔捉一下，微毛末節正定定仔來安排。","example":""},{"word":"微微末末","pinyin":"miˇ miˇ mad mad","def":"瑣碎。重疊用法有加強的意義。 例如：無上班，屋下生事微微末末，盡有好搣。","example":""},{"word":"綿綿酪酪","pinyin":"mienˇ mienˇ logˋ logˋ","def":"食物煮到熟爛的程度。 例如：這豬腳煲到綿綿酪酪，一等好食！","example":""},{"word":"毛虯虯","pinyin":"moˊ kiuˇ kiuˇ","def":"毛髮卷曲的樣子。 例如：該隻人公仔毛虯虯，目珠大大粒，當得人惜。","example":""},{"word":"毛鬞鬞","pinyin":"moˊ nungˇ nungˇ","def":"頭髮雜亂。 例如：佢吂梳頭那毛，還毛鬞鬞就愛出門，恁樣當失禮。","example":""},{"word":"毛鬅鬅仔","pinyin":"moˊ pangˇ pangˇ eˋ","def":"頭髮蓬鬆的樣子。 例如：若頭那毛電到毛鬅鬅仔，面看起來細加當多。","example":""},{"word":"毛披披仔","pinyin":"moˊ paiˊ paiˊ eˋ","def":"披頭散髮的樣子，用於長髮者。 例如：三更半夜毋好毛披披仔行出來，會嚇著人。","example":""},{"word":"無比止","pinyin":"moˇ biˋ ziiˋ","def":"無法比較。 例如：靚媸無比止，中意較慘死。","example":""},{"word":"無抽無間","pinyin":"moˇ cuˊ moˇ gienˊ","def":"指做事不夠周延、用心和積極，亦可說「無抽間」。 例如：牙齒痛愛去分先生看，做毋得無抽無間，拖久會還較嚴重。","example":""},{"word":"無運","pinyin":"moˇ iun","def":"運氣不好。 例如：別人好運，種麼个就有價，佢無運，種麼个就了淨淨。","example":""},{"word":"無額","pinyin":"moˇ ngiagˋ","def":"分量不足、不夠，未達到所需求的標準。 例如：歸抓仔个青菜炒啊去，伸一細盤，還無額。","example":""},{"word":"無就罔哪","pinyin":"moˇ qiu mongˋ naˊ","def":"聊勝於無。 例如：雖然講毋係異好食，無就罔哪！食兩口仔乜好。","example":""},{"word":"無時恬","pinyin":"moˇ siiˇ diamˊ","def":"靜不下來。 例如：細人仔食乳該下蠕蠕動，無時恬，揇就毋核。","example":""},{"word":"無時無節","pinyin":"moˇ siiˇ moˇ jiedˋ","def":"不定時或隨時，喻搞不清楚時間場合、無法把握適當的時刻或機會。 例如：無時無節，你在該打麼个紙炮仔？當吵你知無？","example":""},{"word":"無慆","pinyin":"moˇ tau","def":"無意義、無趣味。 例如：這擺旅行，大部分時間在坐車仔，還無慆哪！","example":""},{"word":"無漦用","pinyin":"moˇ xiauˇ iung","def":"毫無用處。 例如：畜你畜到恁大，三兩重就毋停動，無漦用啦！","example":""},{"word":"無時閒","pinyin":"moˇ siiˇ hanˇ","def":"無法靜下來、沒有空閒的時間，用以表示很忙的樣子。 例如：四、五歲仔个細人仔像蠕屎蟲樣仔蠕蠕鑽，無時閒。 例如：六月天公，大家做到無時閒。","example":""},{"word":"罔靚","pinyin":"mongˋ jiangˊ","def":"蠻漂亮的。","example":""},{"word":"罔罔仔","pinyin":"mongˋ mongˋ eˇ","def":"還不錯。 例如：這條牛仔罔罔仔，聽話又耐操。","example":""},{"word":"歿綿","pinyin":"mud mienˇ","def":"稀巴爛。 例如：好好个西瓜拿來擲到歿綿，扡都扡毋起來。","example":""},{"word":"眼白白仔","pinyin":"ngienˋ pag pag eˋ","def":"眼睜睜地。","example":""},{"word":"目𥉌𥉌仔","pinyin":"mugˋ dabˋ dabˋ eˇ","def":"眼皮沉重想睡的樣子。 例如：嬰兒仔目𥉌𥉌仔，緊食乳緊睡目。","example":""},{"word":"目瞌瞌仔","pinyin":"mugˋ kabˋ kabˋ eˇ","def":"因疲倦而眼皮下垂、想睡的樣子，引申為沒看清楚的樣子，亦可說「目弇弇仔」。 例如：𠊎昨暗晡噩夜，今晡日上課目瞌瞌仔，緊想愛睡。 例如：簽約目珠愛擘金，毋好目瞌瞌仔斯簽落去。","example":""},{"word":"邋邋涉涉","pinyin":"lab lab sab sab","def":"拉拉雜雜，零零碎碎。 例如：年到哩，屋肚邋邋涉涉，清清忒去。","example":""},{"word":"目屎浙濟","pinyin":"mugˋ siiˋ zab ze","def":"滿眼眼屎的樣子。 例如：阿姆哀！目屎浙濟還敢去學校，自家去照鏡仔看啊咧！","example":""},{"word":"目側側仔","pinyin":"mugˋ zedˋ zedˋ eˇ","def":"指側眼看的樣子，該動作亦有鄙視他人的樣子。 例如：毋好目側側仔看人，恁樣當無禮貌。","example":""},{"word":"濛線","pinyin":"mungˇ xien","def":"形容邈遠模糊；多得像霧般遮蔽天空，引申為嚴重、極點。 例如：驚阿姆喊佢洗碗，老弟食啊飽就走到濛線。 例如：今晡日發月給，半路仔嗄跌忒，轉去分吾餔娘刻到濛線。","example":""},{"word":"耐囥","pinyin":"nai kong","def":"指物品可以儲藏很長的時間；也可用來形容人。 例如：係講這包起來放冰箱，比無放冰箱還較耐囥。","example":""},{"word":"囊囊矻矻（一囊一矻）","pinyin":"nangˇ nangˇ kid kid (idˋ nangˇ idˋ kid)","def":"外觀看起來凹凸不平的樣子。 例如：若袋仔裝恁多麼个啊！仰看起來囊囊矻矻？","example":""},{"word":"鬧揌揌","pinyin":"nau caiˇ caiˇ","def":"鑼鼓喧天的熱鬧景象，形容非常熱鬧。 例如：莊肚做大戲，鬧揌揌。","example":""},{"word":"餒忒【餒核】","pinyin":"neˊ tedˋ【neˊ hedˋ】","def":"形容事物衰退或萎縮。 例如：火餒忒哩！遽遽窿兜仔樵落去。 例如：冬瓜當瓜鬼，打个子做毋得分人揬著，揬啊過跈等就會餒忒。","example":""},{"word":"腍腍","pinyin":"nemˇ nemˇ","def":"內部熟爛的樣子。 例如：若這疔仔腍腍哩，肚項怕貢膿吔。 例如：這粒梨仔腍腍哩，肚項怕熟忒哩。","example":""},{"word":"淰盆淰缽","pinyin":"nemˊ punˇ nemˊ badˋ","def":"容器皆盛滿的樣子。 例如：阿姆煮个雞湯裝到淰盆淰缽，就係毋驚人食。","example":""},{"word":"淰淰浡浡","pinyin":"nemˊ nemˊ pud pud","def":"形容盛滿盈溢的樣子，通常指容物超出容器而將要溢出的狀態。也可說「淰浡浡」或「浡淰」。 例如：阿庚嫂實在還細義，送𠊎一碗公淰淰浡浡个黃豆豉。","example":""},{"word":"腍濟腍濟","pinyin":"nemˇ jiˇ nemˇ jiˇ","def":"物體膨膨軟軟，摸起來帶彈性的感覺。 例如：這粒番檨看起來靚靚，摸起來腍濟腍濟，裡肚怕會過潦吔。","example":""},{"word":"醹合汔","pinyin":"neuˇ gagˋ kied","def":"汁液濃稠，用於指好運或好事接踵而來。 例如：這擺斯醹合汔吔，討餔娘又降倈仔。","example":""},{"word":"醹膠膠","pinyin":"neuˇ gaˇ gaˇ","def":"指澱粉類的食品，透過工具攪拌變濃稠狀。 例如：麥片浸滾水用湯匙摝到醹膠膠，𠊎試著味道異好。","example":""},{"word":"牙裡牙射","pinyin":"ngaˇ liˊ ngaˇ sa","def":"形容物品參差不齊，尖銳突出的樣子。 例如：這東西正做啊好，還吂修邊，牙裡牙射。","example":""},{"word":"牙研目皺","pinyin":"ngaˇ ngienˇ mugˋ jiu","def":"咬著牙根，眉頭緊鎖，一種痛苦的表情。 例如：恁酸个李仔，食到牙研目皺。","example":""},{"word":"牙絲絲仔","pinyin":"ngaˇ xiˊ xiˊ eˋ","def":"牙齒微露貌，指得意愉快的笑貌或因寒冷或疼痛而牙齒微露。 例如：阿榮牯恁久逐日就牙絲絲仔，敢怕係著著彩券。","example":""},{"word":"齾調","pinyin":"ngadˋ tiau","def":"節制與準則。 例如：做事情愛有齾調，毋好儘採搣。","example":""},{"word":"臬羴【臬味】","pinyin":"ngadˋ hien【ngadˋ mi】","def":"臭味的一種，屬臭蟲的臭味，例如「䗆蜱臬」。或陳腐的油味，例如「油臬」。 例如：佢當久無洗身，乜無換衫褲，臬羴當重。","example":""},{"word":"硬拚拚仔","pinyin":"ngang biang biang eˋ","def":"硬邦邦的，指人不知變通。 例如：佢這人硬拚拚仔，全無法度參詳。","example":""},{"word":"硬程","pinyin":"ngang cangˇ","def":"物質硬朗、結實；亦可指精神或個性威武不屈。 例如：阿公太九十零歲吔，身體還異硬程。 例如：該隻法官當硬程，辦案鐵面無私。","example":""},{"word":"硬仃仃仔","pinyin":"ngang dangˊ dangˊ eˋ【ngang diangˊ diangˊ eˊ】","def":"形容堅硬之物，多用於形容食物。 例如：這朳仔硬仃仃仔，阿公咬毋落。","example":""},{"word":"硬結結仔","pinyin":"ngang giedˋ giedˋ eˇ","def":"形容硬朗結實，或指東西太硬。 例如：佢逐日去河壩脣騎自行車，騎到腳囊肚硬結結仔。","example":""},{"word":"硬確確仔","pinyin":"ngang kog kog eˋ","def":"堅硬如石的樣子。 例如：豬肉冰到硬確確仔，愛等佢退冰正做得切。","example":""},{"word":"咬薑啜醋","pinyin":"ngauˊ giongˊ codˋ cii","def":"喻生活儉苦，三餐以薑、醋拌飯過活。 例如：頭擺人無恁多頭路好做，輒常咬薑啜醋，圖過三餐。","example":""},{"word":"聱梨竵瓜","pinyin":"ngauˇ liˇ feˋ guaˊ","def":"歪斜不正的樣子，可用於形容物品，亦可形容字體。 例如：老弟寫字，正開始寫到聱梨竵瓜，背尾緊寫緊靚。","example":""},{"word":"惹惹杈杈","pinyin":"ngia ngia ca ca","def":"形容條枝物品橫七豎八、不整齊的樣子；形容多方阻礙的樣子。 例如：竹園裡肚惹惹杈杈，行人毋得。","example":""},{"word":"惹眼","pinyin":"ngiaˊ ngienˋ","def":"引人注意。 例如：佢著一條短褲，屎胐走出出，異惹眼。","example":""},{"word":"凹凹","pinyin":"ngiabˋ ngiabˋ","def":"形容凹陷不盈滿。 例如：若車輪仔仰看起來凹凹，敢係分鐵釘仔刺著？","example":""},{"word":"黏核核","pinyin":"ngiamˇ hed hed","def":"黏得很緊。 例如：阿華厥老妹當好跈，連屙堆尿就黏核核。","example":""},{"word":"黏黏吊吊","pinyin":"ngiamˇ ngiamˇ diau diau","def":"形容牽連拖累的樣子。 例如：佢一群大細黏黏吊吊，生活異辛苦。","example":""},{"word":"黏黏浹浹","pinyin":"ngiamˇ ngiamˇ giabˋ giabˋ","def":"又濕又黏的感覺。 例如：糖水倒到桌頂，一下仔就黏黏浹浹，係無捽淨會餳蟻公。 例如：熱天緊出汗，歸身仔黏黏浹浹，異毋鬆爽。","example":""},{"word":"嚴條","pinyin":"ngiamˇ tiauˇ","def":"規定嚴格。","example":""},{"word":"入軟丟韌","pinyin":"ngib ngionˊ diuˊ ngiun","def":"表面柔軟，內部堅韌。 例如：該隻人入軟丟韌，想愛摎佢交涉生理方面个條件，無恁該落窠！","example":""},{"word":"入骨","pinyin":"ngib gudˋ","def":"深入骨裡，比喻到極點。 例如：寒流來，外背正八度定定，正式會寒到入骨。","example":""},{"word":"入軟","pinyin":"ngib ngionˊ","def":"形容物品十分柔軟，尤指食物；也可形容聲音柔和。 例如：這粢粑仔入軟，當好食。 例如：電臺个主持人，聲音入軟，聽著心情就當好。","example":""},{"word":"眼贅贅仔","pinyin":"ngienˋ zui zui eˋ","def":"眼皮紅腫的樣子，可用於哭泣或煙燻到。","example":""},{"word":"眼剷剷仔","pinyin":"ngienˋ canˋ canˋ eˋ","def":"眼珠翻白微微向上直視的樣子。 例如：佢正橫啊下，跈等就眼剷剷仔，大家遽遽送佢去醫院。","example":""},{"word":"眼契契仔","pinyin":"ngienˋ kie kie eˋ","def":"勉強支撐的眼神。 例如：佢一暗晡無睡目，食飯食到眼契契仔。","example":""},{"word":"眼呆呆","pinyin":"ngienˋ ngoiˇ ngoiˇ","def":"眼神呆滯。 例如：阿丑同阿旦當會弄，大家看到眼呆呆。","example":""},{"word":"人暈氣散","pinyin":"nginˇ funˇ hi san","def":"暈厥、氣欲絕的樣子。 例如：厥倈仔三兩日就惹一條大事出來，佢譴到人暈氣散。","example":""},{"word":"人困馬渴","pinyin":"nginˇ kun maˊ hodˋ","def":"喻全體都已疲憊不堪。 例如：這擺工程忒複雜，搣到人困馬渴。","example":""},{"word":"弱漬漬仔","pinyin":"ngiog jid jid eˇ","def":"身體孱弱的樣子。 例如：請个工人弱漬漬仔，愛仰般做田事？","example":""},{"word":"軟斗","pinyin":"ngionˊ deuˋ","def":"喻事情很容易，亦可說「軟籽」；反義詞「硬斗」、「硬籽」則表困難。 例如：這種頭路對你來講盡軟斗，愛使出麼个力？","example":""},{"word":"軟怠怠仔","pinyin":"ngionˊ taiˋ taiˋ eˇ","def":"身體有氣無力的樣子。 例如：三餐無食，餓到軟怠怠仔。","example":""},{"word":"軟摺摺仔","pinyin":"ngionˊ zab zab eˋ","def":"人看起來軟趴趴、無力或不中用的。 例如：做人男仔人，愛硬程，毋好軟摺摺仔。","example":""},{"word":"軟粢搭碓","pinyin":"ngionˊ qiˇ dabˋ doi","def":"喻軟綿綿的，無法著力的樣子。 例如：嬰兒仔正降啊出，軟粢搭碓，揇佢該下愛細義。","example":""},{"word":"軟頭扁摺","pinyin":"ngionˊ teuˇ bienˋ zabˋ","def":"嬌弱可憐的樣子。 例如：該隻細妹仔，在男朋友面前，挶到軟頭扁摺，看著會起雞嫲皮唷！","example":""},{"word":"牛拖車載","pinyin":"ngiuˇ toˊ caˊ zoi","def":"喻運用的物品數量極多。 例如：厥屋下个書當多，搬屋該下，牛拖車載就還搬毋得忒。","example":""},{"word":"肉凸凸仔","pinyin":"ngiugˋ tied tied eˋ","def":"形容人肌肉飽滿凸出的樣子。 例如：你看你肉凸凸仔，還敢盡命牯食恁多碗。 例如：佢著个衫忒細領，肉凸凸仔，分人看現現。","example":""},{"word":"肉卒卒仔","pinyin":"ngiugˋ zud zud eˋ","def":"形容人體態肥胖多肉的樣子，亦可說「肉粽粽仔」。 例如：這個細人仔肉卒卒仔盡得人惜。","example":""},{"word":"肉雋雋仔","pinyin":"ngiugˋ zun zun eˋ","def":"形容人體態結實多肉的樣子。 例如：你講佢當窮苦？你看佢肉雋雋仔，仰會窮苦？","example":""},{"word":"註死","pinyin":"zu xiˋ","def":"注定死亡，喻倒楣透了。","example":""},{"word":"韌習習仔","pinyin":"ngiun xibˋ xibˋ eˋ","def":"很有韌性的樣子，語意多用於正向。","example":""},{"word":"忍嘴","pinyin":"ngiunˊ zoi","def":"戒口、忍住不亂吃。 例如：洗腰仔个人愛忍嘴，像楊桃汁就食毋得。 例如：胃潰瘍个人，食東西愛當忍嘴。","example":""},{"word":"冗冗","pinyin":"ngiung ngiung","def":"沒有綁緊或是衣物寬鬆。 例如：佢這駁仔瘦啊去，褲嗄變到冗冗。 例如：勼帶仔用久吔，變到冗冗。","example":""},{"word":"冗線","pinyin":"ngiung xien","def":"寬鬆、不擁擠。 例如：今晡日坐早一枋車去，較冗線。 例如：今晡日歸日仔正恁多事好做，當冗線。","example":""},{"word":"濃濃","pinyin":"ngiungˇ ngiungˇ/nungˇ nungˇ","def":"雜亂或煙霧瀰漫貌。 例如：火煙濃濃，當侷人。","example":""},{"word":"哦哦哦哦","pinyin":"ngoˊ ngoˊ ngoˋ ngoˋ","def":"講話語焉不詳，言詞恍惚，非天生狀態。 例如：阿全叔公倒床忒久吔，講話變到哦哦哦哦，聽毋真。 例如：佢分人請，啉到轉酒，講話哦哦哦哦，聽毋識講麼个。","example":""},{"word":"戇𠕆戇𠕆","pinyin":"ngong xioˇ ngong xioˇ","def":"傻呼呼的。 例如：佢這人戇𠕆戇𠕆，逐項事情愛人一項一項教。","example":""},{"word":"戇霸","pinyin":"ngong ba","def":"大而笨拙、不靈活的樣子，亦可說「戇霸戇霸」。 例如：該隻細倈仔看起來戇霸戇霸，毋過當會做事。","example":""},{"word":"戇嗲戇嗲【戇趖戇趖】","pinyin":"ngong de ngong de【ngong soˇ ngong soˇ】","def":"個性呆愚的樣子。 例如：該後生仔戇嗲戇嗲，無人愛同佢結婚。","example":""},{"word":"戇當","pinyin":"ngong dong","def":"呆愚、傻呼呼，亦可說「戇戇當當」、「戇當戇當」。 例如：仰恁戇當？借錢分這種人，毋使想愛拿轉來哩。","example":""},{"word":"芮芮仔","pinyin":"niu niu eˋ","def":"細小貌。","example":""},{"word":"嫩習習仔","pinyin":"nun xibˋ xibˋ eˇ","def":"幼嫩，可以指植物很嫩，也可以指人很年輕。 例如：朝晨摘个角菜嫩習習仔，兩下半就賣忒哩。 例如：阿輝伯姆六十零歲還嫩習習仔，敢怕有食仙桃正得。","example":""},{"word":"鬞交交仔","pinyin":"nungˇ gauˇ gauˇ eˋ","def":"散亂的樣子，例如「東西鬞交交仔」、「頭那毛鬞交交仔」、「頭路鬞交交仔」，亦可說「鬞鬅鬅」、「鬞鬞」。 例如：你在該尋麼个？仰搣到歸隻間鬞交交仔？","example":""},{"word":"準則","pinyin":"zunˋ zedˋ","def":"標準、原則。 例如：這頭家無準則，厥底下个承勞仔毋知愛仰仔做正合厥意。","example":""},{"word":"鬞頭不律","pinyin":"nungˇ teuˇ bud lud","def":"紛亂沒頭緒的樣子。","example":""},{"word":"鬞頭絞髻","pinyin":"nungˇ teuˇ gauˋ gi","def":"原指蓬頭散髮，喻多而複雜。 例如：佢頭那毛無梳，鬞頭絞髻走來上班，實在還見笑。 例如：下禮拜愛辦活動，頭路一千擔，做到鬞頭絞髻。","example":""},{"word":"屙膿滑血（屙膿合滑血）","pinyin":"oˊ nungˇ vad hiedˋ (oˊ nungˇ guad hiedˋ)","def":"喻荒誕虛假。 例如：你莫在該屙膿滑血，講麼个食兩粒烏豆仔就會後生二十歲。","example":""},{"word":"屙糟齋","pinyin":"oˊ zoˊ zaiˊ","def":"骯髒素；因他人言行所導致的傷害。 例如：同佢共組還衰，輒輒愛食厥屙糟齋。","example":""},{"word":"鬧棚","pinyin":"nau pangˇ","def":"非常熱鬧。 例如：戲棚頂高，做到當鬧棚。","example":""},{"word":"白琢琢仔","pinyin":"pag dog dog eˋ","def":"形容慘白的樣子。 例如：佢正手術過，面色白琢琢仔。","example":""},{"word":"排排","pinyin":"paiˇ paiˇ","def":"形容瘦而無肉。","example":""},{"word":"拋拋滾","pinyin":"pauˊ pauˊ gunˋ","def":"液體沸騰冒泡的樣子。例「鑊肚个水拋拋滾」。","example":""},{"word":"縹縹仔","pinyin":"peuˋ peuˋ eˇ","def":"約略地、輕淺的樣子。 例如：勸人該時節愛縹縹仔講，人正聽得入耳。","example":""},{"word":"鼻著个","pinyin":"pi dauˇ ge","def":"以鼻涕黏著固定的，喻不夠堅牢，亦可說「鼻膏个」。 例如：若這梯仔鼻著个係無？恁毋耐用。","example":""},{"word":"屁卵貢天","pinyin":"pi lonˋ gung tienˊ","def":"形容放屁的聲音大而且連續不停。 例如：阿爸緊行緊打屁，歸路仔屁卵貢天。","example":""},{"word":"肥竻肥竻","pinyin":"piˇ nedˋ piˇ nedˋ","def":"肥嫩的樣子。 例如：這細妹仔生來肥竻肥竻，異得人惜。","example":""},{"word":"肥胵胵仔","pinyin":"piˇ de de eˋ","def":"肥膩的樣子。 例如：阿公買个豬肉肥胵胵仔，拿去煎油怕較贏。","example":""},{"word":"肥㑁㑁仔（肥擂擂仔）","pinyin":"piˇ dudˋ dudˋ eˇ (piˇ luiˇ luiˇ eˋ)","def":"形容人胖嘟嘟的樣子。 例如：佢後生做兵个時節正五十八公斤，這下食到肥㑁㑁仔，兼兼仔會一百公斤吔。","example":""},{"word":"肥固固仔","pinyin":"piˇ gu gu eˋ","def":"形容人或動物肥胖的樣子。 例如：公園肚个野狗，隻隻就食到肥固固仔。","example":""},{"word":"肥儡肥儡","pinyin":"piˇ luiˊ piˇ luiˊ","def":"形容人體型微胖的樣子。 例如：阿豪牯生來矮頓矮頓、肥儡肥儡，做事盡煞猛。","example":""},{"word":"片高低","pinyin":"pienˋ goˊ daiˊ","def":"一邊高一邊低。 例如：這條大路片高低，你騎車仔愛細義。","example":""},{"word":"並令砰浪","pinyin":"pin lin pong long/bin lin bong long","def":"形容鞭炮聲。 例如：外背打紙炮仔，並令砰浪還吵人哦。","example":""},{"word":"平平仔","pinyin":"pinˇ pinˇ eˋ","def":"形容態勢安定無波動。 例如：日仔過來平平仔，也算異好福氣吔。","example":""},{"word":"浮浮冇冇","pinyin":"poˇ poˇ pang pang【peuˇ peuˇ pang pang】","def":"形容漂浮的樣子。 例如：大水過後，河壩裡肚垃圾浮浮冇冇。","example":""},{"word":"粕粕","pinyin":"pogˋ pogˋ","def":"物質因失去油脂或水分，本質變乾的樣子。 例如：這荔枝拿落冷凍庫冰，肉嗄變到粕粕毋好食。","example":""},{"word":"背僻【倒陋角】","pinyin":"poi pidˋ【do lo gogˋ】","def":"偏僻。 例如：該位當背僻，買隻東西就愛行幾下公里个路。","example":""},{"word":"趣怪","pinyin":"qi guai","def":"古怪而有趣。 例如：恁趣怪个事情，到底係仰仔發生个？","example":""},{"word":"萋婥","pinyin":"qiˊ qiogˋ","def":"潔淨而乾爽的樣子。也可說「萋婥婥仔」。 例如：日頭晒過个被骨異萋婥，蓋起來加異舒爽。","example":""},{"word":"青勼勼仔（青丟丟仔）","pinyin":"qiangˊ giuˇ giuˇ eˋ (qiangˊ diuˇ diuˇ eˋ)","def":"綠綠的，主要是用來指稱食物。 例如：這兜細人仔還爽人，朳仔青勼勼仔就同佢兜摘下來。","example":""},{"word":"青憨青憨","pinyin":"qiangˊ hamˊ qiangˊ hamˊ","def":"形容比較偏亮色系的淺綠色。 例如：佢著領青憨青憨个長衫，看起來當緣投。","example":""},{"word":"青里里仔","pinyin":"qiangˊ liˊ liˊ eˋ","def":"本指顏色青或綠，也可以引申臉色慘綠。 例如：佢分該著長白衫个人嚇到面青里里仔。","example":""},{"word":"七老八翹","pinyin":"qidˋ loˋ badˋ kieu","def":"老老的、蒼老的，可用於形容人或物。 例如：這番薯葉七老八翹，係無先絲絲啊，斯會噍毋綿。","example":""},{"word":"錢水足","pinyin":"qienˇ suiˋ jiugˋ","def":"資金充裕，指生活富裕。","example":""},{"word":"揫亼","pinyin":"qiuˊ qib","def":"收拾整齊的樣子。 例如：厥間房整理到當揫亼，真好勢。","example":""},{"word":"蛇聲鬼叫","pinyin":"saˇ sangˊ guiˋ gieu","def":"形容怪里怪氣的聲音。 例如：細人仔搞到蛇聲鬼叫，會吵著隔壁鄰舍。","example":""},{"word":"眨睡","pinyin":"sabˋ soi","def":"倒成一片或倒地不起。 例如：大雨過後，菜葉眨睡。 例如：弓蕉分風搓掃到眨睡。","example":""},{"word":"煞力牯","pinyin":"sadˋ lid guˋ","def":"用盡所有的力量。","example":""},{"word":"三千年个老狗屎","pinyin":"samˊ qienˊ ngienˇ ge loˋ gieuˋ siiˋ","def":"喻陳年舊事。 例如：三千年个老狗屎也緊拿出來講，異會樣仔。","example":""},{"word":"三下钁頭兩畚箕","pinyin":"samˊ ha giogˋ teuˇ liongˋ bun giˊ","def":"喻輕易之極，也喻做事能力強。 例如：這件事情對你來講係三下钁頭兩畚箕定定。","example":""},{"word":"三步腳","pinyin":"samˊ pu giogˋ","def":"指很短的距離。取自俗諺「三步腳一坎店」，喻繁華熱鬧，亦可說「兩步腳」。 例如：這所在實在鬧熱，三步腳就有一坎店。","example":""},{"word":"生塵打灰","pinyin":"sangˊ ciinˇ daˋ foiˊ","def":"形容布滿了灰塵。 例如：東西買到恁多用毋去，放在倉庫生塵打灰，將就拿去送人好哩！","example":""},{"word":"生鹵遇礙","pinyin":"sangˊ luˊ ngi ngai","def":"形容生鏽生得很嚴重。","example":""},{"word":"熟地碼","pinyin":"sug ti maˊ","def":"熟悉的環境。","example":""},{"word":"生成个","pinyin":"sangˊ sangˇ ge","def":"天生成的，原本是如此的。 例如：榴槤个臭味係生成个，莫恅著係壞忒就擲忒。 例如：細人仔大吔，愛離開爺哀出外絡食，係生成个。","example":""},{"word":"生定吔个","pinyin":"sangˊ tin eˇ ge","def":"原本如此或自然生成的。 例如：一個人个命運，在落泥時就生定吔个。","example":""},{"word":"生正吔个","pinyin":"sangˊ zang eˇ ge","def":"天生自然的。 例如：靚媸生正吔个，無比止个啦！","example":""},{"word":"生裝","pinyin":"sangˊ zongˊ","def":"長相，指外表、氣質整體而言。 例如：厥妹仔生裝異好，莊項人都想愛同佢做媒人。","example":""},{"word":"目珠眡眡","pinyin":"mugˋ zuˊ seˋ seˋ","def":"眼睛斜視的樣子。 例如：若倈仔看人目珠眡眡，你有帶佢去分先生看無？","example":""},{"word":"嘶胲另命【抽胲另命】","pinyin":"seˊ goiˊ nang miang【cuˊ goiˊ nang miang】","def":"聲嘶力竭。 例如：佢腳膝頭正溜皮定定，就噭到嘶胲另命。","example":""},{"word":"燒炣燒炣","pinyin":"seuˊ hoˊ seuˊ hoˊ","def":"溫度微熱的樣子，多用於身體及食物溫度。 例如：若額頭摸起來燒炣燒炣，怕係發燒吔！","example":""},{"word":"燒熝熝仔","pinyin":"seuˊ lug lug eˋ","def":"形容熱或燙的樣子，猶如說熱呼呼的或燙滾滾的。 例如：湯正煮啊好，燒熝熝仔，等一下正食。","example":""},{"word":"燒㸐燒㸐【㸐㸐】","pinyin":"seuˊ nadˋ seuˊ nadˋ【nadˋ nadˋ】","def":"微熱的樣子。例如「額頭燒㸐燒㸐」、「鑊仔燒㸐燒㸐」。","example":""},{"word":"屎棍條","pinyin":"siiˋ gun tiauˇ","def":"傲慢、囂張的人。 例如：細人仔毋好學該屎棍條个樣相，係無，出去準備分人打就有。","example":""},{"word":"膣面舐舐","pinyin":"ziiˊ mien seˊ seˊ","def":"恬不知恥。 例如：佢做賊分人捉著，還膣面舐舐緊㖸。","example":""},{"word":"溼浙浙仔","pinyin":"siibˋ zeb zeb eˋ","def":"濕漉漉的。 例如：記得愛帶遮仔，係無涿到溼浙浙仔斯會寒著哦！","example":""},{"word":"食祿","pinyin":"siid lugˋ","def":"飲食的福氣。 例如：你實在異有食祿哦！來啊到就有飯好食。","example":""},{"word":"紙膏个","pinyin":"ziiˋ goˇ ge","def":"用紙糊的，形容薄弱不堅固。","example":""},{"word":"實實疊疊","pinyin":"siid siid tiab tiab","def":"踏踏實實。 例如：吾爸一生人都係實實疊疊个耕種人，逐日打早出門，斷烏正轉。","example":""},{"word":"實疊","pinyin":"siid tiab","def":"紮實穩定。 例如：起屋愛先打地基，底係實疊，起个屋正會穩，地動來較安全。","example":""},{"word":"身裝","pinyin":"siinˊ zongˊ","def":"身材、外型。 例如：身裝好个人，著麼个就靚。","example":""},{"word":"承牙","pinyin":"siinˇ ngaˇ","def":"食物的口感很有嚼勁。 例如：明豆炒豬肉，食起來脆脆，當承牙。","example":""},{"word":"神投投仔","pinyin":"siinˇ dauˇ dauˇ eˋ","def":"自以為是、煞有介事，難有親和力的樣子。 例如：看佢恁樣神投投仔，𠊎實在無想愛摎佢做朋友。","example":""},{"word":"疏疏滾","pinyin":"so so gunˋ","def":"形容細碎的聲音。 例如：錢鼠仔疏疏滾，怕又偷挖吾衛生紙去做竇吔。","example":""},{"word":"索恬","pinyin":"sogˋ diamˊ","def":"安靜無聲的樣子。 例如：先生一行入教室，學生仔黏時就索恬，無人敢出聲。","example":""},{"word":"縮結","pinyin":"sogˋ giedˋ","def":"精簡扼要；衣服穿得很貼身。 例如：報告時間伸五分鐘，做得縮結兜仔無？","example":""},{"word":"睡睡","pinyin":"soi soi","def":"斜置或斜倒。 例如：風搓當嚴重，菜園肚个菜分風吹到睡睡。","example":""},{"word":"衰漦","pinyin":"soiˊ xiauˇ","def":"倒楣；弱、看不起。 例如：𠊎吂有到恁衰漦哪，愛摎人擎腳。 例如：自家愛較增志兜仔，正毋會分人看衰漦。","example":""},{"word":"算數（準算）","pinyin":"son sii (zunˋ son)","def":"事情的結果被認定有效。 例如：幾下年前个約束，到今敢還有算數？","example":""},{"word":"爽水","pinyin":"songˋ suiˋ","def":"不積水、透水。 例如：同布仔來比，菜瓜布較爽水，故所較遽燥。","example":""},{"word":"爽平","pinyin":"songˋ piangˇ","def":"非常平整。 例如：厥屋頭前有一垤爽平个草坪，異多細人仔在該走相逐。","example":""},{"word":"上教","pinyin":"songˊ gauˊ","def":"一教就會，指學習者領悟力很強。","example":""},{"word":"上合合","pinyin":"songˊ gab gab","def":"形容貪吃的樣子。 例如：人客還在場，該細人仔毋知頭天上合合，還得人惱。","example":""},{"word":"手扡扡仔","pinyin":"suˋ iaˋ iaˋ eˇ","def":"手想要拿卻沒得拿的樣子，表手頭拮据，沒錢可用。 例如：朝晨無去領錢，無想著有人客來食夜，害𠊎手扡扡仔。","example":""},{"word":"手背背","pinyin":"suˋ poi poi","def":"手偏向後面，不順手的樣子，引申為不願伸手幫忙的樣子。 例如：佢就淨企在該片看，喊佢𢯭手就手背背，當驚做。","example":""},{"word":"手頭好","pinyin":"suˋ teuˇ hoˋ","def":"運氣好、手氣好。 例如：厥手頭好，做麼个生理都賺錢。","example":""},{"word":"輸到貼貼","pinyin":"suˊ do dabˋ dabˋ","def":"輸到谷底，輸得無翻身之力。 例如：佢連屋仔都敢拿去同銀行借錢賭徼，背尾輸到貼貼，這下連睡个所在就無忒去吔。","example":""},{"word":"輸到悿悿","pinyin":"suˊ do tiamˋ tiamˋ","def":"輸得慘兮兮。 例如：這滿个籃球比賽，五十分比九十分，輸到悿悿。","example":""},{"word":"窣聲仔","pinyin":"sud sangˊ eˋ","def":"倏的一聲，形容快速。 例如：看著阿姆拿竹修仔逐出來，佢窣聲仔就瀉走。","example":""},{"word":"水汀汀仔【澢澢跌跌】","pinyin":"suiˋ din din eˋ【dongˊ dongˊ diedˋ diedˋ】","def":"形容水多一直滴貌。 例如：遮仔水汀汀仔，裝到地泥溼溼，拿去外背吊等汀水。","example":""},{"word":"水漣漣","pinyin":"suiˋ lienˇ lienˇ","def":"水很多的樣子，常用於形容湖、水田、陂塘、水圳等水面較平靜的地方。 例如：山下起屋面前田，私陂私圳水漣漣。","example":""},{"word":"水涉涉仔","pinyin":"suiˋ zeb zeb eˋ","def":"水多潮濕且尚有淺水，常用於形容地面。 例如：落雨落毋會停，滿那就水涉涉仔，異毋方便。","example":""},{"word":"綏忒【綏核】","pinyin":"suiˊ tedˋ【suiˊ hedˋ】","def":"布邊紗線鬆散。 例如：這領衫著久吔，袖仔綏忒哩。","example":""},{"word":"鬆容","pinyin":"sungˊ iungˇ","def":"指能支配使用的錢財很多，過著比較富足的生活，亦可說「鬆融」。 例如：佢省儉打拚一生人，這下生活正較鬆容。","example":""},{"word":"雙燭透尾","pinyin":"sungˊ zugˋ teu miˊ","def":"指夫妻兩人共同生活到老，像雙燭燒到尾。又作「雙竹透尾」。","example":""},{"word":"大傲","pinyin":"tai ngau","def":"很驕傲。 例如：這儕人當大傲，你摎佢問好，佢嗄無愛搭你。","example":""},{"word":"大骼","pinyin":"tai gagˋ","def":"形容體型大。 例如：厥倈仔生到當大骼，力頭乜異大。 例如：大骼雞慢啼。（諺）","example":""},{"word":"大陸性","pinyin":"tai liug xin","def":"形容人動作慢吞吞。","example":""},{"word":"𢯭頭","pinyin":"ten teuˇ","def":"使兩邊相等；形容雙方相等、相當。 例如：㧡擔愛𢯭頭正好㧡。 例如：該輛貨車一片高一片低，兩片看起來毋𢯭頭。","example":""},{"word":"頭來尾去","pinyin":"teuˇ loiˇ miˊ hi","def":"來龍去脈。 例如：律師喊佢將這件事情个頭來尾去詳細講分佢聽，正來看仰般做。","example":""},{"word":"頭烏面烏","pinyin":"teuˇ vuˊ mien vuˊ","def":"滿臉髒兮兮的，引申為灰頭土臉之意。 例如：鄉長分抗議个鄉親刻到頭烏面烏，當見笑！","example":""},{"word":"頭頷尾搐（頭頷尾著）","pinyin":"teuˇ ngamˋ miˊ cug (teuˇ ngamˋ miˊ cog)","def":"態度喜悅和順的樣子。 例如：新進个員工異有禮貌，見看著人就頭頷尾搐當笑面。","example":""},{"word":"迪迪凸凸","pinyin":"tid tid tud tud","def":"忽進忽止，進行不順暢的樣子；或是形容說話支支吾吾的。 例如：厥車仔怕有問題，歸路仔迪迪凸凸，愛駛去分人整哩！","example":""},{"word":"天仔隔五里【天仔隔萬里】","pinyin":"tienˊ eˋ gagˋ ngˋ liˊ【tienˊ eˋ gagˋ van liˊ】","def":"喻距離非常遙遠。","example":""},{"word":"天公地當","pinyin":"tienˊ gungˊ ti dong","def":"非常合理，天經地義。","example":""},{"word":"天生天養","pinyin":"tienˊ senˊ tienˊ iongˊ","def":"形容人或動物在極差之環境中仍能存活的本能。 例如：該隻野狗養十過隻狗子，逐隻就胖大胖大，正經係天生天養。","example":""},{"word":"拖棚","pinyin":"toˊ pangˇ","def":"拖拖拉拉、拖延時間。 例如：這齣電視劇實在還拖棚。","example":""},{"word":"拖拖挷挷","pinyin":"toˊ toˊ bangˊ bangˊ","def":"拉拉扯扯，引申為拖累。 例如：係無屋下人拖拖挷挷，佢早就讀書讀忒，出社會賺錢哩。","example":""},{"word":"宕時間","pinyin":"tong siiˇ gienˊ","def":"浪費時間。 例如：這種活動宕時間定定，𠊎正無愛去哪。","example":""},{"word":"色褪褪","pinyin":"sedˋ tun tun","def":"顏色逐漸淡化，沒有光澤。 例如：衫褲著久吔，看起來色褪褪。","example":""},{"word":"滑溜","pinyin":"vad liuˋ","def":"流暢、流利。 例如：佢去英國留學幾下年，這下英文講到當滑溜。","example":""},{"word":"歪哥淒汊","pinyin":"vaiˊ goˊ qiˊ caˊ","def":"形容物體歪斜不正。","example":""},{"word":"歪心","pinyin":"vaiˊ ximˊ","def":"心術不正。","example":""},{"word":"歪哉【哀哉】","pinyin":"vaiˊ zaiˊ【oiˊ zoiˇ】","def":"情況不好，可用於形容人或事。 例如：這擺地動盡歪哉，消忒當多人。","example":""},{"word":"歪走","pinyin":"vaiˊ zeuˋ","def":"偏離了。 例如：佢無用尺畫直線，歸條線仔歪走。","example":""},{"word":"彎彎糾糾","pinyin":"vanˊ vanˊ giuˋ giuˋ","def":"彎彎曲曲、歪斜貌。 例如：地動過後，這條路嗄變到彎彎糾糾。","example":""},{"word":"橫貼貼","pinyin":"vang dabˋ dabˋ","def":"完全倒下。 例如：風搓一過，樹仔做盡橫貼貼。","example":""},{"word":"橫橫","pinyin":"vang vang","def":"橫斜不正貌。","example":""},{"word":"橫架直架","pinyin":"vangˇ ga ciid ga","def":"東西凌亂沒有整理。 例如：這兜竹篙橫架直架，愛放好勢來。","example":""},{"word":"橫橫挖挖","pinyin":"vangˇ vangˇ vagˋ vagˋ","def":"形容枝條橫七豎八不整齊，礙人的樣子。 例如：風搓過後，樹椏滿哪仔橫橫挖挖。","example":""},{"word":"黃炣黃炣","pinyin":"vongˇ hoˊ vongˇ hoˊ","def":"微黃的樣子。 例如：阿公種个弓蕉黃炣黃炣，放加兩日就做得食哩。","example":""},{"word":"黃貢貢仔","pinyin":"vongˇ gung gung eˋ","def":"形容色彩呈現混濁的黃色。 例如：風搓正過啊忒，河壩水黃貢貢仔。","example":""},{"word":"黃焦焦仔","pinyin":"vongˇ jiauˇ jiauˇ eˋ","def":"焦黃，多用於植物呈現不健康的樣貌。 例如：對面山崗種个薑嫲黃焦焦仔，生毋靚。","example":""},{"word":"黃蠟蠟仔","pinyin":"vongˇ lab lab eˋ","def":"病人臉色泛黃，無血色貌。 例如：吾爸著著肝病个時節，歸身變到黃蠟蠟仔。","example":""},{"word":"黃淰淰仔","pinyin":"vongˇ nemˊ nemˊ eˋ","def":"很黃。 例如：醃缸肚个鹹菜黃淰淰仔，毋扡起來晒，臭黃忒就打爽吔。","example":""},{"word":"烏黔烏黔","pinyin":"vuˊ himˇ vuˊ himˇ","def":"灰黑色，多用來形容物品。 例如：這輛車仔恁值錢，好得色目烏黔烏黔，無盡打眼。","example":""},{"word":"武頓（武頓車槌）","pinyin":"vuˋ dunˋ (vuˋ dunˋ caˊ cuiˇ)","def":"形容身材粗壯結實的樣子。 例如：佢武頓武頓，盡砸盡有力。","example":""},{"word":"烏𪐞紅","pinyin":"vuˊ du fungˇ","def":"深紅色，偏暗紅色。 例如：有一種烏𪐞紅个李仔安到血筋李，甜中帶一息仔酸，異好食。","example":""},{"word":"烏𪐞𪐞仔","pinyin":"vuˊ du du eˋ","def":"形容深黑色。 例如：歸張桌仔雖然漆到烏𪐞𪐞仔，毋過排在這乜異好看。","example":""},{"word":"烏𪐞色","pinyin":"vuˊ du sedˋ","def":"深黑色。 例如：阿爸著這身烏𪐞色个西裝，看起來當斯文。","example":""},{"word":"烏蠅拑烏蠅啄","pinyin":"vuˊ inˇ kiamˇ vuˊ inˇ dugˋ","def":"形容很髒不衛生。 例如：西瓜放在這，烏蠅拑烏蠅啄，食著怕會屙痢肚哦！","example":""},{"word":"烏刻刻仔","pinyin":"vuˊ kad kad eˋ","def":"形容膚色黝黑。 例如：阿叔逐日去田項做事，又無著長袖，晒到烏刻刻仔。","example":""},{"word":"烏胗胗仔","pinyin":"vuˊ kinˊ kinˊ eˋ","def":"深黑色，多用來形容人。 例如：佢晒到烏胗胗仔，暗晡頭淨看得著牙齒定定。","example":""},{"word":"烏疏滴溚","pinyin":"vuˊ soˇ did dab","def":"形容烏漆麻黑、很黑的樣子。 例如：若手搞到烏疏滴溚，愛洗淨正做得食飯。","example":""},{"word":"烏膣癩乾","pinyin":"vuˊ ziiˊ lai gonˊ","def":"形容烏黑乾癟。 例如：這領衫著到烏膣癩乾，還毋遽遽拿來洗。","example":""},{"word":"烏廩廩仔","pinyin":"vuˊ limˋ limˋ eˇ","def":"黑黑的，僅用於形容頭髮。 例如：厥頭那毛又長又烏廩廩仔，放下來乜當靚。","example":""},{"word":"烏律律仔","pinyin":"vuˊ lud lud eˋ","def":"黑黑的。 例如：你這駁仔走去哪位尞？晒到烏律律仔。","example":""},{"word":"紊餕","pinyin":"vun zun","def":"吃過的東西弄得一團亂，比喻骯髒到令人厭惡。 例如：實在還紊餕，食餐飯搣到衫褲油油，全洗毋會淨。","example":""},{"word":"四方闊面","pinyin":"xi fongˊ fadˋ mien","def":"說人有福相，亦可說「頭大面四方」。","example":""},{"word":"四兩命","pinyin":"xi liongˊ miang","def":"四兩命，表示八字重，命格極好。 例如：千斤力，毋當四兩命。（諺）","example":""},{"word":"四𢯭","pinyin":"xi ten","def":"指四肢勻稱。也可做「四𢯭四𢯭」。 例如：厥妹仔生裝異四𢯭。","example":""},{"word":"四四散散","pinyin":"xi xi san san","def":"散落四處。 例如：廳下个玩具四四散散，遽遽收揫來！","example":""},{"word":"四髀兩爪","pinyin":"xiˋ biˋ liongˋ zauˋ","def":"形容把東西撕得四分五裂、不完整。也可說「四髀兩析、四髀兩膁、四髀兩料」。 例如：阿姊个課本分老弟扯到四髀兩爪。","example":""},{"word":"鮮汥朗湯","pinyin":"xienˊ ziiˊ longˇ tongˊ","def":"形容湯之濃度稀薄。 例如：煮到恁大鑊个湯，裡背淨一息仔料頭，鮮汥朗湯，無味無緒。","example":""},{"word":"傪","pinyin":"cam","def":"相像。","example":""},{"word":"颼颼滾（咻咻滾）","pinyin":"xiu xiu gunˋ","def":"形容風吹拂快而急所發出的聲音。 例如：窗門無關好，風颼颼滾緊灌落來。","example":""},{"word":"俗拔拔仔","pinyin":"xiug bad bad eˋ","def":"形容很俗氣。 例如：阿美珠仔逐擺就緊嫌自家名仔俗拔拔仔，當見笑。","example":""},{"word":"拶腹","pinyin":"zad bugˋ","def":"實心、紮實。 例如：西式麵包焙到膨膨，手揬啊去一下仔就凹落去，一滴仔都無拶腹。","example":""},{"word":"拶腹實落【拶拶實實】","pinyin":"zad bugˋ siid log【zadˋ zadˋ siid siid】","def":"形容很紮實、很實在的樣子。 例如：起屋打地基愛拶腹實落，起个屋仔正堅固。","example":""},{"word":"拶拶","pinyin":"zad zad","def":"很密很擠的樣子；喻指沉悶、不靈通，如「頭那拶拶」。 例如：菜園肚葉菜類、食根菜、藤菜類，種到拶拶，仰會種得著來食？","example":""},{"word":"齋囉囉仔","pinyin":"zaiˊ loˊ loˊ eˋ","def":"形容食物沒有油分，也可以指飲食過素。 例如：這碗菜無放油煮，齋囉囉仔盡毋好食。 例如：這駁仔齋囉囉仔，無食麼个肉氣。","example":""},{"word":"湛斗","pinyin":"zam deuˋ","def":"很好，很優秀。","example":""},{"word":"占頭【彩頭】","pinyin":"zam teuˇ【coiˇ teuˇ】","def":"預兆、兆頭，通常指不好的兆頭。 例如：吂出去就潰碗，占頭毋好哦！","example":""},{"word":"燥毋過骨","pinyin":"zauˊ mˇ go gudˋ","def":"東西沒有徹底晒乾或乾燥。 例如：鹹菜乾係晒到燥毋過骨，會放壞忒。","example":""},{"word":"燥爽","pinyin":"zauˊ songˋ","def":"指天氣、衣物乾燥舒爽。 例如：衫褲愛燥爽，著起來正會鬆爽。","example":""},{"word":"爭差大碼","pinyin":"zenˊ caˊ tai maˊ","def":"相差很大。 例如：兩萬二毋好恅著係兩萬空二，兩個斯爭差大碼哦！","example":""},{"word":"隘丁","pinyin":"ai denˊ","def":"隘丁，防守隘寮者。","example":""},{"word":"賊貨","pinyin":"ced fo","def":"贓物。","example":""},{"word":"打脫字","pinyin":"daˋ todˋ sii","def":"簽訂脫離關係的字據（例如離婚）。","example":""},{"word":"落屎兵","pinyin":"lau siiˋ binˊ","def":"不能打仗，一打即驚嚇而散的兵。","example":""},{"word":"謀人","pinyin":"meuˇ nginˇ","def":"計害殺人。 例如：做人愛光明正大，毋好總係想愛謀人。","example":""},{"word":"刓頭","pinyin":"nganˊ teuˇ","def":"殺頭，亦可說「㓾頭」。","example":""},{"word":"搜軀身【抄圓身】","pinyin":"seuˊ vuˊ siinˊ【cau ianˇ siinˊ】","def":"搜查身體。","example":""},{"word":"貼手㬹","pinyin":"diabˋ/diab suˋ zangˊ","def":"原指墊手肘，比喻賄賂。 例如：你送這兜仔錢分佢，貼手㬹就毋罅。","example":""},{"word":"歪哥","pinyin":"vaiˊ goˊ","def":"貪汙。","example":""},{"word":"眾人眾事","pinyin":"zung nginˇ zung sii","def":"大眾公家之事。","example":""},{"word":"阿婆官","pinyin":"aˊ poˇ gonˊ","def":"做事沒有魄力，軟弱無能的主事者。","example":""},{"word":"阿阿膩膩","pinyin":"a a ne ne","def":"指講話不乾脆、不果決，欲言又止的樣子，常用於答話應對之情境。 例如：你係愛講就遽啊講，毋好阿阿膩膩。","example":""},{"word":"阿鵲教烏鷯","pinyin":"aˊ xiagˋ gauˊ vuˊ liau","def":"諷刺學無專精而開業授徒的人；亦說求學不循正道，反受其害。 例如：阿鵲教烏鷯，教到跳啊跳。","example":""},{"word":"鴨嫲絡食，毋知坑仔窮","pinyin":"abˋ maˇ logˋ siid，mˇ diˊ hangˊ eˋ kiungˇ","def":"得到他人的救助卻需索無度，有貪得無厭、不留餘糧的意思，源自「鴨嫲絡食，毋知坑窮；山豬食肉，毋知香臭」，可單用亦可併用。","example":""},{"word":"矮凳仔徑橫人","pinyin":"aiˋ den eˋ gang vang nginˇ","def":"矮凳子也會絆倒人，比喻不要輕視不起眼的人或物。","example":""},{"word":"生毛面","pinyin":"sangˊ moˊ mien","def":"容易翻臉的人。 例如：該隻人盡生毛面，可能隨時會變面。","example":""},{"word":"恁豺","pinyin":"anˋ saiˇ","def":"像豺狼一般貪吃，指稱一個人非常嘴饞。 例如：毋識看過恁豺个人，講著食就走第一。","example":""},{"word":"盎零","pinyin":"angˇ/angˊ langˊ【angˊ langˇ/lang (angˊ nang)】","def":"形容人固執，屢勸不聽，不知變通。罵人不知變通則可說「死盎零」。 例如：喊佢苦瓜毋好刨皮，偏偏又刨皮，實在還盎零。","example":""},{"word":"詏到贏","pinyin":"au do iangˇ","def":"爭辯到贏。 例如：這個人性體當硬，不管著毋著佢都愛詏到贏。","example":""},{"word":"把門風","pinyin":"baˋ munˇ fungˊ","def":"光耀門楣，源自客家諺語：「畜大豬把門風」，家裡的豬養大了，可以讓家裡有錢賺，提昇家裡聲望。","example":""},{"word":"巴掌生毛","pinyin":"baˊ zongˋ sangˊ moˊ","def":"老手，比喻熟練的意思。","example":""},{"word":"背家濟仔","pinyin":"baˇ gaˊ ji eˋ","def":"乞丐，指靠討飯、要錢過活的人。 例如：你莫看佢背家濟仔个形投，佢名下有幾下間樓屋。","example":""},{"word":"背鑊","pinyin":"baˇ vog","def":"形容駝背時好像背著一個鍋子，基本上也達到病態了，具貶義。 例如：𫣆兜係笑人背鑊，會分人講無家教。","example":""},{"word":"百家貓（千家貓）","pinyin":"bagˋ gaˊ meu (qienˊ gaˊ meu)","def":"比喻愛串門子的人，亦可說「過家貓」。 例如：這儕人百家貓樣仔，尞到半夜還毋知好轉。","example":""},{"word":"伯公生鬚","pinyin":"bagˋ gungˊ sangˊ xiˊ","def":"形容不慌不忙、從容不迫，老神在在的樣子。（歇） 例如：佢在這位做事十過年，堵著事情就像伯公生鬚，毋會緊張。","example":""},{"word":"半憨痴","pinyin":"ban hamˊ ceˊ","def":"罵人言行無知、不正經。 例如：毋好恁仔有也講無也講，恁半憨痴會分人笑。","example":""},{"word":"半頭青【青頭子】","pinyin":"ban teuˇ qiangˊ【qiangˊ teuˇ ziiˋ】","def":"指未成熟的青澀少年。","example":""},{"word":"半份婿郎半份子","pinyin":"ban fun se longˇ ban fun ziiˋ","def":"女婿等於半個兒子，表示都是一家人。","example":""},{"word":"半釐命","pinyin":"ban liˇ miang","def":"福薄命薄之人。","example":""},{"word":"背囊背砧枋","pinyin":"boi nongˇ baˇ zemˊ biongˊ","def":"原指背上背著砧板被人剁，比喻任人責罵，亦可說「背囊背大鼓」。 例如：自家恁好做，這下背囊背砧枋斯莫怨怪別人！","example":""},{"word":"砰砰滾（拚拚滾）","pinyin":"bang bang gunˋ (biang biang gunˋ)","def":"形容人生氣發飆的樣子。 例如：這後生人動啊著就砰砰滾，面臭臭看起來實在當得人惱。","example":""},{"word":"挷東籬補西壁","pinyin":"bangˊ dungˊ liˇ buˋ xiˊ biagˋ","def":"猶言「剜肉補瘡」，或喻經濟拮据。 例如：阿明屋下當苦，愛用著錢該下輒輒挷東籬補西壁。","example":""},{"word":"挷縫","pinyin":"bangˊ pung","def":"抽空。 例如：厥店項生理恁好，愛挷縫來食一下飯都無恁該。","example":""},{"word":"挷衫尾","pinyin":"bangˊ samˊ miˊ","def":"喻跟隨人後。 例如：你去臺北，做得分𠊎挷衫尾無？","example":""},{"word":"凴壁毋知壁轉","pinyin":"ben biagˋ mˇ diˊ biagˋ zon","def":"喻倚恃過度，不知進退。","example":""},{"word":"鱉腳趖出來","pinyin":"biedˋ giogˋ soˇ cudˋ loiˇ","def":"露出馬腳，喻露出破綻或現出弊端。","example":""},{"word":"變面","pinyin":"bien mien","def":"翻臉。 例如：佢斯無分人講个，動啊著就變面。","example":""},{"word":"放火燒屋逐老鼠","pinyin":"biong foˋ seuˊ vugˋ giugˋ lo cuˋ【biong foˋ seuˊ vugˋ giugˋ no cuˋ】","def":"用火燒房子的方式驅趕老鼠，指小題大作，得不償失，同「殺雞取卵」。","example":""},{"word":"放月鴿仔","pinyin":"biong ngied gabˋ eˇ","def":"放鴿子。","example":""},{"word":"發冷","pinyin":"bodˋ langˊ","def":"無聊，責備人沒有做得完善的話。 例如：還發冷，好好个面爪到流血。","example":""},{"word":"發大冷个","pinyin":"bodˋ tai langˊ ge","def":"罵人沒擔當。 例如：發大冷个，自家个爺哀發病仔毋照顧，還敢去花天酒地。","example":""},{"word":"發大脹","pinyin":"bodˋ tai zong","def":"詛咒人家肚子發脹而死。 例如：莊項个了尾子壞事做絕，正會分人罵發大脹。","example":""},{"word":"發瘟","pinyin":"bodˋ vunˊ","def":"詛咒的話（得瘟疫）；瘟疫流行。 例如：做差一息仔細事，毋好用「發瘟」个字眼來罵人。","example":""},{"word":"發脹鬼","pinyin":"bodˋ zong guiˋ","def":"原意為得浮腫病的人，後常用於詛咒，令人氣結。 例如：今晡日去農會買肥料，無買著又還堵著該隻發脹鬼，還譴！","example":""},{"word":"發脹狗","pinyin":"bodˋ zong gieuˋ","def":"原意指得浮腫病的狗，後常用於詛咒。 例如：哪隻發脹狗，專門在吾（𠊎个）門前屙屎。","example":""},{"word":"幫襯","pinyin":"bongˊ cen","def":"幫忙；陪襯；捧場。 例如：做事有人幫襯，就會較輕鬆。 例如：紅花若有綠葉幫襯，就會較靚。 例如：生理愛有人氣來幫襯，正會鬧熱、賺錢。","example":""},{"word":"幫人食【搭人食】","pinyin":"bongˊ nginˇ siid【dabˋ nginˇ siid】","def":"搭伙。 例如：佢做學生該下，在臺北幫人食。","example":""},{"word":"斧頭削自家个柄毋著","pinyin":"buˋ teuˇ xiogˋ cii gaˊ ge biang mˇ doˋ","def":"斧頭雖然很鋒利，但仍無法削到自己的握柄，比喻有很多事情自己是無能為力的。","example":""},{"word":"畚箕承尿","pinyin":"bun giˊ siinˇ ngiau","def":"用畚箕來盛裝尿液，僅暫時應急罷了，比喻暫用一下下。（歇）","example":""},{"word":"分人戳","pinyin":"bunˊ nginˇ cogˋ","def":"罵人的話，指某人行為不好，需要人來責備。 例如：生理人毋好做到恁絕，無斯會分人戳哦。","example":""},{"word":"分人剷","pinyin":"bunˊ nginˇ canˋ","def":"喻被人狠狠地責罵、教訓。 例如：佢毋知做毋著麼个，緊分人剷。","example":""},{"word":"扯人面皮","pinyin":"caˋ nginˇ mien piˇ","def":"不給人面子，傷人自尊。","example":""},{"word":"扯衫裾補背囊","pinyin":"caˋ samˊ giˊ buˋ boi nongˇ","def":"撕下衣襟上的布，補背後的大洞，喻無濟於事或徒勞無功。","example":""},{"word":"插花仔","pinyin":"cabˋ faˊ eˋ","def":"賭局進行時，由局外人搭角共任，喻參與別人的事情而獲利，或是加入陣容中增加趣味的動作。 例如：放月鴿仔過關比賽，輒常會有插花仔賭徼个情形。","example":""},{"word":"裁位仔","pinyin":"caiˇ vi eˋ","def":"調度位子。 例如：老人家一上車，大家就裁位仔分佢坐。","example":""},{"word":"綻剁頭","pinyin":"can dog teuˇ","def":"形容很調皮好動而機伶的小孩。又寫作「賤剁頭」。","example":""},{"word":"剷人","pinyin":"canˋ nginˇ","def":"手指著人大聲責罵。 例如：毋較認真兜仔做，等一下頭家又會剷人哩。","example":""},{"word":"躁光狗","pinyin":"cau gongˊ gieuˋ","def":"比喻焦躁不安、不易平靜的人，亦可說「躁光蟲」，常用指孩子。","example":""},{"word":"躁光蟲","pinyin":"cau gongˊ cungˇ","def":"指焦躁不安、過動的小孩，亦可說「躁光蟲，蠕蠕動」。","example":""},{"word":"痴痴","pinyin":"ceˊ ceˊ","def":"行為放蕩不檢、三八的樣子。 例如：莫恁樣痴痴好無？較正經兜仔！","example":""},{"word":"賊仔惡過人","pinyin":"ced eˋ ogˋ go nginˇ","def":"做賊的比主人還要兇，喻理不直卻氣勢凌人。","example":""},{"word":"賊過閂門","pinyin":"ced go conˊ munˇ","def":"事前未提防，事發損失後才匆忙補救，喻無濟於事，亦可說「蛇過尋棍」。 例如：賊過閂門，來毋掣哩。","example":""},{"word":"痴哥沷沷【豬哥沷沷】","pinyin":"ciiˊ goˊ bad bad【zuˊ goˊ bad bad】","def":"男子極為好色的樣子。 例如：佢看著靚細妹仔，講話同眼神表現到當痴哥沷沷。","example":""},{"word":"痴哥牯","pinyin":"ciiˊ goˊ guˋ","def":"原意為痴情的男子，後指好色的男人。 例如：這隻細倈仔，逐擺就會去惹細妹仔，人喊佢痴哥牯。","example":""},{"word":"㓾人喊救命","pinyin":"ciiˇ nginˇ hemˊ giu miang","def":"喻惡人先告狀。","example":""},{"word":"直腸直肚","pinyin":"ciid congˇ ciid duˋ","def":"指一根腸子通到底，喻做人直爽，沒有心機。 例如：厥性格直腸直肚，同麼人就合得著。","example":""},{"word":"直白","pinyin":"ciid ped","def":"清楚明白；喻乾脆；喻妥當。 例如：搭信，毋當自家去較直白。","example":""},{"word":"直頭擼","pinyin":"ciid teuˇ luˊ","def":"率性而為的態度。 例如：阿明該人直頭擼，下把仔無上無下，莫摎佢忒計較。","example":""},{"word":"逞後生","pinyin":"ciinˋ heu sangˊ","def":"自以為年輕而放肆。 例如：洗頭那毛愛吹燥來，毋好逞後生，等你老該下就知哩。","example":""},{"word":"座食莫座爽","pinyin":"co siid mog co songˋ","def":"寧可吃掉，不要浪費。 例如：座食莫座爽，桌項伸个菜食得个，拿轉去食。","example":""},{"word":"座大份","pinyin":"co tai fun","def":"占著、選擇大的那一份。 例如：這兩兄弟分財產，阿哥講愛座大份，兩儕相吵泌背。","example":""},{"word":"座定派","pinyin":"co tin pai","def":"孤注一擲、豁出去了。 例如：這擺佢座定派，逐項就報名參加，係過無得獎就準備收山吔。","example":""},{"word":"草蜢撩雞公","pinyin":"coˋ mangˋ liauˇ gieˊ gungˊ","def":"蚱蜢戲弄公雞，只有被雞吃的份，喻自不量力。","example":""},{"word":"坐船望船走","pinyin":"coˊ sonˇ mong sonˇ zeuˋ","def":"坐船的人希望船能順利出航，喻同心協力，共達目的，源自「坐船望船走，騎馬望馬飆」。 例如：人講「坐船望船走」，係講應吔人這頭路來，大家就愛同心摎活動辦成功。","example":""},{"word":"撮假","pinyin":"codˋ gaˋ","def":"以虛假騙人或粗陋敷衍。 例如：飯店同人辦酒席，定著毋好忒撮假，係無，一擺人就驚著哩喲。","example":""},{"word":"撮目花（撮眼花）","pinyin":"codˋ mugˋ faˊ (codˋ ngienˋ faˊ)","def":"乘人不備時動手腳。 例如：賭徼場會撮目花，毋好去賭。","example":""},{"word":"鑿空鬥榫（鬥空鑿榫）","pinyin":"cog kungˊ deu sunˋ (deu kungˊ cog sunˋ)","def":"喻相互勾結、狼狽為奸。 例如：佢兩儕長透鑿空鬥榫害人，總有一日會分人捉去坐管仔。","example":""},{"word":"菜籃㧡水","pinyin":"coi lamˇ kaiˊ suiˋ","def":"菜籃是有孔隙的，用菜籃去擔水，則水會漏盡，喻徒勞無功，源自「菜籃㧡水無採工」。","example":""},{"word":"財高勢大","pinyin":"coiˇ goˊ sii tai","def":"有錢有勢。","example":""},{"word":"賺肉痛（賺皮痛）","pinyin":"con ngiugˋ tung (con piˇ tung)","def":"平添皮肉之痛。 例如：恁好搞！橫倒吔哦！正經係賺肉痛。","example":""},{"word":"賺衰","pinyin":"con soiˊ","def":"好心沒好報。 例如：好心同你𢯭手還分你嫌，正經係賺衰。","example":""},{"word":"撞差路","pinyin":"cong caˊ lu","def":"走錯路。 例如：阿珠仰恁久還吂到？敢係撞差路吔？","example":""},{"word":"杖仔顛倒怙","pinyin":"congˋ eˇ dienˊ do ku","def":"手杖原本是為年長者服務，反而為年輕的人所用，比喻事情一反常態。","example":""},{"word":"長病無孝子","pinyin":"congˇ piang moˇ hau ziiˋ","def":"長期臥病的父母需要照護，即使孝子也恐不堪負荷，心力交瘁。","example":""},{"word":"長山賣鴨卵","pinyin":"congˇ sanˊ mai abˋ lonˋ","def":"流傳在臺灣的俗話，回到「長山」去賣鴨蛋，婉指人去世或死亡。 例如：講著該阿水伯，幾下年前就轉去長山賣鴨卵吔。","example":""},{"word":"長山目鏡各人合眼","pinyin":"congˇ sanˊ mugˋ giang gogˋ nginˇ gagˋ ngienˋ","def":"喻每人的眼光不一樣。","example":""},{"word":"長屎胐","pinyin":"congˇ sii vudˋ","def":"指一坐就坐得很久，不會立即離開的人。 例如：阿火伯實在長屎胐，限勢吾屋下事頭恁多，佢還在該尞到毋肯走。","example":""},{"word":"抽猴筋","pinyin":"cuˊ heuˇ ginˊ","def":"找做錯事的人算帳。 例如：這個店員个態度盡毋好，等經理來，正同佢抽猴筋。","example":""},{"word":"出差世","pinyin":"cudˋ caˊ se","def":"形容人投錯胎；比喻行為很糟糕。 例如：出差世就愛煞猛做，正會改變自家个命運。 例如：還出差世！仰食到恁醉，毋知食忒幾多罐高粱！","example":""},{"word":"出空","pinyin":"cudˋ kungˊ","def":"走出去，比喻出外見世面。 例如：歸日毋出空，囥命係無？ 例如：毋識出空係無？問麼个就毋知。","example":""},{"word":"觸著人","pinyin":"cugˋ doˋ nginˇ","def":"冒犯了別人。 例如：你毋好濫糝講話，正毋會觸著人。","example":""},{"word":"打𫝘咕","pinyin":"daˋ ang guˋ","def":"逗嬰兒發出聲響。「𫝘咕」是嬰兒學語聲。","example":""},{"word":"打跛腳雞","pinyin":"daˋ baiˊ giogˋ gieˊ","def":"欺負弱小，打落水狗。 例如：你生來高長大漢，專門欺負細人仔，打跛腳雞，算麼个好漢？","example":""},{"word":"打粗","pinyin":"daˋ cuˊ","def":"謂很會吃、很能吃，形容不挑食的人。 例如：細人仔打粗又肯食，故所生來當砸磳。","example":""},{"word":"打頓屈","pinyin":"daˋ dun kud","def":"小孩子生氣臉臭臭，不發一語生悶氣。 例如：老弟打頓屈，一儕人面臭臭仔坐在廳下，毋聲毋氣。","example":""},{"word":"打落","pinyin":"daˋ log","def":"輕視、奚落。俗諺：「人愛人打落，火愛人燒著」，喻人需受激勵，才會奮發向上。","example":""},{"word":"打卵見黃","pinyin":"daˋ lonˋ gien vongˇ","def":"性急，要求馬上見效、立竿見影，有迫不及待之意。 例如：做麼个事情都共樣，總係想愛打卵見黃，毋當定定仔來做較穩當。","example":""},{"word":"打若所費","pinyin":"daˋ ngiaˊ soˋ fi","def":"讓你破費了。 例如：恁敗勢，做細生日仔也還打若所費。","example":""},{"word":"打白行","pinyin":"daˋ pag hangˇ","def":"白走一趟。 例如：石灰掞路，打白行。（諺）","example":""},{"word":"打冇訕【跳牙風】","pinyin":"daˋ pang xienˋ【tiau ngaˇ fungˊ】","def":"隨口說大話而無實際行動。 例如：打冇訕佢係專門个，你哪有恁多閒時間好搭佢！","example":""},{"word":"打蛇對七寸","pinyin":"daˋ saˇ dui qidˋ cun","def":"打蛇打頭後七寸才是關鍵要害，比喻做事情要抓到重點，亦可說「知得孔竅，打得鬼噭」。 例如：人講打蛇對七寸，這官司愛贏就愛先抓捉著重要个證據，係無講較多乜無效。","example":""},{"word":"打宕窿","pinyin":"daˋ tong lungˇ","def":"錯過、沒有交集。 例如：佢去若屋下，你走來吾屋下，兩儕打宕窿。","example":""},{"word":"打賬仔","pinyin":"daˋ zong eˋ","def":"敲詐、敲竹槓。 例如：佢毋係正經愛買東西，怕係愛來打賬仔个，愛細義！","example":""},{"word":"【賭拗蠻】","pinyin":"【duˋ auˊ manˇ】","def":"胡來、亂來。 例如：較像人兜啊！照規矩來，毋好賭拗蠻。","example":""},{"word":"打冇嘴","pinyin":"daˋ pang zoi","def":"不懂意思跟著人唸；空泛不實的言談。 例如：細人仔毋知意思跈先生打冇嘴，還係跈到異像。 例如：莫聽佢講到口涎波潑異會樣仔，打冇嘴定定，佢哪識去做過！","example":""},{"word":"打屁安狗心","pinyin":"daˋ pi onˊ gieuˋ ximˊ","def":"原是說先放屁來安慰飢餓的狗，後指說些不實際的話來敷衍應付。 例如：這兜政策對老百姓全無好處，做得講係打屁安狗心。","example":""},{"word":"溚渧","pinyin":"dab di","def":"不乾脆，拖泥帶水的樣子，常用於負面，亦可說「溚溚渧渧」。 例如：你講佢溚渧，毋過佢做事手板盡遽，毋會得人惱。","example":""},{"word":"答識人","pinyin":"dabˋ siidˋ nginˇ","def":"與人酬答，遇紅白喜事，彼此包禮答謝。","example":""},{"word":"答識人禮","pinyin":"dabˋ siidˋ nginˇ liˊ","def":"情誼之間的酬答禮儀。","example":""},{"word":"帶壞帶樣","pinyin":"dai fai dai iong","def":"指破壞成例，作不良示範。 例如：做阿哥个莫帶壞帶樣，老弟老妹會學。","example":""},{"word":"帶監帶監仔","pinyin":"dai gamˊ dai gamˊ eˋ","def":"採半逼迫方式把東西給人或要人做事。 例如：佢恁多歲吔，還毋討親，分厥爺哀帶監帶監仔安排看親。","example":""},{"word":"帶毋落窟","pinyin":"dai mˇ log fudˋ","def":"指死時帶不進墓穴裡。 例如：錢罅使就好，賺恁多乜帶毋落窟。","example":""},{"word":"擔竿無齾","pinyin":"dam gonˊ moˇ ngadˋ","def":"扁擔兩頭若無溝槽，挑起東西時就很難同時顧到兩邊，喻顧此失彼。 例如：日時頭愛上班，暗晡頭又愛打夜學，擔竿無齾愛顧兩頭，實在難耐。","example":""},{"word":"膽膽大","pinyin":"damˋ damˋ tai","def":"用來安慰小孩子膽子要大一點的話語。 例如：毋使驚毋使驚，膽膽大，做公做太。","example":""},{"word":"譫誃","pinyin":"damˇ deˇ","def":"閒聊，漫無主題隨意的聊天。 例如：今晡日毋使上班係無？仰還在這譫誃？ 例如：臨暗仔較涼，隔壁鄰舍會在禾埕項譫誃。","example":""},{"word":"單頭話","pinyin":"danˊ teuˇ fa","def":"單方面的話，片面之詞。 例如：單頭話毋好全信，正毋會分人騙。","example":""},{"word":"單人獨馬","pinyin":"danˊ nginˇ tug maˊ","def":"比喻自己一人單獨行動，沒有絲毫外來的助力。 例如：佢做任何事都當好單人獨馬，無愛別儕來𢯭手。","example":""},{"word":"頂頂碓碓","pinyin":"dangˋ dangˋ doi doi","def":"指說話、做事顛三倒四或遺忘。 例如：𠊎這下記才毋好，講話翻去翻轉，頂頂碓碓。 例如：佢酒食到醉摸摸仔，講話翻去翻轉，頂頂碓碓。","example":""},{"word":"頂碓","pinyin":"dangˋ doi","def":"以言語作弄他人；指人迷糊搞不清楚狀況。 例如：莫緊頂碓佢，佢係講笑毋得个人。","example":""},{"word":"喋","pinyin":"de","def":"誇言。 例如：佢這儕人盡好喋，做三分事就愛膨到十分。","example":""},{"word":"喋喋滾","pinyin":"de de gunˋ","def":"不斷誇言。 例如：佢長透喋喋滾，講佢全世界尞透透。","example":""},{"word":"鬥到角㪐","pinyin":"deu do gogˋ ludˋ","def":"牛一直爭鬥到角都掉下來，形容爭執到底，導致兩敗俱傷。 例如：這兩儕當好鬥，逐擺都鬥到角㪐，實在無結煞。","example":""},{"word":"鬥搭","pinyin":"deu dabˋ","def":"搭配得當、有默契。 例如：該兩兄弟做事一等鬥搭，無人比得。","example":""},{"word":"鬥腳【鬥跤】","pinyin":"deu giogˋ【deu kaˇ】","def":"補足人數。 例如：佢兜愛打麻雀，這下少一腳，你來鬥腳好無？","example":""},{"word":"知差","pinyin":"diˊ caˊ","def":"知道錯了，有後悔的意思。 例如：這下知差，還毋會忒慢。","example":""},{"word":"知衰","pinyin":"diˊ soiˊ","def":"知道自己的劣勢處境。 例如：人無愛𢯭你，你就愛知衰。","example":""},{"word":"知上知下","pinyin":"diˊ song diˊ ha","def":"知道為人處事的禮節。 例如：阿婆阿腦阿華做麼个都知上知下，當曉得。","example":""},{"word":"吊尾錘","pinyin":"diau miˊ cuiˇ","def":"指排行最小的兒子。","example":""},{"word":"屌射","pinyin":"diauˋ sa","def":"責罵。 例如：仰般做就分人屌射，將就莫做好哩。","example":""},{"word":"刁琢【刁古琢】","pinyin":"diauˊ dogˋ【diauˊ guˋ dogˋ】","def":"故意作弄人。 例如：莫恁會刁琢佢，放佢過啦！","example":""},{"word":"跌陣","pinyin":"diedˋ ciin","def":"脫隊，跟不上隊伍，落在隊伍之後。 例如：尞一下仔，等跌陣个人到正共下行。","example":""},{"word":"張人","pinyin":"diongˊ nginˇ","def":"以一種為難人或向人撒嬌的手段達成目的。 例如：這細人仔當會張人，莫分佢跈！","example":""},{"word":"張張掣掣【抽抽掣掣】","pinyin":"diongˊ diongˊ cadˋ cadˋ【cuˊ cuˊ cadˋ cadˋ】","def":"撒嬌、使性子，以時而要時而不要的刁難方式向人求取。 例如：喊佢去買一下豆油，佢張張掣掣毋肯去。","example":""},{"word":"倒去倒轉","pinyin":"do hi do zonˋ","def":"來來回回做重複的事情。 例如：你仰倒去倒轉？敢係毋記得麼个東西係無？ 例如：佢講个古倒去倒轉，敢係癲倲忒吔？","example":""},{"word":"倒頭嫲","pinyin":"do teuˇ maˇ","def":"因離婚再返家的女子，常用於貶義。","example":""},{"word":"倒樹仔摘牛眼","pinyin":"doˋ su eˋ zagˋ ngiuˇ ngienˋ","def":"為了摘取龍眼而砍倒龍眼樹，猶如殺雞取卵，因小題大作而得不償失，亦可說「擎銃仔打蚊仔」。","example":""},{"word":"多子多冤牽","pinyin":"doˊ ziiˋ doˊ ienˊ kienˊ","def":"源自互文「多子多冤牽，少子成神仙」，指子女生得多，牽掛也就相對較多。","example":""},{"word":"多子餓死爺","pinyin":"doˊ ziiˋ ngo xiˋ iaˇ","def":"子女生得多，反而沒人會想去奉養父親。","example":""},{"word":"當樑","pinyin":"dong liongˇ","def":"幹練有擔當。 例如：有恁當樑个總經理，難怪董事長交腳得。","example":""},{"word":"當肯行","pinyin":"dongˊ henˋ hangˇ","def":"願意為他人奔走服務，形容人很勤快不推拖。 例如：這個里長，人喊斯當肯行，難怪連任恁多屆。","example":""},{"word":"當食人","pinyin":"dongˊ siid nginˇ","def":"喻非常愛占人便宜，騙人圖利。 例如：該間店仔个頭家當食人，莫去同佢交關。 例如：該家人當食人，不時將車仔停過隔壁人个車格項。","example":""},{"word":"肚飽目歪","pinyin":"duˋ bauˋ mugˋ vaiˊ","def":"吃碗內看碗外，喻貪心不足。 例如：該個人肚飽目歪，自家有好食還想愛食別儕个。","example":""},{"word":"堵堵撐撐","pinyin":"duˇ duˇ cang cang","def":"形容愛頂嘴、唱反調。 例如：佢長間就對爺哀堵堵撐撐，一息就無好望。","example":""},{"word":"揬來揬去","pinyin":"dudˋ loiˇ dudˋ hi","def":"碰來碰去、彼此撩弄。 例如：係食飯就坐好來食，毋好在該揬來揬去，恁毋像人！","example":""},{"word":"揬𠊎知","pinyin":"dudˋ ngaiˇ diˊ","def":"暗中知會我。 例如：你坐吾隔壁，等一下係有麼个講毋著个，記得愛揬𠊎知。","example":""},{"word":"對佢噭","pinyin":"dui giˇ gieu","def":"表示哭也無濟於事之狀態。 例如：佢苦到無錢好還，你對佢噭也無法度。","example":""},{"word":"對毋過","pinyin":"dui mˇ go","def":"配不上、不合算。 例如：𠊎這棟屋摎你斗換該坵田，實在對毋過！","example":""},{"word":"對人死","pinyin":"dui nginˇ xiˋ","def":"謂極度的怨怪人家，要死要活的樣子。 例如：一下仔無順厥意，就愛對人死，實在還得人惱。","example":""},{"word":"對嘴出","pinyin":"dui zoi cudˋ","def":"反應靈敏、脫口直說，對答如流。 例如：佢講話當流利，輒輒都對嘴出全毋會打結。 例如：講著山歌佢最慶，聲聲句句對嘴出。","example":""},{"word":"對手親","pinyin":"dui suˋ qinˊ","def":"因婚姻關係所成立的兩親家。 例如：佢兩家係對手親，平常時異有來去。","example":""},{"word":"應嘴應鼻","pinyin":"en zoi en pi【in zoi in pi】","def":"老是與人頂嘴。 例如：恁細仔就會應嘴應鼻，盡無規矩。","example":""},{"word":"畫虎膦","pinyin":"fa fuˋ linˋ","def":"喻吹牛。 例如：一尾魚仔兩指大定定，講麼个有十過斤，聽你在該畫虎膦。","example":""},{"word":"化眼","pinyin":"fa ngienˋ","def":"遮蔽或轉移別人視線，讓人看不清真相的手法。 例如：變奇術个人會摎人化眼，分人恅著係有鬼仔摎佢𢯭手。","example":""},{"word":"花螺心（花娘心）","pinyin":"faˊ loˇ ximˊ (faˊ ngiongˇ ximˊ)","def":"不能專一心思，集中心力、情感於某個人、事、物身上。 例如：你毋好恁花螺心，會討毋著姐仔。 例如：後生人做頭路，盡驚花螺心，到尾來會一事無成。","example":""},{"word":"花頭【花虛】","pinyin":"faˊ teuˇ【faˊ hiˊ】","def":"穿著花俏，也可指人心性不定、好玩樂。 例如：你著到恁花頭，愛去哪尞？ 例如：佢異花頭，嘴甜舌滑專專拐細妹人就有。","example":""},{"word":"花囤女","pinyin":"faˊ dunˋ ngˋ","def":"童養媳長大後，沒有配成對而出嫁的女子。","example":""},{"word":"花珞珞仔","pinyin":"faˊ logˋ logˋ eˇ","def":"不安於本分，心意不確定。 例如：厥心思花珞珞仔，又想唱歌，又想跳舞。","example":""},{"word":"掝掝跳","pinyin":"fagˋ fagˋ tiauˇ","def":"形容人活力十足，很活躍的樣子。 例如：講佢中風無人會信，行路還掝掝跳。","example":""},{"word":"飯匙堵貓","pinyin":"fan ciiˇ duˇ meu","def":"原意為以其人之道還治其身，現多有誤用為以歪理搪塞他人。","example":""},{"word":"番仔撿著錫","pinyin":"fanˊ eˋ giamˋ doˋ xiagˋ","def":"喻如獲至寶，愛不釋手的樣子。","example":""},{"word":"空空缺缺","pinyin":"kungˊ kungˊ kiedˋ kiedˋ","def":"點子多；細微末節。 例如：在這公司做恁久，麼个空空缺缺佢就知。","example":""},{"word":"翻牙倒齒","pinyin":"fanˊ ngaˇ do ciiˋ","def":"說話翻來覆去，反覆無常。 例如：該隻後生人食酒醉吔，講話翻牙倒齒，聽就毋識。","example":""},{"word":"揈人","pinyin":"fenˊ nginˇ","def":"理會人。常用在否定句。 例如：先生逐擺同佢講話，佢就毋揈人，還奇怪！","example":""},{"word":"會人毋直","pinyin":"fi nginˇ mˇ ciid","def":"無法跟人家交代。 例如：你同厥衫搣到爛恁大空，這下你斯會人毋直哩。","example":""},{"word":"火缽添油","pinyin":"foˋ badˋ tiamˊ iuˇ","def":"喻火上加油。","example":""},{"word":"火燒山連累猴","pinyin":"foˋ seuˊ sanˊ lienˇ lui heuˇ","def":"喻受到無妄之災。","example":""},{"word":"火燒豬頭","pinyin":"foˋ seuˊ zuˊ teuˇ","def":"面熟、面善的意思。（歇）","example":""},{"word":"火灰性","pinyin":"foˋ foiˊ xin","def":"比喻生氣來得快，消得也快，似灰燼的熱度很快消失。 例如：佢這人哦，火灰性啦，事情過忒就好哩！","example":""},{"word":"和轉去","pinyin":"foˇ zonˋ hi","def":"歸於和好；按原來形式套回去。 例如：兩公婆離婚過後，落尾又和轉去。 例如：窗框㪐忒，同佢和轉去。","example":""},{"word":"房族","pinyin":"fongˇ cug","def":"同族親戚。 例如：族譜有記載各房族人个重要事蹟。","example":""},{"word":"房頭內人","pinyin":"fongˇ teuˇ nui nginˇ","def":"近系的宗親族人。","example":""},{"word":"虎膦轟天","pinyin":"fuˋ linˋ pang tienˊ","def":"老是愛吹牛的樣子。 例如：該隻男仔人總係虎膦轟天，講个話鬼都無愛信。","example":""},{"word":"狐狸莫笑貓","pinyin":"fuˇ liˇ mog seu meu","def":"自己能力也不好，沒資格取笑別人能力差；後面完整語句為「共樣尾翹翹」或「平平尾翹翹」。","example":""},{"word":"湖鰍合䱻【攞鰍合䱻】","pinyin":"fuˇ qiuˊ gagˋ vad【loˊ qiuˊ gagˋ vad】","def":"喻胡亂牽扯一通，
