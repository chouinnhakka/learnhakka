},{"word":"兄弟仔","pinyin":"hiungˊ ti eˋ","def":"指朋友間感情好到像兄弟一般，或指稱兄道弟的黑社會人士。 例如：佢兩儕（個人）个感情好到像兄弟仔樣仔。","example":""},{"word":"好額人【有口人】","pinyin":"hoˋ ngiagˋ nginˇ【iuˊ heuˋ nginˇ】","def":"有錢人家。 例如：聽講有兜好額人（有口人），日仔過到（過啊）當（蓋）簡單。","example":""},{"word":"學精","pinyin":"hog jinˊ","def":"學聰明、學乖。 例如：在外背生活，愛學精兜仔（一息），正毋會分人騙。","example":""},{"word":"行頭","pinyin":"hongˇ teuˇ","def":"指人的架勢。 例如：看佢出手个行頭，就知係練武个人。","example":""},{"word":"降服","pinyin":"hongˇ fug","def":"降服。 例如：你想愛降服這隻獅仔，怕無恁該（容易）喲。","example":""},{"word":"異會著仔【蓋會著仔】","pinyin":"i voi doˋ eˇ【goi voi doˋ eˊ】","def":"讓人覺得很厲害的樣子，帶有一點不屑語氣。 例如：佢買著這限量个杯仔，異會著仔（蓋會著仔），滿哪仔（一哪仔）就拿出來展。","example":""},{"word":"姨丈仔","pinyin":"iˇ congˊ eˋ","def":"連襟，姊妹丈夫之間的稱呼，也有人用「大細仙」來稱呼。 例如：吾姨丈仔當（蓋）會鋸弦仔。","example":""},{"word":"枵鬼【餓鬼】","pinyin":"iauˊ guiˋ【ngo guiˋ】","def":"餓鬼、貪吃。 例如：佢像枵鬼（餓鬼）樣仔，看著東西就咈落去。","example":""},{"word":"枵鬼假細義（學老先生假細義）","pinyin":"iauˊ guiˋ gaˋ se ngi (hog loˋ xinˊ sangˊ gaˋ se ngi)","def":"想要又假裝不要。 例如：人拿分你就食哪，毋好枵鬼假細義（學老先生假細義），恁仔堵來堵去當（盡）壞看。","example":""},{"word":"一莊一俗（一方一俗）","pinyin":"idˋ zongˊ idˋ xiug (idˋ fongˊ idˋ xiug)","def":"各鄉各有不同的風俗習慣，比喻各有不同。 例如：逐（每）隻鄉鎮討親个俗無共樣，難怪人講一莊一俗。","example":""},{"word":"一還一，二還二","pinyin":"idˋ vanˇ idˋ，ngi vanˇ ngi","def":"橋歸橋，路歸路，譬喻處事要明確，切勿混淆不清。亦表示做事要清楚，誠信為重。猶華語「一碼歸一碼」。 例如：阿明做事一還一，二還二，毋會烏白來。","example":""},{"word":"挖空頭","pinyin":"iedˋ kungˊ teuˇ【iadˋ kungˊ teuˇ】","def":"挑毛病。 例如：喊你做又毋，挖空頭就會。","example":""},{"word":"問人（喊人）","pinyin":"mun nginˇ (ham nginˇ)","def":"向人問候、向人打招呼。 例如：看著人愛問人，正有禮貌。","example":""},{"word":"冤枉","pinyin":"ienˊ vongˋ【ianˊ vongˋ】","def":"誣賴、陷害；形容白白浪費，無實質效益；糟糕、可憐。 例如：還冤枉！這領衫仰會恁貴？","example":""},{"word":"夭壽","pinyin":"ieuˊ su【iauˊ xiuˇ】","def":"短命，罵人的話；亦可當誇飾詞使用。 例如：這種事情佢乜敢做？仰會恁夭壽！ 例如：這擺買个西瓜有對時，夭壽甜。","example":""},{"word":"夭壽子","pinyin":"ieuˊ su ziiˋ【iauˊ xiuˇ ziiˋ】","def":"罵人的話，詛咒人短命。 例如：該隻夭壽子，食吔酒還敢駛車仔，無愛命正得。","example":""},{"word":"應酬","pinyin":"in cuˇ","def":"應酬。 例如：做生理輒輒愛同人應酬食飯。","example":""},{"word":"姻親","pinyin":"inˊ qinˊ","def":"因婚姻關係而成為親屬的親戚。 例如：雖然佢同董事長係姻親，毋過一息就毋會靠勢。","example":""},{"word":"養子","pinyin":"iongˊ ziiˋ","def":"撫養和教育子女；養子。 例如：養子不教如養豬。","example":""},{"word":"有樣跈樣","pinyin":"iuˊ iong tenˇ iong","def":"有樣學樣。 例如：毋好對爺哀恁惡，細人仔看著斯會有樣跈樣。","example":""},{"word":"有嘴無心","pinyin":"iuˊ zoi moˇ ximˊ","def":"有口無心。 例如：佢係有嘴無心，你聽聽啊就好，毋使想忒多。","example":""},{"word":"油條","pinyin":"iuˇ tiauˇ","def":"一種油炸的食品，常用於比喻人善於應付，但態度卻敷衍了事。 例如：該儕（該）人當（盡）油條，做事長透（登常）無下無落。","example":""},{"word":"接嘴","pinyin":"jiabˋ zoi","def":"接著他人的話說。 例如：大家正討論煞，佢又接嘴來講。","example":""},{"word":"井肚蛤蟆","pinyin":"jiangˋ duˋ haˇ maˇ","def":"井底之蛙，比喻見識淺薄的人。 例如：一儕（個）人愛多看、多聽、多做，正毋會像井肚蛤蟆。","example":""},{"word":"膏膏纏","pinyin":"goˇ goˇ diˇ","def":"糾纏不休。 例如：事情一擺就講畀好勢來，毋好事後又來膏膏纏。","example":""},{"word":"縱慣勢","pinyin":"jiungˋ guan se【jiungˋ guan xi】","def":"長期縱容，成了習慣。 例如：細人仔毋好縱慣勢，下二擺大吔難教。","example":""},{"word":"縱壞忒【縱壞核】","pinyin":"jiungˋ fai tedˋ【jiungˋ fai hedˋ】","def":"寵壞了。 例如：這隻細人仔分爺哀縱壞忒（縱壞核）哩（吔）。","example":""},{"word":"呿","pinyin":"kiaˇ","def":"互相計較、意見很多。 例如：兄弟之間莫恁好呿，會打壞感情。 例如：阿姊動啊著就呿，講阿姆較（過）惜細倈仔。","example":""},{"word":"契哥","pinyin":"kie goˊ","def":"女子外遇的對象，相對而言，男子外遇的對象則是用「學老嫲」。 例如：阿梅去同契哥，分人捉著（扭著）。","example":""},{"word":"缺虧","pinyin":"kiedˋ kuiˊ【kiadˋ kuiˊ】","def":"遭受損失或受人欺負。 例如：兩兄弟分家，阿哥分較（過）多田產，老弟較（過）缺虧，淨（正）分著一間屋仔定定。","example":""},{"word":"牽成","pinyin":"kienˊ siinˇ【kianˊ siinˇ】","def":"提攜。 例如：係無先生个牽成，佢就無今晡日个成就。","example":""},{"word":"牽頭帶腦","pinyin":"kienˊ teuˇ dai noˋ【kianˊ teuˇ dai noˋ】","def":"領先、帶頭，多用於出壞點子，單講「牽頭」則無負面意涵。 例如：做賊分警察捉著（扭著）愛坐管仔（坐監），牽頭帶腦該儕罪較（過）重。","example":""},{"word":"禽獸畜生","pinyin":"kimˇ cu cugˋ sangˊ","def":"罵人的話，形容人如禽獸如畜生般沒人性。 例如：該個禽獸畜生，專門做拐搶人个事情，死忒（死核）乜係堪該（該死）。","example":""},{"word":"求求乞乞","pinyin":"kiuˇ kiuˇ kiedˋ kiedˋ【kiuˇ kiuˇ kiadˋ kiadˋ】","def":"苦苦哀求。 例如：老妹求求乞乞，拜託阿姆分佢畜虐毛蟲。","example":""},{"word":"共公廳个人（共廳下个人）","pinyin":"kiung gungˊ tangˊ ge nginˇ (kiung tangˇ haˊ ge nginˇ)","def":"同一祠堂的人。 例如：過年過節，共公廳个人會共下來拜阿公婆。","example":""},{"word":"共家人","pinyin":"kiung gaˊ nginˇ","def":"同一家人。 例如：雖然係共家人，毋過儕儕（每一個人）性體無共樣。","example":""},{"word":"共娘胞胎","pinyin":"kiung ngiongˇ bauˊ toiˊ","def":"同胞兄弟姊妹。 例如：佢兩儕人（佢等兩個人）係共娘胞胎，難怪面貌仔（面視）恁相像。","example":""},{"word":"苛人","pinyin":"koˊ nginˇ","def":"苛刻地對待人；佔人便宜。 例如：仰會有恁苛人个頭家？臨時喊人加班，連飯包仔（飯包）都毋盼得買。","example":""},{"word":"看得","pinyin":"kon dedˋ","def":"可以看，值得看；反之，則為「看毋得」。 例如：廳下哪（一哪仔）都狼離狼犁（狼離狼賴），等一下人客愛來，敢看得？","example":""},{"word":"看生趣","pinyin":"kon senˊ qi","def":"看好玩、看笑話。 例如：有人分車仔撞著，你兜人（你等）遽遽（共快）閃開，莫企在這看生趣。","example":""},{"word":"看衰","pinyin":"kon soiˊ","def":"看扁、看不起。 例如：這擺考試較（過）認真兜仔，毋好分人看衰。","example":""},{"word":"罅朋友","pinyin":"la penˇ iuˊ","def":"夠朋友。 例如：這站仔無收入，佢還肯借錢分𠊎，正經罅朋友。","example":""},{"word":"禮數","pinyin":"liˊ su","def":"禮儀規矩。 例如：頭一擺去人屋下拜訪，愛帶等路（妄想）正毋會失禮數。","example":""},{"word":"了少話","pinyin":"liauˋ seu fa","def":"髒話，輕浮不正經的話。 例如：細人仔毋好學人講了少話。","example":""},{"word":"略下人","pinyin":"liog ha nginˇ","def":"一般人。 例如：略下人都毋會合意屙糟个環境。","example":""},{"word":"兩對門","pinyin":"liongˋ dui munˇ","def":"本指門戶相對，引申為兩對面。 例如：同爺哀歇在兩對門真好！","example":""},{"word":"兩老仔","pinyin":"liongˋ loˋ eˇ【liongˋ loˋ eˋ】","def":"兩個老伴，可指夫妻倆、父母親等身分。 例如：子女出外食頭路，屋下正伸兩老仔做伴。","example":""},{"word":"兩子阿公","pinyin":"liongˋ ziiˋ aˊ gungˊ","def":"祖父與孫子兩人；祖母與孫子兩人則為「兩子阿婆」。 例如：阿華兩子阿公異（盡）輒去公園散步。","example":""},{"word":"兩姊嫂","pinyin":"liongˋ ziiˋ soˋ","def":"妯娌兩人，兄弟之妻之間的稱呼。 例如：恁堵好，這兩姊嫂較（過）早該下係同事。","example":""},{"word":"兩同年","pinyin":"liongˋ tungˇ ngienˇ【liongˋ tungˇ ngianˇ】","def":"同年出生的兩個人。 例如：該兩同年，生來平高平高。","example":""},{"word":"兩子哀","pinyin":"liongˋ ziiˋ oiˊ","def":"母子倆；父子倆則為「兩子爺」。 例如：該莊頭伸佢兜（佢等）兩子哀歇在該，鄰舍全部都徙走哩（吔）。","example":""},{"word":"流漂子","pinyin":"liuˇ piu ziiˋ","def":"不務正業的敗家子。 例如：該隻流漂子，同厥爸討錢討毋著，就愛對人生死。","example":""},{"word":"老猴牯","pinyin":"loˋ heuˇ guˋ","def":"對老公的暱稱；對老婆的暱稱為「老猴嫲」。 例如：這駁仔吾（𠊎）該隻老猴牯當（蓋）迷打乒乓。","example":""},{"word":"老老嫩嫩","pinyin":"loˋ loˋ nun nun","def":"老老少少。 例如：社區辦活動，老老嫩嫩都來參加。","example":""},{"word":"老姊老嫂","pinyin":"loˋ ziiˋ loˋ soˋ","def":"老姊老嫂，指妯娌之間的關係已經夠久了。 例如：𫣆兩儕都老姊老嫂吔，還分你个𠊎个做麼个。","example":""},{"word":"勞攪","pinyin":"loˇ gauˋ","def":"打擾。 例如：真敗勢（壞勢），恁暗吔還來勞攪你。","example":""},{"word":"羅漢","pinyin":"loˇ hon","def":"原意指出家且開悟的聖者；客語指無妻兒子女、無固定工作的男子，引申為無業遊民。 例如：大乘佛教中，菩薩同羅漢係有差別个。 例如：羅漢無家無竇、無婆無卵，一儕人（一個人）當（蓋）孤栖。","example":""},{"word":"樂線","pinyin":"log xien","def":"生活態度較悠哉，不緊張。 例如：佢當（蓋）樂線，屋下無米煮飯吔乜毋知好愁。","example":""},{"word":"魯夫牯","pinyin":"luˊ fuˊ guˋ","def":"粗魯不講理的男人。 例如：該隻魯夫牯，當（蓋）難共陣。","example":""},{"word":"毋得錢忒【毋得錢核】","pinyin":"mˇ dedˋ qienˇ tedˋ【mˇ dedˋ qienˇ hedˋ】","def":"諷刺人浪費錢。 例如：好恬恬又買衫又買褲，毋得錢忒（毋得錢核）喺？","example":""},{"word":"毋知見笑","pinyin":"mˇ diˊ gien seu【mˇ diˊ gian seu】","def":"不知羞恥。 例如：這款手路也敢在該展風神，實在毋知見笑。","example":""},{"word":"毋知死","pinyin":"mˇ diˊ xiˋ","def":"不知死活。 例如：仰恁毋知死，早就喊你做，結果你到今還吂（毋曾）做。","example":""},{"word":"毋成東西","pinyin":"mˇ sangˇ dungˊ xiˊ","def":"不像樣的東西，指不值錢的東西。 例如：這毋成東西啦！你莫恁尷尬，遽遽（共快）收下來。","example":""},{"word":"毋知重輕","pinyin":"mˇ diˊ cungˊ kiangˊ","def":"不知輕重。 例如：佢還細，講話毋知重輕，你兜人（你等）毋好同佢計較。","example":""},{"word":"搣鬼搣怪【搣古搣怪】","pinyin":"medˋ guiˋ medˋ guai【miedˋ guˋ miedˋ guai】","def":"盡做一些不正當的事。 例如：事頭愛好好做，毋好歸日搣鬼搣怪（搣古搣怪）。","example":""},{"word":"搣衰人","pinyin":"medˋ soiˊ nginˇ【miedˋ soiˊ nginˇ】","def":"造成他人困擾。 例如：走幾下轉學校同你送課本，正經搣衰人。","example":""},{"word":"搣漦搣鼻","pinyin":"medˋ xiauˇ medˋ pi【miedˋ xiauˇ miedˋ pi】","def":"做一些沒意義的事。 例如：平常時毋煞猛讀書，尞日還搣漦搣鼻，愛仰般（仰仔）有好成績？","example":""},{"word":"面逼逼","pinyin":"mien bedˋ bedˋ","def":"繃著臉，一副不以為然的樣子。 例如：人同佢講話，佢面逼逼無愛搭人。","example":""},{"word":"面皮恁賁","pinyin":"mien piˇ anˋ punˊ","def":"臉皮厚，不知羞恥；相反詞為「面皮恁薄」。 例如：後生人面皮恁賁，好手好腳，還敢同人討錢。","example":""},{"word":"面挷毋下來","pinyin":"mien bangˊ mˇ haˊ loiˇ","def":"拉不下臉。 例如：佢當（蓋）硬頸又好面皮，面挷毋下來，愛佢同厥餔娘（姐仔）會失禮係無可能个。","example":""},{"word":"面皮皮仔","pinyin":"mien piˇ piˇ eˋ【mien piˇ piˇ eˊ】","def":"厚著臉皮，不知悔改。 例如：作業無寫，還面皮皮仔喊先生分佢分數，毋知見笑。","example":""},{"word":"摸彩","pinyin":"moˊ caiˋ","def":"摸彩。 例如：食尾牙大體會有摸彩活動。","example":""},{"word":"無打無算（無打算）","pinyin":"moˇ daˋ moˇ son (moˇ daˋ son)","def":"沒打算、沒計畫。 例如：恁多歲吔，做毋得過像頭擺恁仔無打無算，爺哀斯會愁哦。","example":""},{"word":"無規矩","pinyin":"moˇ guiˊ giˋ","def":"沒規矩、不守規矩；另言「無規無矩」即為沒有紀律之意。 例如：你仰坐在神桌頂項？恁無規矩，遽遽（共快）下來！","example":""},{"word":"無愛聲佢（無愛插佢）","pinyin":"moˇ oi sangˊ giˇ (moˇ oi cabˋ giˇ)【moˇ oi sangˊ iˇ】【moˇ oi cabˋ iˇ】","def":"故意不回應，不甩他。 例如：大家無愛聲佢定定，佢嗄陣陣腦上。","example":""},{"word":"無成","pinyin":"moˇ sangˇ","def":"難不成，難道。 例如：無愛食就莫食，無成還愛𠊎鬥當（拜託）佢食？","example":""},{"word":"無大無細（無老無大）","pinyin":"moˇ tai moˇ se (moˇ loˋ moˇ tai)","def":"不分長幼尊卑，胡鬧沒規矩，用以指責目無尊長的人。 例如：該隻（該）後生仔異（盡）了少，在老人家面前也無大無細，惡桀桀仔。 例如：做人愛知規矩，毋好無大無細，毋知分寸。","example":""},{"word":"無面無目【無面無皮】","pinyin":"moˇ mien moˇ mugˋ【moˇ mien moˇ piˇ】","def":"不講情面，沒有羞恥。 例如：有一句師傅話講：「膝頭戴氈帽，無面無目（無面無皮）。」（諺） 例如：無面無目（無面無皮）个人，毋使摎（同）佢講恁多，較（過）講乜共樣。","example":""},{"word":"無按算","pinyin":"moˇ on son","def":"沒預算、沒準備。 例如：今晡日毋好在屋下食飯，𠊎斯無按算煮飯哦！","example":""},{"word":"望","pinyin":"mong","def":"指望。 例如：莫麼个就望細人仔，自家身體顧好來較（過）贏。","example":""},{"word":"暮固","pinyin":"mu gu","def":"沉默少言。 例如：佢个個性暮固，無麼个嘴碼。","example":""},{"word":"問暢个","pinyin":"mun tiong ge","def":"問開心的，表示沒有意義的發問，多此一問。 例如：這個人客菜價問問啊又無買，實在係問暢个。","example":""},{"word":"揇人","pinyin":"namˋ nginˇ","def":"用手抱人。 例如：這個細人仔看著人就緊揇人，毋驚生份。","example":""},{"word":"難做人","pinyin":"nanˇ zo nginˇ","def":"難做人。 例如：逐儕（每一個人）都想愛同佢共組，分佢難做人。","example":""},{"word":"齧察（齧皺）","pinyin":"ngadˋ cadˋ (ngadˋ jiu)","def":"指人小氣，有進無出，過度節省。 例如：摎（同）齧察个人借東西無恁該（無恁隨便）。","example":""},{"word":"齧察鬼（齧鬼）","pinyin":"ngadˋ cadˋ guiˋ (ngadˋ guiˋ)","def":"吝嗇鬼、鐵公雞，指稱一個人一毛不拔非常小氣，是貶義的用法。 例如：這個齧察鬼，愛佢請食飯斯無恁該（無恁簡單）。","example":""},{"word":"硬直","pinyin":"ngang ciid","def":"指人的個性正直、耿直。 例如：佢做人硬直，絕對毋會講花蓼。","example":""},{"word":"硬頸","pinyin":"ngang giangˋ","def":"形容人的個性強硬頑固，冥頑不靈；現在針對堅持己見，不畏強勢的人也稱「硬頸」。 例如：細人仔恁硬頸定著愛教，正毋會學壞。","example":""},{"word":"硬殼","pinyin":"ngang hogˋ","def":"指人個性固執、不知變通或堅持己見。 例如：佢盡硬殼，愛佢聽你講係無可能个。","example":""},{"word":"若額","pinyin":"ngiaˊ ngiagˋ","def":"你的份。 例如：雞卵糕有兩垤，毋過若額分若老弟食忒哩（食核吔）！","example":""},{"word":"惹人","pinyin":"ngiaˊ nginˇ","def":"招惹他人。 例如：食飽忒閒係無？緊去惹人做麼个？","example":""},{"word":"㘝錢","pinyin":"ngiabˋ qienˇ","def":"偷偷藏錢。 例如：阿爸偷錢想愛買菸，分阿姆發現。","example":""},{"word":"㘝私胲（㘝私伽、挾私胲、挾私伽）","pinyin":"ngiabˋ siiˊ goiˊ (ngiabˋ siiˊ kiaˊ、hiabˋ siiˊ goiˊ、hiabˋ siiˊ kiaˊ)","def":"藏私房錢。 例如：兩公婆毋使㘝私胲啦。","example":""},{"word":"入莊隨俗","pinyin":"ngib zongˊ suiˇ xiug","def":"入境隨俗。 例如：媽祖生該日，異（盡）多外國人入莊隨俗，跈等祭拜求平安。","example":""},{"word":"認分","pinyin":"ngin fun","def":"守分、安分。 例如：天光日愛考試吔，老弟當（蓋）認分，在屋下讀書。","example":""},{"word":"認毋識","pinyin":"ngin mˇ siidˋ","def":"認不出。 例如：十過年無看著，這下路項堵著全認毋識。","example":""},{"word":"認人","pinyin":"ngin nginˇ","def":"一般指小孩能認出熟人與陌生人。 例如：這細人仔會認人，你揇佢毋著啦！","example":""},{"word":"人死債爛","pinyin":"nginˇ xiˋ zai lan","def":"人死債消。 例如：𫣆兜（𠊎等）愛做有信用、負責任个人，萬萬就毋好有「人死債爛」个想法。","example":""},{"word":"牛頭馬面","pinyin":"ngiuˇ teuˇ maˊ mien","def":"罵人不像樣、一副沒有人性的禽獸模樣。 例如：厥倈仔當（蓋）毋像人，逐（每）日遊遊野野毋做事，交个朋友全部係牛頭馬面。","example":""},{"word":"牛膣馬面","pinyin":"ngiuˇ ziiˊ maˊ mien","def":"罵人不要臉，不可理喻。 例如：該隻（該）人牛膣馬面，還得人惱。","example":""},{"word":"戇猴","pinyin":"ngong heuˇ","def":"傻猴子，常用來說人傻。 例如：戇猴！阿公盡惜你呢！","example":""},{"word":"蠕屎蟲（摝屎蟲）","pinyin":"nugˋ siiˋ cungˇ (lugˋ siiˋ cungˇ)","def":"本指糞坑中的蛆蟲，後常用於比喻好動、坐不住的人。 例如：這個細人仔像蠕屎蟲（摝屎蟲）樣仔，緊這看該看。","example":""},{"word":"噥哢公（噥哢婆）","pinyin":"nungˇ nung gungˊ (nungˇ nung poˇ)","def":"嘮叨不休的人。 例如：俗話講：「家無噥哢公，項項空。」","example":""},{"word":"惡擎擎仔","pinyin":"ogˋ kiaˇ kiaˇ eˋ【ogˋ kiaˇ kiaˇ eˊ】","def":"行為凶巴巴的樣子。 例如：有麼个事情愛好好參詳，毋好動啊著就惡擎擎仔。","example":""},{"word":"惡人無膽","pinyin":"ogˋ nginˇ moˇ damˋ","def":"凶惡之人，其實最沒膽子。 例如：佢平常當（蓋）惡，看啊著警察就軟腳，正經係惡人無膽。","example":""},{"word":"擔輸贏","pinyin":"damˊ suˊ iangˇ","def":"有擔當。 例如：做人愛擔輸贏，係講應承人做毋得落櫃。","example":""},{"word":"白行","pinyin":"pag hangˇ","def":"白走一趟。 例如：愛取消約會愛早兜仔講，係無會害人白行一轉。","example":""},{"word":"派頭恁粗","pinyin":"pai teuˇ anˋ cuˊ","def":"架勢那麼大。 例如：有錢人派頭恁粗，做細生日就辦桌。","example":""},{"word":"嗙雞胲（歕雞胲）","pinyin":"pangˊ gieˊ goiˊ (punˇ gieˊ goiˊ)","def":"吹牛。 例如：學校舉辦「嗙雞胲」比賽，大家聽到哈哈大㖸。","example":""},{"word":"妻舅仔","pinyin":"qiˊ kiuˊ eˋ","def":"妻舅，妻子的兄弟。 例如：吾妻舅仔係大學个教授。","example":""},{"word":"七手八腳","pinyin":"qidˋ suˋ badˋ giogˋ","def":"未經統合協調，人多行事反倒慌忙雜亂無效率的現象。 例如：阿源好恬恬搵下去，脣頭（脣口）人行啊兼，七手八腳，該撚這撚，亂舂至舂，全毋驚佢痛。","example":""},{"word":"七做八毋著","pinyin":"qidˋ zo badˋ mˇ cog","def":"老是做錯；義同「三做四毋著」。 例如：七做八毋著，做到（做啊）全無自信吔。","example":""},{"word":"賤手賤腳","pinyin":"qien suˋ qien giogˋ","def":"手腳不規矩，喜歡亂動亂摸。 例如：該細人仔賤手賤腳，當（盡）好這摸該摸。","example":""},{"word":"千差萬差","pinyin":"qienˊ caˊ van caˊ","def":"千錯萬錯。 例如：千差萬差都𠊎毋著，你無毋著，恁仔做得無？","example":""},{"word":"前世無修","pinyin":"qienˇ se moˇ xiuˊ【qienˇ sii moˇ xiuˊ】","def":"前世沒好好修行，才造成今日之後果，具貶義，有時會用來貶低人家，或者貶損自己，自我調侃。 例如：前世無修，倈仔準心臼。","example":""},{"word":"尋尾","pinyin":"qimˇ miˊ","def":"意猶未盡。如「食到會尋尾」。","example":""},{"word":"像樣","pinyin":"qiong iong","def":"喻指舉止中規中矩。 例如：著長袍就愛配馬褂，正較（過）像樣。","example":""},{"word":"閃東閃西","pinyin":"samˋ dungˊ samˋ xiˊ","def":"藉機躲開，逃避責任。 例如：喊佢做事佢總係閃東閃西，還毋係款！","example":""},{"word":"三歲子","pinyin":"samˊ se ziiˋ","def":"三歲小孩。 例如：恁簡單个道理，三歲子乜知。","example":""},{"word":"三兩重就毋動","pinyin":"samˊ liongˊ cungˊ qiu mˇ tungˊ【samˊ liongˊ cungˊ lu/luˊ mˇ tungˊ】","def":"連很輕易很容易做的事都不去做，謂此人懶惰。 例如：有兜好額（有口）人，從細三兩重就毋動，故所這下麼个就毋會。","example":""},{"word":"三條坑水洗毋淨","pinyin":"samˊ tiauˇ hangˊ suiˋ seˋ mˇ qiang","def":"喻跳入黃河也洗不清。 例如：壞蹄哩（吔）！𠊎看這擺斯三條坑水洗毋淨哩（吔）。","example":""},{"word":"省省仔","pinyin":"sangˋ sangˋ eˇ【sangˋ sangˋ eˊ】","def":"使用東西很節儉的樣子。如「省省仔食」、「省省仔用」 例如：糖仔恁多仔定定，你斯愛省省仔食。","example":""},{"word":"笑絲絲仔（笑咪咪仔）","pinyin":"seu xiˊ xiˊ eˋ (seu miˊ miˊ eˋ)【seu miˊ miˊ eˊ】","def":"笑嘻嘻的，微笑。 例如：嬰兒仔生來盡得人惜，一看著人就笑絲絲仔（笑咪咪仔）。","example":""},{"word":"笑連連","pinyin":"seu lienˇ lienˇ","def":"形容笑容滿面。 例如：阿公阿婆揇孫仔，祖孫三儕（個人）都笑連連。","example":""},{"word":"笑頭笑面","pinyin":"seu teuˇ seu mien","def":"歡顏喜面，面帶笑容的樣子。 例如：生理人笑頭笑面，人客看著就會去同佢交關。","example":""},{"word":"小郎叔（小郎仔）","pinyin":"seuˋ longˇ sugˋ (seuˋ longˇ eˋ)","def":"小叔，稱丈夫的弟弟。稱丈夫的妹妹則為「小娘姑」，即小姑。 例如：厥小郎叔係𠊎國中个同學。","example":""},{"word":"小郎叔姆【小郎姆】","pinyin":"seuˋ longˇ sugˋ meˊ【seuˋ longˇ meˊ】","def":"丈夫的弟媳，用於嫂嫂輩稱弟媳。 例如：吾小郎叔姆（小郎姆）係學校个客話先生。","example":""},{"word":"世細【下輩】","pinyin":"sii se【ha pi】","def":"晚輩。 例如：世大人（大人儕）講个話世細（下輩）愛認真聽。","example":""},{"word":"屎胐吂坐燒【屎胐毋曾坐燒】","pinyin":"sii vudˋ mangˇ coˊ seuˊ【sii fudˋ mˇ qienˇ coˊ seuˊ】","def":"屁股都還沒坐熱，猶席不暇暖。 例如：屎胐吂坐燒（屎胐毋曾坐燒），仰恁緊愛轉（歸）屋下？","example":""},{"word":"十嘴九屎胐","pinyin":"siib zoi giuˋ sii vudˋ【siib zoi giuˋ sii fudˋ】","def":"形容人多嘴雜，意見紛歧。 例如：一群人，你一句𠊎一句，十嘴九屎胐，專講該兜不褡不膝个，對問題解決全無較（過）爭。","example":""},{"word":"食百二","pinyin":"siid bagˋ ngi","def":"祝福人活得長壽。 例如：祝福阿公康健食百二。","example":""},{"word":"食自家","pinyin":"siid qi/cii/qidˋ gaˊ","def":"伙食自理。 例如：今晡日公司無夜好食，𠊎轉去（歸去）食自家。","example":""},{"word":"食蛇食𧊅","pinyin":"siid saˇ siid guaiˋ","def":"什麼都吃、喻大小通吃。 例如：這個人食蛇食𧊅，麼人都騙，愛細義哦！","example":""},{"word":"失人禮","pinyin":"siidˋ nginˇ liˊ","def":"失禮，忽視了人情義理。 例如：去拜訪長輩愛帶等路（妄想），正毋會失人禮。","example":""},{"word":"成人長大","pinyin":"siinˇ nginˇ zongˋ tai","def":"長大成人。 例如：幾下年前還係細人仔，一𥍉目就成人長大吔。","example":""},{"word":"受氣","pinyin":"su hi","def":"生氣，被人或事所激怒。 例如：做頭家儕（頭家）逐（每）日愛受氣，𠊎看轉去（歸去）做承勞領月給好哩（吔）！","example":""},{"word":"手銃【賤】","pinyin":"suˋ cung【qien】","def":"言行不恭、沒大沒小的行為。 例如：這細人仔當（盡）手銃（賤），伯公下个神茶杯也拿來裝尿搞。","example":""},{"word":"手外外仔","pinyin":"suˋ ngoi ngoi eˋ【suˋ ngoi ngoi eˊ】","def":"手部動作不靈活；不伸援手之意。 例如：老弟著傷過後，擎（使）筷仔手外外仔。","example":""},{"word":"熟面","pinyin":"sug mien","def":"面熟；而「熟面熟面」則為面熟的樣子。 例如：脣口該張桌坐个人客試著（測著）異（盡）熟面，毋過想毋著在哪見過。","example":""},{"word":"熟事人","pinyin":"sug sii nginˇ","def":"熟識的人。 例如：堵著熟事人愛相借問，毋好詐無看著。","example":""},{"word":"孫嫂","pinyin":"sunˊ soˋ","def":"孫媳婦。 例如：佢正討个孫嫂同厥孫仔共單位，乜係食公家頭路。","example":""},{"word":"𢱤來𢱤去","pinyin":"sungˋ loiˇ sungˋ hi","def":"推來推去。 例如：喊你兩兄弟去撿揫，就在該𢱤來𢱤去，還慘哦！","example":""},{"word":"雙頭剪（來去剪、兩頭剪、雙下剪）","pinyin":"sungˊ teuˇ jienˋ (loiˇ hi jienˋ、liongˋ teuˇ jienˋ、sungˊ ha jienˋ)","def":"賠了夫人又折兵。 例如：這拜三，先前應講陪佢去高雄尞，毋單愛出車，還愛摎（同）公司請假，正經係雙頭剪，了多哩（吔）。","example":""},{"word":"大出手","pinyin":"tai cudˋ suˋ","def":"出手大方。 例如：頭家這擺大出手，一輪（擺）就補助十萬箍（個銀）。","example":""},{"word":"大家人","pinyin":"tai gaˊ nginˇ","def":"泛指眾人，即我們大家；亦指大家庭，表人口眾多之意。 例如：恁久無看著你，𠊎兜（𠊎等）大家人都盡想你呢！ 例如：阿火伯，倈仔、妹仔有七、八個，孫仔有十過個，做得講係大家人。","example":""},{"word":"大下手","pinyin":"tai ha suˋ","def":"出手大方的樣子。 例如：頭家這擺異（盡）大下手，抨（開）十億來整工廠。","example":""},{"word":"大將","pinyin":"tai jiong","def":"隊中技藝高、風度好的重要人物。 例如：這球隊肚（裡背）有當（盡）多大將，故所輒常打頭名。","example":""},{"word":"大開大使","pinyin":"tai koiˊ tai siiˋ","def":"形容出手闊氣大方，不知節制。 例如：像佢恁樣（恁仔）大開大使、好食懶做，早慢就會背笐仔（背家濟仔）。","example":""},{"word":"大目新娘","pinyin":"tai mugˋ xinˊ ngiongˇ","def":"喻迷糊或對新環境生疏的人。 例如：大目新娘，看灶頭毋著。（歇）","example":""},{"word":"大娘姊","pinyin":"tai ngiongˇ jiˋ","def":"丈夫的姊姊；稱丈夫的哥哥則為「大郎伯」。 例如：吾老公係吾大娘姊渡大个，故所佢就像吾家娘樣仔。","example":""},{"word":"大戇牯（戇仔）","pinyin":"tai ngong guˋ (ngong eˋ)","def":"大傻瓜。 例如：正經係大戇牯，身家都分佢騙淨淨吔，還毋知好分醒！","example":""},{"word":"大細目","pinyin":"tai se mugˋ","def":"大小眼，有偏心意味。 例如：做人阿姆儕（个人）愛平心，千萬毋好大細目。","example":""},{"word":"大大細細","pinyin":"tai tai se se","def":"家中的所有成員，包含大人和小孩。 例如：尾牙該日，你愛帶屋下大大細細來分𠊎請哦！","example":""},{"word":"大主大意","pinyin":"tai zuˋ tai i","def":"自作主張，我行我素。 例如：這件事情恁大，愛大家參詳，毋好自家大主大意。","example":""},{"word":"探看啊","pinyin":"tamˋ kon aˋ","def":"打聽看看。 例如：愛買屋以前，盡好（最好）先去探看啊！","example":""},{"word":"貪㘔","pinyin":"tamˊ saiˊ","def":"貪吃。 例如：佢就係貪㘔，正會屙痢肚。","example":""},{"word":"聽毋入耳","pinyin":"tangˊ mˇ ngib ngiˋ","def":"不採納人所說的話。 例如：吾（𠊎）老妹當（盡）硬殼，勸佢个話全部聽毋入耳。","example":""},{"word":"𢯭鬧熱","pinyin":"ten nau ngied【ten nau ngiad】","def":"共襄盛舉。 例如：廟項辦活動，共下來去𢯭鬧熱。","example":""},{"word":"頭仔","pinyin":"teuˇ eˋ","def":"領導者。 例如：這下獅子會（獅仔會）个頭仔，大體（大概）係用選个，毋係比錢多就做得。","example":""},{"word":"調和（調解）","pinyin":"tiauˇ foˇ (tiauˇ gieˋ)【tiauˇ giaiˋ】","def":"為雙方排解問題，平息紛爭。 例如：這兩家人見擺冤家，就愛請里長調和（調解）。","example":""},{"word":"討功勞","pinyin":"toˋ gungˊ loˇ","def":"邀功。 例如：𠊎同佢𢯭手係朋友个情分，討功勞个事情𠊎做毋來。","example":""},{"word":"脫陣","pinyin":"todˋ ciin","def":"脫隊。 例如：蹶山（跋山）該下，領隊盡驚有人半路仔脫陣。","example":""},{"word":"托核（托核卵）【扶核卵】","pinyin":"togˋ hag (togˋ hag lonˋ)【puˇ hag lonˋ】","def":"喻奉承拍馬屁。 例如：你長透（不時）同佢托核（扶核卵），佢識打一隻燒屁卵分你食無？","example":""},{"word":"土土","pinyin":"tuˋ tuˋ","def":"指不善言辭之人；樸實不善修飾之人。 例如：莫看佢恁仔土土，其實佢係幾下間大公司个頭家。","example":""},{"word":"動手動腳","pinyin":"tungˊ suˋ tungˊ giogˋ","def":"打鬧或戲弄的動作，一般多指對人輕薄、騷擾的小動作。 例如：有事情用講个就好，莫恁仔動手動腳壞看相。","example":""},{"word":"同年","pinyin":"tungˇ ngienˇ【tungˇ ngianˇ】","def":"稱年齡相同的人；指同榜登科的人。 例如：阿美同阿梅兩儕（個人）同年，毋過阿美看起來較（過）後生。","example":""},{"word":"話","pinyin":"va","def":"勸說。 例如：上屋个兩公婆恁久異（盡）會冤家，大家喊叔婆去話開佢兜（佢等）。","example":""},{"word":"偎大片","pinyin":"vaˋ tai pienˋ","def":"靠向優勢的一邊。 例如：西瓜偎大片係正常个，你毋使怨怪佢反心。","example":""},{"word":"偎凴","pinyin":"vaˋ ben","def":"依靠、依賴。 例如：有能力个人，毋使偎凴麼个，乜撐得出自家个一片天。","example":""},{"word":"死無命哩【死無命吔】","pinyin":"xiˋ moˇ miang leˊ【xiˋ moˇ miang eˇ】","def":"以將丟失性命來比喻狀況很差，猶言糟糕，完蛋了。 例如：這擺就死無命哩（死無命吔）！皮包仔毋知跌哪去，一哪仔都尋無。","example":""},{"word":"死老實","pinyin":"xiˋ loˋ siid","def":"過於老實，罵人老實不知變通。 例如：你哦！死老實，哪日分人賣忒（賣核）就（都）毋知！","example":""},{"word":"篩過","pinyin":"qiˊ go","def":"經過篩選。 例如：這兜詞條愛用無？請大家來篩過。","example":""},{"word":"惜過頭","pinyin":"xiagˋ go teuˇ","def":"過度疼愛。 例如：惜過頭就係縱，仰得成材呢！","example":""},{"word":"漦漦鼻鼻","pinyin":"xiauˇ xiauˇ pi pi","def":"囉囉嗦嗦，不乾脆的樣子，引申指人身體毛病很多。 例如：有麼个話決截啊講出來，莫恁多漦漦鼻鼻。","example":""},{"word":"先號先贏","pinyin":"xienˊ ho xienˊ iangˇ","def":"誰先佔有誰先使用。 例如：先號先贏哦，落尾（背尾）來个斯壁背企哦！","example":""},{"word":"先走先贏","pinyin":"xienˊ zeuˋ xienˊ iangˇ","def":"先跑先贏，猶言「三十六計走為上策」。 例如：看這勢面，阿爸定著會發譴，𫣆兜（𠊎等）還係先走先贏，莫去惹著佢。","example":""},{"word":"心肝仔","pinyin":"ximˊ gonˊ eˋ","def":"心肝寶貝。 例如：𠊎兜（𠊎等）恁多兄弟姊妹做下（聚概）係爺哀个心肝仔。","example":""},{"word":"新丁","pinyin":"xinˊ denˊ","def":"新生的男兒。 例如：現下客人屋下無論降倈仔抑係降妹仔，都會在正月半抑係十月半打新丁粄！","example":""},{"word":"相賽","pinyin":"xiongˊ coi","def":"爭相、相互、相繼。 例如：聽著係毋使錢个，大家相賽去參加。 例如：這擺地動當（蓋）嚴重，大家人相賽捐錢出來。","example":""},{"word":"相打泌背","pinyin":"xiongˊ daˋ bi boi","def":"打得不可開交。 例如：佢兜（佢等）兄弟仔還細時節，長間（不時）相打泌背，無想著大吔嗄親暱暱仔。","example":""},{"word":"相堵頭","pinyin":"xiongˊ duˇ teuˇ","def":"相遇。 例如：見相堵頭，佢會同人頷頭，當（蓋）有禮貌。","example":""},{"word":"相行","pinyin":"xiongˊ hangˇ","def":"來往、交往、相尋。 例如：佢兩儕（個人）係國小同學，到今還有相行。 例如：阿姊摎（同）厥朋友冤家，背尾就無相行哩（吔）。","example":""},{"word":"相尖泌背","pinyin":"xiongˊ jiamˊ bi boi","def":"擠得不可開交。 例如：上、下班時間，逐（每）枋車都淰淰（滿滿）个人，逐（每）日同人相尖泌背實在艱苦。","example":""},{"word":"相罵","pinyin":"xiongˊ ma","def":"互相謾罵吵架。 例如：相罵無好話，事情還係愛坐下來講清楚較（過）好。","example":""},{"word":"相搶泌背","pinyin":"xiongˊ qiongˋ bi boi","def":"搶得不可開交。 例如：大賣場个拍賣品𢱤啊出來，大家就相搶泌背驚買毋著。","example":""},{"word":"相惜","pinyin":"xiongˊ xiagˋ","def":"愛護照顧。 例如：承蒙你恁相惜，正會恁順序。","example":""},{"word":"相爭泌背","pinyin":"xiongˊ zangˊ bi boi","def":"爭得不可開交。 例如：為著一息仔田產，兄弟仔相爭泌背，打壞感情實在毋值。","example":""},{"word":"詐癲","pinyin":"za dienˊ","def":"裝瘋賣傻。 例如：𠊎親眼看著你偷拿人个錢，遽遽（共快）承認，莫在該詐癲。","example":""},{"word":"詐生詐死","pinyin":"za sangˊ za xiˋ","def":"藉口推辭規避或拒絕。 例如：逐（每）擺𠊎尋佢𢯭手，佢總係詐生詐死，這擺換你出面，看佢還有麼个話好講無。","example":""},{"word":"詐死","pinyin":"za xiˋ","def":"裝死；又如「詐睡」為裝睡、「詐毋知」為假裝不知情、「詐戇」為裝傻。 例如：有个動物堵著危險該下，會用詐死个步數來閃避。","example":""},{"word":"斬頭（㓾頭）","pinyin":"zamˋ teuˇ (ciiˇ teuˇ)","def":"砍頭、殺頭。 例如：正經係戇到毋會爪癢，這種會斬頭个事你也敢應承！","example":""},{"word":"照樣","pinyin":"zeu iong","def":"照樣，依照某方式、依舊。 例如：講恁多到，佢還係照樣，全無改進。","example":""},{"word":"照輪","pinyin":"zeu linˇ","def":"輪流。 例如：一儕（個人）一禮拜，你兩儕（個人）照輪。","example":""},{"word":"子兒","pinyin":"ziiˋ iˇ","def":"兒女。 例如：厥个家教好，子兒逐（每）個都異（盡）有出息。","example":""},{"word":"子叔","pinyin":"ziiˋ sugˋ","def":"叔姪；「兩子叔」表「叔姪兩人」。 例如：該兩子叔感情異（盡）好，逐（每）日都像聖筊仔樣仔黏做一副。","example":""},{"word":"指揮","pinyin":"ziiˋ fiˊ","def":"發號施令，指示別人。 例如：佢自家毋做，顛倒當（盡）會指揮人。","example":""},{"word":"做便","pinyin":"zo pien","def":"事先做好，等待使用。 例如：有閒就先做便，愛用該下跈等（黏皮）就有。","example":""},{"word":"做手（做手腳）","pinyin":"zo suˋ (zo suˋ giogˋ)","def":"耍手段；造假。 例如：彩券開獎係當（蓋）公平个，絕對做毋得做手（做手腳）。","example":""},{"word":"作反（造反）","pinyin":"zogˋ fanˋ (co fanˋ)","def":"造反。 例如：你今愛作反係無？屋下个大項下事情愛大家議定正準算。","example":""},{"word":"著共條褲","pinyin":"zogˋ kiung tiauˇ fu","def":"喻一起成長或志同道合的人，喻情投意合、志氣相投。 例如：佢兩儕（個人）係著共條褲大个好朋友，故所正會恁合線。","example":""},{"word":"嘴板","pinyin":"zoi banˋ","def":"口才，口條，指能力方面。 例如：佢嘴板盡好，當（盡）會做生理。","example":""},{"word":"嘴甜舌滑","pinyin":"zoi tiamˇ sad vad","def":"油腔滑調，善於說好聽的話。 例如：阿宏牯嘴甜舌滑，連樹頂个鳥仔都會分佢拐下來喲！","example":""},{"word":"轉外家（轉妹家）","pinyin":"zonˋ ngoi gaˊ (zonˋ moi gaˊ)","def":"回娘家。 例如：見到年初二，阿舅都會照禮俗來帶阿姆轉外家（轉妹家）。","example":""},{"word":"專工","pinyin":"zonˊ gungˊ","def":"專程。 例如：阿婆跌倒入院，舅公專工帶果子來看佢。","example":""},{"word":"掌門狗","pinyin":"zongˋ munˇ gieuˋ","def":"看門狗，常用以諷刺待在家中不出門的人。 例如：你係掌門狗喺？仰有法度歸日仔在屋下全毋出去？","example":""},{"word":"主事人","pinyin":"zuˋ sii nginˇ","def":"面對一件事情，當家做主的人。 例如：這件事情𠊎無法度主意，愛問主事人正較（過）準。","example":""},{"word":"總包（總貌）","pinyin":"zungˋ bauˊ (zungˋ mau)","def":"全部包下來。 例如：這事頭你總包起來，屋下恁多人會同你𢯭做，毋使驚。","example":""},{"word":"駁嘴【駁牙鉸】","pinyin":"bogˋ zoi【bogˋ ngaˇ gau】","def":"爭執、吵架。 例如：駁嘴（駁牙鉸）該下，定著無好話。","example":""},{"word":"牽頭","pinyin":"kienˊ teuˇ【kianˊ teuˇ】","def":"帶頭。例如「佢牽頭湊（邀）大家去食晝」。","example":""},{"word":"出頭","pinyin":"cudˋ teuˇ","def":"替人撐腰；多一點點、約略。 例如：無若事，毋好恁好同人出頭。 例如：佢大約仔五十歲出頭。","example":""},{"word":"命團仔（命袋仔）","pinyin":"miang tonˇ eˋ (miang toi eˋ)","def":"心肝寶貝、很重要的東西。 例如：佢四十歲吔正降著一個倈仔，惜到（惜啊）命團仔（命袋仔）樣仔。","example":""},{"word":"出面","pinyin":"cudˋ mien","def":"有樣子、有規模。例如「生理緊做緊出面」。","example":""},{"word":"有講","pinyin":"iuˊ gongˋ","def":"很有話聊。 例如：阿姆同阿姑盡有講，親暱暱仔像姊妹樣仔。","example":""},{"word":"花舌","pinyin":"faˊ sad","def":"形容虛假而動聽的話，即謊話。 例如：佢當（盡）花舌，無人敢信厥話。","example":""},{"word":"無要緊","pinyin":"moˇ ieu ginˋ","def":"不要緊、沒關係。 例如：係講你肚飢，你就先食，無要緊。","example":""},{"word":"半桶水","pinyin":"ban tungˋ suiˋ","def":"喻學藝不專精，一知半解的人。 例如：厥手藝學到半桶水就喋喋滾，異（盡）會樣。","example":""},{"word":"毋知人吔","pinyin":"mˇ diˊ nginˇ eˋ","def":"不省人事，亦可說「毋知人事」。 例如：過路个老阿伯，分車仔撞到（撞啊）異（盡）傷重，聽講毋知人吔！","example":""},{"word":"毋壁","pinyin":"mˇ biagˋ","def":"指辦事能力差勁。 例如：佢做事毋壁又壞癖，聽講係靠關係來个。","example":""},{"word":"無半撇","pinyin":"moˇ ban piedˋ","def":"沒有半點能力。 例如：講著搞就好擳擳仔（好絕絕仔），講著讀書就無半撇。","example":""},{"word":"無婆無卵","pinyin":"moˇ poˇ moˇ lonˋ","def":"無婆指無老婆，無卵指無老公；無妻無夫之人，喻單身。 例如：恁多歲吔，還無婆無卵，係堵著發病仔愛仰結煞？","example":""},{"word":"無正無經","pinyin":"moˇ ziin moˇ ginˊ","def":"不正經，猶如嬉戲般。 例如：這細人仔食飯無正無經，飯糝跌到（跌啊）滿地泥。 例如：厥話無正無經，聽毋得。","example":""},{"word":"饒赦（饒）","pinyin":"ngieuˇ sa (ngieuˇ)","def":"原諒、饒恕。 例如：犯重罪，饒赦毋得。","example":""},{"word":"大婆細姐","pinyin":"tai poˇ se jiaˋ","def":"妻與妾。 例如：頭擺个男仔人當（蓋）多討大婆細姐。","example":""},{"word":"挑工","pinyin":"tiauˊ gungˊ","def":"專程；刻意。 例如：聽講你起樓屋，𠊎挑工來參觀。 例如：喊佢毋好恁仔，佢挑工愛恁仔，實在奈佢毋何。","example":""},{"word":"推懶","pinyin":"toiˊ nanˊ","def":"推諉偷懶。 例如：做得到个事情就愛盡力做，毋好推懶。","example":""},{"word":"圖食（圖㘔）","pinyin":"tuˇ siid (tuˇ saiˊ)","def":"貪吃。 例如：這個細人仔當（蓋）圖食，無留半點分人食。","example":""},{"word":"拗蠻","pinyin":"auˊ manˇ","def":"非常、相當。 例如：厥滿子拗蠻慶（壁），舊年考著律師，今年又考著司法官。","example":""},{"word":"擺擺","pinyin":"baiˋ baiˋ","def":"每次、每回。 例如：佢運氣當（蓋）好，擺擺就抽著獎。","example":""},{"word":"半晝前後","pinyin":"ban zu qienˇ heu","def":"大約十點左右的時候。 例如：這下係工業社會，一般人家半晝前後旦勢（大部分）無人在。","example":""},{"word":"半中央【半中間】","pinyin":"ban dungˊ ongˊ【ban zungˊ gianˊ】","def":"指一段時間或空間上的中間位置。 例如：佢洗身仔泅到半中央（半中間），腳嗄勼筋。","example":""},{"word":"半晝半暗","pinyin":"ban zu ban am","def":"指上午九、十點或下午三、四點的時候。 例如：嬰兒仔當會大个時節，半晝半暗都愛食點心正罅。","example":""},{"word":"半晝邊仔","pinyin":"ban zu bienˊ eˋ【ban zu bienˊ eˊ】","def":"半個早晨的光景。 例如：阿姆去街項，半晝邊仔就會轉來（歸來）。","example":""},{"word":"挷後","pinyin":"bangˊ heu","def":"延後；相反詞為「蹍前」。 例如：因為風搓來，這擺个考試愛挷後。","example":""},{"word":"…邊仔","pinyin":"...bienˊ eˋ【...bienˊ eˊ】","def":"約略，多用於短暫的時間。 例如：當晝邊仔。","example":""},{"word":"座頭前","pinyin":"co teuˇ qienˇ","def":"在前頭，位於前面。相反為「座後背」。 例如：這擺媽祖婆（媽祖婆廟）愛去割香，阿山擎旗仔座頭前。","example":""},{"word":"長久","pinyin":"congˇ giuˋ","def":"長久、時間長。 例如：朋友之間愛有來有去，正會長久。","example":""},{"word":"長年透天","pinyin":"congˇ ngienˇ teu tienˊ【congˇ ngianˇ teu tienˊ】","def":"整年，一年到底，經常；也可說「一年透天」。 例如：阿樹長年透天在外國做事罕得轉（歸），厥細人仔強強會認佢毋識吔！","example":""},{"word":"旦旦","pinyin":"danˋ danˋ","def":"幾乎、大多是。 例如：這下个人，旦旦都曉得用電腦。","example":""},{"word":"旦勢（大半）【大部分】","pinyin":"danˋ sii (tai ban)【tai pu fun】","def":"多半、多數。 例如：今下人，旦勢（大部分）用手機仔看新聞較（過）多。","example":""},{"word":"在中央【在中】","pinyin":"di dungˊ ongˊ【di dungˊ】","def":"正中央。 例如：草坪項青溜溜仔，在中央（在中）有一頭樹仔，當（蓋）打眼。","example":""},{"word":"點過鐘","pinyin":"diamˋ go zungˊ","def":"一個多鐘頭。 例如：對臺北下高雄，坐高鐵點過鐘就到得。","example":""},{"word":"到今","pinyin":"do gimˊ【do ginˊ】","def":"至今。 例如：阿國去買豆油，到今吂（毋曾）轉（歸），係瀉去哪？","example":""},{"word":"斷真","pinyin":"don ziinˊ","def":"確實；真的，表示果然是如此的判斷或反問。例如「斷真係恁樣（恁仔）？」","example":""},{"word":"當當【倘剔】","pinyin":"dongˊ dongˊ【tang ti】","def":"正在從事某事的過程中。 例如：阿姆當當在該煮飯（阿姆飯煮倘剔），過五分鐘正打來做得無？","example":""},{"word":"放勢牯【盡命牯】","pinyin":"fong se guˋ【qin miang guˋ】","def":"盡情地。 例如：天光日毋使上班，你做你放勢牯（盡命牯）睡，無相干。","example":""},{"word":"赴時赴刻","pinyin":"fu siiˇ fu kiedˋ","def":"準時，及時趕上，急著要。 例如：阿旺伯盡有信用，同人做西裝，總係赴時赴刻趕分人。","example":""},{"word":"該搭仔【該跡仔、該息仔】","pinyin":"ge dab eˋ【ge jiagˋ eˊ、ge xidˋ eˊ】","def":"那個地方，範圍較小且較近。 例如：阿財叔偎大路該搭仔（該跡仔）个柑園，柑仔打當（蓋）結，又紅又大粒當（蓋）餳人。","example":""},{"word":"該方所在","pinyin":"ge vongˊ soˋ cai","def":"某個方位的地方，範圍較大且較遠。 例如：當（蓋）多人䟓䟓去合歡山該方所在看雲海。","example":""},{"word":"個零月（個過月、隻過月）","pinyin":"ge langˇ ngied (ge go ngied、zagˋ go ngied)【ge langˇ ngiad (ge nangˇ ngiad)】【ge go ngiad、zagˋ go ngiad】","def":"一個多月。 例如：阿哥去臺北讀大學，個零月正會轉來（歸來）一擺。","example":""},{"word":"幾輒仔","pinyin":"gidˋ jiab eˋ【idˋ diab eˊ】","def":"次數多少？多常？ 例如：聽講你當（蓋）會泅水，請問你有幾輒仔去游泳池練習？","example":""},{"word":"見擺","pinyin":"gien baiˋ【gian baiˋ】","def":"每次。 例如：這片較（過）低，見擺落雨就做大水，水全毋會退。","example":""},{"word":"久見","pinyin":"giuˋ gien【giuˋ gian】","def":"好久不見。 例如：學校畢業四十年毋識相堵頭，正經久見。","example":""},{"word":"過晝","pinyin":"go zu","def":"過了中午；太遲了。 例如：阿桃姊做事當（蓋）煞猛，長間（不時）做到過晝吔還毋肯放尞。","example":""},{"word":"怪毋得","pinyin":"guai mˇ dedˋ","def":"難怪。 例如：麼个都毋肯食，緊食糖仔，怪毋得畜毋會大。","example":""},{"word":"下後","pinyin":"ha heu","def":"後來、以後、往後、之後。 例如：阿珍幾下擺就考毋著機車个執照，下後佢也無想愛買機車哩（吔）。","example":""},{"word":"向往上【面向上】","pinyin":"hiong gongˊ songˊ【mien hiong songˊ】","def":"向上。「向往下（面向下）」即為「向下」。 例如：豆油盎仔个口愛向往上（面向上），豆油正毋會倒出來。","example":""},{"word":"向別位","pinyin":"hiong ped vi","def":"朝別處。 例如：毋好緊向𠊎這片嗽啦！向別位去。","example":""},{"word":"向轉來","pinyin":"hiong zonˋ loiˇ","def":"轉向過來。 例如：桌仔擺毋著向哩（吔），有拖箱仔該片愛向轉來正著。","example":""},{"word":"這搭仔【這跡仔、這息仔】","pinyin":"iaˋ dab eˋ【iaˋ jiagˋ eˊ、iaˋ xidˋ eˊ】","def":"這一帶；表「那一帶」之意則為「該搭仔（該跡仔）」。 例如：這搭仔（這跡仔）恁屙糟，你去拿掃把來掃掃啊！","example":""},{"word":"這片頭","pinyin":"iaˋ pienˋ teuˇ","def":"這一頭；表「那一頭」之意則為「該片頭」。 例如：阿貴對這片頭尋到該片頭，共樣尋無。","example":""},{"word":"一色青天【青天格】","pinyin":"idˋ sedˋ qiangˊ tienˊ【qiangˊ tienˊ gagˋ】","def":"晴空萬里。 例如：好天時跋上山崠頂，就做得看得著一色青天（青天格）同遠遠个好風景。","example":""},{"word":"一半擺仔【一兩擺仔】","pinyin":"idˋ ban baiˋ eˇ【idˋ liongˋ baiˋ eˇ】","def":"一次兩次，偶爾。 例如：一半擺仔（一兩擺仔）無相干，係長透（不時）恁仔，該斯做毋得哦！","example":""},{"word":"一站仔","pinyin":"idˋ cam eˋ【idˋ cam eˊ】","def":"一段距離或一段時間。 例如：阿哥做兵个時節，識在金門戴（歇）過一站仔時間。","example":""},{"word":"一搭【一跡】","pinyin":"idˋ dab【idˋ jiagˋ】","def":"一區或一塊。 例如：厥衫褲膏著油漆，搣到（搣啊）這一搭（一跡）該一搭（一跡）。","example":""},{"word":"一下半下（擺把仔）","pinyin":"idˋ ha ban ha (baiˋ baˋ eˇ)【baiˋ baˋ eˊ】","def":"偶爾。 例如：一下半下（擺把仔）讓佢無要緊，同佢打逆面無較（過）贏。","example":""},{"word":"一路里來（一溜里來）","pinyin":"idˋ lu liˊ loiˇ (idˋ liu liˊ loiˇ)","def":"一直以來。用在時間上。 例如：厥人生一路里來都當（蓋）順序，毋單淨讀書，頭路乜係。","example":""},{"word":"一日到暗","pinyin":"idˋ ngidˋ do am","def":"從早到晚、一天到晚。 例如：毋好一日到暗掌等電視，目珠會看壞忒（壞核）。","example":""},{"word":"一等","pinyin":"idˋ denˋ","def":"一等、最。 例如：客人煮食一等慶（壁），炒个炒肉一等好食。","example":""},{"word":"一刻時","pinyin":"idˋ kiedˋ siiˇ","def":"一刻鐘，四分之一小時，等於十五分鐘。 例如：食晝過後吂（毋曾）有一刻時，還飽脹飽脹（飽肚飽肚），麼个就毋想食。","example":""},{"word":"一空一壢","pinyin":"idˋ kungˊ idˋ lagˋ【idˋ kangˊ idˋ lagˋ】","def":"「空」指洞穴，「壢」指溝壑，「一空一壢」是指包括洞、溝的所有地區。 例如：厥祖上世世代代就一哪仔開山打林，這條河壩對水頭到水尾，一空一壢就分佢兜（佢等）開墾過。","example":""},{"word":"一𥍉目（一眨目）","pinyin":"idˋ ngiabˋ mugˋ (idˋ sabˋ mugˋ)","def":"一眨眼、轉眼之間，表時間很短。 例如：這細人仔盡蠻皮，一𥍉目（一眨目）佢就瀉去大路項吔。","example":""},{"word":"一時半刻","pinyin":"idˋ siiˇ ban kiedˋ","def":"表示時間太短不夠用。 例如：厥手板毋遽，一時半刻還做毋好。","example":""},{"word":"有理無理","pinyin":"iuˊ liˊ moˇ liˊ","def":"不管有無道理。 例如：不管有理無理，你就係做毋得先出手打人。","example":""},{"word":"及時及急（臨時臨及）","pinyin":"kib siiˇ kib gibˋ (limˇ siiˇ limˇ kib)","def":"謂時間緊急而事件又急迫，亦可說「及及仔、臨時臨要、臨時臨急、臨時著急」。 例如：見擺都恁仔，及時及急正來緊拚拚仔（亂緊緊仔）趕工，做得出麼个來。","example":""},{"word":"極著【擠著】","pinyin":"kid doˋ【gid doˋ】","def":"因空間狹小而互相推擠、受到壓擠。 例如：袋仔裡背个柑仔極著（擠著）哩（吔），舞到綿綿。","example":""},{"word":"極力（煞力牯）","pinyin":"kid lid (sadˋ lid guˋ)","def":"極力，竭盡一切能力。 例如：這件事情大家極力（煞力牯）來打拚，正會成功。","example":""},{"word":"近近仔","pinyin":"kiunˊ kiunˊ eˋ【kiunˊ kiunˊ eˊ】","def":"距離很近。 例如：厥屋下離車頭近近仔，行路毋使五分鐘。","example":""},{"word":"虧得","pinyin":"kuiˊ dedˋ","def":"幸而；反諷譏笑、責備之詞。 例如：虧得有你𢯭手，係無這事做到暗乜還做毋忒（做毋核）。 例如：今晡日虧得你赴毋掣，害大家無赴著火車。","example":""},{"word":"連連續續","pinyin":"lienˇ lienˇ sa sa","def":"接連著持續不斷。 例如：這位先生當（蓋）會指導學生仔，連連續續有幾下個學生仔得獎。","example":""},{"word":"臨尾【撂尾】","pinyin":"limˇ miˊ【liabˋ miˊ】","def":"末尾、接近尾聲。 例如：朝晨个會議，開始該下無看著阿文，臨尾（撂尾）佢正走等來。","example":""},{"word":"臨將","pinyin":"limˇ jiongˊ","def":"臨將、即將。 例如：阿福牯來屋下坐歸晝邊仔，臨將愛走吔，正講想來招保險。","example":""},{"word":"臨時及日","pinyin":"limˇ siiˇ kib ngidˋ","def":"臨時、事到臨頭。 例如：早無講，臨時及日正講愛註冊，錢哪有恁便？","example":""},{"word":"臨時極急（臨時及急）","pinyin":"limˇ siiˇ kid gibˋ (limˇ siiˇ kib gibˋ)","def":"匆忙之間。 例如：開會个資料愛先準備好，正毋會臨時極急尋毋得著。","example":""},{"word":"略下仔【略略仔】","pinyin":"liog ha eˋ【liog liog eˊ】","def":"偶爾，次數不多。 例如：係照厥公司个規模來講，略下仔（略略仔）蝕本（了錢），還毋會橫忒（橫核）正著。","example":""},{"word":"兩日一夜","pinyin":"liongˋ ngidˋ idˋ ia","def":"兩天一夜。 例如：這擺兩日一夜个畢業旅行，會安排去臺中東勢體驗客家文化。","example":""},{"word":"兩日仔","pinyin":"liongˋ ngidˋ eˇ【liongˋ ngidˋ eˊ】","def":"約兩天。 例如：上禮拜同你借个書還吂（毋曾）看忒（看核），加兩日仔正還你好無？","example":""},{"word":"毋多知仔","pinyin":"mˇ doˊ diˊ eˋ【mˇ doˊ diˊ eˊ】","def":"不知不覺地。 例如：看人畜細人仔異（盡）輕鬆，試著滿月正做忒（做核），毋多知仔就愛讀小學吔。","example":""},{"word":"滿坪","pinyin":"manˊ piangˇ","def":"滿地都是。 例如：冬下頭，莊下滿坪開到淰淰（滿滿）金黃色个油菜花，實在還打眼。","example":""},{"word":"吂曾至間【毋曾至間】","pinyin":"mangˇ qienˇ zii gienˊ【mˇ qienˇ zii gianˊ】","def":"還不到時候。 例如：十點正開會，你吂曾至間（毋曾至間）就去做麼个？","example":""},{"word":"面頭前","pinyin":"mien teuˇ qienˇ","def":"前面。 例如：阿雄坐在吾（𠊎）面頭前，阿美坐在吾（𠊎）後背。","example":""},{"word":"無提無防","pinyin":"moˇ tiˇ moˇ fongˇ","def":"突然。 例如：車仔駛到好好，無提無防，一隻狗仔對巷仔舂出來。","example":""},{"word":"無幾多時","pinyin":"moˇ gidˋ doˊ siiˇ【moˇ idˋ doˊ siiˇ】","def":"偶爾，不常。 例如：姐婆（外阿婆）無幾多時來，歇加幾夜仔（幾夜添）正轉（歸）哪！","example":""},{"word":"罔…","pinyin":"mongˋ...","def":"值得一試。 例如：該包牛肉乾做得買來罔嗒看啊！ 例如：這齣戲做來盡幼工，罔看哦。","example":""},{"word":"罔食","pinyin":"mongˋ siid","def":"形容食物吃起來口味尚可。 例如：無麼个菜，菜脯卵罔食！","example":""},{"word":"哪下（哪下仔）","pinyin":"nai ha (nai ha eˋ)","def":"什麼時候？ 例如：你哪下（哪下仔）正有閒，做得來同姐婆（外阿婆）个菜園𢯭牽水管無？","example":""},{"word":"哪向","pinyin":"nai hiong","def":"哪個方向？ 例如：派出所在哪向？係這向抑係該向？","example":""},{"word":"哪央時【麼个時節】","pinyin":"nai iongˊ siiˇ【maˋ ge siiˇ jiedˋ】","def":"哪段時間或哪段日期？ 例如：你敢記得哪央時（麼个時節）愛開同學會？","example":""},{"word":"另日","pinyin":"nang ngidˋ","def":"改天。 例如：今晡日無閒，另日正去。","example":""},{"word":"另擺","pinyin":"nang baiˋ","def":"下次、以後、往後。 例如：多學一種語言毋會差，另擺總會用得著。","example":""},{"word":"日把仔","pinyin":"ngidˋ baˋ eˇ【ngidˋ baˋ eˊ】","def":"一天左右。 例如：該領衫，愛過日把仔正做得好。","example":""},{"word":"日日","pinyin":"ngidˋ ngidˋ","def":"每天、天天；「年年」即每年。 例如：阿書日日打早就去運動，毋識推懶。","example":""},{"word":"月半邊仔","pinyin":"ngied ban bienˊ eˋ【ngiad ban bienˊ eˊ】","def":"月中左右。 例如：這條數，愛到月半邊仔，無就下隻月初仔，正有好收。","example":""},{"word":"月尾（月底）","pinyin":"ngied miˊ (ngied daiˋ)【ngiad miˊ】【ngiad daiˋ】","def":"月末、月尾。 例如：今晡日借个錢，愛到月尾正有好還你哦，做得無？","example":""},{"word":"月頭","pinyin":"ngied teuˇ【ngiad teuˇ】","def":"月初，每個月開始的那幾天。 例如：阿爸月頭就領月給，阿姆个月給愛到初十正有好領。","example":""},{"word":"原底（原旦）","pinyin":"ngienˇ daiˋ (ngienˇ danˋ)【ngianˇ daiˋ】【ngianˇ danˋ】","def":"舊有的，本有的。 例如：阿叔原底在台電上班，退休過（過後）在東勢開店賣咖啡。","example":""},{"word":"年下仔","pinyin":"ngienˇ haˊ eˋ【ngianˇ haˊ eˊ】","def":"接近過年的時段，約為農曆十一月底、十二月初至過年前。 例如：年下仔梅花開來當（蓋）鬧，過忒年（過核年）梅仔定著會大出。","example":""},{"word":"年尾人","pinyin":"ngienˇ miˊ nginˇ【ngianˇ miˊ nginˇ】","def":"生日在十一至十二的人；反之，生日在一至二月的人稱之「年頭人」。 例如：佢係年尾人，故所慢人一年入學。","example":""},{"word":"年頷下仔","pinyin":"ngienˇ ngabˋ haˊ eˋ【ngianˇ ngabˋ haˊ eˊ】","def":"快過年時，約為農曆十二月十五日起至過年前。 例如：年頷下仔家家屋屋都在該大拚掃。","example":""},{"word":"…外仔","pinyin":"...ngoi eˋ","def":"超過一些，大約之數，指非接近但超過底線，反之，非常接近但不超過底線則為「…邊仔」；亦指收成的作物中，不合格的部分。 例如：這個細妹仔看起來還在讀書樣仔，怕二十外仔定定。","example":""},{"word":"內肚","pinyin":"nui duˋ","def":"裡面。 例如：這批高接梨品質毋好，外皮看來靚靚，內肚做下（聚概）酪酪（綿綿）。","example":""},{"word":"曩日【弄擺】","pinyin":"nun ngidˋ【nung baiˋ】","def":"往日、以前。 例如：曩日（弄擺）係阿成拜伯公，今這下佢過身吔，下二擺換麼人拜？","example":""},{"word":"怕毋會","pinyin":"pa mˇ voi","def":"揣測語氣，或許不會。 例如：阿哥下隻月異（盡）像愛出國，怕毋會轉來（歸來）。","example":""},{"word":"棚頂","pinyin":"pangˇ dangˋ","def":"樓上或棚架上。 例如：棚頂囥等當（蓋）多阿舅頭擺做細人仔該下个玩具。","example":""},{"word":"甫甫仔","pinyin":"puˋ puˋ eˋ","def":"剛剛開始、約略之意，可用於指稱時間或程度。 例如：天正甫甫仔光，佢就去車頭坐車。","example":""},{"word":"七暗八暗（七暗八摸、七摸八暗）","pinyin":"qidˋ am badˋ am (qidˋ am badˋ moˊ、qidˋ moˊ badˋ am)","def":"太晚了，已經接近夜晚。 例如：行較（過）遽兜仔，莫行到七暗八暗還吂（毋曾）到。","example":""},{"word":"七早八早","pinyin":"qidˋ zoˋ badˋ zoˋ","def":"形容很早。 例如：佢戴（歇在）山肚，逐（每）朝晨為著赴車（車仔），七早八早就愛䟘床。","example":""},{"word":"七晝八晝","pinyin":"qidˋ zu badˋ zu","def":"太遲了，比預期時間超過太久，一般用在上午時段。 例如：七早八早就準備，舞到七晝八晝還吂（毋曾）好勢。","example":""},{"word":"千年萬年","pinyin":"qienˊ ngienˇ van ngienˇ【qienˊ ngianˇ van ngianˇ】","def":"千年萬年，形容時間很長久。 例如：希望客家个語言同文化，做得千年萬年永流傳。","example":""},{"word":"盡命仔（盡命牯）【潑命】","pinyin":"qin miang eˋ (qin miang guˋ)【pad miang】","def":"竭盡心力地、拼命地。 例如：落大雨無帶遮仔，佢盡命仔（潑命）走一路轉（歸）。","example":""},{"word":"全下（完下）","pinyin":"qionˇ ha (vonˇ ha)【vanˇ ha】","def":"全部。 例如：切好个配料全下（完下）落落下去（放下去）爆香，雪圓（圓粄仔）正會好食。","example":""},{"word":"牆頭牆角【㘝頭㘝角】","pinyin":"qiongˇ teuˇ qiongˇ gogˋ/xiongˇ teuˇ xiongˇ gogˋ【liabˋ teuˇ liabˋ gogˋ】","def":"牆頭牆角。 例如：該棟屋仔異（盡）久無人歇吔，牆頭牆角（㘝頭㘝角）都係蝲䗁絲。","example":""},{"word":"從頭到尾","pinyin":"qiungˇ teuˇ do miˊ","def":"從頭到尾、自始至終。 例如：事情係交代分佢，絕對會從頭到尾落力（盡力）做到好。","example":""},{"word":"聲聲句句","pinyin":"sangˊ sangˊ gi gi","def":"口口聲聲。 例如：佢聲聲句句講愛戒菸，到這下還係無出無處。","example":""},{"word":"成擺仔","pinyin":"sangˇ baiˋ eˇ【sangˇ baiˋ eˊ】","def":"偶爾幾次。 例如：佢係有經過這位（這仔），成擺仔會入來坐。","example":""},{"word":"成半擺仔","pinyin":"sangˇ ban baiˋ eˇ【sangˇ ban baiˋ eˊ】","def":"偶爾一次。 例如：阿梅好蹶山（跋山），成半擺仔也會湊（邀）朋友共下去露營。","example":""},{"word":"成個月仔","pinyin":"sangˇ ge ngied eˋ【sangˇ ge ngiad eˊ】","def":"大約一個月。 例如：這隻貓仔來到厥屋下成個月仔定定，規矩斯教到（教啊）當（蓋）好吔。","example":""},{"word":"成下仔","pinyin":"sangˇ ha eˋ【sangˇ ha eˊ】","def":"有時候。 例如：阿姆當（蓋）會變食，成下仔還會打芋粄來做點心。","example":""},{"word":"成時（成時仔）","pinyin":"sangˇ siiˇ (sangˇ siiˇ eˋ)","def":"有時候、偶爾。 例如：阿公成時會自家行去老人會坐尞。","example":""},{"word":"成點鐘仔","pinyin":"sangˇ diamˋ zungˊ eˋ【sangˇ diamˋ zungˊ eˊ】","def":"一個鐘頭左右。 例如：坐高鐵對臺北到臺中，成點鐘仔就到哩（吔）。","example":""},{"word":"上站仔","pinyin":"song cam eˋ【song zam eˊ】","def":"前一段日子。 例如：上站仔還有看著阿松伯，仰會好恬恬就過身吔？","example":""},{"word":"上早","pinyin":"song zoˋ","def":"稍早、早先；指很早以前，甚至是古代。 例如：上早𠊎正同你講啊忒（講啊核），你又毋記得啊。 例如：上早人，有好食就好偷笑（㖸）吔。","example":""},{"word":"樹頭下","pinyin":"su teuˇ haˊ","def":"樹下。 例如：阿琴長間（不時）同朋友在樹頭下搞份家啦飯仔。","example":""},{"word":"現之時（現時）","pinyin":"hien ziiˊ siiˇ (hien siiˇ)【hian ziiˊ siiˇ】【hian siiˇ】","def":"當今。 例如：手機仔功能盡多，現之時老嫩大細儕儕（每一個人）都離毋開佢咧（吔）！","example":""},{"word":"透長年","pinyin":"teu congˇ ngienˇ【teu congˇ ngianˇ】","def":"經年累月。 例如：佢透長年在外國做生理，淨過年掛紙正會轉（歸）臺灣。","example":""},{"word":"透日仔","pinyin":"teu ngidˋ eˇ【teu ngidˋ eˊ】","def":"整天；另例如「透夜」即為整夜之意、「透當晝」即為徹午之意。 例如：放尞日，毋好透日仔看電視、搞手機仔，愛出去運動、行行啊。","example":""},{"word":"透日透夜","pinyin":"teu ngidˋ teu ia","def":"日以繼夜。 例如：若倈仔透日透夜讀書，考著公務人員乜值啦！","example":""},{"word":"頭下碼","pinyin":"teuˇ ha maˊ","def":"當初、第一次、剛開始的時候，亦可說「頭下、起勢、初下碼」。 例如：頭下碼大家都看佢無半撇，背尾正知佢係大腳士。 例如：後生人，頭下碼尋頭路，毋好三揀四揀。","example":""},{"word":"天大光","pinyin":"tienˊ tai gongˊ","def":"天已亮，喻時間不早了。 例如：天大光還毋䟘，你想愛睡到日頭晒屎胐係無？","example":""},{"word":"往時","pinyin":"vongˊ siiˇ","def":"以往、往昔。 例如：往時醫學無恁發達，想愛壽年高無恁該（簡單）。","example":""},{"word":"屋脣屋角","pinyin":"vugˋ sunˇ vugˋ gogˋ【vugˋ siinˇ vugˋ gogˋ】","def":"房屋四周。 例如：屋脣屋角个草愛挷淨來，正毋會囥（庰）蛇哥。","example":""},{"word":"溫溫仔","pinyin":"vunˊ vunˊ eˋ【vunˊ vunˊ eˊ】","def":"隱隱地、微微的。例「心肝窟（心肝頭）溫溫仔痛」。","example":""},{"word":"四角頭","pinyin":"xi gogˋ teuˇ","def":"四周。 例如：這坵田个四角頭都有風圍，盡恬風。","example":""},{"word":"先先【先前】","pinyin":"xienˊ xienˊ【xienˊ qienˇ】","def":"初開始時。 例如：這案仔同先先（先前）講个爭差異（盡）大，敢係哪片搞差係無？","example":""},{"word":"早先（先前）【進前】","pinyin":"zoˋ xienˊ (xienˊ qienˇ)【jin qienˇ】","def":"先前。 例如：早先（進前）講个無算數，這下講个正算。","example":""},{"word":"早早","pinyin":"zoˋ zoˋ","def":"很早以前。 例如：早早就同你講過，你就毋信，這下錢分人騙淨淨愛仰結煞？","example":""},{"word":"早早仔","pinyin":"zoˋ zoˋ eˇ【zoˋ zoˋ eˊ】","def":"還早得很。 例如：佢四點就到棒球場，離比賽開始還早早仔。","example":""},{"word":"一轉首【一斡頭】","pinyin":"idˋ zonˋ suˋ【idˋ vadˋ teuˇ】","def":"馬上、隨即。 例如：頭下還看佢在這，一轉首（一斡頭）就無看著人。","example":""},{"word":"竹頭下","pinyin":"zugˋ teuˇ haˊ","def":"竹林下。 例如：竹頭下蚊仔當（蓋）多，阿姆改竹筍分蚊仔叼到（叼啊）喊毋敢。","example":""},{"word":"總係會","pinyin":"zungˋ he voi","def":"總會，總是會。 例如：食飽夜，阿爸總係會同阿姆共下去散步。","example":""},{"word":"總愛","pinyin":"zungˋ oi","def":"總要，好歹要。 例如：生理買賣總愛雙方心甘意願，正做得成。","example":""},{"word":"總會","pinyin":"zungˋ voi","def":"總會、一定會。 例如：煞猛兜仔做，總會成功。","example":""},{"word":"總下","pinyin":"zungˋ ha","def":"全部。 例如：年會到吔，屋下用毋會著个東西總下抨抨忒去（清核去）。","example":""},{"word":"一睏仔","pinyin":"idˋ kun eˋ","def":"一段不算長的時間，像打個盹的時間那麼短暫。 例如：等𠊎一下，𠊎換衫褲盡遽，一睏仔時間就換好吔！","example":""},{"word":"無日無夜","pinyin":"moˇ ngidˋ moˇ ia","def":"不分晝夜，夜以繼日。 例如：為著愛考公務人員，佢無日無夜在讀書。","example":""},{"word":"阿姆哀","pinyin":"aˊ meˊ oiˊ","def":"我的媽呀。 例如：阿姆哀，這品（項）菜仰會恁好食？","example":""},{"word":"拗蠻好","pinyin":"auˊ manˇ hoˋ","def":"相當好、蠻好，多用在正面。例「今晡日个生理拗蠻好」。","example":""},{"word":"放無哪去","pinyin":"biong moˇ naiˋ hi","def":"沒有適當處所可放置。 例如：間房忒細，買過新眠床，這頂舊个就放無哪去，愛仰結煞？","example":""},{"word":"本底【本旦】","pinyin":"bunˋ daiˋ【bunˋ danˋ】","def":"起初，原本。 例如：這事頭本底（本旦）係阿貴負責个，佢退休過後，就換阿光來接手。","example":""},{"word":"打包尾","pinyin":"daˋ bauˊ miˊ","def":"殿後；最後。 例如：阿哥參加馬拉松比賽，走到半站仔腳勼筋，故所打包尾。","example":""},{"word":"倒頭講（顛倒講）","pinyin":"do teuˇ gongˋ (dienˊ do gongˋ)","def":"說反了。 例如：你倒頭講哩（吔），應該係恁樣恁樣（恁仔恁仔）…正著。","example":""},{"word":"多少仔","pinyin":"doˊ seuˋ eˇ","def":"或多或少、一點點。 例如：這下尋頭路，多少仔愛會講英語。","example":""},{"word":"咚咚咚咚","pinyin":"dungˇ dungˇ dung dung/dungˇ dungˊ dungˋ dungˋ","def":"話多不停的樣子。 例如：佢兩儕（個人）歸路仔咚咚咚咚，直直講到屋下。","example":""},{"word":"絞到哪去","pinyin":"gau do naiˋ hi","def":"混雜到那裡去了。 例如：加十分鐘就愛下車吔，若車票絞到哪去啊？還毋較（過）遽啊揙出來。","example":""},{"word":"各各","pinyin":"gogˋ gogˋ","def":"每一個；各自。 例如：臺灣三百一十九隻（個）鄉鎮，各各都有厥特色。","example":""},{"word":"該當","pinyin":"goiˊ dongˊ","def":"應當。 例如：該當愛繳个錢，還係較（過）早一息仔（一息）繳繳啊正好。","example":""},{"word":"講啊著","pinyin":"gongˋ a doˋ","def":"一說到，一談起…。 例如：講啊著佢這儕（個）人，講三日三夜乜講毋會煞。","example":""},{"word":"講去講轉","pinyin":"gongˋ hi gongˋ zonˋ","def":"說來說去。 例如：佢還會𢱤，講去講轉就係毋去參加演講比賽。","example":""},{"word":"講就恁仔講【講斯恁仔講】","pinyin":"gongˋ qiu anˋ eˇ gongˋ【gongˋ siiˇ anˋ eˊ gongˋ】","def":"說是這麼說。 例如：選某人做村長，講就恁仔講（講斯恁仔講），佢敢有才調？","example":""},{"word":"罕得","pinyin":"hanˋ dedˋ【honˋ dedˋ】","def":"難得、不常。 例如：你罕得來，當晝㓾雞仔請你。","example":""},{"word":"還合","pinyin":"hanˇ gagˋ","def":"更…甚至。 例如：佢毋單煞猛還合知上下，當（盡）有人緣。","example":""},{"word":"還過","pinyin":"hanˇ go","def":"又，還有。 例如：團圓飯還豐沛（傪菜），有封肉、有長年菜，還過菜頭粄（蘿蔔粄）。","example":""},{"word":"行無麼个得","pinyin":"hangˇ moˇ maˋ ge dedˋ","def":"不太能走。此句式有「食無麼个得」、「走無麼个得」等，必須與動詞搭配使用。 例如：腳偏著，行無麼个得。","example":""},{"word":"起勢","pinyin":"hiˋ sii","def":"開頭、起始。 例如：這下个學生仔對讀小學起勢，就愛學英文。","example":""},{"word":"任在","pinyin":"im cai【ngim cai】","def":"任由、任憑。 例如：任在佢仰般（仰仔）解釋，厥女朋友就係毋相信。","example":""},{"word":"有麼个搭碓","pinyin":"iuˊ maˋ ge dabˋ doi","def":"有什麼意思。 例如：事情變到恁仔，這下講恁多有麼个搭碓？","example":""},{"word":"借還借","pinyin":"jia vanˇ jia","def":"借歸借。 例如：借還借，還係愛打契約。","example":""},{"word":"確實毋會差","pinyin":"kogˋ siid mˇ voi caˊ","def":"確實沒錯。 例如：人講「遠親不如近鄰」，確實毋會差！","example":""},{"word":"搣毋得好","pinyin":"medˋ mˇ dedˋ hoˋ【miedˋ mˇ dedˋ hoˋ】","def":"一直弄不好。 例如：這手機仔搣恁久還搣毋得好，𠊎看斯無效哩（吔）！","example":""},{"word":"無堵好","pinyin":"moˇ duˋ hoˋ","def":"不湊巧。 例如：恁無堵好！阿良佢歸家人出國去尞哩（吔）。","example":""},{"word":"無就","pinyin":"moˇ qiu","def":"不然的話。 例如：好得你提醒，無就壞蹄哩（吔）！","example":""},{"word":"無斯","pinyin":"moˇ siiˇ","def":"否則、不然可是…。 例如：做人毋好自私，無斯會分人嫌到臭屎。","example":""},{"word":"莫嗄","pinyin":"mog sa","def":"或然之詞，有「不然可能…」的意思。 例如：愛分人个東西先準備便，莫嗄到時毋記得。","example":""},{"word":"罔講","pinyin":"mongˋ gongˋ","def":"隨口說說。 例如：無啦！你莫忒認真，𠊎罔講定定啦！","example":""},{"word":"𠊎嗄毋知","pinyin":"ngaiˇ sa mˇ diˊ","def":"我怎會不知道！ 例如：𠊎嗄毋知！問題係愛仰般（仰仔）去做，該較（過）重要啊！","example":""},{"word":"普普仔","pinyin":"puˋ puˋ eˇ【puˋ puˋ eˊ】","def":"約略的。 例如：阿文仔搬走盡久吔，這下還普普仔知佢生來無盡高。","example":""},{"word":"親像","pinyin":"qinˊ qiong","def":"猶如，好像。 例如：佢這站仔當（蓋）無閒在該尋新屋，親像愛討餔娘（姐仔）吔哦。","example":""},{"word":"續下來","pinyin":"sa haˊ loiˇ","def":"接下來、接續著。 例如：佢講煞，續下來換你。","example":""},{"word":"成…【論…】","pinyin":"sangˇ...【nun...】","def":"大約（必須接在量詞之前），不到…。 例如：這包黃豆仔怕有成（論）斤仔恁重。","example":""},{"word":"十二月甘蔗","pinyin":"siib ngi ngied gamˊ za【siib ngi ngiad gamˊ za】","def":"十二月為甘蔗之產期，生產之甘蔗頭尾每節都很甜，藉此比喻兩頭甜（歇後語）。 例如：佢考著醫師牌仔又愛討餔娘（姐仔）吔，正經係十二月甘蔗－兩頭甜。","example":""},{"word":"十做九無成","pinyin":"siib zo giuˋ moˇ sangˇ","def":"十有九件做不成功，比喻做事不專心，沒耐心。 例如：十做九無成，做到心虛虛。","example":""},{"word":"算來","pinyin":"son loiˇ","def":"到底；算起來。 例如：你這無愛，該也無愛，算來想愛仰仔？ 例如：畢業到今，算來乜有二十年哩喲（吔喲）！","example":""},{"word":"隨在你（由在你）","pinyin":"suiˇ cai nˇ (iuˇ cai nˇ)【suiˇ cai ngˇ】【iuˇ cai ngˇ】","def":"任憑你。 例如：飯在電鑊仔項燉等，愛食毋食隨在你。","example":""},{"word":"動啊著","pinyin":"tungˊ a doˋ","def":"動輒，動不動就…。 例如：佢可能係過敏體質，動啊著就哈啾噴天。","example":""},{"word":"會知【會得知】","pinyin":"voi diˊ【voi dedˋ diˊ】","def":"怎知如何？ 例如：下禮拜考試，會知（會得知）佢準備好吂（吔無）？","example":""},{"word":"…正得","pinyin":"...zang dedˋ【...nang dedˋ】","def":"真是…，置於詞後，表示某種情狀的判定。 例如：仰會恁衰過正得，細人仔無半個愛同你講話。","example":""},{"word":"照理講","pinyin":"zeu liˊ gongˋ","def":"照道理講。 例如：照理講，佢練習恁久吔，應當（應該）當（蓋）熟吔正著。","example":""},{"word":"做會毋知（仰會毋知）","pinyin":"zo voi mˇ diˊ (ngiongˋ voi mˇ diˊ)","def":"怎會不知道呢？ 例如：做會毋知？這案仔敢毋係你負責个？","example":""},{"word":"啐啐滾","pinyin":"zud zud gunˋ","def":"狀聲詞，表驚奇、感嘆、讚嘆、嘆息之語氣。 例如：看佢食大麵食到（食啊）啐啐滾，害𠊎肚屎（肚笥）枵到（飢啊）嘰里咕嚕。","example":""},{"word":"準堵好","pinyin":"zunˋ duˋ hoˋ","def":"將就、姑且如此。 例如：準備愛收攤哩（吔），這伸个蓮霧（蒜果）準堵好賣你一百箍（個銀）啦！","example":""},{"word":"飆車","pinyin":"beuˊ caˊ","def":"飆車。 例如：後生人毋好學人飆車，當（蓋）危險。","example":""},{"word":"䃗崁","pinyin":"bogˋ kam","def":"旱地上為水土保持所築的堤防。 例如：做䃗崁、水壩愛用著當（盡）多石頭。","example":""},{"word":"鏨仔","pinyin":"cam eˋ","def":"鑿刻金石的工具。 例如：打石師傅用鏨仔在石枋鏨字。","example":""},{"word":"鏨空（鏨空仔）","pinyin":"cam kungˊ (cam kungˊ eˋ)【cam kangˊ】【cam kangˊ eˋ】","def":"以鐵鑿鑽孔。 例如：種香菇愛先摎（同）樹頭鏨空。","example":""},{"word":"鏨字","pinyin":"cam sii","def":"用鐵鑿鐫字。 例如：在石碑頂鏨字愛使暗力。","example":""},{"word":"打井","pinyin":"daˋ jiangˋ","def":"鑿井。 例如：有心打石石成磚，無心打井井無泉。（諺）","example":""},{"word":"鬥緪來","pinyin":"deu henˇ loiˇ","def":"使它緊密結合。 例如：凳仔个榫頭愛鬥緪來，正毋會搖搖。","example":""},{"word":"店亭","pinyin":"diam tinˇ","def":"騎樓，亦可說「店亭下」。 例如：佢在店亭下放兩張長凳分人坐尞。","example":""},{"word":"斷水","pinyin":"donˋ suiˋ","def":"把水阻擋起來，使它不能繼續流動。 例如：頭擺人斷水用泥，現下人斷水用紅毛泥。","example":""},{"word":"火車子【火車廂】","pinyin":"foˋ caˊ ziiˋ【foˋ caˊ xiongˊ】","def":"火車車廂。 例如：一臺火車嫲（火車頭）拖八節火車子（火車廂）。","example":""},{"word":"粉壁","pinyin":"funˋ biagˋ","def":"塗飾牆壁。 例如：頭擺人起屋，會用石灰來粉壁。","example":""},{"word":"紅青燈（紅綠燈）【青紅燈】","pinyin":"fungˇ qiangˊ denˊ (fungˇ liug denˊ)【qiangˊ fungˇ denˊ】","def":"紅綠燈。 例如：過大路愛先看紅青燈（青紅燈），青燈著正做得行。","example":""},{"word":"古蹟","pinyin":"guˋ jidˋ","def":"古蹟。 例如：這座廟係三級古蹟。","example":""},{"word":"涵空【涵仔】","pinyin":"hamˇ kungˊ【hamˇ eˋ】","def":"涵洞，道路與河道、排水溝相交會時，所預留的空間，用來通水的暗渠或暗管。 例如：涵空（涵仔）塞著哩（吔），遽啊去清淨來。","example":""},{"word":"尖車","pinyin":"jiamˊ caˊ","def":"形容車輛擁擠的狀態；硬擠上車。 例如：朝晨公車項都係淰淰（滿滿）个人，當（盡）尖車。 例如：會赴毋掣哩（吔）！無尖車做毋得！","example":""},{"word":"流籠","pinyin":"liuˇ longˇ","def":"纜車。 例如：阿婆毋敢坐貓空个流籠。","example":""},{"word":"路尾","pinyin":"lu miˊ","def":"路的終點。 例如：厥田在該路尾，你大約仔行五分鐘就會到。","example":""},{"word":"泥羹水（泥漿水）","pinyin":"naiˇ gangˊ suiˋ (naiˇ jiongˊ suiˋ)","def":"泥漿水。 例如：做大水个時節，這河壩全全係泥羹水（泥漿水）。","example":""},{"word":"白鐵（不鏽鋼）","pinyin":"pag tiedˋ (budˋ xiu gong)","def":"不鏽鋼。 例如：白鐵較（過）毋驚生鹵。","example":""},{"word":"塞車（堵車）","pinyin":"sedˋ caˊ (duˇ caˊ)","def":"塞車。 例如：連假三日，一哪仔就塞車。","example":""},{"word":"食油（㘔油）","pinyin":"siid iuˇ (saiˊ iuˇ)","def":"耗油。 例如：這臺車仔駛三十年吔，緊來緊食油，怕愛換過一臺。","example":""},{"word":"食電","pinyin":"siid tien","def":"耗電。 例如：電爐當（盡）食電，還係用電鑊仔（電煲仔）較（過）贏。","example":""},{"word":"電火楯（電線楯）【電信柱（電火柱）】","pinyin":"tien foˋ dunˋ (tien xien dunˋ)【tien xin cuˊ (tien foˋ cuˊ)】","def":"電線桿。 例如：這下電線埋在地泥下，路項異（盡）少電火楯（電信柱）哩（吔）。","example":""},{"word":"相閃","pinyin":"xiongˊ samˋ","def":"會車、錯車，兩輛車交會而過。猶言「相閃車」。 例如：該兩臺車仔相閃，無注意嗄去撞著。","example":""},{"word":"相撞仔【相舂】","pinyin":"xiongˊ cong eˋ【xiongˊ zungˊ】","def":"互撞。 例如：佢兩儕（個人）相撞仔（相舂），聽講車仔撞到綿綿，還得人驚。","example":""},{"word":"圳溝","pinyin":"zun gieuˊ","def":"水渠、溝渠。 例如：有兜人盡無道德，垃圾擲落（擳入）圳溝肚。","example":""},{"word":"壢溝（溝壢）【壢坑】","pinyin":"lagˋ gieuˊ (gieuˊ lagˋ)【lagˋ hangˊ】","def":"水溝。 例如：頭前有壢溝（壢坑），行路愛細義。","example":""},{"word":"鍬紅毛泥","pinyin":"qiauˊ fungˇ moˊ naiˇ","def":"用圓鍬攪拌水泥、細沙和水。","example":""},{"word":"鐵精","pinyin":"tiedˋ jinˊ","def":"鋼筋。","example":""},{"word":"鐵屎","pinyin":"tiedˋ siiˋ","def":"鐵屑。","example":""},{"word":"拜門口（敬門口）","pinyin":"bai munˇ heuˋ (gin munˇ heuˋ)","def":"在門口拜拜，指中元節在家中辦理普渡。 例如：七月半，阿姆會準備異（盡）多祭品拜門口。","example":""},{"word":"報喪","pinyin":"bo songˊ","def":"報喪。 例如：屋下世大人（大人儕）過身，孝子愛同親戚報喪。","example":""},{"word":"傳代","pinyin":"conˇ toi","def":"傳宗接代。 例如：阿明係單丁子，為著愛傳代，異（盡）早就結婚吔。","example":""},{"word":"抽籤卜卦","pinyin":"cuˊ qiamˊ bugˋ gua","def":"抽籤卜卦。 例如：這事業毋知做得無，來去廟項抽籤卜卦，請示一下神明。","example":""},{"word":"出丁","pinyin":"cudˋ denˊ","def":"原指會生育男孩，後喻家族人丁興旺之意。 例如：地理仙講，這屋場風水異（盡）好，會出丁。","example":""},{"word":"出桌","pinyin":"cudˋ zogˋ","def":"把菜端出桌，準備開筵。 例如：人客一到，阿公跈等就喊出桌。","example":""},{"word":"打頭陣","pinyin":"daˋ teuˇ ciin","def":"打頭陣。 例如：食飯喊𠊎打頭陣無要緊，冤家个事𠊎無插你哦！","example":""},{"word":"恩主公","pinyin":"enˊ zuˋ gungˊ","def":"一般指關公，也就是關聖帝君。 例如：恩主公係武財神，有兜店頭會服祀佢。","example":""},{"word":"訃聞","pinyin":"fu/puˊ vunˇ【fuˊ vunˇ】","def":"訃聞，報告喪事的柬帖。 例如：無看著訃聞，𠊎還係毋相信佢無在吔！","example":""},{"word":"魂魄","pinyin":"funˇ pagˋ","def":"魂魄。 例如：一日到暗嚇𠊎，早慢吾魂魄會分你收忒（收核）。","example":""},{"word":"糕盆","pinyin":"gauˊ punˇ","def":"米粄或糕疊盆，如今日的罐頭塔。 例如：家祭時，親族會送糕盆來祭拜。","example":""},{"word":"吉日","pinyin":"gidˋ ngidˋ","def":"吉日、好日子。 例如：下隻月初二係吉日，吾姆會喊媒人婆去若屋下講親。","example":""},{"word":"敬天公","pinyin":"gin tienˊ gungˊ","def":"拜天公，相同說法如「敬伯公」為以牲果敬拜土地公、「敬阿公婆」為祭拜祖先、「敬神」為祭拜神明。 例如：舊曆正月初九天公生，阿姆會準備素果敬天公。","example":""},{"word":"過年過節","pinyin":"go ngienˇ go jiedˋ【go ngianˇ go jiedˋ】","def":"逢年過節。 例如：頭擺愛等到過年過節阿姆正會打粄仔。","example":""},{"word":"講親","pinyin":"gongˋ qinˊ","def":"提親。 例如：阿爸請媒人婆去阿碌伯屋下講親。","example":""},{"word":"講四句","pinyin":"gongˋ xi gi","def":"在婚喪喜慶的場合說有韻的四句吉祥話。 例如：阿伯公个字墨盡飽，講四句隨口來。","example":""},{"word":"光明燈","pinyin":"gongˊ minˇ denˊ","def":"廟宇祈福消災點的不熄燈火。 例如：阿哥今年犯太歲，阿姆年初就同佢在廟項點光明燈。","example":""},{"word":"掛紙【掛地】","pinyin":"gua ziiˋ【gua ti】","def":"掃墓。 例如：客人在正月半過，就做得開始掛紙（掛地）哩（吔）！","example":""},{"word":"行嫁","pinyin":"hangˇ ga","def":"出嫁。 例如：這下人行嫁盡少有辦嫁妝吔。","example":""},{"word":"行香","pinyin":"hangˇ hiongˊ","def":"舉香祭拜。 例如：阿婆堵著初一、十五都會去廟項行香。","example":""},{"word":"行春","pinyin":"hangˇ cunˊ","def":"（過年後的）踏春。 例如：吾屋下人過年行春，大體會去廟項點香起福。","example":""},{"word":"起福（許福）","pinyin":"hiˋ fugˋ","def":"祈福。 例如：起福在年頭，還福在年尾。","example":""},{"word":"香公仔【掌堂个、鑾生】","pinyin":"hiongˊ gungˊ eˋ【zongˋ tongˇ ge、lanˇ senˊ】","def":"廟祝。 例如：吾公對後生就做香公仔（掌堂个）到這下。","example":""},{"word":"香火籃","pinyin":"hiongˊ foˋ lamˇ【hiongˊ foˋ namˇ】","def":"暫放靈位之籃子。 例如：今年愛上大牌尋無好日仔，將就先吊香火籃。","example":""},{"word":"好年冬","pinyin":"hoˋ ngienˇ dungˊ【hoˋ ngianˇ dungˊ】","def":"年成好、好的年歲。 例如：食空空，好年冬。（諺）","example":""},{"word":"好歪事","pinyin":"hoˋ vaiˊ sii","def":"喜事與喪事。 例如：頭擺人堵著好歪事抑係愛去遠位，大體（大概）會先看農民曆選一隻（個）良時吉日。","example":""},{"word":"祭奠","pinyin":"ji tien","def":"靈前或墓前擺設供品並祭弔死者。 例如：去靈堂祭奠个時節，愛著深色个衫褲。","example":""},{"word":"節氣","pinyin":"jiedˋ hi","def":"節氣。 例如：節氣行到三伏天，自家愛較（過）注意兜仔。","example":""},{"word":"求神託佛","pinyin":"kiuˇ siinˇ togˋ fud","def":"求神拜佛、祈請保佑。 例如：厥老公傷到當（盡）嚴重，佢一哪仔求神託佛，望佢遽啊好起來。","example":""},{"word":"開鑼","pinyin":"koiˊ loˇ","def":"開鑼，法事儀式之一。 例如：開鑼哩喲！遽遽行兼去（行前去）。","example":""},{"word":"看日仔","pinyin":"kon ngidˋ eˇ【kon ngidˋ eˋ】","def":"擇定吉日良辰。 例如：大定吔，做得看日仔哩（吔）！","example":""},{"word":"看地理","pinyin":"kon ti liˊ","def":"堪輿，看風水。 例如：看地理佢異（盡）專業，若屋下風水有問題尋佢就著哩（吔）。","example":""},{"word":"龍脈","pinyin":"liungˇ magˋ","def":"龍脈。 例如：地理先生講，厥屋下後背山龍脈當（蓋）靚，另擺子孫會出慶人（能人）。","example":""},{"word":"龍神","pinyin":"liungˇ siinˇ","def":"龍神，為客家信仰的神祇之一，奉祀於正廳神桌中央底下。 例如：吾老屋正廳个神桌下，到今都還有服祀龍神。","example":""},{"word":"老人衫","pinyin":"loˋ nginˇ samˊ","def":"壽衣。 例如：新時代个人，過身也毋使著傳統个老人衫吔。","example":""},{"word":"媒人","pinyin":"moiˇ nginˇ","def":"媒人，或針對女性稱「媒人婆」。 例如：老弟今晡日討餔娘（姐仔），係伯姆做个媒人。","example":""},{"word":"茫神仔【魔精仔、魔神仔】","pinyin":"mongˇ siinˇ eˋ【moˊ jinˊ eˋ、moˊ siinˇ eˋ】","def":"魑魅魍魎。 例如：頭擺山肚，有盡多人分茫神仔（魔精仔）牽去个傳說。","example":""},{"word":"母親節（阿姆節）","pinyin":"muˊ qinˊ jiedˋ (aˊ meˊ jiedˋ)","def":"母親節。 例如：過母親節愛真心實意感恩，毋係單淨食雞卵糕就好。","example":""},{"word":"拈籤卜卦","pinyin":"ngiamˊ qiamˊ bugˋ gua","def":"抽籤占卜吉凶。 例如：新正年頭大家異（盡）好拈籤卜卦，想看今年運數好無。","example":""},{"word":"拈籤仔","pinyin":"ngiamˊ qiamˊ eˋ","def":"本義為卜卦算命之意，後用於到廟裡抽籤求神問事之行為。 例如：事情無異（盡）順，𠊎想來去廟項拈籤仔，看哪位爭差。","example":""},{"word":"迎鬧熱","pinyin":"ngiangˇ nau ngied【ngiangˇ/iangˇ nau ngiad】","def":"迎神賽會。 例如：加兩日吾這莊迎鬧熱，來分𠊎請哦！","example":""},{"word":"入年假","pinyin":"ngib ngienˇ ga【ngib ngianˇ ga】","def":"開始進入春節假期。年假指陰曆十二月二十五到翌年正月初五，為傳說中的年獸下凡活動期間。而正月初五即為「出年假」。 例如：入年假以後，剃頭就愛起價吔。","example":""},{"word":"安太歲","pinyin":"onˊ tai soi/sui","def":"安太歲。 例如：今年肖豬个犯太歲，愛記得去安太歲哦！","example":""},{"word":"安胎","pinyin":"onˊ toiˊ","def":"安胎。 例如：歲數恁大正有身項，愛好好安胎喲！","example":""},{"word":"划龍船","pinyin":"paˇ liungˇ sonˇ","def":"划龍舟。 例如：五月節鹿港有辦划龍船比賽。","example":""},{"word":"避邪","pinyin":"pidˋ xiaˇ","def":"避邪。 例如：抹草、芙蓉、香茅這兜植物，做下做得避邪。","example":""},{"word":"普渡【渡孤】","pinyin":"puˊ tu【tu guˊ】","def":"普渡。 例如：舊曆七月該下，異（盡）多寺廟會辦普渡（渡孤）活動。","example":""},{"word":"星宿","pinyin":"senˊ xiu","def":"星宿、星座。 例如：天頂个星宿恁多，你識幾多粒？","example":""},{"word":"肖雞","pinyin":"seu gieˊ","def":"生肖屬雞。另，屬虎為「肖虎」，依此類推。 例如：今年肖雞个行大運。","example":""},{"word":"燒金","pinyin":"seuˊ gimˊ","def":"燃燒金箔紙。 例如：為著環保，這下異（盡）多人既經（已經）無燒金吔。","example":""},{"word":"食齋人","pinyin":"siid zaiˊ nginˇ","def":"吃齋唸佛的修行之人。 例如：食齋人無殺生，你莫恁仔搣佢，喊佢𢯭挷毛哪！","example":""},{"word":"跈拜","pinyin":"tenˇ bai","def":"跟著帶頭的人祭拜。 例如：房頭內个長輩帶等這恁多代人共下跈拜、燒金。","example":""},{"word":"地理先生","pinyin":"ti liˊ xinˊ sangˊ","def":"風水師、堪輿師。 例如：吾公係地理先生，專門同人看風水。","example":""},{"word":"添香油","pinyin":"tiamˊ hiongˊ iuˇ","def":"添香油錢。 例如：入廟項添香油，多多少少隨人心意。","example":""},{"word":"天公生","pinyin":"tienˊ gungˊ sangˊ","def":"玉皇大帝的生日。 例如：阿婆（阿嬤）講天公生該日愛分天公歇睏，做毋得晒衫褲。","example":""},{"word":"輓聯","pinyin":"vanˊ lienˇ","def":"輓聯。 例如：該副輓聯頂項个字，寫來異（盡）靚。","example":""},{"word":"屋場","pinyin":"vugˋ congˇ","def":"房屋的地理風水。 例如：這坎店會恁鬧熱、恁賺錢，係因為屋場好。","example":""},{"word":"新娘衫","pinyin":"xinˊ ngiongˇ samˊ","def":"新娘禮服。 例如：阿姊人瘦肢骨又竳線，新娘衫一著靚到耐毋得。","example":""},{"word":"相沖","pinyin":"xiongˊ cungˊ","def":"相剋。 例如：算命先生講佢同厥爸命底相沖，做毋得喊阿爸，愛喊阿叔。","example":""},{"word":"誦經","pinyin":"xiung ginˊ","def":"唸經。 例如：頭擺辦喪事，會請和尚來誦經。","example":""},{"word":"齋堂","pinyin":"zaiˊ tongˇ","def":"齋堂，信奉佛教之和尚、尼姑所住的庵堂。 例如：係到初一十五，佢就會去齋堂誦經祈福。","example":""},{"word":"做滿月","pinyin":"zo manˊ ngied【zo manˊ ngiad】","def":"做彌月。 例如：嬰兒仔做滿月，阿婆親身煮雞酒請人客。","example":""},{"word":"做尾牙","pinyin":"zo miˊ ngaˇ","def":"一年中最後一次做牙，在農曆十二月十六，通常擴大舉行宴請員工及顧客，並結清一年來帳目。 例如：今年公司賺異成（毋會少）錢，做尾牙該下人人都有紅包好拿。","example":""},{"word":"祖塔","pinyin":"zuˋ tabˋ","def":"供放置祖先骨罈的建築。 例如：地理先生講，吾屋下个祖塔風水異（盡）好，會出慶人（能人）。","example":""},{"word":"大生日","pinyin":"tai sangˊ ngidˋ","def":"大壽，從前客家人61歲之後，每逢有一的年齡所慶祝的生日，如61歲、71歲。 例如：阿爸按算在下隻月請人客，來摎（同）阿公做大生日。","example":""},{"word":"披麻戴孝","pinyin":"piˊ maˇ dai hau","def":"服親人喪。","example":""},{"word":"灶君爺","pinyin":"zo giunˊ iaˇ","def":"灶神。","example":""},{"word":"半截仔","pinyin":"ban jiedˋ eˇ【ban jiedˋ eˊ】","def":"指一半的部位。例「魚仔剁半截仔來」。","example":""},{"word":"板","pinyin":"banˋ","def":"座（量詞），「一座橋」會說「一板橋」。 例如：莊底个這板橋，係盡多人出錢出力起个。","example":""},{"word":"髀","pinyin":"biˋ","def":"髀（肢體一片），用於有肢體的動物上。例如「一條豬仔分四髀」。","example":""},{"word":"座","pinyin":"co","def":"座（量詞），如「三座屋」。","example":""},{"word":"齣","pinyin":"cudˋ","def":"齣（戲劇或菜色）。 例如：佢考著國家考試，八月半請人做一齣大戲來還願。","example":""},{"word":"重","pinyin":"cungˇ","def":"輩（量詞，指親戚關係）。 例如：佢大𠊎一重，故所愛喊佢阿叔。","example":""},{"word":"盞（燈）","pinyin":"zanˋ (denˊ)","def":"盞（量詞）。 例如：吾屋下較（過）慣留一盞電火，分暗轉（歸）个人感覺有火光較（過）燒暖。","example":""},{"word":"碫","pinyin":"don","def":"階（量詞）。 例如：膝頭毋好，無法度跋恁多碫樓梯吔。","example":""},{"word":"短截","pinyin":"donˋ jiedˋ","def":"短短的一段。 例如：甘蔗剁短截短截，較好喫（過好咬）。","example":""},{"word":"頓","pinyin":"dunˋ","def":"計算物品的一種單位。如「紙炮仔買兩頓轉（歸）」。","example":""},{"word":"房","pinyin":"fongˇ","def":"房（親族）。 例如：李屋分做五大房，阿太這房排第二。","example":""},{"word":"格","pinyin":"gagˋ","def":"格（量詞）。 例如：這隻拖箱仔有三格，放東西盡便利。","example":""},{"word":"莢","pinyin":"giabˋ","def":"莢（量詞），多用於計算豆類果實。例「一莢番豆」。","example":""},{"word":"管","pinyin":"gonˋ","def":"管（量詞）。 例如：對山頂透一管水下來，愛食愛洗湯就做得。","example":""},{"word":"缸","pinyin":"gongˊ","def":"缸（量詞）。 例如：今年蘿蔔仔價數便宜，故所滷加幾下缸。","example":""},{"word":"一付一當","pinyin":"idˋ fu idˋ dong","def":"一件對一件配置成組。 例如：秤仔同秤砣係一付一當个，少一項就做毋得。","example":""},{"word":"一覺目","pinyin":"idˋ gau mugˋ","def":"（睡）一覺。例如「在樹頭下睡一覺目」。","example":""},{"word":"一抓","pinyin":"idˋ zaˊ","def":"直接用手抓一束物品。如「一抓禾稈」、「一抓麵線」。","example":""},{"word":"坎","pinyin":"kamˋ","def":"間（店面）。例「一坎店」。","example":""},{"word":"桊","pinyin":"kien【kian】","def":"串（量詞）。 例如：頭擺人賣魚仔，用篾皮桊到一桊一桊仔賣。","example":""},{"word":"矻","pinyin":"kud/kid","def":"一團、一塊。例如「一矻泥團」。","example":""},{"word":"籃","pinyin":"lamˊ【lamˇ (namˇ)】","def":"籃（量詞）。 例如：厥个力頭還大，擎得起一大籃个菠麗菜（高麗菜）。","example":""},{"word":"零頭","pinyin":"langˇ teuˇ","def":"整數之後的零星數字。 例如：這兜菜總下三百空七箍，拿（提）三百就好，零頭毋使。","example":""},{"word":"㼓","pinyin":"liam/lim","def":"量詞，楊桃柑橘一瓣。 例如：洗腰仔个人，楊桃一㼓都食毋得。","example":""},{"word":"廿","pinyin":"ngiam【kiam】","def":"手掌張開後，拇指到食指之間的距離。 例如：一廿長大約二十公分。","example":""},{"word":"葩","pinyin":"paˊ","def":"盞。例「一葩電火」。","example":""},{"word":"扇","pinyin":"san","def":"扇（量詞）。例如「一扇壁」。","example":""},{"word":"成百個仔","pinyin":"sangˇ bagˋ ge eˋ","def":"大約一百個。 例如：這擺个社區運動會，學校大約成百個仔參加。","example":""},{"word":"成斤仔【論斤仔】","pinyin":"sangˇ ginˊ eˋ【nun ginˊ eˋ】","def":"一斤左右。 例如：阿舅種个番檨，逐（每）粒都成斤仔（論斤仔）重，又甜又多汁。","example":""},{"word":"少少仔","pinyin":"seuˋ seuˋ eˇ【seuˋ seuˋ eˊ】","def":"一點點。 例如：包禮少少仔，贏過失禮。","example":""},{"word":"胎","pinyin":"toiˊ","def":"胎（量詞）。 例如：屋下个狗嫲，這胎養三隻狗子。","example":""},{"word":"廂","pinyin":"xiongˊ","def":"類似於「畦」，範圍廣於華語。 例如：佢種一廂大菜（芥菜），生到當（盡）靚。","example":""},{"word":"隻把仔","pinyin":"zagˋ baˋ eˇ【zagˋ baˋ eˊ】","def":"個把個。 例如：屋下玩具一千擔，分佢隻把仔搞會仰仔？","example":""},{"word":"燭","pinyin":"zugˋ","def":"燭（燈火亮度）。 例如：一百燭个電火吊兩支落去（下去），就異（盡）光吔。","example":""},{"word":"半爛燦仔","pinyin":"ban lan can eˋ【ban lan can eˊ】","def":"只做了一半，尚未完成。 例如：今晡日事頭正做到半爛燦仔定定（定），天光日繼續做忒（做核）佢。","example":""},{"word":"半做半尞（半做尞仔）","pinyin":"ban zo ban liau (ban zo liau eˋ)","def":"一半的時間工作，一半的時間休息，比喻工作很輕鬆。 例如：佢這駁仔半做半尞，這下就等退休。","example":""},{"word":"包分人做","pinyin":"bauˊ bunˊ nginˇ zo","def":"工作讓人包辦。 例如：事頭係講做毋去，愛遽遽（共快）包分人做。","example":""},{"word":"標會仔","pinyin":"beuˊ fi eˋ","def":"互助會的標會行為。 例如：這隻月愛用著錢，𠊎愛去標會仔。","example":""},{"word":"枋模","pinyin":"biongˊ muˇ","def":"模板。 例如：頭家講：「這兜枋模載到工地，天光日起屋愛用著。」","example":""},{"word":"枋仔","pinyin":"biongˊ eˋ","def":"木板。 例如：這張書桌仔係用枋仔做个。","example":""},{"word":"磅米𥺆","pinyin":"bong miˋ cangˇ","def":"製作米香的過程。 例如：還細時節看著有人磅米𥺆，大家就會擠擠（尖尖）過去看。","example":""},{"word":"本錢","pinyin":"bunˋ qienˇ","def":"原有的資產或資本。 例如：世間敢有無本錢个生理？","example":""},{"word":"雜貨店","pinyin":"cab fo diam","def":"雜貨店。 例如：雜貨店毋單淨賣雜貨，乜賣人情味。","example":""},{"word":"值班","pinyin":"ciid banˊ","def":"輪值當班。 例如：這隻月輪著𠊎值班，會當（蓋）無閒。","example":""},{"word":"秤仔","pinyin":"ciin eˋ","def":"以前的秤重器具，外觀為一橫桿，有秤砣，以騰空秤物之重量，主要用於秤豬肉、雞隻等重量較小之物。 例如：吾屋下有一支阿公留下來个秤仔。","example":""},{"word":"坐橫桌","pinyin":"coˊ vangˇ zogˋ","def":"擔任主管職位。 例如：天光日𠊎愛去阿明个公司，恭喜佢升官坐橫桌。","example":""},{"word":"抽頭","pinyin":"cuˊ teuˇ","def":"跟賭局中的贏家分紅。 例如：開徼場（博場）个頭家，會抽頭分紅。","example":""},{"word":"出張","pinyin":"cudˋ zongˊ","def":"出差。 例如：後日，阿爸愛去臺北出張。","example":""},{"word":"打出本","pinyin":"daˋ cudˋ bunˋ","def":"倒貼。 例如：頭擺人做媒人，輒輒（登常）愛自家打出本，哪有這下做仲介恁賺錢。","example":""},{"word":"打單（買票）","pinyin":"daˋ danˊ (maiˊ peuˊ)【maiˊ peu】","def":"購票。 例如：無打單，做毋得上車。","example":""},{"word":"打毋過","pinyin":"daˋ mˇ go","def":"收支不平衡。 例如：一百斤穀个價數係無千一銀，耕種就打毋過哩（吔）。","example":""},{"word":"打馬膠【打擔仔膠】","pinyin":"daˋ maˊ gauˊ【daˋ dam eˋ gauˊ】","def":"鋪柏油。 例如：這條石粒仔路孔孔翹翹，愛打馬膠（打擔仔膠）正會好行。","example":""},{"word":"打田","pinyin":"daˋ tienˇ","def":"耕耘田地。一般指使用耕耘機做翻土、打碎、整平等工作。 例如：這下个耕種人大體用耕耘機打田，加異（盡）省工。","example":""},{"word":"打油","pinyin":"daˋ iuˇ","def":"榨油；買油。 例如：番豆、麻仔、黃豆仔，總下做得打油。","example":""},{"word":"打零工","pinyin":"daˋ langˇ gungˊ","def":"做零散且非長期的工作。 例如：尋無固定个頭路，只好暫時打零工。","example":""},{"word":"單頭","pinyin":"danˊ teuˇ","def":"單據、票據；單方面；失偶的人。 例如：兩人相吵，各有理由，故所單頭話做毋得全信。","example":""},{"word":"鬥股","pinyin":"deu guˋ","def":"出資合夥。 例如：佢兩儕（個人）鬥股，愛開一間便利商店。","example":""},{"word":"抵押品","pinyin":"diˋ abˋ pinˋ","def":"抵押品。 例如：同銀行借錢，大體會用屋仔做抵押品。","example":""},{"word":"店頭家","pinyin":"diam teuˇ gaˊ","def":"店老闆。 例如：店頭家係盡有愛心个客人，大家都當（蓋）阿腦佢。","example":""},{"word":"倒店","pinyin":"doˋ diam","def":"商家因經營不善或財務虧空而停業。 例如：景氣毋好，當（蓋）多店仔連連續續倒店。","example":""},{"word":"打酒（倒酒）","pinyin":"daˋ jiuˋ (doˋ jiuˋ)","def":"買酒。 例如：頭擺人去店仔打酒，店主會用酒提仔對大桶舀酒到細酒壼項。","example":""},{"word":"當店","pinyin":"dong diam","def":"當鋪。 例如：手扡扡仔無現金，高不將拿手錶仔去當店當。","example":""},{"word":"貯金簿（存摺）","pinyin":"du/duˋ gimˊ puˊ (sunˇ zabˋ)","def":"存摺簿。 例如：拿貯金簿同印仔去郵局領錢。","example":""},{"word":"兌換","pinyin":"dui von","def":"兌換。 例如：疫情期間，為著促進消費，做得拿一千銀去兌換三千銀振興券。","example":""},{"word":"話玲琅","pinyin":"fa linˇ longˊ","def":"拍賣、叫賣兜售。 例如：這批貨毋好銷，用話玲琅來賣看啊！","example":""},{"word":"販仔屋【販屋】","pinyin":"fan eˋ vugˋ【fan vugˋ】","def":"整批建售的成屋。 例如：販仔屋（販屋）較（過）便宜，盡驚會漏水。","example":""},{"word":"貨腳仔（貨尾、貨底）","pinyin":"fo giogˋ eˇ (fo miˊ、fo daiˋ)【fo giogˋ eˋ】","def":"餘貨。 例如：伸著一息仔（一息）貨腳仔，便宜貴賤賣賣忒去（賣賣核去）。","example":""},{"word":"伙頭軍","pinyin":"foˋ teuˇ giunˊ","def":"軍中的伙夫。 例如：頭擺做兵時節个伙頭軍係山東人，佢亼个饅頭盡好食。","example":""},{"word":"耕園耕埔","pinyin":"gangˊ ienˇ gangˊ puˊ【gangˊ ianˇ gangˊ puˊ】","def":"努力從事耕田耕埔的工作，比喻辛勤耕耘。 例如：阿安伯耕園耕埔，逐（每）日做到兩頭烏。","example":""},{"word":"交關主顧","pinyin":"gauˊ gonˊ zuˋ gu","def":"經常往來的客戶。 例如：尾牙暗晡，店頭家會辦桌請交關主顧。","example":""},{"word":"雞栖","pinyin":"gieˊ ji","def":"雞舍，雞棲息之所。 例如：阿姆講：「暗昏哩（恁暗吔），遽啊同雞仔逐轉（歸）雞栖。」","example":""},{"word":"繳納","pinyin":"gieuˋ nab","def":"繳納。 例如：逐（每）年个五月係納稅月，愛記得期限內繳納。","example":""},{"word":"割貨","pinyin":"godˋ fo","def":"批購商品（批貨）。 例如：五金行个頭家講：「店項个貨銷盡遽，下禮拜愛下南部割貨哩（吔）。」","example":""},{"word":"改田角","pinyin":"goiˋ tienˇ gogˋ","def":"用鋤頭將牛犁或耕耘機犁不到的農田角落鋤鬆。 例如：阿爸用鐵牛仔犁田，𠊎用钁頭改田角。","example":""},{"word":"改菜園","pinyin":"goiˋ coi ienˇ【goiˋ coi ianˇ】","def":"用鋤頭鬆土或除草。亦可說「改菜地」。 例如：阿華伯舊年退休哩（吔），閒亍亍，逐（每）日在菜園項改菜園。","example":""},{"word":"股","pinyin":"guˋ","def":"事物的一部分。 例如：這間公司佢有出股，係股東。","example":""},{"word":"貴參參仔","pinyin":"gui semˊ semˊ eˋ【gui semˊ semˊ eˊ】","def":"貴得很。 例如：這東西正出，還貴參參仔，等到大出該下，會較（過）便宜。","example":""},{"word":"公務員","pinyin":"gungˊ vu ienˇ【gungˊ vu ianˇ】","def":"公務員。 例如：當（蓋）多人到鄉公所申請紓困補助金，公務員搣到（搣啊）無閒洎杈。","example":""},{"word":"閒頭路","pinyin":"hanˇ teuˇ lu","def":"閒差事。 例如：𠊎做這個閒頭路，一日賺毋著麼个錢。","example":""},{"word":"蔭田","pinyin":"im tienˇ","def":"灌溉水田。 例如：水庫完工後，這所在个耕種人蔭田就較（過）方便哩（吔）。","example":""},{"word":"藥房","pinyin":"iog fongˇ","def":"藥房。 例如：疫情期間，傳統个藥房無賣嘴揞仔。","example":""},{"word":"有秤頭","pinyin":"iuˊ ciin teuˇ","def":"做生意秤足量予人；反之為「食秤頭、偷秤頭」，指偷斤減兩。 例如：做生理愛有秤頭，人客正會輒輒來交關。","example":""},{"word":"中人禮（佣金）","pinyin":"zungˊ nginˇ liˊ (iung gimˊ)","def":"佣金。 例如：中人紹介你買屋，係講有買成哩（吔），你愛分佢抽中人禮（佣金）。","example":""},{"word":"精米所【伙礱】","pinyin":"jinˊ miˋ soˋ【foˋ lungˇ】","def":"碾米廠。 例如：頭擺莊項有三間精米所（伙礱），這下伸著一間定定。","example":""},{"word":"刻印仔【割印仔】","pinyin":"kadˋ in eˋ【godˋ in eˋ】","def":"刻印章。 例如：這下刻印仔（割印仔）用機器較（過）多，手工刻（割）个較（過）少哩（吔）。","example":""},{"word":"擎钁頭【背钁頭】","pinyin":"kiaˇ giogˋ teuˇ【bi giogˋ teuˇ】","def":"肩上扛著鋤頭。 例如：阿公擎钁頭（背钁頭）去改番薯。","example":""},{"word":"契約（契字）","pinyin":"kie iogˋ (kie sii)","def":"契約。 例如：買屋仔定著愛打契約正會有保障。","example":""},{"word":"乞食頭路","pinyin":"kiedˋ siid teuˇ lu【kiadˋ siid teuˇ lu】","def":"不好的職業。 例如：做這乞食頭路，一個月賺無幾多錢，盡難過日仔。","example":""},{"word":"乞食仔","pinyin":"kiedˋ siid eˋ【kiadˋ siid eˋ】","def":"乞丐。 例如：若係日仔過得去（過仔去），麼儕（麼人）還會去做乞食仔？","example":""},{"word":"礦工","pinyin":"kongˋ gungˊ","def":"礦工。 例如：厥爸頭擺係挖石炭个礦工。","example":""},{"word":"苦力仔","pinyin":"kuˋ lid eˋ","def":"現指專門出賣勞力維生的工人。 例如：做苦力仔盡辛苦。","example":""},{"word":"零角仔【銀角仔】","pinyin":"langˇ gogˋ eˇ【ngiunˇ gogˋ eˋ】","def":"零星硬幣。 例如：這兜零角仔（銀角仔）毋罅買一支枝仔冰。","example":""},{"word":"淋尿","pinyin":"limˇ ngiau","def":"將尿加水稀釋後澆灑在菜或植物上。 例如：這片菜園昨晡日正淋尿，過加幾日仔菜正做得摘。","example":""},{"word":"落肥","pinyin":"log piˇ","def":"施肥。 例如：為著有好收成，愛落肥，果子正會結實。","example":""},{"word":"落秧（委秧仔）【掖秧仔】","pinyin":"log iongˊ (ve iongˊ eˋ)【ie iongˊ eˋ】","def":"播種，將穀子或麥子的種子撒在秧田中。 例如：天穿日過，大家都煞煞仔去落秧（掖秧仔）。","example":""},{"word":"落大價【大落價】","pinyin":"log tai ga【tai log ga】","def":"價錢狂跌。 例如：菠麗菜（高麗菜）大出，這下落大價（大落價），一粒賣無十個銀。","example":""},{"word":"賣雜細","pinyin":"mai cab ce","def":"販賣雜貨。 例如：頭前有賣雜細个店，你做得在該買愛用个東西。","example":""},{"word":"貌頭","pinyin":"mau teuˇ","def":"承包商。 例如：這貌頭个價錢公當，工程品質好，事做毋完（做毋核）。","example":""},{"word":"無價","pinyin":"moˇ ga","def":"價錢不好。 例如：今年天時好，西瓜大出，嗄無價哩（吔）。","example":""},{"word":"木匠","pinyin":"mugˋ xiong","def":"木匠。 例如：吾爸係木匠師傅，手藝當（蓋）好，房頭內个桌凳都係佢做个。","example":""},{"word":"納錢","pinyin":"nab qienˇ","def":"繳錢。 例如：便利商店盡利便，納錢、領錢都做得。","example":""},{"word":"瓦窯","pinyin":"ngaˋ ieuˇ","def":"瓦窯。 例如：這隻（個）瓦窯燒出來个杯仔特別靚。","example":""},{"word":"拈錢（籌款、晉錢）","pinyin":"ngiamˊ qienˇ (cuˇ kuanˋ、jinˋ qienˇ)","def":"募款。 例如：單身哥阿煥伯過身，莊民拈錢同佢𢯭手辦後事。","example":""},{"word":"拈便宜","pinyin":"ngiamˊ pienˇ ngiˇ","def":"撿便宜。 例如：佢當晝頭正去市場買菜，趕收攤前拈便宜。","example":""},{"word":"肥田","pinyin":"piˇ tienˇ","def":"肥沃的田；施肥於田。 例如：肥田个收成較（過）好。","example":""},{"word":"便宜值食","pinyin":"pienˇ ngiˇ dad siid","def":"物美價廉。 例如：這間店仔賣个東西便宜值食，故所生理當（蓋）好。","example":""},{"word":"贌屋","pinyin":"piog vugˋ","def":"租屋。 例如：後生人買毋起屋仔，高不將先贌屋，過幾年正來打算。","example":""},{"word":"浮財（浮錢）","pinyin":"feuˇ coiˇ (feuˇ qienˇ)","def":"可靈活運用的現金。 例如：你身項有浮財無？先借𠊎轉圜一下。","example":""},{"word":"三除四扣（七除八扣）","pinyin":"samˊ cuˇ xi kieu (qidˋ cuˇ badˋ kieu)","def":"這也扣除那也扣除，所剩無幾。 例如：車仔買啊去，月給三除四扣，逐（每）隻月伸著五千銀好使。","example":""},{"word":"千賒毋當八百現","pinyin":"qienˊ caˊ mˇ dong badˋ bagˋ hien【qienˊ caˊ mˇ dong badˋ bagˋ hian】","def":"賒帳千元不如八百現金，喻拿到實際的東西較實在。 例如：人講「千賒毋當八百現」，𠊎看你還係同這錢先收起來，莫想等較（過）好个價數正兌現。","example":""},{"word":"砂耙","pinyin":"saˊ paˇ","def":"砂耙，耙砂子的工具。 例如：去海脣搞沙仔，愛記得帶砂耙。","example":""},{"word":"生理腳","pinyin":"senˊ liˊ giogˋ","def":"生意人才，喻做生意之料子。 例如：佢係一個生理腳，無幾多年，公司就開幾下間。","example":""},{"word":"小使仔（工友）","pinyin":"seuˋ siiˋ eˇ (gungˊ iuˊ)【seuˋ siiˋ eˋ】","def":"工友。 例如：佢在這間公司做小使仔，哪位（哪跡位）喊佢，就去哪仔𢯭手。","example":""},{"word":"銷頭","pinyin":"seuˊ teuˇ","def":"銷售狀況很好。 例如：這本書異（盡）銷頭，正入貨就賣淨淨。","example":""},{"word":"銷路闊","pinyin":"seuˊ lu fadˋ","def":"銷路廣。 例如：這東西銷路闊，係因為價錢公當又好用。","example":""},{"word":"蒔田","pinyin":"sii tienˇ","def":"插秧。 例如：阿公講下禮拜愛蒔田，大家愛轉來（歸來）𢯭手。","example":""},{"word":"私胲（私伽）","pinyin":"siiˊ goiˊ (siiˊ kiaˊ)","def":"私房錢。 例如：你愛留兜仔私胲，正毋使見擺就伸手同人拿錢。","example":""},{"word":"食公家（食公家飯）","pinyin":"siid gungˊ gaˊ (siid gungˊ gaˊ fan)","def":"任公職、生活消費算公家的。 例如：食公家（食公家飯）無恁簡單，愛先通過國家个考試。","example":""},{"word":"食頭家","pinyin":"siid teuˇ gaˊ","def":"由老闆供餐。 例如：這頭路錢雖然無多，毋過三餐食頭家，算起來乜還做得。","example":""},{"word":"承勞","pinyin":"siinˇ loˇ","def":"受雇之人、員工。 例如：佢做人承勞，逐（每）日準時上下班，事頭輕鬆。","example":""},{"word":"所費","pinyin":"soˋ fi","def":"費用開支。 例如：𠊎逐（每）隻月个所費無異（蓋）多，這兜錢罅用哩（吔）。","example":""},{"word":"收據","pinyin":"suˊ giˋ","def":"收據。 例如：阿哥拿收據去公司申請出差个所費。","example":""},{"word":"贖轉來【贖歸來】","pinyin":"sug zonˋ loiˇ【sug guiˊ loiˇ】","def":"贖回來。 例如：佢去當店當金仔，毋知幾時正有錢好贖轉來（贖歸來）？","example":""},{"word":"水貨","pinyin":"suiˋ fo","def":"未經代理商進口的貨物。 例如：水貨較（過）便宜，毋過無保障。","example":""},{"word":"送紅包","pinyin":"sung fungˇ bauˊ","def":"送紅包，有賄賂之意。 例如：貌頭承包工程若係靠送紅包得標，係犯罪个行為。","example":""},{"word":"送大閹雞","pinyin":"sung tai iamˊ gieˊ","def":"送厚禮。 例如：聽講頭擺厥公做土地代書个時節，屋下長透（不時）有人來送大閹雞。","example":""},{"word":"鬆頭","pinyin":"sungˊ teuˇ","def":"手頭寬鬆，指的是經濟狀況。 例如：厥屋下盡鬆頭，難怪衫褲著到恁派頭。","example":""},{"word":"大賣（批發）","pinyin":"tai mai (piˊ fadˋ)","def":"批發。 例如：阿乾哥專門做大賣，店仔開幾下間，怕賺不少錢哩喲（吔喲）。","example":""},{"word":"攤仔【擔仔】","pinyin":"tanˊ eˋ【damˊ eˋ】","def":"做生意的攤子。 例如：佢放尞日去夜市擺攤仔（擔仔）。","example":""},{"word":"剃頭","pinyin":"ti teuˇ","def":"理髮。 例如：你頭那毛長吔，好去剃頭哩（吔）。","example":""},{"word":"糶米","pinyin":"tiau miˋ","def":"賣米。「糶穀」則為賣穀。 例如：俗話講：「會算毋會除，糶米換番薯。」","example":""},{"word":"電料【電火料】","pinyin":"tien liau【tien foˋ liau】","def":"電費。「電話料」就是指電話費。 例如：熱天開冷氣，電料（電火料）加當（蓋）多。","example":""},{"word":"討債","pinyin":"toˋ zai","def":"討債。 例如：阿叔欠人錢，逐（每）日囥（庰）在屋肚，驚人來討債。","example":""},{"word":"通譯","pinyin":"tungˊ id","def":"翻譯，把一種語言信息轉變成另一種語言信息。 例如：佢英文當（蓋）好，不時有外國人請佢做通譯。","example":""},{"word":"洩藥仔（打藥仔）【射藥仔】","pinyin":"xied iog eˋ (daˋ iog eˋ)【sa iog eˋ】","def":"噴灑農藥。 例如：這頭樹仔發蟲，正洩藥仔（射藥仔），愛圍起來毋好分人行兼去（行前去）。","example":""},{"word":"新腳士【新腳仔】","pinyin":"xinˊ giogˋ sii【xinˊ giogˋ eˋ】","def":"新手。 例如：佢係新腳士（新腳仔），有兜事情來去可能較（過）毋知，你愛多教佢哦。","example":""},{"word":"矺底金","pinyin":"zagˋ daiˋ gimˊ","def":"押金。 例如：你贌這間屋愛先納一隻月个矺底金。","example":""},{"word":"招保險【邀保險】","pinyin":"zeuˊ boˋ hiamˋ【ieuˊ boˋ hiamˋ】","def":"拉保險。 例如：佢正畢業，毋知愛做麼个事，就跈厥姊去招保險（邀保險）。","example":""},{"word":"招會仔【邀會仔】","pinyin":"zeuˊ fi eˋ【ieuˊ fi eˋ】","def":"邀人加入錢會（互助會）。 例如：頭擺厥姆招會仔（邀會仔），賺兜仔利子正同佢三兄弟畜大。","example":""},{"word":"做件仔","pinyin":"zo kien eˋ【zo kian eˋ】","def":"論件計酬。 例如：這頭路係做件仔个，有做正有錢，無像一般人上班領月給。","example":""},{"word":"做小工","pinyin":"zo seuˋ gungˊ","def":"打零工。 例如：佢一哪仔去同人做小工，來畜大一群大細。","example":""},{"word":"捉","pinyin":"zogˋ","def":"買；向人要來的。例「去市場項捉雞仔」、「捉狗子轉來（歸來）畜」。","example":""},{"word":"載貨","pinyin":"zoi fo","def":"載送貨物。 例如：用這臺車仔載貨當（蓋）利便。","example":""},{"word":"轉夜","pinyin":"zonˋ ia","def":"傍晚放工回家，相同結構「轉晝」即為中午放工回家。 例如：老妹在門口等阿爸轉夜食飯。","example":""},{"word":"轉早夜","pinyin":"zonˋ zoˋ ia","def":"提早收工回家休息。 例如：田打好哩（吔）！轉早夜來去街項逛逛啊！看有恁多麼个好買。","example":""},{"word":"掌夜","pinyin":"zongˋ ia","def":"值夜。 例如：今晡日輪到你掌夜，莫睡忒（睡核）哦！","example":""},{"word":"掌牛","pinyin":"zongˋ ngiuˇ","def":"牧牛或看管牛，牧童即稱「掌牛哥仔」。 例如：阿爸還細時節，緊掌牛緊看書。","example":""},{"word":"裝潢","pinyin":"zongˊ fongˇ","def":"裝潢。 例如：佢係做裝潢个。","example":""},{"word":"做泥水","pinyin":"zo naiˇ suiˋ","def":"做砌磚、蓋瓦等建築工程的工匠。 例如：厥老弟做泥水，這下做到異（盡）出面。","example":""},{"word":"豬寮","pinyin":"zuˊ liauˇ","def":"養豬場。 例如：還吂（毋曾）行到豬寮，就鼻著臭屎噴天。","example":""},{"word":"中人","pinyin":"zungˊ nginˇ","def":"買賣仲介或居中調停、作證的人。 例如：阿明這下做中人，專門在該賣屋仔。","example":""},{"word":"舂錢","pinyin":"zungˊ qienˇ","def":"急著籌錢。 例如：細人仔發病仔（發病），佢急到一哪仔去舂錢。","example":""},{"word":"磅","pinyin":"bongˇ","def":"磅秤，現在常用的秤重器具，外觀為平面方形，會有指針指向數字，主要為接觸秤物之重量。 例如：你同這包米放在磅項，看有幾重？","example":""},{"word":"撥貨","pinyin":"badˋ fo","def":"短暫的商借貨品。 例如：店項个東西賣忒（賣核）吔，先去隔壁撥貨過來賣。","example":""},{"word":"使钁頭","pinyin":"siiˋ giogˋ teuˇ","def":"操作、使用鋤頭。 例如：看你使钁頭个勢面（格式），一廂番薯兩下半就改好吔。","example":""},{"word":"砂鐐【鐐鏟】","pinyin":"saˊ liauˊ【liauˊ canˋ】","def":"挖掘沙土的工具，即圓鍬。 例如：老弟用砂鐐（鐐鏟）同花盆个泥舖平來。","example":""},{"word":"作棋仔（行棋仔）","pinyin":"zogˋ kiˇ eˋ (hangˇ kiˇ eˋ)","def":"下棋。 例如：社區舉辦作棋仔比賽，餳著盡多人來看。","example":""},{"word":"挷索仔【挷大索】","pinyin":"bangˊ sogˋ eˇ【bangˊ tai sogˋ】","def":"拉繩子；拔河。 例如：挷索仔（挷大索）愛聽隊長个指揮，大家共下出力挷正會贏。","example":""},{"word":"變把戲","pinyin":"bien baˋ hi","def":"表演雜耍特技。 例如：大人細子都當（蓋）好看人變把戲。","example":""},{"word":"編輯","pinyin":"bienˊ xib","def":"編輯。 例如：學校个客語教材係先生自家編輯个。","example":""},{"word":"歕篴仔（吹篴仔）","pinyin":"punˊ tag eˋ (coiˊ tag eˋ)","def":"吹嗩吶。 例如：後生毋學，到老吔正來學歕篴仔，敢毋會忒慢？","example":""},{"word":"傳仔","pinyin":"con eˋ","def":"傳記，小說。「傳仔書」則表示歷史章回小說或凡記述完整能成體系的故事或小說。 例如：老弟對歷史當（蓋）有興趣，不時看名人个傳仔。","example":""},{"word":"打採茶","pinyin":"daˋ caiˋ caˇ","def":"演採茶戲。 例如：頭擺客家莊收冬過後，逐（每）個莊頭都會輪等請戲班來打採茶。","example":""},{"word":"打拳頭","pinyin":"daˋ kienˇ teuˇ【daˋ kianˇ teuˇ】","def":"打拳。 例如：吾爸頭擺當（蓋）好去大廟坪看人打拳頭。","example":""},{"word":"打麻雀","pinyin":"daˋ maˇ jiogˋ","def":"打麻將。 例如：聽講行棋仔（作棋仔）、打麻雀做得預防老人痴呆症。","example":""},{"word":"輟學","pinyin":"dodˋ hog","def":"輟學。 例如：學生仔愛照時間去學校讀書，做毋得儘採輟學。","example":""},{"word":"和山歌","pinyin":"foˇ sanˊ goˊ","def":"山歌相唱和。 例如：阿婆（阿嬤）當（蓋）好尋阿公來和山歌，兩儕（個人）見擺就唱到當（蓋）鬥搭。","example":""},{"word":"份家啦飯仔（搞家啦飯仔）","pinyin":"fun gaˊ laˊ fan eˋ (gauˋ gaˊ laˊ fan eˋ)","def":"玩家家酒的遊戲。 例如：做細人仔該下，同學時時會來吾屋下份家啦飯仔。","example":""},{"word":"跈人毋著","pinyin":"tenˇ nginˇ mˇ doˋ","def":"跟不上別人。 例如：係無較（過）煞猛兜仔，功課會跈人毋著。","example":""},{"word":"劍","pinyin":"giam","def":"劍。 例如：羅漢師會打拳頭，也會擎劍表演。","example":""},{"word":"灌土狗仔","pinyin":"gon tuˋ gieuˋ eˇ","def":"灌螻蛄、灌蟋蟀。 例如：學校放學，有兜同學會拿銅笐仔裝水去灌土狗仔。","example":""},{"word":"鬼畫符","pinyin":"guiˋ fa puˇ","def":"本意畫符咒，後喻亂寫、亂畫。 例如：寫這麼个字，像鬼畫符樣仔，麼人看得識。","example":""},{"word":"戲園","pinyin":"hi ienˇ【hi ianˇ】","def":"戲院。 例如：頭擺街路尾有一間戲園，逐（每）暗晡會做電影。","example":""},{"word":"戲劇","pinyin":"hi kiagˋ【hi kiugˋ】","def":"戲劇。 例如：劇本寫來好，戲班會做，戲劇就好看。","example":""},{"word":"牽聲","pinyin":"kienˊ sangˊ【kianˊ sangˊ】","def":"特意拉長語尾聲調，常用在朗誦詩文時，表現其韻味。 例如：該隻朗讀比賽打頭名个細妹仔當（蓋）會牽聲，唸到當（蓋）好聽。","example":""},{"word":"腔頭","pinyin":"kiongˊ teuˇ","def":"腔調。 例如：臺灣个客家話有幾下種腔頭。","example":""},{"word":"球勺仔【球拍仔】","pinyin":"kiuˇ sog eˋ【kiuˇ pogˋ eˋ】","def":"球拍。 例如：球勺仔（球拍仔）無帶著，愛仰仔打網球？","example":""},{"word":"賭人尋（囥人尋、揞眯摸目仔）【庰人尋、揞目庰窟】","pinyin":"duˋ nginˇ qimˇ (kong nginˇ qimˇ、emˇ miˊ miaˊ mugˋ eˇ)【biang nginˇ qimˇ、emˊ mugˋ biang fudˋ】","def":"捉迷藏、躲貓貓。 例如：老屋當（蓋）闊，細人仔當（蓋）好在該搞賭人尋（庰人尋）。","example":""},{"word":"蠟筆","pinyin":"lab bidˋ","def":"蠟筆。 例如：低年級个畫圖比賽，有規定愛用蠟筆。","example":""},{"word":"遶山","pinyin":"lauˊ sanˊ","def":"遠足；遊覽山景。「遶」，來回走動、繞行或是散步。 例如：這下人大體坐車出門尞，當（蓋）少遶山看光景哩（吔）！","example":""},{"word":"遶山花","pinyin":"lauˊ sanˊ faˊ","def":"遊覽山光景色。 例如：佢兩公婆退休過後，透日遶山花，還樂線哦。","example":""},{"word":"遶街","pinyin":"lauˊ gieˊ【lauˊ giaiˊ】","def":"逛街。 例如：𠊎日時頭上班，愛暗晡頭正有閒好遶街。","example":""},{"word":"錄取率","pinyin":"liug qiˋ lid","def":"錄取率。 例如：高等考試个錄取率當（蓋）低，愛考著無恁該（無恁簡單）。","example":""},{"word":"老古人言","pinyin":"loˋ guˋ nginˇ ngienˇ【loˋ guˋ nginˇ ngianˇ】","def":"俗話、古諺。 例如：老古人言講：「食人一口，還人一斗。」（諺）","example":""},{"word":"落第","pinyin":"log ti","def":"留級；落榜。 例如：佢這擺考試又考來毋好，驚怕會落第，愛讀加一年。","example":""},{"word":"墨斗","pinyin":"med deuˋ","def":"墨斗，木匠用來彈打直線的器具。 例如：木匠愛將樹筒劈畀直，會先用墨斗彈線。","example":""},{"word":"墨盤","pinyin":"med panˇ","def":"硯臺。 例如：頭擺寫毛筆字，較（過）會用著墨盤。","example":""},{"word":"網站","pinyin":"miongˋ zam","def":"網站。 例如：這下个人當（蓋）時行在網站項看新聞。","example":""},{"word":"揇腰跤","pinyin":"namˋ ieuˊ gauˊ","def":"摔跤遊戲。 例如：還細時節，𠊎當（蓋）好搞揇腰跤。","example":""},{"word":"師傅話","pinyin":"siiˊ fu fa","def":"行業術語；歇後語。 例如：師傅話講：「菜籃㧡水，無採工。」","example":""},{"word":"大腳士【大跤】","pinyin":"tai giogˋ sii【tai kaˇ】","def":"大牌、要角。 例如：佢係這隻（個）活動个大腳士（大跤），無佢斯麻煩哩（吔）。","example":""}],"高級":[{"word":"愕愕然","pinyin":"ngogˋ ngogˋ ienˇ","def":"因突發、不明究理之狀態下而產生的愕然現象。","example":"50年前做兵个朋友，玄玄風來尋𠊎，𠊎愕愕然一下，險險認佢毋出。"},{"word":"鴨公聲","pinyin":"abˋ gungˊ sangˊ","def":"低沉的聲音。 例如：佢變鴨公聲，故所電話中，𠊎無聽識係厥聲。","example":""},{"word":"鴨嫲蹄","pinyin":"abˋ maˇ taiˇ","def":"扁平足。","example":""},{"word":"暗病","pinyin":"am piang","def":"隱疾，表面看不出來的病。 例如：佢毋知有麼个暗病，看起來精神無異好。","example":""},{"word":"ㄤ鼻","pinyin":"ang pi","def":"因鼻塞而發音不清楚的現象。 例如：佢寒著，講話ㄤ鼻ㄤ鼻聽毋清楚。","example":""},{"word":"疤疤","pinyin":"baˊ baˊ","def":"形容有疤痕。 例如：佢前一駁仔發長薯仔，不時緊挳佢，搣到面疤疤。 例如：佢出車禍，車仔鑪到疤疤，愛花異多錢來整哦。","example":""},{"word":"百年歸壽","pinyin":"bagˋ ngienˇ guiˊ su","def":"人死，因不忍或忌諱直言死亡，而改以委婉之辭，代指年老自然死亡。","example":""},{"word":"跛啊跛仔","pinyin":"baiˊ a baiˊ eˋ","def":"走路一跛一跛的。 例如：佢昨晡日分車仔撞著，這下行路跛啊跛仔。","example":""},{"word":"半陰陽（半閹陽）","pinyin":"ban imˊ iongˇ (ban iamˊ iongˇ)","def":"陰陽人，男人有女性特徵或女人有男性特徵的人。","example":""},{"word":"瘢跡（疤跡）【疤】","pinyin":"banˊ jiagˋ (baˊ jiagˋ)【baˊ】","def":"疤痕。 例如：佢頭擺分火熝著个瘢跡到今還在。","example":""},{"word":"挷皮扯瘌","pinyin":"bangˊ piˇ caˋ ladˋ","def":"皮膚緊縮撕裂傷口的疼痛，常用以喻經濟拮据。 例如：這隻月又愛繳學費，又愛納屋稅，強強會挷皮扯瘌。","example":""},{"word":"挷想","pinyin":"bangˊ xiongˋ","def":"指青少年短時間脛骨變長，身體明顯長高的生長狀況。 例如：恁久無看著阿明，有較挷想哩喲。","example":""},{"word":"飽𩜰𩜰仔","pinyin":"bauˋ 例如：佢這下目花花、腳浮浮，毋好過監佢食酒。 例如：佢腳浮浮愛轉吔，較留佢乜留毋核。","example":""},{"word":"過目關","pinyin":"go mugˋ guanˊ","def":"人的視力變老花的過程。 例如：阿姆這駁仔過目關，連桊針就無恁該。","example":""},{"word":"光目仔","pinyin":"gongˊ mugˋ eˇ","def":"視覺正常的人。 例如：光目仔學人目聚聚仔，麼个派頭？","example":""},{"word":"剮爛皮","pinyin":"guaˋ lan piˇ","def":"刮破了皮。","example":""},{"word":"貢膿","pinyin":"gung nungˇ","def":"膚肉因潰爛而起膿包。","example":""},{"word":"貢疘（貢甲）","pinyin":"gung gongˊ (gung gabˋ)","def":"指甲邊發炎，甲溝炎。","example":""},{"word":"下膈","pinyin":"haˊ gagˋ","def":"腹腔。「上膈」為胸腔，以橫膈膜為界。","example":""},{"word":"脝脝","pinyin":"hang hang","def":"浮腫貌。 例如：你恁久敢有較肥？係無仰看起來脝脝樣仔。","example":""},{"word":"脝乳【皮肨】","pinyin":"hang nen【piˇ pong】","def":"嬰兒肥、嬰兒吃奶期的肥胖。 例如：厥孫仔脝乳脝乳，看起來盡得人惜。","example":""},{"word":"脝水","pinyin":"hang suiˋ","def":"水腫，「脝水脝水」意指皮膚浮腫貌。 例如：佢昨暗晡睡目前食忒多茶，朝晨起來有一息仔脝水。","example":""},{"word":"行血","pinyin":"hangˇ hiedˋ","def":"血液流通。","example":""},{"word":"行月仔（來洗）","pinyin":"hangˇ ngied eˋ (loiˇ seˋ)【hangˇ ngiad eˋ】","def":"月經來潮。","example":""},{"word":"行通","pinyin":"hangˇ tungˊ","def":"委婉語，指解小便或大便。","example":""},{"word":"耗耗【熇熇】","pinyin":"hauˊ hauˊ【hogˋ hogˋ】","def":"生物體因缺乏水分而乾燥枯軟、憔悴的樣子。 例如：阿姆个面分風交到耗耗。","example":""},{"word":"氣急急仔（氣呼呼仔）","pinyin":"hi gibˋ gibˋ eˇ (hi fu fu eˋ)","def":"呼吸急促的樣子。 例如：走相逐過後，大家走到氣急急仔。","example":""},{"word":"起膘","pinyin":"hiˋ peu","def":"皮膚因磨擦過度或燙傷而生水泡。 例如：著新鞋行路行忒久，腳底當會起膘。","example":""},{"word":"起病","pinyin":"hiˋ piang","def":"發病。 例如：佢著肝癌，舊年就起病吔。","example":""},{"word":"起胮（起𱱿）","pinyin":"hiˋ pongˇ (hiˋ pug)","def":"因蟲咬或過敏引起的紅腫。 例如：你个目珠皮仰起胮樣仔，係贅贅抑係分蚊仔叼著？","example":""},{"word":"起瘻","pinyin":"hiˋ leuˇ","def":"起包，身體受碰撞而腫起。 例如：佢睡睡啊碾到眠床下，額頭搉著起瘻，看起來異嚴重。","example":""},{"word":"堅皮","pinyin":"gienˊ piˇ","def":"傷口表皮變乾，尚未到結痂的程度。","example":""},{"word":"翕出汗","pinyin":"hibˋ cudˋ hon","def":"悶蓋使之出汗，袪除風邪。 例如：老妹寒著，睡在眠床項用被掩塞塞，身體翕出汗就較爭哩！","example":""},{"word":"血漬漬仔","pinyin":"hiedˋ jid jid eˋ","def":"血流很多且集中的樣子。 例如：阿姆無細義切著手，歸隻砧枋血漬漬仔。","example":""},{"word":"血流血濯","pinyin":"hiedˋ liuˇ hiedˋ cog","def":"血流不止的樣子。 例如：車禍現場，看啊去歸大片血流血濯，實在還得人驚。","example":""},{"word":"收口","pinyin":"suˊ heuˋ","def":"傷口密合。 例如：阿清叔糖尿病，見跌啊著，傷口就毋會收口。","example":""},{"word":"好帶（縛帶）","pinyin":"hoˊ daiˋ (piog dai)","def":"繃帶。 例如：厥手纏等好帶，食飯盡毋方便。","example":""},{"word":"糠耳","pinyin":"hongˊ ngiˋ","def":"耳道較乾燥者。","example":""},{"word":"扡胲","pinyin":"iaˋ goiˊ","def":"喉嚨對食物過敏的反應，引申為遇到困難，難以解決。 例如：芋仔係無煮熟，食著會扡胲。 例如：喊佢毋好騎車仔去，硬愛，今這下跌倒還愛𠊎照顧，實在還扡胲唷！","example":""},{"word":"扡扡","pinyin":"iaˋ iaˋ","def":"喉嚨對食物過敏的感覺。 例如：若芋荷無熻熟還恁生，分人食到喉嗹頭扡扡。","example":""},{"word":"腰拑背吊","pinyin":"ieuˊ kiamˇ boi diau","def":"形容勞累得站不直的樣子。 例如：吾爸蒔田盡辛苦，輒常蒔到腰拑背吊，伸腰就毋直。","example":""},{"word":"腰拑拑仔","pinyin":"ieuˊ kiamˇ kiamˇ eˋ","def":"因腰部痠痛而挺不直的樣子。 例如：佢腰拑拑仔行路，行路看地泥下。","example":""},{"word":"哊乳","pinyin":"iogˋ nen","def":"小孩吐奶。 例如：嬰兒仔較會有哊乳个情形，做爺哀个愛多注意。","example":""},{"word":"侷著【𤸱著】","pinyin":"kiug doˋ【habˋ doˋ】","def":"嗆到。 例如：麼人个香水噴到恁多，會害人侷著。","example":""},{"word":"酷著【𤸱著】","pinyin":"kug doˋ【habˋ doˋ】","def":"（受水或辛辣味）嗆到。","example":""},{"word":"空心肚","pinyin":"kungˊ ximˊ duˋ","def":"空腹。 例如：身體檢查前做毋得食東西，愛空心肚。 例如：空心肚食朳仔會胃糟糟。","example":""},{"word":"落瀉【捋瀉】","pinyin":"lag xia【lod xia】","def":"吃壞肚子，引申為落荒而逃。 例如：拳頭師鄭先生，平常時當肯逞強，吂知上臺無三分鐘，就分人打到落瀉。","example":""},{"word":"老蛤蟆","pinyin":"loˋ haˇ maˇ","def":"侏儒，也可喻擅於算計的人。 例如：該儕人斯老蛤蟆倒彎窿，你愛較細義兜仔哦！","example":""},{"word":"落肉","pinyin":"log ngiugˋ","def":"瘦弱下去。 例如：佢手術過後，一日一日落肉，厥子女盡愁慮。","example":""},{"word":"落月死","pinyin":"log ngied xiˋ","def":"因生產而死。","example":""},{"word":"擂藥仔","pinyin":"luiˇ iog eˋ","def":"研藥。","example":""},{"word":"毋知人","pinyin":"mˇ diˊ nginˇ","def":"不省人事，亦可說「毋知人事」。 例如：阿伯行到半路仔搵落地泥下，續下來就毋知人吔！","example":""},{"word":"峨嵋峎","pinyin":"ngoˇ miˇ gien","def":"小腿前中央骨高突處，即脛骨。","example":""},{"word":"面兜兜","pinyin":"mien deuˊ deuˊ","def":"臉形圓潤下巴肥厚的樣子。 例如：佢面兜兜，看起來盡有福相。","example":""},{"word":"面紅濟炸","pinyin":"mien fungˇ ji za","def":"顏面充血，臉色通紅的樣子。 例如：佢運動正轉來，這下面紅濟炸，看起來當悿樣仔。 例如：看著該隻緣投个細阿哥仔緊看人，阿鳳敗勢到面紅濟炸。","example":""},{"word":"面靠靠","pinyin":"mien ko ko","def":"顴骨高突。 例如：佢本來面兜兜，這站仔瘦啊去，嗄變到面靠靠，強強會認毋識。","example":""},{"word":"面壢青（面呷青）","pinyin":"mien lagˋ/lag qiangˊ (mien gab qiangˊ)","def":"面色發青，受驚嚇或身體極不舒服狀。 例如：分老弟恁樣嚇啊去，佢面壢青，歸身仔緊顫。","example":""},{"word":"面劣劣","pinyin":"mien lodˋ lodˋ","def":"臉頰削瘦、下巴瘦長的模樣。 例如：聽人講面劣劣个人，較無福氣。","example":""},{"word":"面藕藕","pinyin":"mien ngiauˊ ngiauˊ","def":"臉部皮膚上有許多洞洞的樣子，如蓮藕之切面。","example":""},{"word":"毛腳仔","pinyin":"moˊ giogˋ eˇ","def":"靠近後腦勺的毛髮下緣；剩餘的毛。 例如：佢去剪頭那毛，毛腳仔無修正，當難看。 例如：刨豬腳，該毛腳仔愛挾淨來，正毋會刺人个嘴。","example":""},{"word":"脢盎仔","pinyin":"moiˇ angˊ eˋ","def":"太陽穴。","example":""},{"word":"目睡鳥","pinyin":"mugˋ soi diauˊ","def":"稱愛打瞌睡的人，瞌睡蟲。 例如：目睡鳥自有飛來蟲。（諺） 例如：這隻目睡鳥，上課緊啄目睡。","example":""},{"word":"目絲絲仔","pinyin":"mugˋ xiˊ xiˊ eˋ","def":"眼瞇瞇看不清的樣子。 例如：你睡目吂醒係無？仰還目絲絲仔？","example":""},{"word":"目瞨","pinyin":"mugˋ puˋ","def":"近失明狀態，但未完全失明，眼睛尚能感受到光影，只是不清晰，亦可說「瞨目」。 例如：聽講目瞨个人耳公盡利，敢有影？","example":""},{"word":"悶肚【肚屎臌臌】","pinyin":"mun duˋ【duˋ siiˋ guˋ guˋ】","def":"吃了東西消化不好，肚子感覺不舒服。 例如：恁寒个天時，當晝个便當冷泧泧仔，食到人悶肚悶肚。","example":""},{"word":"㸐著","pinyin":"nadˋ doˋ","def":"燙到、灼傷。可用於高溫燙傷或毛毛蟲灼傷等。例如「分鑊仔㸐著」、「分㸐角蟲㸐著」。","example":""},{"word":"淰肚淰肚【脹肚脹肚】","pinyin":"nemˋ duˋ nemˋ duˋ【zong duˋ zong duˋ】","def":"肚子飽脹的樣子。","example":""},{"word":"牙腳浮浮","pinyin":"ngaˇ giogˋ feuˇ feuˇ/ngaˇ giogˋ peuˇ peuˇ","def":"因睡眠不足引起的燥熱，而有牙根虛浮不實的感覺。 例如：這幾下日牙腳浮浮，暗晡頭全睡毋得。","example":""},{"word":"牙射射仔","pinyin":"ngaˇ sa sa eˋ","def":"暴牙，牙齒尖銳突出的樣子。 例如：阿麗本旦牙射射仔，背尾佢去整牙齒，這下牙齒變到當靚。","example":""},{"word":"硬鉸","pinyin":"ngang gau","def":"長期維持一個姿勢，造成關節不靈活。 例如：你係緊毋停動，手腳就會緊硬鉸。","example":""},{"word":"硬胲硬胲","pinyin":"ngang goiˊ ngang goiˊ","def":"喉嚨肌肉僵硬。 例如：𠊎今晡日䟘床試著喉嗹頭硬胲硬胲，盡毋鬆爽。","example":""},{"word":"耳聾頂碓","pinyin":"ngiˋ lungˊ dangˋ doi","def":"形容聽覺不靈光，亦可說「耳聾蒂碓」。 例如：人老吔，毋係耳聾頂碓，就係目珠花花。","example":""},{"word":"發赤目【發紅熱目】","pinyin":"bodˋ cagˋ mugˋ【bodˋ fungˇ ngiad mugˋ】","def":"急性結膜炎。","example":""},{"word":"攝楔","pinyin":"ngiabˋ xiabˋ","def":"胃口不好、食量不大，有時會引申為挑食、個性吝嗇。 例如：這隻細人仔異攝楔，厥姆當愁佢毋會大。 例如：老妹嘴斗毋好，食東西當攝楔。","example":""},{"word":"尿滯滯仔（發尿積）","pinyin":"ngiau ce ce eˋ (bodˋ ngiau jidˋ)","def":"頻尿。 例如：𠊎茶食忒多，歸日仔尿滯滯仔。","example":""},{"word":"尿汀汀仔","pinyin":"ngiau din din eˋ","def":"本指尿液滴不乾淨，常喻指狼狽不堪。 例如：這頭路無恁該做，搣到尿汀汀仔。","example":""},{"word":"尿水","pinyin":"ngiau suiˋ","def":"尿；表示不可能或全都沒有的否定意思。 例如：早就喊你食飯，恁慢正來，還想愛食麼个好菜？尿水有啦！","example":""},{"word":"藕面仔","pinyin":"ngiauˊ mien eˋ","def":"顏面不平整的人。","example":""},{"word":"殗弱","pinyin":"ngiem ngiog","def":"身體虛弱。 例如：𠊎看等阿姆一日一日殗弱下去，異毋盼得。","example":""},{"word":"眼茫鼻花","pinyin":"ngienˋ mongˇ pi faˊ","def":"頭昏眼花。例如「分球仔擲啊著眼茫鼻花」、「分日頭晒到眼茫鼻花」。","example":""},{"word":"人老","pinyin":"nginˇ loˋ","def":"不直接說人死亡，而婉轉說人老逝去的意思，用以指稱死亡，是一種諱稱。 例如：屋下係有人老，做毋得吵鬧摎飲酒作樂。","example":""},{"word":"人豚仔","pinyin":"nginˇ tunˇ eˋ","def":"指正在發育，食量很大的人。 例如：佢這下係人豚仔，食飯愛食兩三碗正有飽。","example":""},{"word":"怩惄","pinyin":"nid nag","def":"短暫刺痛感。 例如：吾膝頭怩惄一下，敢怕係偏著吔。","example":""},{"word":"腦囟","pinyin":"noˋ xin","def":"腦門、囟門。","example":""},{"word":"膿頭","pinyin":"nungˇ teuˇ","def":"瘡疔深層底部的膿，引申為帶頭起鬨的人。","example":""},{"word":"屙澇屎","pinyin":"oˊ lau siiˋ","def":"拉肚子。","example":""},{"word":"嗀嗀滾","pinyin":"og og gunˋ","def":"受到刺激從喉部往外連續嘔吐的聲音。 例如：食著無萋个東西，佢在便所肚嘔到嗀嗀滾。","example":""},{"word":"抰背囊","pinyin":"ongˋ boi nongˇ","def":"兩物背向頂著，指將背部向後舒展，像背後被物頂住般；「抰著背囊」則是指背部受傷。 例如：背穀包前愛先抰背囊正毋會傷著。","example":""},{"word":"抰著","pinyin":"ongˋ doˋ","def":"被硬物頂傷。 例如：肚屎分該鋼架抰著，痛到流目汁。","example":""},{"word":"潑血","pinyin":"pad hiedˋ","def":"大量出血，即血崩。","example":""},{"word":"潑汗","pinyin":"pad hon","def":"大量發汗。 例如：佢退作个藥仔食落去，就緊潑汗。","example":""},{"word":"敗腎","pinyin":"pai siin","def":"腎臟機能衰弱，現多半用以俗稱男子性能力不佳。","example":""},{"word":"鼻ㄤㄤ仔","pinyin":"pi ang ang eˋ","def":"鼻音重、鼻塞時發出的聲音。 例如：佢寒著吂好，講話鼻ㄤㄤ仔。","example":""},{"word":"鼻槽槽仔","pinyin":"pi coˇ coˇ eˋ","def":"形容鼻孔朝上的樣子，朝天鼻。 例如：阿明生成就鼻槽槽仔，該係無奈何个！","example":""},{"word":"鼻流鼻串","pinyin":"pi liuˇ pi con","def":"猛流鼻涕。 例如：細人仔鼻流鼻串，愛拿衛生紙摎佢捽淨來。","example":""},{"word":"鼻臊","pinyin":"pi soˊ","def":"聞味道。 例如：你仰恁會鼻臊，連煮雞酒你就知。","example":""},{"word":"鼻水濫泔","pinyin":"pi suiˋ lamˇ gamˊ/gam","def":"形容鼻水流得很多的樣子。 例如：看佢鼻水濫泔，怕寒著吔。","example":""},{"word":"病膩膩仔","pinyin":"piang ne ne eˋ","def":"病懨懨的樣
