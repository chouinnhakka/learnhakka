<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>設定中</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font:18px/1.6 system-ui,sans-serif;color:#395886;background:#F0F3FA}</style></head>
<body><p>正在把這台設備設成「不計入瀏覽數據」（3/3）…</p>
<script>
/* 周穎自己的設備：這個網站以後不記錄瀏覽，之前記到的也刪掉；接著跳到下一個網站，最後回到城堡 */
(function(){
  var NEXT='';
  var h={}; location.hash.slice(1).split('&').forEach(function(p){ var i=p.indexOf('='); if(i>0) h[p.slice(0,i)]=decodeURIComponent(p.slice(i+1)); });
  try{ history.replaceState(null,'',location.pathname); }catch(e){}
  var back=/^https:\/\/chouinn-site\.chouinn-moie\.workers\.dev\//.test(h.back||'')?h.back:'https://chouinn-site.chouinn-moie.workers.dev/cal/';
  var v='';
  try{ localStorage.setItem('chouinn-owner','1'); v=localStorage.getItem('chouinn-vid');
    if(!v||!/^[\w-]{8,40}$/.test(v)){ v=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now().toString(36)).replace(/[^\w-]/g,''); localStorage.setItem('chouinn-vid',v); } }catch(e){}
  function go(){ location.replace(NEXT ? NEXT+'#t='+encodeURIComponent(h.t||'')+'&back='+encodeURIComponent(back) : back+(back.indexOf('?')<0?'?':'&')+'stats-me=ok'); }
  var done=false; function fin(){ if(!done){ done=true; go(); } } setTimeout(fin,4000);
  if(h.t){ fetch('https://chouinn-tools.chouinn-moie.workers.dev/stats/api',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+h.t},body:JSON.stringify({fn:'ownerPing',args:[v]})}).then(fin,fin); } else fin();
})();
</script></body></html>
